<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>1 sheep 2 sheep 3 sheep</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #06060e; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: default;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen"></canvas></div>
<script>
'use strict';

/* ============================================================
   1 sheep 2 sheep 3 sheep
   a small game about not sleeping
   ============================================================ */

const W = 320, H = 180;

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;
ctx.imageSmoothingEnabled = false;

function fitCanvas() {
  const ww = window.innerWidth, wh = window.innerHeight;
  let scale = Math.min(ww / W, wh / H);
  if (scale >= 1) scale = Math.max(1, Math.floor(scale));
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

/* ---------------- utils ---------------- */

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }

// deterministic-ish rng for visual jitter
let _seed = 1337;
function srand(s) { _seed = s >>> 0; }
function rnd() {
  _seed = (_seed * 1664525 + 1013904223) >>> 0;
  return _seed / 4294967296;
}
function rndi(n) { return Math.floor(rnd() * n); }
function chance(p) { return Math.random() < p; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randi(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ---------------- pixel font (5x7, all caps) ---------------- */

};

const CHAR_W = 6, CHAR_H = 8; // 5x7 glyph + 1px spacing

// pre-rendered tinted glyph atlases, cached per color
const _fontCache = {};
function fontAtlas(color) {
  if (_fontCache[color]) return _fontCache[color];
  const keys = Object.keys(GLYPHS);
  const c = document.createElement('canvas');
  c.width = keys.length * CHAR_W; c.height = CHAR_H;
  const g = c.getContext('2d');
  g.fillStyle = color;
  keys.forEach((k, i) => {
    const rows = GLYPHS[k];
    for (let y = 0; y < 7; y++)
      for (let x = 0; x < 5; x++)
        if (rows[y][x] === '1') g.fillRect(i * CHAR_W + x, y, 1, 1);
  });
  const atlas = { canvas: c, index: {} };
  keys.forEach((k, i) => atlas.index[k] = i);
  _fontCache[color] = atlas;
  return atlas;
}

function drawText(text, x, y, color, opts) {
  opts = opts || {};
  const atlas = fontAtlas(color);
  const s = String(text).toUpperCase();
  let cx = x;
  if (opts.align === 'center') cx = Math.round(x - s.length * CHAR_W / 2);
  else if (opts.align === 'right') cx = Math.round(x - s.length * CHAR_W);
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '\n') continue;
    const idx = atlas.index[ch];
    if (idx !== undefined && ch !== ' ') {
      let yy = y;
      if (opts.wavy) yy = y + Math.round(Math.sin(T * 4 + i * 0.7) * 1.5);
      ctx.drawImage(atlas.canvas, idx * CHAR_W, 0, CHAR_W, CHAR_H, cx, yy, CHAR_W, CHAR_H);
    }
    cx += CHAR_W;
  }
  return cx;
}

function wrapText(text, maxChars) {
  const words = String(text).split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    if (line.length === 0) line = w;
    else if ((line + ' ' + w).length <= maxChars) line += ' ' + w;
    else { lines.push(line); line = w; }
  }
  if (line) lines.push(line);
  return lines;
}

/* ---------------- input ---------------- */

const keys = {};        // held
let pressed = {};       // pressed this frame
let anyPressed = false;

const KEYMAP = {
  'ArrowLeft':'left','KeyA':'left',
  'ArrowRight':'right','KeyD':'right',
  'ArrowUp':'up','KeyW':'up',
  'ArrowDown':'down','KeyS':'down',
  'Space':'action','KeyZ':'action','Enter':'action',
  'KeyX':'alt',
  'KeyM':'mute',
};

window.addEventListener('keydown', (e) => {
  if (['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter'].includes(e.code)) e.preventDefault();
  const k = KEYMAP[e.code];
  audioBoot();
  if (e.repeat) return;
  anyPressed = true;
  if (!k) return;
  keys[k] = true;
  pressed[k] = true;
  if (k === 'mute') toggleMute();
});
window.addEventListener('keyup', (e) => {
  const k = KEYMAP[e.code];
  if (k) keys[k] = false;
});

// pointer: tapping/clicking counts as action (for the counting scene / advancing text)
let pointerDown = false;
let pointerClick = null; // {x, y} in buffer coords, valid for one frame
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  audioBoot();
  anyPressed = true;
  pressed['action'] = true;
  keys['action'] = true;
  pointerDown = true;
  const r = canvas.getBoundingClientRect();
  pointerClick = {
    x: (e.clientX - r.left) / r.width * W,
    y: (e.clientY - r.top) / r.height * H,
  };
});
window.addEventListener('pointerup', () => { keys['action'] = false; pointerDown = false; });

/* ---------------- audio ---------------- */

let AC = null, master = null, muted = false;
try { muted = localStorage.getItem('sheep_muted') === '1'; } catch (e) {}
let ambienceNodes = [];

function audioBoot() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 0.5;
    master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('sheep_muted', muted ? '1' : '0'); } catch (e) {}
  if (master) master.gain.setTargetAtTime(muted ? 0 : 0.5, AC.currentTime, 0.02);
}

let _noiseBuf = null;
function noiseBuf() {
  if (_noiseBuf) return _noiseBuf;
  _noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
  const d = _noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return _noiseBuf;
}

// soft landing thump, optionally delayed
function sfxToof(delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0);
  const src = AC.createBufferSource(); src.buffer = noiseBuf();
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
  const g = AC.createGain();
  env(g, t, 0.004, 0.14, 0.02, 0.05, 0.04, t + 0.09);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.1);
}

// the splash. used at 43 and in the memory. nowhere else.
function sfxSplash() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf();
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(1200, t);
  lp.frequency.exponentialRampToValueAtTime(300, t + 0.35);
  const g = AC.createGain();
  env(g, t, 0.01, 0.12, 0.1, 0.05, 0.2, t + 0.38);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.4);
  const o = AC.createOscillator(), og = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(300, t);
  o.frequency.exponentialRampToValueAtTime(150, t + 0.3);
  env(og, t, 0.02, 0.08, 0.1, 0.04, 0.15, t + 0.32);
  o.connect(og); og.connect(master);
  o.start(t); o.stop(t + 0.34);
}

// dead button click for the jam
function sfxDeadClick() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf();
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 250;
  const g = AC.createGain();
  env(g, t, 0.002, 0.09, 0.01, 0.03, 0.02, t + 0.05);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.06);
}

// quiet unison saw cluster. only at 77.
function sfxSawSwell() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.08, t + 1.5);
  g.gain.linearRampToValueAtTime(0.0001, t + 2.6);
  g.connect(master);
  for (const det of [-14, -5, 0, 7, 13]) {
    const o = AC.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = 65; o.detune.value = det;
    o.connect(g); o.start(t); o.stop(t + 2.7);
  }
}

// knock (two taps); answer variant pitched down
function sfxKnock(down) {
  if (!AC || muted) return;
  const t0 = AC.currentTime;
  for (const dt of [0, 0.25]) {
    const t = t0 + dt;
    const src = AC.createBufferSource(); src.buffer = noiseBuf();
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = down ? 180 : 500;
    const g = AC.createGain();
    env(g, t, 0.002, down ? 0.22 : 0.16, 0.02, 0.04, 0.03, t + 0.08);
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start(t); src.stop(t + 0.09);
  }
}

// long wrong bleat: octave down, swells then hard-cuts
function sfxWrongBaa() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const dur = 1.5;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.2, t + dur - 0.05);
  g.gain.setValueAtTime(0.0001, t + dur);
  lp.connect(g); g.connect(master);
  for (const det of [0, 9]) {
    const o = AC.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(110 + det, t);
    const lfo = AC.createOscillator(), lg = AC.createGain();
    lfo.type = 'sine'; lfo.frequency.value = 5; lg.gain.value = 7;
    lfo.connect(lg); lg.connect(o.frequency);
    o.connect(lp);
    o.start(t); o.stop(t + dur);
    lfo.start(t); lfo.stop(t + dur);
  }
}

// wet, short, wrong. used when It feeds.
function sfxSplat() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf();
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(900, t);
  lp.frequency.exponentialRampToValueAtTime(200, t + 0.16);
  const g = AC.createGain();
  env(g, t, 0.003, 0.22, 0.04, 0.08, 0.08, t + 0.2);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.22);
  // a bleat that cuts off mid-note
  const o = AC.createOscillator(), og = AC.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(240, t);
  o.frequency.linearRampToValueAtTime(180, t + 0.12);
  og.gain.setValueAtTime(0.12, t);
  og.gain.setValueAtTime(0.0001, t + 0.12);
  o.connect(og); og.connect(master);
  o.start(t); o.stop(t + 0.13);
}

// deliberately ugly little alarm
function sfxAlarm() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'square'; o.frequency.value = 880;
  const lfo = AC.createOscillator(), lg = AC.createGain();
  lfo.type = 'square'; lfo.frequency.value = 8; lg.gain.value = 0.5;
  const gg = AC.createGain(); gg.gain.value = 0.04;
  lfo.connect(lg); lg.connect(gg.gain);
  env(g, t, 0.01, 0.06, 0.3, 0.05, 0.2, t + 1.1);
  o.connect(gg); gg.connect(g); g.connect(master);
  o.start(t); o.stop(t + 1.1); lfo.start(t); lfo.stop(t + 1.1);
}

// scale the current ambience bus (0..1)
function setAmbienceGain(mult) {
  if (!AC || !ambienceNodes.length) return;
  const g = ambienceNodes[0];
  if (g && g.gain) g.gain.setTargetAtTime(0.06 * mult, AC.currentTime, 0.4);
}

function env(gainNode, t0, a, peak, d, sustain, r, end) {
  const g = gainNode.gain;
  g.setValueAtTime(0.0001, t0);
  g.linearRampToValueAtTime(peak, t0 + a);
  g.linearRampToValueAtTime(sustain, t0 + a + d);
  g.setValueAtTime(sustain, end - r);
  g.linearRampToValueAtTime(0.0001, end);
}

// short counting blip; pitch drifts with the count
function sfxBlip(count) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle';
  const base = 440 + (count % 8) * 30 + Math.min(count, 100) * 1.5;
  o.frequency.setValueAtTime(base, t);
  o.frequency.exponentialRampToValueAtTime(base * 1.4, t + 0.05);
  env(g, t, 0.005, 0.25, 0.03, 0.08, 0.05, t + 0.14);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.16);
}

// wrong/creepy variant of the blip
function sfxBlipWrong() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(90, t + 0.25);
  env(g, t, 0.005, 0.18, 0.05, 0.06, 0.1, t + 0.3);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.32);
}

// sheep bleat: two detuned saws, pitch wobble down, lowpass
function sfxBaa(pitch, dark) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const dur = dark ? 0.9 : 0.45;
  const f0 = (pitch || 1) * (dark ? 110 : 220);
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = dark ? 500 : 1200;
  const g = AC.createGain();
  env(g, t, 0.03, dark ? 0.16 : 0.12, 0.1, 0.08, 0.15, t + dur);
  lp.connect(g); g.connect(master);
  for (const det of [0, 8]) {
    const o = AC.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0 + det, t);
    // bleat wobble
    const lfo = AC.createOscillator(), lg = AC.createGain();
    lfo.type = 'sine'; lfo.frequency.value = dark ? 6 : 9;
    lg.gain.value = f0 * 0.06;
    lfo.connect(lg); lg.connect(o.frequency);
    o.frequency.linearRampToValueAtTime(f0 * (dark ? 0.7 : 0.85) + det, t + dur);
    o.connect(lp);
    o.start(t); o.stop(t + dur);
    lfo.start(t); lfo.stop(t + dur);
  }
}

// low double thump
function sfxHeartbeat() {
  if (!AC || muted) return;
  const t0 = AC.currentTime;
  for (const dt of [0, 0.22]) {
    const t = t0 + dt;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(55, t);
    o.frequency.exponentialRampToValueAtTime(35, t + 0.12);
    env(g, t, 0.005, dt === 0 ? 0.5 : 0.35, 0.05, 0.1, 0.08, t + 0.18);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.2);
  }
}

function sfxChime(good) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const notes = good ? [523.25, 659.25, 783.99] : [523.25, 493.88, 466.16];
  notes.forEach((f, i) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    const st = t + i * 0.12;
    env(g, st, 0.01, 0.15, 0.1, 0.06, 0.3, st + 0.6);
    o.connect(g); g.connect(master);
    o.start(st); o.stop(st + 0.62);
  });
}

function sfxStep() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(90 + Math.random() * 30, t);
  env(g, t, 0.002, 0.06, 0.02, 0.02, 0.03, t + 0.06);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.07);
}

function sfxSchoolBell() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'square';
  o.frequency.value = 1760;
  const lfo = AC.createOscillator(), lg = AC.createGain();
  lfo.type = 'square'; lfo.frequency.value = 16;
  lg.gain.value = 0.5;
  lfo.connect(lg);
  const gg = AC.createGain(); gg.gain.value = 0.05;
  lg.connect(gg.gain);
  env(g, t, 0.01, 0.08, 0.2, 0.05, 0.4, t + 1.4);
  o.connect(gg); gg.connect(g); g.connect(master);
  o.start(t); o.stop(t + 1.4); lfo.start(t); lfo.stop(t + 1.4);
}

function stopAmbience() {
  for (const n of ambienceNodes) { try { n.stop ? n.stop() : n.disconnect(); } catch (e) {} }
  ambienceNodes = [];
}

// scene ambiences: 'night' soft drone, 'dream' hollow detuned drone + hum, 'day' bright thin tone, 'none'
function setAmbience(kind) {
  if (!AC) { pendingAmbience = kind; return; }
  pendingAmbience = null;
  stopAmbience();
  if (muted && kind !== 'none') { pendingAmbience = kind; }
  if (kind === 'none') return;
  const t = AC.currentTime;
  const g = AC.createGain();
  g.gain.value = 0;
  g.gain.setTargetAtTime(kind === 'dream' ? 0.10 : 0.06, t, 2.0);
  g.connect(master);
  ambienceNodes.push(g);
  const make = (type, freq, det) => {
    const o = AC.createOscillator();

/* ---------------- It ----------------
   The seeker. A tall, wrong-jointed figure made of the creek's black
   static. The body never stops flickering. The eyes never move at all. */
function drawIt(x, groundY, h, opts) {
  opts = opts || {};
  const fr = Math.floor(T * 20) * 131;
  const top = groundY - h;
  const c1 = '#141018', c2 = '#25202c', c3 = '#3a3444';
  // silhouette: hunched head, long torso, arms past the knees, thin legs
  const D = 52000 * (opts.faint ? 0.5 : 1);
  for (let yy = 0; yy < 5; yy++) for (let xx = -3; xx <= 3; xx++) blobPix(xx, yy + 1);
  function blobPix(bx, by) {
    let hh = (bx * 374761 + by * 668265 + fr) & 0xffff;
    hh = (hh * 48271) % 65537;
    if (hh < D) {
      ctx.fillStyle = hh < D * 0.2 ? c3 : (hh < D * 0.6 ? c2 : c1);
      ctx.fillRect(Math.round(x + bx), Math.round(top + by), 1, 1);
    }

  const sway = Math.sin(T * 1.7) > 0 ? 1 : 0;
  // neck + torso
  for (let by = 6; by < h * 0.58; by++)
    for (let bx = -2 - (by > 10 ? 1 : 0); bx <= 2; bx++) blobPix(bx + sway, by);
  // arms: too long
  for (let by = 8; by < h * 0.86; by++) {
    blobPix(-5 + (by > h * 0.5 ? -1 : 0) + sway, by);
    blobPix(-4 + sway, by);
    blobPix(4 + sway, by);
    blobPix(5 + (by > h * 0.5 ? 1 : 0) + sway, by);
  }
  // legs
  for (let by = Math.floor(h * 0.58); by < h; by++) {
    blobPix(-2, by); blobPix(-1, by);
    blobPix(1 + sway, by); blobPix(2 + sway, by);
  }
  // drip
  if (Math.floor(T * 8) % 3 === 0) {
    ctx.fillStyle = c2;
    ctx.fillRect(Math.round(x - 5), Math.round(groundY - h * 0.1), 1, 2);
  }

  if (opts.eyes !== false) {

}

function hexLerp(a, b, t) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];

  const c = pa.map((v, i) => Math.round(lerp(v, pb[i], t)));

/* ---------------- textbox / monologue system ---------------- */

const textbox = {
  queue: [],       // [{text, who, then}]
  current: null,
  shown: 0,        // chars revealed
  timer: 0,
  done: false,
  onEmpty: null,
};

function say(lines, onEmpty) {
  if (!Array.isArray(lines)) lines = [lines];
  for (const l of lines) textbox.queue.push(typeof l === 'string' ? { text: l } : l);
  if (onEmpty) textbox.onEmpty = onEmpty;
  if (!textbox.current) nextLine();
}
function nextLine() {
  textbox.current = textbox.queue.shift() || null;
  textbox.shown = 0; textbox.timer = 0; textbox.done = false;
  if (!textbox.current && textbox.onEmpty) {
    const f = textbox.onEmpty; textbox.onEmpty = null; f();
  }
}
function textboxActive() { return !!textbox.current; }
function clearText() { textbox.queue = []; textbox.current = null; textbox.onEmpty = null; }

function updateTextbox(dt) {
  if (!textbox.current) return;
  const speed = 28; // chars per second
  if (!textbox.done) {
    textbox.timer += dt * speed;
    const n = Math.floor(textbox.timer);
    if (n > textbox.shown) {
      textbox.shown = n;
      if (textbox.shown >= textbox.current.text.length) {
        textbox.shown = textbox.current.text.length;
        textbox.done = true;
      }
    }
    if (pressed['action']) { textbox.shown = textbox.current.text.length; textbox.done = true; pressed['action'] = false; }
  } else if (pressed['action']) {
    pressed['action'] = false;
    if (textbox.current.then) textbox.current.then();
    nextLine();
  }
}

function drawTextbox() {
  if (!textbox.current) return;
  const t = textbox.current;
  const lines = wrapText(t.text, 48);
  const boxH = 14 + lines.length * 9;
  const y0 = H - boxH - 4;
  ctx.fillStyle = 'rgba(6,6,14,0.92)';
  ctx.fillRect(4, y0, W - 8, boxH);
  ctx.strokeStyle = t.color || '#8a86a0';
  ctx.lineWidth = 1;
  ctx.strokeRect(4.5, y0 + 0.5, W - 9, boxH - 1);
  if (t.who) drawText(t.who, 10, y0 - 4, t.color || '#c9c4d8');
  let shown = textbox.shown;
  let yy = y0 + 7;
  for (const ln of lines) {
    const take = clamp(shown, 0, ln.length);
    drawText(ln.slice(0, take), 10, yy, t.color || '#e8e4ec');
    shown -= ln.length + 1;
    yy += 9;
    if (shown <= 0) break;
  }
  if (textbox.done && Math.floor(T * 2) % 2 === 0) drawText('>', W - 14, y0 + boxH - 10, '#8a86a0');
}

/* ---------------- fade / scene machine ---------------- */

let T = 0;                 // global time (seconds)
let scene = null;
let sceneTime = 0;
let fade = { v: 1, target: 0, speed: 1.2, onDone: null };

let sceneName = '';
function goto_(name, arg) {
  fade.target = 1; fade.speed = 2.2;
  fade.onDone = () => {
    clearText();
    scene = SCENES[name];
    sceneName = name;
    sceneTime = 0;
    if (scene.enter) scene.enter(arg);
    fade.target = 0; fade.speed = 1.4;
  };
}
function hardGoto(name, arg) {
  clearText();
  scene = SCENES[name];
  sceneName = name;
  sceneTime = 0;
  if (scene.enter) scene.enter(arg);
}

function updateFade(dt) {
  if (fade.v < fade.target) { fade.v = Math.min(fade.target, fade.v + dt * fade.speed); }
  else if (fade.v > fade.target) { fade.v = Math.max(fade.target, fade.v - dt * fade.speed); }
  if (fade.v === 1 && fade.onDone) { const f = fade.onDone; fade.onDone = null; f(); }
}
function drawFade() {
  if (fade.v > 0.001) {
    ctx.fillStyle = 'rgba(3,3,8,' + fade.v.toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

  if (mv !== 0) {
    wk.facing = mv;
    wk.x = clamp(wk.x + mv * wk.speed * dt, 4, wk.len - 12);
    wk.frame += dt * 8;
    wk.stepT += dt;
    if (wk.stepT > 0.28) { wk.stepT = 0; sfxStep(); }
  } else wk.frame = 0;
  wk.cam = clamp(wk.x - W / 2 + 4, 0, Math.max(0, wk.len - W));
  for (const tr of wk.triggers) {
    if (!tr.fired && wk.x >= tr.x) { tr.fired = true; tr.run(wk); }
  }
  if (pressed['action']) {
    for (const th of wk.things) {
      if (!th.used && Math.abs((th.x + (th.w || 8) / 2) - (wk.x + 4)) < 14) {
        pressed['action'] = false;
        if (th.once) th.used = true;
        th.onInteract(wk, th);
        break;
      }
    }
  }
}

function nearThing(wk) {
  for (const th of wk.things) {
    if (!th.used && Math.abs((th.x + (th.w || 8) / 2) - (wk.x + 4)) < 14) return th;
  }
  return null;
}

function drawInteractHint(wk, color) {
  const th = nearThing(wk);
  if (th && !textboxActive()) {
    const sx = Math.round(th.x - wk.cam + (th.w || 8) / 2);
    if (Math.floor(T * 2) % 2 === 0) drawText('?', sx - 2, wk.groundHintY || 40, color || '#e8e4ec');
    if (th.label) drawText(th.label, sx, (wk.groundHintY || 40) - 10, color || '#8a86a0', { align: 'center' });
  }
}

/* ---------------- counting scene machinery ----------------
   One button. Each press sends a sheep over the fence and advances the
   count. A scripted event table keyed on the count runs the escalation. */

const counting = {
  jumpers: [],      // {t, spd, dir, dark, faceless, bell, scale, shade, silent, stopAt}
  watchers: [],     // accumulated non-exiting sheep {x, y, gx, gy}
  shake: 0,
  wobble: 0,
  flashText: null, flashT: 0, flashDur: 3.2,
  stareOnFence: 0,  // timer: a sheep sits on the fence staring
  headTurnT: 0,     // 77 beat
  jamDead: 0,
  stallT: 0,        // 99 input stall
  ghostOn: false,
  hideNumT: 0,
  redFlashT: 0,     // one-blink red sheep at the skip
  pressPop: 0,      // numeral squash-pop
  pressAnimT: 0,    // for the 66+ freeze rule
  hbT: 0,           // heartbeat loop timer
  fenceDrift: 0,
  starsGone: 0,
  finaleT: -1,
  night2: false,
  eyesBtnT: 0,      // night2: OPEN YOUR EYES fade-in
  ended: false,
};

function flash(text, dur) {
  counting.flashText = text;
  counting.flashT = dur || 3.2;
  counting.flashDur = dur || 3.2;
}

function sheepArc(t, dir) {
  // parabola over the fence; dir 1 = right-to-left (normal), -1 reversed
  const x = dir === -1 ? lerp(-30, W + 20, t) : lerp(W + 20, -30, t);
  const ground = 128;
  const jump = Math.sin(Math.PI * clamp((t - 0.25) / 0.5, 0, 1)) * 34;
  return { x, y: ground - 13 - jump };
}

// scaled text for the big numeral
function drawTextBig(text, x, y, color, scale, squashY) {
  const atlas = fontAtlas(color);
  const s = String(text).toUpperCase();
  const sy = scale * (squashY || 1);
  let cx = Math.round(x - s.length * CHAR_W * scale / 2);
  const yy = Math.round(y + (scale - sy) * CHAR_H);
  for (let i = 0; i < s.length; i++) {
    const idx = atlas.index[s[i]];
    if (idx !== undefined && s[i] !== ' ')
      ctx.drawImage(atlas.canvas, idx * CHAR_W, 0, CHAR_W, CHAR_H, cx, yy, Math.round(CHAR_W * scale), Math.round(CHAR_H * sy));
    cx += Math.round(CHAR_W * scale);
  }
}

/* ---- counting: the ritual (night one) ---- */

function resetCounting(night2) {
  G.count = 0;
  Object.assign(counting, {
    jumpers: [], watchers: [], shake: 0, wobble: 0,
    flashText: null, flashT: 0,
    stareOnFence: 0, headTurnT: 0, jamDead: 0, stallT: 0,
    ghostOn: false, hideNumT: 0, redFlashT: 0, itFlashT: 0, pressPop: 0, pressAnimT: 9,
    hbT: 0, fenceDrift: 0, starsGone: 0, finaleT: -1,
    night2: !!night2, eyesBtnT: 0, ended: false,
  });
  counting.stars = [];
  srand(night2 ? 77 : 7);
  for (let i = 0; i < 46; i++) counting.stars.push({ x: rndi(W), y: rndi(90), tw: rnd() * 6, stubborn: i < 8, gone: false });
}

// heartbeat interval by count; 0 = off
function hbInterval(v) {
  if (counting.night2) return 0;
  if (v >= 91) return (0.65 - (v - 91) * 0.014) * (0.9 + Math.random() * 0.25);
  if (v >= 84) return 0.75;
  if (v >= 50) return 0.9;
  return 0;
}

function spawnJumper(opts) {
  counting.jumpers.push(Object.assign({
    t: 0, spd: 0.85 + Math.random() * 0.2, dir: 1,
    dark: false, faceless: false, bell: false, silent: false,
    scale: 1, shade: 0, stopAt: -1,
  }, opts || {}));
}

// night-one press: all escalation lives here
function countPress() {
  const v = G.count;
  counting.pressPop = 1;
  counting.pressAnimT = 0;

  // THE JAM (88): three dead presses, then a lurch to 91
  if (v === 88 && counting.jamDead < 3) {
    counting.jamDead++;
    sfxDeadClick();
    counting.shake = 0.3;
    if (counting.jamDead === 1) flash(SCRIPT.c88, 3.5);
    return;
  }

  // increments
  let nv, spawn = 1;
  if (v === 42) { nv = 44; }                        // THE SKIP
  else if (v === 84 || v === 86) { nv = v + 2; spawn = 2; }
  else if (v === 88) { nv = 91; spawn = 2; }         // the lurch
  else if (v >= 91 && v <= 97) { nv = v + 2; spawn = 2; }
  else if (v >= 60 && v <= 65) { nv = v + 1; spawn = randi(2, 3); }
  else if (v === 22 - 1) { nv = 22; spawn = 2; }     // two jump, one number
  else { nv = v + 1; }
  G.count = nv;

  // per-press sheep spawn
  for (let i = 0; i < spawn; i++) {
    const o = {};
    if (nv >= 14) { o.scale = 0.85 + Math.random() * 0.35; o.shade = rndi(3); }
    if (nv >= 14 && nv < 20 && i === 0 && nv === 16) o.bell = true;
    if (nv >= 30 && nv <= 32 && chance(0.6)) o.dir = -1;
    if (nv === 33) o.faceless = true;
    if (nv >= 91) o.dark = true;
    if (nv >= 51) o.stopAt = 0.3 + Math.random() * 0.35;  // stop in the field, join the flock
    if (nv >= 44 && nv % 3 === 0) o.silent = true;
    o.delay = i * 0.12;
    spawnJumper(o);
  }

  // audio for the press
  if (nv === 13 || nv === 33) { /* the blip is MISSING. the silence is the cue */ }
  else if (nv >= 84) sfxBlipDesc(nv);
  else sfxBlip(nv);
  if (nv < 44 || nv % 3 !== 0) sfxToof(0.45);
  if (nv % 10 === 0 && nv <= 70 && nv > 0) sfxChime(true);
  if (nv === 16) sfxBell();
  if (chance(0.12) && nv < 77 && nv !== 13 && nv !== 33) sfxBaa(0.9 + Math.random() * 0.3, nv > 50);

  // scripted beats on the value we just reached
  switch (nv) {
    case 3: flash(SCRIPT.c3, 4); break;
    case 7: flash(SCRIPT.c7, 4.5); break;
    case 13:
      counting.stareOnFence = 1.4;
      counting.shake = 0.2;
      flash(SCRIPT.c13, 3.5);
      break;
    case 22: flash(SCRIPT.c22, 3.5); break;
    case 30: flash(SCRIPT.c30, 3.5); break;
    case 33: flash(SCRIPT.c33, 4); break;
    case 40: flash(SCRIPT.c40, 3.5); setAmbienceGain(0); break;
    case 44: // the skip beat: splash + one-blink red sheep + the line
      sfxSplash();
      counting.redFlashT = 0.14;
      flash(SCRIPT.c43, 4.5);
      break;
    case 50:
      flash(SCRIPT.c50, 4.5);
      sfxHeartbeat();
      break;
    case 60: flash(SCRIPT.c60, 4); break;
    case 66: flash(SCRIPT.c66, 4); break;
    case 70: counting.ghostOn = true; flash(SCRIPT.c70, 4); break;
    case 77:
      counting.headTurnT = 2.0;
      sfxSawSwell();
      break;
    case 78: flash(SCRIPT.c77after, 3.5); break;
    case 80:
      flash(SCRIPT.c80, 4);
      gridifyWatchers();
      break;
    case 91: counting.shake = 1; counting.wobble = 0.3; sfxHeartbeat(); break;
    case 95: counting.itFlashT = 0.16; break;
    case 99:
      counting.stallT = 4;
      flash(SCRIPT.c99, 7);
      break;
    case 100:
      counting.finaleT = 0;
      stopAmbience();
      sfxWrongBaa();
      break;
  }

  // continuous side effects
  if (nv >= 23 && counting.starsGone < counting.stars.length) {
    let k = randi(2, 3);
    for (const s of counting.stars) {
      if (k <= 0) break;
      if (!s.gone && !s.stubborn) { s.gone = true; k--; counting.starsGone++; }
    }
  }
  if (nv >= 26 && nv < 40) setAmbienceGain(1 - (nv - 26) / 14);
  if (nv >= 34 && nv < 80) counting.fenceDrift++;
  if (nv >= 30 && nv <= 32 && chance(0.5)) counting.hideNumT = 0.5;
  if (nv === 67) setAmbience('dream'); // the hum leaks in early
}

// descending late-game blip
function sfxBlipDesc(count) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  for (const det of [0, 7]) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle';
    const base = 600 - (count - 84) * 22 + det;
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base * 0.8, t + 0.08);
    env(g, t, 0.005, 0.18, 0.03, 0.06, 0.05, t + 0.13);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.15);
  }
}

function sfxBell() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  for (const dt of [0, 0.15, 0.3]) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = 1319 + Math.random() * 30;
    env(g, t + dt, 0.005, 0.06, 0.03, 0.02, 0.05, t + dt + 0.1);
    o.connect(g); g.connect(master);
    o.start(t + dt); o.stop(t + dt + 0.12);
  }
}

// at 80: the flock rearranges into perfect desk-grid rows
function gridifyWatchers() {
  const cols = 8;
  counting.watchers.forEach((w, i) => {
    w.gx = 34 + (i % cols) * 32;
    w.gy = 78 + Math.floor(i / cols) * 13;
  });
  counting.gridded = true;
}

SCENES.counting = {
  enter() {
    setAmbience('night');
    resetCounting(false);
    const kickoff = () => flash('PRESS TO COUNT', 6);
    say(SCRIPT.countIntro, kickoff);
  },
  update(dt) {
    const c = counting;
    c.shake = Math.max(0, c.shake - dt * 2);
    c.wobble = Math.max(0, c.wobble - dt);
    c.pressPop = Math.max(0, c.pressPop - dt * 5);
    c.pressAnimT += dt;
    if (c.flashT > 0) c.flashT -= dt;
    if (c.hideNumT > 0) c.hideNumT -= dt;
    if (c.redFlashT > 0) c.redFlashT -= dt;
    if (c.itFlashT > 0) c.itFlashT -= dt;
    if (c.stareOnFence > 0) c.stareOnFence -= dt;
    if (c.headTurnT > 0) c.headTurnT -= dt;
    if (c.stallT > 0) c.stallT -= dt;

    // heartbeat loop
    const iv = hbInterval(G.count);
    if (iv > 0 && c.finaleT < 0) {
      c.hbT += dt;
      if (c.hbT >= iv) { c.hbT = 0; sfxHeartbeat(); }
    }

    // sheep motion. after 66 the world only animates just after a press.
    const frozen = G.count >= 66 && c.pressAnimT > 0.55 && c.finaleT < 0;
    if (!frozen) {
      for (const j of c.jumpers) {
        if (j.delay > 0) { j.delay -= dt; continue; }
        j.t += dt * j.spd;
        if (j.stopAt > 0 && j.t >= j.stopAt) {
          // leave the arc and join the flock, spread across the field
          c.watchers.push({ x: randi(16, W - 40), y: randi(78, 118), gx: 0, gy: 0 });
          j.t = 2;
        }
      }
      c.jumpers = c.jumpers.filter(j => j.t < 1);
      // watchers drift to grid slots after 80
      if (c.gridded) {
        for (const w of c.watchers) {
          if (w.gx) { w.x = lerp(w.x, w.gx, dt * 3); w.y = lerp(w.y, w.gy, dt * 3); }
        }
      }
    }

    // finale
    if (c.finaleT >= 0) {
      c.finaleT += dt;
      if (c.finaleT > 5) hardGoto('dream1');
      return;
    }

    if (!textboxActive() && pressed['action'] && c.stallT <= 0 && G.count < 100) {
      pressed['action'] = false;
      countPress();
    }
  },
  draw() { drawCountingWorld(); },
};

/* the counting backdrop. everything keys off G.count. */
function drawCountingWorld() {
  const c = counting, v = G.count;
  // palette shift indigo -> bone-white over 44..90
  const t = c.night2 ? 0 : clamp((v - 44) / 46, 0, 1);
  const shakeX = c.shake > 0 ? Math.round((Math.random() - 0.5) * 4 * c.shake) : 0;
  const wobY = c.wobble > 0 ? Math.round((Math.random() - 0.5) * 3) : 0;
  ctx.save();
  ctx.translate(shakeX, wobY);

  const skyTop = hexLerp('#06061a', '#efe9df', t);
  const skyMid = hexLerp('#090920', '#e6dfd1', t);
  const skyLow = hexLerp('#0c0c28', '#e0d8c9', t);
  const skyHor = hexLerp('#111132', '#d8cfc0', t);
  const groundC = hexLerp('#0a0a1e', '#b8ad9c', t);
  const groundLo = hexLerp('#08081a', '#a89d8c', t);
  const inkC = hexLerp('#e8e4ec', '#3a352d', t);
  const dimC = hexLerp('#6a6684', '#8d8375', t);
  bandSky([[0, skyTop], [42, skyMid], [82, skyLow], [110, skyHor], [128, groundC]]);

  // stars (fading out; the stubborn ones become numerals at 80)
  for (const s of c.stars) {
    if (s.gone) continue;
    const tw = Math.abs(Math.sin(T * 0.7 + s.tw));
    const a = (0.35 + 0.5 * tw) * (1 - t * 0.75);
    if (v >= 80 && s.stubborn) {
      ctx.globalAlpha = 0.5;
      drawText(String((s.x + s.y) % 10), s.x, s.y, dimC);
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = 'rgba(220,220,240,' + a.toFixed(2) + ')';
      ctx.fillRect(s.x, s.y, 1, 1);
      if (tw > 0.93 && !s.gone) { // twinkle cross
        ctx.fillStyle = 'rgba(220,220,240,' + (a * 0.5).toFixed(2) + ')';
        ctx.fillRect(s.x - 1, s.y, 1, 1); ctx.fillRect(s.x + 1, s.y, 1, 1);
        ctx.fillRect(s.x, s.y - 1, 1, 1); ctx.fillRect(s.x, s.y + 1, 1, 1);
      }
    }
  }

  // moon: 20% larger and lower after 20
  const big = v >= 20;
  const ms = big ? 26 : 22;
  const mx = 246, my = big ? 30 : 24;
  drawMoon(mx, my, ms, hexLerp('#e8e4d0', '#f2f0e6', t), hexLerp('#cfcab2', '#dcd3c4', t));

  // distant hills on the horizon
  ctx.fillStyle = hexLerp('#0d0d2a', '#d0c7b8', t);
  for (let i = 0; i < 7; i++) {
    const hx = i * 56 - 20, hw = 70, hh = 6 + (i * 37) % 8;
    ctx.beginPath();
    ctx.moveTo(hx, 128); ctx.lineTo(hx + hw / 2, 128 - hh); ctx.lineTo(hx + hw, 128);
    ctx.closePath(); ctx.fill();
  }
  // ground texture: sparse grass tufts, fading with the palette
  px(0, 152, W, 28, groundLo);
  ditherRect(0, 150, W, 4, groundLo, 2);
  speckle(0, 132, W, 44, hexLerp('#141438', '#c4baa8', t), 90, 51);
  speckle(0, 136, W, 40, hexLerp('#05051a', '#9a9080', t), 60, 52);

  // the flock (watchers). before 80 they face the bed; at 77 and after 80 they stare.
  const stareAll = c.headTurnT > 0 || v >= 80;
  for (const w of c.watchers) {
    const sc = 0.8 + (w.y - 78) / 100;
    shadowUnder(w.x + 1, w.y + 13 * sc, Math.round(16 * sc));
    drawSheep(w.x, w.y, {
      stare: stareAll, flip: false,
      body: hexLerp('#e8e4dc', '#f2f0e6', t), face: hexLerp('#2a2430', '#3a352d', t),
      eyes: stareAll ? hexLerp('#e8e4dc', '#efe9df', t) : undefined,
      scale: sc,
    });
  }

  // something far off, briefly, at 95. don't look.
  if (c.itFlashT > 0) {
    ctx.globalAlpha = 0.7;
    drawIt(252, 122, 30, { faint: true, eyes: true });
    ctx.globalAlpha = 1;
  }

  // fence: 5 posts, 2 rails, center-right; drifts left after 34; gone at 80
  if (v < 80 && !c.fenceGone) {
    const fx = 178 - c.fenceDrift;
    const fenceC = hexLerp('#1e1a2e', '#1c1430', t);
    for (let i = 0; i < 5; i++) px(fx + i * 13, 112, 2, 18, fenceC);
    px(fx - 6, 116, 64, 2, fenceC); px(fx - 6, 122, 64, 2, fenceC);
    // the sheep that stops on the fence and stares (13)
    if (c.stareOnFence > 0) {
      drawSheep(fx + 22, 99, { stare: true });
    }
  }

  // bed: absent early (we are behind the eyelids); materializes in the field at 50
  if (v >= 50 || c.night2) drawBedSide(14, 140, t);

  // jumping sheep, with ground shadows that shrink mid-air
  for (const j of c.jumpers) {
    if (j.delay > 0) continue;
    const p = sheepArc(j.t, j.dir);
    const air = clamp((118 - p.y) / 34, 0, 1);
    ctx.globalAlpha = 0.35 - air * 0.22;
    ctx.fillStyle = '#05050f';
    ctx.fillRect(Math.round(p.x + 3 + air * 3), 128, Math.round(14 - air * 7), 1);
    ctx.globalAlpha = 1;
    drawSheep(p.x, p.y - 10, {
      dark: j.dark, faceless: j.faceless, bell: j.bell,
      scale: j.scale, flip: j.dir === -1,
      body: j.shade === 1 ? '#dcd8cc' : j.shade === 2 ? '#f2f0e6' : undefined,
    });
  }

  // the red thing, far off, for one blink (the skip) — and steady at 91+
  if (c.redFlashT > 0 || (v >= 91 && v < 100 && !c.night2)) {
    const rx = 208, ry = 84;
    drawSheep(rx, ry, { flip: true, body: hexLerp('#e8e4dc', '#f2f0e6', t), face: hexLerp('#2a2430', '#3a352d', t), scale: 0.85, scarf: true });
  }

  // the count numeral, big, top-center
  if (c.hideNumT <= 0) {
    const squash = 1 - c.pressPop * 0.35;
    const wob = v >= 34 ? Math.round(Math.sin(T * 2.3) * 1) : 0;
    const jit = (v === 13 && c.stareOnFence > 1.2) ? randi(-1, 1) : 0;
    drawTextBig(String(v), W / 2 + wob + jit, 24, inkC, 3, squash);
    drawText(v === 1 ? 'SHEEP' : 'SHEEP', W / 2, 56, dimC, { align: 'center' });
    // ghost numeral one ahead (70-76)
    if (c.ghostOn && v >= 70 && v < 77) {
      ctx.globalAlpha = 0.25;
      drawTextBig(String(v + 1), W / 2 + 40, 28, dimC, 2, 1);
      ctx.globalAlpha = 1;
    }
  }

  // faint corner clock, slower than the presses (20-49)
  if (v >= 20 && v < 50 && !c.night2) {
    ctx.globalAlpha = 0.3;
    drawText('11:5' + (8 + (Math.floor(T / 9) % 2)), 8, 8, dimC);
    ctx.globalAlpha = 1;
  }

  // kid line, floating — never blocks the button
  if (c.flashText && c.flashT > 0) {
    const a = clamp(c.flashT / 0.4, 0, 1) * clamp((c.flashDur - c.flashT) / 0.25, 0, 1);
    ctx.globalAlpha = a;
    const lines = wrapText(c.flashText, 46);
    lines.forEach((ln, i) => drawText(ln, W / 2, 64 + i * 9, hexLerp('#b8b4d0', '#6b705c', t), { align: 'center' }));
    ctx.globalAlpha = 1;
  }

  // the COUNT button
  drawCountButton(v, t);

  // eyelid vignette: heavy at the start (behind the eyelids), returns after 81
  let lid = 0;
  if (!c.night2) {
    if (v < 50) lid = 14 - clamp(v / 50, 0, 1) * 8;
    if (v >= 81) lid = clamp((v - 81) / 18, 0, 1) * 24;
  }
  if (lid > 0) {
    px(0, 0, W, Math.round(lid), '#08060c');
    px(0, H - Math.round(lid), W, Math.round(lid), '#08060c');
    ditherRect(0, Math.round(lid), W, 4, '#08060c', 2);
    ditherRect(0, H - Math.round(lid) - 4, W, 4, '#08060c', 2);
  }

  // late darkening (91+): the world muffles press by press
  if (v >= 91 && v < 100) {
    ctx.fillStyle = 'rgba(6,6,10,' + ((v - 90) / 10 * 0.45).toFixed(2) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
  if (v >= 60 && !c.night2) grain(0.03 + t * 0.04);
  vignette(0.25 + t * 0.1);

  // finale: cut to black, one hundred, ready or not
  if (c.finaleT >= 0) {
    ctx.fillStyle = '#030308';
    ctx.fillRect(0, 0, W, H);
    if (c.finaleT > 1.2 && c.finaleT < 4.6) drawText('one hundred.', W / 2, 84, '#4a4664', { align: 'center' });
    if (c.finaleT > 2.8 && c.finaleT < 4.6) drawText('ready or not.', W / 2, 98, '#332f4a', { align: 'center' });
  }
}

function drawCountButton(v, t) {
  const c = counting;
  const bw = 64, bh = 16;
  const bx = W / 2 - bw / 2, by = H - 24 + (c.pressPop > 0.5 ? 1 : 0);
  const label = (c.stallT > 0 || (v === 99 && !c.night2)) ? '...100?' : 'COUNT';
  const edge = hexLerp('#2e2a4a', '#8d8375', t);
  const fill = hexLerp('#181632', '#dcd3c4', t);
  const ink = hexLerp('#8fa1d9', '#3a352d', t);
  px(bx, by, bw, bh, edge);
  px(bx + 1, by + 1, bw - 2, bh - 2, fill);
  drawText(label, W / 2, by + 5, ink, { align: 'center' });
  if (v === 0 && !textboxActive() && Math.floor(T * 1.4) % 2 === 0) {
    drawText('Z / SPACE / TAP', W / 2, by - 10, ink, { align: 'center' });
  }
}

    const self = this;
    this.sheep = [];
    for (let x = 200; x < LEN - 100; x += randi(100, 150)) {
      this.sheep.push({ x, snapped: false });
    }

    this.wk = makeWalker({
      startX: 16, groundY: 138, len: LEN, speed: 44,

      ],

    });

    this.exitOpen = false;
    this.lightsOutX = -1;

    updateWalker(this.wk, dt);
    for (const s of this.sheep) {

        if (chance(0.5)) sfxBaa(0.6 + Math.random() * 0.2, true);
      }

    if (this.exitOpen) {
      if (this.lightsOutX < 0) this.lightsOutX = 0;

    if (this.exitOpen && this.wk.x > this.wk.len - 30) goto_('dream3');

    const cam = this.wk.cam;
    // walls
    px(0, 0, W, 146, DP.mid);
    speckle(0, 20, W, 120, DP.low, 50, 61);

    for (let i = -1; i < 8; i++) {
      const x = Math.round((i * 96 - (cam * 0.3) % 96));

    for (let i = -1; i < 8; i++) {

      if (this.surfaceT > 0.8 && this.red.state !== 'gone') this.red.state = 'gone'; // even the red one flees
      if (this.surfaceT > 1.2 && !this._sHb) { this._sHb = true; sfxHeartbeat(); }
      if (this.surfaceT > 2.6 && !this._sHb2) { this._sHb2 = true; sfxHeartbeat(); sfxWrongBaa(); }
      if (this.surfaceT > 3.6 && !this._sLine) { this._sLine = true; flash(SCRIPT.d3surface, 2.6); }
      if (this.surfaceT > 6.4) hardGoto('chase');
      return;
    }
    // knock-back timer
    if (this.knockT > 0) {
      this.knockT -= dt;
      if (this.knockT <= 0) { sfxKnock(true); say(SCRIPT.d3knock); this.knockT = -1; }
    }
    // red sheep logic
    if (this.red.state === 'far' && this.seen.door && this.seen.bus && !textboxActive()) {
      this.red.state = 'noticed';
      this.wk.locked = true;
      say(SCRIPT.d3red, () => { self.red.state = 'bolting'; self.red.x = self.wk.x + 130; self.red.boltT = 0; self.wk.locked = false; });
    } else if (this.red.state === 'bolting') {
      this.red.boltT += dt;
      this.red.x = lerp(this.red.x, this.creekX + 90, dt * 1.1);
      this.red.y = lerp(this.red.y, 140, dt * 1.4);
      if (this.red.boltT > 5 || this.red.x > this.creekX + 80) { this.red.state = 'waiting'; this.red.x = this.creekX + 90; this.red.y = 140; }
    }
    // the plank: forward input refused. then refused BACK.
    if (this.wk.x >= this.creekX - 22 && !textboxActive()) {
      this.wk.x = this.creekX - 22;
      if (pressed['right'] || (keys['right'] && !this._heldRefuse)) {
        this._heldRefuse = true;
        this.refusals++;
        sfxDeadClick();
        if (this.refusals === 1) say(SCRIPT.d3plank);
        if (this.refusals >= 2) {
          this.wk.locked = true;
          setCine(true);
          stopAmbience();
          this.surfaceT = 0;
        }
      }
      if (!keys['right']) this._heldRefuse = false;
    }
    // count a sheep with action (when not near a landmark)
    if (pressed['action'] && !textboxActive() && !nearThing(this.wk)) {
      if (this.countSheepAt(this.wk.x + 4)) pressed['action'] = false;
    }
    updateWalker(this.wk, dt);
  },
  draw() {
    const cam = this.wk.cam;
    // no horizon: off-white on off-white, split by fog dither
    px(0, 0, W, H, '#efe9df');
    ditherRect(0, 96, W, 10, '#dcd3c4', 2);
    ditherRect(0, 104, W, 8, '#b8ad9c', 3);
    // repeating fence with copy-paste errors, sunk into the fog line
    for (let i = 0; i < 40; i++) {
      const fx = i * 90 - cam * 0.5;
      if (fx < -70 || fx > W) continue;
      const err = (i % 7 === 3);
      px(fx, err ? 90 : 94, 2, 10, '#b8ad9c');
      px(fx, 98, err ? 40 : 60, 1, '#b8ad9c');
    }
    // the flock
    for (const s of this.flock) {
      const sx = s.x - cam * lerp(1, 0.55, s.depth);
      if (sx < -30 || sx > W + 10) continue;
      if (s.depth > 0.75) {
        px(sx, s.y, 4, 3, '#b8ad9c');
      } else {
        drawSheep(sx, s.y - 13, {
          stare: true, scale: lerp(1.05, 0.7, s.depth),
          body: s.depth > 0.4 ? '#dcd3c4' : '#f2f0e6',
          face: '#3a352d', eyes: '#efe9df',
        });
        if (s.numT > 0) {
          s.numT -= 0.016;
          ctx.globalAlpha = clamp(s.numT, 0, 1);
          drawText(s.num, sx + 9, s.y - 24, '#6b705c', { align: 'center' });
          ctx.globalAlpha = 1;
        }
      }
    }
    // freestanding bedroom door
    const doorX = 360 - cam;
    if (doorX > -40 && doorX < W) {
      px(doorX, 96, 30, 62, '#9aa184');
      px(doorX + 2, 98, 26, 60, '#6b705c');
      px(doorX + 22, 126, 3, 3, '#22251f');
      px(doorX - 2, 94, 34, 2, '#9aa184');
    }
    // bus stop: sign, bench, five queued sheep
    const busX = 760 - cam;
    if (busX > -80 && busX < W) {
      px(busX, 100, 2, 58, '#6b705c');
      px(busX - 8, 92, 18, 10, '#9aa184');
      drawText('BUS', busX + 1, 93, '#22251f', { align: 'center' });
      for (let i = 0; i < 5; i++) drawSheep(busX + 12 + i * 20, 145, { flip: true, body: '#f2f0e6', face: '#3f4438' });
    }
    // the feeding site: wool everywhere, the grass wrong-colored underneath
    const wx = this.creekX - 132 - cam;
    if (wx > -40 && wx < W + 20) {
      speckle(wx - 6, 148, 40, 10, '#7a2020', 26, 55);
      speckle(wx - 4, 146, 36, 12, '#5a1818', 16, 56);
      speckle(wx - 8, 144, 44, 14, '#f2f0e6', 22, 57);
      px(wx + 4, 142, 3, 2, '#f2f0e6'); px(wx + 18, 145, 4, 2, '#f2f0e6');
      px(wx + 11, 149, 2, 2, '#e0d8c9');
    }
    // the creek: vertical band of black static, one plank
    const ckX = this.creekX - cam;
    if (ckX > -80 && ckX < W + 40) {
      // black static: per-pixel hash noise, re-rolled each frame
      const fr = Math.floor(T * 20) * 131;
      for (let yy = 108; yy < H; yy++) {
        for (let xx = 0; xx < 44; xx++) {
          let h = (xx * 374761 + yy * 668265 + fr) & 0xffff;
          h = (h * 48271) % 65537;
          if (h < 29000) px(ckX + xx, yy, 1, 1, h < 6000 ? '#3f4438' : '#22251f');
        }
      }
      // the plank
      px(ckX - 4, 152, 52, 3, '#9aa184');
      px(ckX - 4, 155, 52, 1, '#6b705c');
    }
    // the red-scarf sheep
    if (this.red.state === 'far') {
      // always the same distance ahead, small, facing away
      const rx = clamp(this.wk.x + 130, 200, this.creekX - 60) - cam;
      drawSheep(rx, 84, { flip: true, scale: 0.7, body: '#f2f0e6', face: '#3a352d', scarf: true });
    } else if (this.red.state !== 'gone') {
      const rx = this.red.x - cam;
      if (rx > -30 && rx < W + 20)
        drawSheep(rx, this.red.y, { flip: true, body: '#f2f0e6', face: '#3a352d', scarf: true, bob: this.red.state === 'bolting' ? Math.sin(T * 18) * 2 : 0 });
    }
    // the surfacing: It steps out of the static, onto this bank
    if (this.surfaceT >= 0) {
      const rise = clamp((this.surfaceT - 0.6) / 2.4, 0, 1);
      const h = Math.round(rise * 48);
      if (h > 2) drawIt(this.creekX - 44 - cam + (1 - rise) * 34, 156, h, { eyes: this.surfaceT > 2.8 });
      // the world dims around it
      ctx.fillStyle = 'rgba(10,9,14,' + (rise * 0.45).toFixed(2) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    shadowUnder(this.wk.x - cam, 158, 8);
    drawKid(this.wk.x - cam, 158 - 20, this.wk.frame, { pj: true, pale: true, flip: this.wk.facing < 0 });
    drawInteractHint(this.wk, '#3a352d');
    if (counting.flashText && counting.flashT > 0) {
      const lines = wrapText(counting.flashText, 46);
      lines.forEach((ln, i) => drawText(ln, W / 2, 40 + i * 9, this.surfaceT >= 0 ? '#c9cdae' : '#6b705c', { align: 'center' }));
    }
    if (!textboxActive() && sceneTime > 4 && sceneTime < 8 && this.surfaceT < 0) {
      drawText('Z TO COUNT A SHEEP', W / 2, 168, '#b8ad9c', { align: 'center' });
    }
    grain(0.05);
    vignette(0.12);
  },
};

/* ---- chase: It counted to a hundred. now you run. ---- */
SCENES.chase = {
  enter() {
    setAmbience('none');
    this.len = 1150;
    this.groundY = 156;
    this.kid = { x: this.len - 60, y: 0, vy: 0, air: false, stumbleT: 0, frame: 0 };
    this.it = { x: this.len + 70, spd: 86 };
    this.runSpd = 92;
    this.hurdles = [880, 700, 540, 380, 214].map(x => ({ x, hit: false }));
    this.flock = [];
    srand(99);
    for (let i = 0; i < 44; i++) {
      const d = rnd();
      this.flock.push({ x: 60 + rnd() * (this.len - 160), y: lerp(150, 96, d), d });
    }
    this.flock.sort((a, b) => b.d - a.d);
    this.caught = 0;
    this.staticT = 0;
    this.doorX = 26;
    this.hb = 0.4;
    this.endT = -1;
    this.alarmed = false;
    // stragglers on the path. It stops for them. that's your head start.
    this.stragglers = [{ x: 850 }, { x: 590 }, { x: 350 }].map(s => ({ ...s, state: 'idle', t: 0 }));
    this.itPauseT = 0;
    this.blood = [];   // {x, y, vx, vy}
    this.stains = [];  // {x, y, c}
    this.eatSaid = false;
    setCine(true);
    flash('RUN.', 2);
  },
  spawnBlood(x, y) {
    for (let i = 0; i < 26; i++) {
      this.blood.push({
        x: x + rand(-2, 2), y: y + rand(-3, 3),
        vx: rand(-46, 46), vy: rand(-80, -6),
      });
    }
    // wool scatters too
    for (let i = 0; i < 8; i++) {
      this.blood.push({
        x: x + rand(-2, 2), y: y + rand(-4, 0),
        vx: rand(-30, 30), vy: rand(-60, -10), wool: true,
      });
    }
  },
  update(dt) {
    if (counting.flashT > 0) counting.flashT -= dt;
    // reached the door: slam, black, alarm
    if (this.endT >= 0) {
      this.endT += dt;
      if (this.endT > 0.9 && !this.alarmed) { this.alarmed = true; sfxAlarm(); }
      if (this.endT > 4.4) { setCine(false); goto_('morning'); }
      return;
    }
    if (this.staticT > 0) { this.staticT -= dt; return; }
    const k = this.kid;
    // heartbeat tightens as It closes
    const gap = this.it.x - k.x;
    this.hb -= dt;
    if (this.hb <= 0) { sfxHeartbeat(); this.hb = clamp(gap / 260, 0.28, 0.85); }
    // auto-run left. one button. it's always one button.
    let spd = this.runSpd;
    if (k.stumbleT > 0) { k.stumbleT -= dt; spd = 8; }
    k.x -= spd * dt;
    k.frame += dt * 15;
    if (pressed['action'] && !k.air && k.stumbleT <= 0) {
      pressed['action'] = false;
      k.air = true; k.vy = -88;
      sfxToof();
    }
    if (k.air) {
      k.y += k.vy * dt; k.vy += 310 * dt;
      if (k.y >= 0) { k.y = 0; k.vy = 0; k.air = false; }
    }
    // fallen fence hurdles: jump or stumble
    for (const h of this.hurdles) {
      if (!h.hit && Math.abs(k.x - h.x) < 5 && (!k.air || k.y > -6)) {
        h.hit = true;
        k.stumbleT = 0.55;
        sfxDeadClick();
        counting.shake = 0.5;
      }
    }
    counting.shake = Math.max(0, counting.shake - dt * 2);
    // blood physics
    for (const b of this.blood) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 260 * dt;
      if (b.y >= this.groundY - 1) {
        this.stains.push({ x: b.x, y: this.groundY - 1 + rand(0, 3), c: b.wool ? '#e6e0d2' : (chance(0.4) ? '#6a1717' : '#8a1f1f') });
        b.dead = true;
      }
    }
    this.blood = this.blood.filter(b => !b.dead);
    // stragglers: It stops to feed. don't waste it.
    for (const s of this.stragglers) {
      if (s.state === 'idle' && this.it.x - s.x < 8) {
        s.state = 'taken'; s.t = 0;
        this.itPauseT = 0.85;
        sfxSplat();
        this.spawnBlood(s.x + 9, this.groundY - 10);
        if (!this.eatSaid) { this.eatSaid = true; flash(SCRIPT.ch_eat, 2.6); }
      } else if (s.state === 'taken') {
        s.t += dt;
        if (s.t > 0.5) s.state = 'gone';
      }
    }
    // It gains
    this.it.spd += dt * 4.2;
    if (this.itPauseT > 0) this.itPauseT -= dt;
    else this.it.x -= this.it.spd * dt;
    if (this.it.x - k.x < 9) {
      this.caught++;
      this.staticT = 0.5;
      sfxWrongBaa();
      this.it.x = k.x + 132;
      this.it.spd = Math.max(84, this.it.spd - 14);
      if (this.caught === 1) flash(SCRIPT.ch_caught, 2.6);
    }
    if (k.x <= this.doorX + 12) {
      this.endT = 0;
      sfxKnock(true);
    }
  },
  draw() {
    // door slam outro: black, the clock, the line
    if (this.endT >= 0 && this.endT > 0.35) {
      px(0, 0, W, H, '#030308');
      if (this.endT > 1.1) drawTextBig('1:00', W / 2, 70, '#8fa1d9', 2, 1);
      if (this.endT > 2.0) drawText(SCRIPT.d3wake, W / 2, 104, '#4a4664', { align: 'center' });
      grain(0.05);
      return;
    }
    const k = this.kid;
    const cam = clamp(k.x - 104, 0, this.len - W);
    const shakeX = counting.shake > 0 ? Math.round((Math.random() - 0.5) * 4 * counting.shake) : 0;
    ctx.save();
    ctx.translate(shakeX, 0);
    // the pasture, going out like a light
    px(0, 0, W, H, '#d9d3c5');
    ditherRect(0, 94, W, 10, '#b8ad9c', 2);
    ditherRect(0, 102, W, 8, '#9a9080', 3);
    px(0, 130, W, 50, '#c4baa8');
    speckle(0, 132, W, 46, '#a89d8c', 70, 41);
    // background fence stumps
    for (let i = 0; i < 24; i++) {
      const fx = i * 90 - cam * 0.5;
      if (fx < -70 || fx > W) continue;
      px(fx, 94, 2, 9, '#9a9080');
    }
    // the flock, all facing you now
    for (const s of this.flock) {
      const sx = s.x - cam * lerp(1, 0.55, s.d);
      if (sx < -30 || sx > W + 10) continue;
      if (s.d > 0.75) { px(sx, s.y, 4, 3, '#9a9080'); continue; }
      drawSheep(sx, s.y - 13, {
        stare: true, scale: lerp(1.05, 0.7, s.d),
        body: '#e6e0d2', face: '#2a2620', eyes: '#e6e0d2',
      });
    }
    // fallen fence hurdles
    for (const h of this.hurdles) {
      const hx = h.x - cam;
      if (hx < -40 || hx > W + 20) continue;
      px(hx - 8, 148, 22, 3, '#8a7f6c');
      px(hx - 10, 151, 26, 2, '#6f665a');
      px(hx + 6, 144, 3, 8, '#8a7f6c');
      shadowUnder(hx - 8, 154, 24);
    }
    // ground stains: blood and wool where It fed
    for (const st of this.stains) {
      const sx = st.x - cam;
      if (sx < -4 || sx > W + 4) continue;
      px(sx, st.y, 1, 1, st.c);
    }
    // stragglers: too slow, too still
    for (const s of this.stragglers) {
      const sx = s.x - cam;
      if (sx < -30 || sx > W + 20) continue;
      if (s.state === 'idle') {
        shadowUnder(sx + 1, this.groundY, 16);
        drawSheep(sx, this.groundY - 13, { stare: true, body: '#e6e0d2', face: '#2a2620', eyes: '#e6e0d2' });
      } else if (s.state === 'taken') {
        // yanked upward into the static
        const lift = s.t * 46;
        ctx.globalAlpha = clamp(1 - s.t * 1.8, 0, 1);
        drawSheep(sx, this.groundY - 13 - lift, { stare: true, body: '#e6e0d2', face: '#2a2620', eyes: '#8a1f1f', bob: Math.sin(T * 40) * 1.5 });
        ctx.globalAlpha = 1;
      }
    }
    // blood in the air
    for (const b of this.blood) {
      const bx = b.x - cam;
      if (bx < -4 || bx > W + 4) continue;
      px(bx, b.y, 1, 1, b.wool ? '#e6e0d2' : '#8a1f1f');
    }
    // the door home, far left: the only warm thing in the dream
    const dx = this.doorX - cam;
    if (dx > -40 && dx < W) {
      px(dx - 2, 92, 34, 2, '#9aa184');
      px(dx, 94, 30, 62, '#9aa184');
      px(dx + 2, 96, 26, 60, '#6b705c');
      px(dx + 22, 124, 3, 3, '#22251f');
      ctx.fillStyle = 'rgba(232,176,74,0.5)';
      ctx.fillRect(dx + 2, 154, 26, 2);
    }
    // the kid, running for it
    shadowUnder(k.x - cam, this.groundY, 8);
    drawKid(k.x - cam, this.groundY - 20 + k.y, k.stumbleT > 0 ? 0 : k.frame, { pj: true, pale: true, flip: true });
    // It
    const ix = this.it.x - cam;
    if (ix > -30 && ix < W + 40) {
      shadowUnder(ix - 6, this.groundY, 14);
      drawIt(ix, this.groundY, 48, { eyes: true });
    }
    // the dark pours in from behind
    const gap = clamp((this.it.x - k.x) / 260, 0, 1);
    const dark = 0.65 - gap * 0.4;
    ctx.fillStyle = 'rgba(8,7,12,' + dark.toFixed(2) + ')';
    ctx.fillRect(0, 0, W, H);
    // heavier to the right, where it came from
    ctx.fillStyle = 'rgba(8,7,12,0.055)';
    for (let i = 0; i < 9; i++) {
      ctx.fillRect(W - 126 + i * 14, 0, 126 - i * 14, H);
    }
    ctx.restore();
    // static blast when caught
    if (this.staticT > 0) {
      const fr = Math.floor(T * 30) * 131;
      for (let yy = 0; yy < H; yy += 2) {
        for (let xx = 0; xx < W; xx += 2) {
          let hh = (xx * 374761 + yy * 668265 + fr) & 0xffff;
          hh = (hh * 48271) % 65537;
          if (hh < 30000) px(xx, yy, 2, 2, hh < 8000 ? '#3a3444' : '#0c0a12');
        }
      }
    }
    if (counting.flashText && counting.flashT > 0) {
      if (counting.flashText.length <= 26) drawTextBig(counting.flashText, W / 2, 52, '#d8cfc0', 2, 1);
      else wrapText(counting.flashText, 48).forEach((ln, i) => drawText(ln, W / 2, 52 + i * 9, '#d8cfc0', { align: 'center' }));
    }
    if (sceneTime < 3.5) drawText('Z TO JUMP', W / 2, 160, '#b8ad9c', { align: 'center' });
    grain(0.09);
  },
};

    px(35, 78, 10, 17, '#7a7488');
    px(35, 78, 10, 1, liteOf('#7a7488'));
    px(43, 80, 2, 13, shadeOf('#7a7488'));

/* ---- school: the classroom ---- */

// small seated student, 8x12, palette-swapped
function drawStudent(x, y, c, opts) {
  opts = opts || {};
  px(x + 1, y, 6, 4, opts.skin || DAY.skin);
  px(x, y, 8, 2, c.hair);
  px(x + 2, y + 2, 1, 1, DAY.ink); px(x + 5, y + 2, 1, 1, DAY.ink);
  px(x, y + 4, 8, 5, c.shirt);
  px(x + 1, y + 9, 6, 3, DAY.slate);
}

function drawDesk(x, y) {
  px(x, y, 22, 3, '#b8a988');
  px(x + 1, y + 3, 2, 12, '#9a8c6e'); px(x + 19, y + 3, 2, 12, '#9a8c6e');
}

function drawClassroom(cam, seats, opts) {
  opts = opts || {};
  const wallC = opts.dim ? '#a8a390' : '#d8d3bd';
  px(0, 0, W, 148, wallC);
  px(0, 0, W, 8, opts.dim ? '#98937f' : '#e4dfca');
  // chalkboard at the front (left)
  const bx = 20 - cam;
  px(bx, 24, 100, 48, '#a9b7a0');
  px(bx - 3, 21, 106, 3, '#b8a988'); px(bx - 3, 72, 106, 3, '#b8a988');
  px(bx - 3, 21, 3, 54, '#b8a988'); px(bx + 103, 21, 3, 54, '#b8a988');
  drawText('1 2 3', bx + 10, 32, '#e4efdc');
  drawSheepIcon(bx + 52, 31, '#e4efdc');
  drawText('COUNTING', bx + 10, 44, '#cfe0c8');
  // windows with light shafts and dust motes
  for (let i = 0; i < 4; i++) {
    const wx2 = 160 + i * 110 - cam;
    if (wx2 < -80 || wx2 > W) continue;
    px(wx2, 20, 34, 40, opts.dim ? '#c9b788' : '#f7f5ea');
    px(wx2 + 15, 20, 2, 40, '#8f9aa2'); px(wx2, 38, 34, 2, '#8f9aa2');
    px(wx2 - 2, 18, 38, 2, '#6f7d88'); px(wx2 - 2, 60, 38, 2, '#6f7d88');
    ctx.globalAlpha = opts.dim ? 0.07 : 0.12;
    ctx.fillStyle = opts.dim ? '#c9b788' : '#f7f5ea';
    ctx.beginPath();
    ctx.moveTo(wx2, 60); ctx.lineTo(wx2 + 34, 60);
    ctx.lineTo(wx2 + 12, 146); ctx.lineTo(wx2 - 26, 146);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    // motes drifting in the shaft
    for (let m = 0; m < 4; m++) {
      const mt = (T * 0.12 + m * 0.31 + i * 0.17) % 1;
      const mx = wx2 + 20 - mt * 40 + Math.sin(T + m * 2) * 3;
      const my = 62 + mt * 80;
      ctx.fillStyle = 'rgba(247,245,234,' + (0.35 * (1 - mt)).toFixed(2) + ')';
      ctx.fillRect(Math.round(mx), Math.round(my), 1, 1);
    }
  }
  // back row of desks (decor, higher and smaller)
  if (opts.backRow) {
    for (const b of opts.backRow) {
      const dx = b.x - cam;
      if (dx < -30 || dx > W) continue;
      if (b.who === 'sheep') drawSheep(dx + 2, 96, { stare: true, scale: 0.8, body: '#f2f0e6', face: '#3b4048', eyes: '#f2f0e6' });
      else if (b.who === 'kid') drawStudent(dx + 3, 96, b, { small: true });
      px(dx, 108, 18, 2, '#a89a7c');
      px(dx + 1, 110, 2, 9, '#8c8066'); px(dx + 15, 110, 2, 9, '#8c8066');
    }
  }
  // floor
  px(0, 148, W, 32, opts.dim ? '#8f8a76' : '#b3ae9a');
  px(0, 146, W, 2, '#6f7d88');
  // teacher by the board
  if (!opts.noTeacher) {
    const tx = 66 - cam;
    px(tx + 1, 96, 8, 5, '#e0b48c');
    px(tx, 96, 10, 2, '#5a5a66');
    px(tx + 3, 98, 1, 1, '#3b4048'); px(tx + 6, 98, 1, 1, '#3b4048');
    px(tx, 101, 10, 14, '#7a6a98');
    px(tx + 1, 115, 3, 12, '#3b4048'); px(tx + 6, 115, 3, 12, '#3b4048');
  }
  // front row desks + occupants
  for (const s of seats) {
    const dx = s.x - cam;
    if (dx < -40 || dx > W) continue;
    if (s.who === 'sheep') {
      drawSheep(dx + 2, 116, { stare: true, body: '#f2f0e6', face: '#3b4048', eyes: '#f2f0e6' });
      px(dx + 24, 126, 1, 4, '#c9a24a'); // tiny pencil
    } else if (s.who === 'kid') {
      drawStudent(dx + 4, 114, s);
    } else if (s.who === 'sam') {
      // the empty desk. chair legs up, like summer.
      if (s.chairUp) {
        px(dx + 4, 118, 14, 3, '#9a8c6e');
        px(dx + 6, 121, 2, 6, '#9a8c6e'); px(dx + 14, 121, 2, 6, '#9a8c6e');
      } else {
        px(dx + 4, 134, 14, 3, '#9a8c6e');
        px(dx + 6, 137, 2, 8, '#9a8c6e'); px(dx + 14, 137, 2, 8, '#9a8c6e');
      }
    }
    drawDesk(dx, 130);
  }
}

SCENES.school = {
  enter() {
    setAmbience('day');
    const self = this;
    const LEN = 560;
    const hairs = ['#3b2a1e', '#6e4a2a', '#1e1e24', '#7a5a3a', '#4a3a5a'];
    const shirts = ['#3c4f8a', '#a34a3f', '#a9b7a0', '#7a6a98', '#c9a24a'];
    this.seats = [];
    for (let i = 0; i < 6; i++) {
      this.seats.push({
        x: 150 + i * 62,
        who: (i === 3) ? 'sam' : 'kid',
        chairUp: true,
        hair: hairs[i % 5], shirt: shirts[(i * 2 + 1) % 5],
        name: ['MAYA', 'JONAS', 'PRIYA', "SAM'S DESK", 'ELI', 'WREN'][i],
      });
    }
    this.backRow = [];
    for (let i = 0; i < 5; i++) this.backRow.push({ x: 180 + i * 70, who: 'kid', hair: hairs[(i + 2) % 5], shirt: shirts[(i + 3) % 5] });
    this.blinkT = 8;       // seconds until next automatic blink
    this.blinkFlash = 0;   // black-frame timer
    this.blinks = 0;
    this.baas = 0;
    this.attendanceDone = false;
    this.samSeen = false;
    this.noteGiven = false;
    this.leaving = false;
    this.wk = makeWalker({
      startX: 14, groundY: 148, len: LEN, speed: 40,
      triggers: [
        { x: 40, run: () => {
            self.wk.locked = true;
            say([
              { text: '...twenty-one... twenty-two.', who: 'TEACHER', color: '#7a6a98' },
              SCRIPT.sc_attend,
            ], () => { self.attendanceDone = true; self.wk.locked = false; });
          } },
      ],
      things: [],
    });
    this.wk.groundHintY = 92;
    this.rebuildThings();
  },
  rebuildThings() {
    const self = this;
    this.wk.things = this.seats.map((s, i) => ({
      x: s.x, w: 22,
      label: s.who === 'sheep' ? 'SHEEP' : (s.who === 'sam' ? "SAM'S DESK" : s.name),
      onInteract: () => {
        if (s.who === 'sam') {
          if (!self.samSeen) { self.samSeen = true; say(SCRIPT.sc_samdesk); }
          else say(SCRIPT.sc_notyet);
        } else if (s.who === 'sheep') {
          sfxBaa(0.9 + i * 0.05);
          say(SCRIPT.sc_sheepdesk);
        } else {
          self.baas++;
          sfxBaa(1 + Math.random() * 0.2);
          if (self.baas === 1) say([{ text: 'baa.', who: s.name, color: '#8f8c7e' }, SCRIPT.sc_baacap1]);
          else if (self.baas === 2) say([{ text: 'baa. baa.', who: s.name, color: '#8f8c7e' }, SCRIPT.sc_baacap2]);
          else say([{ text: 'baa.', who: s.name, color: '#8f8c7e' }, SCRIPT.sc_baacap3]);
        }
      },
    }));
    this.wk.things.push({ x: 60, w: 26, label: 'TEACHER', onInteract: () => say({ text: '. . .', who: 'TEACHER', color: '#7a6a98' }) });
  },
  doBlink() {
    this.blinks++;
    if (this.blinks === 3) {
      // one blink lasts too long. something is standing in it.
      this.blinkFlash = 1.5;
      this.longBlink = true;
      sfxHeartbeat();
    } else {
      this.blinkFlash = 0.09;
    }
    // swaps: front row students and back row, more each time
    const swaps = Math.min(1 + Math.floor(this.blinks / 2), 3);
    for (let k = 0; k < swaps; k++) {
      const humansF = this.seats.filter(s => s.who === 'kid');
      const humansB = this.backRow.filter(s => s.who === 'kid');
      if (humansB.length && (chance(0.5) || !humansF.length)) pick(humansB).who = 'sheep';
      else if (humansF.length) pick(humansF).who = 'sheep';
    }
    sfxBaa(0.8 + Math.random() * 0.4, this.blinks > 3);
    this.rebuildThings();
    if (this.blinks === 1) say(SCRIPT.sc_blink);
  },
  update(dt) {
    if (this.leaving) return;
    // automatic blinks
    if (this.attendanceDone && !textboxActive()) {
      this.blinkT -= dt;
      if (this.blinkT <= 0) { this.blinkT = 7 + Math.random() * 3; this.doBlink(); }
    }
    if (this.blinkFlash > 0) this.blinkFlash -= dt;
    // the note, then the bell
    const classDone = (this.samSeen && this.baas >= 2 && this.blinks >= 2) || this.blinks >= 4;
    if (!this.noteGiven && this.attendanceDone && classDone && !textboxActive()) {
      this.noteGiven = true;
      const self = this;
      this.wk.locked = true;
      say(SCRIPT.sc_note, () => {
        sfxSchoolBell();
        self.leaving = true;
        goto_('recess');
      });
    }
    updateWalker(this.wk, dt);
  },
  draw() {
    drawClassroom(this.wk.cam, this.seats, { backRow: this.backRow });
    shadowUnder(this.wk.x - this.wk.cam, 148, 8);
    drawKid(this.wk.x - this.wk.cam, 148 - 20, this.wk.frame, { tired: true, flip: this.wk.facing < 0 });
    drawInteractHint(this.wk, '#3b4048');
    if (this.blinkFlash > 0) {
      px(0, 0, W, H, '#08060c');
      // during the long blink, It is in the room
      if (this.longBlink && this.blinkFlash > 0.25 && this.blinkFlash < 1.3) {
        drawIt(262, 152, 44, { eyes: true });
        grain(0.12);
      }
    } else if (this.longBlink && !this.longSaid) {
      this.longSaid = true;
      say(SCRIPT.sc_longblink);
    }
    vignette(0.1);
  },
};

/* ---- night two: the last count ---- */
function sfxBlipN2() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(330, t);
  o.frequency.exponentialRampToValueAtTime(440, t + 0.06);
  env(g, t, 0.008, 0.2, 0.04, 0.08, 0.06, t + 0.16);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.18);
}

SCENES.count2 = {
  enter() {
    setAmbience('night');
    resetCounting(true);
    this.warm = 0;
    this.fillerIdx = 0;
    say(SCRIPT.n2intro, () => flash('PRESS TO COUNT', 5));
  },
  endGame(reached100) {
    const c = counting;
    if (c.ended) return;
    c.ended = true;
    const self = this;
    say(reached100 ? SCRIPT.olly100 : SCRIPT.olly, () => {
      self.warmTarget = 1;
      say(SCRIPT.goodDark, () => goto_('coda'));
    });
  },
  update(dt) {
    const c = counting;
    c.pressPop = Math.max(0, c.pressPop - dt * 5);
    if (c.flashT > 0) c.flashT -= dt;
    if (this.warmTarget) this.warm = Math.min(1, this.warm + dt * 0.5);
    if (c.ended) return;
    if (G.count >= 20) c.eyesBtnT = Math.min(1, c.eyesBtnT + dt * 0.1);

    // OPEN YOUR EYES: X key, or a click on the button
    let openPressed = pressed['alt'];
    if (pressed['action'] && pointerClick && c.eyesBtnT > 0) {
      const b = this.eyesRect();
      if (pointerClick.x >= b.x && pointerClick.x <= b.x + b.w && pointerClick.y >= b.y && pointerClick.y <= b.y + b.h) {
        openPressed = true;
        pressed['action'] = false;
      }
    }
    if (openPressed && c.eyesBtnT > 0 && !textboxActive()) {
      pressed['alt'] = false;
      this.endGame(false);
      return;
    }

    if (!textboxActive() && pressed['action'] && G.count < 100) {
      pressed['action'] = false;
      G.count++;
      c.pressPop = 1;
      sfxBlipN2();
      const n = G.count;
      const memory = SCRIPT.n2mem[n];
      if (memory) flash(memory, 4);
      else if (n % 4 === 0) flash(SCRIPT.n2filler[this.fillerIdx++ % SCRIPT.n2filler.length], 2.5);
      if (n >= 100) this.endGame(true);
    }
  },
  eyesRect() {
    return { x: W / 2 - 56, y: H - 48, w: 112, h: 16 };
  },
  draw() {
    drawCountingWorld();
    const c = counting;
    // the second button, growing louder
    if (c.eyesBtnT > 0 && !c.ended) {
      const b = this.eyesRect();
      const pulse = 0.5 + 0.5 * Math.sin(T * 2.2);
      const a = c.eyesBtnT * (0.55 + 0.45 * pulse);
      ctx.globalAlpha = a;
      px(b.x, b.y, b.w, b.h, '#4a4470');
      px(b.x + 1, b.y + 1, b.w - 2, b.h - 2, '#241f42');
      drawText('OPEN YOUR EYES', W / 2, b.y + 5, '#d9a5a0', { align: 'center' });
      ctx.globalAlpha = 1;
      if (c.eyesBtnT > 0.6) drawText('X', b.x - 10, b.y + 5, '#8a86a0');
    }
    // the palette warms. first warm frame in the present.
    if (this.warm > 0) {
      ctx.fillStyle = 'rgba(232,176,74,' + (this.warm * 0.18).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(217,165,160,' + (this.warm * 0.1).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  },
};

/* ---------------- main loop ---------------- */

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;
  T += dt;
  sceneTime += dt;

  updateFade(dt);
  updateCine(dt);
  updateTextbox(dt);
  if (scene && scene.update && fade.v < 1) scene.update(dt);

  ctx.fillStyle = '#06060e';
  ctx.fillRect(0, 0, W, H);
  if (scene && scene.draw) scene.draw();
  drawCine();
  drawTextbox();
  drawFade();

  pressed = {};
  anyPressed = false;
  pointerClick = null;
  requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
hardGoto('title');
fade.v = 1; fade.target = 0; fade.speed = 0.8;
requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });

// tiny hook for automated testing
window.__sheep = {
  G, counting, SCENES,
  goto: hardGoto,
  scene: () => sceneName,
  textActive: () => textboxActive(),
  skipText: () => {
    // flush queue but honor the completion callback
    textbox.queue = []; textbox.current = null;
    if (textbox.onEmpty) { const f = textbox.onEmpty; textbox.onEmpty = null; f(); }
  },
};

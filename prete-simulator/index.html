/* ============================================================
   RIGS — nobody here is a sprite sheet. Everyone is a puppet,
   posed fresh every frame, so the walk never slides.
   ============================================================ */
function ik2(ax,ay,bx,by,l1,l2,flip){
  const d=clamp(dist(ax,ay,bx,by), 0.01, l1+l2-0.02);
  const a=Math.atan2(by-ay,bx-ax);
  const c=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const ang=a+c*flip;
  return {x:ax+Math.cos(ang)*l1, y:ay+Math.sin(ang)*l1};
}

/* ---------- sarong — a wrapped sarong, simulated ---------- */
function makeCloth(n, len){
  const s={pts:[], n, len};
  for(let i=0;i<n;i++){ s.pts.push([{x:0,y:0,px:0,py:0},{x:0,y:len*0.5,px:0,py:len*0.5},{x:0,y:len,px:0,py:len}]); }
  return s;
}
function stepCloth(cl, hipX, hipY, wide, dt, wind, hipVX){
  for(let i=0;i<cl.n;i++){
    const st = cl.pts[i];
    const ax = hipX + (i/(cl.n-1)-0.5)*wide;
    st[0].x = ax; st[0].y = hipY;
    for(let j=1;j<st.length;j++){
      const p=st[j];
      let vx=(p.x-p.px)*0.80, vy=(p.y-p.py)*0.80;
      p.px=p.x; p.py=p.y;
      p.x += vx + (wind*0.5 + Math.sin((wind*3)+i*0.7)*0.05 - hipVX*0.006)*dt*60*0.5;
      p.y += vy + 1.35*dt*60;
      // hold the segment length
      const q=st[j-1], seg=cl.len/(st.length-1);
      const d=Math.max(0.01,dist(q.x,q.y,p.x,p.y));
      const f=(d-seg)/d;
      p.x -= (p.x-q.x)*f; p.y -= (p.y-q.y)*f;
      // it is a wrapped skirt, not a flag: never let it swing far off the hip
      const off = 0.6 + j*0.9;
      p.x = clamp(p.x, ax-off, ax+off);
      p.y = Math.max(p.y, hipY + (cl.len/(st.length-1))*j*0.55);
    }
  }
}
const SKIRTS = {
  mudmee:{ base:'#2c4a7c', dark:'#1b3054', mark:'#d8c9a4', name:'indigo ikat' },
  plaid:{  base:'#a83f33', dark:'#7d211a', mark:'#e8dfc8', name:'red check' },
  gold:{   base:'#a8842c', dark:'#7a5f18', mark:'#ffe89a', name:'gold silk' },
  jade:{   base:'#2f6a4c', dark:'#1d472f', mark:'#a8dcb8', name:'jade weave' },
  ash:{    base:'#4a4a52', dark:'#2e2e36', mark:'#6a6a74', name:'the rag you woke in' },
};
function drawCloth(g, cl, sk, face, opt){
  const S2 = SKIRTS[sk] || SKIRTS.ash;
  const oc = opt&&opt.oc, flare = (opt&&opt.flare)||0;
  const N = cl.n, SEG = cl.pts[0].length, STEPS = 4;
  // resolve the cloth into a grid of points, flared outward toward the hem
  const grid=[];
  for(let i=0;i<N;i++){
    const st=cl.pts[i], sp=(i/(N-1)-0.5), col=[];
    for(let j=0;j<SEG-1;j++){
      for(let s=0;s<STEPS;s++){
        const u=s/STEPS, t=(j+u)/(SEG-1);
        col.push({x:lerp(st[j].x,st[j+1].x,u)+sp*flare*t, y:lerp(st[j].y,st[j+1].y,u)});
      }
    }
    const last=st[SEG-1];
    col.push({x:last.x+sp*flare, y:last.y});
    grid.push(col);
  }
  const rows=grid[0].length;
  // silhouette first, so the drape has an edge
  if(oc){
    for(let r=0;r<rows;r++){
      const a=grid[0][r], b=grid[N-1][r];
      const x1=Math.min(a.x,b.x)-1, x2=Math.max(a.x,b.x)+1;
      const y=Math.min(a.y,b.y), h2=Math.max(2,Math.abs((grid[0][Math.min(r+1,rows-1)].y)-a.y)+2);
      pR(g,x1,y-1,x2-x1+1,h2,oc);
    }
  }
  for(let i=0;i<N-1;i++){
    for(let r=0;r<rows;r++){
      const a=grid[i][r], b=grid[i+1][r];
      const nx=grid[i][Math.min(r+1,rows-1)];
      const t=r/(rows-1);
      const front=(i>=N-2)===(face>0);
      let col = front? S2.dark : S2.base;
      if(i===Math.floor(N/2)-1) col = shade(col,0.07);           // a fold catching light
      if(t>0.86) col = shade(col,-0.14);                          // the hem falls into shadow
      const x1=Math.min(a.x,b.x), x2=Math.max(a.x,b.x);
      pR(g,x1,a.y,Math.max(1,x2-x1+1),Math.max(1,Math.abs(nx.y-a.y)+1),col);
      if(r%5===2 && i%2===0) pR(g,x1,a.y,Math.max(1,(x2-x1)*0.7),1,S2.mark);   // the weave
    }
  }
  // hem band and waistband
  const hemA=grid[0][rows-1], hemB=grid[N-1][rows-1];
  pR(g,Math.min(hemA.x,hemB.x),hemA.y,Math.abs(hemB.x-hemA.x)+1,1,S2.mark);
  const a0=cl.pts[0][0], b0=cl.pts[N-1][0];
  pR(g,Math.min(a0.x,b0.x)-1,a0.y-2,Math.abs(b0.x-a0.x)+3,4,S2.dark);
  pR(g,Math.min(a0.x,b0.x)-1,a0.y-2,Math.abs(b0.x-a0.x)+3,1,S2.mark);
  pR(g,Math.min(a0.x,b0.x)+2,a0.y-1,3,3,shade(S2.base,0.1));      // the tuck at the waist
}

/* ============================================================
   THE PRETE — tall as the palms, hands like palm leaves
   ============================================================ */
function makePrete(){
  return {
    x:0, y:0, vx:0, vy:0, face:1, onGround:true,
    phase:0, bob:0, squash:0, lean:0, blink:rnd(2,6),
    bellyX:0, bellyY:0, bellyVX:0, bellyVY:0,
    headLag:0, headV:0, headBob:0, headBV:0,      // the head arrives a moment late
    stride:6,
    swayT:rnd(9), breath:0,
    cloth: makeCloth(6, 15),
    state:'idle', anim:0, reachT:null, alpha:1,
    act:null,                                     // {k,t,dur,hit} — a one-shot gesture
  };
}
/* A gesture: he crouches, reaches, and something happens at the middle of it.
   Everything that used to be instant now costs a beat and looks like work. */
function preteAct(k, dur, hit){ P.act={k, t:0, dur, hit:hit||null}; navStop(); }
function preteBusy(){ return !!P.act; }
/* everything here is slow. he has been dead a while and is in no hurry. */
function stepPrete(p, dt){
  const sp = Math.abs(p.vx);
  /* Step length grows with speed, and the phase advances exactly one half-cycle
     per step length of ground covered. That identity — phaseRate * stride === 1 —
     is the whole reason a planted foot stays put. It was 0.105 * 14 = 1.47, so
     every planted foot slid backwards at half his walking speed, and he moonwalked. */
  p.stride = lerp(p.stride, 6+8*clamp(sp/70,0,1), 1-Math.pow(0.008,dt));
  p.phase += p.vx * dt * Math.PI / (2*p.stride);
  if(sp < 2) p.phase = lerp(p.phase, Math.round(p.phase/Math.PI)*Math.PI, 1-Math.pow(0.02,dt));
  p.lean = lerp(p.lean, clamp(p.vx*0.05,-0.8,0.8), 1-Math.pow(0.02,dt));
  p.squash = lerp(p.squash, 0, 1-Math.pow(0.0006,dt));
  p.swayT += dt*0.55;
  p.breath = Math.sin(p.anim*0.85);
  // the belly, which has opinions of its own
  const tx = -p.vx*0.05, ty = clamp(p.vy*0.035,-1.6,1.6);
  p.bellyVX += (tx - p.bellyX)*22*dt; p.bellyVX *= Math.pow(0.06,dt); p.bellyX += p.bellyVX*dt;
  p.bellyVY += (ty - p.bellyY)*20*dt; p.bellyVY *= Math.pow(0.08,dt); p.bellyY += p.bellyVY*dt;
  // the head drags behind the shoulders and settles late — the whole trick of "fluid"
  const hx = -p.vx*0.055;
  p.headV += (hx - p.headLag)*16*dt; p.headV *= Math.pow(0.10,dt); p.headLag += p.headV*dt;
  const hy = -Math.abs(Math.sin(p.phase))*clamp(sp*0.022,0,1.4);
  p.headBV += (hy - p.headBob)*20*dt; p.headBV *= Math.pow(0.10,dt); p.headBob += p.headBV*dt;
  p.blink -= dt; if(p.blink < -0.14) p.blink = rnd(2.6,7);
  if(p.act){
    const a=p.act; a.t += dt;
    if(a.hit && a.t >= a.dur*0.46){ const f=a.hit; a.hit=null; f(); }   // the moment of contact
    if(a.t >= a.dur) p.act = null;
  }
  p.anim += dt;
}
/* outlined pixel shapes — a 1px darker rim is what makes small art read */
function oTaper(g,x1,y1,x2,y2,w1,w2,c,oc){ pTaper(g,x1,y1,x2,y2,w1+2,w2+2,oc); pTaper(g,x1,y1,x2,y2,w1,w2,c); }
function oEll(g,cx,cy,rx,ry,c,oc){ pEll(g,cx,cy,rx+1,ry+1,oc); pEll(g,cx,cy,rx,ry,c); }
function oRect(g,x,y,w,h,c,oc){ pR(g,x-1,y-1,w+2,h+2,oc); pR(g,x,y,w,h,c); }
/* ink-rimmed shapes. a cartoon is an outline first and a colour second. */
function iTaper(g,x1,y1,x2,y2,w1,w2,c,oc){ pTaper(g,x1,y1,x2,y2,w1+3,w2+3,oc); pTaper(g,x1,y1,x2,y2,w1,w2,c); }
function iEll(g,cx,cy,rx,ry,c,oc){ pEll(g,cx,cy,rx+2,ry+2,oc); pEll(g,cx,cy,rx,ry,c); }

function drawPrete(g, p, o={}){
  const face = p.face, gold = o.gold;
  const cos = o.cos || GS.cos;
  const BODY = gold?'#f0dfae':PAL.pale;
  const SHD  = gold?'#c9a45e':PAL.paleD;
  const HI   = gold?'#fff6dc':PAL.paleL;
  const OC   = gold?'#5c4418':'#2b2620';        // one hard ink line all the way round
  const alpha = o.alpha!==undefined?o.alpha:(p.alpha||1);
  if(alpha<1){ g.save(); g.globalAlpha=alpha; }

  const rise0 = o.rise || p.rise || 0;
  const bx = p.x, by = p.y - rise0;
  const sq = clamp(p.squash,-1,1);
  const sY = 1 - sq*0.15, sX = 1 + sq*0.12;
  const sway = Math.sin(p.swayT)*0.9;           // he never stands quite still

  /* the shape of him: two storeys of leg, a narrow ribbed chest, arms that
     hang past the hip, and a head far too big and far too awake */
  const LEG=42, TH=20, SN=20, AU2=23, AL=25;
  const sp = Math.abs(p.vx);
  const stride = p.stride;
  const lift   = clamp(sp*0.11, 0, 6);
  const bobA   = p.onGround ? Math.abs(Math.sin(p.phase*2))*clamp(sp*0.03,0,2) : 0;
  /* a gesture bends him in the middle: down and up over its whole length,
     so the crouch, the reach and the head all move on one clock. */
  const ACT = p.act;
  const au   = ACT ? clamp(ACT.t/ACT.dur, 0, 1) : 0;
  const abell= ACT ? Math.sin(Math.pow(au,0.8)*Math.PI) : 0;
  const kneel= !ACT ? 0
             : ACT.k==='plant'||ACT.k==='pick' ? abell*16
             : ACT.k==='water' ? abell*7
             : ACT.k==='wai'   ? abell*3
             /* eating is three beats: stoop for the bowl, lift it to the face,
                and straighten again with nothing in you. The knees only bend
                for the first of them. */
             : ACT.k==='eat'   ? clamp(1-au*3.2,0,1)*15 : 0;
  /* CARRYING. A hundred and forty pounds of glazed water jar against the belly:
     the knees give a little, the whole body leans back off the load, and the
     walk rolls side to side because that is what carrying does to a stride. */
  const carry = clamp(o.carry||0,0,2);
  const cWob  = carry? Math.sin(p.phase*2)*1.5*carry + Math.sin(p.swayT*0.9)*0.7*carry : 0;
  const hipY = by - LEG*sY - bobA + kneel + carry*2.2;
  const hipX = bx + p.lean*2.4 + sway*0.4 + cWob*0.5;
  const chestY = hipY - 26*sY + p.breath*0.4;
  const chestX = hipX + p.lean*3.2 + sway*0.5 - carry*3.4*face + cWob*0.4;
  const shY = chestY - 2;

  function legPose(i){
    const back = i===0;
    let fx, fy;
    if(!p.onGround){ fx=(back?-6:6)*face; fy = p.vy<0? -4:1; }
    else if(p.state==='block'){ fx=(back?-10:9)*face; fy=0; }
    else {
      /* A cosine can only hold a foot still for one instant, so a cosine walk
         always skates. Split it instead: half the cycle is STANCE, where the
         foot tracks straight back at exactly his walking speed and therefore
         does not move over the ground at all; the other half is SWING.
         The sign comes from the phase, which is signed — multiplying by face
         as well is what sent the whole cycle backwards when he faced left. */
      const t=((p.phase+i*Math.PI)%TAU+TAU)%TAU;
      if(t<Math.PI){                                   // planted
        fx=stride*(1-2*t/Math.PI); fy=0;
      } else {                                         // swinging through
        const u=(t-Math.PI)/Math.PI;
        const e=u<0.5? 2*u*u : 1-2*(1-u)*(1-u);        // ease out of the ground and back into it
        fx=-stride+2*stride*e; fy=-Math.sin(u*Math.PI)*lift;
      }
    }
    return {back, fx:bx+fx, fy:by+fy};
  }
  function drawLeg(i){
    const L=legPose(i), col=L.back?SHD:BODY;
    const hx0=hipX+(L.back?-2.4:2.4)*face;
    const knee=ik2(hx0,hipY,L.fx,L.fy-5,TH*sY,SN*sY,face>0?1:-1);
    iTaper(g,hx0,hipY-2,knee.x,knee.y,3.2,2.6,col,OC);        // thigh
    iTaper(g,knee.x,knee.y,L.fx,L.fy-5,2.6,2.0,col,OC);       // shin, thinner still
    iEll(g,knee.x,knee.y,2,2,col,OC);                         // a knob of a knee
    // one long flat foot with a heel under the ankle
    const f0=L.fx-(face>0?4:9);
    pR(g,f0-1,L.fy-5,15,5,OC);
    pR(g,f0,L.fy-4,13,3,col);
    pR(g,f0,L.fy-4,13,1.2,L.back?shade(SHD,0.08):shade(BODY,0.14));
    pEll(g,L.fx,L.fy-6,3,3,OC); pEll(g,L.fx,L.fy-6,2,2,col);
  }
  function armPose(back){
    let hx2,hy2;
    if(ACT && ACT.k==='wai'){
      // both palms together at the chest, the way you thank anyone here
      hx2=chestX+(back?2.5:5.5)*face; hy2=chestY+30-abell*27;
    }
    else if(ACT && ACT.k==='give'){
      hx2=chestX+(10+abell*13)*face+(back?-6*face:0); hy2=chestY+34-abell*13+(back?5:0);
    }
    else if(carry && (!ACT || ACT.k==='pick')){
      /* both hands under the belly of it, near hand in front and a little
         lower, so the elbows fall outward and down the way they do when you
         are taking the weight rather than reaching for something */
      hx2 = chestX + (back? 4.5 : 10.5)*face + cWob*0.3;
      hy2 = chestY + (back? 26 : 23) - carry*1.5;
    }
    else if(ACT && ACT.k==='eat'){
      /* down to the step, up to the mouth, and back down again. Both hands
         stay on it the whole way — it is the one thing anybody has given him. */
      const up = clamp(au<0.30? au/0.30 : au<0.78? 1 : 1-(au-0.78)/0.22, 0, 1);
      /* he tries. The tremble is the trying, and it is the only part of this
         that does anything at all. */
      const tre = (au>0.38 && au<0.72)? Math.sin(au*180)*0.9 : 0;
      hx2 = chestX + (9.5+ (1-up)*3)*face + (back? -5.5*face : 0);
      hy2 = lerp(chestY+40, chestY-4, up) + tre + (back? 3 : 0);
    }
    else if(ACT){
      // down into the earth, both hands, the near one leading
      const reach = ACT.k==='water'? 21 : 15;
      hx2 = hipX + (reach*abell + 3)*face + (back? -9*face : 0);
      hy2 = by - 6 - (1-abell)*30 + (back? 7 : 0);
    }
    else if(o.armTarget){ hx2=o.armTarget.x-(back?12*face:0); hy2=o.armTarget.y+(back?10:0); }
    else if(p.state==='block'){ hx2=chestX+(back?7:13)*face; hy2=chestY+9; }
    else if(p.state==='wail'){ hx2=chestX+(back?-14:16)*face; hy2=chestY-18+(back?9:0); }
    else if(!p.onGround){ hx2=chestX-(back?5:9)*face; hy2=chestY+(p.vy<0?13:30); }
    else {
      /* they hang almost straight, swing a beat behind the legs, and drift
         on their own when he is standing still. never back across the chest. */
      const ph=p.phase+(back?Math.PI:0)+0.5;
      hx2=chestX+Math.cos(ph)*stride*0.62+(back?-5:7)*face+sway*(back?0.6:1.1);
      hy2=chestY+45+Math.abs(Math.sin(ph))*2+Math.sin(p.swayT*1.3+(back?2:0))*1.2;
    }
    return {hx2,hy2};
  }
  function drawArm(back){
    const {hx2,hy2}=armPose(back);
    const col=back?SHD:BODY;
    const sx0=chestX+(back?-4:4)*face;
    /* both elbows drop outward under a load — the back one bending the usual
       way put its point above the shoulder, which reads as a hand on the hip */
    const bend = (carry || (ACT&&ACT.k==='eat'))? (face>0?1:-1)
                 : (back?(face>0?1:-1):(face>0?-1:1));
    const el=ik2(sx0,shY,hx2,hy2,AU2,AL,bend);
    iTaper(g,sx0,shY,el.x,el.y,2.8,2.4,col,OC);
    iTaper(g,el.x,el.y,hx2,hy2,2.4,2.0,col,OC);
    iEll(g,el.x,el.y,1.7,1.7,col,OC);
    /* the hands: long splayed fingers, drawn as a fan. outline the whole
       hand first, then fill it, or the rims eat the palm. */
    const ang=Math.atan2(hy2-el.y,hx2-el.x), cx2=Math.cos(ang), cy2=Math.sin(ang);
    const px2=hx2+cx2*2.6, py2=hy2+cy2*2.6;
    const spread=0.38, FL=8.6;
    const tips=[];
    for(let f2=0;f2<4;f2++){ const fa=ang+(f2-1.5)*spread+Math.sin(p.swayT*1.7+f2)*0.03;
      tips.push({x:px2+Math.cos(fa)*FL, y:py2+Math.sin(fa)*FL}); }
    const thx=px2-cx2*0.6-cy2*4.2*face, thy=py2-cy2*0.6+cx2*4.2*face;
    for(const t of tips) pTaper(g,px2,py2,t.x,t.y,2.9,2.1,OC);
    pTaper(g,px2,py2,thx,thy,2.7,2.0,OC);
    pEll(g,px2,py2,4,4,OC);
    pEll(g,px2,py2,2.9,2.9,col);
    for(const t of tips) pTaper(g,px2,py2,t.x,t.y,1.8,1.2,col);
    pTaper(g,px2,py2,thx,thy,1.7,1.1,col);
    if(!back) pEll(g,px2-cx2*1.2,py2-cy2*1.2,1.4,1.4,HI);
    return {x:px2,y:py2};
  }

  /* ---- back to front ---- */
  drawLeg(0);
  const handB = drawArm(true);
  drawLeg(1);

  stepCloth(p.cloth, hipX, hipY-3, 12*sX, o.dt||0.016, o.wind||0, p.vx);
  drawCloth(g, p.cloth, cos.skirt||'ash', face, {oc:OC, flare:3});

  // torso — a narrow column and two sloped shoulders
  iTaper(g, hipX, hipY-3, chestX, chestY+6, 4.0, 6.2, BODY, OC);
  pEll(g, chestX, chestY, 6.6, 8.8, OC);
  pEll(g, chestX, chestY, 5.4, 7.6, BODY);
  pEll(g, chestX+3*face, chestY+1, 2.6, 5.6, SHD);
  pEll(g, chestX-3.2*face, chestY-3, 2.4, 2.0, HI);
  // the ribs, which he would rather you did not look at
  for(let i=0;i<4;i++){
    const ry2 = chestY-3.4+i*3.2, w2 = 5.6-Math.abs(i-1.4)*0.7;
    pTaper(g, chestX-w2, ry2, chestX+w2, ry2+0.5*face, 1.1, 1.1, shade(BODY,-0.16));
  }
  pR(g, chestX-0.5, chestY-4, 1, 11, shade(BODY,-0.10));        // sternum
  pR(g, chestX-6.2, chestY-5.6, 12.4, 1.4, shade(BODY,-0.14));  // collarbone

  // the belly — the whole point of a prete
  const belX = lerp(hipX,chestX,0.24) + p.bellyX;
  const belY = hipY - 8.6*sY + p.bellyY;
  const brx = 7.8*sX, bry = 6.8*sY;
  pEll(g, belX, belY, brx+2, bry+2, OC);
  pEll(g, belX, belY, brx, bry, BODY);
  pEll(g, belX + 3.2*face, belY+1.4, brx*0.52, bry*0.66, SHD);
  pEll(g, belX - 3*face, belY-2.8, brx*0.3, bry*0.28, HI);
  pR(g, belX-0.6*face, belY+3.2, 1.6, 1.8, SHD);                // navel
  if(cos.goldleaf) for(let i=0;i<6;i++) pR(g, belX-5+((i*8)%10), belY-4+((i*5)%8), 2,2, PAL.goldL);

  const handF = drawArm(false);
  o.hands=[handB,handF];

  /* ---- the head. it is the reason anybody remembers him. ---- */
  const headTilt = ACT ? (ACT.k==='wai'? -abell*2
                        : ACT.k==='eat'? (au<0.78? 2+clamp(au/0.30,0,1)*7 : 9-17*(au-0.78)/0.22)
                        : abell*5) : 0;   // he looks at his hands
  const headY = chestY - 20 + p.headBob + Math.sin(p.anim*1.1)*0.5 + headTilt;
  /* his face goes to the bowl, because the bowl is not going anywhere near it */
  const eatLean = (ACT && ACT.k==='eat') ? clamp(au/0.30,0,1)*(au<0.82?1:1-(au-0.82)/0.18)*4.5 : 0;
  const headX = chestX + p.lean*2.2 + p.headLag + sway*0.8 + (o.headX||0) + carry*2.2*face + eatLean*face
              + (ACT && ACT.k!=='wai' ? abell*3*face : 0);
  iTaper(g, chestX, chestY-5, headX, headY+9, 3.0, 2.6, shade(SHD,-0.08), OC);
  const HRX=11.2, HRY=12.0;
  // a lumpy skull, not an egg
  pEll(g, headX, headY, HRX+2, HRY+2, OC);
  pEll(g, headX-0.6*face, headY-7.2, HRX*0.86+2, 5.6, OC);
  pEll(g, headX, headY, HRX, HRY, BODY);
  pEll(g, headX-0.6*face, headY-7.2, HRX*0.86, 4.8, BODY);
  pEll(g, headX+5*face, headY+1.4, HRX*0.5, HRY*0.66, SHD);   // the shaded side
  pEll(g, headX-3.4*face, headY-6, 3.4, 2.2, HI);               // skull highlight
  pEll(g, headX+1.2*face, headY+8.4, 4.6, 3.4, BODY);           // a small pointed jaw
  pR(g, headX-10.6*face, headY+1.6, 2.6, 4.2, SHD);              // ear
  pEll(g, headX-10.8*face, headY+2.2, 1.4, 1.8, OC);
  // a few hairs, and not one more
  for(let i2=0;i2<7;i2++){
    const hx3=headX+(i2-3)*2.5*face;
    const hh=3+((i2*5)%4);
    pTaper(g, hx3, headY-11, hx3+Math.sin(p.swayT*1.6+i2)*1.8-0.8*face, headY-11-hh, 1.4, 0.5, '#8a8176');
  }

  /* ---- the eyes, which are the only big thing on him that is not a bone ----
     Everyone else in this village got brows, lids and a mouth with more than
     one shape. He had two saucers and a full stop, which is why he played
     every scene with the same look on his face. He gets the same rig now:
     p.brow lifts and drops them, p.tilt turns sorry into having none of it,
     p.eye opens them wide or closes them to slits, p.mouthS bends the mouth,
     p.blush puts two pixels on the cheekbones. */
  const EYE='#f4f1e6', RING='#8f8a80', PUP='#211f26';
  const ey = headY - 0.6 + (p.brow||0)*0.35;
  const nearX = headX + 4.2*face, farX = headX - 5.0*face;
  const eOpen = clamp(1 + (p.eye||0)*0.30, 0.45, 1.42);
  const lid   = clamp(-(p.eye||0), 0, 1);            // weariness shuts them
  pEll(g, farX, ey, 5.2, 5.3*eOpen, RING);
  pEll(g, nearX, ey, 6.1, 6.2*eOpen, RING);
  pEll(g, farX, ey, 4.1, 4.2*eOpen, EYE);
  pEll(g, nearX, ey, 4.9, 5.0*eOpen, EYE);
  const pdx = 0.7*face + Math.sin(p.swayT*0.8)*0.35, pdy = Math.sin(p.anim*0.6)*0.4;
  const pr = 1 + clamp(p.eye||0,-0.6,1)*0.18;         // a startled pupil is small
  pEll(g, farX+pdx, ey+pdy, 1.9/pr, 2.0/pr, PUP);
  pEll(g, nearX+pdx, ey+pdy, 2.3/pr, 2.4/pr, PUP);
  pR(g, farX+pdx-1.5, ey+pdy-1.7, 1.2, 1.2, '#fffdf6');
  pR(g, nearX+pdx-1.8, ey+pdy-1.9, 1.4, 1.4, '#fffdf6');
  if(lid>0.05){
    pEll(g, farX, ey-4.6*eOpen+lid*4.4, 4.3, 2.6*lid+0.6, BODY);
    pEll(g, nearX, ey-5.4*eOpen+lid*5.2, 5.1, 3.0*lid+0.6, BODY);
  }
  if(o.angry){ pR(g, farX-4.6, ey-5.4, 9.2, 1.6, PAL.ember); pR(g, nearX-5.4, ey-5.8, 10.8, 1.8, PAL.ember); }
  /* the brows. Two bones over two saucers, and the inner ends do the acting. */
  {
    const bw=(p.brow||0), bt=(p.tilt||0);
    const by0 = ey - 7.0*eOpen + bw*1.6;
    const BR = shade(SHD,-0.22);
    // near brow: inner end is the one towards the nose
    pTaper(g, nearX-5.0, by0-bt*1.6, nearX+5.2, by0+bt*1.0, 1.9, 1.5, BR);
    pTaper(g, farX-4.2,  by0+0.4+bt*0.7, farX+4.4, by0+0.2-bt*0.5, 1.6, 1.3, BR);
    if(bt>0.9){ pR(g, R(nearX-5.4), R(by0-bt*1.6-1.4), 3, 1, BR); }   // really sorry
    if(bt<-0.9){ pR(g, R(nearX+3.4), R(by0+1.4), 3, 1, BR); }         // really not
  }
  // a blink: two lids come down over the whole business
  if(p.blink<0){
    pEll(g, farX, ey, 4.4, 4.5, BODY); pEll(g, nearX, ey, 5.2, 5.3, BODY);
    pR(g, farX-4.4, ey-0.4, 8.8, 1.2, SHD); pR(g, nearX-5.2, ey-0.6, 10.4, 1.3, SHD);
  }
  /* one small orange nose, which is somehow the saddest part */
  pTri(g, headX+1.8*face, ey+6.2, headX-0.8*face, ey+1.4, headX+4.2*face, ey+1.8, '#b8622c');
  pTri(g, headX+1.8*face, ey+5.4, headX+0.2*face, ey+2.0, headX+3.6*face, ey+2.2, '#e08a44');
  pR(g, headX+0.6*face, ey+4.4, 1, 1, '#f0a860');
  /* the mouth. Still the eye of a needle — that is the whole joke of him —
     but a needle can still turn up at the corners or down at them. */
  /* the mouth opens for the bowl as far as it opens for anything, which is
     barely, and the whole point is that it is not enough */
  let mo=clamp(o.mouth||0,0,1);
  if(ACT && ACT.k==='eat'){
    const up = au<0.30? 0 : au<0.78? (au-0.30)/0.48 : 1-(au-0.78)/0.22;
    mo = Math.max(mo, clamp(up,0,1)*0.42);
  }
  const ms=clamp(p.mouthS===undefined?0:p.mouthS,-1,1);
  const mx0=headX+1.4*face, my0=ey+9.6;
  pEll(g, mx0, my0, 1.7+mo*2.2, 2.1+mo*2.6, '#241c22');
  pEll(g, mx0, my0+0.8+mo, 1.1+mo, 1.0+mo, '#5e3f48');
  if(mo<0.2 && ms>0.2){                       // the corners lift
    pR(g, R(mx0-2.6-ms), R(my0+1.0-ms*1.2), 2, 1, '#241c22');
    pR(g, R(mx0+1.6+ms), R(my0+1.0-ms*1.2), 2, 1, '#241c22');
  } else if(mo<0.2 && ms<-0.2){               // and drop
    pR(g, R(mx0-2.6+ms*0.6), R(my0-1.4-ms*1.0), 2, 1, '#241c22');
    pR(g, R(mx0+1.6-ms*0.6), R(my0-1.4-ms*1.0), 2, 1, '#241c22');
  }
  /* the bowl. Drawn after the head, because when he raises it the bowl is
     between you and his face — that is the shot. */
  if(ACT && ACT.k==='eat'){
    const up = clamp(au<0.30? au/0.30 : au<0.78? 1 : 1-(au-0.78)/0.22, 0, 1);
    // exactly where the hands are, two pixels in front of them
    const tre = (au>0.38 && au<0.72)? Math.sin(au*180)*0.9 : 0;
    const bx2 = chestX + (11.5+(1-up)*3)*face;
    const by2 = lerp(chestY+40, chestY-1, up) + tre;
    pEll(g,bx2,by2+2.4,6.4,2.2,'rgba(12,9,20,0.3)');
    pEll(g,bx2,by2,6.2,4.4,'#3a2c20');
    pEll(g,bx2,by2,5.2,3.6,'#f2e8d2');
    pEll(g,bx2,by2-0.6,4.4,2.4,'#e2d4b8');
    pEll(g,bx2,by2-1.2,3.6,1.6,'#fdfaf0');
    pR(g,bx2-3,by2-1.6,2,1,'#cfc0a2');
    // steam, which is the whole of his supper
    for(let i=0;i<5;i++){
      const t=(p.anim*0.9+i*0.2)%1;
      const sxx=bx2+Math.sin(t*5+i)*2.4, syy=by2-3-t*13;
      pR(g,sxx,syy,1,1, rgba('#f6f0dc', (1-t)*0.5));
    }
  }
  /* and the water jars, in the same place between the arms. Hugged against
     the belly rather than floating off the hip: it is the heaviest thing in
     the game and it should look like it is being held, not carried past. */
  if(carry && typeof drawJarBody==='function'){
    for(let i=0;i<carry;i++){
      const jw=(o.carryWater&&o.carryWater[i]&&o.carryWater[i].water)||0;
      const jx=chestX+(7.5+i*0.8)*face+cWob*0.8;
      const jy=chestY+33-i*23+Math.sin(p.phase*2+i)*0.9;
      drawJarBody(g,jx,jy,1.32-i*0.1,jw);
    }
  }
  if(p.blush){
    pR(g, R(headX+6.4*face), R(ey+4.2), 3, 1, '#c4706a');
    pR(g, R(headX-7.4*face), R(ey+4.0), 3, 1, '#b3625e');
  }

  /* ---- what you chose to wear ---- */
  if(cos.garland){
    for(let i=0;i<12;i++){ const a=Math.PI*(i/11);
      pEll(g, chestX+Math.cos(a+Math.PI)*8, chestY-1+Math.sin(a)*8, 1.8,1.8, i%3===0?'#ffce54':'#f6f0dc'); }
    pEll(g, chestX, chestY+9, 1.8, 2.8, PAL.jadeL);
  }
  if(cos.sash){
    pTaper(g, chestX-6, chestY-4, hipX+7*face, hipY-6, 5.4, 3, '#d8b04a');
    pTaper(g, chestX-6, chestY-4, hipX+7*face, hipY-6, 2, 1.1, '#ffe89a');
  }
  if(cos.beads) for(let i=0;i<9;i++){ const a=Math.PI*(i/8);
    pEll(g, chestX+Math.cos(a+Math.PI)*7, chestY+Math.sin(a)*6.6, 1.5,1.5, i%2?'#6b4a2c':'#8a6440'); }
  if(cos.halo){
    const hr=16+Math.sin(p.anim*1.4)*0.9;
    for(let i=0;i<30;i++){ const a=i/30*TAU + p.anim*0.22;
      pR(g, headX+Math.cos(a)*hr, headY-1+Math.sin(a)*hr*0.9, 1,1, i%2?PAL.goldL:PAL.gold); }
  }
  if(alpha<1) g.restore();
  return {hipX,hipY,chestX,chestY,headX,headY,hands:o.hands};
}

/* ============================================================
   VILLAGERS — the reason any of this matters
   ============================================================ */
function makeVillager(cfg){
  return Object.assign({ x:0,y:0,vx:0,face:1,phase:0,anim:rnd(9),state:'idle',
    cloth:makeCloth(4,9), bob:0 }, cfg);
}
function drawVillager(g, v, o={}){
  const sk=v.skin||PAL.skin, skD=v.skinD||PAL.skinD;
  const sh=v.shirt||'#4a7a9e', shD=v.shirtD||shade(v.shirt||'#4a7a9e',-0.25);
  const face=v.face, sp=Math.abs(v.vx);
  const LEG=9, TH=5, SN=5;
  const stride=clamp(sp*0.2,0,4.6), lift=clamp(sp*0.1,0,2.4);
  const bob = Math.abs(Math.sin(v.phase*2))*clamp(sp*0.03,0,1);
  const hipY=v.y-LEG-bob, hipX=v.x;
  const rk  = v.react ? v.react.k : null;
  const wai = v.state==='wai' || o.wai || rk==='wai';
  // legs
  for(let i=0;i<2;i++){
    const ph=v.phase+i*Math.PI, c=Math.cos(ph), s=Math.sin(ph);
    // same rule as the prete: the planted foot slides back while cos falls, so
    // the lift belongs on the rising half or the villagers moonwalk too
    const fx=v.x+c*stride*face, fy=v.y+(s<0? -Math.abs(s)*lift : 0);
    const knee=ik2(hipX+(i?1:-1),hipY,fx,fy-1,TH,SN,face>0?1:-1);
    const col=i===0? (v.skirt? shade(v.legs||'#3a3a44',-0.25):shade(v.legs||'#3a3a44',-0.2)) : (v.legs||'#3a3a44');
    if(!v.skirt){ pLimb(g,hipX+(i?1:-1),hipY,knee.x,knee.y,3,col); pLimb(g,knee.x,knee.y,fx,fy-1,2.5,col); }
    pR(g,fx-2,fy-2,4,2,'#3a2c26');
  }
  if(v.skirt){   // sarong on the women, as in any village
    stepCloth(v.cloth,hipX,hipY-1,9,o.dt||0.016,o.wind||0,v.vx);
    drawCloth(g,v.cloth,v.skirtPat||'plaid',face,{flare:4});
  }
  // torso
  const chestY=hipY-8;
  pR(g,hipX-4,chestY,8,9,sh); pR(g,hipX+(face>0?1:-4),chestY,3,9,shD);
  pR(g,hipX-4,chestY,8,1,shade(sh,0.15));
  // arms
  for(let i=0;i<2;i++){
    const back=i===0;
    let hx2,hy2;
    if(wai){ hx2=hipX+1.5*face; hy2=chestY-4; }
    else if(rk==='wave' && !back){ hx2=hipX+4.5*face; hy2=chestY-4+Math.sin(v.anim*13)*2.6; }
    else if(rk==='clap'){ hx2=hipX+(back?1.2:3.2)*face; hy2=chestY+1-Math.abs(Math.sin(v.anim*11))*2.4; }
    else if(v.carry && !back){ hx2=hipX+5*face; hy2=chestY+3; }
    else { const ph=v.phase+(back?Math.PI:0); hx2=hipX+Math.cos(ph)*stride*0.7*face; hy2=chestY+9; }
    const el=ik2(hipX+(back?-3:3)*face,chestY+1,hx2,hy2,5,5,back?(face>0?-1:1):(face>0?1:-1));
    pLimb(g,hipX+(back?-3:3)*face,chestY+1,el.x,el.y,2.6,back?shD:sh);
    pLimb(g,el.x,el.y,hx2,hy2,2.4,back?skD:sk);
    pEll(g,hx2,hy2,1.6,1.6,back?skD:sk);
  }
  if(wai){ pEll(g,hipX+1.6*face,chestY-5,2.2,3,sk); pR(g,hipX+0.6*face,chestY-7,2,3,skD); }
  // head
  const hy3=chestY-6;
  pEll(g,hipX+0.5*face,hy3,4.2,4.6,sk);
  pEll(g,hipX+2.4*face,hy3+0.4,2.4,3.6,skD);
  pR(g,hipX+2*face,hy3-1,1,1,'#2c2020'); pR(g,hipX-1*face,hy3-1,1,1,'#2c2020');
  // hair
  const hc=v.hairC||'#241c18';
  if(v.hair==='bald'){ pEll(g,hipX+0.5*face,hy3-2,4,2,skD); }
  else if(v.hair==='bun'){ pEll(g,hipX+0.5*face,hy3-2.6,4.3,2.6,hc); pEll(g,hipX-3.4*face,hy3-3.6,2.2,2.2,hc); }
  else if(v.hair==='tails'){ pEll(g,hipX+0.5*face,hy3-2.4,4.3,2.6,hc); pEll(g,hipX-4.6*face,hy3+1,1.6,2.6,hc); pEll(g,hipX+4.6*face,hy3+1,1.6,2.6,hc); }

    for(let i=0;i<4;i++){ const lx=x+(-3+i*2.6)*f, s2=Math.sin(ph+i*1.6)*1.6;
      pLimb(g,lx,y-4,lx+s2,y-1,1.8, i%2?OD:O); }
    pTaper(g,x-6*f,y-7,x-10*f,y-11+Math.sin(t*3)*2,3,2,OD);
  }

/* ============================================================
   PARTICLES
   ============================================================ */
const PT = [];
function part(o){ PT.push(Object.assign({t:0,life:1,vx:0,vy:0},o)); }
function pOrb(x,y,d=0){ part({k:'orb',x,y,t:-d,life:8}); }
function pSpark(x,y,n=6,c=PAL.gold){ for(let i=0;i<n;i++) part({k:'sp',x:x+rnd(-4,4),y:y+rnd(-4,4),vx:rnd(-30,30),vy:rnd(-50,-8),life:rnd(.4,.9),c}); }
function pDust(x,y,n=5){ for(let i=0;i<n;i++) part({k:'dust',x:x+rnd(-5,5),y,vx:rnd(-26,26),vy:rnd(-16,-3),life:rnd(.3,.7)}); }
function pSmoke(x,y,d=0){ part({k:'smoke',x,y,t:-d,life:3,sw:rnd(TAU)}); }
function pHeart(x,y){ part({k:'heart',x,y,vy:-14,life:1.4}); }
function pRing(x,y,c='#fff0c0',r=70){ part({k:'ring',x,y,life:.6,c,r}); }
function pPetal(x,y,c){ part({k:'petal',x:x+rnd(-40,40),y:y-rnd(20,70),vx:rnd(-6,6),vy:rnd(10,20),life:rnd(2,3.6),sw:rnd(TAU),c:c||PAL.goldL}); }
function pSplash(x,y){ for(let i=0;i<8;i++) part({k:'water',x,y,vx:rnd(-40,40),vy:rnd(-60,-15),life:rnd(.3,.7)}); }
function pEmber(x,y){ part({k:'ember',x,y,vx:rnd(-8,8),vy:rnd(-22,-8),life:rnd(.8,1.7)}); }
function pPop(x,y,c){ for(let i=0;i<10;i++) part({k:'pop',x,y,vx:rnd(-40,40),vy:rnd(-60,-10),life:rnd(.4,.8),c}); }
function pMoth(x,y){ part({k:'moth',x,y,life:99,sw:rnd(TAU),hx:x,hy:y}); }
function stepParts(dt){
  for(let i=PT.length-1;i>=0;i--){
    const p=PT[i]; p.t+=dt;
    if(p.t<0) continue;
    switch(p.k){
      case 'orb':{
        const tx=P.x, ty=P.y-44, d=Math.max(1,dist(p.x,p.y,tx,ty));
        const sp2=Math.min(190,40+p.t*120);
        if(d<6){ addMerit(1,true); AU.orb(); pSpark(tx,ty,3); PT.splice(i,1); continue; }
        p.x+=(tx-p.x)/d*sp2*dt+Math.sin(p.t*7)*0.5; p.y+=(ty-p.y)/d*sp2*dt;
        break; }
      case 'smoke': p.y-=dt*11; p.x+=Math.sin(p.t*2+p.sw)*0.3; break;
      case 'sp': case 'dust': case 'pop': case 'water':
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.k==='water'?300:120)*dt;
        if(p.k==='dust') p.vx*=Math.pow(0.1,dt);
        break;
      case 'clod': {
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=470*dt; p.sw+=dt*7*sign(p.vx||1);
        const gy=groundY(p.x);
        if(p.y>gy){ p.y=gy; p.vy*=-0.22; p.vx*=0.42; if(Math.abs(p.vy)<20){ p.vy=0; p.vx=0; } }
        break; }
      case 'heart': p.y+=p.vy*dt; break;
      case 'petal': p.y+=p.vy*dt; p.x+=p.vx*dt+Math.sin(p.t*3+p.sw)*0.5; break;
      case 'ember': p.x+=p.vx*dt+Math.sin(p.t*3)*0.3; p.y+=p.vy*dt; break;
      case 'moth': p.x=p.hx+Math.sin(p.t*2.2+p.sw)*13+Math.sin(p.t*0.7)*5;
                   p.y=p.hy+Math.cos(p.t*3.1+p.sw)*7; break;
    }
    if(p.k!=='moth' && p.t>=p.life) PT.splice(i,1);
  }
}
function drawParts(g){
  for(const p of PT){
    if(p.t<0) continue;
    const lt=p.t/p.life, a=1-lt;
    switch(p.k){
      case 'orb':
        pR(g,p.x-1,p.y-1,3,3,PAL.gold); pR(g,p.x,p.y-2,1,5,rgba(PAL.goldL,0.6)); pR(g,p.x-2,p.y,5,1,rgba(PAL.goldL,0.6));
        break;
      case 'smoke': g.globalAlpha=0.3*a; pEll(g,p.x,p.y,2-lt,2-lt,'#c8c0d8'); g.globalAlpha=1; break;
      case 'sp': g.globalAlpha=a; pR(g,p.x,p.y,1,1,p.c); if(lt<0.4){pR(g,p.x-1,p.y,1,1,p.c);pR(g,p.x+1,p.y,1,1,p.c);} g.globalAlpha=1; break;
      case 'dust': g.globalAlpha=a*0.6; pEll(g,p.x,p.y,1+lt*2,1+lt,'#9a8f7a'); g.globalAlpha=1; break;
      case 'clod': { const z=p.sz||2, c=(p.sz|0)%2? '#4e3a26':'#5f4830';
        g.globalAlpha=clamp(a*2,0,1);
        const w=z+1+Math.abs(Math.cos(p.sw))*z;
        pR(g,p.x-w/2,p.y-z,w,z+1,c);
        pR(g,p.x-w/2,p.y-z,w,1,shade(c,0.18));
        g.globalAlpha=1; break; }
      case 'pop': g.globalAlpha=a; pEll(g,p.x,p.y,1.6-lt,1.6-lt,p.c); g.globalAlpha=1; break;
      case 'heart': g.globalAlpha=a; pR(g,p.x-1,p.y-1,1,1,'#ff8fae'); pR(g,p.x+1,p.y-1,1,1,'#ff8fae'); pR(g,p.x-1,p.y,3,1,'#ff8fae'); pR(g,p.x,p.y+1,1,1,'#ff8fae'); g.globalAlpha=1; break;
      case 'ring': g.globalAlpha=a*0.7; g.strokeStyle=p.c; g.lineWidth=1; g.beginPath(); g.arc(R(p.x),R(p.y),4+lt*p.r,0,TAU); g.stroke(); g.globalAlpha=1; break;
      case 'petal': g.globalAlpha=a; pR(g,p.x,p.y,2,1,p.c||PAL.goldL); g.globalAlpha=1; break;
      case 'water': g.globalAlpha=a; pR(g,p.x,p.y,1,2,'#8fc4e8'); g.globalAlpha=1; break;
      case 'ember': g.globalAlpha=a*0.9; pR(g,p.x,p.y,1,1,lt<0.5?'#ffd257':PAL.ember); g.globalAlpha=1; break;
      case 'moth': { const f=Math.sin(p.t*22)*2.2;
        pR(g,p.x,p.y,2,1,'#e8dfc8'); pR(g,p.x-1,p.y-f*0.5,1,1,'#f6f0dc'); pR(g,p.x+2,p.y+f*0.5,1,1,'#f6f0dc'); break; }
    }
  }
}

let meritFlash=0;
function addMerit(n, quiet){
  const b=GS.merit;
  GS.merit=clamp(GS.merit+n,0,999);
  if(GS.merit>b){
    meritFlash=1; if(!quiet) AU.ding();
    /* a prete is sustained by merit transferred to it. That is the folklore,
       and it happens to be exactly the refill this loop needed: the way to
       get your strength back is to be some use to somebody. */
    if(typeof feed==='function'){ feed((GS.merit-b)*2); DAY.meritT+=(GS.merit-b); }
  }
  saveGame();
}
function toast(text, c=PAL.gold){ GS.toasts.push({text,c,t:0}); if(GS.toasts.length>4) GS.toasts.shift(); }
let DLG=null;
function say(lines, done){ DLG={lines,i:0,ch:0,done:done||null}; }
/* The line you read is the translated one, and the typewriter has to count
   its letters rather than the English original's — otherwise Thai dialogue
   either stops half way or finishes before it has been drawn. */
const dlgText = ln => L(String(ln.t));
function stepDlg(dt){
  if(!DLG) return;
  const ln=DLG.lines[DLG.i], txt=dlgText(ln);
  DLG.ch += dt*52;
  if(press('act')||press('tap')){
    AU.blip();
    if(DLG.ch < txt.length) DLG.ch = txt.length;
    else { DLG.i++; DLG.ch=0;
      if(DLG.i>=DLG.lines.length){ const d=DLG.done; DLG=null; if(d) d(); } }
  }
}

/* ============================================================
   THE GUIDE

   There used to be a second one of these: a little glowing life-spirit at
   your shoulder who explained things. With Mae Posop standing in the field
   doing the same job, the two of them talked over each other — two bubbles
   on screen at once, both saying what to do next. She is the only guide
   now.

   Anything the game wants to tell you goes through guideSay. If she is
   within earshot it comes out of her mouth. If you are two zones away it
   comes up as a line under the plaques instead, because a hint you cannot
   see is not a hint.
   ============================================================ */
let HINT = null;
function guideSay(txt, t=6){
  if(typeof POSOP!=='undefined' && POSOP.met && Math.abs(P.x-POSOP.x) < 210){
    posopSay(txt, t); return;
  }
  /* translated where it is stored rather than where it is drawn, because the
     same line goes out through two different mouths */
  HINT = {txt:L(txt), t, max:t};
  AU.blip();
}
const guideTalking = ()=>
  (HINT && HINT.t > HINT.max-1.8) ||
  (typeof POSOP!=='undefined' && POSOP.bub && POSOP.bubT > (POSOP.bubMax||6)-1.8);

function stepHint(dt){
  if(HINT){ HINT.t -= dt; if(HINT.t<=0) HINT=null; }
  // the tutorial, one gentle nudge at a time, in her voice or on the line
  if(GS.tut < TUT.length && !DLG && GS.state==='play' && !VIG && !storyBusy()){
    const step=TUT[GS.tut];
    if(step.test()){ GS.tut++; saveGame();
      const nxt=TUT[GS.tut];
      if(nxt) guideSay(nxt.say, 7.5);
    } else if(!HINT && !GS.seen['tut'+step.id]){
      GS.seen['tut'+step.id]=true; guideSay(step.say, 8);
    }
  }
}

/* ============================================================
   PLAYER
   ============================================================ */
/* SPD and stepPlayer now live in pplat.js, with the platforms. */
function stepPlayer(dt){
  const busy = !!DLG || GS.state!=='play' || !!P.act || !!VIG;
  let ax=0, ease=1;
  if(busy) navStop();
  else {
    if(K.left) ax-=1; if(K.right) ax+=1;
    if(ax) navStop();                       // a key press cancels the walk order
    else if(NAV.on){
      NAV.t+=dt;
      const d=NAV.tx-P.x;
      if(Math.abs(d)<7 || NAV.t>14){ NAV.on=false; NAV.fire=1; }
      else { ax = d>0?1:-1; ease = clamp(Math.abs(d)/30,0.34,1); }   // slow into the mark
    }
  }
  const target = ax*SPD()*ease;
  const acc = ax!==0 ? (P.onGround?430:340) : (P.onGround?820:300);
  P.vx += clamp(target-P.vx, -acc*dt, acc*dt);
  if(ax!==0) P.face = ax;

  P.coyote = P.onGround ? 0.1 : Math.max(0,P.coyote-dt);
  if(!busy && (press('jump')||press('up'))) P.buf=0.13; else P.buf=Math.max(0,P.buf-dt);
  const maxJumps = has('float')?2:1;
  if(P.buf>0 && (P.coyote>0 || P.jumps<maxJumps)){
    P.vy=-238; P.buf=0; P.coyote=0; P.onGround=false;
    P.jumps = P.coyote>0?1:P.jumps+1;
    P.squash=-0.5; AU.jump(); pDust(P.x,P.y,5);
  }
  if(P.vy<0 && !(K.jump||K.up)) P.vy += 640*dt;
  P.vy += 760*dt; P.vy = Math.min(P.vy, 420);
  P.x = clamp(P.x + P.vx*dt, 16, WORLD_W-16);
  P.y += P.vy*dt;
  const gy = groundY(P.x);
  if(P.y >= gy){
    if(!P.onGround){ const f=clamp(P.vy/380,0,1);
      P.squash=0.35+f*0.5; AU.land(); pDust(P.x,gy,4+f*8);
      if(f>0.5) GS.shake=Math.max(GS.shake,2); }
    P.y=gy; P.vy=0; P.onGround=true; P.jumps=0;
  } else P.onGround=false;

  const nf = Math.floor(P.phase/Math.PI);
  if(P.onGround && nf!==(P._sf||0) && Math.abs(P.vx)>18){ AU.step(Math.abs(P.vx)>100); pDust(P.x,P.y,2); }
  P._sf = nf;

  // the whistle is a greeting now, nothing more
  P.wailCd=Math.max(0,P.wailCd-dt);
  if(!busy && press('whistle') && P.wailCd<=0){
    P.wailCd=1.2; P.wailT=0.5; AU.wail();
    pRing(P.x,P.y-48,'#fff0c0',80);
    let greeted=0;
    for(const n of NPCS) if(Math.abs(n.x-P.x)<110){ n.mark={k:'call',t:1.6}; greeted++; }
    for(const s of SPIRITS) if(Math.abs(s.x-P.x)<130 && s.met){ s.wave=1.4; greeted++; }
    if(Math.abs(CAT.x-P.x)<110 && CAT.state==='wander'){ CAT.tx=P.x; AU.meow(); }
    if(greeted && !GS.seen.greet){ GS.seen.greet=true; guideSay('They heard that. A prete\'s whistle is a hello with the volume stuck on.'); }
  }
  if(P.wailT>0){ P.wailT-=dt; P.state='wail'; }
  else if(HT) P.state='reach';
  else if(!P.onGround) P.state='jump';
  else if(Math.abs(P.vx)>10) P.state='walk';
  else P.state='idle';
  stepPrete(P,dt);
}

/* ============================================================
   NPC + SPIRIT LIFE
   ============================================================ */
let prayTimer=14, activePray=null, offering=null, offerTimer=40;
function stepNpcs(dt){
  for(const n of NPCS){
    n.anim+=dt;
    if(n.react){ n.react.t-=dt; if(n.react.t<=0) n.react=null; }
    if(n.mark){ n.mark.t-=dt; if(n.mark.t<=0) n.mark=null; }
    if(n.bub){ n.bub.t-=dt; if(n.bub.t<=0) n.bub=null; }
    n.phase += n.vx*dt*0.22;
    if(n.state==='walk'){
      const d=n.tx-n.x;
      if(Math.abs(d)<3){ n.vx=0; n.state=n.then||'idle'; n.then=null; n.t=rnd(3,8); if(n.state==='pray') beginPray(n); }
      else { n.vx=sign(d)*22; n.face=sign(d); n.x+=n.vx*dt; }
    } else {
      n.vx = lerp(n.vx,0,1-Math.pow(0.001,dt));
      if(VILLAGERS.indexOf(n)>=0){
        n.t=(n.t||rnd(2,7))-dt;
        if(n.t<=0 && n.state==='idle'){ n.tx=clamp(n.home+rnd(-90,90),1500,3060); n.state='walk'; }
      }
      if(n.state==='pray'){ n.prayT-=dt; if(n.prayT<=0){ n.state='walk'; n.tx=n.home; n.then='idle'; if(activePray===n) activePray=null; } }
    }
    n.y=groundY(n.x);
  }
  prayTimer-=dt;
  if(prayTimer<=0 && !activePray){
    prayTimer=rnd(15,26);
    const c=VILLAGERS.filter(v=>v.state==='idle'||v.state==='walk');
    if(c.length){ const n=pick(c); n.state='walk'; n.tx=SHRINE_X+rnd(-16,16); n.then='pray'; n.mark={k:'star',t:3}; activePray=n; AU.blip(); }
  }
  offerTimer-=dt;
  if(offerTimer<=0 && !offering && GS.q.metPhra){
    offering={x:CART_X+40, y:groundY(CART_X+40), t:0}; UNCLE.bub={t:3.2,txt:'for the spirits ~'};
    offerTimer=rnd(48,80);
  }
  if(offering){
    offering.t+=dt;
    if(Math.random()<dt*3) pSmoke(offering.x+rnd(-2,2), offering.y-8);
    if(Math.abs(P.x-offering.x)<20 && Math.abs(P.y-offering.y)<40){
      offering=null; GS.q.offerings++; addMerit(3); AU.purr();
      toast('+3 merit · noodles for the unseen (the steam is enough)');
    } else if(offering.t>40) offering=null;
  }
  // spirits drift gently about their business
  for(const s of SPIRITS){
    s.anim+=dt;
    if(s.wave>0) s.wave-=dt;
    s.hop = s.id==='kongkoi'? Math.abs(Math.sin(s.anim*2.6))*5 : 0;
    s.face = P.x<s.x?-1:1;
    if(s.bub){ s.bub.t-=dt; if(s.bub.t<=0) s.bub=null; }
  }
  // the cat
  CAT.anim+=dt;
  if(CAT.state==='wander'){
    CAT.t=(CAT.t||0)-dt;
    if(CAT.t<=0){ CAT.t=rnd(2,6); CAT.tx = Math.abs(CAT.x-P.x)<90&&Math.random()<0.6 ? P.x+rnd(-16,16) : clamp(CAT.x+rnd(-70,70), TAMARIND_X-90, CART_X+60); }
    const d=CAT.tx-CAT.x;
    if(Math.abs(d)>3){ CAT.x+=sign(d)*26*dt; CAT.face=sign(d); CAT.phase+=dt*9; CAT.walking=true; }
    else CAT.walking=false;
    CAT.y=groundY(CAT.x);
  }
  TANI.anim+=dt; if(TANI.waveT>0) TANI.waveT-=dt;
  PHRA.anim+=dt;
  // things regrow
  for(const nd of NODES){ if(!nd.ready){ nd.t-=dt; if(nd.t<=0){ nd.ready=true; } } }
}
function beginPray(n){
  n.prayT=6; n.bub={t:5,txt:'…merit for the wandering souls…'};
  for(let i=0;i<4;i++) pSmoke(SHRINE_X+rnd(-4,4), groundY(SHRINE_X)-62, i*0.3);
  const range = has('magnet')? 400:150;
  if(Math.abs(P.x-SHRINE_X)<range){
    GS.q.prayers++;
    for(let i=0;i<5;i++) pOrb(SHRINE_X+rnd(-8,8), groundY(SHRINE_X)-66+rnd(-4,4), i*0.22);
  }
}

   HELPING — the hand tasks
   ============================================================ */
let HT=null;
const HAND_R = ()=> has('reach')? 1.35 : 1;
const EASY   = ()=> has('steady')? 1.4 : 1;
function startTask(kind, x, arg){
  const gy=groundY(x);
  HT={kind, t:0, prog:0, grabbed:false, fail:0, hit:0, hx:x, hy:gy-40, vx:0, vy:0};
  P.y=gy; P.vx=0; P.vy=0; P.onGround=true;
  if(kind==='bug'||kind==='chop') taskNewSetup(HT, x, arg);
  if(kind==='lamp'){ HT.a={x:x+9,y:gy-136}; HT.b={x:x+22,y:gy-142}; HT.hx=x-20; HT.hy=gy-90; P.x=x-42; }
  if(kind==='cat'){ HT.cat={x:CAT.x,y:CAT.y,fear:0}; HT.hx=CAT.x-40; HT.hy=CAT.y+30; P.x=CAT.x-52; }
  if(kind==='tree'){ HT.lift=0; HT.bal=0; HT.balV=0; HT.hx=x; HT.hy=gy-40; P.x=x-70; }
  if(kind==='garland'){ HT.hook={x:SHRINE_X-16,y:groundY(SHRINE_X)-86}; HT.hx=SHRINE_X+34; HT.hy=groundY(SHRINE_X)-52; P.x=SHRINE_X+46; }
  GS.state='task'; AU.sel();
}
function stepTask(dt){
  const t=HT; t.t+=dt;
  let dx=0,dy=0;
  if(K.left)dx-=1; if(K.right)dx+=1; if(K.up)dy-=1; if(K.down)dy+=1;
  if(TOUCH.on && TOUCH.aim.active){
    const wx=TOUCH.aim.x+GS.camX, wy=TOUCH.aim.y+GS.camY;
    dx=clamp((wx-t.hx)/26,-1,1); dy=clamp((wy-t.hy)/26,-1,1);
  }
  const acc=420;
  t.vx += dx*acc*dt; t.vy += dy*acc*dt;
  t.vx *= Math.pow(0.0016,dt); t.vy *= Math.pow(0.0016,dt);
  t.hx += t.vx*dt; t.hy += t.vy*dt;
  const speed=Math.hypot(t.vx,t.vy);
  const grip = K.act || K.light;
  t.grip=grip;

  if(t.kind==='bug'||t.kind==='chop') stepTaskNew(t, dt, dx, dy, grip, speed);
  if(!HT){ clearPress(); return; }        // those two finish themselves

  if(t.kind==='lamp'){
    const nearA = dist(t.hx,t.hy,t.a.x,t.a.y) < 20*HAND_R();
    if(!t.grabbed && nearA && grip){ t.grabbed=true; AU.spark(); }
    if(t.grabbed){
      const d=dist(t.hx,t.hy,t.b.x,t.b.y);
      if(d < 13*HAND_R()*EASY() && grip){
        t.prog += dt*0.62*EASY();
        if(Math.random()<dt*22){ pSpark(t.b.x,t.b.y,2,'#fff0b0'); AU.spark(); }
        t.vx += rnd(-160,160)*dt*6/EASY(); t.vy += rnd(-160,160)*dt*6/EASY();
      } else t.prog=Math.max(0,t.prog-dt*0.3);
      if(!grip) t.grabbed=false;
    }
    if(Math.random()<dt*6) pSpark(t.a.x,t.a.y,1,PAL.ember);
    if(t.prog>=1) finishTask();
  }
  else if(t.kind==='cat'){
    const c=t.cat, d=dist(t.hx,t.hy,c.x,c.y);
    const gentle = speed < (has('cool')?70:46);
    if(d<38) c.fear += (gentle? -0.5 : 1.6)*dt; else c.fear -= 0.7*dt;
    c.fear=clamp(c.fear,0,1);
    if(c.fear>=1){ t.fail=1.2; c.fear=0.55; AU.meow(); t.prog=Math.max(0,t.prog-0.4); }
    if(d < 16*HAND_R() && gentle && grip){ t.prog += dt*0.75*EASY();
      if(Math.random()<dt*4) pHeart(c.x+rnd(-4,4), c.y-8); }
    else if(!grip) t.prog=Math.max(0,t.prog-dt*0.15);
    if(t.fail>0) t.fail-=dt;
    if(t.prog>=1) finishTask();
  }
  else if(t.kind==='tree'){
    const near = Math.abs(t.hy-(groundY(t.hx)-14-t.lift*30))<26 && Math.abs(t.hx-FALLEN_TREE_X)<60;
    if(near && grip){
      t.lift=clamp(t.lift+dt*0.42*EASY(),0,1);
      t.balV += (dx*0.9 + Math.sin(t.t*2.3)*0.5 + rnd(-0.5,0.5))*dt*2.4/EASY();
      if(Math.random()<dt*8) pDust(t.hx+rnd(-30,30), groundY(t.hx));
    } else t.lift=Math.max(0,t.lift-dt*0.5);
    t.balV += -t.bal*2.2*dt; t.balV*=Math.pow(0.35,dt);
    t.bal=clamp(t.bal+t.balV*dt,-1.4,1.4);
    if(Math.abs(t.bal)>1){ t.lift=Math.max(0,t.lift-dt*1.4); t.fail=0.6; GS.shake=3; AU.land(); }
    if(t.fail>0) t.fail-=dt;
    t.prog=t.lift;
    if(t.lift>=1) finishTask();
  }
  else if(t.kind==='garland'){
    const d=dist(t.hx,t.hy,t.hook.x,t.hook.y);
    if(d < 11*HAND_R()*EASY() && speed<40*EASY()){ t.prog+=dt*0.9*EASY();
      if(Math.random()<dt*6) pSpark(t.hook.x,t.hook.y,1,'#fff0dc'); }
    else t.prog=Math.max(0,t.prog-dt*0.5);
    if(t.prog>=1) finishTask();
  }
  GS.camX = lerp(GS.camX, clamp(t.hx-W/2,0,WORLD_W-W), 1-Math.pow(0.002,dt));
  GS.camY = lerp(GS.camY, clamp(t.hy-H/2-10,-30,40), 1-Math.pow(0.004,dt));
  if(press('back')){ GS.state='play'; HT=null; }
  clearPress();
}
function finishTask(){
  const k=HT.kind; HT=null; GS.state='play';
  if(k==='lamp'){
    GS.q.lamp=true; LIGHTS.find(l=>l.broken).on=true; AU.fix();
    pSpark(LAMP_XS[BROKEN_LAMP]+16, groundY(LAMP_XS[BROKEN_LAMP])-140, 16);
    say([{w:'',t:'The lamp hums awake. Behind you, somebody stops hurrying.'}],
      ()=>{ addMerit(12); toast('+12 merit · the dark stretch glows'); unlockCos('skirt_plaid',true); });
  }
  if(k==='cat'){
    GS.q.cat=true; CAT.state='wander'; CAT.x=P.x+14; CAT.y=groundY(CAT.x); CAT.tx=MALI.x;
    AU.meow(); pHeart(CAT.x,CAT.y-14);
    say([{w:'Mali',t:'WHOA! Thank you, giant friend!'},
         {w:'Mali',t:'Meow-Meow says thanks too. Short trees only from now on.'}],
      ()=>{ addMerit(14); toast('+14 merit · the cat is down'); });
  }
  if(k==='tree'){
    GS.q.tree=true; AU.fix(); GS.shake=4; pDust(FALLEN_TREE_X,groundY(FALLEN_TREE_X),24);
    say([{w:'',t:'You set it in the ditch like a sack of rice. The road is a road again.'}],
      ()=>{ addMerit(12); toast('+12 merit · the road is clear'); });
  }
  if(k==='garland'){
    GS.q.garland=true; AU.ding(); pSpark(SHRINE_X-16,groundY(SHRINE_X)-86,12,'#fff0dc');
    say([{w:'Phra Phum',t:"Nobody's hung one that straight in years. Thank you."}],
      ()=>{ addMerit(8); toast('+8 merit · the garland hangs straight'); unlockCos('garland',true); });
  }
  saveGame();
}
function unlockCos(id, free){
  if(GS.seen['own_'+id]) return;
  GS.seen['cos_'+id]=true;
  if(free){ GS.seen['own_'+id]=true; toast('unlocked: '+COSMETICS[id].n, PAL.jadeL); AU.unlock(); }

/* ============================================================
   THE FARM YOU RENT

   There is a derelict place out in the rice fields with nobody's
   name on it. Pay the landlord and it is yours to work: five dry
   beds for the garden, two นาข้าว for the rice, three holes for
   fruit trees, and a pen with nothing in it yet.

   Everything here costs money and gives money back, and the
   money comes from the kitchen — you cook what you grow and the
   village buys it. Merit comes from giving it away instead.
   ============================================================ */
/* The gate sits 44px further west than it did, to open a gap between it and
   the farmhouse wide enough for the rice barn to stand in without the two
   roofs stacking on each other. */
const FARM_GATE = 794, FARMHOUSE_X = 900, PEN_X = 962;
const BED_XS    = [1015, 1047, 1079, 1111, 1143];
const PADDY_XS  = [1215, 1290];
const TREE_XS   = [1360, 1400, 1440];

const RENT      = 120;                  // what the landlord wants for the place
const BED_COST  = 30, PADDY_COST = 90;
const SAPLINGS  = { durian:{cost:170,n:'durian'}, mangosteen:{cost:110,n:'mangosteen'}, rambutan:{cost:80,n:'rambutan'} };
const STOCK_COST= { chicken:45, duck:60, buffalo:240 };

/* one crop to a bed, so a bed never needs a menu */
const BED_CROPS = ['papaya','chili','basil','galangal','morning'];
const GROW_A = 11, GROW_B = 13;         // seconds per stage, dry. water halves it.

/* the whole farm, in one object, because the whole farm is one save field */
const FARM = {
  rented:false, rice:false, house:0,
  beds:0, paddies:0, trees:0,
  pen:{ chicken:0, duck:0, buffalo:0, feed:0, egg:0, degg:0, milk:0, dung:0, t:0 },
  hands:{},                             // spirit id -> job id
};
const PLOTS = [], PADDIES = [], TREES = [];
for(let i=0;i<BED_XS.length;i++)
  PLOTS.push({ i, x:BED_XS[i], crop:BED_CROPS[i], stage:0, t:0, wet:0, fert:0, pop:0, sway:rnd(TAU) });
for(let i=0;i<PADDY_XS.length;i++)
  PADDIES.push({ i, x:PADDY_XS[i], stage:0, t:0, flood:0, pop:0, sway:rnd(TAU) });
for(let i=0;i<TREE_XS.length;i++)
  TREES.push({ i, x:TREE_XS[i], crop:null, grow:0, fruit:0, t:0, pop:0, sway:rnd(TAU) });

/* Rice, tree crowns and farm furniture are hundreds of tapers and ellipses
   each, and they are the same hundreds every frame. Draw them once into a small
   canvas and blit that instead. */
/* Least-recently-used, not clear-the-lot. A Map keeps insertion order, so
   re-setting a key on every hit moves it to the back and the front of the Map
   is always the coldest thing in it.

   This used to be `if(size>60) clear()`, and once the barn, the jar and the
   log started keying sprites too the farm went over that cap regularly — and
   every time it did, the three fruit crowns (each four hundred tapers into a
   92x175 canvas) were thrown away and re-baked. It did not show up in the
   farm's own framerate so much as in everything measured after it. */
const _farmSpr = new Map();
/* The working set grew: six houses' worth of under-stilt life, the night
   stall and his own house all key sprites here too, and at ninety-six the
   cache started evicting things it was about to need again. */
const FARM_SPR_MAX = 160;
function farmSprite(key, w, h, paint){
  let c=_farmSpr.get(key);
  if(c){ _farmSpr.delete(key); _farmSpr.set(key,c); return c; }
  c=mkCv(Math.max(1,Math.ceil(w)), Math.max(1,Math.ceil(h)));
  paint(G2(c));
  _farmSpr.set(key,c);
  while(_farmSpr.size > FARM_SPR_MAX) _farmSpr.delete(_farmSpr.keys().next().value);
  return c;
}
/* bake a thing that stands on the ground at (x, gy): the painter is handed a
   context and the local coordinates its ground point sits at, so one function
   draws both the sprite and, if it ever needed to, the live version */
function baked(g, key, x, gy, w, h, ax, ay, paint){
  /* the anchor has to land on a whole pixel, or the sprite's own rounding and
     the blit's rounding disagree and the thing shifts half a pixel */
  ax=R(ax); ay=R(ay);
  g.drawImage(farmSprite(key, w, h, gg=>paint(gg, ax, ay)), R(x-ax), R(gy-ay));
}

const farmOpen = ()=> FARM.rented;
const bedOpen  = pl => FARM.rented && pl.i < FARM.beds;
const padOpen  = pd => farmActive() && pd.i < FARM.paddies;
const treeOpen = tr => FARM.rented && tr.i < FARM.trees;

/* ---------- finding what you are standing at ---------- */
function plotAt(x){ for(const pl of PLOTS) if(bedOpen(pl) && Math.abs(pl.x-x)<14) return pl; return null; }
function paddyAt(x){ for(const pd of PADDIES) if(padOpen(pd) && Math.abs(pd.x-x)<30) return pd; return null; }
function treeAt(x){ for(const tr of TREES) if(treeOpen(tr) && Math.abs(tr.x-x)<18) return tr; return null; }

/* The seed used to come out of a crate by the gate. It comes out of the
   barn now — see pnew.js — because a barn is a thing you walk into and a
   crate is a thing you tap. */

/* ============================================================
   GROWING
   ============================================================ */
function stepFarm(dt){
  const lit = farmActive();
  if(FARM._lit!==lit){
    FARM._lit=lit;
    for(const l of LIGHTS) if(l.id && l.id.indexOf('farm')===0) l.on=lit;
  }
  for(const pl of PLOTS){
    pl.sway += dt*0.7;
    if(pl.pop>0) pl.pop -= dt;
    if(!pl.stage) continue;
    let rate = pl.wet>0 ? 2.1 : 0.85;
    if(pl.fert>0) rate *= 1.5;                 // manure is worth carrying up the road
    if(pl.wet>0) pl.wet -= dt;
    pl.t += dt*rate;
    const need = pl.stage===1? GROW_A : GROW_B;
    if(pl.stage<3 && pl.t>=need){
      pl.stage++; pl.t=0; pl.pop=0.9;
      if(pl.stage===3){ pl.fert=0; AU.ranat(880,0,0.04);
        for(let k=0;k<5;k++) pSpark(pl.x+rnd(-6,6), groundY(pl.x)-16, 1, PAL.jadeL); }
      else AU.blip();
    }
  }
  /* rice takes its time and wants standing water the whole way */
  for(const pd of PADDIES){
    pd.sway += dt*0.55;
    if(pd.pop>0) pd.pop -= dt;
    if(pd.flood>0) pd.flood -= dt*0.5;
    if(!pd.stage) continue;
    if(pd.flood<=0) continue;                  // a dry paddy simply waits
    pd.t += dt;
    const need = pd.stage===1? 16 : 20;
    if(pd.stage<3 && pd.t>=need){
      pd.stage++; pd.t=0; pd.pop=1;
      if(pd.stage===3){ AU.ranat(660,0,0.05); AU.ranat(990,0.09,0.04);
        for(let k=0;k<8;k++) pSpark(pd.x+rnd(-24,24), groundY(pd.x)-20, 1, '#e8d06a'); }
      else AU.blip();
    }
  }
  /* a fruit tree is planted once and then bears for ever, slowly */
  for(const tr of TREES){
    tr.sway += dt*0.4;
    if(tr.pop>0) tr.pop -= dt;
    if(!tr.crop) continue;
    if(tr.grow<1){ tr.grow = Math.min(1, tr.grow + dt/34); if(tr.grow>=1){ AU.ranat(520,0,0.05); tr.pop=1; } continue; }
    if(tr.fruit<3){ tr.t += dt; if(tr.t>=22){ tr.t=0; tr.fruit++; tr.pop=0.7; AU.blip(); } }
  }
  stepPen(dt);
}

/* ============================================================
   THE ANIMALS — they never die and they never leave. If you stop
   feeding them they simply stop giving anything back, and look at
   you about it.
   ============================================================ */
function penHas(){ const p=FARM.pen; return p.chicken+p.duck+p.buffalo; }
function stepPen(dt){
  const p=FARM.pen;
  if(!penHas()) return;
  p.t += dt;
  if(p.feed>0){
    p.feed -= dt*(0.12*penHas());
    if(p.t>=9){
      p.t=0;
      if(p.chicken) p.egg  = Math.min(9, p.egg  + p.chicken);
      if(p.duck)    p.degg = Math.min(9, p.degg + p.duck);
      if(p.buffalo) p.milk = Math.min(6, p.milk + p.buffalo);
      p.dung = Math.min(9, p.dung + Math.ceil(penHas()/2));
      AU.blip();
    }
  } else { p.feed=0; p.t=0; }
}
function penFull(){ const p=FARM.pen; return p.egg+p.degg+p.milk+p.dung; }
function penCollect(){
  const p=FARM.pen;
  if(!penHas()){ guideSay('There\'s nothing in the pen yet. The stall sells chickens.'); AU.blip(); return; }
  if(!penFull()){
    guideSay(p.feed>0? 'Nothing yet. Give them an hour.' : 'They\'re hungry. Rice bran, from the stall.');
    AU.blip(); return;
  }
  preteAct('pick', 1.0, ()=>{
    let got=0;
    const take=(k,id)=>{ if(p[k]>0){ bagAdd(id,p[k],true); got+=p[k]; p[k]=0; } };
    take('egg','egg'); take('degg','duckEgg'); take('milk','milk'); take('dung','manure');
    AU.ranat(760,0,0.05);
    toast('+'+got+' '+L('from the pen'), '#e8d0a0');
    for(let k=0;k<8;k++) part({k:'pop',x:PEN_X+rnd(-18,18),y:groundY(PEN_X)-14,vx:rnd(-24,24),vy:rnd(-46,-14),life:.7,c:'#f2e4c8'});
    saveGame();
  });
}
function penFeed(){
  const p=FARM.pen;
  if(!penHas()){ guideSay('Buy an animal first.'); AU.blip(); return; }
  if(!bagHas('bran')){ guideSay('You have no bran. Mill rice, or buy a sack at the stall.'); AU.blip(); return; }
  preteAct('give', 0.9, ()=>{
    bagTake('bran',1);
    p.feed = Math.min(60, p.feed + 30);
    AU.step();
    for(let k=0;k<10;k++) part({k:'pop',x:PEN_X+rnd(-20,20),y:groundY(PEN_X)-8,vx:rnd(-14,14),vy:rnd(-24,-6),life:.6,c:'#d3b478'});
    toast(L('fed'),'#d3b478');
    if(!GS.seen.fed){ GS.seen.fed=true; guideSay('A fed animal leaves you something. Look in the pen.',7); }
    saveGame();
  });
}

/* ============================================================
   WORKING A BED
   ============================================================ */
function plotPrompt(pl){
  if(pl.stage===0) return bagHas('seed')? 'plant a seed' : 'the bed is empty';
  if(pl.stage===3) return 'harvest it';
  return pl.wet>0? 'it is growing' : 'it needs water';
}

      AU.ranat(700,0,0.05); AU.ranat(1046,0.08,0.04);

/* ============================================================
   WORKING A PADDY — flood it, sow it, wait a long while, cut it
   ============================================================ */
function paddyPrompt(pd){
  if(pd.stage===0) return bagHas('seed')? 'flood it and sow the rice' : 'the paddy is dry';
  if(pd.stage===3) return 'cut the rice';
  return pd.flood>0? 'the rice is coming on' : 'let the water back in';
}
function usePaddy(pd){
  if(!canWork(3)) return;
  P.face = pd.x < P.x ? -1 : 1;
  if(pd.stage===0){
    if(!bagHas('seed')){ guideSay('Rice starts as seed too. There\'s a sack of it in the barn.'); AU.blip(); return; }
    if(!waterTake(1)) return noWater();
    preteAct('plant', 1.2, ()=>{ spend(3);
      if(!bagTake('seed',1)) return;
      pd.stage=1; pd.t=0; pd.flood=40; pd.pop=1;
      AU.pour();
      for(let k=0;k<18;k++) part({k:'water',x:pd.x+rnd(-26,26),y:groundY(pd.x)-14,vx:rnd(-10,10),vy:rnd(10,40),life:.6});
      toast(L('flooded and sown'),'#8fc4e8');
      if(!GS.seen.paddy){ GS.seen.paddy=true;
        guideSay('Rice is slow and wants the water kept up.',8); }
      posopCheck();
      saveGame();
    });
    return;
  }
  if(pd.stage===3){
    preteAct('pick', 1.3, ()=>{ spend(3);
      const n = 4 + (has('two')?2:0) + (has('sickle')?2:0);
      bagAdd('rice', n, true); bagAdd('bran', 2, true); bagAdd('seed', 2, true);
      addMerit(2,true); GS.q.rice=(GS.q.rice||0)+1;
      toast('+'+n+' '+L('sticky rice')+' · '+L('rice bran'), '#e8d06a');
      for(let k=0;k<16;k++) part({k:'pop',x:pd.x+rnd(-24,24),y:groundY(pd.x)-22,vx:rnd(-34,34),vy:rnd(-62,-18),life:.8,c:'#e8d06a'});
      AU.ranat(660,0,0.06); AU.ranat(880,0.09,0.05); AU.ranat(1180,0.18,0.04);
      pd.stage=0; pd.t=0; pd.flood=0; pd.pop=1;
      /* posopCheck first: on the cut that finishes her lesson, the scene
         about the road opening is the one that should play. firstRice stays
         unseen and gets its turn on the next harvest. */
      posopCheck();
      if(GS.q.rice===1) vignette('firstRice');
      saveGame();
    });
    return;
  }
  if(!waterTake(1)) return noWater();
  preteAct('water', 1.25, ()=>{ spend(3);
    pd.flood = 40; pd.pop = 0.6;
    AU.pour();
    for(let k=0;k<20;k++) part({k:'water',x:pd.x+rnd(-28,28),y:groundY(pd.x)-24,vx:rnd(-8,8),vy:rnd(24,60),life:.6});
    toast(L('the water is up'),'#8fc4e8');
    posopCheck();
  });
}

/* ============================================================
   THE ORCHARD
   ============================================================ */
function treePrompt(tr){
  if(!tr.crop) return 'nothing planted here';
  if(tr.grow<1) return 'it is still a sapling';
  return tr.fruit>0? 'pick the fruit' : 'nothing ripe yet';
}
function useTree(tr){
  if(!tr.crop || tr.grow<1 || tr.fruit<=0){ guideSay(L(treePrompt(tr))); AU.blip(); return; }
  if(!canWork(2)) return;
  P.face = tr.x < P.x ? -1 : 1;
  preteAct('pick', 1.1, ()=>{ spend(2);
    const n=tr.fruit; tr.fruit=0; tr.pop=1;
    bagAdd(tr.crop, n, true);
    addMerit(1,true);
    toast('+'+n+' '+L(ITEMS[tr.crop].n), ITEMS[tr.crop].c);
    for(let k=0;k<10;k++) part({k:'pop',x:tr.x,y:groundY(tr.x)-40,vx:rnd(-26,26),vy:rnd(-40,-8),life:.8,c:ITEMS[tr.crop].c});
    AU.ranat(590,0,0.05); AU.ranat(784,0.1,0.04);
    saveGame();
  });
}

/* ============================================================
   THE FARM, DRAWN
   ============================================================ */
function drawFarm(g){
  const x0=FARM_GATE-30, x1=TREE_XS[TREE_XS.length-1]+40;
  if(x1-GS.camX<-60 || x0-GS.camX>W+60) return;
  if(farmActive()) drawFarmLights(g);
  drawFarmGate(g);
  drawFarmhouse(g);
  drawPen(g);
  for(const pl of PLOTS) drawBed(g,pl);
  for(const pd of PADDIES) drawPaddy(g,pd);
  for(const tr of TREES) drawFruitTree(g,tr);
}

/* Somebody strung lanterns over the beds the week the place was rented, and
   nobody has taken them down. It is the only reason you can work after dark. */
function drawFarmLights(g){
  const a=BED_XS[0]-26, b=TREE_XS[TREE_XS.length-1]+10;
  if(b-GS.camX<-40 || a-GS.camX>W+40) return;
  const gy=groundY((a+b)/2), ly=gy-66;
  for(const px of [a,b]){ pR(g,px,ly,2,40,'#6d5138'); pR(g,px,ly,1,40,'#8a684a'); pR(g,px-1,ly-2,4,2,'#a07c58'); }
  /* the wire sags the whole width of the farm; only draw the bit of it that is
     actually on screen, which is a sixth of it */
  const s0=Math.max(a, GS.camX-6), s1=Math.min(b, GS.camX+W+6);
  for(let sx=a+Math.ceil((s0-a)/3)*3; sx<s1; sx+=3){
    const t=(sx-a)/(b-a);
    pR(g,sx,ly+2+Math.sin(t*Math.PI)*7,3,1,'rgba(40,30,20,0.7)');
  }
  const COL=['#ffd27a','#ffb87a','#ffe0a0','#ffc98a','#ffd27a','#ffbe86','#ffdb96'];
  for(let k=0;k<7;k++){
    const t=(k+1)/8, lxx=lerp(a,b,t), sag=Math.sin(t*Math.PI)*7;
    if(lxx-GS.camX<-46||lxx-GS.camX>W+46) continue;
    const c=COL[k], fl=0.82+0.18*Math.sin(GS.t*2.8+k*1.7);
    drawGlow(g,lxx,ly+sag+8,34,'#ffce7c',0.32*fl);
    // a paper lantern: two dark caps and a lit barrel between them
    const by=ly+sag+8;
    pR(g,lxx,ly+sag+2,1,4,'#4a3a2a');
    pR(g,lxx-3,by-4,7,1,'#3b2412');
    pEll(g,lxx,by,4,4.4,'#3b2412');
    pEll(g,lxx,by,3.2,3.6,rgba(c,fl));
    pEll(g,lxx-1,by-1,1.4,1.8,'#fff4d0');
    pR(g,lxx-3,by+4,7,1,'#3b2412');
    pR(g,lxx,by+5,1,2,rgba('#c9992f',0.8));
  }
}

  pR(g,x-26,gy-30,56,5,'#5f4a37'); pR(g,x-26,gy-30,56,1,'#7d6449');
  // walls
  pR(g,x-24,gy-58,48,28,WALL);
  for(let y=gy-55;y<gy-30;y+=5) pR(g,x-24,y,48,1,shade(WALL,-0.22));

  } else {

  }
  pR(g,x-20,gy-44,13,14,'#2c2018'); pR(g,x-19,gy-43,11,13,'#241a14');
  // roof
  for(let i=0;i<7;i++){
    const t=i/6, yy=lerp(gy-58,gy-76,t), ww=lerp(58,14,t);

    pTaper(g,x-1,gy-76,x-7,gy-84,3,1,PAL.gold);

  pR(g,x-30,gy-59,60,3,shade(ROOF,-0.3));
  if(st>=2){

    pR(g,x+22,gy-50,1,5,'#4a3a2a');
    pEll(g,x+22,gy-42,4.4,5.4,'#3b2412');
    // somebody lives here now: a stool, a jar, a line of washing
    pR(g,x+22,gy-8,7,8,'#8a5e3a'); pEll(g,x+25,gy-9,4,2,'#6b4529');

  if(st>=1 && st<2){
    // planks stacked ready for the walls, and the weeds cut back

/* the pen: a rail fence, a coop, and whoever you have bought */

  const x=PEN_X, gy=groundY(x);
  if(x-GS.camX<-70||x-GS.camX>W+70) return;

  // fence, coop and straw never change; the lamp and the animals do
  baked(g,'pen', x, gy, 80, 48, 40, 40, (gg,ax,ay)=>paintPen(gg,ax,ay,x,gy));
  { const fl=0.84+0.16*Math.sin(GS.t*2.6);
    drawGlow(g,x+34,gy-26,32,'#ffce7c',0.28*fl);
    pEll(g,x+34,gy-28,2.4,3.2,rgba('#ffd27a',fl)); }
  // the animals
  for(let i=0;i<p.chicken;i++) drawHen(g, x-26+i*11, gy, i);
  for(let i=0;i<p.duck;i++)    drawDuck(g, x-4+i*12, gy, i);
  if(p.buffalo) drawBuffalo(g, x+2, gy);
  // hungry animals look at you about it
  if(penHas() && p.feed<=0){
    const bl=0.5+0.5*Math.sin(GS.t*3);
    pTxt(g,'!',x+30,gy-30-bl*2,'#e8b13c',7,'center');

  if(penFull()){

}

  pTri(g,x-7,gy-9+peck,x-4,gy-10+peck,x-4,gy-8+peck,'#e8a13c');

  pR(g,x-4.5,gy-9.6+peck,1,1,'#2c2020');

let prayTimer=14, activePray=null, offering=null, offerTimer=40;
function stepNpcs(dt){
  for(const n of NPCS){
    n.anim+=dt;
    if(n.react){ n.react.t-=dt; if(n.react.t<=0) n.react=null; }
    if(n.mark){ n.mark.t-=dt; if(n.mark.t<=0) n.mark=null; }
    if(n.bub){ n.bub.t-=dt; if(n.bub.t<=0) n.bub=null; }
    n.phase += n.vx*dt*0.22;
    if(n.state==='walk'){
      const d=n.tx-n.x;
      if(Math.abs(d)<3){ n.vx=0; n.state=n.then||'idle'; n.then=null; n.t=rnd(3,8); if(n.state==='pray') beginPray(n); }
      else { n.vx=sign(d)*22; n.face=sign(d); n.x+=n.vx*dt; }
    } else {
      n.vx = lerp(n.vx,0,1-Math.pow(0.001,dt));
      if(VILLAGERS.indexOf(n)>=0){
        n.t=(n.t||rnd(2,7))-dt;
        if(n.t<=0 && n.state==='idle'){ n.tx=clamp(n.home+rnd(-90,90),1500,3060); n.state='walk'; }
      }
      if(n.state==='pray'){ n.prayT-=dt; if(n.prayT<=0){ n.state='walk'; n.tx=n.home; n.then='idle'; if(activePray===n) activePray=null; } }
    }
    n.y=groundY(n.x);
  }
  prayTimer-=dt;
  if(prayTimer<=0 && !activePray){
    prayTimer=rnd(15,26);
    const c=VILLAGERS.filter(v=>v.state==='idle'||v.state==='walk');
    if(c.length){ const n=pick(c); n.state='walk'; n.tx=SHRINE_X+rnd(-16,16); n.then='pray'; n.mark={k:'star',t:3}; activePray=n; AU.blip(); }
  }
  offerTimer-=dt;
  if(offerTimer<=0 && !offering && GS.q.metPhra){
    offering={x:CART_X+40, y:groundY(CART_X+40), t:0}; UNCLE.bub={t:3.2,txt:'for the spirits ~'};
    offerTimer=rnd(48,80);
  }
  if(offering){
    offering.t+=dt;
    if(Math.random()<dt*3) pSmoke(offering.x+rnd(-2,2), offering.y-8);
    if(Math.abs(P.x-offering.x)<20 && Math.abs(P.y-offering.y)<40){
      offering=null; GS.q.offerings++; addMerit(3); AU.purr();
      toast('+3 merit · noodles for the unseen (the steam is enough)');
    } else if(offering.t>40) offering=null;
  }
  // spirits drift gently about their business
  for(const s of SPIRITS){
    s.anim+=dt;
    if(s.wave>0) s.wave-=dt;
    s.hop = s.id==='kongkoi'? Math.abs(Math.sin(s.anim*2.6))*5 : 0;
    s.face = P.x<s.x?-1:1;
    if(s.bub){ s.bub.t-=dt; if(s.bub.t<=0) s.bub=null; }
  }
  // the cat
  CAT.anim+=dt;
  if(CAT.state==='wander'){
    CAT.t=(CAT.t||0)-dt;
    if(CAT.t<=0){ CAT.t=rnd(2,6); CAT.tx = Math.abs(CAT.x-P.x)<90&&Math.random()<0.6 ? P.x+rnd(-16,16) : clamp(CAT.x+rnd(-70,70), TAMARIND_X-90, CART_X+60); }
    const d=CAT.tx-CAT.x;
    if(Math.abs(d)>3){ CAT.x+=sign(d)*26*dt; CAT.face=sign(d); CAT.phase+=dt*9; CAT.walking=true; }
    else CAT.walking=false;
    CAT.y=groundY(CAT.x);
  }
  TANI.anim+=dt; if(TANI.waveT>0) TANI.waveT-=dt;
  PHRA.anim+=dt;
  // things regrow
  for(const nd of NODES){ if(!nd.ready){ nd.t-=dt; if(nd.t<=0){ nd.ready=true; } } }
}
function beginPray(n){
  n.prayT=6; n.bub={t:5,txt:'…merit for the wandering souls…'};
  for(let i=0;i<4;i++) pSmoke(SHRINE_X+rnd(-4,4), groundY(SHRINE_X)-62, i*0.3);
  const range = has('magnet')? 400:150;
  if(Math.abs(P.x-SHRINE_X)<range){
    GS.q.prayers++;
    for(let i=0;i<5;i++) pOrb(SHRINE_X+rnd(-8,8), groundY(SHRINE_X)-66+rnd(-4,4), i*0.22);
  }
}

/* ============================================================
   HELPING — the hand tasks
   ============================================================ */
let HT=null;
const HAND_R = ()=> has('reach')? 1.35 : 1;
const EASY   = ()=> has('steady')? 1.4 : 1;
function startTask(kind, x){
  const gy=groundY(x);
  HT={kind, t:0, prog:0, grabbed:false, fail:0, hx:x, hy:gy-40, vx:0, vy:0};
  P.y=gy; P.vx=0; P.vy=0; P.onGround=true;
  if(kind==='lamp'){ HT.a={x:x+9,y:gy-136}; HT.b={x:x+22,y:gy-142}; HT.hx=x-20; HT.hy=gy-90; P.x=x-42; }
  if(kind==='cat'){ HT.cat={x:CAT.x,y:CAT.y,fear:0}; HT.hx=CAT.x-40; HT.hy=CAT.y+30; P.x=CAT.x-52; }
  if(kind==='tree'){ HT.lift=0; HT.bal=0; HT.balV=0; HT.hx=x; HT.hy=gy-40; P.x=x-70; }
  if(kind==='garland'){ HT.hook={x:SHRINE_X-16,y:groundY(SHRINE_X)-86}; HT.hx=SHRINE_X+34; HT.hy=groundY(SHRINE_X)-52; P.x=SHRINE_X+46; }
  GS.state='task'; AU.sel();
}
function stepTask(dt){
  const t=HT; t.t+=dt;
  let dx=0,dy=0;
  if(K.left)dx-=1; if(K.right)dx+=1; if(K.up)dy-=1; if(K.down)dy+=1;
  if(TOUCH.on && TOUCH.aim.active){
    const wx=TOUCH.aim.x+GS.camX, wy=TOUCH.aim.y+GS.camY;
    dx=clamp((wx-t.hx)/26,-1,1); dy=clamp((wy-t.hy)/26,-1,1);
  }
  const acc=420;
  t.vx += dx*acc*dt; t.vy += dy*acc*dt;
  t.vx *= Math.pow(0.0016,dt); t.vy *= Math.pow(0.0016,dt);
  t.hx += t.vx*dt; t.hy += t.vy*dt;
  const speed=Math.hypot(t.vx,t.vy);
  const grip = K.act || K.light;
  t.grip=grip;

  if(t.kind==='lamp'){
    const nearA = dist(t.hx,t.hy,t.a.x,t.a.y) < 20*HAND_R();
    if(!t.grabbed && nearA && grip){ t.grabbed=true; AU.spark(); }
    if(t.grabbed){
      const d=dist(t.hx,t.hy,t.b.x,t.b.y);
      if(d < 13*HAND_R()*EASY() && grip){
        t.prog += dt*0.62*EASY();
        if(Math.random()<dt*22){ pSpark(t.b.x,t.b.y,2,'#fff0b0'); AU.spark(); }
        t.vx += rnd(-160,160)*dt*6/EASY(); t.vy += rnd(-160,160)*dt*6/EASY();
      } else t.prog=Math.max(0,t.prog-dt*0.3);
      if(!grip) t.grabbed=false;
    }
    if(Math.random()<dt*6) pSpark(t.a.x,t.a.y,1,PAL.ember);
    if(t.prog>=1) finishTask();
  }
  else if(t.kind==='cat'){
    const c=t.cat, d=dist(t.hx,t.hy,c.x,c.y);
    const gentle = speed < (has('cool')?70:46);
    if(d<38) c.fear += (gentle? -0.5 : 1.6)*dt; else c.fear -= 0.7*dt;
    c.fear=clamp(c.fear,0,1);
    if(c.fear>=1){ t.fail=1.2; c.fear=0.55; AU.meow(); t.prog=Math.max(0,t.prog-0.4); }
    if(d < 16*HAND_R() && gentle && grip){ t.prog += dt*0.75*EASY();
      if(Math.random()<dt*4) pHeart(c.x+rnd(-4,4), c.y-8); }
    else if(!grip) t.prog=Math.max(0,t.prog-dt*0.15);
    if(t.fail>0) t.fail-=dt;
    if(t.prog>=1) finishTask();
  }
  else if(t.kind==='tree'){
    const near = Math.abs(t.hy-(groundY(t.hx)-14-t.lift*30))<26 && Math.abs(t.hx-FALLEN_TREE_X)<60;
    if(near && grip){
      t.lift=clamp(t.lift+dt*0.42*EASY(),0,1);
      t.balV += (dx*0.9 + Math.sin(t.t*2.3)*0.5 + rnd(-0.5,0.5))*dt*2.4/EASY();
      if(Math.random()<dt*8) pDust(t.hx+rnd(-30,30), groundY(t.hx));
    } else t.lift=Math.max(0,t.lift-dt*0.5);
    t.balV += -t.bal*2.2*dt; t.balV*=Math.pow(0.35,dt);
    t.bal=clamp(t.bal+t.balV*dt,-1.4,1.4);
    if(Math.abs(t.bal)>1){ t.lift=Math.max(0,t.lift-dt*1.4); t.fail=0.6; GS.shake=3; AU.land(); }
    if(t.fail>0) t.fail-=dt;
    t.prog=t.lift;
    if(t.lift>=1) finishTask();
  }
  else if(t.kind==='garland'){
    const d=dist(t.hx,t.hy,t.hook.x,t.hook.y);
    if(d < 11*HAND_R()*EASY() && speed<40*EASY()){ t.prog+=dt*0.9*EASY();
      if(Math.random()<dt*6) pSpark(t.hook.x,t.hook.y,1,'#fff0dc'); }
    else t.prog=Math.max(0,t.prog-dt*0.5);
    if(t.prog>=1) finishTask();
  }
  GS.camX = lerp(GS.camX, clamp(t.hx-W/2,0,WORLD_W-W), 1-Math.pow(0.002,dt));
  GS.camY = lerp(GS.camY, clamp(t.hy-H/2-10,-30,40), 1-Math.pow(0.004,dt));
  if(press('back')){ GS.state='play'; HT=null; }
  clearPress();
}
function finishTask(){
  const k=HT.kind; HT=null; GS.state='play';
  if(k==='lamp'){
    GS.q.lamp=true; LIGHTS.find(l=>l.broken).on=true; AU.fix();
    pSpark(LAMP_XS[BROKEN_LAMP]+16, groundY(LAMP_XS[BROKEN_LAMP])-140, 16);

    say([{w:'Mali',t:'WHOA. You are a walking streetlight! Thank you, giant friend!'},

    say([{w:'',t:'You set the trunk down in the ditch like a man putting down a bag of rice. The road is a road again.'}],

  }
  if(k==='garland'){
    GS.q.garland=true; AU.ding(); pSpark(SHRINE_X-16,groundY(SHRINE_X)-86,12,'#fff0dc');
    say([{w:'Phra Phum',t:'…Well. Nobody has hung one that straight in years. Thank you, tall one.'}],
      ()=>{ addMerit(8); toast('+8 merit · the garland hangs straight'); unlockCos('garland',true); });

const FARM_GATE = 838, FARMHOUSE_X = 900, PEN_X = 962;

const PADDY_XS  = [1215, 1290];

const STOCK_COST= { chicken:45, duck:60, buffalo:240 };

/* one crop to a bed, so a bed never needs a menu */

/* the whole farm, in one object, because the whole farm is one save field */
const FARM = {

const PLOTS = [], PADDIES = [], TREES = [];
for(let i=0;i<BED_XS.length;i++)
  PLOTS.push({ i, x:BED_XS[i], crop:BED_CROPS[i], stage:0, t:0, wet:0, fert:0, pop:0, sway:rnd(TAU) });
for(let i=0;i<PADDY_XS.length;i++)
  PADDIES.push({ i, x:PADDY_XS[i], stage:0, t:0, flood:0, pop:0, sway:rnd(TAU) });
for(let i=0;i<TREE_XS.length;i++)
  TREES.push({ i, x:TREE_XS[i], crop:null, grow:0, fruit:0, t:0, pop:0, sway:rnd(TAU) });

/* Rice, tree crowns and farm furniture are hundreds of tapers and ellipses
   each, and they are the same hundreds every frame. Draw them once into a small
   canvas and blit that instead. */
const _farmSpr = new Map();
function farmSprite(key, w, h, paint){
  let c=_farmSpr.get(key);
  if(!c){
    if(_farmSpr.size>60) _farmSpr.clear();
    c=mkCv(Math.max(1,Math.ceil(w)), Math.max(1,Math.ceil(h)));
    paint(G2(c));
    _farmSpr.set(key,c);
  }
  return c;
}
/* bake a thing that stands on the ground at (x, gy): the painter is handed a
   context and the local coordinates its ground point sits at, so one function
   draws both the sprite and, if it ever needed to, the live version */
function baked(g, key, x, gy, w, h, ax, ay, paint){
  /* the anchor has to land on a whole pixel, or the sprite's own rounding and
     the blit's rounding disagree and the thing shifts half a pixel */
  ax=R(ax); ay=R(ay);
  g.drawImage(farmSprite(key, w, h, gg=>paint(gg, ax, ay)), R(x-ax), R(gy-ay));
}

const farmOpen = ()=> FARM.rented;
const bedOpen  = pl => FARM.rented && pl.i < FARM.beds;
const padOpen  = pd => FARM.rented && pd.i < FARM.paddies;
const treeOpen = tr => FARM.rented && tr.i < FARM.trees;

/* ---------- finding what you are standing at ---------- */
function plotAt(x){ for(const pl of PLOTS) if(bedOpen(pl) && Math.abs(pl.x-x)<14) return pl; return null; }
function paddyAt(x){ for(const pd of PADDIES) if(padOpen(pd) && Math.abs(pd.x-x)<30) return pd; return null; }
function treeAt(x){ for(const tr of TREES) if(treeOpen(tr) && Math.abs(tr.x-x)<18) return tr; return null; }

/* ============================================================
   GROWING
   ============================================================ */
function stepFarm(dt){
  if(FARM._lit!==FARM.rented){
    FARM._lit=FARM.rented;
    for(const l of LIGHTS) if(l.id && l.id.indexOf('farm')===0) l.on=FARM.rented;
  }
  for(const pl of PLOTS){
    pl.sway += dt*0.7;
    if(pl.pop>0) pl.pop -= dt;
    if(!pl.stage) continue;
    let rate = pl.wet>0 ? 2.1 : 0.85;
    if(pl.fert>0) rate *= 1.5;                 // manure is worth carrying up the road
    if(pl.wet>0) pl.wet -= dt;
    pl.t += dt*rate;
    const need = pl.stage===1? GROW_A : GROW_B;
    if(pl.stage<3 && pl.t>=need){
      pl.stage++; pl.t=0; pl.pop=0.9;
      if(pl.stage===3){ pl.fert=0; AU.ranat(880,0,0.04);
        for(let k=0;k<5;k++) pSpark(pl.x+rnd(-6,6), groundY(pl.x)-16, 1, PAL.jadeL); }
      else AU.blip();
    }
  }
  /* rice takes its time and wants standing water the whole way */
  for(const pd of PADDIES){
    pd.sway += dt*0.55;
    if(pd.pop>0) pd.pop -= dt;
    if(pd.flood>0) pd.flood -= dt*0.5;
    if(!pd.stage) continue;
    if(pd.flood<=0) continue;                  // a dry paddy simply waits
    pd.t += dt;
    const need = pd.stage===1? 16 : 20;
    if(pd.stage<3 && pd.t>=need){
      pd.stage++; pd.t=0; pd.pop=1;
      if(pd.stage===3){ AU.ranat(660,0,0.05); AU.ranat(990,0.09,0.04);
        for(let k=0;k<8;k++) pSpark(pd.x+rnd(-24,24), groundY(pd.x)-20, 1, '#e8d06a'); }
      else AU.blip();
    }
  }
  /* a fruit tree is planted once and then bears for ever, slowly */
  for(const tr of TREES){
    tr.sway += dt*0.4;
    if(tr.pop>0) tr.pop -= dt;
    if(!tr.crop) continue;
    if(tr.grow<1){ tr.grow = Math.min(1, tr.grow + dt/34); if(tr.grow>=1){ AU.ranat(520,0,0.05); tr.pop=1; } continue; }
    if(tr.fruit<3){ tr.t += dt; if(tr.t>=22){ tr.t=0; tr.fruit++; tr.pop=0.7; AU.blip(); } }
  }
  stepPen(dt);
}

/* ============================================================
   THE ANIMALS — they never die and they never leave. If you stop
   feeding them they simply stop giving anything back, and look at
   you about it.
   ============================================================ */
function penHas(){ const p=FARM.pen; return p.chicken+p.duck+p.buffalo; }
function stepPen(dt){
  const p=FARM.pen;
  if(!penHas()) return;
  p.t += dt;
  if(p.feed>0){
    p.feed -= dt*(0.12*penHas());
    if(p.t>=9){
      p.t=0;
      if(p.chicken) p.egg  = Math.min(9, p.egg  + p.chicken);
      if(p.duck)    p.degg = Math.min(9, p.degg + p.duck);
      if(p.buffalo) p.milk = Math.min(6, p.milk + p.buffalo);
      p.dung = Math.min(9, p.dung + Math.ceil(penHas()/2));
      AU.blip();
    }
  } else { p.feed=0; p.t=0; }
}
function penFull(){ const p=FARM.pen; return p.egg+p.degg+p.milk+p.dung; }
function penCollect(){
  const p=FARM.pen;
  if(!penHas()){ khwanSay('There is nothing in the pen yet. The stall sells chickens.'); AU.blip(); return; }
  if(!penFull()){
    khwanSay(p.feed>0? 'Nothing yet. Give them an hour.' : 'They are hungry. Rice bran, from the stall.');
    AU.blip(); return;
  }
  preteAct('pick', 1.0, ()=>{
    let got=0;
    const take=(k,id)=>{ if(p[k]>0){ bagAdd(id,p[k],true); got+=p[k]; p[k]=0; } };
    take('egg','egg'); take('degg','duckEgg'); take('milk','milk'); take('dung','manure');
    AU.ranat(760,0,0.05);
    toast('+'+got+' '+L('from the pen'), '#e8d0a0');
    for(let k=0;k<8;k++) part({k:'pop',x:PEN_X+rnd(-18,18),y:groundY(PEN_X)-14,vx:rnd(-24,24),vy:rnd(-46,-14),life:.7,c:'#f2e4c8'});
    saveGame();
  });
}
function penFeed(){
  const p=FARM.pen;
  if(!penHas()){ khwanSay('Buy an animal first.'); AU.blip(); return; }
  if(!bagHas('bran')){ khwanSay('You have no bran. Mill rice, or buy a sack at the stall.'); AU.blip(); return; }
  preteAct('give', 0.9, ()=>{
    bagTake('bran',1);
    p.feed = Math.min(60, p.feed + 30);
    AU.step();
    for(let k=0;k<10;k++) part({k:'pop',x:PEN_X+rnd(-20,20),y:groundY(PEN_X)-8,vx:rnd(-14,14),vy:rnd(-24,-6),life:.6,c:'#d3b478'});
    toast(L('fed'),'#d3b478');
    if(!GS.seen.fed){ GS.seen.fed=true; khwanSay('A fed animal gives you something back every little while. Come and look in the pen.',7); }
    saveGame();
  });
}

/* ============================================================
   WORKING A BED
   ============================================================ */
function plotPrompt(pl){
  if(pl.stage===0) return bagHas('seed')? 'plant a seed' : 'the bed is empty';
  if(pl.stage===3) return 'harvest it';
  return pl.wet>0? 'it is growing' : 'it needs water';
}
function usePlot(pl){
  P.face = pl.x < P.x ? -1 : 1;
  if(pl.stage===0){
    if(!bagHas('seed')){ khwanSay('No seed left. There is a crate at the gate.'); AU.blip(); return; }
    preteAct('plant', 1.05, ()=>{
      if(!bagTake('seed',1)) return;
      pl.stage=1; pl.t=0; pl.wet=0; pl.pop=1;
      if(bagHas('manure') && bagTake('manure',1)){ pl.fert=1; toast(L('sown, and fed'),'#c9a86a'); }
      else toast(L('sown'),'#c9a86a');
      AU.step(); pDust(pl.x, groundY(pl.x), 8);
      for(let k=0;k<4;k++) part({k:'sp',x:pl.x+rnd(-4,4),y:groundY(pl.x)-6,vx:rnd(-8,8),vy:rnd(-14,-4),life:.6,c:'#c9a86a'});
      if(!GS.seen.sown){ GS.seen.sown=true;
        vignette('firstSeed');
        khwanSay('Now water it. Wet earth grows twice as fast.',7); }
      saveGame();
    });
    return;
  }
  if(pl.stage===3){
    preteAct('pick', 1.0, ()=>{
      const n = has('two')? 3 : 2;
      bagAdd(pl.crop, n, true); bagAdd('seed', 1, true);
      addMerit(1,true); GS.q.harvest=(GS.q.harvest||0)+1;
      toast('+'+n+' '+L(ITEMS[pl.crop].n), PAL.jadeL);
      for(let k=0;k<9;k++) part({k:'pop',x:pl.x,y:groundY(pl.x)-18,vx:rnd(-30,30),vy:rnd(-56,-18),life:.7,c:ITEMS[pl.crop].c});
      AU.ranat(700,0,0.05); AU.ranat(1046,0.08,0.04);
      pl.stage=0; pl.t=0; pl.wet=0; pl.pop=1;
      if(GS.q.harvest===1) vignette('firstHarvest');
      saveGame();
    });
    return;
  }
  preteAct('water', 1.15, ()=>{
    pl.wet = 9; pl.pop = 0.6;
    AU.pour();
    for(let k=0;k<14;k++) part({k:'water',x:pl.x+rnd(-7,7),y:groundY(pl.x)-30,vx:rnd(-8,8),vy:rnd(30,70),life:.55});
    toast(L('watered'),'#8fc4e8');
  });
}

/* ============================================================
   WORKING A PADDY — flood it, sow it, wait a long while, cut it
   ============================================================ */
function paddyPrompt(pd){
  if(pd.stage===0) return bagHas('seed')? 'flood it and sow the rice' : 'the paddy is dry';
  if(pd.stage===3) return 'cut the rice';
  return pd.flood>0? 'the rice is coming on' : 'let the water back in';
}
function usePaddy(pd){
  P.face = pd.x < P.x ? -1 : 1;
  if(pd.stage===0){
    if(!bagHas('seed')){ khwanSay('Rice starts as seed too. The crate is at the gate.'); AU.blip(); return; }
    preteAct('plant', 1.2, ()=>{
      if(!bagTake('seed',1)) return;
      pd.stage=1; pd.t=0; pd.flood=40; pd.pop=1;
      AU.pour();
      for(let k=0;k<18;k++) part({k:'water',x:pd.x+rnd(-26,26),y:groundY(pd.x)-14,vx:rnd(-10,10),vy:rnd(10,40),life:.6});
      toast(L('flooded and sown'),'#8fc4e8');
      if(!GS.seen.paddy){ GS.seen.paddy=true;
        khwanSay('Rice is slow and it wants the water kept up. Everything here waits on the rice.',8); }
      saveGame();
    });
    return;
  }
  if(pd.stage===3){
    preteAct('pick', 1.3, ()=>{
      const n = 4 + (has('two')?2:0);
      bagAdd('rice', n, true); bagAdd('bran', 2, true); bagAdd('seed', 2, true);
      addMerit(2,true); GS.q.rice=(GS.q.rice||0)+1;
      toast('+'+n+' '+L('sticky rice')+' · '+L('rice bran'), '#e8d06a');
      for(let k=0;k<16;k++) part({k:'pop',x:pd.x+rnd(-24,24),y:groundY(pd.x)-22,vx:rnd(-34,34),vy:rnd(-62,-18),life:.8,c:'#e8d06a'});
      AU.ranat(660,0,0.06); AU.ranat(880,0.09,0.05); AU.ranat(1180,0.18,0.04);
      pd.stage=0; pd.t=0; pd.flood=0; pd.pop=1;
      if(GS.q.rice===1) vignette('firstRice');
      saveGame();
    });
    return;
  }
  preteAct('water', 1.25, ()=>{
    pd.flood = 40; pd.pop = 0.6;
    AU.pour();
    for(let k=0;k<20;k++) part({k:'water',x:pd.x+rnd(-28,28),y:groundY(pd.x)-24,vx:rnd(-8,8),vy:rnd(24,60),life:.6});
    toast(L('the water is up'),'#8fc4e8');
  });
}

/* ============================================================
   THE FARM, DRAWN
   ============================================================ */
function drawFarm(g){
  const x0=FARM_GATE-30, x1=TREE_XS[TREE_XS.length-1]+40;
  if(x1-GS.camX<-60 || x0-GS.camX>W+60) return;
  if(FARM.rented) drawFarmLights(g);
  drawFarmGate(g);
  drawSeedBox(g);
  drawFarmhouse(g);
  drawPen(g);
  for(const pl of PLOTS) drawBed(g,pl);
  for(const pd of PADDIES) drawPaddy(g,pd);
  for(const tr of TREES) drawFruitTree(g,tr);
}

/* Somebody strung lanterns over the beds the week the place was rented, and
   nobody has taken them down. It is the only reason you can work after dark. */
function drawFarmLights(g){
  const a=BED_XS[0]-26, b=TREE_XS[TREE_XS.length-1]+10;
  if(b-GS.camX<-40 || a-GS.camX>W+40) return;
  const gy=groundY((a+b)/2), ly=gy-66;
  for(const px of [a,b]){ pR(g,px,ly,2,40,'#6d5138'); pR(g,px,ly,1,40,'#8a684a'); pR(g,px-1,ly-2,4,2,'#a07c58'); }
  /* the wire sags the whole width of the farm; only draw the bit of it that is
     actually on screen, which is a sixth of it */
  const s0=Math.max(a, GS.camX-6), s1=Math.min(b, GS.camX+W+6);
  for(let sx=a+Math.ceil((s0-a)/3)*3; sx<s1; sx+=3){
    const t=(sx-a)/(b-a);
    pR(g,sx,ly+2+Math.sin(t*Math.PI)*7,3,1,'rgba(40,30,20,0.7)');
  }
  const COL=['#ffd27a','#ffb87a','#ffe0a0','#ffc98a','#ffd27a','#ffbe86','#ffdb96'];
  for(let k=0;k<7;k++){
    const t=(k+1)/8, lxx=lerp(a,b,t), sag=Math.sin(t*Math.PI)*7;
    if(lxx-GS.camX<-46||lxx-GS.camX>W+46) continue;
    const c=COL[k], fl=0.82+0.18*Math.sin(GS.t*2.8+k*1.7);
    drawGlow(g,lxx,ly+sag+8,34,'#ffce7c',0.32*fl);
    // a paper lantern: two dark caps and a lit barrel between them
    const by=ly+sag+8;
    pR(g,lxx,ly+sag+2,1,4,'#4a3a2a');
    pR(g,lxx-3,by-4,7,1,'#3b2412');
    pEll(g,lxx,by,4,4.4,'#3b2412');
    pEll(g,lxx,by,3.2,3.6,rgba(c,fl));
    pEll(g,lxx-1,by-1,1.4,1.8,'#fff4d0');
    pR(g,lxx-3,by+4,7,1,'#3b2412');
    pR(g,lxx,by+5,1,2,rgba('#c9992f',0.8));
  }
}

/* the gate, and the board the landlord nailed to it */
function drawFarmGate(g){
  const x=FARM_GATE, gy=groundY(x);
  if(x-GS.camX<-60||x-GS.camX>W+60) return;
  for(const px of [x-16,x+16]){
    pR(g,px,gy-46,4,46,'#6d5138'); pR(g,px,gy-46,2,46,'#8a684a');
    pR(g,px-1,gy-48,6,3,'#7a5c40');
  }
  pR(g,x-18,gy-50,40,4,'#5d4735'); pR(g,x-18,gy-50,40,1,'#7a5c44');
  // the board itself, hung slightly crooked because nobody has straightened it
  const by=gy-44;
  pR(g,x-15,by,32,22,'#3b2412');
  pR(g,x-14,by+1,30,20, FARM.rented? '#c9a468' : '#a08a62');
  pR(g,x-14,by+1,30,1,'#e2c48c');
  for(let i=0;i<3;i++) pR(g,x-11,by+5+i*5,24-i*3,1,'#6b4a2c');
  if(!FARM.rented){
    const bl=0.5+0.5*Math.sin(GS.t*2.4);
    pR(g,x+1,by-8-bl*2,1,1,rgba(PAL.goldL,0.4+0.5*bl));
    for(let i=0;i<3;i++) pR(g,x-8+i*7,by+16,3,3,'#7a2a24');    // FOR RENT, in red
  }
  // a fence running east from the gate, so the farm has an edge
  for(let fx=x+22; fx<BED_XS[0]-24; fx+=14){
    const fgy=groundY(fx);
    pR(g,fx,fgy-18,2,18,'#6d5138'); pR(g,fx,fgy-18,1,18,'#856448');
  }
  pR(g,x+22,gy-14,BED_XS[0]-24-x-22,2,'#5d4735');
}

/* the shack. Derelict until you pay, then somebody fixes the roof. */
function drawFarmhouse(g){
  const x=FARMHOUSE_X, gy=groundY(x);
  if(x-GS.camX<-70||x-GS.camX>W+70) return;
  const fix=FARM.house;
  baked(g,'house'+(fix>0.5?1:0), x, gy, 74, 92, 38, 88,
        (gg,ax,ay)=>paintFarmhouse(gg,ax,ay,fix));
  if(fix>0.5){
    // the doorway lamp is the only part that moves, so it is the only part
    // that is not in the sprite
    const fl=0.85+0.15*Math.sin(GS.t*3.1);
    drawGlow(g,x+22,gy-40,40,'#ffce7c',0.34*fl);
    pEll(g,x+22,gy-42,3.2,4.2,rgba('#ffd27a',fl));
    pEll(g,x+21,gy-43,1.2,1.6,'#fff4d0');
  }
}
function paintFarmhouse(g,x,gy,fix){
  const WALL = fix>0.5? '#8a6142' : '#6a5a48';
  const ROOF = fix>0.5? '#7a3b30' : '#4a4038';
  // stilts
  for(let i=0;i<4;i++){ const sx=x-22+i*14;
    pR(g,sx,gy-26,5,26, '#4a3728'); pR(g,sx,gy-26,2,26,'#5f4a37'); }
  pR(g,x-26,gy-30,56,5,'#5f4a37'); pR(g,x-26,gy-30,56,1,'#7d6449');
  // walls
  pR(g,x-24,gy-58,48,28,WALL);
  for(let y=gy-55;y<gy-30;y+=5) pR(g,x-24,y,48,1,shade(WALL,-0.22));
  pR(g,x+12,gy-58,12,28,shade(WALL,-0.2));
  if(fix<0.5){ // holes in the wall where the planks went
    pR(g,x-14,gy-50,7,9,'#241a14'); pR(g,x+2,gy-42,5,7,'#241a14');
  } else {
    pR(g,x+2,gy-52,13,11,'#3a2b20'); pR(g,x+3,gy-51,11,9,PAL.lamp);
    pR(g,x+3,gy-51,11,2,shade(PAL.lamp,0.25));
  }
  pR(g,x-20,gy-44,13,14,'#2c2018'); pR(g,x-19,gy-43,11,13,'#241a14');
  // roof
  for(let i=0;i<7;i++){
    const t=i/6, yy=lerp(gy-58,gy-76,t), ww=lerp(58,14,t);
    pR(g,x-ww/2,yy-3,ww,4, i%2? shade(ROOF,-0.16):ROOF);
    pR(g,x-ww/2,yy-3,ww,1, shade(ROOF,0.12));
  }
  if(fix<0.5){ // a hole right through the ridge
    pR(g,x-6,gy-74,13,7,'#12100c');
    for(let i=0;i<4;i++) pTaper(g,x-6+i*4,gy-68,x-8+i*5,gy-76,2,1,'#3a332a');
  } else {
    pTaper(g,x-1,gy-76,x-7,gy-84,3,1,PAL.gold);
    pTaper(g,x+1,gy-76,x+7,gy-84,3,1,PAL.gold);
    pR(g,x-1,gy-82,2,7,PAL.goldD);
  }
  pR(g,x-30,gy-59,60,3,shade(ROOF,-0.3));
  if(fix>0.5){
    // the bracket and shade of the door lamp; the flame is drawn live
    pR(g,x+22,gy-50,1,5,'#4a3a2a');
    pEll(g,x+22,gy-42,4.4,5.4,'#3b2412');
    // somebody lives here now: a stool, a jar, a line of washing
    pR(g,x+22,gy-8,7,8,'#8a5e3a'); pEll(g,x+25,gy-9,4,2,'#6b4529');
    pR(g,x-34,gy-24,1,10,'#3a3630');
    for(let i=0;i<2;i++) pR(g,x-33+i*9,gy-24,7,9, i?'#4a7a9e':'#e8dfc8');
    for(let i=0;i<4;i++) pR(g,x-14+i*3,gy-30,2,2,'#3f7a52');
  } else {
    // weeds through the floor, and the door hanging open
    for(let i=0;i<9;i++) pTaper(g,x-26+i*7,gy,x-28+i*7,gy-7-((i*5)%6),2,0.6,'#3f5a3c');
  }
}

/* the pen: a rail fence, a coop, and whoever you have bought */
function drawPen(g){
  const x=PEN_X, gy=groundY(x);
  if(x-GS.camX<-70||x-GS.camX>W+70) return;
  const p=FARM.pen;
  // fence, coop and straw never change; the lamp and the animals do
  baked(g,'pen', x, gy, 80, 48, 40, 40, (gg,ax,ay)=>paintPen(gg,ax,ay,x,gy));
  { const fl=0.84+0.16*Math.sin(GS.t*2.6);
    drawGlow(g,x+34,gy-26,32,'#ffce7c',0.28*fl);
    pEll(g,x+34,gy-28,2.4,3.2,rgba('#ffd27a',fl)); }
  // the animals
  for(let i=0;i<p.chicken;i++) drawHen(g, x-26+i*11, gy, i);
  for(let i=0;i<p.duck;i++)    drawDuck(g, x-4+i*12, gy, i);
  if(p.buffalo) drawBuffalo(g, x+2, gy);
  // hungry animals look at you about it
  if(penHas() && p.feed<=0){
    const bl=0.5+0.5*Math.sin(GS.t*3);
    pTxt(g,'!',x+30,gy-30-bl*2,'#e8b13c',7,'center');
  }
  if(penFull()){
    const bl=0.5+0.5*Math.sin(GS.t*2.6);
    for(let k=0;k<3;k++){ const a=GS.t*1.4+k*2.1;
      pR(g,x+Math.cos(a)*10, gy-34+Math.sin(a)*4, 1,1, rgba(PAL.goldL,0.35+0.5*bl)); }
    pEll(g,x,gy-36,3.4,2.6,'#3b2412'); pEll(g,x,gy-36.6,2.6,2,'#f2e4c8');
  }
}
function drawHen(g,x,gy,i){
  const t=GS.t*1.6+i*2.1, peck=Math.max(0,Math.sin(t))*2;
  const B='#f2ece0', BD='#cfc4a8';
  pEll(g,x,gy-6,5,4,B); pEll(g,x+1.6,gy-6,3,3,BD);
  pEll(g,x-4,gy-9+peck,3,3,B);
  pTri(g,x-7,gy-9+peck,x-4,gy-10+peck,x-4,gy-8+peck,'#e8a13c');
  pR(g,x-5,gy-11+peck,3,2,'#c0392f');
  pR(g,x-4.5,gy-9.6+peck,1,1,'#2c2020');
  pTaper(g,x+4,gy-7,x+7,gy-10,3,1,BD);
  pR(g,x-2,gy-2,1,2,'#e8a13c'); pR(g,x+1,gy-2,1,2,'#e8a13c');
}
function drawDuck(g,x,gy,i){
  const t=GS.t*1.2+i*1.7, wob=Math.sin(t)*1.4;
  const B='#e2ecd8', BD='#b8c8a8';
  pEll(g,x+wob*0.3,gy-6,6,4,B); pEll(g,x+2,gy-6,3.4,3,BD);
  pEll(g,x-5+wob*0.3,gy-10,3.2,3,B);
  pR(g,x-9+wob*0.3,gy-10,4,2,'#e8b13c');
  pR(g,x-5.4+wob*0.3,gy-10.6,1,1,'#2c2020');
  pTaper(g,x+5,gy-7,x+8,gy-9,3,1,BD);
  pR(g,x-1,gy-2,1,2,'#e8b13c'); pR(g,x+2,gy-2,1,2,'#e8b13c');
}
function drawBuffalo(g,x,gy){
  const t=GS.t*0.7, br=Math.sin(t)*0.6;
  const B='#5a5560', BD='#3f3b46';
  pEll(g,x,gy-5,4,3,'rgba(10,8,20,0.35)');
  pR(g,x-9,gy-9,4,9,BD); pR(g,x+5,gy-9,4,9,BD);
  pEll(g,x,gy-15+br,13,8,B); pEll(g,x+5,gy-14+br,7,6,BD);
  pEll(g,x-13,gy-18+br,6,5,B); pEll(g,x-15,gy-16+br,4,3,BD);
  pR(g,x-18,gy-16+br,4,3,'#2e2a34');                     // the muzzle
  pR(g,x-15,gy-19+br,1,1,'#f2ece0');
  // horns, swept back the way a water buffalo's are
  pTaper(g,x-12,gy-22+br,x-19,gy-26+br,3,1.4,'#c9c0a8');
  pTaper(g,x-12,gy-22+br,x-5,gy-26+br,3,1.4,'#b8ae96');
  pTaper(g,x+12,gy-14+br,x+17,gy-8+br,3,1,BD);           // tail
}

/* ---------- one dry bed ---------- */
function drawBed(g,pl){
  const gy=groundY(pl.x);
  if(pl.x-GS.camX<-40||pl.x-GS.camX>W+40) return;
  if(!bedOpen(pl)){
    // not yours yet: rough ground and a stake where the bed would be
    pEll(g,pl.x,gy,12,4,'#4a4436');
    for(let i=0;i<5;i++) pTaper(g,pl.x-8+i*4,gy,pl.x-9+i*4,gy-5-((i*5)%5),2,0.6,'#4f6a44');
    pR(g,pl.x+10,gy-14,2,14,'#6d5138');
    if(FARM.rented){ const bl=0.5+0.5*Math.sin(GS.t*2+pl.i);
      pR(g,pl.x+10,gy-19-bl*2,1,1,rgba('#8fc48a',0.3+0.4*bl)); }
    return;
  }
  const pop=Math.max(0,pl.pop), sw=Math.sin(pl.sway)*1.2;
  pEll(g,pl.x,gy,13,5.4,'#3d2b1c');
  pEll(g,pl.x,gy-2,12.4,5,'#7d5c3c');
  pEll(g,pl.x,gy-3.4,10.6,3.8, pl.wet>0? '#553f27':'#8f6b47');
  for(let k=0;k<5;k++) pR(g,pl.x-8+k*4,gy-4.6,2,1,pl.wet>0?'#3a2a1a':'#8d6a48');
  if(pl.fert>0) for(let k=0;k<4;k++) pR(g,pl.x-6+k*4,gy-5.4,2,1,'#5a4028');
  if(pl.wet>0 && Math.random()<0.05) part({k:'sp',x:pl.x+rnd(-7,7),y:gy-5,vx:0,vy:-6,life:.5,c:'#8fc4e8'});

  if(pl.stage===1){ pEll(g,pl.x,gy-5,3.6,2,'#5a4230'); pR(g,pl.x,gy-8,1,3,'#7fa85e'); }
  else if(pl.stage===2){
    pTaper(g,pl.x,gy-3,pl.x+sw*0.6,gy-16,2.6,1.5,'#5f9a52');
    pEll(g,pl.x+sw*0.6-3.6,gy-14,3.8,2.2,'#6fbf62');
    pEll(g,pl.x+sw*0.6+3.6,gy-16,3.8,2.2,'#5f9a52');
  } else if(pl.stage===3){
    pTaper(g,pl.x,gy-3,pl.x+sw,gy-27,3.4,1.8,'#4f8a46');
    for(let k=0;k<5;k++){ const a=Math.PI*(0.12+k*0.19), s2=k%2?1:-1;
      pEll(g,pl.x+sw*0.7+Math.cos(a)*8*s2, gy-22+Math.sin(a)*5, 4.4,2.6, k%2?'#5f9a52':'#6fbf62'); }
    const fl=Math.sin(GS.t*2.2+pl.i)*1.4;
    drawIcon(g,pl.crop,pl.x+sw,gy-34+fl,0.72);
    const bl=0.5+0.5*Math.sin(GS.t*3+pl.i);
    for(let k=0;k<3;k++){ const a=GS.t*1.6+k*2.1;
      pR(g,pl.x+sw+Math.cos(a)*9, gy-34+fl+Math.sin(a)*4, 1,1, rgba(PAL.goldL,0.3+0.5*bl)); }
  }
  if(pop>0.02){ g.globalAlpha=clamp(pop,0,1)*0.8;
    for(let k=0;k<6;k++){ const a=k/6*TAU;
      pR(g,pl.x+Math.cos(a)*(10+(1-pop)*9), gy-9+Math.sin(a)*(4+(1-pop)*4),1,1,'#e8dfc8'); }
    g.globalAlpha=1; }
  // the marker board, readable from the far side of the road
  pR(g,pl.x+12,gy-17,2,17,'#7d5a3c');
  pR(g,pl.x+11,gy-18,4,2,'#96704c');
  pR(g,pl.x+8,gy-27,11,10,'#3b2412');
  pR(g,pl.x+9,gy-26,9,8,'#c9a468');
  pR(g,pl.x+9,gy-26,9,1,'#e2c48c');
  drawIcon(g,pl.crop,pl.x+13.5,gy-22,0.4);
}

/* ---------- นาข้าว ----------
   A paddy is a shallow box: an earth bund all the way round, the water
   sitting a little below the top of it, and the rice standing in that.
   Drawn flat it just looks like a row of sticks, so the bund does the
   work of telling you this is a field and not a fence. ---------- */
function drawPaddy(g,pd){
  const gy=groundY(pd.x), HW=32, D=7;          // half width, and how deep the box is
  if(pd.x-GS.camX<-80||pd.x-GS.camX>W+80) return;
  if(!padOpen(pd)){
    pEll(g,pd.x,gy-1,HW,6,'#4a4436');
    for(let i=0;i<11;i++) pTaper(g,pd.x-HW+4+i*6,gy-2,pd.x-HW+3+i*6,gy-8-((i*7)%6),2,0.6,'#4f6a44');
    pR(g,pd.x+HW-4,gy-16,2,14,'#6d5138');
    pR(g,pd.x+HW-8,gy-24,10,9,'#3b2412'); pR(g,pd.x+HW-7,gy-23,8,7,'#8a7458');
    return;
  }
  const wet = pd.flood>0;
  // the sunken field, then the water or the cracked mud in it
  pR(g,pd.x-HW,gy-D,HW*2,D+3,'#3a2c1e');
  if(wet){
    pR(g,pd.x-HW+1,gy-D+2,HW*2-2,D,'#1d3a52');
    for(let i=1;i<HW*2-2;i+=3){
      const x=pd.x-HW+1+i, sh=Math.sin(GS.t*1.3+i*0.28)*0.7;
      pR(g,x,gy-D+3+sh,3,1,'#2b5f80');
    }
    // the moon lying in it, which is the whole reason to stand here at night
    pR(g,pd.x-HW*0.55,gy-D+3,HW*0.9,1,'rgba(214,236,255,0.30)');
    pR(g,pd.x-HW*0.3,gy-D+5,HW*0.5,1,'rgba(190,225,255,0.18)');
    if(Math.random()<0.05) part({k:'sp',x:pd.x+rnd(-HW,HW),y:gy-D+3,vx:0,vy:-5,life:.5,c:'#8fc4e8'});
  } else {
    pR(g,pd.x-HW+1,gy-D+2,HW*2-2,D,'#5e4d38');
    for(let i=0;i<13;i++) pR(g,pd.x-HW+4+i*5,gy-D+3+((i%3)),4,1,'#43372a');
  }
  const sw=Math.sin(pd.sway)*1.2;
  /* the rice, painted once per stage and blitted — the whole field swaying as
     one block is what a rice field does in wind anyway */
  if(pd.stage>0){
    baked(g,'rice'+pd.stage, pd.x+sw, gy-D+3, HW*2+10, 36, HW+5, 34,
          (gg,ax,ay)=>paintRice(gg,ax,ay,pd.stage));
    if(pd.stage===3){
      const bl=0.5+0.5*Math.sin(GS.t*2.6+pd.i);
      for(let k=0;k<5;k++){ const a=GS.t*1.2+k*1.3;
        pR(g,pd.x+Math.cos(a)*22, gy-D-28+Math.sin(a)*6, 1,1, rgba('#ffe89a',0.3+0.5*bl)); }
    }
  }
  // the bund, drawn last so the rice grows out of behind it
  pR(g,pd.x-HW-4,gy-D,HW*2+8,4,'#7a6a4c');
  pR(g,pd.x-HW-4,gy-D,HW*2+8,1,'#9a8a68');
  pR(g,pd.x-HW-4,gy-D+3,HW*2+8,3,'#54452f');
  for(let i=0;i<7;i++) pTaper(g,pd.x-HW+i*11,gy-D,pd.x-HW+i*11-1,gy-D-4,1.6,0.6,'#4f6a44');
  if(pd.pop>0.02){ g.globalAlpha=clamp(pd.pop,0,1)*0.7;
    for(let k=0;k<9;k++){ const a=k/9*TAU;
      pR(g,pd.x+Math.cos(a)*(22+(1-pd.pop)*14), gy-D-8+Math.sin(a)*(5+(1-pd.pop)*4),1,1,'#dff0ff'); }
    g.globalAlpha=1; }
  // the marker post
  pR(g,pd.x+HW-1,gy-22,2,20,'#7d5a3c');
  pR(g,pd.x+HW-5,gy-33,11,11,'#3b2412');
  pR(g,pd.x+HW-4,gy-32,9,9,'#c9a468'); pR(g,pd.x+HW-4,gy-32,9,1,'#e2c48c');
  drawIcon(g,'rice',pd.x+HW+0.5,gy-27,0.42);
}

/* ---------- a fruit tree ----------
   These are the slowest thing on the farm and they have to look like it:
   a proper trunk, a crown you could stand under, and each kind its own
   silhouette so you can tell the orchard apart at a glance. ---------- */
const TREE_LOOK = {
  durian:     { leaf:'#2b5a38', dark:'#1e4429', lit:'#3f7a4c', H:96, CW:20, CH:26, tall:1 },
  mangosteen: { leaf:'#204a34', dark:'#163726', lit:'#356b47', H:74, CW:24, CH:20, tall:0 },
  rambutan:   { leaf:'#2f6a42', dark:'#215030', lit:'#4a8f58', H:70, CW:28, CH:17, tall:0 },
};
function drawFruitTree(g,tr){
  const gy=groundY(tr.x);
  if(tr.x-GS.camX<-70||tr.x-GS.camX>W+70) return;
  if(!treeOpen(tr)){
    pEll(g,tr.x,gy,9,4,'#4a3524'); pEll(g,tr.x,gy-1,7,3,'#3a2a1a');
    pR(g,tr.x+8,gy-12,2,12,'#6d5138');
    return;
  }
  if(!tr.crop){
    pEll(g,tr.x,gy,11,4.6,'#4a3524'); pEll(g,tr.x,gy-1,9,3.6,'#2e2114');
    for(let i=0;i<4;i++) pR(g,tr.x-7+i*4,gy-3,3,1,'#5f4630');
    const bl=0.5+0.5*Math.sin(GS.t*2+tr.i);
    pR(g,tr.x,gy-15-bl*2,1,1,rgba('#8fc48a',0.3+0.4*bl));
    // a spade left leaning in the hole, so it reads as waiting, not abandoned
    pTaper(g,tr.x+7,gy-2,tr.x+11,gy-19,2,1.6,'#7d5a3c');
    pR(g,tr.x+10,gy-23,3,5,'#8a8f9e');
    return;
  }
  const T=TREE_LOOK[tr.crop]||TREE_LOOK.rambutan;
  /* a whole tree is four hundred scanline shapes and it is the same four
     hundred every frame; bake it per kind and per how much fruit is on it */
  const q = tr.grow>=1? 9 : Math.round(tr.grow*8);
  baked(g,'tree|'+tr.crop+'|'+q+'|'+tr.fruit, tr.x, gy,
        T.CW*3.4+24, T.H+T.CH*2.4+16, (T.CW*3.4+24)/2, T.H+T.CH*2.4+15,
        (gg,ax,ay)=>paintTree(gg,ax,ay,tr,T));
  if(tr.grow>=1 && tr.fruit>0){
    const cy=gy-(12+(T.H-12)), bl=0.5+0.5*Math.sin(GS.t*2.4+tr.i);
    for(let m=0;m<4;m++){ const a=GS.t*1.3+m*1.6;
      pR(g,tr.x+Math.cos(a)*(T.CW+6), cy+Math.sin(a)*(T.CH+4), 1,1, rgba(PAL.goldL,0.3+0.5*bl)); }
  }
  if(tr.pop>0.02){ g.globalAlpha=clamp(tr.pop,0,1)*0.8;
    for(let m=0;m<7;m++){ const a=m/7*TAU;
      pR(g,tr.x+Math.cos(a)*(T.CW+2+(1-tr.pop)*12), gy-T.H*0.6+Math.sin(a)*(T.CH+2+(1-tr.pop)*8),1,1,'#e8dfc8'); }
    g.globalAlpha=1; }
  // the name board at the foot of the tree, which does not sway with it
  pR(g,tr.x+10,gy-12,2,12,'#7d5a3c');
  pR(g,tr.x+6,gy-22,11,10,'#3b2412');
  pR(g,tr.x+7,gy-21,9,8,'#c9a468'); pR(g,tr.x+7,gy-21,9,1,'#e2c48c');
  drawIcon(g,tr.crop,tr.x+11.5,gy-17,0.4);
}
/* one paddy's worth of rice, drawn upright — the sway is applied to the blit,
   because a rice field leans as one sheet and not stalk by stalk */
/* the standing parts of the pen. wx/wgy are where it really is, so the posts
   can still follow the ground the way they did when this was drawn live */
function paintPen(g,x,gy,wx,wgy){
  for(let dx=-32; dx<=32; dx+=13){
    const dy=groundY(wx+dx)-wgy;
    pR(g,x+dx,gy+dy-20,2,20,'#6d5138'); pR(g,x+dx,gy+dy-20,1,20,'#856448');
  }
  pR(g,x-32,gy-18,66,2,'#5d4735'); pR(g,x-32,gy-18,66,1,'#7a5c44');
  pR(g,x-32,gy-10,66,2,'#54402f');
  // the hurricane lamp on the corner post, minus its flame
  pR(g,x+34,gy-34,1,4,'#4a3a2a');
  pEll(g,x+34,gy-28,3.4,4.4,'#3b2412');
  // the coop
  pR(g,x+16,gy-24,18,14,'#7d5a3c'); pR(g,x+16,gy-24,18,2,'#9c7551');
  pR(g,x+21,gy-16,7,6,'#241a14');
  pTri(g,x+25,gy-32,x+14,gy-24,x+36,gy-24,'#5d4030');
  // straw on the ground
  for(let i=0;i<12;i++) pR(g,x-30+i*5,gy-1,4,1, i%2?'#c9a86a':'#a8863f');
}
function paintRice(g,x,gy,stage){
  const HW=32;
  if(stage===1){
    for(let i=0;i<22;i++){ const px=x-HW+4+i*2.8, o=((i*7)%3)-1;
      pTaper(g,px,gy,px+o,gy-8,1.5,0.9,'#5f9a58'); }
  } else if(stage===2){
    for(let i=0;i<26;i++){ const px=x-HW+3+i*2.4, h=13+((i*7)%6), o=((i*5)%3)-1;
      pTaper(g,px,gy,px+o,gy-h,2,0.9,'#3f7a46');
      pTaper(g,px+o,gy-h,px+o-3,gy-h+5,1.6,0.8,'#6fbf62');
      pTaper(g,px+o,gy-h,px+o+3,gy-h+6,1.5,0.7,'#4f9256'); }
  } else if(stage===3){
    for(let i=0;i<26;i++){ const px=x-HW+3+i*2.4, h=17+((i*7)%6), o=((i*5)%3)-1;
      pTaper(g,px,gy,px+o,gy-h,2.2,1,'#9a8a3a');
      // the head is heavy and bows over, which is how you know it is ready
      pTaper(g,px+o,gy-h,px+o+4,gy-h+7,2.6,1.2,'#d8bc52');
      for(let k=0;k<4;k++) pEll(g,px+o+1.2+k*1,gy-h+1.8+k*1.7,1.4,1.1,'#f2dc86'); }
  }
}
function paintTree(g,x,gy,tr,T){
  const k=tr.grow;
  const H = 12 + k*(T.H-12);
  const CW = 5 + k*(T.CW-5), CH = 4 + k*(T.CH-4);
  const cx = x, cy = gy-H;
  pEll(g,x,gy,7+k*7,3.6,'#42301f');
  pTaper(g,x,gy+1,x-6-k*5,gy-1,5,2,'#4a3524');
  pTaper(g,x,gy+1,x+6+k*5,gy-1,5,2,'#3d2a1a');
  pTaper(g,x,gy,cx,cy+CH*0.4, 3+k*5, 2+k*2.4,'#5a4436');
  pTaper(g,x+1.4,gy,cx+1.4,cy+CH*0.5, 1.4+k*1.6,1,'#6d5442');
  pTaper(g,x-1.6,gy,cx-1.6,cy+CH*0.5, 1.2+k*1.2,1,'#43301f');
  if(k<0.6){
    for(let i=0;i<5;i++) pEll(g,cx+((i%2)?4:-4),cy+i*3.4,4.4,2.6, i%2?T.leaf:T.lit);
    return;
  }
  for(let i=0;i<4;i++){ const a=Math.PI*(0.22+i*0.19);
    pTaper(g,cx,cy+CH*0.5, cx-Math.cos(a)*CW*0.7, cy-Math.sin(a)*CH*0.3, 3,1.4,'#4a3524'); }
  const blobs=[];
  if(T.tall){
    for(let r=0;r<4;r++){ const w=CW*(1-r*0.2), yy=cy-r*CH*0.36;
      for(let i=0;i<5;i++) blobs.push({x:cx+(i-2)*w*0.42, y:yy+((i%2)?2:-2), r:CH*0.44}); }
    blobs.push({x:cx, y:cy-CH*1.5, r:CH*0.4});
  } else {
    for(let i=0;i<11;i++){ const a=i/11*TAU;
      blobs.push({x:cx+Math.cos(a)*CW*0.72, y:cy+Math.sin(a)*CH*0.72, r:CH*0.62}); }
    for(let i=0;i<6;i++){ const a=i/6*TAU+0.5;
      blobs.push({x:cx+Math.cos(a)*CW*0.34, y:cy+Math.sin(a)*CH*0.32, r:CH*0.6}); }
  }
  for(const b of blobs) pEll(g,b.x,b.y,b.r*1.25,b.r,T.dark);
  for(const b of blobs) pEll(g,b.x,b.y-b.r*0.16,b.r*1.08,b.r*0.84,T.leaf);
  for(let i=0;i<blobs.length;i+=2){ const b=blobs[i];
    pEll(g,b.x-b.r*0.24,b.y-b.r*0.36,b.r*0.6,b.r*0.42,T.lit); }
  // leaf speckle, which is what makes a canopy read as leaves
  for(let i=0;i<70;i++){
    const a=(i*2.399)%TAU, rr=Math.sqrt((i%11)/11);
    pR(g, cx+Math.cos(a)*CW*rr*1.15, cy+Math.sin(a)*CH*rr*1.15 - (T.tall? CH*0.5:0),
       1,1, i%3? T.lit : shade(T.leaf,0.22));
  }
  for(let i=0;i<tr.fruit;i++){
    const a=1.0+i*1.45;
    const fx=cx+Math.cos(a)*CW*0.66, fy=cy+CH*0.5+Math.abs(Math.sin(a))*CH*0.45;
    pR(g,fx,fy-7,1,6,'#3a2a1a');
    drawIcon(g,tr.crop,fx,fy,0.8);
  }
}
/* ============================================================
   MONEY, AND WHAT IT IS FOR

   Merit is what the ledger counts. Baht is what the landlord
   counts, and they are earned in opposite directions: you get
   merit for giving a thing away and baht for selling it, and you
   cannot do both with the same bowl of food. That is the game.
   ============================================================ */
const PRICE = {
  // what P'Nok will pay you for raw produce
  rice:6, papaya:5, chili:4, lemongrass:4, lime:4, herb:3, coconut:7, banana:4, mango:9,
  galangal:5, basil:4, pandan:3, kaffir:4, morning:3,
  durian:36, mangosteen:17, rambutan:13, longan:12, jackfruit:19,
  egg:6, duckEgg:8, milk:15, manure:3, bran:2,
  flower:4, leaf:3, bamboo:5, clay:4, seed:3,
  // a kitchen is worth more than the sum of its basket
  somtam:34, stickyMango:46, tomyum:42, friedBanana:30, khanomkrok:36,
  padkaphrao:44, greenCurry:54, durianRice:76, sangkhaya:48, ruamMit:56,
  garland:28, krathong:24, basket:30, lantern:34, shrine:40,
};
const sellPrice = id => PRICE[id] || 2;
const canSell   = id => !!ITEMS[id] && !!PRICE[id];
function earn(n){ GS.baht = clamp((GS.baht|0)+n, 0, 99999); saveGame(); }
function pay(n){
  if((GS.baht|0) < n) return false;
  GS.baht -= n; saveGame(); return true;
}
function tooPoor(n){
  toast(L('you need')+' '+(n-(GS.baht|0))+L('฿ more'), '#c8888a'); AU.blip();
}

/* ============================================================
   THE COUNTER — one list screen, used by the stall and by the
   landlord's board, because a second layout is a second thing to
   learn and there is nothing here worth learning twice.
   ============================================================ */
let CNT = null;
function openCounter(o){
  CNT = { title:o.title, sub:o.sub||'', rowsFn:o.rows, note:o.note||'', i:0, at:o.at||P.x, flash:0 };
  GS.state='shop'; clearPress(); AU.sel();
}
function cntRows(){ const r = CNT.rowsFn(); CNT.i = clamp(CNT.i, 0, Math.max(0,r.length-1)); return r; }
function stepShop(dt){
  const C=CNT;
  C.flash = Math.max(0, C.flash-dt);
  if(press('back')||press('tree')){ GS.state='play'; CNT=null; clearPress(); return; }
  hitTap();
  if(GS.state!=='shop') return;
  const rows=cntRows();
  if(press('up')||press('left'))   { C.i=(C.i+rows.length-1)%Math.max(1,rows.length); AU.blip(); }
  if(press('down')||press('right')){ C.i=(C.i+1)%Math.max(1,rows.length); AU.blip(); }
  if(press('act')){
    const r=rows[C.i];
    if(r && r.fn && r.ok!==false){ r.fn(); C.flash=0.25; }
    else { AU.blip(); C.flash=0.3; C.bad=1; }
  }
  clearPress();
}
function drawShop(g){
  const C=CNT; if(!C) return;
  hitClear();
  g.fillStyle='rgba(14,11,26,0.82)'; g.fillRect(0,0,W,H);
  cloud(g,10,8,W-20,22,{seed:210});
  pTxt(g,C.title,20,25,'#8f6a1e',12);
  purseTag(g,W-24,24,'right');
  pTxt(g,'back',W-24,H-8,CL.ink3,6,'right');
  if(C.sub) pTxt(g,C.sub,20,40,'#cfc4ae',6);

  const rows=cntRows();
  const lx=12, lw=W-24, ly=46, rh=26, per=Math.floor((H-ly-26)/rh);
  const from=clamp(C.i-Math.floor(per/2), 0, Math.max(0,rows.length-per));
  cloud(g,lx,ly,lw,Math.min(rows.length,per)*rh+8,{seed:211});
  for(let k=0;k<Math.min(rows.length,per);k++){
    const i=from+k, r=rows[i], y=ly+4+k*rh, sel=i===C.i;
    if(sel){ pR(g,lx+3,y,lw-6,rh-2,'#f2e2b4'); pR(g,lx+3,y,lw-6,1,'#fff8e0');
      pR(g,lx+3,y+rh-3,lw-6,1,'#d8c48c'); pR(g,lx+3,y,2,rh-2,CL.gold); }
    else pR(g,lx+8,y+rh-3,lw-16,1,'rgba(120,100,70,0.16)');
    if(r.icon) drawIcon(g,r.icon,lx+20,y+12,0.62);
    else if(r.badge) r.badge(g,lx+20,y+12);
    pTxt(g,r.n,lx+36,y+11, r.ok===false? CL.ink3 : CL.ink, 8);
    if(r.sub) pTxt(g,r.sub,lx+36,y+21, r.ok===false? '#a8927a' : CL.ink2, 6);
    if(r.cost!==undefined){
      const afford=(GS.baht|0)>=r.cost;
      pTxt(g,r.cost+'฿',lx+lw-14,y+15, r.ok===false? '#a8927a' : afford? '#3f6a2c':'#a8392c', 8,'right');
    } else if(r.gain!==undefined){
      pTxt(g,'+'+r.gain+'฿',lx+lw-14,y+15,'#3f6a2c',8,'right');
    } else if(r.mark){
      icoTick(g,lx+lw-18,y+15,1.2,'#4a7a2c');   // drawn, not a font character
    } else if(r.tag){
      pTxt(g,r.tag,lx+lw-14,y+15,CL.ink2,6,'right');
    }
    hitAdd(lx,y,lw,rh,()=>{ const same=C.i===i; C.i=i; if(same) PRESS.act=true; else AU.blip(); });
  }
  if(!rows.length) pTxt(g,L('nothing here just now'),W/2,ly+30,CL.ink3,7,'center');
  if(C.note){ cloud(g,12,H-26,W-24,20,{seed:212});
    g.globalAlpha=C.flash>0&&C.bad?0.5:1;
    pTxt(g,C.note,W/2,H-12,CL.ink2,6,'center'); g.globalAlpha=1; }
  C.bad=0;
}
/* the purse, drawn wherever it is needed */
function purseTag(g,x,y,align){
  pTxt(g,(GS.baht|0)+'฿',x,y,'#8f6a1e',10,align||'left');
}

/* ============================================================
   P'NOK'S STALL — she buys produce and sells you seed and bran
   ============================================================ */
const STALL_X = 2340;
function sellables(){
  return Object.keys(GS.bag).filter(id=>GS.bag[id]>0 && canSell(id));
}
function openStall(){
  openCounter({
    title:'THE STALL',
    sub:"P'Nok buys anything, and sells what a farm runs out of",
    note:'tap a row to sell one  ·  tap the sacks to buy',
    rows(){
      const out=[];
      out.push({ n:L('a handful of seed'), sub:L('for the beds and the paddies'), icon:'seed', cost:9,
        ok:true, fn(){ if(!pay(9)) return tooPoor(9); bagAdd('seed',3,true); AU.ranat(720,0,0.05); toast('+3 '+L('a handful of seed'),'#c9a86a'); } });
      out.push({ n:L('rice bran'), sub:L('what the animals eat'), icon:'bran', cost:8,
        ok:true, fn(){ if(!pay(8)) return tooPoor(8); bagAdd('bran',4,true); AU.ranat(660,0,0.05); toast('+4 '+L('rice bran'),'#d3b478'); } });
      const s=sellables();
      if(s.length){
        const all=s.reduce((a,id)=>a+sellPrice(id)*GS.bag[id],0);

          } });

        fn(){ if(!bagTake(id,1)) return; earn(sellPrice(id)); AU.ranat(820,0,0.05); toast('+'+sellPrice(id)+'฿','#c9992f');
              GS.q.sold=(GS.q.sold||0)+1; if(GS.q.sold===1) vignette('firstSale'); } });
      return out;
    },
  });
}

/* ============================================================
   THE LANDLORD'S BOARD — everything the farm itself costs

        { n:L('rent the farm'), sub:L('one payment, and the land is yours to work'),

          } },

    });

  }
  openCounter({
    title:'THE FARM',
    sub:'what it still needs',

    rows(){
      const out=[];
      if(FARM.house<0.5) out.push({ n:L('mend the roof'), sub:L('somebody could live here again'),
        badge:(g,x,y)=>icoTick(g,x,y,1.1,'#8f6a1e'), cost:60, ok:true,
        fn(){ if(!pay(60)) return tooPoor(60); FARM.house=1; AU.fix();
          toast(L('the roof is mended'),PAL.jadeL); saveGame(); } });
      if(FARM.beds<BED_XS.length) out.push({ n:L('clear another bed'), sub:(FARM.beds)+'/'+BED_XS.length,
        icon:BED_CROPS[FARM.beds], cost:BED_COST, ok:true,
        fn(){ if(!pay(BED_COST)) return tooPoor(BED_COST); FARM.beds++; AU.ranat(700,0,0.05);
          toast(L('a new bed, turned over'),PAL.jadeL); saveGame(); } });
      if(FARM.paddies<PADDY_XS.length) out.push({ n:L('open up a rice field'), sub:(FARM.paddies)+'/'+PADDY_XS.length+' '+L('rice fields'),
        icon:'rice', cost:PADDY_COST, ok:true,
        fn(){ if(!pay(PADDY_COST)) return tooPoor(PADDY_COST); FARM.paddies++; AU.ranat(620,0,0.05);
          toast(L('the dike is built'),'#8fc4e8'); saveGame(); } });
      if(FARM.trees<TREE_XS.length) out.push({ n:L('dig an orchard hole'), sub:(FARM.trees)+'/'+TREE_XS.length,
        badge:(g,x,y)=>icoFlower(g,x,y,1,'#6fa85c'), cost:20, ok:true,
        fn(){ if(!pay(20)) return tooPoor(20); FARM.trees++; AU.step();
          toast(L('a hole, waiting for a tree'),'#8a6f52'); saveGame(); } });
      // saplings, for any hole that is still empty
      const hole = TREES.find(t=>treeOpen(t) && !t.crop);
      if(hole) for(const k in SAPLINGS){ const s=SAPLINGS[k];
        out.push({ n:L('plant a')+' '+L(ITEMS[k].n), sub:L('bears for ever, once it is grown'), icon:k, cost:s.cost, ok:true,
          fn(){ if(!pay(s.cost)) return tooPoor(s.cost);
            hole.crop=k; hole.grow=0; hole.fruit=0; hole.pop=1;
            AU.ranat(560,0,0.05); toast(L('planted'),PAL.jadeL);
            if(!GS.seen.sapling){ GS.seen.sapling=true;
              khwanSay('It will take a while to come up. Fruit trees are a promise, not a crop.',8); }
            saveGame(); } });
      }
      for(const k in STOCK_COST){
        const have=FARM.pen[k], cap = k==='buffalo'? 1 : 3;
        if(have>=cap) continue;
        out.push({ n:L('buy a')+' '+L(k), sub:have+'/'+cap+' '+L('in the pen'),
          badge:(g,x,y)=>penBadge(g,k,x,y), cost:STOCK_COST[k], ok:true,
          fn(){ if(!pay(STOCK_COST[k])) return tooPoor(STOCK_COST[k]);
            FARM.pen[k]++; FARM.pen.feed=Math.max(FARM.pen.feed,20);
            AU.ranat(760,0,0.05); toast(L('welcome to the pen'),PAL.jadeL);
            if(!GS.seen.stock){ GS.seen.stock=true;
              khwanSay('Keep bran in the trough and they will leave you something every little while.',8); }
            saveGame(); } });
      }
      /* your hands are listed here too, so a ghost standing on a bed is never
         somewhere you cannot reach to give it different orders */
      for(const s of SPIRITS){
        const j=handOf(s.id); if(!j) continue;
        out.push({ n:L(s.name), sub:L(JOBS[j].n), badge:(g,x,y)=>jobBadge(g,j,x,y), tag:L('send back'), ok:true,
          fn(){ dismissHand(s); } });
      }
      if(!out.length) out.push({ n:L('the farm wants for nothing'), sub:L('go and work it'), tag:'·', ok:false });
      return out;
    },
  });
}

  else { pEll(g,x,y,6,4,'#5a5560'); pEll(g,x-5,y-2,3,2.6,'#5a5560');

}

/* ============================================================
   ORDERS — the village asks for cooked food by name, and pays.
   Three at a time, no more, so the screen never fills up.
   ============================================================ */
const ORDERS = [];
const ORDER_MAX = 3;
let orderCool = 10;
const DISH_IDS = ()=> Object.keys(RECIPES);      // people order supper, not baskets
function orderOf(id){ return ORDERS.find(o=>o.who===id) || null; }
function reqWho(){ return ORDERS.length? NPCS.find(n=>n.id===ORDERS[0].who) : null; }
function newOrder(){
  if(ORDERS.length >= ORDER_MAX) return;
  const free = NPCS.filter(n=>!orderOf(n.id));
  if(!free.length) return;
  const n = pick(free);
  /* weight it toward what you already know how to cook, so an order is
     usually something you can start on now */
  const all=DISH_IDS(), known=all.filter(d=>GS.learned[d]!==undefined);
  const dish = (known.length && Math.random()<0.65)? pick(known) : pick(all);
  const cnt = 1 + ((Math.random()*2)|0);
  const bk = RECIPES[dish]||CRAFTS[dish];
  ORDERS.push({ who:n.id, dish, n:cnt, got:0,
                pay: Math.round(sellPrice(dish)*cnt*1.45),
                merit: 3*cnt });
  n.mark={k:'star',t:4}; npcReact(n,'wave',1.6);
  if(Math.abs(n.x-P.x)<200) AU.blip();
  vignette('firstOrder');
  saveGame();
}
function stepOrders(dt){
  if(!GS.q.metPhra) return;
  if(ORDERS.length < ORDER_MAX){
    orderCool -= dt;
    if(orderCool<=0){ orderCool = rnd(18,34); newOrder(); }
  }
  for(const o of ORDERS){
    const n=NPCS.find(v=>v.id===o.who);
    if(n && Math.random()<dt*0.4) n.mark={k:'star',t:1.2};
  }
}
/* handing over a dish settles an order before it counts as a plain gift */
function reqGive(target,id){
  const o = ORDERS.find(x=>x.who===target.id && x.dish===id);
  if(!o) return false;
  o.got++;
  if(o.got>=o.n){
    earn(o.pay); addMerit(o.merit);
    toast('+'+o.pay+'฿  +'+o.merit+' '+L('merit'), PAL.goldL);
    for(let i=0;i<8;i++) pOrb(target.x+rnd(-8,8), target.y-30+rnd(-6,6), i*0.12);
    ORDERS.splice(ORDERS.indexOf(o),1);
    GS.q.orders=(GS.q.orders||0)+1;
    if(!vignette('orderDone', target)) npcReact(target,'wai',2.4);
  } else {
    npcReact(target,'clap',1.2);
    toast(o.got+'/'+o.n, PAL.jadeL);
  }
  saveGame();
  return true;
}
/* what an order sounds like out loud, so nobody has to guess */
function reqAsk(v){
  const o = v && orderOf(v.id);
  if(!o) return null;
  const bk = RECIPES[o.dish]||CRAFTS[o.dish];
  const left = o.n - o.got;
  return L('Could you make me')+' '+left+' '+L(bk.n)+'? '+o.pay+L('฿ for it')+'.';
}
function reqLine(){
  if(!ORDERS.length) return null;
  const o=ORDERS[0], n=NPCS.find(v=>v.id===o.who);
  if(!n) return null;
  const bk = RECIPES[o.dish]||CRAFTS[o.dish];
  const tail = o.got? '  ('+o.got+'/'+o.n+')' : '';
  return L(n.name)+' '+L('wants')+' '+o.n+' '+L(bk.n)+' · '+o.pay+'฿'+tail;
}
const stepRequests = stepOrders;

/* the board outside the stall, so you can see all three at once */
function openOrderBoard(){
  openCounter({
    title:'ORDERS',
    sub:'what the village would like cooked',
    note:'cook it, then hand it to them yourself',
    rows(){
      if(!ORDERS.length) return [{ n:L('nobody is hungry yet'), sub:L('give it a little while'), tag:'·', ok:false }];
      return ORDERS.map(o=>{
        const n=NPCS.find(v=>v.id===o.who), bk=RECIPES[o.dish]||CRAFTS[o.dish];
        const know = GS.learned[o.dish]!==undefined;
        const need = Object.keys(bk.need).map(k=>L(ITEMS[k].n)+' x'+bk.need[k]).join(', ');
        return { n:(n?L(n.name):'?')+' — '+o.n+' x '+L(bk.n), sub:need, icon:o.dish,
                 tag:o.pay+'฿ / '+o.merit+' '+L('merit'), ok:true,
                 fn(){ khwanSay(know? L('You know that one. The kitchen is by the cart.')
                                    : L('You have not cooked that yet. The kitchen lists it anyway.'), 7); } };
      });
    },
  });
}

/* ============================================================
   THE GHOSTS WHO WORK FOR YOU

   A spirit you have fed is a spirit who will help. Take one on
   and it stops haunting its patch of road and comes to the farm
   instead, and does the one job it is shaped for.
   ============================================================ */
const JOBS = {
  water:  {n:'water the beds',    d:'walks the row with a bucket',        at:()=>BED_XS[2],   every:9 },
  pick:   {n:'pick what is ripe', d:'takes the ripe beds off your hands', at:()=>BED_XS[1],   every:11 },
  paddy:  {n:'keep the water up', d:'minds the dikes and the rice',       at:()=>PADDY_XS[0], every:12 },
  orchard:{n:'mind the orchard',  d:'brings the fruit down',              at:()=>TREE_XS[1],  every:13 },
  feed:   {n:'feed the animals',  d:'keeps bran in the trough',           at:()=>PEN_X+22,    every:14 },
};
const JOB_IDS = Object.keys(JOBS);
function handOf(sid){ return FARM.hands[sid]||null; }
function handCount(){ return Object.keys(FARM.hands).length; }
function jobTaken(j){ for(const k in FARM.hands) if(FARM.hands[k]===j) return k; return null; }
function hireHand(s, job){
  if(!FARM.rented){ khwanSay('You have nothing for them to work yet.'); return; }
  const other=jobTaken(job);
  if(other && other!==s.id) delete FARM.hands[other];
  FARM.hands[s.id]=job;
  s.hand={ job, t:rnd(0,4), x:JOBS[job].at()+rnd(-14,14), busy:0 };
  AU.metta(); pSpark(s.x,s.y-30,12,PAL.goldL);
  toast(L(s.name)+' '+L('comes to the farm'), PAL.jadeL);
  if(!GS.seen.hand){ GS.seen.hand=true;
    khwanSay('Dead hands are still hands. They will keep at it whether you are watching or not.',8); }

}
function dismissHand(s){
  delete FARM.hands[s.id]; s.hand=null;
  s.x=s.home!==undefined? s.home : s.x;

}
function openHands(s){
  openCounter({
    title:'A PAIR OF HANDS',
    sub:L(s.name)+' — '+L('what should they do?'),
    note:'one job each, and they keep at it while you are away',
    rows(){
      const out=JOB_IDS.map(j=>{
        const on=handOf(s.id)===j, by=jobTaken(j);
        return { n:L(JOBS[j].n), sub: on? L('doing this now') : by? L('taken by')+' '+L((SPIRIT_BY_ID[by]||{}).name||'') : L(JOBS[j].d),
                 badge:(g,x,y)=>jobBadge(g,j,x,y), mark: on, ok:true,
                 fn(){ if(on) return; hireHand(s,j); GS.state='play'; CNT=null; } };
      });
      if(handOf(s.id)) out.push({ n:L('nothing, thank you'), sub:L('they go back to their patch of road'),

  else if(j==='paddy'){ pR(g,x-5,y+1,11,3,PAL.water); pR(g,x-5,y+1,11,1,PAL.waterL);
    for(let i=0;i<4;i++) pTaper(g,x-4+i*3,y+1,x-4+i*3,y-4,1.4,0.8,'#4f9256'); }

  else { pEll(g,x,y+2,5,3,'#c9a86a'); pEll(g,x-2,y-2,2.2,2,'#f2ece0'); pR(g,x-4,y-3,2,1,'#c0392f'); }

/* the work itself: it happens whether or not you are on screen */
function stepHands(dt){
  if(!FARM.rented) return;
  for(const s of SPIRITS){
    const job = handOf(s.id);
    if(!job){ if(s.hand) s.hand=null; continue; }
    if(!s.hand) s.hand={ job, t:rnd(0,4), x:JOBS[job].at()+rnd(-14,14), busy:0 };
    const h=s.hand;
    h.job=job;
    // they drift to their station and stay near it
    const want = JOBS[job].at();
    h.x = lerp(h.x, want + Math.sin(GS.t*0.5+s.anim)*16, 1-Math.pow(0.2,dt));
    s.x = h.x; s.y = groundY(s.x);
    if(h.busy>0){ h.busy-=dt; continue; }
    h.t += dt;
    if(h.t < JOBS[job].every) continue;
    h.t = 0;
    if(doJob(job,s)) { h.busy=0.7; }
  }
}
function doJob(job,s){
  const px=s.x, py=groundY(s.x);
  const spark=(c)=>{ for(let k=0;k<6;k++) pSpark(px+rnd(-8,8),py-24,1,c); };
  if(job==='water'){
    const pl = PLOTS.find(p=>bedOpen(p) && p.stage>0 && p.stage<3 && p.wet<=0);
    if(!pl) return false;
    pl.wet=9; pl.pop=0.5;
    for(let k=0;k<8;k++) part({k:'water',x:pl.x+rnd(-6,6),y:groundY(pl.x)-18,vx:rnd(-6,6),vy:rnd(20,44),life:.5});
    return true;
  }
  if(job==='pick'){
    const pl = PLOTS.find(p=>bedOpen(p) && p.stage===3);
    if(!pl) return false;
    bagAdd(pl.crop,2,true); bagAdd('seed',1,true);
    pl.stage=0; pl.t=0; pl.wet=0; pl.pop=1;
    for(let k=0;k<7;k++) part({k:'pop',x:pl.x,y:groundY(pl.x)-16,vx:rnd(-22,22),vy:rnd(-42,-12),life:.6,c:ITEMS[pl.crop].c});
    spark(PAL.jadeL); saveGame(); return true;
  }
  if(job==='paddy'){
    const pd = PADDIES.find(p=>padOpen(p) && p.stage>0 && p.stage<3 && p.flood<=6);
    if(pd){ pd.flood=40; pd.pop=0.5;
      for(let k=0;k<10;k++) part({k:'water',x:pd.x+rnd(-22,22),y:groundY(pd.x)-14,vx:0,vy:rnd(16,36),life:.5});
      return true; }
    const ripe = PADDIES.find(p=>padOpen(p) && p.stage===3);
    if(ripe){ bagAdd('rice',3,true); bagAdd('bran',1,true); bagAdd('seed',1,true);
      ripe.stage=0; ripe.t=0; ripe.flood=0; ripe.pop=1;
      spark('#e8d06a'); saveGame(); return true; }
    return false;
  }
  if(job==='orchard'){
    const tr = TREES.find(t=>treeOpen(t) && t.crop && t.grow>=1 && t.fruit>0);
    if(!tr) return false;
    bagAdd(tr.crop,tr.fruit,true); tr.fruit=0; tr.pop=1;
    spark(ITEMS[tr.crop].c); saveGame(); return true;
  }
  if(job==='feed'){
    if(!penHas()) return false;
    if(FARM.pen.feed>12) return false;
    if(!bagTake('bran',1)) return false;
    FARM.pen.feed=Math.min(60,FARM.pen.feed+30);
    spark('#d3b478'); saveGame(); return true;
  }
  return false;
}
/* a small badge over a working ghost, so you can see the farm running */
function drawHandTag(g,s){
  const job=handOf(s.id); if(!job) return;
  const y = s.y - (s.id==='krasue'? 74 : 58) - 8 + Math.sin(GS.t*2+s.anim)*1.5;
  cloud(g,s.x-11,y-10,22,15,{seed:301,drop:1});
  jobBadge(g,job,s.x,y-2);
}
/* ============================================================
   LITTLE SCENES

   Not a state machine and not a menu: three or four seconds
   played over the world exactly where it stands. The bars come
   down, the camera leans onto whoever it is about, one or two
   lines are said, and it lets go again. Tap skips a line; tap
   twice and it is over. Nothing is ever locked behind one.
   ============================================================ */
var VIG = null;

const VIGS = {

function vignette(id, who){
  const d = VIGS[id];
  if(!d || VIG || DLG || GS.state!=='play') return false;
  if(d.once && GS.seen['vig_'+id]) return false;
  GS.seen['vig_'+id] = true;
  VIG = { id, d, t:0, line:0, ch:0, who:who||null, x:0, out:0 };
  VIG.x = d.at ? d.at() : P.x;
  navStop(); clearPress(); PROMPT=null;
  if(d.start) d.start(VIG);
  AU.blip();
  saveGame();
  return true;
}

function stepVig(dt){
  if(!VIG) return;
  const d = VIG.d;
  VIG.t += dt;
  if(VIG.out>0){ VIG.out -= dt; if(VIG.out<=0) VIG=null; return; }

  // the camera leans onto the subject and stays there
  const tx = clamp(VIG.x - W/2, 0, WORLD_W-W);
  GS.camX = lerp(GS.camX, tx, 1-Math.pow(0.004,dt));

  const raw = L(String(d.lines[VIG.line]));
  VIG.ch += dt*44;
  const done = VIG.ch >= raw.length;
  const advance = ()=>{
    VIG.line++; VIG.ch=0;
    if(VIG.line >= d.lines.length){ VIG.out=0.4; VIG.line=d.lines.length-1; }
  };
  if(press('act')||press('tap')){
    AU.blip();
    if(!done) VIG.ch = raw.length; else advance();
  }
  else if(done && VIG.ch >= raw.length + (d.hold||0.8)*44) advance();
  if(d.step && VIG) d.step(VIG, dt);
}

function drawVig(g){
  if(!VIG) return;
  const d = VIG.d;
  const inT  = clamp(VIG.t/0.4, 0, 1);
  const outT = VIG.out>0 ? clamp(VIG.out/0.4, 0, 1) : 1;
  const k    = Math.min(inT, outT);
  const bar  = Math.round(24*(k*k*(3-2*k)));          // smoothstep, so it slides
  if(bar<=0) return;

  // a pool of light on whoever this is about, and the rest steps back
  const sx = VIG.x - GS.camX;
  const gr = g.createRadialGradient(sx, H*0.60, 12, sx, H*0.60, 132);
  gr.addColorStop(0,'rgba(255,238,196,0.09)');
  gr.addColorStop(1,'rgba(9,7,17,'+(0.40*k).toFixed(3)+')');
  g.fillStyle=gr; g.fillRect(0,0,W,H);

  pR(g,0,0,W,bar,'#0c0a13');
  pR(g,0,H-bar,W,bar,'#0c0a13');
  pR(g,0,bar-1,W,1,'rgba(255,214,140,0.16)');
  pR(g,0,H-bar,W,1,'rgba(255,214,140,0.16)');

  if(bar < 20) return;
  const full = L(String(d.lines[VIG.line]));
  const shown = full.slice(0, Math.max(0, VIG.ch|0));
  if(shown.length){
    const lines = wrap(g, shown, W-60, 7);
    const y0 = H - bar - 6 - (lines.length-1)*10;
    for(let i=0;i<lines.length;i++)
      pTxt(g, lines[i], W/2, y0+i*10, '#f2e6c8', 7, 'center');
  }
  if(VIG.ch >= full.length && VIG.out<=0){
    g.globalAlpha = 0.45+0.45*Math.sin(GS.t*6);
    icoDown(g, W-22, H-bar-8, 1.2, PAL.gold);
    g.globalAlpha = 1;
  }
}

/* ============================================================
   ACTIVITIES — cooking and crafting. Same engine, different smell.
   ============================================================ */
let ACT = null;
const STEP_KIND = {
  pound:{t:'timing',n:5,v:'pound',h:'pound it'},        fry:{t:'timing',n:3,v:'fry',h:'flip when golden'},
  pin:{t:'timing',n:3,v:'pin',h:'pin the folds'},       split:{t:'timing',n:4,v:'split',h:'split the bamboo'},
  light:{t:'timing',n:2,v:'light',h:'catch the wick'},
  mix:{t:'rhythm',n:6,v:'toss',h:'toss it, left and right'},
  tie:{t:'rhythm',n:5,v:'tie',h:'tie it off'},          weave:{t:'rhythm',n:8,v:'weave',h:'over, under, over, under'},
  steam:{t:'hold',dur:4,v:'steam',h:'hold the steam steady'},
  boil:{t:'hold',dur:4,v:'boil',h:'keep it just below a boil'},
  pour:{t:'hold',dur:3.5,v:'spoon',h:'fill each mould to the line'},
  bless:{t:'hold',dur:3,v:'anoint',h:'hold still and mean it'},
  plate:{t:'place',n:3,v:'plate',h:'plate it nicely'},
  thread:{t:'place',n:4,v:'thread',h:'thread the jasmine'},
  fold:{t:'place',n:3,v:'fold',h:'fold the leaf'},
  frame:{t:'place',n:3,v:'frame',h:'set the frame'},
  build:{t:'place',n:4,v:'assemble',h:'build it square'},
};
function canMake(r){ for(const k in r.need) if(!bagHas(k,r.need[k])) return false; return true; }
function startActivity(mode){
  const book = mode==='cook'? RECIPES : CRAFTS;
  ACT = {mode, phase:'pick', pick:0, ids:Object.keys(book), book, t:0,
         step:0, score:0, hits:0, m:0, dir:1, need:0, held:0, gauge:0.5, band:0.5, bandV:0.4,
         slot:0, placed:0, cursor:0, cdir:1, flash:0, doneT:0, quality:0, out:null};
  GS.state='act'; AU.sel();
}
function actRecipe(){ return ACT.book[ACT.ids[ACT.pick]]; }
function beginSteps(){
  const r=actRecipe();
  for(const k in r.need) bagTake(k, r.need[k]);
  ACT.phase='do'; ACT.step=0; ACT.score=0; ACT.t=0;
  setupStep();
}
function setupStep(){
  const r=actRecipe(), k=STEP_KIND[r.steps[ACT.step]];
  ACT.k=k; ACT.hits=0; ACT.m=0; ACT.dir=1; ACT.held=0; ACT.placed=0; ACT.cursor=0; ACT.cdir=1;
  ACT.gauge=0.5; ACT.band=0.5; ACT.bandV=0.35;
  ACT.stepScore=0; ACT.stepT=0;
  ACT.need = k.n||1;
  AU.blip();
}
function stepAct(dt){
  const A=ACT; A.t+=dt;
  if(A.flash>0) A.flash-=dt;
  if(press('back')){
    if(A.phase==='pick'){ GS.state='play'; ACT=null; clearPress(); return; }
    A.phase='pick'; clearPress(); return;
  }
  if(A.phase==='pick'){
    hitTap();                   // a tap lands on whichever recipe was drawn there
    if(press('left')||press('up')){ A.pick=(A.pick+A.ids.length-1)%A.ids.length; AU.blip(); }
    if(press('right')||press('down')){ A.pick=(A.pick+1)%A.ids.length; AU.blip(); }
    if(press('act')){
      const r=actRecipe();
      if(canMake(r)) beginSteps();
      else { toast('you are missing something','#c8888a'); AU.blip(); A.flash=0.4; }
    }
    clearPress(); return;
  }
  if(A.phase==='done'){
    A.doneT+=dt;
    if(A.doneT>0.8 && (press('act')||press('tap'))) finishActivity();
    clearPress(); return;
  }

  const k=A.k, easy = (A.mode==='cook'? (has('taste')?1.5:1) : (has('weave')?1.5:1));
  A.stepT+=dt;
  if(k.t==='timing'){
    // a marker sweeps; land it in the green
    A.m += A.dir*dt*(1.05 - A.hits*0.03);
    if(A.m>1){ A.m=1; A.dir=-1; } if(A.m<0){ A.m=0; A.dir=1; }
    if(press('act')||press('tap')){
      const zone=0.13*easy, d=Math.abs(A.m-0.5);
      if(d<zone*0.45){ A.hits++; A.stepScore+=1; AU.ranat(760+A.hits*70,0,0.05); pSpark(0,0,0); A.flash=0.25; A.perfect=1; }
      else if(d<zone){ A.hits++; A.stepScore+=0.6; AU.ranat(600,0,0.04); A.flash=0.2; A.perfect=0; }
      else { AU.whiff(); A.flash=0.3; A.perfect=-1; }
      if(A.hits>=A.need) nextStep();
    }
  }
  else if(k.t==='rhythm'){
    // alternate left and right, in time with the beat
    A.m += dt*1.5;
    if(A.m>1){ A.m=0; A.beat=(A.beat||0)+1; AU.drum(0,0.03); }
    const wantLeft = ((A.hits)%2)===0;
    const hitL=press('left'), hitR=press('right');
    if(hitL||hitR){
      const right = wantLeft? hitL : hitR;
      const good = Math.abs(A.m-0.5)<0.42*easy;
      if(right && good){ A.hits++; A.stepScore+= (Math.abs(A.m-0.5)<0.2?1:0.6); AU.ranat(560+A.hits*40,0,0.045); A.flash=0.2; A.perfect=1; }
      else { AU.whiff(); A.flash=0.3; A.perfect=-1; }
      if(A.hits>=A.need) nextStep();
    }
  }
  else if(k.t==='hold'){
    // keep the needle inside the drifting band
    A.band += A.bandV*dt;
    if(A.band>0.8){ A.band=0.8; A.bandV=-Math.abs(A.bandV); }
    if(A.band<0.2){ A.band=0.2; A.bandV=Math.abs(A.bandV); }
    if(Math.random()<dt*0.7) A.bandV = rnd(-0.4,0.4);
    const grip = K.act||K.light;
    A.gauge += (grip? 0.62 : -0.52)*dt;
    A.gauge = clamp(A.gauge,0,1);
    const w=0.13*easy;
    const inside = Math.abs(A.gauge-A.band)<w;
    if(inside){ A.held+=dt; A.stepScore+=dt; if(Math.random()<dt*8) pEmber(0,0); }
    if(A.held>=k.dur) nextStep();
  }
  else if(k.t==='place'){
    // a cursor slides; drop each piece on its mark
    A.cursor += A.cdir*dt*0.85;
    if(A.cursor>1){ A.cursor=1; A.cdir=-1; } if(A.cursor<0){ A.cursor=0; A.cdir=1; }
    const target = (A.placed+0.5)/A.need;
    if(press('act')||press('tap')){
      const d=Math.abs(A.cursor-target);
      if(d<0.10*easy){ A.stepScore+=1; AU.ranat(700+A.placed*90,0,0.05); A.flash=0.22; A.perfect=1; }
      else if(d<0.2*easy){ A.stepScore+=0.55; AU.ranat(560,0,0.04); A.flash=0.2; A.perfect=0; }
      else { AU.whiff(); A.flash=0.3; A.perfect=-1; }
      A.placed++;
      if(A.placed>=A.need) nextStep();
    }
  }
  clearPress();
}
function nextStep(){
  const A=ACT, k=A.k;
  const maxS = k.t==='hold'? k.dur : A.need;
  A.score += clamp(A.stepScore/maxS,0,1);
  A.step++;
  const r=actRecipe();
  if(A.step>=r.steps.length){
    A.quality = clamp(A.score/r.steps.length,0,1);
    A.phase='done'; A.doneT=0;
    const n = has('two')? 2 : 1;
    A.out = r.out;
    bagAdd(r.out, n, true);
    const first = !GS.learned[A.ids[A.pick]];
    GS.learned[A.ids[A.pick]] = Math.max(GS.learned[A.ids[A.pick]]||0, A.quality);
    A.first = first;
    if(first) addMerit(3);
    AU.victory();
    saveGame();
  } else setupStep();
}
function finishActivity(){
  const A=ACT; const r=A.book[A.ids[A.pick]];
  ACT=null; GS.state='play';
  const q=A.quality;
  const word = q>0.85? 'perfect' : q>0.55? 'good' : 'edible';
  toast((A.first?'+3 merit · learned ':'made ')+r.n+' — '+word, q>0.85?PAL.goldL:PAL.gold);
  if(A.first) khwanSay('You made something. Somebody is going to be very glad about that.');
}

   ============================================================ */
function gather(nd){
  const n = bagAdd(nd.item, nd.n);
  if(n<=0) return;
  nd.ready=false; nd.t=rnd(26,46);
  AU.ranat(680,0,0.05); pPop(nd.x, nd.y-14, ITEMS[nd.item].c);
  for(let i=0;i<n;i++) part({k:'pop',x:nd.x,y:nd.y-16,vx:rnd(-24,24),vy:rnd(-50,-20),life:.7,c:ITEMS[nd.item].c});
  toast('+'+n+' '+ITEMS[nd.item].n, PAL.jadeL);
  if(!GS.seen.firstPick){ GS.seen.firstPick=true;
    khwanSay('Good. Things regrow here — take what you need and come back later.'); }
}
let GIVE=null;
function openGive(target){
  const list=Object.keys(GS.bag).filter(id=>ITEMS[id] && (ITEMS[id].k==='dish'||ITEMS[id].k==='craft') && GS.bag[id]>0);
  if(!list.length){ khwanSay('Your basket has nothing made in it yet. Cook something, or weave something.'); return; }
  GIVE={target, list, i:0};
  GS.state='give'; AU.sel();
}
function stepGive(dt){
  const G3=GIVE;
  if(press('back')){ GS.state='play'; GIVE=null; clearPress(); return; }
  if(press('left')||press('up')) { G3.i=(G3.i+G3.list.length-1)%G3.list.length; AU.blip(); }
  if(press('right')||press('down')){ G3.i=(G3.i+1)%G3.list.length; AU.blip(); }
  if(press('act')){
    const id=G3.list[G3.i], t=G3.target;
    bagTake(id,1);
    GS.state='play'; GIVE=null;
    doGive(t,id);
  }
  clearPress();
}
function doGive(t,id){
  // a standing request is what they actually asked for, so it settles first
  if(reqGive(t,id)){ pHeart(t.x,t.y-30); pSpark(t.x,t.y-26,10,PAL.goldL); AU.metta();
    GS.q.gifts=(GS.q.gifts||0)+1; preteAct('give',0.9); saveGame(); return; }
  const want = t.wants===id;
  const isSpirit = !!t.art;
  const name = isSpirit? t.name : t.name;
  GS.q.gifts=(GS.q.gifts||0)+1;
  P.face = t.x < P.x ? -1 : 1;
  preteAct('give', 0.9);
  npcReact(t,'wai',1.8);
  pHeart(t.x, t.y-30); pSpark(t.x,t.y-26,10,PAL.goldL);
  if(want){
    const already = GS.friends[t.id];
    GS.friends[t.id]=(GS.friends[t.id]||0)+1;
    if(isSpirit) t.friend=true;
    const merit = already? 4 : 8;
    AU.metta();
    const lines = isSpirit
      ? [{w:name,t:t.thanks[0]},{w:name,t:t.thanks[1]}]
      : [{w:name,t:'Oh — for me? ' + (id==='garland'?'It smells like the inside of a temple.': 'This is exactly what I wanted and I never said so out loud.')}];
    if(!already && isSpirit && t.gift) lines.push({w:'',t:'They press something into your enormous hand: '+ITEMS[t.gift].n+'.'});
    say(lines, ()=>{
      addMerit(merit);
      toast('+'+merit+' '+L('merit'), PAL.goldL);
      if(!already && isSpirit && t.gift) bagAdd(t.gift,3,true);
      if(!already && isSpirit && !vignette('firstFriend'))
        khwanSay('Look at that. A friend. Worth more than the merit, whatever the ledger says.');
      for(let i=0;i<6;i++) pOrb(t.x+rnd(-8,8), t.y-30+rnd(-6,6), i*0.15);
      saveGame();
    });
  } else {
    GS.friends[t.id]=(GS.friends[t.id]||0)+0;
    addMerit(2);
    AU.ding();
    say([{w:name,t: isSpirit
      ? 'Oh! That is very kind. I cannot really… but I will keep it. Thank you, honestly.'
      : 'Ah, thank you! I will find someone to share it with.'}],
      ()=>{ toast('+2 '+L('merit')); saveGame(); });
  }
}

const STARS=[]; for(let i=0;i<170;i++) STARS.push([Math.random(),Math.random()*0.66,rnd(TAU),Math.random()]);
const CLOUDS=[]; for(let i=0;i<11;i++) CLOUDS.push({x:Math.random()*1.4,y:rnd(0.05,0.44),w:rnd(50,140),h:rnd(6,17),sp:rnd(0.4,1.1),o:rnd(0.05,0.15)});
function drawSky(g){
  const d=GS.dawn;
  const c0=mix('#0a0c24','#2e2050',d), c1=mix('#141a3e','#7e4258',d),
        c2=mix('#222a58','#e08a52',d), c3=mix('#33406e','#f6c184',d);
  pVGrad(g,0,0,W,76,c0,c1,8);
  pVGrad(g,0,76,W,66,c1,c2,8);
  pVGrad(g,0,142,W,H-142,c2,c3,7);
  const sa=1-d;
  for(const s of STARS){
    const tw=0.45+0.55*Math.sin(GS.t*1.4+s[2]);
    const x=(s[0]*W - GS.camX*0.03 + W*4)%W;
    g.fillStyle=`rgba(255,246,224,${0.75*tw*sa*(0.35+s[3]*0.65)})`;
    g.fillRect(R(x),R(s[1]*H),1,1);
    if(s[3]>0.93 && tw>0.8){ g.fillRect(R(x-1),R(s[1]*H),1,1); g.fillRect(R(x+1),R(s[1]*H),1,1); }
  }
  const mx=(W*0.76 - GS.camX*0.02), my=32, ma=1-d*0.5;
  g.globalAlpha=ma;
  for(let i=3;i>0;i--){
    const gl=g.createRadialGradient(mx,my,10,mx,my,20+i*18);
    gl.addColorStop(0,`rgba(246,240,220,${0.08*i})`); gl.addColorStop(1,'rgba(246,240,220,0)');
    g.fillStyle=gl; g.fillRect(mx-70,my-70,140,140);
  }
  pCirc(g,mx,my,16,mix(PAL.moon,'#ffd9a8',d));
  pCirc(g,mx-5,my-5,4,PAL.moonD); pCirc(g,mx+6,my+5,3,PAL.moonD); pCirc(g,mx+3,my-8,2,PAL.moonD);
  pCirc(g,mx-8,my+6,2,PAL.moonD);
  g.globalAlpha=1;
  for(const c of CLOUDS){
    const x=((c.x*W*1.5 + GS.t*c.sp*3 - GS.camX*0.05)%(W*1.6))-W*0.3;
    g.globalAlpha=c.o*(1+d*1.2);
    pEll(g,x,c.y*H,c.w/2,c.h/2, mix('#3f4a80','#ffb98a',d));
    pEll(g,x+c.w*0.24,c.y*H-c.h*0.22,c.w/3,c.h/2.3, mix('#4a568e','#ffd0a4',d));
    pEll(g,x-c.w*0.2,c.y*H+c.h*0.1,c.w/4,c.h/2.8, mix('#374172','#f0b088',d));
    g.globalAlpha=1;
  }
}

const lightCv=mkCv(W,H), lightG=G2(lightCv);
/* one soft black disc per radius, cut out of the night with destination-out */
const _punchSpr=new Map();
function punchSprite(r){
  let c=_punchSpr.get(r);
  if(!c){
    if(_punchSpr.size>48) _punchSpr.clear();
    const d=r*2;
    c=mkCv(d,d);
    const g2=c.getContext('2d');
    const gr=g2.createRadialGradient(r,r,1,r,r,r);
    gr.addColorStop(0,'rgba(0,0,0,1)'); gr.addColorStop(0.5,'rgba(0,0,0,0.62)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    g2.fillStyle=gr; g2.fillRect(0,0,d,d);
    _punchSpr.set(r,c);
  }
  return c;
}
function drawLighting(g,cx,cy){
  const night=1-GS.dawn;
  lightG.globalCompositeOperation='source-over';
  lightG.clearRect(0,0,W,H);
  lightG.fillStyle=`rgba(12,14,44,${0.08+0.46*night})`;
  lightG.fillRect(0,0,W,H);
  lightG.globalCompositeOperation='destination-out';
  const punch=(x,y,r,a)=>{
    const sx=x-cx, sy=y-cy;
    if(sx<-r||sx>W+r||sy<-r||sy>H+r) return;
    /* the hole is always the same shape, so cut it from a baked stencil rather
       than building a fresh gradient twenty-odd times a frame */
    const q=Math.max(2,Math.round(r/2)*2);
    lightG.globalAlpha=clamp(a,0,1);
    lightG.drawImage(punchSprite(q), R(sx-q), R(sy-q));
    lightG.globalAlpha=1;
  };
  for(const l of LIGHTS){ if(!l.on) continue;
    const fl=l.flick?1-Math.random()*l.flick:1; punch(l.x,l.y,l.r*fl,l.a); }
  const broken=LIGHTS.find(l=>l.broken);
  if(broken && !broken.on && Math.random()<0.05) punch(broken.x,broken.y,26,0.35);
  punch(P.x,P.y-42, GS.cos.halo?58:44, 0.42);
  punch(KHWAN.x,KHWAN.y,26,0.5);
  for(const p of PT) if(p.k==='orb'&&p.t>=0) punch(p.x,p.y,10,0.55);
  for(const s of SPIRITS) punch(s.x, s.y-24, s.id==='krasue'?34:26, 0.34);
  punch(TANI.x,TANI.y-18,34,0.4);
  punch(KITCHEN_X-10, groundY(KITCHEN_X)-38, 40, 0.5);
  g.drawImage(lightCv,0,0);
}
function drawGlows(g){
  g.globalCompositeOperation='lighter';
  const night=1-GS.dawn;
  for(const l of LIGHTS){
    if(!l.on) continue;
    if(l.x-GS.camX<-90||l.x-GS.camX>W+90) continue;
    const fl=l.flick?1-Math.random()*l.flick:1;
    drawGlow(g,l.x,l.y,l.r*0.85*fl,l.c,0.15*night+0.03);
  }
  for(const f of FIREFLIES){
    if(f.x-GS.camX<-20||f.x-GS.camX>W+20) continue;
    const bl=0.5+0.5*Math.sin(f.t*2.2);
    if(bl<0.3) continue;
    g.fillStyle=`rgba(190,255,150,${0.65*bl*night})`; g.fillRect(R(f.x),R(f.y),1,1);
    drawGlow(g,f.x,f.y,7,'#96ff78',0.24*bl*night);
  }
  g.globalCompositeOperation='source-over';
}

/* strings of lanterns over the village road */
const LSTRING=[];
for(let i=0;i<LAMP_XS.length-1;i++){
  const a=LAMP_XS[i], b=LAMP_XS[i+1];
  const n=Math.max(2,Math.round((b-a)/34));
  for(let k=1;k<n;k++) LSTRING.push({a,b,t:k/n, c: ['#e8564a','#ffc44d','#5fbf7a','#5aa8e0','#e88fc0'][(i*3+k)%5]});
}
function drawLanternString(g){
  g.strokeStyle='rgba(20,16,30,0.75)'; g.lineWidth=1;
  for(let i=0;i<LAMP_XS.length-1;i++){
    const a=LAMP_XS[i], b=LAMP_XS[i+1];
    if(b-GS.camX<-40||a-GS.camX>W+40) continue;
    const y0=groundY(a)-118, y1=groundY(b)-118;
    g.beginPath(); g.moveTo(a+9,y0);
    g.quadraticCurveTo((a+b)/2, (y0+y1)/2+16, b+9, y1);
    g.stroke();
  }
  for(const L of LSTRING){
    const x=lerp(L.a+9,L.b+9,L.t);
    if(x-GS.camX<-16||x-GS.camX>W+16) continue;
    const y0=groundY(L.a)-118, y1=groundY(L.b)-118;
    const u=L.t, y=(1-u)*(1-u)*y0 + 2*(1-u)*u*((y0+y1)/2+16) + u*u*y1;
    const sw=Math.sin(GS.t*1.1 + L.t*7)*1.4;
    const c=L.c;
    pR(g,x+sw,y,1,3,'#3a3630');
    pEll(g,x+sw,y+7,4,5,c);
    pEll(g,x+sw,y+6,2.4,3,shade(c,0.35));
    pR(g,x+sw-2,y+3,5,1,shade(c,-0.35)); pR(g,x+sw-2,y+11,5,1,shade(c,-0.35));
    drawGlow(g,x+sw,y+7,14,c,0.18*(1-GS.dawn));
  }
}

function render(){
  ctx.setTransform(SC,0,0,SC,0,0);
  ctx.imageSmoothingEnabled=false;
  if(GS.state==='title'){ drawTitle(); return; }
  if(GS.state==='memory'){ drawMem(); return; }
  if(GS.state==='ascend'){ drawAscend(ctx); return; }

  const sh=GS.shake>0?GS.shake:0;
  const ox=sh?rnd(-sh,sh):0, oy=sh?rnd(-sh,sh):0;
  const cx=R(GS.camX+ox), cy=R(GS.camY+oy);

  drawSky(ctx);
  ctx.drawImage(farCv, -R(cx*PX.far), R(-cy*0.1));
  ctx.drawImage(midCv, -R(cx*PX.mid), R(-cy*0.25));
  ctx.drawImage(bgCv,  -R(cx*PX.bg),  R(-cy*0.55));

  ctx.save(); ctx.translate(-cx,-cy);
  ctx.drawImage(playCv, cx, 0, W, H, cx, 0, W, H);
  drawMist(ctx);
  drawLanternString(ctx);

  // pond shimmer
  for(let i=0;i<10;i++){
    const x=POND_X-60+i*13+Math.sin(GS.t*0.8+i)*3, y=groundY(x)+5+Math.sin(GS.t*1.4+i*2)*1;
    if(x-cx<-8||x-cx>W+8) continue;
    pR(ctx,x,y,4,1,`rgba(190,225,255,${0.10+0.07*Math.sin(GS.t*2+i)})`);
  }

  drawSigns(ctx);
  drawFarm(ctx);
  if(GS.state==='play') drawNavMark(ctx);
  // gatherable plants
  for(const nd of NODES){
    if(nd.x-cx<-30||nd.x-cx>W+30) continue;
    drawNode(ctx,nd);
  }
  // the offering, the shrine spirit
  if(PHRA.shown) drawPhraPhum(ctx,PHRA.x,PHRA.y,PHRA.anim);
  if(GS.q.garland){
    const hx=SHRINE_X-16, hy=groundY(SHRINE_X)-86;
    for(let i=0;i<7;i++) pEll(ctx,hx+Math.sin(i*0.9)*2, hy+4+i*2.2, 2,2, i%3===0?'#ffce54':'#f6f0dc');
    pEll(ctx,hx,hy+20,2,3,PAL.jadeL);
  }
  if(GS.q.shrineBuilt){ const sx=SPIRIT_BY_ID.taihong.x-24;
    ctx.drawImage(ART.roadShrine, R(sx-19), R(groundY(sx)-52)); }
  if(offering){ pR(ctx,offering.x-4,offering.y-4,9,4,'#f5ead8'); pR(ctx,offering.x-3,offering.y-6,7,2,'#d8b04a'); }

  for(const n of NPCS){
    if(n.x-cx<-40||n.x-cx>W+40) continue;
    drawVillager(ctx,n,{dt:1/60,wind:GS.wind});
    if(n.mark){ const my=n.y-30-Math.sin(GS.t*5)*2;
      if(n.mark.k==='call') icoCall(ctx,n.x,my,0.8,PAL.gold); else icoStar(ctx,n.x,my,1,PAL.gold); }
    if(n.bub) bubble(ctx,n.x,n.y-32,n.bub.txt);
    wishBubble(ctx,n,n.y-34);
  }
  if(CAT.state!=='tree'){ drawCat(ctx,{x:CAT.x,y:CAT.y,face:CAT.face,anim:CAT.anim,phase:CAT.phase,state:CAT.walking?'walk':'sit'}); }
  else drawCat(ctx,{x:CAT.x,y:CAT.y,face:-1,anim:CAT.anim,state:'tree'});
  drawTani(ctx,TANI,{wave:TANI.waveT>0});

  for(const s of SPIRITS){
    if(s.x-cx<-70||s.x-cx>W+70) continue;
    const y = s.id==='krasue'? s.y-52+Math.sin(s.anim*1.5)*6
            : s.id==='krahang'? s.y-38+Math.sin(s.anim*2)*5 : s.y;
    GHOST_ART[s.art](ctx,{x:s.x,y:y,face:s.face,anim:s.anim,hurtT:0,attackT:0,hop:s.hop,h:s.id==='taihong'?46:44,friendly:1});
    if(s.wave>0) icoCall(ctx,s.x+10*s.face,y-32,0.9,PAL.goldL);
    drawHandTag(ctx,s);
    if(s.friend) icoHeart(ctx,s.x-11,y-33,1,'#ff8fae');
    if(s.bub) bubble(ctx,s.x,y-36,s.bub.txt);
    wishBubble(ctx,s,y-38);
  }

  pEll(ctx,P.x,P.y+1,9,2.6,'rgba(10,8,24,0.4)');
  drawPrete(ctx,P,{dt:1/60, wind:GS.wind, mouth:P.state==='wail'?1:0,
    armTarget: HT? {x:HT.hx,y:HT.hy} : null, gold: GS.cos.halo?1:0, rise:P.rise||0});
  if(HT) drawTaskWorld(ctx);
  drawKhwan(ctx);
  drawParts(ctx);
  ctx.restore();

  drawLighting(ctx,cx,cy);
  ctx.save(); ctx.translate(-cx,-cy);
  drawGlows(ctx);
  drawMotes(ctx);
  for(const f of FORE){
    const fx=f.x - cx*1.32 + cx*0.32;
    if(fx-cx<-14||fx-cx>W+14) continue;
    const sw=Math.sin(GS.t*1.3+f.ph)*2.2;
    pTaper(ctx,fx,f.y+8,fx+sw,f.y+8-f.h,3,1,f.c);
  }
  ctx.restore();

  if(GS.dawn>0){ ctx.fillStyle=`rgba(255,166,110,${0.13*GS.dawn})`; ctx.fillRect(0,0,W,H); }
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.44,W/2,H/2,H*1.0);
  vg.addColorStop(0,'rgba(8,6,20,0)'); vg.addColorStop(1,'rgba(8,6,20,0.4)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  if(GS.state==='play' && !VIG){ drawKhwanBubble(ctx); drawHUD(); }
  else if(GS.state==='task') drawTaskHUD(ctx);
  drawVig(ctx);
  drawDialog(ctx);
  if(GS.state==='tree') drawLedger(ctx);
  if(GS.state==='act')  drawAct(ctx);
  if(GS.state==='give') drawGive(ctx);
  if(GS.state==='shop') drawShop(ctx);
  if(GS.state==='ceremony') drawCeremonyUI(ctx);
  if(GS.state==='end') drawEnd(ctx);
  if(TOUCH.on && uiShowsPads()) drawPads(ctx);
}

/* Inner Eye — with Inner Eye you can see what people quietly want */
function wishBubble(g,t,y){

}
function drawEnd(g){
  GS.t2=(GS.t2||0)+1/60;
  const a=clamp(GS.t2/1.4,0,1);
  g.fillStyle=`rgba(22,16,20,${0.9*a})`; g.fillRect(0,0,W,H);
  if(a<0.5) return;
  pTxt(g,'PRETE NO MORE',W/2,44,PAL.gold,20,'center');
  pTxt(g,'เปรตไม่เป็นเปรตอีกต่อไป',W/2,58,PAL.goldL,10,'center');
  const lines=['The hungry ghost smiled — a smile the size of a needle\'s eye —','and it was enough.'];
  lines.forEach((l,i)=>pTxt(g,l,W/2,78+i*11,'#efe6d8',7,'center'));
  const st=[
    'merit '+GS.merit+' บุญ · prayers received '+GS.q.prayers+' · spirits met '+(GS.q.ghosts||0)+'/5',
    (GS.q.lamp?'streetlight fixed ✓':'streetlight, still dark')+' · '+(GS.q.cat?'Meow-Meow rescued ✓':'a cat, still up a tree'),
    (GS.q.tree?'road cleared ✓':'road, still blocked')+' · '+(GS.q.garland?'garland hung ✓':'garland, still fallen'),
    GS.q.offerings+' bowls of noodles inhaled politely · '+GS.q.pets+' cat pets given',
  ];
  st.forEach((l,i)=>pTxt(g,l,W/2,108+i*10,'#b0a494',6,'center'));
  const freed=GHOSTS.filter(x=>x.freed).length;
  pTxt(g, freed>=5? 'every unquiet thing on this land was released, not broken · เมตตา'
      : freed>0? freed+' spirits released with เมตตา, the rest merely driven off'
      : 'you drove them all off. none of them were freed.',
    W/2,154, freed>=5?PAL.goldL:'#8a8098',6,'center');
  pTxt(g,'ขอให้ไปสู่สุคติ — may you go to a good place',W/2,176,PAL.jadeL,8,'center');
  g.globalAlpha=0.6+0.4*Math.sin(GS.t*4);
  pTxt(g,'E — stay for the morning   ·   R — begin again',W/2,H-22,PAL.gold,7,'center');
  g.globalAlpha=1;
}

/* ============================================================
   TITLE & INTRO
   ============================================================ */
const TP=makePrete(); TP.x=W*0.30; TP.y=214; TP.face=1;
function drawTitle(){
  const g=ctx;
  GS.dawn=0;
  drawSky(g);
  // a grove in silhouette
  g.fillStyle='#0a0918';
  for(let i=0;i<8;i++){
    const x=(i*67+18), h2=44+((i*37)%40);
    pTaper(g,x,H,x+((i%3)-1)*6,H-70-h2,7,3,'#0a0918');
    for(let k=0;k<6;k++){ const a=(k/6)*TAU+i;
      pTaper(g,x,H-70-h2,x+Math.cos(a)*22,H-70-h2+Math.sin(a)*9+7,4,1,'#0a0918'); }
  }
  pR(g,0,H-46,W,46,'#0c0b1c');
  for(let x=0;x<W;x+=3) pR(g,x,H-46,2,1,'#141230');
  // the prete, swaying under the moon
  TP.anim+=1/60; TP.blink-=1/60; if(TP.blink<-0.12) TP.blink=rnd(2,6);
  TP.x = W*0.30 + Math.sin(GS.t*0.6)*3;
  drawPrete(g,TP,{dt:1/60,wind:Math.sin(GS.t*0.4)*0.25, cos:{skirt:'ash'}});
  // fireflies
  for(let i=0;i<16;i++){
    const fx=W/2+Math.sin(GS.t*0.4+i*2.1)*150+Math.sin(GS.t*0.2+i)*40;
    const fy=110+Math.cos(GS.t*0.33+i*1.7)*44;
    const bl=0.5+0.5*Math.sin(GS.t*2+i*3);
    g.fillStyle=`rgba(190,255,150,${0.65*bl})`; g.fillRect(R(fx),R(fy),1,1);
  }
  // title
  pTxt(g,'PRETE',W*0.62,72,PAL.gold,44,'center',true);
  pTxt(g,'SIMULATOR',W*0.62,96,'#ffe9b3',20,'center',true);
  pTxt(g,'เปรตซิมูเลเตอร์',W*0.62,116,PAL.goldL,13,'center');
  pTxt(g,'a cozy Thai hungry-ghost tale',W*0.62,130,'#8a8098',7,'center');
  const sv=loadSaveRaw();
  const hasSave=sv&&(sv.merit>0||(sv.q&&sv.q.metPhra));
  g.globalAlpha=0.6+0.4*Math.sin(GS.t*4);
  pTxt(g, hasSave? (sv.q&&sv.q.done?'ENTER — a morning stroll':'ENTER — continue'):'PRESS ENTER', W*0.62,166,'#ffd98a',10,'center');
  g.globalAlpha=1;
  if(hasSave) pTxt(g,'N — new night',W*0.62,180,'#7a7488',7,'center');
  pTxt(g,'←→ walk · SPACE jump · E talk · Z light · X heavy · C วี้ด · SHIFT guard · TAB ledger · M sound',
    W/2,H-10,'#5a5468',6,'center');
}
const INTRO=[
  {t:"In your last life you took what wasn't yours, and drank what wasn't offered.",s:1},
  {t:'You laughed past the temple gate. The bell rang for you anyway.',s:2},
  {t:'Then one night the counting stopped. กรรม — karma — is patient, and karma is exact.',s:3},
  {t:"You woke in the cremation ground, tall as the palms, hungry as a drought, with a mouth the size of a needle's eye.",s:4},
  {t:'You are เปรต now. A hungry ghost. But a ledger has two columns — and the village is still awake.',s:4},
];
let introI=0, introCh=0;
function drawIntro(){
  const g=ctx;
  g.fillStyle='#0a0918'; g.fillRect(0,0,W,H);
  const p=INTRO[introI];
  g.save(); g.translate(0,-8);
  if(p.s===1){
    pR(g,80,54,320,110,'#161226'); pR(g,80,54,320,4,'#0e0b1c');
    pR(g,120,128,240,7,'#3a2c22'); pR(g,130,135,8,28,'#3a2c22'); pR(g,342,135,8,28,'#3a2c22');
    for(let i=0;i<3;i++){ pR(g,170+i*22,110,8,18,'#2a4a3a'); pR(g,172+i*22,104,4,7,'#1d3529'); }
    pR(g,268,112,20,16,'#8a6a2a'); pR(g,272,108,12,5,PAL.gold);
    const v=makeVillager({x:228,y:128,skin:PAL.skin,shirt:'#a83f33',shirtD:'#7e2f26',legs:'#3a3a44',hair:'short'});
    g.save(); g.scale(1.9,1.9); v.x=120; v.y=67; drawVillager(g,v,{}); g.restore();
    const gl=g.createRadialGradient(240,120,4,240,120,110);
    gl.addColorStop(0,'rgba(255,190,90,0.15)'); gl.addColorStop(1,'rgba(255,190,90,0)');
    g.fillStyle=gl; g.fillRect(80,40,320,140);
  } else if(p.s===2){
    drawSky(g);
    pR(g,0,164,W,60,'#0c0b1c');
    const ch=artChedi(); g.globalAlpha=0.9; g.drawImage(ch,300,20,ch.width*0.9,ch.height*0.9); g.globalAlpha=1;
    pR(g,250,140,26,24,'#241c3a'); pR(g,258,134,10,7,'#8a6a2a');
    const beg=makeVillager({x:296,y:164,skin:'#c69670',shirt:'#4a4452',shirtD:'#353043',legs:'#2c2836',hair:'short'});
    drawVillager(g,beg,{wai:1});
    const v=makeVillager({x:150,y:164,skin:PAL.skin,shirt:'#a83f33',shirtD:'#7e2f26',legs:'#3a3a44',hair:'short'});
    v.vx=40; v.phase=GS.t*4; g.save(); g.scale(1.6,1.6); v.x=94; v.y=102; drawVillager(g,v,{}); g.restore();
  } else if(p.s===3){
    const tip=Math.min(1,GS.t*0.35)*14;
    g.strokeStyle='#cfc4ae'; g.lineWidth=1;
    g.beginPath(); g.moveTo(240,70); g.lineTo(240,150); g.stroke();
    g.beginPath(); g.moveTo(180,86+tip); g.lineTo(300,86-tip); g.stroke();
    g.strokeRect(160,90+tip,40,14); g.strokeRect(280,80-tip,40,14);
    pR(g,163,93+tip,34,10,'#241c3a');
    pR(g,296,86-tip,6,4,PAL.gold);
    pR(g,222,150,36,5,'#cfc4ae');
    pTxt(g,'กรรม',240,186,'#8a8098',16,'center');
  } else {
    drawSky(g);
    pR(g,0,178,W,50,'#0f1226');
    for(let i=0;i<8;i++){ const x=i*66+14;
      pTaper(g,x,182,x,140,6,3,'#0a0918');
      for(let k=0;k<5;k++){ const a=(k/5)*TAU; pTaper(g,x,140,x+Math.cos(a)*17,140+Math.sin(a)*7+5,3,1,'#0a0918'); } }
    for(let i=0;i<6;i++){ const x=40+i*74; pR(g,x,168,4,14,'#8d8f80'); pEll(g,x+2,168,3,3,'#a4a695'); }
    TP.anim+=1/60; TP.x=W/2; TP.y=182;
    g.save(); g.scale(1.5,1.5);
    const sv={x:TP.x,y:TP.y}; TP.x=W/3; TP.y=120;
    drawPrete(g,TP,{dt:1/60,wind:0.1,cos:{skirt:'ash'}});
    TP.x=sv.x; TP.y=sv.y; g.restore();
    if(introI===4){ const gl=g.createRadialGradient(W/2,120,6,W/2,120,90);
      gl.addColorStop(0,'rgba(205,191,216,0.16)'); gl.addColorStop(1,'rgba(205,191,216,0)');
      g.fillStyle=gl; g.fillRect(W/2-90,30,180,180); }
  }
  g.restore();
  pR(g,0,H-46,W,46,'rgba(10,8,20,0.88)'); pR(g,0,H-46,W,1,PAL.gold);
  let ty=H-31;
  for(const l of wrap(g,p.t.slice(0,introCh|0),W-48,7).slice(0,3)){ pTxt(g,l,24,ty,'#efe6d8',7); ty+=11; }
  g.globalAlpha=0.5+0.5*Math.sin(GS.t*5);
  pTxt(g,(introI+1)+'/'+INTRO.length+' ▾',W-24,H-6,'#7a7488',6,'right');
  g.globalAlpha=1;
  pTxt(g,'E / ENTER',12,H-6,'#5a5468',6);
}
/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  GS.t+=dt;
  AU.tick(dt);
  GS.wind = Math.sin(GS.t*0.31)*0.32 + Math.sin(GS.t*0.113)*0.18;
  GS.shake = Math.max(0, GS.shake - dt*16);
  if(meritFlash>0) meritFlash-=dt*2;
  for(const f of FIREFLIES){
    f.t+=dt*f.sp;
    f.x=f.hx+Math.sin(f.t*0.85)*16+Math.sin(f.t*0.37)*9;
    f.y=f.hy+Math.cos(f.t*0.7)*10+Math.sin(f.t*0.53)*5;
  }
  if(press('mute')){ AU.toggle(); toast(AU.muted?'sound off':'sound on ♪','#9ecbff'); }

  switch(GS.state){
    case 'title':
      TP.anim+=dt;
      if(press('act')||press('light')||press('tap')){
        const sv=loadSaveRaw();
        if(sv&&(sv.merit>0||(sv.q&&sv.q.metPhra))) continueGame(sv); else newGame();
        AU.ding();
      }
      if(press('newgame')){ clearSave(); newGame(); AU.ding(); }
      break;
    case 'intro':
      introCh+=dt*44;
      if(press('act')||press('light')||press('tap')){
        AU.blip();
        const cap=INTRO[introI].t;
        if(introCh<cap.length) introCh=cap.length;
        else { introI++; introCh=0;
          if(introI>=INTRO.length){ GS.state='play'; GS.camX=clamp(P.x-W/2,0,WORLD_W-W);
            setTimeout(()=>toast('east along the road · ศาลพระภูมิ','#9ee8b0'),700); } }
      }
      break;
    case 'play':{
      stepDlg(dt);
      stepPlayer(dt);
      stepNpcs(dt);
      if(!DLG){
        checkInteract();
        if(press('tree')||press('help')){ GS.state='tree'; TREE.tab=0; AU.sel(); }
      }
      if(GS.ready && !GS.q.done && Math.abs(P.x-SHRINE_X)<44 && !DLG){ PROMPT=null; startCeremony(); }
      const gy=groundY(P.x);
      const look=clamp(P.vx*0.42,-46,46);
      GS.camX = lerp(GS.camX, clamp(P.x+look-W/2, 0, WORLD_W-W), 1-Math.pow(0.0009,dt));
      const ty = clamp((gy-GBASE)*0.9 + (P.y<gy-74? (P.y-(gy-74))*0.45 : 0), -46, 40);
      GS.camY = lerp(GS.camY, ty, 1-Math.pow(0.004,dt));
      break; }
    case 'task':     PROMPT=null; stepTask(dt); break;
    case 'fight':    PROMPT=null; stepFight(dt); break;
    case 'tree':     PROMPT=null; stepTree(dt); break;
    case 'ceremony': stepCeremony(dt); break;
    case 'end':
      GS.t2=(GS.t2||0)+dt;
      if(GS.t2>1.4){
        if(press('act')||press('light')||press('tap')){
          GS.state='play';
          for(const n of NPCS){ n.state='idle'; n.t=rnd(1,4); }
          toast('a soft morning ☀ wander as long as you like','#ffd98a');
        }
        if(press('restart')){ clearSave(); location.reload(); }
      }
      break;
  }
  stepParts(dt);
  clearPress();
}

/* ============================================================
   NEW / CONTINUE
   ============================================================ */
function resetWorld(){
  for(const gh of GHOSTS){ gh.dead=false; gh.freed=false; }
  const bl=LIGHTS.find(l=>l.broken); if(bl) bl.on=false;
  CAT.state='tree'; CAT.x=TAMARIND_X+16; CAT.y=groundY(TAMARIND_X)-104;
  PHRA.shown=false; offering=null; DLG=null; FT=null; HT=null;
  PT.length=0; GS.toasts.length=0;
}
function newGame(){
  GS.merit=0; GS.spent=0; GS.skills={}; GS.cos={skirt:'ash'};
  GS.q={prayers:0,offerings:0,pets:0,ghosts:0}; GS.seen={}; GS.dawn=0; GS.ready=false;
  P.x=300; P.y=groundY(300); P.vx=0; P.vy=0; P.hp=P.maxhp; P.breath=100; P.rise=0;
  resetWorld();
  GS.camX=clamp(P.x-W/2,0,WORLD_W-W); GS.camY=0;
  introI=0; introCh=0; GS.state='intro'; GS.t=0;
  saveGame();
}
function continueGame(sv){
  GS.merit=sv.merit|0; GS.spent=sv.spent|0;
  GS.skills=sv.skills||{}; GS.cos=Object.assign({skirt:'ash'},sv.cos||{});
  GS.q=Object.assign({prayers:0,offerings:0,pets:0,ghosts:0},sv.q||{});
  GS.seen=sv.seen||{};
  resetWorld();
  if(GS.q.lamp){ const bl=LIGHTS.find(l=>l.broken); if(bl) bl.on=true; }
  if(GS.q.cat){ CAT.state='wander'; CAT.x=TAMARIND_X+40; CAT.y=groundY(CAT.x); }
  if(GS.q.metPhra) PHRA.shown=true;
  if(GS.q.ghostsList) for(const id of GS.q.ghostsList){ const g=GHOSTS.find(x=>x.id===id); if(g) g.dead=true; }
  if(GS.q.freedList)  for(const id of GS.q.freedList){ const g=GHOSTS.find(x=>x.id===id); if(g) g.freed=true; }
  if(GS.q.done){ GS.dawn=1; GS.cos.halo=1; }
  if(GS.merit>=GOAL && GS.q.metPhra && !GS.q.done) GS.ready=true;
  P.x=clamp(sv.x||300,20,WORLD_W-20); P.y=groundY(P.x); P.vx=0; P.vy=0;
  P.hp=P.maxhp; P.breath=100; P.rise=0;
  GS.camX=clamp(P.x-W/2,0,WORLD_W-W); GS.camY=0;
  GS.state='play';
}

/* ============================================================
   BOOT
   ============================================================ */
{ const sv=loadSaveRaw(); if(sv&&typeof sv.mute==='boolean') AU.muted=sv.mute; }
let _last=performance.now(), _acc=0;
const STEP=1/60;
function drawLoading(){
  ctx.setTransform(SC,0,0,SC,0,0); ctx.imageSmoothingEnabled=false;
  ctx.fillStyle=PAL.night0; ctx.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){ const s=STARS[i];
    ctx.fillStyle=`rgba(255,246,224,${0.5*(0.4+0.6*Math.sin(GS.t*2+s[2]))})`;
    ctx.fillRect(R(s[0]*W),R(s[1]*H),1,1); }
  pTxt(ctx,'เปรต',W/2,H/2-14,PAL.gold,26,'center');
  const step=BUILD_STEPS[Math.min(BUILD_I,BUILD_STEPS.length-1)];
  pTxt(ctx,step[0]+'…',W/2,H/2+6,'#8a8098',7,'center');
  const w2=120, pr=BUILD_I/BUILD_STEPS.length;
  pR(ctx,W/2-w2/2,H/2+14,w2,3,'#241c3a');
  pR(ctx,W/2-w2/2,H/2+14,w2*pr,3,PAL.gold);
}
function frame(now){
  let dt=(now-_last)/1000; _last=now;
  if(!WORLD_READY){
    GS.t+=Math.min(0.1,dt);
    drawLoading();
    requestAnimationFrame(()=>{ buildStep(); requestAnimationFrame(frame); });
    return;
  }
  dt=Math.min(0.1,dt);
  if(GS.hitstop>0){ GS.hitstop-=dt; dt*=0.05; }
  _acc+=dt;
  let n=0;
  while(_acc>=STEP && n<4){ update(STEP); _acc-=STEP; n++; }
  if(n===0 && _acc>0){ /* wait for the next whole step */ }
  render();
  requestAnimationFrame(frame);
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
</script>

function gather(nd){
  const n = bagAdd(nd.item, nd.n);
  if(n<=0) return;
  nd.ready=false; nd.t=rnd(26,46);
  AU.ranat(680,0,0.05); pPop(nd.x, nd.y-14, ITEMS[nd.item].c);
  for(let i=0;i<n;i++) part({k:'pop',x:nd.x,y:nd.y-16,vx:rnd(-24,24),vy:rnd(-50,-20),life:.7,c:ITEMS[nd.item].c});
  toast('+'+n+' '+ITEMS[nd.item].n, PAL.jadeL);
  if(!GS.seen.firstPick){ GS.seen.firstPick=true;
    guideSay('Things regrow. Take what you need.'); }
}
let GIVE=null;
function openGive(target){
  const list=Object.keys(GS.bag).filter(id=>ITEMS[id] && (ITEMS[id].k==='dish'||ITEMS[id].k==='craft') && GS.bag[id]>0);
  if(!list.length){ guideSay('Nothing made in your basket yet. Cook something.'); return; }
  GIVE={target, list, i:0};
  GS.state='give'; AU.sel();
}
function stepGive(dt){
  const G3=GIVE;
  if(press('back')){ GS.state='play'; GIVE=null; clearPress(); return; }
  if(press('left')||press('up')) { G3.i=(G3.i+G3.list.length-1)%G3.list.length; AU.blip(); }
  if(press('right')||press('down')){ G3.i=(G3.i+1)%G3.list.length; AU.blip(); }
  if(press('act')){
    const id=G3.list[G3.i], t=G3.target;
    bagTake(id,1);
    GS.state='play'; GIVE=null;
    doGive(t,id);
  }
  clearPress();
}
function doGive(t,id){
  /* An order is a delivery, not a present: it settles first, and it never
     counts against the one-a-day rule below — otherwise nobody could ask
     you for two of anything. */
  if(reqGive(t,id)){ pHeart(t.x,t.y-30); pSpark(t.x,t.y-26,10,PAL.goldL); AU.metta();
    GS.q.gifts=(GS.q.gifts||0)+1; preteAct('give',0.9); saveGame(); return; }
  /* Stardew's rule, and a good one: one present each per day. A friendship
     made in one afternoon with a full basket is not a friendship. */
  if(GS.gifted[t.id]===DAY.n){
    say([{e:'warm', w:t.name, t:pick(["You've given me something already today.",
                                      'Save it. I will still be here tomorrow.'])}]);
    return;
  }
  GS.gifted[t.id]=DAY.n;
  const want = t.wants===id;
  const isSpirit = !!t.art;
  const name = isSpirit? t.name : t.name;
  GS.q.gifts=(GS.q.gifts||0)+1;
  P.face = t.x < P.x ? -1 : 1;
  preteAct('give', 0.9);
  npcReact(t,'wai',1.8);
  pHeart(t.x, t.y-30); pSpark(t.x,t.y-26,10,PAL.goldL);
  if(want){
    const already = GS.friends[t.id];
    GS.friends[t.id]=(GS.friends[t.id]||0)+1;
    heartAdd(t.id, 80, t);
    if(isSpirit) t.friend=true;
    const merit = already? 4 : 8;
    AU.metta();
    const lines = isSpirit
      ? [{w:name,t:t.thanks[0]},{w:name,t:t.thanks[1]}]
      : [{w:name,t:'Oh — for me? ' + (id==='garland'?'It smells like the inside of a temple.': 'This is exactly what I wanted and I never said so out loud.')}];
    if(!already && isSpirit && t.gift) lines.push({w:'',t:'They press something into your enormous hand: '+ITEMS[t.gift].n+'.'});
    say(lines, ()=>{
      addMerit(merit);
      toast('+'+merit+' '+L('merit'), PAL.goldL);
      if(!already && isSpirit && t.gift) bagAdd(t.gift,3,true);
      if(!already && isSpirit && !vignette('firstFriend'))
        guideSay('A friend. Worth more than the merit.');
      for(let i=0;i<6;i++) pOrb(t.x+rnd(-8,8), t.y-30+rnd(-6,6), i*0.15);
      saveGame();
    });
  } else {
    GS.friends[t.id]=(GS.friends[t.id]||0)+0;
    heartAdd(t.id, 45, t);
    addMerit(2);
    AU.ding();
    say([{w:name,t: isSpirit
      ? 'Oh! That\'s very kind. I can\'t really… but I\'ll keep it. Thank you, honestly.'
      : 'Ah, thank you! I\'ll find someone to share it with.'}],
      ()=>{ toast('+2 '+L('merit')); saveGame(); });
  }
}

const STARS=[]; for(let i=0;i<170;i++) STARS.push([Math.random(),Math.random()*0.66,rnd(TAU),Math.random()]);
const CLOUDS=[]; for(let i=0;i<11;i++) CLOUDS.push({x:Math.random()*1.4,y:rnd(0.05,0.44),w:rnd(50,140),h:rnd(6,17),sp:rnd(0.4,1.1),o:rnd(0.05,0.15)});
function drawSky(g){
  const d=GS.dawn;
  const c0=mix('#0a0c24','#2e2050',d), c1=mix('#141a3e','#7e4258',d),
        c2=mix('#222a58','#e08a52',d), c3=mix('#33406e','#f6c184',d);
  pVGrad(g,0,0,W,76,c0,c1,8);
  pVGrad(g,0,76,W,66,c1,c2,8);
  pVGrad(g,0,142,W,H-142,c2,c3,7);
  const sa=1-d;
  for(const s of STARS){
    const tw=0.45+0.55*Math.sin(GS.t*1.4+s[2]);
    const x=(s[0]*W - GS.camX*0.03 + W*4)%W;
    g.fillStyle=`rgba(255,246,224,${0.75*tw*sa*(0.35+s[3]*0.65)})`;
    g.fillRect(R(x),R(s[1]*H),1,1);
    if(s[3]>0.93 && tw>0.8){ g.fillRect(R(x-1),R(s[1]*H),1,1); g.fillRect(R(x+1),R(s[1]*H),1,1); }
  }
  const mx=(W*0.76 - GS.camX*0.02), my=32, ma=1-d*0.5;
  g.globalAlpha=ma;
  for(let i=3;i>0;i--){
    const gl=g.createRadialGradient(mx,my,10,mx,my,20+i*18);
    gl.addColorStop(0,`rgba(246,240,220,${0.08*i})`); gl.addColorStop(1,'rgba(246,240,220,0)');
    g.fillStyle=gl; g.fillRect(mx-70,my-70,140,140);
  }
  pCirc(g,mx,my,16,mix(PAL.moon,'#ffd9a8',d));
  pCirc(g,mx-5,my-5,4,PAL.moonD); pCirc(g,mx+6,my+5,3,PAL.moonD); pCirc(g,mx+3,my-8,2,PAL.moonD);
  pCirc(g,mx-8,my+6,2,PAL.moonD);
  g.globalAlpha=1;
  for(const c of CLOUDS){
    const x=((c.x*W*1.5 + GS.t*c.sp*3 - GS.camX*0.05)%(W*1.6))-W*0.3;
    g.globalAlpha=c.o*(1+d*1.2);
    pEll(g,x,c.y*H,c.w/2,c.h/2, mix('#3f4a80','#ffb98a',d));
    pEll(g,x+c.w*0.24,c.y*H-c.h*0.22,c.w/3,c.h/2.3, mix('#4a568e','#ffd0a4',d));
    pEll(g,x-c.w*0.2,c.y*H+c.h*0.1,c.w/4,c.h/2.8, mix('#374172','#f0b088',d));
    g.globalAlpha=1;
  }
}

   ============================================================ */
const lightCv=mkCv(W,H), lightG=G2(lightCv);
/* one soft black disc per radius, cut out of the night with destination-out */
const _punchSpr=new Map();
function punchSprite(r){
  let c=_punchSpr.get(r);
  if(!c){
    if(_punchSpr.size>48) _punchSpr.clear();
    const d=r*2;
    c=mkCv(d,d);
    const g2=c.getContext('2d');
    const gr=g2.createRadialGradient(r,r,1,r,r,r);
    gr.addColorStop(0,'rgba(0,0,0,1)'); gr.addColorStop(0.5,'rgba(0,0,0,0.62)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    g2.fillStyle=gr; g2.fillRect(0,0,d,d);
    _punchSpr.set(r,c);
  }
  return c;
}
function drawLighting(g,cx,cy){
  const night=1-GS.dawn;
  lightG.globalCompositeOperation='source-over';
  lightG.clearRect(0,0,W,H);
  lightG.fillStyle=`rgba(12,14,44,${0.08+0.46*night})`;
  lightG.fillRect(0,0,W,H);
  lightG.globalCompositeOperation='destination-out';
  const punch=(x,y,r,a)=>{
    const sx=x-cx, sy=y-cy;
    if(sx<-r||sx>W+r||sy<-r||sy>H+r) return;
    /* the hole is always the same shape, so cut it from a baked stencil rather
       than building a fresh gradient twenty-odd times a frame */
    const q=Math.max(2,Math.round(r/2)*2);
    lightG.globalAlpha=clamp(a,0,1);
    lightG.drawImage(punchSprite(q), R(sx-q), R(sy-q));
    lightG.globalAlpha=1;
  };
  for(const l of LIGHTS){ if(!l.on) continue;
    const fl=l.flick?1-Math.random()*l.flick:1; punch(l.x,l.y,l.r*fl,l.a); }
  const broken=LIGHTS.find(l=>l.broken);
  if(broken && !broken.on && Math.random()<0.05) punch(broken.x,broken.y,26,0.35);
  punch(P.x,P.y-42, GS.cos.halo?58:44, 0.42);
  for(const p of PT) if(p.k==='orb'&&p.t>=0) punch(p.x,p.y,10,0.55);
  for(const s of SPIRITS) punch(s.x, s.y-24, s.id==='krasue'?34:26, 0.34);
  punch(TANI.x,TANI.y-18,34,0.4);
  punch(KITCHEN_X-10, groundY(KITCHEN_X)-38, 40, 0.5);
  g.drawImage(lightCv,0,0);
}
function drawGlows(g){
  g.globalCompositeOperation='lighter';
  const night=1-GS.dawn;
  for(const l of LIGHTS){
    if(!l.on) continue;
    if(l.x-GS.camX<-90||l.x-GS.camX>W+90) continue;
    const fl=l.flick?1-Math.random()*l.flick:1;
    drawGlow(g,l.x,l.y,l.r*0.85*fl,l.c,0.15*night+0.03);
  }
  for(const f of FIREFLIES){
    if(f.x-GS.camX<-20||f.x-GS.camX>W+20) continue;
    const bl=0.5+0.5*Math.sin(f.t*2.2);
    if(bl<0.3) continue;
    g.fillStyle=`rgba(190,255,150,${0.65*bl*night})`; g.fillRect(R(f.x),R(f.y),1,1);
    drawGlow(g,f.x,f.y,7,'#96ff78',0.24*bl*night);
  }
  g.globalCompositeOperation='source-over';
}

/* strings of lanterns over the village road */
const LSTRING=[];
for(let i=0;i<LAMP_XS.length-1;i++){
  const a=LAMP_XS[i], b=LAMP_XS[i+1];
  const n=Math.max(2,Math.round((b-a)/34));
  for(let k=1;k<n;k++) LSTRING.push({a,b,t:k/n, c: ['#e8564a','#ffc44d','#5fbf7a','#5aa8e0','#e88fc0'][(i*3+k)%5]});
}
function drawLanternString(g){
  g.strokeStyle='rgba(20,16,30,0.75)'; g.lineWidth=1;
  for(let i=0;i<LAMP_XS.length-1;i++){
    const a=LAMP_XS[i], b=LAMP_XS[i+1];
    if(b-GS.camX<-40||a-GS.camX>W+40) continue;
    const y0=groundY(a)-118, y1=groundY(b)-118;
    g.beginPath(); g.moveTo(a+9,y0);
    g.quadraticCurveTo((a+b)/2, (y0+y1)/2+16, b+9, y1);
    g.stroke();
  }
  for(const L of LSTRING){
    const x=lerp(L.a+9,L.b+9,L.t);
    if(x-GS.camX<-16||x-GS.camX>W+16) continue;
    const y0=groundY(L.a)-118, y1=groundY(L.b)-118;
    const u=L.t, y=(1-u)*(1-u)*y0 + 2*(1-u)*u*((y0+y1)/2+16) + u*u*y1;
    const sw=Math.sin(GS.t*1.1 + L.t*7)*1.4;
    const c=L.c;
    pR(g,x+sw,y,1,3,'#3a3630');
    pEll(g,x+sw,y+7,4,5,c);
    pEll(g,x+sw,y+6,2.4,3,shade(c,0.35));
    pR(g,x+sw-2,y+3,5,1,shade(c,-0.35)); pR(g,x+sw-2,y+11,5,1,shade(c,-0.35));
    drawGlow(g,x+sw,y+7,14,c,0.18*(1-GS.dawn));
  }
}

   RENDER

function render(){
  ctx.setTransform(SC,0,0,SC,0,0);
  ctx.imageSmoothingEnabled=false;
  if(GS.state==='title'){ drawTitle(); return; }
  if(GS.state==='memory'){ drawMem(); return; }
  if(GS.state==='ascend'){ drawAscend(ctx); return; }

  const sh=GS.shake>0?GS.shake:0;
  const ox=sh?rnd(-sh,sh):0, oy=sh?rnd(-sh,sh):0;
  const cx=R(GS.camX+ox), cy=R(GS.camY+oy);

  drawSky(ctx);
  /* aerial perspective: each layer of distance gets a coat of the horizon's
     own colour, and the further off it is the more of it there is. At night
     the haze is nothing; by morning the far ridge is half sky. */
  const haze=hazeAmt(), hc=haze>0.01? hazeColour() : null;
  /* a coat too faint to see is still a full-screen fill, so do not */
  const coat=a=>{ if(!hc || a*haze<0.035) return; ctx.fillStyle=rgba(hc,a*haze); ctx.fillRect(0,0,W,H); };
  ctx.drawImage(farCv, -R(cx*PX.far), R(-cy*0.1));
  coat(0.38);
  ctx.drawImage(midCv, -R(cx*PX.mid), R(-cy*0.25));
  coat(0.14);
  ctx.drawImage(bgCv,  -R(cx*PX.bg),  R(-cy*0.55));
  coat(0.05);

  ctx.save(); ctx.translate(-cx,-cy);
  ctx.drawImage(playCv, cx, 0, W, H, cx, 0, W, H);
  drawWeatherMist(ctx);
  drawLanternString(ctx);

  // pond shimmer
  for(let i=0;i<10;i++){
    const x=POND_X-60+i*13+Math.sin(GS.t*0.8+i)*3, y=groundY(x)+5+Math.sin(GS.t*1.4+i*2)*1;
    if(x-cx<-8||x-cx>W+8) continue;
    pR(ctx,x,y,4,1,`rgba(190,225,255,${0.10+0.07*Math.sin(GS.t*2+i)})`);
  }

  drawSigns(ctx);
  drawCrittersBack(ctx);
  drawStoryBack(ctx);  // the stall, his house, the furrows
  drawFarm(ctx);
  drawNew(ctx);        // the barn, the jar, the log, and her
  if(GS.state==='play') drawNavMark(ctx);
  // gatherable plants
  for(const nd of NODES){
    if(nd.x-cx<-30||nd.x-cx>W+30) continue;
    drawNode(ctx,nd);
  }
  // the offering, the shrine spirit
  if(PHRA.shown) drawPhraPhum(ctx,PHRA.x,PHRA.y,PHRA.anim);
  if(GS.q.garland){
    const hx=SHRINE_X-16, hy=groundY(SHRINE_X)-86;
    for(let i=0;i<7;i++) pEll(ctx,hx+Math.sin(i*0.9)*2, hy+4+i*2.2, 2,2, i%3===0?'#ffce54':'#f6f0dc');
    pEll(ctx,hx,hy+20,2,3,PAL.jadeL);
  }
  if(GS.q.shrineBuilt){ const sx=SPIRIT_BY_ID.taihong.x-24;
    ctx.drawImage(ART.roadShrine, R(sx-19), R(groundY(sx)-52)); }
  if(offering){ pR(ctx,offering.x-4,offering.y-4,9,4,'#f5ead8'); pR(ctx,offering.x-3,offering.y-6,7,2,'#d8b04a'); }

  for(const n of NPCS){
    if(n.x-cx<-40||n.x-cx>W+40) continue;
    drawVillager(ctx,n,{dt:1/60,wind:GS.wind});
    if(n.mark){ const my=n.y-30-Math.sin(GS.t*5)*2;
      if(n.mark.k==='call') icoCall(ctx,n.x,my,0.8,PAL.gold); else icoStar(ctx,n.x,my,1,PAL.gold); }
    if(n.bub) bubble(ctx,n.x,n.y-32,n.bub.txt);
    wishBubble(ctx,n,n.y-34);
  }
  if(CAT.state!=='tree'){ drawCat(ctx,{x:CAT.x,y:CAT.y,face:CAT.face,anim:CAT.anim,phase:CAT.phase,state:CAT.walking?'walk':'sit'}); }
  else drawCat(ctx,{x:CAT.x,y:CAT.y,face:-1,anim:CAT.anim,state:'tree'});
  drawTani(ctx,TANI,{wave:TANI.waveT>0});

  for(const s of SPIRITS){
    if(storyBusy()) break;        // the first night is about a person, not a ghost
    if(s.x-cx<-70||s.x-cx>W+70) continue;
    const y = s.id==='krasue'? s.y-52+Math.sin(s.anim*1.5)*6
            : s.id==='krahang'? s.y-38+Math.sin(s.anim*2)*5 : s.y;
    GHOST_ART[s.art](ctx,{x:s.x,y:y,face:s.face,anim:s.anim,hurtT:0,attackT:0,hop:s.hop,h:s.id==='taihong'?46:44,friendly:1});
    if(s.wave>0) icoCall(ctx,s.x+10*s.face,y-32,0.9,PAL.goldL);
    drawHandTag(ctx,s);
    if(s.friend) icoHeart(ctx,s.x-11,y-33,1,'#ff8fae');
    if(s.bub) bubble(ctx,s.x,y-36,s.bub.txt);
    wishBubble(ctx,s,y-38);
  }

  pEll(ctx,P.x,P.y+1,9,2.6,'rgba(10,8,24,0.4)');
  drawPrete(ctx,P,{dt:1/60, wind:GS.wind, mouth:P.state==='wail'?1:(P.talk||0),
    headX:(P.chatX||0),
    armTarget: HT? {x:HT.hx,y:HT.hy}
              : PLOW? {x:PLOW.x-19, y:groundY(PLOW.x)-41} : null,
    /* asked this way rather than through carriedJars(), which built a throwaway
       array twice a frame for the ninety-nine per cent of the time he is not
       carrying anything at all */
    carry: P.carry? P.carry.jars.length : 0,
    carryWater: P.carry? P.carry.jars : null,
    gold: GS.cos.halo?1:0, rise:P.rise||0});
  if(HT) drawTaskWorld(ctx);
  drawStoryFore(ctx);  // whoever is walking you home, and what you are holding
  drawCrittersFore(ctx);
  drawNewFore(ctx);    // things in the air, and the mist over the road east
  drawParts(ctx);
  ctx.restore();

  drawLighting(ctx,cx,cy);
  ctx.save(); ctx.translate(-cx,-cy);
  drawGlows(ctx);
  drawMotes(ctx);
  for(const f of FORE){
    const fx=f.x - cx*1.32 + cx*0.32;
    if(fx-cx<-14||fx-cx>W+14) continue;
    const sw=Math.sin(GS.t*1.3+f.ph)*2.2;
    pTaper(ctx,fx,f.y+8,fx+sw,f.y+8-f.h,3,1,f.c);
  }
  ctx.restore();

  /* the daylight pass. Everything up to here is painted for dusk, which is
     when most of the story happens; left alone, ten in the morning came out
     the same slate grey. One warm overlay across the whole frame puts the
     contrast back between a bright sky and a green field. */
  const dayA = clamp((TOD.v-0.52)/0.42,0,1);
  if(dayA>0.02){
    ctx.globalCompositeOperation='overlay';
    ctx.fillStyle=`rgba(255,201,131,${(0.13*dayA).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
  }
  /* the cool end of the grade: the ground and the foreground step back into
     blue. The warm end rides along on the daylight pass, which was already
     covering the whole frame anyway. */
  ctx.drawImage(coolBand(clamp((TOD.v-0.5)/0.35,0,1)), 0, R(H*0.58));
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.46,W/2,H/2,H*1.0);
  vg.addColorStop(0,'rgba(8,6,20,0)');
  vg.addColorStop(1,`rgba(8,6,20,${0.38-0.26*TOD.v})`);
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  if(GS.state==='play' && !VIG){ drawPosopBubble(ctx); drawHintLine(ctx); drawHUD(); }
  if(GS.state==='plow') drawPlowUI(ctx);
  else if(GS.state==='task') drawTaskHUD(ctx);
  drawVig(ctx);
  drawDialog(ctx);
  if(GS.state==='tree') drawLedger(ctx);
  if(GS.state==='act')  drawAct(ctx);
  if(GS.state==='give') drawGive(ctx);
  if(GS.state==='shop') drawShop(ctx);
  if(GS.state==='ceremony') drawCeremonyUI(ctx);
  if(GS.state==='end') drawEnd(ctx);
  drawStoryUI(ctx);    // the chapter card, and the fade through the night
  if(TOUCH.on && uiShowsPads() && !DAY.sleeping) drawPads(ctx);
  drawDay(ctx);
}

function drawNode(g,nd){
  const x=nd.x, y=nd.y;
  const sway=Math.sin(GS.t*1.1+x*0.05)*1.5;
  if(!nd.ready){
    for(let i=0;i<3;i++) pTaper(g,x-4+i*4,y,x-4+i*4+sway*0.4,y-6,3,1,'#3d5c44');
    return;
  }
  const c=ITEMS[nd.item].c;
  switch(nd.art){
    case 'paddy': for(let i=0;i<5;i++){ const lx=x-8+i*4;
        pTaper(g,lx,y,lx+sway,y-13,2.4,1,'#5f9a58'); pEll(g,lx+sway,y-14,2,2.6,c); } break;
    case 'clay': pEll(g,x,y-2,10,5,'#7a5238'); pEll(g,x,y-4,8,4,'#9a6b4a'); pEll(g,x-3,y-5,3,2,'#b0805c'); break;
    case 'chili': case 'lemongrass': case 'lime': {
        const img=ART.garden[nd.art]; g.drawImage(img, R(x-img.width/2), R(y-img.height+2)); break; }
    case 'flowers': for(let i=0;i<6;i++){ const lx=x-10+i*4, lh=8+((i*5)%7);
        pTaper(g,lx,y,lx+sway*0.6,y-lh,2,1,'#3f7a52');
        for(let k=0;k<4;k++){ const a=k/4*TAU; pEll(g,lx+sway*0.6+Math.cos(a)*2,y-lh+Math.sin(a)*2,1.6,1.6,c); }
        pEll(g,lx+sway*0.6,y-lh,1.2,1.2,'#ffce54'); } break;
    case 'banana': { const img=ART.banana[0];
        g.drawImage(img, R(x-img.width*0.5), R(y-img.height*0.86), R(img.width*0.86), R(img.height*0.86));
        for(let i=0;i<3;i++) pTaper(g,x+2,y-34-i*4,x+9,y-36-i*4,4,2,c); break; }
    case 'leaf': for(let i=0;i<4;i++){ const lx=x-8+i*5;
        pTaper(g,lx,y,lx,y-14,3,2,'#5f8a4a'); pEll(g,lx+sway*0.5,y-17,6,3.4,c); pR(g,lx-6,y-17,12,1,'#2e6b44'); } break;
    case 'coconut': for(let i=0;i<3;i++) pEll(g,x-5+i*5,y-5+((i%2)*3),4,4,'#7d5a3c'); break;
    default: pEll(g,x,y-7,9,7,'#3f7a52'); pEll(g,x-2,y-9,5,4,'#4f9e5c');
      for(let i=0;i<3;i++) pEll(g,x-5+i*5,y-8-((i%2)*3),3,3,c);
  }
  // a small shine so you can tell it is pickable
  const bl=0.5+0.5*Math.sin(GS.t*2.4+x);
  pR(g,x+9,y-20-bl*2,1,1,rgba(PAL.goldL,0.5+0.5*bl));
  pR(g,x-10,y-16-bl,1,1,rgba(PAL.goldL,0.3+0.3*bl));
}

function drawTaskWorld(g){
  const t=HT;
  if(t.kind==='bug'||t.kind==='chop'){ drawTaskNew(g,t); }
  if(t.kind==='lamp'){
    for(const w2 of [t.a,t.b]) pEll(g,w2.x,w2.y,2,2,'#c8c4b8');
    if(t.grabbed){ pLimb(g,t.a.x,t.a.y,t.hx,t.hy,1.6,'#3a3a44'); pLimb(g,t.hx,t.hy,t.b.x,t.b.y,1,rgba('#ffd257',0.5)); }
    for(let i=0;i<20;i++){ const a=i/20*TAU; pR(g,t.b.x+Math.cos(a)*13,t.b.y+Math.sin(a)*13,1,1,t.prog>0?PAL.gold:'#4a4458'); }
  }
  if(t.kind==='cat'){
    const c=t.cat;
    drawCat(g,{x:c.x,y:c.y,face:-1,anim:GS.t,state:'tree'});
    if(c.fear>0.1) for(let i=0;i<3;i++) pR(g,c.x-4+i*4,c.y-18-c.fear*4,1,3,rgba('#8fc4e8',c.fear));
  }
  if(t.kind==='tree'){
    const gy=groundY(FALLEN_TREE_X);
    g.save(); g.translate(R(FALLEN_TREE_X),R(gy-10-t.lift*30)); g.rotate(t.bal*0.16);
    pTaper(g,-52,4,54,-6,15,11,'#4c3a2c'); pTaper(g,-52,2,54,-8,5,4,'#5f4a37');
    g.restore();
  }
  if(t.kind==='garland'){
    pR(g,t.hook.x-1,t.hook.y-3,2,4,'#c9992f');
    for(let i=0;i<7;i++) pEll(g,t.hx+Math.sin(i*0.9)*2,t.hy+4+i*2.2,2,2,i%3===0?'#ffce54':'#f6f0dc');
    for(let i=0;i<18;i++){ const a=i/18*TAU; pR(g,t.hook.x+Math.cos(a)*11,t.hook.y+Math.sin(a)*11,1,1,t.prog>0?PAL.gold:'#4a4458'); }
  }
  const dirx=sign(t.vx)||1;
  pEll(g,t.hx,t.hy,6,7,PAL.pale);
  pEll(g,t.hx+1.5*dirx,t.hy+1,4,5,PAL.paleD);
  for(let i=0;i<4;i++){ const a=-0.6+i*0.4+(t.grip?0.55:0);
    pLimb(g,t.hx,t.hy,t.hx+Math.cos(a)*(t.grip?7:10.5),t.hy+Math.sin(a)*(t.grip?7:10.5),2,i%2?PAL.paleD:PAL.pale); }
  pLimb(g,t.hx,t.hy+2,t.hx-dirx*7,t.hy+7,2.4,PAL.paleD);
  const sx0=P.x+P.face*6, sy0=P.y-66;
  const mid={x:(sx0+t.hx)/2,y:Math.max(sy0,t.hy)+16};
  let px0=sx0,py0=sy0;
  for(let i=1;i<=10;i++){
    const u=i/10,iu=1-u;
    const qx=iu*iu*sx0+2*iu*u*mid.x+u*u*t.hx, qy=iu*iu*sy0+2*iu*u*mid.y+u*u*t.hy;
    pTaper(g,px0,py0,qx,qy,lerp(5.5,3.6,u-0.1),lerp(5.5,3.6,u),u<0.5?PAL.paleD:PAL.pale);
    px0=qx; py0=qy;
  }
}

const TREE={col:0,row:0,tab:0};
function stepTree(dt){
  GS.seen.ledger=true;
  if(press('back')||press('tree')){ GS.state='play'; AU.sel(); clearPress(); return; }
  if(press('heavy')||press('whistle')||press('give')){ TREE.tab=(TREE.tab+1)%3; TREE.row=0; AU.sel(); }
  if(TREE.tab===0){
    const keys=Object.keys(SKILLS);
    if(press('left')){ TREE.col=(TREE.col+2)%3; AU.blip(); }
    if(press('right')){ TREE.col=(TREE.col+1)%3; AU.blip(); }
    const col=keys.filter(k=>SKILLS[k].br===TREE.col);
    if(press('up')) { TREE.row=clamp(TREE.row-1,0,col.length-1); AU.blip(); }
    if(press('down')){ TREE.row=clamp(TREE.row+1,0,col.length-1); AU.blip(); }
    TREE.row=clamp(TREE.row,0,col.length-1);
    if(press('act')){
      const id=col[TREE.row], s=SKILLS[id];
      if(GS.skills[id]) AU.blip();
      else if(s.need && !GS.skills[s.need]){ toast('learn '+SKILLS[s.need].n+' first','#c8888a'); AU.blip(); }
      else if(avail()<s.cost){ toast('you need '+(s.cost-avail())+' more merit','#c8888a'); AU.blip(); }
      else { GS.skills[id]=1; GS.spent+=s.cost; AU.unlock(); toast('learned '+s.n,PAL.jadeL);
        if(id==='metta'){ GS.seen.own_halo=true; toast('Halo unlocked',PAL.goldL); }
        saveGame(); }
    }
  } else if(TREE.tab===1){
    const ids=Object.keys(COSMETICS).filter(c=>!COSMETICS[c].locked || GS.seen['own_'+c]);
    if(press('left')) { TREE.row=(TREE.row+ids.length-1)%ids.length; AU.blip(); }
    if(press('right')){ TREE.row=(TREE.row+1)%ids.length; AU.blip(); }
    if(press('up')||press('down')){ TREE.row=clamp(TREE.row+(K.up?-4:4),0,ids.length-1); AU.blip(); }
    TREE.row=clamp(TREE.row,0,ids.length-1);
    if(press('act')){
      const id=ids[TREE.row], c=COSMETICS[id], owned=GS.seen['own_'+id]||c.cost===0;
      if(owned){ GS.cos[c.slot]= c.slot==='skirt'? c.v : (GS.cos[c.slot]?0:c.v); AU.sel(); saveGame(); }
      else if(avail()>=c.cost){ GS.spent+=c.cost; GS.seen['own_'+id]=true; GS.cos[c.slot]=c.v; AU.unlock(); toast('got '+c.n,PAL.jadeL); saveGame(); }
      else { toast('not enough merit','#c8888a'); AU.blip(); }
    }
  } else {
    const list=GIFTEES();
    if(press('up')||press('left'))  { TREE.row=(TREE.row+list.length-1)%list.length; AU.blip(); }
    if(press('down')||press('right')){ TREE.row=(TREE.row+1)%list.length; AU.blip(); }
  }
  clearPress();
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
let PROMPT=null;
/* everything in reach this frame, best first. PROMPT is SPOTS[0]. */
const SPOTS=[], SPOT_MAX=7;
function near(x,d=34){ return Math.abs(P.x-x)<d; }
function checkInteract(){
  SPOTS.length=0; PROMPT=null;
  if(DLG) return;
  /* Everything within reach goes in the list, nearest-first by the order the
     checks below are written in. PROMPT is simply the front of it — which is
     exactly what it used to be — and the rest each get a little icon of their
     own, because two things standing close together used to mean only one of
     them could ever be used. */
  const set=(x,y,txt,fn,sub,icon)=>{
    if(SPOTS.length>=SPOT_MAX) return;
    for(const o of SPOTS) if(o.fn===fn || (o.txt===txt && Math.abs(o.x-x)<3)) return;
    SPOTS.push({x,y,txt,fn,sub,icon:icon||spotIcon(txt,sub), pri:0});
  };
  /* ---- the first night owns every prompt while it is running. Until the
     old man's field is sown there is no shop, no order board and no ghost
     wanting a chat: there is one thing to do and the game says what it is. ---- */
  storyInteract(set, ()=>false);
  if(storyBusy()){ endInteract(); return; }
  /* ---- the farm first: it is fixed furniture, and a ghost drifting across
     a bed must never stop you working it ---- */
  checkNewFixed(set, ()=>false);      // the barn, the jar, the log, and her
  checkNewBugsFirst(set, ()=>false);  // and a bug you are standing right under
  if(near(FARM_GATE,22))
    set(FARM_GATE, groundY(FARM_GATE)-56, FARM.rented? 'read the farm board' : 'read the notice', openBoard);
  if(FARM.rented && near(PEN_X,30)){
    const p=FARM.pen;
    if(!penHas()) set(PEN_X, groundY(PEN_X)-38, 'the pen is empty', ()=>guideSay('The board at the gate sells chickens, ducks, and one very large buffalo.'));
    else if(penFull()) set(PEN_X, groundY(PEN_X)-40, 'take what they left you', penCollect, 'feed');
    else set(PEN_X, groundY(PEN_X)-38, p.feed>0? 'the animals are settled' : 'the animals want feeding', penFeed);
  }
  if(true){
    const pl=plotAt(P.x);
    if(pl && near(pl.x,15)){
      const t=plotPrompt(pl);
      if(t==='the bed is empty')
        set(pl.x, groundY(pl.x)-30, t, ()=>guideSay('The seed sack is in the barn, or three for nine baht at the stall.'));
      else set(pl.x, groundY(pl.x)-30, t, ()=>usePlot(pl));
    }
  }
  if(true){
    const pd=paddyAt(P.x);
    if(pd) set(pd.x, groundY(pd.x)-28, paddyPrompt(pd), ()=>{
      if(pd.stage===0 && !bagHas('seed')) guideSay('Rice starts as seed too. The sack is in the barn.');
      else usePaddy(pd);
    });
  }
  if(true){
    const tr=treeAt(P.x);
    if(tr) set(tr.x, groundY(tr.x)-72, treePrompt(tr), ()=>useTree(tr));
  }
  /* then people. A spirit standing by a barn or a water jar used to overwrite
     the prompt that was already set, which is how Krahang came to be
     answering for the โอ่ง; now they queue up behind it instead and you can
     tap whichever of them you actually meant. */
  for(const s of SPIRITS){
    if(near(s.x,40)){
      const y = s.id==='krasue'? s.y-76 : s.y-56;
      if(s.friend && FARM.rented)
        set(s.x,y, handOf(s.id)? L('talk to')+' '+L(s.name) : 'ask them to help', ()=>openHands(s), 'give');
      else

  if(near(MONK.x,30)) set(MONK.x,MONK.y-30,'approach politely', talkMonk, 'give');

     with something under it. They must never take a prompt off a person. */
  thingInteract(set, ()=>false);

function endInteract(){
  /* the list was built in precedence order; a handful of things ask to sit at
     the back of it rather than be left out altogether — a water jar standing
     where the bed is, after dark. The sort is stable, so everything else keeps
     the order the checks above put it in. */
  SPOTS.sort((a,b)=>a.pri-b.pri);
  PROMPT = SPOTS[0] || null;
  // arriving on a tapped spot interacts with whatever is standing there
  if(PROMPT && (press('act') || navTake())){ const f=PROMPT.fn; PROMPT=null; f(); }
  else navTake();
  // G gives to whoever is nearest
  if(press('give')){
    if(storyBusy()){ guideSay('Later. There is a field to get in.'); return; }
    let best=null,bd=44;
    for(const t of GIFTEES()){ const d=Math.abs(t.x-P.x); if(d<bd){ bd=d; best=t; } }
    if(best) openGive(best);
    else guideSay('Stand next to somebody first.');
  }
}
/* ---------- conversations ---------- */
function talkSpirit(s){
  if(s.met) sawToday(s);
  if(!s.met){
    s.met=true; saveGame();
    const lines=s.hi.map(t=>({w:s.name,t}));
    lines.push({w:'',t:s.about});
    lines.push({w:'',t:'It wants one thing, and has for a long time. Ask.'});
    say(lines, ()=>{ addMerit(3); toast('+3 merit · a new neighbour'); });
    return;
  }
  if(s.friend){ say([{w:s.name,t:pick(s.thanks)}]); return; }
  say([{w:s.name,t:s.wish},
       {w:s.name,t: has('eye')? 'You can see it, can\'t you. The thing I want.'
                              : 'I wouldn\'t ask. But you did ask, so — that.'}]);
}
function sawToday(o){
  if(!o || GS.talked[o.id]===DAY.n) return;
  GS.talked[o.id]=DAY.n;
  heartAdd(o.id, 20, o);
}
function talkVillager(v){
  sawToday(v);
  /* Three beats, never more: who they are to you, what they need, and
     one line of village. The middle beat is the only one that is ever
     a job, and it says the job out loud so nothing has to be guessed. */
  const V = VOICE[v.id] || {};
  const warm = (GS.friends[v.id]||0) > 0;
  const lines = [];
  lines.push({w:v.name, t: pick(warm ? (V.warm||[v.line]) : (V.cold||[v.line]))});

  const ask = reqAsk(v);
  if(ask){
    npcReact(v,'wave',1.4);
    lines.push({w:v.name, t: pick(V.ask||['I need something, if you have a moment.'])});
    lines.push({w:v.name, t: ask});
  } else if(!warm){
    lines.push({w:v.name, t:'What I would really like is '+L(ITEMS[v.wants].n)+'. Not that I would ever ask.'});
  } else {
    npcReact(v,'wai',1.6);
    lines.push({w:v.name, t: pick(V.chat||['The rice is doing what rice does.'])});
  }
  say(lines);
}
function talkMali(){
  if(!GS.q.cat){
    say([{w:'Mali',t:"M-Meow-Meow went too high. Even Papa's ladder is too short."},
         {w:'You',t:'(You crack your knuckles. It sounds like bamboo.)'},

}
function talkPhra(){

    say([
      {w:'',t:'You bow at the little house. Something inside bows back.'},
      {e:'calm', w:'Phra Phum',t:'Ah. A prete. And standing on my road, too.'},

    say([{e:'awe', w:'Phra Phum',t:"A hundred and eight. The ledger's level, tall one."},

         {e:'warm',w:'Phra Phum',t:'She sets out a fourth bowl. What do you think she knows?'},
         {e:'warm',w:'Phra Phum',t:"I've sent for the monk. Stand here and we'll pour the water."}],
      ()=>{ GS.ready=true; saveGame(); });
  } else if(GS.merit>=GOAL && !GS.q.done){
    say([{w:'Phra Phum',t:"A hundred and eight, and one page still turning. Nearly there."}]);
  } else if(GS.q.done){
    say([{w:'Phra Phum',t:'Still here? Good. Mornings suit you better.'}]);
  } else {
    const tips=[];

    if(!GS.q.tree) tips.push("A tree's down across the west road. The cart can't get by.");
    if(!GS.q.cat)  tips.push("That child's been crying under the tamarind for an hour. Something about a cat.");
    if(!GS.q.garland) tips.push("My garland fell. I'd hang it myself, but I'm eight inches tall.");
    const un=SPIRITS.filter(s=>!s.friend);
    if(un.length) tips.push(un.length+' lonely things on my land tonight. Not dangerous. Lonely. Nearest is '+un[0].name+'.');

    else if(!FARM.paddies) tips.push('A farm with no paddy is a garden. Build a dike when you can.');
    else if(!handCount() && SPIRITS.some(s=>s.friend)) tips.push('Your dead friends have hands and nothing to do. Ask them.');
    tips.push('Merit for wandering souls means you. Stand here when somebody prays.');

let CER=null;
const CER_LINES=[
  {w:'Luang Pi',t:'Neighbours. Tonight we pour water for a friend of this village.'},
  {w:'Mali',t:'The lamppost ghost!! I KNEW it!'},
  {w:'Phra Phum',t:'The ledger is read, and it is level.'},
  {w:'Luang Pi',t:'May this merit reach you. May the road home be short and lit.'},
  {w:'Tani',t:'See you around, tall one. …Somewhere better, I mean.'},

  {w:'Luang Pi',t:'Go gently. Go home.'},
];
function startCeremony(){
  GS.state='ceremony';
  CER={t:0,i:-1,lt:1.3,ch:0,rise:0,flash:0};
  const spots=[-46,-30,26,44,60];
  NPCS.forEach((n,i)=>{ n.x=SHRINE_X+(n.id==='monk'?-14:spots[i%spots.length]); n.y=groundY(n.x);
    n.state=n.id==='monk'?'idle':'wai'; n.vx=0; n.face=n.x<SHRINE_X?1:-1; });
  TANI.x=SHRINE_X+72; TANI.y=groundY(TANI.x)-4; TANI.face=-1;
  // every spirit you befriended comes to see you off
  let sx=SHRINE_X-90;
  for(const s of SPIRITS){ if(s.friend){ s.x=sx; s.y=groundY(sx); sx-=26; } }
  CAT.state='wander'; CAT.x=SHRINE_X+34; CAT.y=groundY(CAT.x); CAT.tx=CAT.x;
  PHRA.shown=true;
  P.x=SHRINE_X+8; P.y=groundY(P.x); P.vx=0; P.vy=0; P.face=-1;
  AU.bigDing();
}
function stepCeremony(dt){
  /* The sunrise at the end is the same sunrise as every other one now, so it
     goes through the clock. Setting GS.dawn directly stopped working the
     moment stepTOD started writing that field every frame. */
  const c=CER; c.t+=dt; setTOD(clamp(c.t/16,0,1), true);
  c.lt-=dt;
  if(c.i>=0&&c.i<CER_LINES.length) c.ch+=dt*44;
  if(c.lt<=0){
    c.i++; c.ch=0;
    if(c.i<CER_LINES.length){
      c.lt=1.25+CER_LINES[c.i].t.length/42;
      if(c.i===3){ AU.pour(); for(let i=0;i<24;i++) setTimeout(()=>part({k:'water',x:MONK.x+8,y:MONK.y-14,vx:rnd(-6,6),vy:34,life:0.8}),i*70); }
      if(c.i===6) AU.metta();
    } else c.lt=999;
  }
  if(Math.random()<dt*9) pPetal(P.x,P.y-52);
  if(Math.random()<dt*6) pSpark(P.x+rnd(-12,12),P.y-rnd(10,64),1,PAL.goldL);
  for(const n of NPCS){ n.anim+=dt; n.y=groundY(n.x); }
  for(const s of SPIRITS) s.anim+=dt;
  TANI.anim+=dt; PHRA.anim+=dt; CAT.anim+=dt;
  stepPrete(P,dt); stepHint(dt);
  if(c.i>=CER_LINES.length){
    c.rise+=dt; P.rise=Math.min(60,c.rise*10);
    if(c.rise>6.5){ c.flash+=dt;
      if(c.flash>1.5){ GS.q.done=true; GS.cos.halo=1; GS.seen.own_halo=true; P.rise=0; setTOD(1,true); GS.state='end'; GS.t2=0; saveGame(); } }
  }
  GS.camX=lerp(GS.camX,clamp(SHRINE_X-W/2+10,0,WORLD_W-W),1-Math.pow(0.02,dt));
  GS.camY=lerp(GS.camY,6,1-Math.pow(0.02,dt));
  clearPress();
}

let memI=0, memCh=0, IN=null, MEMFADE=0;
const SHELF_X=252;
function memScene(i){
  const S={ t:0, flash:0, shake:0, done:false, px:[], puffs:[], dust:[] };
  for(let k=0;k<26;k++) S.dust.push({x:rnd(0,W),y:rnd(0,H),sp:rnd(3,11),r:rnd(0.6,1.5),a:rnd(0.08,0.3)});
  const id=MEMS[i].id;
  if(id==='take')  Object.assign(S,{ mx:132, face:1, walk:0, noise:0, stir:0, took:0, reach:false, navx:null });
  if(id==='drink') Object.assign(S,{ sips:0, tilt:0, bottle:1, bell:0, past:0 });
  if(id==='scale') Object.assign(S,{ tug:0, tries:0, last:0, slam:0, soil:0, shut:0 });
  if(id==='bowl')  Object.assign(S,{ reach:0, tries:0, thru:0, fourth:0, cand:0 });
  return S;
}
function memSpark(S,x,y,n,col,sp=1){
  for(let i=0;i<n;i++) S.px.push({x,y,vx:rnd(-40,40)*sp,vy:rnd(-70,-10)*sp,g:150,l:rnd(0.35,1.1),c:col,r:rnd(0.7,1.6)});
}
/* remembering is not something you choose. it just starts. */
function startMem(i){
  if(!MEMS[i]) return;                       // a page that is not there is not a crash
  memI=i; memCh=0; IN=null; MEMFADE=1;
  GS.state='memory'; clearPress(); navStop();
  AU.wail && AU.wail();
}
function memReady(){
  // do not cut the guide off mid-sentence, but do not wait out the whole line
  if(GS.state!=='play' || DLG) return -1;
  if(storyBusy()) return -1;          // the past can wait until the field is in
  if(guideTalking()) return -1;
  for(let i=0;i<MEMS.length;i++){
    if(GS.mem[MEMS[i].id]) continue;
    if(MEMS[i].when && MEMS[i].when()) return i;
  }
  return -1;
}
function finishMem(){
  const m=MEMS[memI];
  GS.mem[m.id]=true; saveGame();
  IN=null; memCh=0; clearPress();
  GS.state='play'; GS.camX=clamp(P.x-W/2,0,WORLD_W-W); GS.camY=0;
  MEMFADE=1;
  GS.seen.newmem=true;
  toast('a page came back — it is in your ledger','#b9a8d8');
  guideSay(m.k||'', 7);
}
function stepMem(dt){
  if(!IN) IN=memScene(memI);
  const S=IN, sc=MEMS[memI];
  S.t+=dt;
  MEMFADE=Math.max(0,MEMFADE-dt*1.6);
  S.flash=Math.max(0,S.flash-dt*2.6); S.shake=Math.max(0,S.shake-dt*5.5);
  for(let i=S.px.length-1;i>=0;i--){ const q=S.px[i];
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt; q.l-=dt; if(q.l<=0) S.px.splice(i,1); }
  for(let i=S.puffs.length-1;i>=0;i--){ const q=S.puffs[i];
    q.y-=q.sp*dt; q.l-=dt; if(q.l<=0) S.puffs.splice(i,1); }
  for(const d of S.dust){ d.y-=d.sp*dt; d.x+=Math.sin((S.t+d.r)*0.7)*4*dt; if(d.y<-2){ d.y=H+2; d.x=rnd(0,W); } }
  if(press('back')){ AU.sel(); finishMem(); return; }

  if(!S.done){
    if(sc.id==='take'){
      /* creeping: moving makes noise, standing still lets it settle.
         a tap walks you along the room, or takes the coin once you can reach */
      let grab=false;
      if(PRESS.tap){ PRESS.tap=false; PRESS.act=false;
        if(S.reach && Math.abs(TAP.x-SHELF_X)<74) grab=true;
        else S.navx=clamp(TAP.x,58,SHELF_X-19);
      }
      let dir=(K.right?1:0)-(K.left?1:0);
      if(dir) S.navx=null;
      else if(S.navx!=null){ const d=S.navx-S.mx;
        if(Math.abs(d)<3) S.navx=null; else dir=d>0?1:-1; }
      if(dir){ S.mx=clamp(S.mx+dir*74*dt,52,SHELF_X-22); S.face=dir;
        S.walk+=dt*7.0; S.noise=Math.min(1.35,S.noise+dt*0.52);
        if(Math.sin(S.walk*2)>0.94) AU.step();
      } else S.noise=Math.max(0,S.noise-dt*0.4);
      if(S.noise>=1 && S.stir<=0){ S.stir=2.2; S.shake=0.5; AU.tick(); }
      if(S.stir>0) S.stir-=dt;
      S.reach = S.mx>SHELF_X-40;
      if(grab || (S.reach && press('act'))){
        S.took=0.001; S.flash=1; S.shake=1; AU.ding(); AU.spark();
        memSpark(S,SHELF_X,100,22,CL.goldL);
        S.done=true;
      }
    } else if(sc.id==='drink'){
      if(press('act')||press('tap')){
        S.sips++; S.bottle=Math.max(0,1-S.sips/3); S.tilt+=0.038; S.shake=0.35;
        AU.pour(); AU.blip();
        S.puffs.push({x:196+rnd(-14,14),y:120,sp:20,l:1.3,s:['ha','ha ha','heh'][S.sips%3]});
        if(S.sips>=3){ S.done=true; AU.gong(); }
      }
    } else if(sc.id==='scale'){
      /* the scale: alternate the two sides and it lifts a little, then sags right back */
      const l=press('left'), r=press('right');
      if(l||r){ const side=l?-1:1;
        if(side!==S.last){ S.tries++; S.tug=Math.min(1,S.tug+0.24); S.last=side; AU.tick(); }
        else S.tug=Math.min(1,S.tug+0.05);
        S.shake=Math.max(S.shake,0.22);
      }
      S.tug=Math.max(0,S.tug-dt*0.62);   // it always sags back. that is the point.
      if(S.t>1.8 && (S.tries>=8 || S.t>5.5)){
        S.done=true; S.slam=0.001; S.shake=1; AU.gong(); AU.drum();
        memSpark(S,240,150,26,'#8a7a5a',1.5);
      }
    } else {
      /* four bowls: you reach, and your hand goes through, three times */
      S.cand=Math.min(1,S.cand+dt*0.7);
      S.reach=Math.max(0,S.reach-dt*1.5);
      if(press('act')||press('tap')){
        S.tries++; S.reach=1; S.thru=1; AU.poof && AU.poof(); AU.blip();
        memSpark(S,150,150,8,'#cfc4ae',0.5);
        if(S.tries>=3){ S.done=true; AU.metta && AU.metta(); }
      }
      S.thru=Math.max(0,S.thru-dt*1.1);
    }
    return;
  }

  /* the beat after the verb — the scene plays itself out, then the line types */
  if(sc.id==='take')  S.took=Math.min(1,S.took+dt*2.6);
  if(sc.id==='drink'){ S.past=Math.min(1,S.past+dt*0.62); S.tilt=lerp(S.tilt,0.06,dt*2);
    if(S.past>0.3 && S.bell<0.01){ S.bell=0.001; AU.gong(); }
    if(S.bell>0) S.bell=Math.min(1,S.bell+dt*1.1); }
  if(sc.id==='scale'){ S.slam=Math.min(1,S.slam+dt*3.4);
    if(S.slam>0.5){ S.soil=Math.min(1,S.soil+dt*0.85);
      if(Math.random()<dt*26) S.px.push({x:rnd(120,360),y:-4,vx:rnd(-6,6),vy:rnd(24,60),g:40,l:rnd(1.4,2.6),c:'#3a2c22',r:rnd(0.8,1.8)}); }
    if(S.soil>0.7) S.shut=Math.min(1,S.shut+dt*1.1); }
  if(sc.id==='bowl'){ S.fourth=Math.min(1,S.fourth+dt*0.5);
    S.reach=Math.max(0,S.reach-dt*1.5); S.thru=Math.max(0,S.thru-dt*1.1); }

  memCh+=dt*82;
  const ready = sc.id==='scale'? S.shut>0.4 : sc.id==='bowl'? S.fourth>0.45 : S.t>0.35;
  if(ready && (press('act')||press('tap'))){
    AU.blip();
    if(memCh<sc.t.length){ memCh=sc.t.length; return; }
    finishMem();
  }
}

const PORTRAIT_CACHE = {};
function buildPortrait(key){
  const S2=48, c=mkCv(S2,S2), g=G2(c);
  const half=S2/2;
  // sky behind the face
  pVGrad(g,0,0,S2,S2,'#e6d0a2','#b9945f',5);
  for(let i=0;i<20;i++) pR(g,(i*13)%S2,(i*7)%S2,1,1,'rgba(255,250,232,0.30)');
  g.save();
  const place=(fn,scale,hx,hy)=>{ g.translate(half,half+4); g.scale(scale,scale); g.translate(-hx,-hy); fn(); };
  if(key==='you'||key==='prete'){
    const q=makePrete(); q.x=0; q.y=0; q.face=1; q.blink=3;
    for(let k=0;k<30;k++){ stepPrete(q,1/60); stepCloth(q.cloth,0,-44,12,1/60,0,0); }
    place(()=>drawPrete(g,q,{dt:1/60,cos:GS.cos||{skirt:"ash"}}), 2.0, 0, -84);
  } else if(key==='phra'){
    place(()=>drawPhraPhum(g,0,0,1.2), 2.1, 0, -19);
  } else if(key==='tani'){
    place(()=>drawTani(g,{x:0,y:0,face:1,anim:1.1},{}), 2.4, 0, -27);
  } else if(key==='posop'){
    place(()=>drawDeva(g,'posop',0,0,1.1,{s:1}), 2.0, 0, -18);
  } else if(SPIRIT_BY_ID[key]){
    const s=SPIRIT_BY_ID[key];
    const hy = key==='krasue'? 0 : key==='taihong'? -50 : key==='krahang'? -26 : -33;
    place(()=>GHOST_ART[s.art](g,{x:0,y:0,face:1,anim:1.3,hurtT:0,attackT:0,hop:0,h:46,friendly:1}), 2.4, 0, hy);
  } else {
    const n=NPCS.find(v=>v.id===key);
    if(n){ const m=makeVillager(Object.assign({},n,{x:0,y:0,vx:0,phase:0,face:1,cloth:makeCloth(4,9)}));
      for(let k=0;k<16;k++) stepCloth(m.cloth,0,-10,9,1/60,0,0);
      /* Framed on the head rather than on a number that used to work: the
         head centre is LEG + torso + neck above the feet, which is twenty-six
         and a half pixels up, and at three times that fills the medallion. */
      place(()=>drawVillager(g,m,{}), 2.2, 0, -26); }
  }
  g.restore();
  // circular mask + rim
  const g2=G2(mkCv(S2,S2));
  const out=mkCv(S2,S2), og=G2(out);
  og.save(); og.beginPath(); og.arc(half,half,half-2,0,TAU); og.clip(); og.drawImage(c,0,0); og.restore();
  for(let i=0;i<64;i++){ const a=i/64*TAU;
    pR(og,half+Math.cos(a)*(half-2),half+Math.sin(a)*(half-2),2,2,CL.edge);
    pR(og,half+Math.cos(a)*(half-3),half+Math.sin(a)*(half-3),1,1,CL.rim); }
  return out;
}
function portrait(key){
  if(!PORTRAIT_CACHE[key]){ try{ PORTRAIT_CACHE[key]=buildPortrait(key); }catch(e){ PORTRAIT_CACHE[key]=mkCv(48,48); } }
  return PORTRAIT_CACHE[key];
}

/* ============================================================
   THE ASCENSION — buy a skill, meet a god.
   ============================================================ */
let ASC=null;
const ASC_CLOUDS=[];
for(let i=0;i<20;i++) ASC_CLOUDS.push({x:Math.random(),y:Math.random(),w:rnd(46,120),h:rnd(20,42),sp:rnd(0.5,1.6),o:rnd(0.35,0.85)});
function startAscend(skillId){
  const s=SKILLS[skillId];
  ASC={ id:skillId, s, dev:DEVAS[s.br], phase:'lift', t:0, rise:0, drift:0,
        ch:0, fill:0, flash:0, beam:0, done:false, sparks:[] };
  GS.state='ascend';
  AU.gong(98,0,0.09); AU.metta();
}
function stepAscend(dt){
  const A=ASC; A.t+=dt;
  const hold = K.act || K.light || (TOUCH.on && TOUCH.pts.size>0);
  if(A.flash>0) A.flash-=dt;
  switch(A.phase){
    case 'lift':
      A.rise += (hold? 1.9 : 1)*dt;
      if(Math.random()<dt*22) A.sparks.push({x:rnd(-30,30),y:rnd(0,40),v:rnd(30,90),t:0});
      if(A.rise>1.7){ A.phase='climb'; A.t=0; AU.ranat(880,0,0.05); }
      break;
    case 'climb':{
      let dx=0; if(K.left)dx-=1; if(K.right)dx+=1;
      if(TOUCH.on&&TOUCH.aim.active) dx=clamp((TOUCH.aim.x-W/2)/60,-1,1);
      A.drift=clamp(A.drift+dx*dt*40,-52,52);
      A.speed = hold? 2.1 : 1.25;
      for(const c of ASC_CLOUDS){ c.y += c.sp*A.speed*dt*0.5; if(c.y>1.2){ c.y=-0.25; c.x=Math.random(); } }
      if(Math.random()<dt*30) A.sparks.push({x:rnd(-70,70),y:rnd(-10,H),v:rnd(60,150),t:0});
      if(A.t>3.4){ A.phase='arrive'; A.t=0; A.flash=0.7; AU.bigDing(); }
      break; }
    case 'arrive':
      if(A.t>1.5){ A.phase='speak'; A.t=0; A.ch=0; AU.ranat(1046,0,0.05); }
      break;
    case 'speak':
      A.ch+=dt*46;
      if((press('act')||press('tap'))){
        if(A.ch < A.dev.line.length) A.ch=A.dev.line.length;
        else { A.phase='bless'; A.t=0; AU.chant(); }
      }
      break;
    case 'bless':
      if(hold){ A.fill+=dt*0.75; A.beam=Math.min(1,A.beam+dt*3);
        if(Math.random()<dt*40) A.sparks.push({x:rnd(-14,14),y:rnd(-40,10),v:-rnd(40,110),t:0}); }
      else { A.fill=Math.max(0,A.fill-dt*0.35); A.beam=Math.max(0,A.beam-dt*2); }
      if(A.fill>=1 && !A.done){
        A.done=true; A.phase='granted'; A.t=0; A.flash=1;
        GS.skills[A.id]=1; GS.spent+=A.s.cost;
        AU.metta(); AU.bigDing();
        toast('learned '+A.s.n, PAL.jadeL);
        if(A.id==='metta'){ GS.seen.own_halo=true; toast('Halo unlocked',PAL.goldL); }
        GS.seen['blessed'+A.s.br]=true;
        saveGame();
      }
      break;
    case 'granted':
      if(A.t>2.2 && (press('act')||press('tap'))){ A.phase='descend'; A.t=0; }
      break;
    case 'descend':
      for(const c of ASC_CLOUDS){ c.y -= 2.4*dt; if(c.y<-0.25) c.y=1.2; }
      if(A.t>1.6){ ASC=null; GS.state='tree'; return; }
      break;
  }
  for(let i=A.sparks.length-1;i>=0;i--){ const s=A.sparks[i]; s.t+=dt; s.y-=s.v*dt;
    if(s.t>2.2||s.y<-40) A.sparks.splice(i,1); }
  clearPress();
}

      pR(g,W/2-126,ty,252,7,'#e8d3a0'); pR(g,W/2-126,ty,252,2,'#fff2cc');
      pR(g,W/2-126,ty+6,252,3,'#c2a266');
      // a rail of small gold chedis behind
      for(let i=0;i<7;i++){ const x=W/2-96+i*32;
        pEll(g,x,ty-2,9,4,'#e8d3a0');
        for(let k=0;k<6;k++){ const rr=lerp(6.5,1.6,k/5); pR(g,x-rr,ty-6-k*4,rr*2,4,k%2?'#f2c14e':'#c9992f'); }
        pTaper(g,x,ty-30,x,ty-37,2.4,1,'#ffe89a'); pEll(g,x,ty-31,1.6,2,'#fff2cc'); }
      pR(g,W/2-126,ty-3,252,2,'#c9992f'); pR(g,W/2-126,ty-5,252,1,'#ffe89a');
      g.globalAlpha=1;
    }
  }
  // the god
  if(ph==='arrive'||ph==='speak'||ph==='bless'||ph==='granted'){
    const dy = ph==='arrive'? lerp(-80,0,clamp(A.t/1.2,0,1)) : 0;
    drawDeva(g,A.dev.k, W/2, H*0.43+dy, GS.t);
  }
  // you, rising
  {
    const stand=H*0.80;
    const py = ph==='lift'? lerp(H+50, stand, up)
             : ph==='descend'? lerp(stand, H+60, clamp(A.t/1.6,0,1)) : stand;
    const q=P;
    const sv={x:q.x,y:q.y,vx:q.vx,face:q.face,state:q.state};
    q.x=W/2+A.drift; q.y=py; q.vx=0; q.face=1; q.state='idle';

    glow.addColorStop(0,'rgba(255,240,190,0.3)'); glow.addColorStop(1,'rgba(255,240,190,0)');

  if(ph==='bless'){

    const bw=150, bx=W/2-bw/2, by=H-40;

/* ---------------- HUD ---------------- */
function drawHUD(){
  if(chIs('climb')) return;            // nothing to count yet, and no room for it
  const g=ctx;
  /* a small merit plaque in the corner, and the basket on a toolbar along the
     bottom, the way a farming game does it. neither one covers the village. */
  const bw=80;
  const mtxt = GS.merit+'/'+GOAL;
  /* the bar starts after the widest the word can be in either language, so
     the label never sits against it */
  const bx0 = 11 + Math.max(txtW('merit',7), txtW(L('merit'),7)) + 6;
  const mw = bx0+bw+4+txtW(mtxt,7)+7;
  cloud(g,6,6,mw-6,18,{seed:1});
  pTxt(g,'merit',11,18,'#8f6a1e',7);
  pR(g,bx0,11,bw,7,'#c2ab84'); pR(g,bx0,11,bw,1,'#a8906a');
  const pr=clamp(GS.merit/GOAL,0,1);
  pR(g,bx0,11,bw*pr,7,meritFlash>0?'#fff0b0':PAL.gold);
  pR(g,bx0,11,bw*pr,1,'#fffdf6');
  for(let i=1;i<4;i++) pR(g,bx0+bw*i/4,11,1,7,'rgba(90,60,28,0.35)');
  pTxt(g,mtxt,bx0+bw+4,18,CL.ink,7);
  /* the purse: the other number, and the one the landlord counts */
  { const btxt=(GS.baht|0)+'฿', bwid=txtW(btxt,8)+20;
    cloud(g,mw+6,6,bwid,18,{seed:9,top:'#fff4d4',body:'#f0dca8',under:'#d4b878',edge:'#3b2412'});
    icoStar(g,mw+13,15,0.7,'#c9992f');
    pTxt(g,btxt,mw+bwid-1,18,'#7a5a18',8,'right');
    /* water is the one thing you can run out of halfway through a job, so it
       gets a plaque of its own rather than a slot in the basket */
    if(!DLG && farmActive()) drawWaterTag(g, mw+6+bwid+4, 6); }

  /* the toolbar: eight slots, always there, so you can see what you carry */
  const ids=DLG? [] : Object.keys(GS.bag).filter(k=>GS.bag[k]>0).slice(0,8);
  GS._bar = ids.length>0;
  if(ids.length){
    const SL=22, n=Math.max(4,ids.length), tw=n*SL+6, tx=R(W/2-tw/2), ty=H-SL-8;
    cloud(g,tx,ty,tw,SL+4,{seed:2});
    for(let i=0;i<n;i++){
      const sx=tx+3+i*SL, sy=ty+3;
      pR(g,sx,sy,SL-2,SL-2,'#b89a6e'); pR(g,sx+1,sy+1,SL-4,SL-4,'#e8d3a6');
      pR(g,sx+1,sy+1,SL-4,1,'#f6e7c6'); pR(g,sx+1,sy+SL-4,SL-4,1,'#c9ac80');
      const id=ids[i]; if(!id) continue;
      drawIcon(g,id,sx+(SL-2)/2,sy+9,0.66);
      pTxt(g,''+GS.bag[id],sx+SL-5,sy+SL-5,CL.ink,7,'right');
    }
  }

  /* the rice lesson takes the first row while it is running; the village's
     orders queue up underneath it */
  let row = 26;
  if(!DLG){ const rb = riceBanner(g, row); if(rb) row += rb + 2; }
  const task = reqLine();
  if(task && !DLG){
    const tw=txtW(task,7)+22;
    cloud(g,6,row,tw,16,{seed:3,body:'#f0e2b4'});
    icoStar(g,15,row+8,0.8,'#c9992f');
    pTxt(g,task,23,row+11,CL.ink,7);
    row += 18;
  }
  GS._hudRow = row;        // where the hint line may start

  if(!storyBusy()) drawDayHUD(g);
  const z=zoneAt(P.x);
  if(GS._zone!==z.id){ GS._zone=z.id; GS.zoneName=3.2; GS._zoneZ=z; }
  if(GS.zoneName>0){
    GS.zoneName-=1/60;
    const a=clamp(GS.zoneName,0,1)*clamp((3.2-GS.zoneName)*3,0,1);
    g.globalAlpha=a;
    pTxt(g,GS._zoneZ.name,W-10, storyBusy()? 19 : 50,'#ffe6b0',11,'right');
    g.globalAlpha=1;
  }
  /* what used to be a stack of banners across the middle of the screen is
     now a number drifting up out of the world where it was earned */
  drawFloats(g);
  /* one small icon over every thing in reach, so the one the prompt happens
     to be naming is not the only one you can use */
  drawSpots(g);
  if(PROMPT){
    const s=PROMPT.txt;
    const w2=txtW(s,7)+22;
    const x=PROMPT.x-GS.camX;
    /* he is a hundred pixels of prete: anything printed at a villager's height
       lands on his chest, so lift the prompt clear of his head when he is under it */
    const px=P.x-GS.camX;
    let y=PROMPT.y-GS.camY;
    if(Math.abs(x-px)<52) y=Math.min(y, P.y-GS.camY-152);   // clear of the icon row
    y=Math.max(y,76);
    /* a small wedge down at the thing it is about — but only when the wedge
       can actually reach it. Lifted clear of the prete's head the point had
       nothing to land on and hung in the air like a dropped icicle. */
    const tipY = PROMPT.y-GS.camY+10;
    if(tipY>y+3 && tipY<y+17)
      bubbleTail(g, clamp(x,x-w2/2+7,x+w2/2-7), y+1, x, tipY, CL.body, CL.edge);
    cloud(g,x-w2/2,y-13,w2,14,{seed:6});
    pTxt(g,s,x,y-3,CL.ink,7,'center');
    if(PROMPT.sub){
      const w3=txtW(PROMPT.sub,6)+18;
      cloud(g,x-w3/2,y+6,w3,12,{seed:8,top:'#eef7e6',body:'#dcecd0',under:'#c2d6b4',edge:'#96ab88'});
      pTxt(g,PROMPT.sub,x,y+14,'#3a4a30',6,'center'); }
  }
  /* the hint has to clear the toolbar, and it has to stop once you have
     plainly understood it — a permanent instruction is just clutter */
  if(!PROMPT && !DLG && !GS.q.gifts && !GS.seen.walked){
    g.globalAlpha=0.8;
    pTxt(g,'tap the ground to walk',W/2,GS._bar? H-36 : H-8,'#e8e0d0',6,'center');
    g.globalAlpha=1;
  }
}

/* ---------------- the ledger ---------------- */
function stepTree(dt){
  GS.seen.ledger=true;
  if(press('back')||press('tree')){ GS.state='play'; AU.sel(); clearPress(); return; }
  hitTap();                     // a tap lands on whatever was drawn there
  if(GS.state!=='tree') return; // ...which may have been the close button
  if(press('heavy')||press('whistle')||press('give')){ TREE.tab=(TREE.tab+1)%5; TREE.row=0; AU.sel(); }
  if(TREE.tab===0){
    const keys=Object.keys(SKILLS);
    const nb=BRANCHES.length;
    if(press('left')){ TREE.col=(TREE.col+nb-1)%nb; AU.blip(); }
    if(press('right')){ TREE.col=(TREE.col+1)%nb; AU.blip(); }
    const col=keys.filter(k=>SKILLS[k].br===TREE.col);
    if(press('up')) { TREE.row=clamp(TREE.row-1,0,col.length-1); AU.blip(); }
    if(press('down')){ TREE.row=clamp(TREE.row+1,0,col.length-1); AU.blip(); }
    TREE.row=clamp(TREE.row,0,col.length-1);
    if(press('act')){
      const id=col[TREE.row], s=SKILLS[id];
      if(GS.skills[id]) AU.blip();
      else if(s.need && !GS.skills[s.need]){ toast('learn '+SKILLS[s.need].n+' first','#a8392c'); AU.blip(); }
      else if(avail()<s.cost){ toast('you need '+(s.cost-avail())+' more merit','#a8392c'); AU.blip(); }
      else { startAscend(id); clearPress(); return; }   // up you go
    }
  } else if(TREE.tab===1){
    const ids=Object.keys(COSMETICS).filter(c=>!COSMETICS[c].locked || GS.seen['own_'+c]);
    if(press('left')) { TREE.row=(TREE.row+ids.length-1)%ids.length; AU.blip(); }
    if(press('right')){ TREE.row=(TREE.row+1)%ids.length; AU.blip(); }
    if(press('up')||press('down')){ TREE.row=clamp(TREE.row+(K.up?-4:4),0,ids.length-1); AU.blip(); }
    TREE.row=clamp(TREE.row,0,ids.length-1);
    if(press('act')){
      const id=ids[TREE.row], c=COSMETICS[id], owned=GS.seen['own_'+id]||c.cost===0;
      if(owned){ GS.cos[c.slot]= c.slot==='skirt'? c.v : (GS.cos[c.slot]?0:c.v); AU.sel(); saveGame(); }
      else if(avail()>=c.cost){ GS.spent+=c.cost; GS.seen['own_'+id]=true; GS.cos[c.slot]=c.v; AU.unlock(); toast('got '+c.n,PAL.jadeL); saveGame(); }
      else { toast('not enough merit','#a8392c'); AU.blip(); }
    }
  } else if(TREE.tab===2){
    const list=GIFTEES();
    if(press('up')||press('left'))  { TREE.row=(TREE.row+list.length-1)%list.length; AU.blip(); }
    if(press('down')||press('right')){ TREE.row=(TREE.row+1)%list.length; AU.blip(); }
  }
  clearPress();
}

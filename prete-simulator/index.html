    pR(g,14,y,W-28,34, on?'#f4e8c4':'rgba(18,16,30,0.6)');
    pR(g,14,y,W-28,1, on?'#fff8e0':'rgba(255,255,255,0.12)');
    pR(g,14,y+33,W-28,1, on?'#c9b98a':'rgba(0,0,0,0.34)');
    if(on) pR(g,14,y,2,34,'#c9992f');
    // a torn page, or a blank one
    const px=34, py=y+17;
    pR(g,px-6,py-10,12,19, on?'#fdf7e4':'#2a2640');
    pR(g,px-6,py-10,12,1, on?'#c9b98a':'#3a3550');
    if(on){ for(let k=0;k<4;k++) pR(g,px-4,py-6+k*4,8,1,'#b8a880'); }
    else pTxt(g,'?',px,py+3,'#5a5468',8,'center');
    pTxt(g, on? m.title : '- - -', 50, y+15, on?'#8f6a1e':'#5a5468', 9);
    const line = on? m.j : 'not yet';
    for(const l of wrap(g,line,W-96,7).slice(0,1)) pTxt(g,l,50,y+27,on?CL.ink2:'#4a4458',7);
    if(on) pTxt(g,''+(i+1),W-24,y+21,'#b09a62',8,'right');
  });
  pTxt(g,got+' '+L('of')+' '+MEMS.length+' '+L('pages'),W/2,H-6,'#cfc4ae',6,'center');
}

/* ============================================================
   THE CLOCK

   The game used to be permanently two in the morning. It is a
   story about a night that ends now, so there has to be a
   morning to end it into.

   One number does all of it: TOD.v, nought at the blackest part
   of the night and one at full morning. The sky, the lamps, the
   colour of the air, what the light does to the ground and even
   what the crickets are doing all read off it. Nothing else in
   the game needs to know what time it is.

   GS.dawn is kept in step with it, because half the older code
   asks that question and there is no reason to make it ask a
   new one.
   ============================================================ */
const TOD = { v:0, to:0, rate:0.5, held:false };
function setTOD(v, instant){
  TOD.to = clamp(v,0,1);
  if(instant) TOD.v = TOD.to;
  GS.dawn = TOD.v;
}
function stepTOD(dt){
  const d = TOD.to - TOD.v;
  if(Math.abs(d) > 0.0008) TOD.v += clamp(d, -TOD.rate*dt, TOD.rate*dt);
  else TOD.v = TOD.to;
  GS.dawn = TOD.v;
}
const isNight = ()=> TOD.v < 0.34;
const isDay   = ()=> TOD.v > 0.70;
/* the hour, in the only form the game ever shows it: a word */
function todWord(){
  const v=TOD.v;
  return v<0.16? 'deep night' : v<0.36? 'small hours' : v<0.56? 'first light'
       : v<0.74? 'sunrise'    : v<0.9 ? 'early morning' : 'morning';
}

/* ---------- the sky, keyframed ---------- */
/* Four bands from the top of the screen down, plus how much sun, moon and
   star there is. Everything between two keys is straight interpolation, so
   the sky can be parked anywhere and still looks like a sky. */
const SKY_KEYS = [
  {v:0.00, c:['#070a1e','#111836','#1d264e','#2c3864'], sun:0,    moon:1,    star:1   },
  {v:0.34, c:['#13163a','#2b2450','#573a60','#82505e'], sun:0,    moon:0.85, star:0.62},
  {v:0.54, c:['#262a5e','#6a3c64','#c66c54','#eea766'], sun:0.22, moon:0.32, star:0.12},
  {v:0.72, c:['#3d61a0','#7c80ac','#dfa87c','#f7daa6'], sun:0.62, moon:0,    star:0   },
  {v:1.00, c:['#2d6ec2','#5d9ad6','#a4cae8','#e6efdf'], sun:1,    moon:0,    star:0   },
];
function skyNow(){
  const v=TOD.v;
  let a=SKY_KEYS[0], b=SKY_KEYS[SKY_KEYS.length-1];
  for(let i=0;i<SKY_KEYS.length-1;i++){
    if(v>=SKY_KEYS[i].v && v<=SKY_KEYS[i+1].v){ a=SKY_KEYS[i]; b=SKY_KEYS[i+1]; break; }
  }
  const t = b.v===a.v? 0 : (v-a.v)/(b.v-a.v);
  return { c:[0,1,2,3].map(i=>mix(a.c[i],b.c[i],t)),
           sun:lerp(a.sun,b.sun,t), moon:lerp(a.moon,b.moon,t), star:lerp(a.star,b.star,t) };
}
/* how much the far distance is eaten by daylight haze */
const hazeAmt = ()=> clamp((TOD.v-0.44)/0.5,0,1);
/* the colour distance fades into. Straight c[3] is the pale warm band right
   on the horizon, which turned the far ridge the colour of dust; a little of
   the blue above it keeps the hills reading as hills a long way off. */
function hazeColour(){ const s=skyNow(); return mix(s.c[3], s.c[2], 0.45); }

function drawSky(g){
  const S = skyNow();
  pVGrad(g,0,0,W,76,S.c[0],S.c[1],8);
  pVGrad(g,0,76,W,66,S.c[1],S.c[2],8);
  pVGrad(g,0,142,W,H-142,S.c[2],S.c[3],7);

  if(S.star>0.02){
    for(const s of STARS){
      const tw=0.45+0.55*Math.sin(GS.t*1.4+s[2]);
      const x=(s[0]*W - GS.camX*0.03 + W*4)%W;
      g.fillStyle=`rgba(255,246,224,${0.75*tw*S.star*(0.35+s[3]*0.65)})`;
      g.fillRect(R(x),R(s[1]*H),1,1);
      if(s[3]>0.93 && tw>0.8){ g.fillRect(R(x-1),R(s[1]*H),1,1); g.fillRect(R(x+1),R(s[1]*H),1,1); }
    }
  }
  /* the moon goes down in the west as the sun comes up in the east, which is
     the one piece of astronomy this game is prepared to commit to */
  if(S.moon>0.02){
    const mx=(W*0.30 - GS.camX*0.02), my=30+ (1-S.moon)*54;
    g.globalAlpha=S.moon;
    for(let i=3;i>0;i--){
      const gl=g.createRadialGradient(mx,my,10,mx,my,20+i*18);
      gl.addColorStop(0,`rgba(246,240,220,${0.08*i})`); gl.addColorStop(1,'rgba(246,240,220,0)');
      g.fillStyle=gl; g.fillRect(mx-70,my-70,140,140);
    }
    pCirc(g,mx,my,16,mix(PAL.moon,'#ffd9a8',1-S.moon));
    pCirc(g,mx-5,my-5,4,PAL.moonD); pCirc(g,mx+6,my+5,3,PAL.moonD);
    pCirc(g,mx+3,my-8,2,PAL.moonD); pCirc(g,mx-8,my+6,2,PAL.moonD);
    g.globalAlpha=1;
  }
  if(S.sun>0.01){
    const rise=clamp((TOD.v-0.46)/0.54,0,1);
    const sx=(W*0.80 - GS.camX*0.015), sy=lerp(168,26,rise);
    const col=mix('#ff9a4a','#fff3c8',rise);
    g.globalAlpha=clamp(S.sun,0,1);
    for(let i=4;i>0;i--){
      const gl=g.createRadialGradient(sx,sy,6,sx,sy,16+i*22);
      gl.addColorStop(0,`rgba(255,214,140,${0.09*i})`); gl.addColorStop(1,'rgba(255,214,140,0)');
      g.fillStyle=gl; g.fillRect(sx-100,sy-100,200,200);
    }
    pCirc(g,sx,sy,lerp(15,11,rise),col);
    pCirc(g,sx,sy,lerp(11,8,rise),'#fffbe8');
    g.globalAlpha=1;
  }
  for(const c of CLOUDS){
    const x=((c.x*W*1.5 + GS.t*c.sp*3 - GS.camX*0.05)%(W*1.6))-W*0.3;
    /* at night they are a hole in the stars; at dawn they catch the fire; by
       morning they are just clouds */
    const lit = TOD.v<0.5? TOD.v*2 : 1;
    const base = TOD.v<0.6 ? mix('#3f4a80','#ffb98a',lit) : mix('#ffb98a','#f4f7fb',(TOD.v-0.6)/0.4);
    g.globalAlpha=c.o*(1+TOD.v*2.4);
    pEll(g,x,c.y*H,c.w/2,c.h/2, base);
    pEll(g,x+c.w*0.24,c.y*H-c.h*0.22,c.w/3,c.h/2.3, shade(base,0.10));
    pEll(g,x-c.w*0.2,c.y*H+c.h*0.1,c.w/4,c.h/2.8, shade(base,-0.10));
    g.globalAlpha=1;
  }
}

/* ---------- light on the ground ---------- */
/* The play layer is painted once, for a village at two in the morning. In
   daylight the darkness overlay comes off and a warm wash goes on instead,
   which is cheaper than keeping a second copy of a 5600-pixel canvas and
   reads, at this size, as morning. */
function drawLighting(g,cx,cy){
  const night=1-TOD.v;
  lightG.globalCompositeOperation='source-over';
  lightG.clearRect(0,0,W,H);
  lightG.fillStyle=`rgba(12,14,44,${0.03+0.51*night*night})`;
  lightG.fillRect(0,0,W,H);
  lightG.globalCompositeOperation='destination-out';
  const punch=(x,y,r,a)=>{
    const sx=x-cx, sy=y-cy;
    if(sx<-r||sx>W+r||sy<-r||sy>H+r) return;
    const q=Math.max(2,Math.round(r/2)*2);
    lightG.globalAlpha=clamp(a,0,1);
    lightG.drawImage(punchSprite(q), R(sx-q), R(sy-q));
    lightG.globalAlpha=1;
  };
  if(night>0.06){
    for(const l of LIGHTS){ if(!l.on) continue;
      const fl=l.flick?1-Math.random()*l.flick:1; punch(l.x,l.y,l.r*fl,l.a*night); }
    const broken=LIGHTS.find(l=>l.broken);
    if(broken && !broken.on && Math.random()<0.05) punch(broken.x,broken.y,26,0.35*night);
    punch(P.x,P.y-42, GS.cos.halo?58:44, 0.42*night);
    for(const p of PT) if(p.k==='orb'&&p.t>=0) punch(p.x,p.y,10,0.55*night);
    for(const s of SPIRITS) punch(s.x, s.y-24, s.id==='krasue'?34:26, 0.34*night);
    punch(TANI.x,TANI.y-18,34,0.4*night);
    punch(KITCHEN_X-10, groundY(KITCHEN_X)-38, 40, 0.5*night);
  }
  g.drawImage(lightCv,0,0);
  const day=TOD.v;
  if(day>0.04){
    /* Morning lifts the black end of a night palette and puts a warm cast on
       it. That was two full-screen fills; at the device scale this canvas
       runs at, one is worth about three frames a second. */
    g.globalCompositeOperation='lighter';
    /* and while this pass is already running: more of it at the top of the
       frame than the bottom, which is where the sun is. Grading for free. */
    const gA=g.createLinearGradient(0,0,0,H);
    gA.addColorStop(0,`rgba(150,134,88,${(0.21*day).toFixed(3)})`);
    gA.addColorStop(0.62,`rgba(126,114,78,${(0.18*day).toFixed(3)})`);
    gA.addColorStop(1,`rgba(104,100,86,${(0.14*day).toFixed(3)})`);
    g.fillStyle=gA;
    g.fillRect(0,0,W,H);
    g.globalCompositeOperation='source-over';
  }
}
function drawGlows(g){
  g.globalCompositeOperation='lighter';
  const night=1-TOD.v;
  if(night>0.05){
    for(const l of LIGHTS){
      if(!l.on) continue;
      if(l.x-GS.camX<-90||l.x-GS.camX>W+90) continue;
      const fl=l.flick?1-Math.random()*l.flick:1;
      drawGlow(g,l.x,l.y,l.r*0.85*fl,l.c,(0.15*night+0.03)*night);
    }
    for(const f of FIREFLIES){
      if(f.x-GS.camX<-20||f.x-GS.camX>W+20) continue;
      const bl=0.5+0.5*Math.sin(f.t*2.2);
      if(bl<0.3) continue;
      drawGlow(g,f.x,f.y,9,'#c6ff9a',0.22*bl*night);
    }
  }
  g.globalCompositeOperation='source-over';
}

/* ---------- the night noise, and the morning one ---------- */
/* Crickets and frogs belong to the dark. Birds belong to the light. The
   ranat drifts across both because somebody in this village is always
   practising. */
AU.nextBird = 1.5;
AU.bird = function(){
  const f=rnd(1800,2600);
  this.tone(f,0.06,'sine',0.016,f*1.5);
  this.tone(f*1.4,0.05,'sine',0.010,f*0.9,0.07);
  if(Math.random()<0.5) this.tone(f*1.2,0.05,'sine',0.011,f*1.6,0.15);
};
AU.rooster = function(){
  this.tone(620,0.18,'sawtooth',0.020,780);
  this.tone(700,0.34,'sawtooth',0.018,520,0.18);
  this.tone(520,0.30,'sawtooth',0.012,380,0.5);
};
AU.bark = function(far){
  const p = far?0.020:0.05;
  this.tone(far?230:300,0.09,'square',p,far?150:190);
  this.noise(0.07,p*0.7,far?200:120,far?1600:2600);
};
AU.tick = function(dt){
  if(!this.ctx||this.muted) return;
  const night = 1-(typeof TOD!=='undefined'? TOD.v : 0);
  if(night>0.3){
    if((this.nextCricket-=dt)<=0){
      const f=rnd(4000,4800);
      for(let i=0;i<3;i++) this.tone(f,0.05,'triangle',0.008*night,null,i*0.085);
      this.nextCricket = rnd(0.8,2.4);
    }
    if((this.nextFrog-=dt)<=0){ this.tone(rnd(150,230),0.16,'sawtooth',0.012*night,null,0); this.nextFrog=rnd(4,11); }
  }
  if(night<0.8){
    if((this.nextBird-=dt)<=0){ this.bird(); this.nextBird = rnd(1.4,4.2)/(1.05-night); }
  }
  if((this.nextPluck-=dt)<=0){
    const sc=[220,261.6,293.7,349.2,392,440,523.3];
    this.ranat(pick(sc),0,0.028);
    if(Math.random()<0.3) this.ranat(pick(sc),0.28,0.018);
    this.nextPluck = rnd(4,9);
  }
};
/* ============================================================
   THINGS THAT LIVE HERE

   A village at night is not empty and a village in the morning
   is extremely not empty. This is the layer of the game that
   nothing depends on and everything is better for: grass that
   lies down when you walk through it, birds that will not stay
   on a wire while a nine-foot ghost goes past, frogs at the
   pond, chickens under the house, a gecko on a wall, and dogs
   that have opinions about you at two in the morning.

   Everything in here is cheap on purpose. Grass is blitted from
   a handful of baked tufts rather than drawn blade by blade,
   and every list is bucketed by where it stands so that a frame
   only ever touches the couple of dozen things on screen.
   ============================================================ */

/* ---------- baked tufts ----------
   The cache key has to have FEWER possible values than the cache has slots,
   or it is not a cache, it is a bakery. Height rounds to one of five, the
   bend to one of seven, and 5*7*3*4 = 420 tufts fit comfortably under the
   cap. Keyed on the raw height and a thirteen-step bend it was 2184
   combinations against 240 slots, and the working set — every blade of
   grass on screen, bending continuously — missed nearly every frame. */
const _gSpr = new Map();
const GRASS_C = ['#4a8259','#3f7550','#568c5c','#6b9a55'];
const G_BEND = 3;                      // buckets either side of upright
const gq = h => clamp(Math.round(h/3)*3, 6, 18);
function grassSprite(kind, h, bendI, cI){
  const key = kind+'|'+h+'|'+bendI+'|'+cI;
  let c=_gSpr.get(key);
  if(c) return c;
  const bend=(bendI-G_BEND)/G_BEND;          // -1 .. 1
  const w=Math.max(6, 10+Math.abs(bend)*h), cx=w/2;
  c=mkCv(w, h+3);
  const g=G2(c), base=GRASS_C[cI];
  const blades = kind===0? 3 : kind===1? 4 : 5;
  for(let i=0;i<blades;i++){
    const t=(i/(blades-1||1)-0.5);
    const bh=h*(0.62+0.38*Math.cos(t*2.1));
    const tipx = cx + t*3.4 + bend*bh*0.85;
    const col = i%2? shade(base,-0.13) : base;
    pTaper(g, cx+t*2.6, h+2, tipx, h+2-bh, 1.7, 0.7, col);
  }
  if(kind===2){   // one with a seed head on it
    const tipx=cx+bend*h*0.9;
    pEll(g, tipx, h+2-h*0.98, 1.4, 2.6, '#c8bb7a');
  }
  _gSpr.set(key,c);
  if(_gSpr.size>520) _gSpr.delete(_gSpr.keys().next().value);
  return c;
}

/* ---------- the grass itself ---------- */
const GRASS=[], GBUCK=[], GBW=192;
function gbucket(x){ return GBUCK[(x/GBW)|0] || (GBUCK[(x/GBW)|0]=[]); }
function seedGrass(){
  GRASS.length=0; GBUCK.length=0;
  const r=mulberry(70707);
  for(let x=24; x<WORLD_W-24; x+= 4+r()*9){
    const z=zoneAt(x);
    if(isRoad(x) && r()<0.88) continue;
    if(x>780 && x<1460 && Math.sin(x*0.021)>-0.25 && r()<0.8) continue;   // standing water
    if(x>BED_XS[0]-24 && x<BED_XS[BED_XS.length-1]+24) continue;          // the beds are bare
    const lush = z.id==='forest'||z.id==='grove'? 1 : z.id==='charnel'? 0.45 : 0.8;
    if(r()>lush) continue;
    const t={ x:R(x), h:gq(5+r()*(z.id==='forest'||z.id==='deep'?13:9)), k:(r()*3)|0,
              c:z.id==='charnel'? 0 : (r()*4)|0, ph:r()*TAU, b:0, bv:0 };
    if(z.id==='charnel') t.c=0;
    GRASS.push(t); gbucket(x).push(t);
  }
}
/* push whatever is standing in a stretch of grass over, and see what comes
   out of it */
function brushGrass(x, r, force){
  const i0=((x-r)/GBW)|0, i1=((x+r)/GBW)|0;
  for(let i=i0;i<=i1;i++){
    const b=GBUCK[i]; if(!b) continue;
    for(const t of b){
      const d=t.x-x;
      if(Math.abs(d)>r) continue;
      const k=(1-Math.abs(d)/r);
      t.bv += sign(d||1)*k*(force||5.5);
      if(t.h>9 && Math.random()<0.0025*k) flush(t.x, groundY(t.x)-t.h);
    }
  }
}
/* something was sitting in that grass */
function flush(x,y){
  if(isNight()){ if(Math.random()<0.5) spawnFly('firefly',x,y); return; }
  const k=Math.random();
  if(k<0.42) spawnFly('butterfly',x,y);
  else if(k<0.72) spawnFly('dragonfly',x,y);
  else if(k<0.9){ CRIT.push({k:'hopper',x,y,vx:rnd(-40,40),vy:-rnd(60,110),t:0}); AU.tone(2200,0.03,'square',0.008); }
  else scatterBirds(x,40);
}

/* ---------- small flying things ---------- */
const FLY=[];
function spawnFly(kind,x,y){
  if(FLY.length>60) return;
  FLY.push({k:kind,x,y,hx:x,hy:y,t:rnd(TAU),sp:rnd(0.7,1.5),life:rnd(14,40),
            ph:rnd(TAU), r:rnd(10,30), up:rnd(-6,-22)});
}
function seedFlies(){
  FLY.length=0;
  const r=mulberry(313);
  for(let i=0;i<44;i++){
    const x=200+r()*(WORLD_W-400), y=groundY(x)-8-r()*26;
    spawnFly(r()<0.5?'butterfly':'dragonfly', x, y);
    FLY[FLY.length-1].life=1e9;
  }
}

/* ---------- birds ---------- */
/* Perched ones sit on wires, fences, roof ridges and branches. They watch
   you coming and they do not like it. */
const BIRDS=[];
function addBird(x,y,o){
  BIRDS.push(Object.assign({x,y,hx:x,hy:y,st:'perch',vx:0,vy:0,t:rnd(TAU),
    face:Math.random()<0.5?-1:1, kind:(Math.random()*3)|0, hop:0, back:0},o||{}));
}
function scatterBirds(x, r){
  let n=0;
  for(const b of BIRDS){
    if(b.st!=='perch') continue;
    if(Math.abs(b.x-x)>r) continue;
    b.st='fly'; b.vx=sign(b.x-x||1)*rnd(38,72); b.vy=-rnd(52,96); b.back=rnd(3.5,9); n++;
  }
  if(n) AU.noise(0.16,0.018,900,4200);
  return n;
}
function stepBirds(dt){
  const day=TOD.v;
  for(const b of BIRDS){
    b.t+=dt;
    if(b.st==='perch'){
      b.hop=Math.max(0,b.hop-dt);
      if(Math.random()<dt*0.35){ b.face=-b.face; }
      if(Math.random()<dt*0.25*(0.3+day)){ b.hop=0.22; b.x+=rnd(-3,3); }
      if(Math.abs(b.x-P.x)<44 && Math.abs(b.y-P.y)<70 && Math.random()<dt*4){
        b.st='fly'; b.vx=sign(b.x-P.x||1)*rnd(40,80); b.vy=-rnd(60,100); b.back=rnd(4,10);
        AU.noise(0.12,0.014,1000,4600);
      }
    } else if(b.back>0){
      /* up and away, in a panic, for a few seconds */
      b.back-=dt;
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      b.vy += 26*dt + Math.sin(b.t*7)*40*dt;
      b.vx *= Math.pow(0.55,dt);
      b.face=sign(b.vx||b.face);
      if(b.y < 26){ b.y=26; b.vy=Math.abs(b.vy)*0.3; }
    } else {
      /* then home. The velocity has to be let go of first: leaving gravity
         running underneath the homing made the bird fall past its own perch
         for ever, which is funny exactly once. */
      b.vx=0; b.vy=0;
      b.x=lerp(b.x,b.hx,1-Math.pow(0.05,dt));
      b.y=lerp(b.y,b.hy,1-Math.pow(0.05,dt));
      b.face=sign(b.hx-b.x||b.face);
      if(dist(b.x,b.y,b.hx,b.hy)<2.5){ b.st='perch'; b.x=b.hx+rnd(-5,5); b.y=b.hy; }
    }
  }
}

/* ---------- ground critters ---------- */
const CRIT=[];
function seedCritters(){
  CRIT.length=0; BIRDS.length=0;
  /* chickens keep to the houses they are fed at */
  for(const x of [FARMHOUSE_X+30, FARMHOUSE_X+52, 1596, 1626, 1808, 2178, 2740])
    CRIT.push({k:'hen',x:x,y:groundY(x),hx:x,vx:0,t:rnd(TAU),face:1,st:'peck',tt:rnd(1,4),
               c:pick(['#c8c2b4','#8a6a4a','#3a3630','#d8b46a'])});
  /* frogs at the pond and out in the flooded paddy */
  for(const x of [POND_X-40,POND_X-12,POND_X+22,POND_X+54, 1240, 1302])
    CRIT.push({k:'frog',x:x,y:groundY(x)+3,hx:x,vx:0,vy:0,t:rnd(TAU),face:1,tt:rnd(1,5)});
  /* dogs: one asleep at the shop, two in the village who will take an
     interest in a nine-foot stranger at two in the morning */
  for(const [x,name] of [[1700,'dog1'],[2280,'dog2'],[2905,'dog3']])
    CRIT.push({k:'dog',x:x,y:groundY(x),hx:x,vx:0,t:rnd(TAU),face:-1,st:'sleep',
               bark:0,barks:0,tt:rnd(2,7),id:name});
  /* geckos live on walls and are mostly a noise */
  for(const x of [1566,1796,2166,2726,FARMHOUSE_X+8])
    CRIT.push({k:'gecko',x:x,y:groundY(x)-34,hx:x,t:rnd(TAU),face:1,tt:rnd(3,9),run:0});
  /* squirrels in the grove */
  for(const x of [3180,3320,3480,4720,4980])
    CRIT.push({k:'squirrel',x:x,y:groundY(x)-2,hx:x,vx:0,t:rnd(TAU),face:1,tt:rnd(2,6),st:'sit'});

  /* birds: on the wires over the road, along the fences, and up the trees */
  for(let i=0;i<LAMP_XS.length-1;i++){
    const x0=LAMP_XS[i], x1=LAMP_XS[i+1];
    for(let k=0;k<3;k++){
      const f=(k+1)/4, x=lerp(x0,x1,f);
      const sag=Math.sin(f*Math.PI)*10;
      addBird(x, groundY(x)-112+sag);
    }
  }
  for(const x of [1982,2046,2110,2902,2966]) addBird(x+rnd(-6,6), groundY(x)-16);
  for(const x of [640,760,1180,1470,2560,3160,3900,4480,5020,5600,6100,6600])
    addBird(x+rnd(-20,20), groundY(x)-rnd(46,86));
  for(const b of BIRDS){ b.hx=b.x; b.hy=b.y; }
}
function stepCrit(dt){
  const night = isNight();
  for(const c of CRIT){
    c.t+=dt; c.tt-=dt;
    const far = Math.abs(c.x-GS.camX-W/2) > W;
    if(c.k==='hen'){
      if(far){ continue; }
      if(night){ c.st='roost'; c.vx=0; }
      else if(c.tt<=0){
        c.tt=rnd(1.2,4);
        c.st = Math.random()<0.45? 'walk':'peck';
        if(c.st==='walk'){ c.face = (c.hx+rnd(-34,34))>c.x?1:-1; }
      }
      if(Math.abs(P.x-c.x)<30 && !night){ c.st='run'; c.face=sign(c.x-P.x||1); c.tt=rnd(0.5,1.1);
        if(Math.random()<dt*2) AU.tone(rnd(700,900),0.07,'square',0.012,rnd(400,600)); }
      const sp = c.st==='run'? 52 : c.st==='walk'? 15 : 0;
      c.x += c.face*sp*dt;
      if(Math.abs(c.x-c.hx)>60) c.face=sign(c.hx-c.x);
      c.y=groundY(c.x);
      if(sp>20 && Math.random()<dt*8) brushGrass(c.x,10,2);
    }
    else if(c.k==='frog'){
      if(far) continue;
      c.y += c.vy*dt; c.vy += 520*dt;
      const gy=groundY(c.x)+3;
      if(c.y>gy){ c.y=gy; c.vy=0; c.vx=0; }
      c.x += c.vx*dt;
      if(c.tt<=0 && c.y>=gy){
        c.tt=rnd(2,7);
        if(Math.abs(P.x-c.x)<70 || Math.random()<0.4){
          c.face = Math.abs(P.x-c.x)<70 ? sign(c.x-P.x||1) : (Math.random()<0.5?-1:1);
          c.vx=c.face*rnd(30,62); c.vy=-rnd(70,120);
          if(night) AU.tone(rnd(150,210),0.13,'sawtooth',0.011);
        }
      }
      if(Math.abs(c.x-c.hx)>70) c.x=lerp(c.x,c.hx,1-Math.pow(0.3,dt));
    }
    else if(c.k==='dog'){
      c.bark=Math.max(0,c.bark-dt);
      const seen = Math.abs(P.x-c.x)<120;
      if(seen && c.tt<=0){
        c.st='bark'; c.bark=0.32; c.barks++; c.tt=rnd(0.45,1.1);
        c.face=sign(P.x-c.x||1);
        AU.bark(false);
        /* the others answer, the way they do */
        for(const o of CRIT) if(o!==c && o.k==='dog' && Math.random()<0.6){ o.st='bark'; o.tt=rnd(0.8,1.8); }
        if(Math.random()<0.4) AU.bark(true);
      } else if(!seen && c.tt<=0){
        c.st = night? 'sit' : (Math.random()<0.5?'sleep':'sit'); c.tt=rnd(3,9); c.barks=0;
      }
      c.y=groundY(c.x);
    }
    else if(c.k==='gecko'){
      c.run=Math.max(0,c.run-dt);
      if(c.tt<=0){ c.tt=rnd(4,11);
        if(night && Math.random()<0.5){
          /* ตุ๊กแก. It says its own name, seven times, at the worst moment */
          for(let i=0;i<3;i++){ AU.tone(520,0.1,'square',0.014,300,i*0.42); AU.noise(0.05,0.01,400,2000,i*0.42+0.02); }
        }
        c.run=rnd(0.4,0.9); c.face=Math.random()<0.5?-1:1;
      }
      if(c.run>0) c.x += c.face*34*dt;
      if(Math.abs(c.x-c.hx)>22) c.face=sign(c.hx-c.x);
    }
    else if(c.k==='squirrel'){
      if(far) continue;
      if(c.tt<=0){ c.tt=rnd(1.5,5); c.st=pick(['sit','run','sit','eat']); c.face=Math.random()<0.5?-1:1; }
      if(Math.abs(P.x-c.x)<50){ c.st='run'; c.face=sign(c.x-P.x||1); }
      if(c.st==='run'){ c.x+=c.face*74*dt; if(Math.abs(c.x-c.hx)>90) c.face=sign(c.hx-c.x); }
      c.y=groundY(c.x)-2;
    }
    else if(c.k==='hopper'){
      c.t+=dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.vy+=460*dt;
      if(c.y>groundY(c.x)){ c.y=groundY(c.x); c.vy=0; c.vx=0; }
    }
  }
  for(let i=CRIT.length-1;i>=0;i--) if(CRIT[i].k==='hopper' && CRIT[i].t>3) CRIT.splice(i,1);
}

function stepCritters(dt){
  /* grass springs back, and leans on the wind */
  const wind=GS.wind;
  const i0=Math.max(0,((GS.camX-40)/GBW)|0), i1=((GS.camX+W+40)/GBW)|0;
  for(let i=i0;i<=i1;i++){
    const b=GBUCK[i]; if(!b) continue;
    for(const t of b){
      const rest = wind*0.22 + Math.sin(GS.t*1.7+t.ph)*0.05;
      t.bv += (rest-t.b)*26*dt;
      t.bv *= Math.pow(0.02,dt);
      t.b = clamp(t.b + t.bv*dt, -1, 1);
    }
  }
  if(Math.abs(P.vx)>14) brushGrass(P.x, 20, 3.4);
  stepBirds(dt);
  stepCrit(dt);
  for(let i=FLY.length-1;i>=0;i--){
    const f=FLY[i];
    f.t+=dt*f.sp; f.life-=dt;
    if(f.k==='butterfly'){
      f.x = f.hx + Math.sin(f.t*0.7)*f.r + Math.sin(f.t*1.9)*4;
      f.y = f.hy + Math.sin(f.t*2.3)*5 + Math.cos(f.t*0.5)*7 + f.up*0.2;
    } else if(f.k==='dragonfly'){
      f.x = f.hx + Math.sin(f.t*0.9)*f.r*1.4;
      f.y = f.hy + Math.sin(f.t*1.6)*4 + Math.sin(f.t*0.31)*3;
    } else {
      f.x = f.hx + Math.sin(f.t*0.85)*16 + Math.sin(f.t*0.37)*9;
      f.y = f.hy + Math.cos(f.t*0.7)*10 + Math.sin(f.t*0.53)*5;
    }
    if(f.life<=0) FLY.splice(i,1);
  }
}
/* ============================================================
   DRAWING
   ============================================================ */
function drawCrittersBack(g){
  const cx=GS.camX;
  /* the short grass, behind everything that stands in it */
  const i0=Math.max(0,((cx-24)/GBW)|0), i1=((cx+W+24)/GBW)|0;
  for(let i=i0;i<=i1;i++){
    const b=GBUCK[i]; if(!b) continue;
    for(const t of b){
      if(t.h>8) continue;
      const bi=clamp(R(t.b*G_BEND)+G_BEND,0,G_BEND*2);
      const sp=grassSprite(t.k,t.h,bi,t.c);
      g.drawImage(sp, R(t.x-sp.width/2), R(groundY(t.x)-t.h-1));
    }
  }
  for(const c of CRIT){
    if(c.x-cx<-30||c.x-cx>W+30) continue;
    drawCritter(g,c);
  }
  for(const b of BIRDS){
    if(b.st!=='perch') continue;
    if(b.x-cx<-20||b.x-cx>W+20) continue;
    drawBird(g,b);
  }
}
function drawCrittersFore(g){
  const cx=GS.camX;
  const i0=Math.max(0,((cx-24)/GBW)|0), i1=((cx+W+24)/GBW)|0;
  for(let i=i0;i<=i1;i++){
    const b=GBUCK[i]; if(!b) continue;
    for(const t of b){
      if(t.h<=8) continue;
      const bi=clamp(R(t.b*G_BEND)+G_BEND,0,G_BEND*2);
      const sp=grassSprite(t.k,t.h,bi,t.c);
      g.drawImage(sp, R(t.x-sp.width/2), R(groundY(t.x)-t.h-1));
    }
  }
  for(const b of BIRDS){
    if(b.st==='perch') continue;
    if(b.x-cx<-24||b.x-cx>W+24) continue;
    drawBird(g,b);
  }
  for(const f of FLY){
    if(f.x-cx<-16||f.x-cx>W+16) continue;
    drawFly(g,f);
  }
}
function drawFly(g,f){
  const x=R(f.x), y=R(f.y);
  if(f.k==='butterfly'){
    const w=0.5+0.5*Math.sin(f.t*13);
    const c1='#f2d05c', c2='#e8a13c';
    for(const s of [-1,1]){
      pEll(g,x+s*(1+w*2.4),y-1,1+w*2,2.6,s<0?c1:c2);
      pEll(g,x+s*(1+w*2),y+1.4,1+w*1.4,1.6,shade(s<0?c1:c2,-0.15));
    }
    pR(g,x,y-2,1,4,'#4a3524');
  } else if(f.k==='dragonfly'){
    const w=Math.sin(f.t*22)>0?1:-1;
    pTaper(g,x-3,y,x+5,y+1,1.6,0.7,'#4fb0c8');
    pEll(g,x-3,y,1.8,1.6,'#7fd8e8');
    for(const s of [-1,1]) pTaper(g,x-1,y,x-1+s*4,y-1.6*w,1.2,0.5,'rgba(206,240,248,0.55)');
  } else {
    const bl=0.5+0.5*Math.sin(f.t*2.2);
    if(bl>0.25){ pEll(g,x,y,1.6,1.6,rgba('#c6ff9a',0.35+bl*0.6)); pR(g,x,y,1,1,'#eaffd0'); }
    else pR(g,x,y,1,1,'#4a5a3a');
  }
}
function drawBird(g,b){
  const x=R(b.x), y=R(b.y);
  const body = ['#3a3630','#6b5442','#2e4a58'][b.kind];
  const belly= ['#9a9084','#c0a888','#8fb0be'][b.kind];
  if(b.st==='perch'){
    const hop=b.hop>0? -2:0;
    pEll(g,x,y-3+hop,3,2.6,body);
    pEll(g,x-b.face*1,y-4.6+hop,2,1.8,body);
    pR(g,x-b.face*3,y-4.6+hop,2,1,'#e8a13c');                 // beak
    pR(g,x-b.face*2,y-5+hop,1,1,'#efe6d2');                   // eye white
    pR(g,x-b.face*2,y-5+hop,1,1,'#120e18');
    pEll(g,x+b.face*0.6,y-2.4+hop,2,1.4,belly);
    pTaper(g,x+b.face*2,y-3.4+hop,x+b.face*6,y-4.4+hop,1.8,0.8,body);  // tail
    pR(g,x-1,y-1+hop,1,1+(hop?0:1),'#c8a05c'); pR(g,x+1,y-1+hop,1,1+(hop?0:1),'#c8a05c');
  } else {
    const f=Math.sin(b.t*22);
    pEll(g,x,y,3,2.2,body);
    pEll(g,x-b.face*2.6,y-1,1.8,1.6,body);
    pR(g,x-b.face*4.4,y-1,2,1,'#e8a13c');
    pTaper(g,x+b.face*2,y-0.4,x+b.face*6,y-1.4,1.6,0.7,body);
    for(const s of [-1,1]){
      const ty=y-1+s*f*5;
      pTaper(g,x,y-1,x-b.face*2+s*0.5,ty,2.2,1,shade(body,s>0?0.12:-0.08));
    }
  }
}
function drawCritter(g,c){
  const x=R(c.x), y=R(c.y);
  switch(c.k){
    case 'hen': {
      const bob=c.st==='peck'? Math.max(0,Math.sin(c.t*4))*3 : 0;
      const wob=c.st==='run'||c.st==='walk'? Math.sin(c.t*14)*1.4 : 0;
      const roost=c.st==='roost';
      pEll(g,x,y-(roost?3:5),5,roost?3.6:4.2,c.c);
      pEll(g,x-c.face*1,y-(roost?4:6),3.6,3,shade(c.c,0.08));
      if(!roost){
        pEll(g,x+c.face*4,y-9+bob,2.4,2.6,c.c);               // head
        pR(g,x+c.face*6,y-9+bob,2,1,'#e8a13c');               // beak
        pR(g,x+c.face*3.4,y-10+bob,1,1,'#120e18');
        pEll(g,x+c.face*4,y-11.4+bob,1.6,1.4,'#c0392f');      // comb
        pEll(g,x+c.face*5.2,y-7.6+bob,1,1.2,'#c0392f');       // wattle
        pTaper(g,x-c.face*4,y-6,x-c.face*7,y-10,2.4,1,shade(c.c,-0.15));
        pR(g,x-1+wob,y-1,1,2,'#d8a03c'); pR(g,x+1-wob,y-1,1,2,'#d8a03c');
      } else {
        pTaper(g,x-c.face*4,y-4,x-c.face*6,y-7,2,1,shade(c.c,-0.15));
        pEll(g,x+c.face*3,y-5,2.2,2,c.c);
      }
      break; }
    case 'frog': {
      const jump=c.vy<-10;
      pEll(g,x,y-2,3.6,jump?2:2.6,'#4f8f4a');
      pEll(g,x,y-3.4,2.8,1.8,'#68a85c');
      pEll(g,x+c.face*2.6,y-4,1.8,1.6,'#4f8f4a');
      pR(g,x+c.face*2.6,y-5,1,1,'#f0e06a'); pR(g,x+c.face*2.6,y-5,1,1,'#181410');
      pR(g,x-c.face*0.6,y-5,1,1,'#f0e06a');
      if(jump){ pTaper(g,x-c.face*2,y-2,x-c.face*5,y-1,1.6,1,'#3f7a3c'); }
      else { pEll(g,x-c.face*3,y-1.4,1.6,1.2,'#3f7a3c'); }
      break; }
    case 'dog': {
      const sleep=c.st==='sleep';
      const bk=c.bark>0? 1-c.bark/0.32 : 0;
      const body='#8a6a44', dark='#6b5034';
      if(sleep){
        pEll(g,x,y-3,8,3.4,body);
        pEll(g,x+c.face*6,y-4,3.4,2.8,body);
        pR(g,x+c.face*8.4,y-4,2,1,'#3a2a1c');
        pTaper(g,x-c.face*7,y-3.4,x-c.face*11,y-2,2,1,dark);
        pR(g,x+c.face*5,y-6,2,2,dark);                      // ear
        pEll(g,x-2,y-0.6,7,1.4,'rgba(10,8,24,0.25)');
      } else {
        const lift=bk>0? -2*Math.sin(bk*Math.PI):0;
        pEll(g,x,y-7,6,3.6,body);
        pR(g,x-3,y-4,2,4,dark); pR(g,x+2,y-4,2,4,dark);
        pEll(g,x+c.face*6,y-11+lift,3,2.8,body);
        pTaper(g,x+c.face*5,y-13.4+lift,x+c.face*4,y-16+lift,2,1,dark);   // ear
        pR(g,x+c.face*8,y-11+lift,2,1,'#3a2a1c');
        pR(g,x+c.face*5.4,y-12+lift,1,1,'#120e18');
        pTaper(g,x-c.face*5,y-8,x-c.face*9,y-12-bk*3,2,1,dark);
        if(bk>0){ pEll(g,x+c.face*9,y-10.4+lift,1.6,1.4,'#2a1a12');
          for(let i=1;i<=3;i++){ const rr=i*4+bk*8;
            g.globalAlpha=(1-bk)*0.34/i;
            pEll(g,x+c.face*(10+rr*0.4),y-11+lift,rr*0.5,rr*0.34,'#ffffff'); g.globalAlpha=1; } }
      }
      break; }
    case 'gecko': {
      const run=c.run>0;
      pTaper(g,x-c.face*5,y,x+c.face*4,y,2.4,1.8,'#b8a888');
      pEll(g,x+c.face*4.6,y,2,1.6,'#c8b898');
      pR(g,x+c.face*5.4,y-0.6,1,1,'#2a2018');
      pTaper(g,x-c.face*5,y,x-c.face*10,y+(run?-2:1),1.8,0.6,'#a89878');
      for(const s of [-1,1]){ pTaper(g,x+s*1.6,y,x+s*3.4,y+2.4,1,0.6,'#a89878'); }
      for(let i=0;i<4;i++) pR(g,R(x-c.face*(3-i*2)),R(y-1),1,1,'#8f7f62');
      break; }
    case 'squirrel': {
      const run=c.st==='run';
      pEll(g,x,y-4,3.4,3,'#8a6040');
      pEll(g,x+c.face*3,y-6.4,2.2,2,'#9a7050');
      pR(g,x+c.face*4.6,y-6.4,1,1,'#2a1a12');
      pR(g,x+c.face*2.4,y-7,1,1,'#120e18');
      pTaper(g,x+c.face*2.4,y-8.6,x+c.face*1.8,y-10,1.4,0.8,'#7a5236');
      pTaper(g,x-c.face*3,y-5,x-c.face*6,y-12+(run?3:0),3,1.4,'#a07a52');
      pTaper(g,x-c.face*5.4,y-10,x-c.face*4,y-13,2,1,'#b88a60');
      if(c.st==='eat'){ pEll(g,x+c.face*3.4,y-4.4,1.4,1.4,'#c8a05c'); }
      break; }
    case 'hopper': {
      pEll(g,x,y-2,2.6,1.6,'#7aa83c');
      pTaper(g,x-1,y-2.6,x-4,y-1,1.4,0.8,'#6b9430');
      break; }
  }
}
/* ============================================================
   PLATFORMING

   The prete could always jump. What it could not do was land on
   anything, which makes a jump a decoration rather than a verb.
   This file gives the world surfaces above the ground line, and
   gives the jump itself the handful of small mercies that make
   one feel good: a little hang at the top of the arc, a little
   more control in the air than on the floor, a grab for the
   ledge you nearly cleared, and a way down through a plank you
   are standing on.

   All of the platforms are one-way. You go up through them and
   land on top, because a nine-foot ghost getting stuck under a
   chicken coop is not the comedy anybody came for.
   ============================================================ */
const PLATS = [];
function addPlat(x0,x1,y,o){
  const p={x0:Math.min(x0,x1), x1:Math.max(x0,x1), y:R(y), tag:(o&&o.tag)||''};
  PLATS.push(p); return p;
}
function clearPlats(){ PLATS.length=0; }

/* the highest plank whose top lies in the slice of air the feet just fell
   through — highest, so a stack of crates is climbed one crate at a time */
function platCrossed(x, yFrom, yTo){
  let best=null;
  for(const p of PLATS){
    if(x < p.x0-2 || x > p.x1+2) continue;
    if(p.y >= yFrom-0.6 && p.y <= yTo+0.01){ if(!best || p.y < best.y) best=p; }
  }
  return best;
}
const onPlat = (p,x)=> p && x>=p.x0-4 && x<=p.x1+4;
/* what is under the feet at x — a plank if one is being stood on, else earth */
function surfaceY(x){ return onPlat(P.plat,x) ? P.plat.y : groundY(x); }
/* the nearest standable top at x at or below y, for anything that wants to
   put itself down sensibly (a jar you drop, a hand task, a walking NPC) */
function standY(x, y){
  let best=groundY(x);
  for(const p of PLATS){
    if(x < p.x0 || x > p.x1) continue;
    if(p.y >= y-2 && p.y < best) best=p.y;
  }
  return best;
}

/* ---------- touch: a jump key, and a flick upward that means the same ---------- */
function tLayout(){
  TPADS.length = 0;
  const bs = 34, m = 10;
  TPADS.push({id:'tree',   x:m+bs*0.5,    y:H-m-bs*0.5, r:bs*0.58, key:'tree',   ic:'book'});
  TPADS.push({id:'whistle',x:m+bs*1.75,   y:H-m-bs*0.5, r:bs*0.52, key:'whistle',ic:'call'});
  TPADS.push({id:'give',   x:W-m-bs*1.85, y:H-m-bs*0.5, r:bs*0.56, key:'give',   ic:'heart'});
  TPADS.push({id:'jump',   x:W-m-bs*0.55, y:H-m-bs*0.62,r:bs*0.72, key:'jump',   ic:'jump'});
}
tLayout();
function padIcon(g,ic,x,y,c){
  if(ic==='heart') icoHeart(g,x,y-2,2.2,c);
  else if(ic==='call') icoCall(g,x+2,y,1.7,c);
  else if(ic==='book') icoBook(g,x,y,1.8,c);
  else if(ic==='jump'){
    // a chevron with a little ground under it
    for(let i=0;i<7;i++){ pR(g,x-6+i,y-2-Math.abs(3-i),2,2,c); }
    pR(g,x-5,y+4,11,1,c); pR(g,x-3,y+6,7,1,rgba(c,0.5));
  }
}
/* a flick upward anywhere in the world is a jump, so the button is a
   convenience rather than the only way up */
const SWIPE = new Map();
cv.addEventListener('pointerdown', ev=>{
  SWIPE.set(ev.pointerId, {y:cvPos(ev).y, t:performance.now(), used:false});
}, true);
cv.addEventListener('pointermove', ev=>{
  const s=SWIPE.get(ev.pointerId); if(!s||s.used) return;
  const p=cvPos(ev);
  if(s.y-p.y > 16 && performance.now()-s.t < 340){
    s.used=true;
    if(GS.state==='play' && !DLG && !VIG && !P.act){ keyDown('jump'); setTimeout(()=>keyUp('jump'),110); }
  }
});
cv.addEventListener('pointerup',     e=>SWIPE.delete(e.pointerId));
cv.addEventListener('pointercancel', e=>SWIPE.delete(e.pointerId));

/* ---------- the walk and the jump ---------- */
const SPD = ()=> (has('stride')? 98 : 76) * (P.carry? (has('haul')?0.92:0.74) : 1) * (P.run?1.42:1);
const JUMP_V = ()=> 252 * (P.carry? (has('haul')?0.94:0.8) : 1);
function stepPlayer(dt){
  const busy = !!DLG || GS.state!=='play' || !!P.act || !!VIG || CH.lock;
  let ax=0, ease=1;
  if(busy) navStop();
  else {
    if(K.left) ax-=1; if(K.right) ax+=1;
    if(ax) navStop();
    else if(NAV.on){
      NAV.t+=dt;
      const d=NAV.tx-P.x;
      if(Math.abs(d)<7 || NAV.t>14){ NAV.on=false; NAV.fire=1; }
      else { ax = d>0?1:-1; ease = clamp(Math.abs(d)/30,0.34,1); }
    }
  }
  P.run = !busy && !!K.block && P.onGround && !P.carry;
  const target = ax*SPD()*ease;
  /* more authority in the air than on the ground, which is wrong and feels
     right — a jump you cannot steer is a jump nobody takes twice */
  const acc = ax!==0 ? (P.onGround?470:405) : (P.onGround?860:250);
  P.vx += clamp(target-P.vx, -acc*dt, acc*dt);
  if(ax!==0) P.face = ax;

  P.coyote = P.onGround ? 0.11 : Math.max(0,P.coyote-dt);
  if(!busy && (press('jump')||press('up'))) P.buf=0.14; else P.buf=Math.max(0,P.buf-dt);
  const maxJumps = has('float')?2:1;
  const wantDrop = K.down && onPlat(P.plat,P.x);
  if(P.buf>0 && (P.coyote>0 || P.jumps<maxJumps)){
    P.buf=0;
    if(wantDrop){
      /* down and jump together: step off the plank instead of off the top of it */
      P.plat=null; P.onGround=false; P.coyote=0; P.y+=2; P.vy=40;
      P.dropT=0.14; AU.step(false); pDust(P.x,P.y,3);
    } else {
      P.vy=-JUMP_V(); P.coyote=0; P.onGround=false; P.plat=null;
      P.jumps = P.coyote>0?1:P.jumps+1;
      P.squash=-0.5; AU.jump(); pDust(P.x,P.y,5);
    }
  }
  P.dropT=Math.max(0,(P.dropT||0)-dt);
  if(P.vy<0 && !(K.jump||K.up)) P.vy += 680*dt;           // let go and it cuts short
  const hang = Math.abs(P.vy)<52 && !P.onGround ? 0.56 : 1;  // a beat of float at the apex
  P.vy += 820*hang*dt; P.vy = Math.min(P.vy, 430);

  const py = P.y;
  P.x = clamp(P.x + P.vx*dt, 16, WORLD_W-16);
  P.y += P.vy*dt;

  /* planks first: catch the feet on the way down through one */
  P.plat = onPlat(P.plat,P.x) ? P.plat : null;
  if(P.plat){
    if(P.vy>=0){ P.y=P.plat.y; P.vy=0; P.onGround=true; P.jumps=0; }
    else P.plat=null;
  } else if(P.vy>0 && !P.dropT){
    const hitP = platCrossed(P.x, py, P.y);
    if(hitP){
      if(!P.onGround){ const f=clamp(P.vy/380,0,1);
        P.squash=0.35+f*0.5; AU.land(); pDust(P.x,hitP.y,3+f*6); }
      P.plat=hitP; P.y=hitP.y; P.vy=0; P.onGround=true; P.jumps=0;
    }
  }
  /* a rising jump that clips the lip of a plank gets pulled up onto it —
     the difference between "nearly" and "again" */
  if(!P.plat && P.vy<0){
    for(const p of PLATS){
      if(P.x<p.x0-3||P.x>p.x1+3) continue;
      if(P.y > p.y && P.y < p.y+7 && Math.abs(P.vx)>20){
        P.y=p.y; P.vy=0; P.plat=p; P.onGround=true; P.jumps=0; AU.step(true); break;
      }
    }
  }
  if(!P.plat){
    const gy = groundY(P.x);
    if(P.y >= gy){
      if(!P.onGround){ const f=clamp(P.vy/380,0,1);
        P.squash=0.35+f*0.5; AU.land(); pDust(P.x,gy,4+f*8);
        if(f>0.5) GS.shake=Math.max(GS.shake,2); }
      P.y=gy; P.vy=0; P.onGround=true; P.jumps=0;
    } else P.onGround=false;
  }

  if(!GS.seen.walked && Math.abs(P.x-GRAVE_X)>240) GS.seen.walked=true;
  const nf = Math.floor(P.phase/Math.PI);
  if(P.onGround && nf!==(P._sf||0) && Math.abs(P.vx)>18){
    AU.step(Math.abs(P.vx)>100); pDust(P.x,P.y,2);
    if(typeof brushGrass==='function') brushGrass(P.x, 26);
  }
  P._sf = nf;

  P.wailCd=Math.max(0,P.wailCd-dt);
  if(!busy && press('whistle') && P.wailCd<=0){
    P.wailCd=1.2; P.wailT=0.5; AU.wail();
    pRing(P.x,P.y-48,'#fff0c0',80);
    let greeted=0;
    for(const n of NPCS) if(Math.abs(n.x-P.x)<110){ n.mark={k:'call',t:1.6}; greeted++; }
    for(const s of SPIRITS) if(Math.abs(s.x-P.x)<130 && s.met){ s.wave=1.4; greeted++; }
    if(Math.abs(CAT.x-P.x)<110 && CAT.state==='wander'){ CAT.tx=P.x; AU.meow(); }
    if(typeof scatterBirds==='function') scatterBirds(P.x, 150);
    if(greeted && !GS.seen.greet){ GS.seen.greet=true; guideSay('They heard that. A prete\'s whistle is a hello with the volume stuck on.'); }
  }
  if(P.wailT>0){ P.wailT-=dt; P.state='wail'; }
  else if(HT) P.state='reach';
  else if(!P.onGround) P.state='jump';
  else if(Math.abs(P.vx)>10) P.state='walk';
  else P.state='idle';
  stepPrete(P,dt);
}
/* ============================================================
   PEOPLE

   The villagers used to be twenty-two pixels of coloured block
   with two dots for eyes, which is fine for a silhouette on a
   dark road and not fine for the person who feeds you.

   This is the same skeleton — the same hips, the same two-bone
   legs, the same cloth sim on the sarongs — with a face built
   on it: a skull and a jaw, an ear, hair with a parting and a
   shine, brows that move, eyes that blink and look where the
   person is looking, a nose, a mouth. Then a shirt with a
   collar, a pocket, a sleeve and a hem, hands with a thumb,
   sandals, and whatever that particular person wears — a งอบ,
   a ผ้าขาวม้า over the shoulder, glasses, a moustache.

   Every extra is a one-pixel decision. At twenty-six pixels
   tall that is the whole budget, and it is enough: a face reads
   from four pixels if the four are in the right places.
   ============================================================ */

/* the little idle life that makes a standing person look alive */
function stepFace(v, dt){
  v.blinkT = (v.blinkT===undefined? rnd(1,5) : v.blinkT) - dt;
  if(v.blinkT<=0){ v.blink=0.13; v.blinkT=rnd(2.2,6.5); }
  if(v.blink>0) v.blink-=dt;
  v.breath = (v.breath||0) + dt*1.6;
  v.glanceT = (v.glanceT===undefined? rnd(2,6) : v.glanceT) - dt;
  if(v.glanceT<=0){ v.glance = rnd(-1,1); v.glanceT=rnd(2.5,7); }
}

function drawVillager(g, v, o={}){
  stepFace(v, o.dt||1/60);
  const sk=v.skin||PAL.skin, skD=v.skinD||PAL.skinD;
  const skL=shade(sk,0.16);
  const sh=v.shirt||'#4a7a9e', shD=v.shirtD||shade(sh,-0.25), shL=shade(sh,0.16);
  const face=v.face, sp=Math.abs(v.vx);
  const LEG=10, TH=5.5, SN=5.5;
  const stride=clamp(sp*0.2,0,4.6), lift=clamp(sp*0.1,0,2.4);
  const bob = Math.abs(Math.sin(v.phase*2))*clamp(sp*0.03,0,1);
  const breathe = sp<4 ? Math.sin(v.breath)*0.35 : 0;
  const hipY=v.y-LEG-bob, hipX=v.x;
  const rk  = v.react ? v.react.k : null;
  const wai = v.state==='wai' || o.wai || rk==='wai';
  const legC = v.legs||'#3a3a44';

  /* ---------- legs and sandals ---------- */
  for(let i=0;i<2;i++){
    const ph=v.phase+i*Math.PI, c=Math.cos(ph), s=Math.sin(ph);
    const fx=v.x+c*stride*face, fy=v.y+(s<0? -Math.abs(s)*lift : 0);
    const knee=ik2(hipX+(i?1:-1),hipY,fx,fy-1,TH,SN,face>0?1:-1);
    const col=i===0? shade(legC,-0.24) : legC;
    if(!v.skirt){
      pLimb(g,hipX+(i?1:-1),hipY,knee.x,knee.y,3.1,col);
      pLimb(g,knee.x,knee.y,fx,fy-1,2.6,col);
      pR(g,R(knee.x)-1,R(knee.y),2,1,shade(col,-0.2));        // the knee itself
      // the shin below a rolled trouser leg
      pLimb(g,knee.x,knee.y+1.5,fx,fy-1,2.2, i===0? skD:sk);
    }
    // a sandal: a sole, a toe strap, a foot
    pEll(g,fx+face*0.6,fy-1.6,2.4,1.8, i===0? skD:sk);
    pR(g,R(fx)-2,R(fy)-1,5,1,'#4a3a2c');
    pR(g,R(fx)-2,R(fy),5,1,'#33281e');
    pR(g,R(fx)+(face>0?1:1),R(fy)-2,1,1,'#5c4936');
  }
  if(v.skirt){
    stepCloth(v.cloth,hipX,hipY-1,10,o.dt||0.016,o.wind||0,v.vx);
    drawCloth(g,v.cloth,v.skirtPat||'plaid',face,{flare:4});
  }

  /* ---------- torso ---------- */
  const chestY=hipY-9+breathe;
  // the body under the shirt, so the neck and the arm holes have something in them
  pR(g,hipX-3.4,chestY+1,7,9,skD);
  // the shirt itself: shoulders a touch wider than the waist
  for(let i=0;i<10;i++){
    const t=i/9;
    const w=4.3 - t*0.7;
    pR(g, R(hipX-w), R(chestY+i), R(w*2), 1, i<1? shL : sh);
  }
  pR(g,R(hipX+(face>0?1.2:-4.2)),R(chestY+1),3,9,shD);          // the shaded side
  pR(g,R(hipX-4.3),R(chestY),9,1,shL);                          // the shoulder line
  pR(g,R(hipX-3.6),R(chestY+9),8,1,shade(sh,-0.35));            // the hem
  // a collar, opened at the throat
  pTri(g, hipX-0.4, chestY+3.6, hipX-2.6, chestY-0.4, hipX+1.8, chestY-0.4, skD);
  pR(g,R(hipX)-3,R(chestY),2,2,shL); pR(g,R(hipX)+1,R(chestY),2,2,shL);
  // a breast pocket on the lit side, and two fold lines
  pR(g,R(hipX-3+(face>0?0:3)),R(chestY+3),3,3,shade(sh,-0.12));
  pR(g,R(hipX-3+(face>0?0:3)),R(chestY+3),3,1,shL);
  pR(g,R(hipX-2),R(chestY+6),1,3,shade(sh,-0.16));
  pR(g,R(hipX+2),R(chestY+5),1,4,shade(sh,-0.16));
  if(v.monk){
    pTaper(g,hipX-4,chestY,hipX+4,chestY+9,3.4,7.4,'#e8923f');
    pR(g,R(hipX-4),R(chestY+2),9,7,'#e8923f');
    pR(g,R(hipX+2*face),R(chestY+2),3,7,'#b56a28');
    pR(g,R(hipX-4),R(chestY+2),9,1,'#f4ac5e');
  }
  /* ผ้าขาวม้า — the checked cloth every farmer here has over one shoulder */
  if(v.pakama){
    const px=hipX-3.2*face;
    for(let i=0;i<9;i++){
      const c = (i%2)? v.pakama : shade(v.pakama,-0.3);
      pR(g, R(px+face*i*0.35), R(chestY+i), 3, 1, c);
    }
    pR(g,R(px-1),R(chestY+9),4,4, v.pakama);
    pR(g,R(px-1),R(chestY+11),4,1, shade(v.pakama,-0.3));
  }

  /* ---------- arms ---------- */
  for(let i=0;i<2;i++){
    const back=i===0;
    let hx2,hy2;
    if(wai){ hx2=hipX+1.5*face; hy2=chestY-4; }
    else if(rk==='wave' && !back){ hx2=hipX+4.5*face; hy2=chestY-4+Math.sin(v.anim*13)*2.6; }
    else if(rk==='clap'){ hx2=hipX+(back?1.2:3.2)*face; hy2=chestY+1-Math.abs(Math.sin(v.anim*11))*2.4; }
    else if(v.carry && !back){ hx2=hipX+5*face; hy2=chestY+3; }
    else { const ph=v.phase+(back?Math.PI:0); hx2=hipX+Math.cos(ph)*stride*0.7*face; hy2=chestY+10; }
    const sx=hipX+(back?-3.2:3.2)*face, sy=chestY+1.4;
    const el=ik2(sx,sy,hx2,hy2,5,5,back?(face>0?-1:1):(face>0?1:-1));
    // a short sleeve to just above the elbow, then bare arm
    pLimb(g,sx,sy,el.x,el.y,2.7, back?skD:sk);
    const mx=lerp(sx,el.x,0.62), my=lerp(sy,el.y,0.62);
    pLimb(g,sx,sy,mx,my,3.0, back?shD:sh);
    pR(g,R(mx)-1,R(my),3,1, back?shade(shD,-0.2):shade(sh,-0.22));
    pLimb(g,el.x,el.y,hx2,hy2,2.4,back?skD:sk);
    // a hand, with a thumb
    pEll(g,hx2,hy2,1.7,1.8,back?skD:sk);
    pR(g,R(hx2)+(face>0?1:-1),R(hy2)-1,1,1,back?skD:skL);
  }
  if(wai){
    pEll(g,hipX+1.6*face,chestY-5,2.3,3.1,sk);
    pR(g,R(hipX+0.6*face),R(chestY-7),2,3,skD);
    pR(g,R(hipX+0.6*face),R(chestY-7),2,1,skL);
  }

  /* ---------- head ----------
     nod and shake are set by whatever is talking: a head that moves while
     the words come out is most of what makes a line feel said rather than
     printed. */
  const hy3=chestY-7.5 + (v.nod||0);
  const hjx=(v.headX||0);
  const look = clamp((v.glance||0)*0.7 + (o.lookAt? clamp((o.lookAt-v.x)/60,-1,1) : 0), -1, 1);
  // neck, and the shadow the jaw throws on it
  pR(g,R(hipX-1.4),R(hy3+3.5),3,4,skD);
  pR(g,R(hipX-1.4),R(hy3+3.5),3,1,shade(skD,-0.24));
  // skull, then jaw, then the shaded side
  pEll(g,hipX+hjx+0.5*face,hy3,5.0,5.0,sk);
  pEll(g,hipX+hjx+0.9*face,hy3+2.1,4.0,3.4,sk);
  pEll(g,hipX+hjx+2.9*face,hy3+0.6,2.4,4.0,skD);
  pEll(g,hipX+hjx-1.8*face,hy3-1.6,2.3,2.2,skL);          // the light on the temple
  // ear on the back side of the head
  pEll(g,hipX+hjx-3.4*face,hy3+0.6,1.3,1.7,skD);
  pR(g,R(hipX+hjx-3.4*face),R(hy3+0.6),1,1,shade(skD,-0.2));
  // brows
  const browY = hy3-3 + (v.brow||0);
  const browC = shade(v.hairC||'#241c18', 0.22);
  /* the inner end of the near brow is the whole of an expression at this
     size: up is sorry, down is having none of it. */
  const tilt = v.browT||0;
  pR(g,R(hipX+hjx+(1.8+look*0.5)*face),R(browY-tilt),3,1,browC);
  pR(g,R(hipX+hjx+(-2.4+look*0.5)*face),R(browY+tilt*0.4),3,1,browC);
  if(tilt>0.8) pR(g,R(hipX+hjx+(1.8+look*0.5)*face),R(browY-tilt-1),2,1,browC);
  if(tilt<-0.8) pR(g,R(hipX+hjx+(2.8+look*0.5)*face),R(browY+1),2,1,browC);
  // eyes: white, pupil, and a lid that comes down when they blink
  /* the two eyes have to sit far enough apart to read as two. At three
     pixels wide and three and a half apart they merged into one dark band
     and every villager looked like they were wearing a mask. */
  const eyeY=hy3-0.6, blink=(v.blink||0)>0;
  const wide=clamp(v.eye||0,-1,1);            // surprise opens them, weariness shuts them
  for(const ex of [2.6, -2.0]){
    const x2=R(hipX+hjx+(ex+look*0.6)*face);
    if(blink || wide<-0.5){ pR(g,x2-1,R(eyeY),3,1,shade(skD,-0.2)); continue; }
    /* a wide eye grows DOWNWARD. Grown upward it ran straight into the brow
       and a surprised villager looked like one solid black band. */
    const eh = wide>0.6? 4 : 3;
    const ey0 = R(eyeY)-1;
    pR(g,x2-1,ey0,3,eh,'#fbf4e6');
    const pu=(look>0.25?1:look<-0.25?-1:0);
    pR(g,x2+pu,ey0+(eh>3?1:0),1,2,'#1e1820');
    pR(g,x2+pu,ey0+(eh>3?1:0),1,1,'#5a4a54');
    if(eh>3) pR(g,x2-1,ey0+3,3,1,'#fbf4e6');
    pR(g,x2-1,ey0-1,3,1,shade(skD,-0.12));             // the lid above it
    if(wide<-0.1) pR(g,x2-1,ey0,3,1,shade(skD,-0.08)); // and half down when tired
  }
  // nose and mouth
  pR(g,R(hipX+hjx+2.4*face),R(hy3+1.2),1,2,skD);
  pR(g,R(hipX+hjx+2.4*face),R(hy3+1.2),1,1,shade(skD,-0.14));
  const smile = v.mood===undefined? 1 : v.mood;
  const talk = clamp(v.talk||0,0,1);
  const mx0=R(hipX+hjx+0.4*face), my0=R(hy3+3);
  if(talk>0.05){
    /* an open mouth, and the dark inside it. Two pixels of shadow is the
       difference between somebody speaking and somebody with a line drawn
       on their face. */
    const oh=1+Math.round(talk*2);
    pR(g,mx0,my0-1,3,oh+1,'#5e2f30');
    pR(g,mx0,my0-1,3,1,'#9a5048');
    if(oh>1) pR(g,mx0+1,my0+oh-1,1,1,'#c2727a');
  } else if(smile>0.55){
    pR(g,mx0,my0,3,1,'#9a5048'); pR(g,R(hipX+hjx+2.4*face),my0-1,1,1,'#9a5048');
    pR(g,R(hipX+hjx-1.2*face),my0-1,1,1,'#9a5048');
  } else if(smile>0){
    pR(g,mx0,my0,2,1,'#9a5048'); pR(g,R(hipX+hjx+2.2*face),R(hy3+2.4),1,1,'#9a5048');
  } else if(smile>-0.5){
    pR(g,R(hipX+hjx+0.2*face),my0,3,1,'#9a5048');
  } else {
    pR(g,R(hipX+hjx+0.2*face),my0,3,1,'#9a5048');
    pR(g,R(hipX+hjx+2.2*face),my0-1,1,1,'#9a5048');

/* ============================================================
   THE THINGS IN A VILLAGE

   Two jobs. First: put a life under every house. A Thai stilt
   house is a room upstairs and a whole household downstairs —
   the jars, the bicycle, the firewood, the chillies drying on a
   tray, somebody's washing, a dog's bowl, a hammock nobody is
   in. None of it is baked into the play layer because the light
   in the window has to go out at night and come on at dawn.

   Second: make things answer. There is a long, cheap list of
   small objects here that do nothing except say something true
   when a nine-foot ghost touches them, and a handful that do
   something small — a bell rings, a chicken runs, a stone turns
   over and whatever was under it leaves in a hurry. A village
   you can only walk through is scenery. A village that answers
   is a place.
   ============================================================ */

/* ---------- what lives under a house ---------- */
function paintUnderHouse(g, gy, seed){
  const r=mulberry(seed), x=60;
  /* the dark under the floor */
  pR(g,x-52,gy-40,104,40,'rgba(10,10,20,0.42)');
  for(const sx of [-46,-22,2,26,46]){
    pR(g,x+sx,gy-42,5,42,'#4a3726'); pR(g,x+sx,gy-42,2,42,'#5f4a33');
    pR(g,x+sx-1,gy-2,7,3,'#38291c');                    // the stone footing
  }
  /* water jars, the household's whole supply */
  for(let i=0;i<3;i++){
    const jx=x-40+i*13, s=0.7+ (i===1?0.2:0);
    pEll(g,jx,gy-6*s,8*s,7*s,'#5a3a2a');
    pEll(g,jx,gy-10*s,7*s,6*s,'#6b4432');
    pEll(g,jx,gy-13*s,4.6*s,2.8*s,'#3f2a1e');
    pR(g,jx-5*s,gy-11*s,10*s,1,'#7d5240');
  }
  /* a bicycle, leaning */
  { const bx=x-6;
    pEll(g,bx-7,gy-5,5,5,'#1e1a20'); pEll(g,bx-7,gy-5,2.4,2.4,'#4a4048');
    pEll(g,bx+7,gy-5,5,5,'#1e1a20'); pEll(g,bx+7,gy-5,2.4,2.4,'#4a4048');
    pTaper(g,bx-7,gy-5,bx+3,gy-13,1.4,1.4,'#7a2f2c');
    pTaper(g,bx+7,gy-5,bx+3,gy-13,1.4,1.4,'#7a2f2c');
    pTaper(g,bx+3,gy-13,bx+8,gy-14,1.2,1.2,'#8a3a34');
    pR(g,bx+6,gy-16,5,1,'#2a2228');                     // handlebars
    pR(g,bx-2,gy-15,5,2,'#3a2c22');                     // saddle
    pR(g,bx-9,gy-11,5,4,'#6b5a3c');                     // a basket on the front
  }
  /* firewood, stacked the way it is stacked everywhere */
  for(let i=0;i<3;i++) for(let k=0;k<4-i;k++){
    pEll(g, x+22+k*6-((4-i)*2), gy-3-i*5, 3,2.6,'#7d5a3c');

  }
  /* a flat tray of chillies drying, and a broom against the post */
  pR(g,x+34,gy-14,15,2,'#b9a06a');
  for(let i=0;i<7;i++) pR(g,R(x+35+i*2),R(gy-16),1,2, i%2?'#c0392f':'#a8302a');
  pTaper(g,x+50,gy,x+48,gy-22,1.4,1.4,'#8a6a44');
  pTaper(g,x+48,gy-22,x+47,gy-28,3.4,1.6,'#c8b47a');
  /* a hammock with nobody in it */
  pR(g,x-46,gy-30,1,1,'#3a2c22');
  for(let i=0;i<18;i++){
    const t=i/17, hx=lerp(x-46,x-6,t), hy=gy-30+Math.sin(t*Math.PI)*7;
    pR(g,R(hx),R(hy),2,1,'#9a8f6a');

  pR(g,x+19,gy-2,4,2,'#6b4f34'); pR(g,x+24,gy-2,4,2,'#6b4f34');
  /* the ladder up */
  pR(g,x-2,gy-40,2,40,'#7d5a3c'); pR(g,x+6,gy-40,2,40,'#7d5a3c');

function drawHouseLife(g){
  const cx=GS.camX;
  for(let i=0;i<HOUSE_XS.length;i++){
    const hx=HOUSE_XS[i];
    if(hx-cx<-90||hx-cx>W+90) continue;
    if(hx===HOME_X) continue;              // his house draws its own life
    const gy=groundY(hx);
    const sp=farmSprite('under'+i, 124, 46, gg=>paintUnderHouse(gg, 42, 909+i*37));
    g.drawImage(sp, R(hx-60), R(gy-42));
    /* the window: lit and still at night, open and empty by day */
    const wx=hx+(i%2? 20:-20), wy=gy-64;
    const night=1-TOD.v;
    if(night>0.25){
      const fl=0.85+0.15*Math.sin(GS.t*1.3+i*2);
      pR(g,R(wx-8),R(wy-11),17,13,rgba('#ffc44d',0.22*night*fl));
      pR(g,R(wx-6),R(wy-9),13,9, rgba('#ffd67f',0.34*night*fl));
      /* somebody asleep, or somebody who cannot */
      if(i%3===0){
        const s=Math.sin(GS.t*0.7+i)*1.4;
        pEll(g,wx+s,wy-2,5,3,'rgba(40,26,20,0.7)');
        pEll(g,wx+s-3,wy-5,2.6,2.6,'rgba(40,26,20,0.7)');
      }
    } else {
      pR(g,R(wx-8),R(wy-11),17,13,'rgba(24,20,30,0.55)');
      pR(g,R(wx-7),R(wy-10),15,11,'rgba(40,34,44,0.5)');
      /* a shirt hung in the open window */
      if(i%2===0){ pR(g,R(wx-5),R(wy-10),7,8,'#b4443c'); pR(g,R(wx-5),R(wy-10),7,1,'#d0605a'); }
    }
    /* a gecko-sized lamp under the eaves, which is what the moths are for */
    if(night>0.3) pEll(g,hx+(i%2?-26:26),gy-58,1.6,1.6,rgba('#ffe3a0',0.5*night));
  }
}

/* a dog will let you, eventually */
function dogInteract(set, taken){
  if(taken()) return;
  for(const c of CRIT){
    if(c.k!=='dog') continue;
    if(Math.abs(c.x-P.x)>22) continue;
    const known = GS.seen['dog_'+c.id];
    set(c.x, groundY(c.x)-22, known? L('scratch its ear') : L('hold out a hand'), ()=>{
      P.face = c.x<P.x? -1:1;
      preteAct('reach',1.0,()=>{
        if(!known){
          GS.seen['dog_'+c.id]=true; saveGame();
          addMerit(1); toast('+1 '+L('merit')+' · '+L('it decided about you'), PAL.jadeL);
          say([{w:'',t:'It smells your hand a long moment, the way a dog does when it is deciding.'},
               {w:'',t:'Then it leans on your shin, which is as high as it can reach, and that\'s that.'}]);
        } else {
          AU.purr(); pHeart(c.x,c.y-14);
          toast(L('the tail goes'),'#ff9eb0');
        }
        c.st='sit'; c.tt=4;
      });
    });
    return;
  }
}
function thingInteract(set, taken){
  if(taken()) return;
  let best=null, bd=20;
  for(const t of THINGS){
    const d=Math.abs(t.x-P.x);
    if(d<bd){ bd=d; best=t; }
  }
  if(!best) return;
  const key='th_'+R(best.x);
  set(best.x, groundY(best.x)-(best.dy||20), L(best.txt), ()=>{
    const first=!GS.seen[key];
    GS.seen[key]=true;
    P.face = best.x<P.x? -1:1;
    if(best.fx) best.fx();
    if(first && best.merit){ addMerit(best.merit); toast('+'+best.merit+' '+L('merit')); }
    const line = first? best.say[0] : (best.say[1]||best.say[0]);
    if(first) say([{w:'',t:line}]);
    else guideSay(line, 5.5);
    saveGame();
  });
}
/* ============================================================
   THE FIRST NIGHT, AND THE MORNING AFTER

   The game now has a beginning, and it is a person rather than
   a lesson. You come up out of the ground in the burial field.
   A long way down the road there is one light on: an old man
   with a cart, selling to nobody at three in the morning. He is
   not frightened of you, which is the first thing that has gone
   right in a while. He walks you home past the sleeping houses,
   puts food out, tells you to come back at first light, and in
   the morning he hands you a plough.

   Everything after that is farming, and farming is the game.

   The whole thing is one list, STORY, stepped one beat at a
   time. A beat can want you to stand somewhere, to say
   something, to finish a job, or just to let a few seconds
   pass. Nothing in here reaches into the rest of the game
   except through GS.ch, so the moment the last beat is done the
   village behaves exactly as it always did.
   ============================================================ */

/* ---------- where the first night happens ---------- */
const GRAVE_X  = 250;                 // the soil you come up out of
const STALL2_X = 566;                 // his cart, parked on the road at 3am
const HOME_X   = HOUSE_XS[0];         // 1560 — his house, up on its stilts
const HIDE_X   = HOME_X - 46;         // the dark under the floor, where you sleep
const FIELD_X  = BED_XS[0] - 44;      // where he stops and hands you the plough

const CH = {
  lock:false, t:0, beat:0, sub:0,
  climb:0, dug:0,
  walk:false, wtx:0, said:{},
  fade:0, fadeTo:0, card:0, cardTxt:'',
  jarsSet:0,
};
const chapter = ()=> STORY[clamp(GS.ch|0,0,STORY.length-1)];
const chIs = id => chapter().id===id;
const chAt = id => STORY.findIndex(s=>s.id===id);
const chPast = id => (GS.ch|0) > chAt(id);
/* while the first night is running the village keeps its hands in its
   pockets: no shops, no orders, no rice lesson, no ghosts wanting a chat */
const storyBusy = ()=> (GS.ch|0) < chAt('free');

function chGo(id){
  const i = typeof id==='number'? id : chAt(id);
  GS.ch = i; CH.t=0; CH.sub=0; CH.said={}; CH.card=0;
  const c=STORY[i];
  /* the climb out of the grave buries you 74px under the world. Any chapter
     that is not the climb starts you standing on it again — otherwise
     skipping ahead leaves the prete drawn waist-deep in the soil. */
  if(!c || c.id!=='climb'){ P.rise=0; if(typeof P.y==='number') P.y=groundY(P.x); }
  if(c && c.enter) c.enter();
  saveGame();
}
function chNext(){ chGo((GS.ch|0)+1); }
/* a line said once per beat, when you reach a place */
function onceAt(key, x, r, fn){
  if(CH.said[key]) return false;
  if(Math.abs(P.x-x)>r) return false;
  CH.said[key]=true; fn(); return true;
}

/* ---------- Lung Somchai, walking ---------- */
/* He is an ordinary NPC with one extra gear: a destination he will actually
   walk to, at an old man's pace, waiting when you fall behind because the
   whole point of the scene is that he is waiting for you. */
const LUNG = UNCLE;
function lungWalk(tx, speed){
  CH.walk=true; CH.wtx=tx; CH.wspd=speed||54;
}
function stepLung(dt){
  if(!CH.walk) return;
  const d = CH.wtx - LUNG.x;
  const behind = (P.x - LUNG.x) * sign(d||1) < -150;
  if(Math.abs(d)<4){ CH.walk=false; LUNG.vx=0; LUNG.state='idle'; return; }
  if(behind){
    LUNG.vx=0; LUNG.state='idle'; LUNG.face=sign(P.x-LUNG.x||1);
    CH.waitT=(CH.waitT||0)+dt;
    if(CH.waitT>2.6){ CH.waitT=0; lungSay(pick([
      'Take your time. The road isn\'t going anywhere.',
      'I walk slowly. You have no excuse.',
      'Still there? Good. Keep up.']), 2.6); }
    return;
  }
  CH.waitT=0;
  LUNG.face=sign(d);
  LUNG.vx=LUNG.face*CH.wspd;
  LUNG.x += LUNG.vx*dt;
  LUNG.phase += LUNG.vx*dt*0.22;
  LUNG.state='walk';
  LUNG.y = groundY(LUNG.x);
  if(Math.random()<dt*6) brushGrass(LUNG.x,14,2);
}
function lungSay(txt,t=3.4){ LUNG.bub={t, txt:L(txt)}; }

/* ============================================================
   SLEEPING
   ============================================================ */
const SLEEP={t:0, lines:0};
function startSleep(){
  GS.state='sleep'; SLEEP.t=0; SLEEP.lines=0;
  P.vx=0; P.vy=0; navStop();
  AU.gong(98,0,0.05);
}
const DREAM=[
  'You don\'t sleep. Things like you don\'t. You lie under the boards and wait.',
  'A gecko says its own name seven times, directly above your head.',
  'Behind your eyes, a scale, and a hand putting something on it.',
  'The dogs give up around four. The frogs keep going.',
  'The sky over the paddy goes the colour of the inside of a shell.',
];
function stepSleep(dt){
  SLEEP.t+=dt;
  setTOD(clamp((SLEEP.t-1.2)/9, 0, 0.92));
  const want = clamp(Math.floor((SLEEP.t-0.6)/2.1),0,DREAM.length);
  if(want>SLEEP.lines){ SLEEP.lines=want; AU.blip(); }
  if(SLEEP.t>4 && SLEEP.t<4.2) AU.rooster();
  if(SLEEP.t>7.4 && SLEEP.t<7.5) AU.rooster();
  if(SLEEP.t > DREAM.length*2.1+2.4 || press('act')||press('tap')){
    if(SLEEP.t<2){ clearPress(); return; }
    setTOD(0.92, true);
    GS.state='play';
    P.x=HIDE_X+20; P.y=groundY(P.x);
    GS.camX=clamp(P.x-W/2,0,WORLD_W-W);
    for(const c of CRIT) if(c.k==='hen'){ c.st='peck'; }
    scatterBirds(P.x, 260);
    AU.rooster();
    chGo('field');
    toast(L('morning')+' · '+L('the field is waiting'),'#ffd98a');
  }
  clearPress();
}
function drawSleepScreen(g){
  const t=SLEEP.t;
  g.fillStyle='#05060f'; g.fillRect(0,0,W,H);
  /* the underside of a wooden floor, three feet above your face */
  for(let i=0;i<9;i++){
    const y=8+i*7;
    pR(g,0,y,W,6, i%2? '#171219':'#1c1620');
    pR(g,0,y,W,1,'#241c26');
  }
  for(let i=0;i<7;i++) pR(g,40+i*62,8,3,H*0.24,'#120e16');
  /* and past the edge of it, sky */
  const sk=skyNow();
  pVGrad(g,0,H*0.26,W,H*0.5,sk.c[1],sk.c[3],6);
  for(const s of STARS){
    if(s[1]>0.42) continue;
    const y=H*0.28+s[1]*H*0.42;
    g.fillStyle=`rgba(255,246,224,${0.5*sk.star*(0.3+s[3]*0.7)*(0.5+0.5*Math.sin(GS.t*1.3+s[2]))})`;
    g.fillRect(R((s[0]*W+t*3)%W),R(y),1,1);
  }
  pR(g,0,H*0.76,W,H*0.24,'#14120e');
  for(let i=0;i<60;i++){ const x=(i*37)%W; pR(g,x,H*0.76+((i*13)%14),2,1,'#1b1812'); }
  /* your own knees, in the bottom of frame, because you are down there */
  { const by=H*0.94, br=0.5+0.5*Math.sin(t*0.9);
    pEll(g,W*0.24,by,34,15,'#191520');
    pEll(g,W*0.24,by-4,26,10,'#221c2a');
    pEll(g,W*0.58,by+2,40,17,'#191520');
    for(let i=0;i<5;i++) pR(g,W*0.50+i*7,by-9+((i%2)*2),3,12,'#1d1826');
    pEll(g,W*0.80,by+4-br*1.5,14,9,'#191520'); }
  for(let i=0;i<6;i++){
    const fx=(i*83 + t*9)%W, fy=H*0.60+Math.sin(t*1.3+i)*14;
    const bl=0.5+0.5*Math.sin(t*2.4+i*1.7);
    if(bl<0.4) continue;
    g.globalAlpha=(bl-0.4)*1.4*(1-TOD.v);
    pEll(g,fx,fy,1.6,1.6,'#c6ff9a'); g.globalAlpha=1;
  }
  /* the lines of the night */
  let y=LANG==='th'? H*0.37 : H*0.40;
  for(let i=0;i<SLEEP.lines;i++){
    const a=clamp((t-(0.6+i*2.1))/0.7,0,1) * (1 - clamp((t-(0.6+i*2.1)-6.5)/1.2,0,1));
    if(a<=0.01){ y+=20; continue; }
    g.globalAlpha=a;
    const ls=wrap(g,DREAM[i],W-72,7), lh=lineStep(7);
    for(const l of ls){
      pTxt(g,l,W/2+1,y+1,'rgba(20,12,28,0.65)',7,'center');
      pTxt(g,l,W/2,y,'#f2ecf8',7,'center'); y+=lh; }
    g.globalAlpha=1; y+=LANG==='th'?5:8;
  }
  const fade=clamp(1-t/1.0,0,1);
  if(fade>0){ g.fillStyle=rgba('#05060f',fade); g.fillRect(0,0,W,H); }
  pTxt(g, L('tap to wake'), W/2, H-10, 'rgba(200,190,220,0.5)', 6,'center');
}

function stepStory(dt){
  CH.t+=dt;
  if(CH.card>0) CH.card-=dt;
  const c=chapter();
  if(c && c.step) c.step(dt);
  stepSeeds(dt);
  /* the stall's fire keeps going all night */
  if(!chPast('follow') && Math.random()<dt*3 && Math.abs(STALL2_X-GS.camX-W/2)<W)
    pSmoke(STALL2_X-4+rnd(-3,3), groundY(STALL2_X)-40);
}
function storyInteract(set, taken){
  const c=chapter();
  if(c && c.interact && !taken()) c.interact(set);
  if(!taken()) carryInteract(set);
  if(!taken()) fieldInteract(set, taken);
}

/* ============================================================
   THE PLOUGH, THE JARS, AND THE SEED

   Three verbs, and the first hour of the game is made out of
   them: break the ground, wet it, put something in it.

   The plough is the only one with a mini-game, and the whole
   design of it is one idea — the ground pulls the blade, and
   you drive on the pull. Miss and the blade skips out. Hit it
   and a slab of earth turns over with a noise like a door
   closing, the note goes up a step, and the furrow gets
   longer. It speeds up as you go, so a bed always ends harder
   than it started.
   ============================================================ */

/* ---------- what the beds know about themselves ---------- */
const plowedCount  = ()=> PLOTS.filter(p=>p.plowed).length;
const wateredCount = ()=> PLOTS.filter(p=>p.plowed && p.wet>0.05).length;
const sownCount    = ()=> PLOTS.filter(p=>p.stage>0).length;
const bedAt = x => PLOTS.find(p=>Math.abs(p.x-x)<16) || null;

function sowPlot(pl, byHim){
  if(pl.stage>0) return false;
  pl.stage=1; pl.t=0; pl.pop=1;
  AU.ranat(byHim?520:660,0,0.05);
  for(let i=0;i<8;i++) part({k:'dust',x:pl.x+rnd(-9,9),y:groundY(pl.x)-2,vx:rnd(-14,14),vy:-rnd(10,34),life:rnd(.3,.7)});
  if(!GS.seen.firstSow){ GS.seen.firstSow=true; vignette('firstSeed'); }
  saveGame(); return true;
}
function waterPlot(pl){
  if(!pl.plowed || pl.wet>0.05) return false;
  pl.wet=1;
  AU.pour();
  for(let i=0;i<22;i++) part({k:'water',x:pl.x+rnd(-11,11),y:groundY(pl.x)-16,vx:rnd(-16,16),vy:rnd(20,70),life:.45});
  saveGame(); return true;
}

/* ============================================================
   CARRYING
   ============================================================ */
/* Jars stand where they were last put down. You lift one, it is in your
   arms until you do something about it, and where you put it down is where
   it stays — which is the entire point of the old man saying "do not try to
   carry all of them" and the entire joke of you then doing it. */
const JARS = [];
function resetJars(){
  JARS.length=0;
  JARS.push({x:JAR_X+26, water:0});
  JARS.push({x:JAR_X+42, water:0});
  if(P) P.carry=null;
}
const carryMax = ()=> has('haul')? 2 : 1;
function carriedJars(){ return P.carry? P.carry.jars : []; }

/* Lifting is a movement, not a state change. He folds ninety pixels of leg
   into a crouch, gets both hands under it, and the jar arrives in his arms on
   the way up — which is the moment the weight is actually his. */
function liftJar(j){
  if(P.carry && P.carry.jars.length>=carryMax()){ guideSay(L('Your arms are full.')); AU.blip(); return; }
  P.face = j.x<P.x? -1:1;
  preteAct('pick', 0.85, ()=>{
    if(!P.carry) P.carry={k:'jar', jars:[]};
    if(P.carry.jars.length>=carryMax()) return;
    const i=JARS.indexOf(j); if(i>=0) JARS.splice(i,1);
    P.carry.jars.push(j);
    AU.land(); AU.tone(116,0.3,'sine',0.045,80);      // the sound of it being heavy
    pDust(j.x, groundY(j.x), 5);
    P.squash = Math.max(P.squash||0, 0.22);
    toast(L('carrying a โอ่ง'), '#8fc4e8');
    if(!GS.seen.firstJar){ GS.seen.firstJar=true;
      guideSay(L('Heavy, even for you. Walk it over and tip it out.'),8); }
  });
}
function dropJars(){
  if(!P.carry || P.act) return;
  const jars=P.carry.jars.slice();
  preteAct('pick', 0.8, ()=>{
    if(!P.carry) return;
    for(const j of jars){ j.x = R(P.x + P.face*rnd(9,15)); JARS.push(j); }
    P.carry=null;
    AU.land(); pDust(P.x+P.face*11,P.y,6);
  });
}
function fillCarried(){
  let n=0;
  for(const j of carriedJars()) if(j.water<3){ j.water=3; n++; }
  if(!n){ guideSay(L('They are already full.')); AU.blip(); return; }
  P.face = JAR_X<P.x? -1:1;
  preteAct('water',1.0,()=>{
    AU.pour();
    for(let k=0;k<18;k++) part({k:'water',x:JAR_X+rnd(-5,5),y:groundY(JAR_X)-22,vx:rnd(-10,10),vy:rnd(14,44),life:.5});
  });
  toast(L('filled'),'#8fc4e8');
}
function tipOnto(pl){
  const j = carriedJars().find(q=>q.water>0);
  if(!j){ guideSay(L('Empty. Fill it at the big โอ่ง by the hut.')); AU.blip(); return; }
  j.water--;
  P.face = pl.x<P.x? -1:1;
  preteAct('water',0.9,()=>{ waterPlot(pl); });
}

function carryInteract(set){
  const near2=(x,d)=>Math.abs(P.x-x)<d;
  /* the two carryable jars, wherever they have ended up */
  if(!P.carry || P.carry.jars.length<carryMax()){
    /* the big jar stands under the farmhouse's own stilts, so after dark it
       covers the bed — and sleeping is the whole point of after dark. It is
       still offered, it just goes to the back of the queue, so the bed is what
       E does and the jar keeps an icon of its own. */
    const bedtime = !P.carry && !storyBusy() && DAY.min/60>=17 && bedNear()!==null;
    for(const j of JARS) if(near2(j.x,22)){
      set(j.x, groundY(j.x)-26, L('lift the โอ่ง'), ()=>liftJar(j), null, 'lift');
      if(bedtime) spotLast();
      return;
    }
  }
  if(!P.carry) return;
  /* standing over a bed that wants water */
  const pl=bedAt(P.x);
  if(pl && pl.plowed && pl.wet<=0.05){
    set(pl.x, groundY(pl.x)-34, L('tip it over the bed'), ()=>tipOnto(pl)); return;
  }
  if(near2(JAR_X,30) && carriedJars().some(j=>j.water<3)){
    set(JAR_X, groundY(JAR_X)-34, L('fill from the big jar'), fillCarried); return;
  }
  set(P.x, groundY(P.x)-40, L('set it down'), dropJars);
}

/* ============================================================
   THE PLOUGH
   ============================================================ */
let PLOW=null;
function startPlow(pl){
  PLOW = { pl, hits:0, need:6, m:0, dir:1, sp:0.86, combo:0, best:0,
           flash:0, fail:0, t:0, tip:0, out:0, perfect:0, msg:'', msgT:0,
           x: pl.x-16 };
  P.x = pl.x-24; P.y=groundY(P.x); P.vx=0; P.vy=0; P.face=1;
  navStop(); GS.state='plow'; AU.sel();
}
const plowZone = ()=> (has('steady')? 0.155 : 0.125) * (has('plowman')? 1.3 : 1);
function stepPlow(dt){
  const A=PLOW; if(!A){ GS.state='play'; return; }
  A.t+=dt;
  if(A.flash>0) A.flash-=dt;
  if(A.fail>0)  A.fail-=dt;
  if(A.msgT>0)  A.msgT-=dt;
  if(A.out>0){
    A.out-=dt;
    if(A.out<=0){ PLOW=null; GS.state='play'; clearPress(); return; }
    GS.camX = lerp(GS.camX, clamp(A.x-W/2,0,WORLD_W-W), 1-Math.pow(0.004,dt));
    clearPress(); return;
  }
  /* the marker swings, and swings faster the deeper into the bed you get */
  A.m += A.dir*dt*A.sp;
  if(A.m>1){ A.m=1; A.dir=-1; AU.tone(180,0.03,'sine',0.010); }
  if(A.m<0){ A.m=0; A.dir=1;  AU.tone(180,0.03,'sine',0.010); }
  /* the blade rides the same number, so what you watch and what you hit are
     the same thing rather than a bar pretending to be a plough */
  A.tip = Math.sin(A.m*Math.PI);

  if(press('act')||press('tap')||press('jump')){
    const d=Math.abs(A.m-0.5), z=plowZone();
    if(d<z*0.4){
      plowBite(A, 2);
    } else if(d<z){
      plowBite(A, 1);
    } else {
      A.fail=0.45; A.combo=0; A.perfect=0;
      A.msg=L('skipped'); A.msgT=0.9;
      AU.whiff(); AU.noise(0.1,0.03,200,3000);
      GS.shake=Math.max(GS.shake,1.2);
      for(let i=0;i<4;i++) part({k:'dust',x:A.x+rnd(-6,6),y:groundY(A.x),vx:rnd(-30,30),vy:-rnd(6,26),life:.4});
      A.sp=Math.max(0.72,A.sp-0.04);
    }
  }
  if(press('back')){ PLOW=null; GS.state='play'; clearPress(); return; }

  const tx = clamp(A.x-W/2+14, 0, WORLD_W-W);
  GS.camX = lerp(GS.camX, tx, 1-Math.pow(0.003,dt));
  GS.camY = lerp(GS.camY, 6, 1-Math.pow(0.01,dt));
  P.x = A.x-22; P.y=groundY(P.x); P.state='reach'; P.face=1;
  stepPrete(P,dt);
  clearPress();
}
function plowBite(A, grade){
  A.hits++; A.combo++; A.best=Math.max(A.best,A.combo);
  A.perfect = grade===2?1:0;
  A.flash = grade===2? 0.34:0.24;
  const pl=A.pl;
  A.x = pl.x-16 + (A.hits/A.need)*32;
  A.sp = Math.min(1.55, A.sp + 0.075);
  /* the sound of it: a low thud you feel, and a note that climbs with the
     combo so a clean bed ends on a little run of music */
  AU.tone(64,0.2,'sine',grade===2?0.075:0.055, 38);
  AU.noise(0.13, grade===2?0.06:0.042, 60, 900);
  const scale=[392,440,523,587,659,784,880,988];
  AU.ranat(scale[Math.min(scale.length-1,A.combo-1)], 0, grade===2?0.055:0.038);
  GS.shake=Math.max(GS.shake, grade===2?3.4:2.2);
  /* forty milliseconds of the whole world stopping. It is the difference
     between the blade going in and the blade landing. */
  if(grade===2) GS.hitstop=Math.max(GS.hitstop||0, 0.045);
  /* the sod turns over: chunky clods that arc and land, not a puff */
  const gy=groundY(A.x);
  const n = grade===2? 9:6;
  for(let i=0;i<n;i++)
    part({k:'clod', x:A.x+rnd(-5,5), y:gy-3, vx:rnd(8,46), vy:-rnd(40,110),
          life:rnd(.5,1.0), sz:1+((i%3)|0), sw:rnd(TAU)});
  for(let i=0;i<4;i++) part({k:'dust',x:A.x+rnd(-9,9),y:gy,vx:rnd(-40,10),vy:-rnd(6,22),life:rnd(.3,.6)});
  if(grade===2){
    pSpark(A.x+8, gy-14, 5, '#ffe89a');
    A.msg = A.combo>=4? L('clean line!') : L('dead on'); A.msgT=0.85;
  } else if(A.combo>=3){ A.msg=L('good'); A.msgT=0.6; }
  brushGrass(A.x, 30, 7);
  if(Math.random()<0.4) scatterBirds(A.x, 90);

  if(A.hits>=A.need){
    pl.plowed=true;
    A.out=1.5;
    AU.fix();
    toast(L('bed turned')+' · '+plowedCount()+'/'+PLOTS.length, PAL.jadeL);
    if(A.best>=A.need) { addMerit(2,true); toast('+2 '+L('merit')+' · '+L('not one skip'), PAL.goldL); }
    for(let i=0;i<18;i++)
      part({k:'clod',x:pl.x+rnd(-16,16),y:groundY(pl.x)-2,vx:rnd(-30,30),vy:-rnd(30,90),life:rnd(.5,1.1),sz:1+((i%3)|0),sw:rnd(TAU)});
    /* the birds know exactly what a turned bed means */
    setTimeout(()=>{ for(const b of BIRDS) if(Math.abs(b.x-pl.x)<260 && b.st==='perch'){
      b.st='fly'; b.vx=sign(pl.x-b.x||1)*rnd(30,60); b.vy=-rnd(30,60); b.back=rnd(1,2.5); } }, 300);
    saveGame();
  }
}
function drawPlowUI(g){
  const A=PLOW; if(!A) return;
  const bw=150, bx=W/2-bw/2, by=H-40;
  inkPanel(g, bx-8, by-12, bw+16, 30);
  /* the track, with the bite window burned into it */
  pR(g,bx,by,bw,6,'#241c2e');
  const z=plowZone();
  pR(g,bx+bw*(0.5-z),by,bw*z*2,6,'rgba(120,190,120,0.30)');
  pR(g,bx+bw*(0.5-z*0.4),by,bw*z*0.8,6,'rgba(180,240,150,0.55)');
  pR(g,bx+bw*0.5,by-2,1,10,'rgba(240,255,220,0.7)');
  const mx=bx+bw*A.m;
  pR(g,mx-1,by-3,3,12, A.flash>0? '#fff0b0' : '#e8dfc8');
  pR(g,mx,by-4,1,14,'#ffffff');
  // progress pips
  for(let i=0;i<A.need;i++){
    const px=bx+2+i*(bw-4)/A.need;
    pR(g,px,by-9,(bw-4)/A.need-2,3, i<A.hits? PAL.goldL : '#3a3248');
  }

  pTxt(g,label, W/2, by+13, A.out>0? PAL.jadeL:'#a89ec0', 6,'center');
  if(A.combo>1) pTxt(g, 'x'+A.combo, bx+bw+14, by+2, PAL.goldL, 8,'left');
  if(A.msgT>0){
    /* it lands over open field in daylight, so it needs its own dark behind it */
    g.globalAlpha=clamp(A.msgT/0.4,0,1);

    g.globalAlpha=1;
  }
  if(A.fail>0){ g.fillStyle=`rgba(160,60,50,${0.16*A.fail/0.45})`; g.fillRect(0,0,W,H); }
}
/* the plough itself, drawn in the world in front of him */

function seedShot(pl){
  P.face = pl.x<P.x? -1:1;
  preteAct('wail', 0.55);
  AU.tone(900,0.06,'square',0.03,1500);
  const sx=P.x+P.face*10, sy=P.y-52;
  SEEDS.push({x:sx,y:sy,tx:pl.x,ty:groundY(pl.x)-4,t:0,dur:0.42,pl});
}
const SEEDS=[];
function stepSeeds(dt){
  for(let i=SEEDS.length-1;i>=0;i--){
    const s=SEEDS[i]; s.t+=dt;
    const f=clamp(s.t/s.dur,0,1);
    s.x=lerp(s.x,s.tx,0); // path is computed on draw from t
    if(f>=1){
      SEEDS.splice(i,1);
      AU.tone(300,0.06,'sine',0.03,140);
      sowPlot(s.pl);
      for(let k=0;k<7;k++) part({k:'dust',x:s.tx+rnd(-6,6),y:s.ty,vx:rnd(-20,20),vy:-rnd(10,40),life:.5});
    }
  }
}
function drawSeeds(g){
  for(const s of SEEDS){
    const f=clamp(s.t/s.dur,0,1);
    const x=lerp(s.x,s.tx,f), y=lerp(s.y,s.ty,f) - Math.sin(f*Math.PI)*26;
    pEll(g,x,y,2,1.6,'#e8d8a0');
    pEll(g,x-2,y+1,1.4,1,'#c0a860');
    g.globalAlpha=0.35; pEll(g,x-4,y+2,2,1,'#e8d8a0'); g.globalAlpha=1;
  }
}
function longDraught(){
  P.gulp=3;
  P.face = JAR_X<P.x? -1:1;
  preteAct('water',1.1,()=>{
    AU.pour();
    toast(L('you are full of water'),'#8fc4e8');
    guideSay(L('Stand at the end of a row and let it go.'),7);
  });
}
function sprayRow(){
  const beds=PLOTS.filter(p=>p.plowed && p.wet<=0.05 && Math.abs(p.x-P.x)<86);
  if(!beds.length) return;
  P.gulp=Math.max(0,(P.gulp||0)-1);
  const dir = sign((beds[0].x-P.x)||1);
  P.face=dir;
  preteAct('wail',0.9);
  AU.pour(); AU.noise(0.9,0.035,300,2400);
  for(const pl of beds){
    waterPlot(pl);
    for(let i=0;i<10;i++)
      part({k:'water',x:pl.x+rnd(-12,12),y:groundY(pl.x)-26,vx:dir*rnd(10,50),vy:rnd(10,50),life:.6});
  }
  for(let i=0;i<26;i++)
    part({k:'water',x:P.x+dir*rnd(8,80),y:P.y-52+rnd(-8,8),vx:dir*rnd(60,150),vy:rnd(-20,50),life:.7});
  toast(L('the whole row, at once'),'#8fc4e8');
}

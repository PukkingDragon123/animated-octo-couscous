/* ---------- one dry bed ---------- */
function drawBed(g,pl){
  const gy=groundY(pl.x);
  if(pl.x-GS.camX<-40||pl.x-GS.camX>W+40) return;
  if(!bedOpen(pl)){
    /* the first morning draws these itself, as hardpan or as turned earth —
       two sets of bed art on the same patch of ground is one too many */
    if(pl.plowed || storyBusy()) return;
    // not yours yet: rough ground and a stake where the bed would be
    pEll(g,pl.x,gy,12,4,'#4a4436');
    for(let i=0;i<5;i++) pTaper(g,pl.x-8+i*4,gy,pl.x-9+i*4,gy-5-((i*5)%5),2,0.6,'#4f6a44');
    pR(g,pl.x+10,gy-14,2,14,'#6d5138');
    if(FARM.rented){ const bl=0.5+0.5*Math.sin(GS.t*2+pl.i);
      pR(g,pl.x+10,gy-19-bl*2,1,1,rgba('#8fc48a',0.3+0.4*bl)); }
    return;
  }
  const pop=Math.max(0,pl.pop), sw=Math.sin(pl.sway)*1.2;
  pEll(g,pl.x,gy,13,5.4,'#3d2b1c');
  pEll(g,pl.x,gy-2,12.4,5,'#7d5c3c');
  pEll(g,pl.x,gy-3.4,10.6,3.8, pl.wet>0? '#553f27':'#8f6b47');
  for(let k=0;k<5;k++) pR(g,pl.x-8+k*4,gy-4.6,2,1,pl.wet>0?'#3a2a1a':'#8d6a48');
  if(pl.fert>0) for(let k=0;k<4;k++) pR(g,pl.x-6+k*4,gy-5.4,2,1,'#5a4028');
  if(pl.wet>0 && Math.random()<0.05) part({k:'sp',x:pl.x+rnd(-7,7),y:gy-5,vx:0,vy:-6,life:.5,c:'#8fc4e8'});

  if(pl.stage===1){ pEll(g,pl.x,gy-5,3.6,2,'#5a4230'); pR(g,pl.x,gy-8,1,3,'#7fa85e'); }
  else if(pl.stage===2){
    pTaper(g,pl.x,gy-3,pl.x+sw*0.6,gy-16,2.6,1.5,'#5f9a52');
    pEll(g,pl.x+sw*0.6-3.6,gy-14,3.8,2.2,'#6fbf62');
    pEll(g,pl.x+sw*0.6+3.6,gy-16,3.8,2.2,'#5f9a52');
  } else if(pl.stage===3){
    pTaper(g,pl.x,gy-3,pl.x+sw,gy-27,3.4,1.8,'#4f8a46');
    for(let k=0;k<5;k++){ const a=Math.PI*(0.12+k*0.19), s2=k%2?1:-1;
      pEll(g,pl.x+sw*0.7+Math.cos(a)*8*s2, gy-22+Math.sin(a)*5, 4.4,2.6, k%2?'#5f9a52':'#6fbf62'); }
    const fl=Math.sin(GS.t*2.2+pl.i)*1.4;
    drawIcon(g,pl.crop,pl.x+sw,gy-34+fl,0.72);
    const bl=0.5+0.5*Math.sin(GS.t*3+pl.i);
    for(let k=0;k<3;k++){ const a=GS.t*1.6+k*2.1;
      pR(g,pl.x+sw+Math.cos(a)*9, gy-34+fl+Math.sin(a)*4, 1,1, rgba(PAL.goldL,0.3+0.5*bl)); }
  }
  if(pop>0.02){ g.globalAlpha=clamp(pop,0,1)*0.8;
    for(let k=0;k<6;k++){ const a=k/6*TAU;
      pR(g,pl.x+Math.cos(a)*(10+(1-pop)*9), gy-9+Math.sin(a)*(4+(1-pop)*4),1,1,'#e8dfc8'); }
    g.globalAlpha=1; }
  /* No little signboard on a post. Five beds in a row meant five signposts
     in a row, and the field looked like a car park. What is growing here
     shows itself when you walk up to it, and goes quiet when you leave. */
  const near = 62 - Math.abs(P.x - pl.x);
  if(near > 0 && pl.stage > 0){
    g.globalAlpha = clamp(near/20,0,1) * 0.9;
    drawIcon(g, pl.crop, pl.x, gy-30 - Math.sin(GS.t*2 + pl.i)*1.2, 0.44);
    g.globalAlpha = 1;
  }
}

/* ---------- นาข้าว ----------
   A paddy is a shallow box: an earth bund all the way round, the water
   sitting a little below the top of it, and the rice standing in that.
   Drawn flat it just looks like a row of sticks, so the bund does the
   work of telling you this is a field and not a fence. ---------- */
function drawPaddy(g,pd){
  const gy=groundY(pd.x), HW=32, D=7;          // half width, and how deep the box is
  if(pd.x-GS.camX<-80||pd.x-GS.camX>W+80) return;
  if(!padOpen(pd)){
    pEll(g,pd.x,gy-1,HW,6,'#4a4436');
    for(let i=0;i<11;i++) pTaper(g,pd.x-HW+4+i*6,gy-2,pd.x-HW+3+i*6,gy-8-((i*7)%6),2,0.6,'#4f6a44');
    pR(g,pd.x+HW-4,gy-16,2,14,'#6d5138');
    { const bl=0.5+0.5*Math.sin(GS.t*2+pd.i*1.7);
      pR(g,pd.x+HW-4,gy-21-bl*2,1,1,rgba('#8fc48a',0.3+0.4*bl)); }
    return;
  }
  const wet = pd.flood>0;
  // the sunken field, then the water or the cracked mud in it
  pR(g,pd.x-HW,gy-D,HW*2,D+3,'#3a2c1e');
  if(wet){
    pR(g,pd.x-HW+1,gy-D+2,HW*2-2,D,'#1d3a52');
    for(let i=1;i<HW*2-2;i+=3){
      const x=pd.x-HW+1+i, sh=Math.sin(GS.t*1.3+i*0.28)*0.7;
      pR(g,x,gy-D+3+sh,3,1,'#2b5f80');
    }
    // the moon lying in it, which is the whole reason to stand here at night
    pR(g,pd.x-HW*0.55,gy-D+3,HW*0.9,1,'rgba(214,236,255,0.30)');
    pR(g,pd.x-HW*0.3,gy-D+5,HW*0.5,1,'rgba(190,225,255,0.18)');
    if(Math.random()<0.05) part({k:'sp',x:pd.x+rnd(-HW,HW),y:gy-D+3,vx:0,vy:-5,life:.5,c:'#8fc4e8'});
  } else {
    pR(g,pd.x-HW+1,gy-D+2,HW*2-2,D,'#5e4d38');
    for(let i=0;i<13;i++) pR(g,pd.x-HW+4+i*5,gy-D+3+((i%3)),4,1,'#43372a');
  }
  const sw=Math.sin(pd.sway)*1.2;
  /* the rice, painted once per stage and blitted — the whole field swaying as
     one block is what a rice field does in wind anyway */
  if(pd.stage>0){
    baked(g,'rice'+pd.stage, pd.x+sw, gy-D+3, HW*2+10, 36, HW+5, 34,
          (gg,ax,ay)=>paintRice(gg,ax,ay,pd.stage));
    if(pd.stage===3){
      const bl=0.5+0.5*Math.sin(GS.t*2.6+pd.i);
      for(let k=0;k<5;k++){ const a=GS.t*1.2+k*1.3;
        pR(g,pd.x+Math.cos(a)*22, gy-D-28+Math.sin(a)*6, 1,1, rgba('#ffe89a',0.3+0.5*bl)); }
    }
  }
  // the bund, drawn last so the rice grows out of behind it
  pR(g,pd.x-HW-4,gy-D,HW*2+8,4,'#7a6a4c');
  pR(g,pd.x-HW-4,gy-D,HW*2+8,1,'#9a8a68');
  pR(g,pd.x-HW-4,gy-D+3,HW*2+8,3,'#54452f');
  for(let i=0;i<7;i++) pTaper(g,pd.x-HW+i*11,gy-D,pd.x-HW+i*11-1,gy-D-4,1.6,0.6,'#4f6a44');
  if(pd.pop>0.02){ g.globalAlpha=clamp(pd.pop,0,1)*0.7;
    for(let k=0;k<9;k++){ const a=k/9*TAU;
      pR(g,pd.x+Math.cos(a)*(22+(1-pd.pop)*14), gy-D-8+Math.sin(a)*(5+(1-pd.pop)*4),1,1,'#dff0ff'); }
    g.globalAlpha=1; }
  // same here: no post, just the rice showing itself as you come near
  const nearP = 86 - Math.abs(P.x - pd.x);
  if(nearP > 0){
    g.globalAlpha = clamp(nearP/24,0,1) * 0.9;
    drawIcon(g,'rice', pd.x, gy-D-20 - Math.sin(GS.t*2)*1.2, 0.44);
    g.globalAlpha = 1;
  }
}

/* ---------- a fruit tree ----------
   These are the slowest thing on the farm and they have to look like it:
   a proper trunk, a crown you could stand under, and each kind its own
   silhouette so you can tell the orchard apart at a glance. ---------- */
const TREE_LOOK = {
  durian:     { leaf:'#2b5a38', dark:'#1e4429', lit:'#3f7a4c', H:96, CW:20, CH:26, tall:1 },
  mangosteen: { leaf:'#204a34', dark:'#163726', lit:'#356b47', H:74, CW:24, CH:20, tall:0 },
  rambutan:   { leaf:'#2f6a42', dark:'#215030', lit:'#4a8f58', H:70, CW:28, CH:17, tall:0 },
};
function drawFruitTree(g,tr){
  const gy=groundY(tr.x);
  if(tr.x-GS.camX<-70||tr.x-GS.camX>W+70) return;
  if(!treeOpen(tr)){
    pEll(g,tr.x,gy,9,4,'#4a3524'); pEll(g,tr.x,gy-1,7,3,'#3a2a1a');
    pR(g,tr.x+8,gy-12,2,12,'#6d5138');
    return;
  }
  if(!tr.crop){
    pEll(g,tr.x,gy,11,4.6,'#4a3524'); pEll(g,tr.x,gy-1,9,3.6,'#2e2114');
    for(let i=0;i<4;i++) pR(g,tr.x-7+i*4,gy-3,3,1,'#5f4630');
    const bl=0.5+0.5*Math.sin(GS.t*2+tr.i);
    pR(g,tr.x,gy-15-bl*2,1,1,rgba('#8fc48a',0.3+0.4*bl));
    // a spade left leaning in the hole, so it reads as waiting, not abandoned
    pTaper(g,tr.x+7,gy-2,tr.x+11,gy-19,2,1.6,'#7d5a3c');
    pR(g,tr.x+10,gy-23,3,5,'#8a8f9e');
    return;
  }
  const T=TREE_LOOK[tr.crop]||TREE_LOOK.rambutan;
  /* a whole tree is four hundred scanline shapes and it is the same four
     hundred every frame; bake it per kind and per how much fruit is on it */
  const q = tr.grow>=1? 9 : Math.round(tr.grow*8);
  baked(g,'tree|'+tr.crop+'|'+q+'|'+tr.fruit, tr.x, gy,
        T.CW*3.4+24, T.H+T.CH*2.4+16, (T.CW*3.4+24)/2, T.H+T.CH*2.4+15,
        (gg,ax,ay)=>paintTree(gg,ax,ay,tr,T));
  if(tr.grow>=1 && tr.fruit>0){
    const cy=gy-(12+(T.H-12)), bl=0.5+0.5*Math.sin(GS.t*2.4+tr.i);
    for(let m=0;m<4;m++){ const a=GS.t*1.3+m*1.6;
      pR(g,tr.x+Math.cos(a)*(T.CW+6), cy+Math.sin(a)*(T.CH+4), 1,1, rgba(PAL.goldL,0.3+0.5*bl)); }
  }
  if(tr.pop>0.02){ g.globalAlpha=clamp(tr.pop,0,1)*0.8;
    for(let m=0;m<7;m++){ const a=m/7*TAU;
      pR(g,tr.x+Math.cos(a)*(T.CW+2+(1-tr.pop)*12), gy-T.H*0.6+Math.sin(a)*(T.CH+2+(1-tr.pop)*8),1,1,'#e8dfc8'); }
    g.globalAlpha=1; }
  // the name board at the foot of the tree, which does not sway with it
  pR(g,tr.x+10,gy-12,2,12,'#7d5a3c');
  pR(g,tr.x+6,gy-22,11,10,'#3b2412');
  pR(g,tr.x+7,gy-21,9,8,'#c9a468'); pR(g,tr.x+7,gy-21,9,1,'#e2c48c');
  drawIcon(g,tr.crop,tr.x+11.5,gy-17,0.4);
}
/* one paddy's worth of rice, drawn upright — the sway is applied to the blit,
   because a rice field leans as one sheet and not stalk by stalk */
/* the standing parts of the pen. wx/wgy are where it really is, so the posts
   can still follow the ground the way they did when this was drawn live */
function paintPen(g,x,gy,wx,wgy){
  for(let dx=-32; dx<=32; dx+=13){
    const dy=groundY(wx+dx)-wgy;
    pR(g,x+dx,gy+dy-20,2,20,'#6d5138'); pR(g,x+dx,gy+dy-20,1,20,'#856448');
  }
  pR(g,x-32,gy-18,66,2,'#5d4735'); pR(g,x-32,gy-18,66,1,'#7a5c44');
  pR(g,x-32,gy-10,66,2,'#54402f');
  // the hurricane lamp on the corner post, minus its flame
  pR(g,x+34,gy-34,1,4,'#4a3a2a');
  pEll(g,x+34,gy-28,3.4,4.4,'#3b2412');
  // the coop
  pR(g,x+16,gy-24,18,14,'#7d5a3c'); pR(g,x+16,gy-24,18,2,'#9c7551');
  pR(g,x+21,gy-16,7,6,'#241a14');
  pTri(g,x+25,gy-32,x+14,gy-24,x+36,gy-24,'#5d4030');
  // straw on the ground
  for(let i=0;i<12;i++) pR(g,x-30+i*5,gy-1,4,1, i%2?'#c9a86a':'#a8863f');
}
function paintRice(g,x,gy,stage){
  const HW=32;
  if(stage===1){
    for(let i=0;i<22;i++){ const px=x-HW+4+i*2.8, o=((i*7)%3)-1;
      pTaper(g,px,gy,px+o,gy-8,1.5,0.9,'#5f9a58'); }
  } else if(stage===2){
    for(let i=0;i<26;i++){ const px=x-HW+3+i*2.4, h=13+((i*7)%6), o=((i*5)%3)-1;
      pTaper(g,px,gy,px+o,gy-h,2,0.9,'#3f7a46');
      pTaper(g,px+o,gy-h,px+o-3,gy-h+5,1.6,0.8,'#6fbf62');
      pTaper(g,px+o,gy-h,px+o+3,gy-h+6,1.5,0.7,'#4f9256'); }
  } else if(stage===3){
    for(let i=0;i<26;i++){ const px=x-HW+3+i*2.4, h=17+((i*7)%6), o=((i*5)%3)-1;
      pTaper(g,px,gy,px+o,gy-h,2.2,1,'#9a8a3a');
      // the head is heavy and bows over, which is how you know it is ready
      pTaper(g,px+o,gy-h,px+o+4,gy-h+7,2.6,1.2,'#d8bc52');
      for(let k=0;k<4;k++) pEll(g,px+o+1.2+k*1,gy-h+1.8+k*1.7,1.4,1.1,'#f2dc86'); }
  }
}
function paintTree(g,x,gy,tr,T){
  const k=tr.grow;
  const H = 12 + k*(T.H-12);
  const CW = 5 + k*(T.CW-5), CH = 4 + k*(T.CH-4);
  const cx = x, cy = gy-H;
  pEll(g,x,gy,7+k*7,3.6,'#42301f');
  pTaper(g,x,gy+1,x-6-k*5,gy-1,5,2,'#4a3524');
  pTaper(g,x,gy+1,x+6+k*5,gy-1,5,2,'#3d2a1a');
  pTaper(g,x,gy,cx,cy+CH*0.4, 3+k*5, 2+k*2.4,'#5a4436');
  pTaper(g,x+1.4,gy,cx+1.4,cy+CH*0.5, 1.4+k*1.6,1,'#6d5442');
  pTaper(g,x-1.6,gy,cx-1.6,cy+CH*0.5, 1.2+k*1.2,1,'#43301f');
  if(k<0.6){
    for(let i=0;i<5;i++) pEll(g,cx+((i%2)?4:-4),cy+i*3.4,4.4,2.6, i%2?T.leaf:T.lit);
    return;
  }
  for(let i=0;i<4;i++){ const a=Math.PI*(0.22+i*0.19);
    pTaper(g,cx,cy+CH*0.5, cx-Math.cos(a)*CW*0.7, cy-Math.sin(a)*CH*0.3, 3,1.4,'#4a3524'); }
  const blobs=[];
  if(T.tall){
    for(let r=0;r<4;r++){ const w=CW*(1-r*0.2), yy=cy-r*CH*0.36;
      for(let i=0;i<5;i++) blobs.push({x:cx+(i-2)*w*0.42, y:yy+((i%2)?2:-2), r:CH*0.44}); }
    blobs.push({x:cx, y:cy-CH*1.5, r:CH*0.4});
  } else {
    for(let i=0;i<11;i++){ const a=i/11*TAU;
      blobs.push({x:cx+Math.cos(a)*CW*0.72, y:cy+Math.sin(a)*CH*0.72, r:CH*0.62}); }
    for(let i=0;i<6;i++){ const a=i/6*TAU+0.5;
      blobs.push({x:cx+Math.cos(a)*CW*0.34, y:cy+Math.sin(a)*CH*0.32, r:CH*0.6}); }
  }
  for(const b of blobs) pEll(g,b.x,b.y,b.r*1.25,b.r,T.dark);
  for(const b of blobs) pEll(g,b.x,b.y-b.r*0.16,b.r*1.08,b.r*0.84,T.leaf);
  for(let i=0;i<blobs.length;i+=2){ const b=blobs[i];
    pEll(g,b.x-b.r*0.24,b.y-b.r*0.36,b.r*0.6,b.r*0.42,T.lit); }
  // leaf speckle, which is what makes a canopy read as leaves
  for(let i=0;i<70;i++){
    const a=(i*2.399)%TAU, rr=Math.sqrt((i%11)/11);
    pR(g, cx+Math.cos(a)*CW*rr*1.15, cy+Math.sin(a)*CH*rr*1.15 - (T.tall? CH*0.5:0),
       1,1, i%3? T.lit : shade(T.leaf,0.22));
  }
  for(let i=0;i<tr.fruit;i++){
    const a=1.0+i*1.45;
    const fx=cx+Math.cos(a)*CW*0.66, fy=cy+CH*0.5+Math.abs(Math.sin(a))*CH*0.45;
    pR(g,fx,fy-7,1,6,'#3a2a1a');
    drawIcon(g,tr.crop,fx,fy,0.8);
  }
}
/* ============================================================
   THE FIRST FIELD

   The game used to open in a graveyard with a village to
   understand. It opens here now: one paddy, one barn, one water
   jar, and a rice spirit standing in the mud who will not let
   you leave until the field is sown. Everything else in the
   game is reachable afterwards and none of it is explained
   until you need it.
   ============================================================ */

/* ---------- where things stand ---------- */
/* The barn, the water jar and the chopping log stand together on the track
   just outside the gate, which is where a Thai smallholding puts them — that
   is the side the cart can reach. Laid out so no two prompts overlap: the
   farmyard proper is already shoulder to shoulder from the gate to the beds
   and there is nowhere in it to put three more things. */
const LOG_X   = 736;                 // a fallen trunk and a chopping stump
const BARN_X  = 840;                 // the rice barn, ยุ้งข้าว
const JAR_X   = 884;                 // the โอ่ง, under the house's own stilts
/* She stands on the bund at the head of the first paddy — far enough west
   that her prompt and the paddy's do not fight over the same ground, which
   they did when she stood in the middle of it. And while the lesson is
   running she drifts along the bund towards you, so the one character who
   explains the game can never end up somewhere you cannot tap. */
const POSOP_X = PADDY_XS[0] - 49;
const POSOP_A = POSOP_X - 46, POSOP_B = POSOP_X + 22;
const MIST_X  = 1466;                // the road east, until the rice is in

/* Mae Posop lends you the first paddy before any landlord is involved,
   which is why the farm has something to do in it from the first second. */
const farmActive = ()=> FARM.rented || FARM.rice;

/* ---------- water you carry ---------- */
const waterCap = ()=> has('can') ? 5 : 2;
function waterFill(){
  if(GS.water >= waterCap()){ guideSay('You are carrying all you can.'); AU.blip(); return; }
  P.face = JAR_X < P.x ? -1 : 1;
  preteAct('water', 1.0, ()=>{
    GS.water = waterCap();
    AU.pour();
    for(let k=0;k<16;k++) part({k:'water',x:JAR_X+rnd(-5,5),y:groundY(JAR_X)-20,vx:rnd(-10,10),vy:rnd(14,44),life:.5});
    toast(L('water')+' '+GS.water+'/'+waterCap(),'#8fc4e8');
    if(!GS.seen.filled){ GS.seen.filled=true;
      guideSay('The jar\'s never empty. It\'s the walk that costs you.',8); }
    posopCheck(); saveGame();
  });
}
function waterTake(n){
  if((GS.water|0) < n) return false;
  GS.water -= n; return true;
}
function noWater(){
  guideSay('No water left. The โอ่ง is the big jar by the house.');
  AU.blip();
}

/* ---------- the barn ---------- */
/* It holds the seed, and the tools you have earned hang on the wall of it,
   so the skill tree has somewhere in the world to show up. */
function barnPrompt(){
  return (GS.bag.seed||0) > 0 ? 'the seed sack is full enough' : 'take seed from the barn';
}
function useBarn(){
  if((GS.bag.seed||0) > 0){ guideSay('You have seed. Put it in the ground.'); AU.blip(); return; }
  P.face = BARN_X < P.x ? -1 : 1;
  preteAct('pick', 0.9, ()=>{
    bagAdd('seed', has('sickle')?3:2, true);
    AU.ranat(700,0,0.05);
    pPop(BARN_X, groundY(BARN_X)-22, '#c9a86a');
    toast('+'+(has('sickle')?3:2)+' '+L('a handful of seed'),'#c9a86a');
    if(!GS.seen.barn){ GS.seen.barn=true;
      guideSay('Some of what you cut goes back in the sack. A field keeps itself.',8); }
    posopCheck(); saveGame();
  });
}

/* ---------- the house, put up plank by plank ---------- */
const HOUSE_STAGES = [
  { n:'mend the roof',    sub:'there is sky where there should be thatch', wood:6,  cost:30 },
  { n:'board the walls',  sub:'and a shutter that closes',                 wood:9,  cost:55 },
  { n:'lay a proper floor', sub:'somebody could live here again',          wood:12, cost:80 },
];
const houseStage = ()=> Math.max(0, Math.min(3, Math.round(FARM.house)));
function buildHouse(){
  const st = houseStage();
  if(st >= 3){ guideSay('The house is finished. It\'s a better house than the one you had.'); return; }
  const s = HOUSE_STAGES[st];
  if(!bagHas('wood', s.wood)){ toast(L('you need')+' '+s.wood+' '+L('planks'),'#a8392c'); AU.blip(); return; }
  if((GS.baht|0) < s.cost) return tooPoor(s.cost);
  bagTake('wood', s.wood); pay(s.cost);
  FARM.house = st + 1;
  AU.fix(); GS.state='play'; CNT=null;
  toast(L(s.n)+' — '+L('done'), PAL.jadeL);
  addMerit(2);
  if(!GS.seen.builtHouse){ GS.seen.builtHouse=true; vignette('firstPlank'); }
  else if(FARM.house>=3) vignette('houseDone');
  saveGame();
}

/* ============================================================
   MAE POSOP — แม่โพสพ, the rice mother

   Thai farmers have apologised to her for centuries: for
   dropping a grain, for stepping on a sheaf, for cutting when
   she was pregnant with the ear. She is not a quest-giver. She
   is standing in your field because it is her field too, and
   she teaches the way somebody teaches who has done it every
   year since before there were years.
   ============================================================ */
const POSOP = { x:POSOP_X, y:0, anim:0, bob:0, face:-1, met:false, bub:null, bubT:0, wave:0, sheaf:0 };

/* the lesson, in the order a field actually happens */
const RICE_STEPS = [
  { id:'seed',  at:()=>BARN_X,
    say:'Seed first. Sack of it in your barn.',
    tip:'the barn, by the gate',
    done:()=>(GS.bag.seed||0)>0 },
  { id:'water', at:()=>JAR_X,
    say:'Now water. The โอ่ง by the house never runs dry.',
    tip:'the water jar by the house',
    done:()=>(GS.water|0)>0 },
  { id:'sow',   at:()=>PADDY_XS[0],
    say:'Let the water in, then the seed. Gently. It\'s somebody.',
    tip:'the paddy',
    done:()=>PADDIES[0] && PADDIES[0].stage>0 },
  { id:'wait',  at:()=>POSOP_X,
    say:'Now nothing. Keep the water up and leave it.',
    tip:'wait — and keep the water up',
    done:()=>PADDIES[0] && PADDIES[0].stage>=3 },
  { id:'cut',   at:()=>PADDY_XS[0],
    say:'It\'s bowing. That\'s it asking. Cut it, and say thank you.',
    tip:'cut the rice',
    done:()=>(GS.q.rice||0)>0 },
];
const riceStep = ()=> RICE_STEPS[Math.min(GS.rice0|0, RICE_STEPS.length-1)];
const riceDone = ()=> (GS.rice0|0) >= RICE_STEPS.length;

/* Called after anything that might have finished a step. It winds forward as
   far as the field actually is, rather than one step at a time: harvesting a
   paddy resets its stage, so a player who sowed and cut between two checks
   would otherwise leave the lesson stuck on a step already behind them. */
function posopCheck(){
  if(!POSOP.met || riceDone()) return;
  /* Scan from the LAST step backwards: the furthest thing that has
     demonstrably happened is where the lesson really is. Going forwards one
     at a time gets stuck, because cutting a paddy resets its stage and the
     'keep the water up' step can never be true again afterwards. */
  const was = GS.rice0|0;
  for(let i=RICE_STEPS.length-1; i>=was; i--){
    if(RICE_STEPS[i].done()){ GS.rice0 = i+1; break; }
  }
  if((GS.rice0|0) === was) return;
  saveGame();
  if(riceDone()){
    posopSay('That\'s a crop. Road east is yours — the village eats what you cut.', 9);
    addMerit(5); toast(L('+5 merit')+' · '+L('the rice is in'), PAL.goldL);
    vignette('riceLesson');
    return;
  }
  const n = riceStep();
  posopSay(n.say, 8);
  AU.ranat(720,0,0.05);
}
function posopSay(t, d=7){ POSOP.bub=L(t); POSOP.bubT=d; POSOP.bubMax=d; AU.blip(); }
function talkPosop(){
  if(!POSOP.met){
    POSOP.met=true; GS.rice0=0; saveGame();
    say([{e:'calm', w:'Mae Posop',t:'There you are. Somebody walking on my field with no idea what it\'s for.'},
         {w:'You',      t:'(You try to answer. It comes out as a thin whistle.)'},
         {e:'calm', w:'Mae Posop',t:'I know what you are. Hungry, hollow, and no use to anyone yet.'},
         {e:'cross', w:'Mae Posop',t:'I\'m Mae Posop. Rice is mine. This paddy\'s stood empty two years.'},
         {e:'warm', w:'Mae Posop',t:'You can\'t eat. Good. Then you won\'t keep any of it.'},
         {e:'warm', w:'Mae Posop',t:'Work my field and I\'ll teach you all of it.'},
         {w:'',          t:'You have nothing else, and she\'s offering you a season.'}],
      ()=>{ addMerit(3); toast(L('+3 merit')+' · '+L('the rice mother'), PAL.goldL);
            vignette('metPosop');
            posopSay(riceStep().say, 9); });
    return;
  }
  if(riceDone()){
    say([{w:'Mae Posop',t:pick([
      'Water\'s where it should be. Nothing to correct, which is unusual.',
      'They used to carry me out of the field like a bride. Now they use a machine.',
      'Don\'t step on a fallen ear. Pick it up. Every one waited.',
      'You grew what you can\'t eat and gave it away. That\'s the ledger.'])}]);
    return;
  }
  const s = riceStep();
  say([{w:'Mae Posop',t:s.say}], ()=>posopSay(s.say,7));
}

/* she hovers a hand's width off the water, and her reflection is in it */
function stepPosop(dt){
  POSOP.anim += dt;
  // while she is still teaching, she comes to meet you along the bund
  /* She stops forty-two pixels short, on whichever side of you she is
     already standing. The offset used to be worked out from her HOME side
     rather than her current one, so when she had come round to your east she
     walked straight past you and ended up fourteen pixels away — close
     enough to take over the prompt you were standing on. */
  const side = POSOP.x > P.x ? 1 : -1;
  const tx = (POSOP.met && !riceDone() && Math.abs(P.x-POSOP_X)<150)
           ? clamp(P.x + side*42, POSOP_A, POSOP_B)
           : POSOP_X;
  POSOP.x = lerp(POSOP.x, tx, 1-Math.pow(0.22,dt));
  POSOP.y = groundY(POSOP.x) - 10 + Math.sin(POSOP.anim*0.9)*2.2;
  POSOP.sheaf = Math.sin(POSOP.anim*0.7)*0.5;
  if(POSOP.bubT>0) POSOP.bubT -= dt; else POSOP.bub=null;
  if(POSOP.wave>0) POSOP.wave -= dt;
  POSOP.face = P.x < POSOP.x ? -1 : 1;
  if(!POSOP.met && Math.abs(P.x-POSOP.x)<190 && !DLG && !VIG && GS.state==='play'){
    if(!GS.seen.posopSpotted){ GS.seen.posopSpotted=true;
      guideSay('Somebody is standing in the water. Longer than the farm has.',8); }
  }
  if(Math.random() < dt*2.2){
    part({k:'sp', x:POSOP.x+rnd(-16,16), y:POSOP.y+rnd(-18,10),
          vx:rnd(-5,5), vy:rnd(-11,-3), life:rnd(.8,1.6), c:'#ffe89a'});
  }
}

/* ---------- Mae Posop, drawn ----------
   She is thirty-eight pixels from the water to her circlet — villager
   height, a bit over a third of the prete, and the gap is the point.

   At that size detail fights the silhouette and loses, so this is
   deliberately five readable shapes and nothing else: dark hair, a cream
   face, a green sarong that runs out into the water, one gold sash across
   it, and a sheaf of gold rice held low at her hip. An earlier pass had a
   hair tail, pleats, three-quarter shading and eight ears of rice fanning
   past her ear, and all of it came out as a smudge with a bag on it.
   ---------- */
function drawPosop(g, o={}){
  /* She was the one thing in here without a camera cull, so a couple of
     hundred shapes and a radial glow were being drawn for her on every frame
     of the game, in every zone, whether or not she was within a mile of the
     screen. It cost five frames a second everywhere. */
  if(!o.s && (POSOP.x-GS.camX < -60 || POSOP.x-GS.camX > W+60)) return;
  const x=R(POSOP.x), y=R(POSOP.y), t=POSOP.anim, f=POSOP.face;
  const S = o.s||1;
  const SKIN='#f4e2b6', SKD='#d2b986';
  const CLOTH='#3f7a52', CLD='#28563a';
  const GOLD='#f2d075', GOLDL='#fff0b8';
  const HAIR='#1c1626';
  if(S!==1){ g.save(); g.translate(x,y); g.scale(S,S); g.translate(-x,-y); }

  // her light, and what it does to the water under her
  drawGlow(g, x, y-20, 42, '#ffe6a0', 0.17+0.05*Math.sin(t*1.6));
  pEll(g, x, y+3, 12, 2.8, 'rgba(255,232,160,0.20)');
  pEll(g, x, y+2, 7, 1.8, 'rgba(255,244,208,0.15)');

  // no feet — the hem runs out into the standing water
  for(let i=0;i<7;i++){
    const tt=i/6, ww=lerp(9,4,tt);
    pR(g, x-ww/2, y+2-i, ww, 1, rgba(tt>0.5?CLD:CLOTH, 1-tt*0.82));
  }
  // the sarong: one clean tube, hem a little wider, gold at the waist
  for(let i=0;i<11;i++){
    const tt=i/10, ww=lerp(7,9.5,tt);
    pR(g, x-ww/2, y-13+i, ww, 1, tt>0.88? CLD : CLOTH);
    pR(g, x+ww/2-2, y-13+i, 2, 1, CLD);
  }
  pR(g, x-4.5, y-14, 9, 2, GOLD); pR(g, x-4.5, y-14, 9, 1, GOLDL);

  // torso, and the far arm open at her side
  oEll(g, x, y-19, 4.2, 5.2, SKIN, SKD);
  pTaper(g, x+3*f, y-22, x+8*f, y-18, 2.6, 2, SKD);
  pEll(g, x+9*f, y-18, 1.9, 1.8, SKD);

  // one gold sash, thin, over the near shoulder
  pTaper(g, x-3.6*f, y-24, x+3.4*f, y-15, 2.2, 1.6, GOLD);
  pR(g, x-3*f, y-24, 2, 1, GOLDL);

  /* the sheaf, held low at the near hip so it never crowds her face. Six
     short ears, all bowing the way ripe rice bows. */
  const sx = x - 6*f, sy = y-17 + POSOP.sheaf*0.6;
  pTaper(g, x-2.6*f, y-22, sx, sy-1, 2.6, 2.2, SKIN);
  pEll(g, sx, sy, 1.9, 1.7, SKIN);
  for(let i=0;i<6;i++){
    const a = -1.35 + i*0.17, len = 8 + ((i*5)%3);
    const ex = sx + Math.cos(a)*len*-f, ey = sy - 2 + Math.sin(a)*len;
    pTaper(g, sx, sy-2, ex, ey, 1.5, 0.9, '#a8933f');
    pTaper(g, ex, ey, ex-1.6*f, ey+2.6, 2, 1, '#e8cf62');
    for(let k=0;k<2;k++) pEll(g, ex-(0.7+k*0.8)*f, ey+1+k*1.1, 1.1, 0.9, '#f6e79a');
  }
  pR(g, sx-2, sy-3, 4, 2, '#c0392f');            // the red thread

  // head: hair mass, then the face on top of it, then a low fringe
  const hy = y-30;
  pEll(g, x, hy+1, 5.6, 5.8, HAIR);
  oEll(g, x, hy, 4.6, 5, SKIN, SKD);
  pEll(g, x+1.9*f, hy+0.6, 2.2, 3.4, SKD);
  pEll(g, x, hy-3.4, 4.2, 1.7, HAIR);
  pEll(g, x-1.3*f, hy-3.8, 1.7, 0.9, '#3a3050');
  pEll(g, x-1.3*f, hy-0.2, 1, 1.2, '#2a2138');
  pEll(g, x+1.7*f, hy-0.2, 0.9, 1.1, '#2a2138');
  pR(g, x-1.6*f, hy-0.9, 1, 1, '#fff');
  pR(g, x+1.4*f, hy-0.9, 1, 1, '#fff');
  pEll(g, x+0.3*f, hy+2.1, 1.5, 0.8, '#b4566a');
  pEll(g, x-3*f, hy+1, 1.1, 0.7, '#e8a0ae');
  // circlet, and one jasmine over the near ear
  pR(g, x-4.6, hy-4.6, 9, 2, GOLD); pR(g, x-4.6, hy-4.6, 9, 1, GOLDL);
  pTaper(g, x, hy-5.6, x, hy-8, 1.6, 0.8, GOLDL);
  pEll(g, x-4.4*f, hy-1, 1.4, 1.2, '#f6f0dc');
  pEll(g, x-4.4*f, hy+1, 1.2, 1, '#fffaf0');

  // grains going round her, because some always falls
  for(let i=0;i<5;i++){
    const a = t*0.5 + i*1.26;
    pEll(g, x+Math.cos(a)*11, y-22+Math.sin(a)*6, 1.1, 0.9,
         rgba(GOLDL, 0.3+0.4*Math.sin(t*2+i)));
  }
  if(S!==1) g.restore();
}

/* ============================================================
   THE BARN, THE JAR AND THE LOG, DRAWN

   All three are static, so all three are baked once and blitted
   from then on, the same as the rest of the farm.
   ============================================================ */
function drawBarn(g){
  const x=BARN_X, gy=groundY(x);
  if(x-GS.camX<-70||x-GS.camX>W+70) return;
  const tools = (has('sickle')?1:0)|(has('can')?2:0)|(has('net')?4:0)|(has('axe')?8:0);
  baked(g,'barn'+tools+((GS.bag.seed||0)>0?'s':''), x, gy, 52, 84, 26, 78,
        (gg,ax,ay)=>paintBarn(gg,ax,ay,tools,(GS.bag.seed||0)>0));
  // a lamp under the eaves, live so it flickers
  if(farmActive()){
    const fl=0.86+0.14*Math.sin(GS.t*2.9+1.1);
    drawGlow(g,x+14,gy-52,34,'#ffce7c',0.26*fl);
    pEll(g,x+14,gy-54,2.6,3.4,rgba('#ffd27a',fl));
  }
  if((GS.bag.seed||0)===0 && farmActive()){
    const bl=0.5+0.5*Math.sin(GS.t*2.4);
    pR(g,x+9,gy-24-bl*2,1,1,rgba(PAL.goldL,0.4+0.5*bl));
  }
}
function paintBarn(g,x,gy,tools,hasSeed){
  const W1='#8a6142', W2=shade(W1,-0.22), ROOF='#6e5d33';
  // a low open-fronted barn: four posts, a plank back wall, a thatch roof
  /* A ยุ้งข้าว stands clear of the ground on four posts, so the rats and the
     wet cannot get at the crop. That gap under the floor is most of what
     makes it read as a granary and not a shed. */
  for(const px of [x-16,x-5,x+5,x+14]){
    pR(g,px,gy-20,3,20,'#4a3728'); pR(g,px,gy-20,1,20,'#5f4a37');
    pR(g,px-1,gy-2,5,2,'#6d6b62');
  }
  pR(g,x-20,gy-24,40,5,'#5f4a37'); pR(g,x-20,gy-24,40,1,'#7d6449');
  pR(g,x-18,gy-46,36,22,W1);
  for(let y=gy-43;y<gy-24;y+=4) pR(g,x-18,y,36,1,W2);
  pR(g,x+10,gy-46,8,22,shade(W1,-0.2));
  pR(g,x-18,gy-46,3,22,shade(W1,0.08));
  // the hatch you reach in through, propped open
  pR(g,x-5,gy-40,11,13,'#2c2018'); pR(g,x-4,gy-39,9,11,'#241a14');
  pTaper(g,x+6,gy-40,x+13,gy-44,2,1.4,'#7d5a3c');
  // a short ladder up to it
  for(let i=0;i<4;i++) pR(g,x-11,gy-20+i*5,9,2,'#7d6449');
  pTaper(g,x-12,gy-24,x-13,gy-1,2,2,'#5f4a37');
  pTaper(g,x-2,gy-24,x-3,gy-1,2,2,'#4a3728');
  // thatch, in overlapping courses
  for(let i=0;i<6;i++){
    const t=i/5, yy=lerp(gy-46,gy-62,t), ww=lerp(44,16,t);
    pR(g,x-ww/2,yy-3,ww,5, i%2? shade(ROOF,-0.18):ROOF);
    pR(g,x-ww/2,yy-3,ww,1, shade(ROOF,0.16));
    for(let k=0;k<ww;k+=5) pR(g,x-ww/2+k,yy+1,2,1, shade(ROOF,-0.3));
  }
  pR(g,x-23,gy-47,46,3,shade(ROOF,-0.3));
  pTaper(g,x-1,gy-62,x-5,gy-68,3,1,'#7d6449');
  pTaper(g,x+1,gy-62,x+5,gy-68,3,1,'#7d6449');
  /* the seed sack, open, with a scoop standing in it. When you are carrying
     seed the sack sits slack and lower, so the barn tells you at a glance
     whether there is any point walking over to it. */
  /* the seed sack stands on the ground by the ladder. Slack and low when you
     are already carrying seed, so the barn tells you at a glance whether
     there is any point walking over. */
  const sh = hasSeed? 4 : 0;
  pEll(g,x+9,gy-1,6,2.8,'#3a2b20');
  pR(g,x+4,gy-15+sh,11,14-sh,'#c9b085'); pR(g,x+4,gy-15+sh,11,2,'#e0cb9e');
  pEll(g,x+9,gy-15+sh,5.5,2.4,'#8a7458');
  if(!hasSeed){
    pEll(g,x+9,gy-16,4.6,1.9,'#d8bc7a');
    for(let i=0;i<5;i++) pEll(g,x+6+i*1.5,gy-16.6+((i%2)),1.1,0.9,'#f0dfae');
    pTaper(g,x+12,gy-17,x+15,gy-26,2,1.6,'#7d5a3c');
  } else pEll(g,x+9,gy-11.4,4,1.5,'#6b5940');
  // baskets and a coil of rope, because a barn is never tidy
  pEll(g,x-13,gy-2,5,2.4,'#3a2b20');
  pR(g,x-18,gy-11,9,9,'#c2a86a'); pR(g,x-18,gy-11,9,2,'#dcc48c');
  for(let i=0;i<3;i++) pR(g,x-18,gy-8+i*3,9,1,'#9a8452');
  // and the tools you have earned, hung on the back wall
  if(tools&1){ // sickle
    pTaper(g,x+8,gy-42,x+9,gy-37,2,1.6,'#7d5a3c');
    for(let i=0;i<7;i++){ const a=Math.PI*(0.15+i*0.11);
      pR(g,x+9+Math.cos(a)*5, gy-42+Math.sin(a)*5, 1,1, i%2?'#c8cdd8':'#9aa0aa'); }
  }
  if(tools&2){ // watering can
    pR(g,x+11,gy-42,6,6,'#8a8f9e'); pR(g,x+11,gy-42,6,2,'#b4b8c6');
    pTaper(g,x+17,gy-41,x+20,gy-43,2,1.4,'#8a8f9e');
    pR(g,x+12,gy-44,2,2,'#6f7484');
  }
  if(tools&4){ // bug net
    pR(g,x-10,gy-44,1,12,'#a08464');
    for(let i=0;i<12;i++){ const a=i/12*TAU;
      pR(g,x-10+Math.cos(a)*4.4, gy-46+Math.sin(a)*4.4, 1,1,'#cfc4a8'); }
    pEll(g,x-10,gy-46,3.4,3.4,'rgba(240,236,220,0.30)');
  }
  if(tools&8){ // axe
    pTaper(g,x+1,gy-34,x+3,gy-45,2,1.8,'#7d5a3c');
    pTri(g,x+3,gy-46,x+8,gy-43,x+2,gy-41,'#9aa0aa');
    pTri(g,x+3,gy-46,x+7,gy-44,x+3,gy-42,'#c8cdd8');
  }
}

/* the โอ่ง — a Thai water jar, waist-high, glazed, with a coconut ladle */
function drawJar(g){
  const x=JAR_X, gy=groundY(x);
  if(x-GS.camX<-50||x-GS.camX>W+50) return;
  baked(g,'ong', x, gy, 44, 48, 22, 44, paintJar);
  // the water in the mouth of it catches the sky, and that has to move
  const sh=Math.sin(GS.t*1.1)*0.5;
  pEll(g,x,gy-25+sh,7.5,3,'rgba(60,120,160,0.85)');
  pEll(g,x-2,gy-26+sh,4,1.6,'rgba(150,205,240,0.55)');
  pR(g,x-4,gy-25.5+sh,3,1,'rgba(225,246,255,0.5)');
  if(Math.random()<0.02) part({k:'sp',x:x+rnd(-5,5),y:gy-26,vx:0,vy:-6,life:.5,c:'#8fc4e8'});
}
function paintJar(g,x,gy){
  // the body: a fat ovoid, widest a third of the way up
  for(let i=0;i<26;i++){
    const t=i/25;
    const rr = 8 + Math.sin(Math.pow(t,0.75)*Math.PI)*5.4;
    pR(g, x-rr, gy-26+i, rr*2, 1, mix('#7a4527','#b5764e', 0.25+0.5*Math.sin(t*Math.PI)));
  }
  pEll(g,x, gy-1, 12, 4, '#5a3a22');
  // the glaze highlight down the near side, which is what makes it read as clay
  for(let i=0;i<18;i++){ const t=i/17;
    pR(g, x-9+Math.sin(t*Math.PI)*1.4, gy-22+i, 2, 1, rgba('#e8c8a8', 0.34-0.2*t)); }
  // the mouth, thrown thick
  pEll(g,x,gy-26,9,3.6,'#6b4529');
  pEll(g,x,gy-27,8,3,'#8a5e3a');
  pEll(g,x,gy-26,7.5,3,'#3f5f78');
  // three painted dragons' worth of decoration, at this size two bands
  for(const yy of [gy-19, gy-13]){
    for(let k=0;k<11;k++) pR(g, x-9+k*1.8, yy+((k%2)?0:1), 1, 1, '#6b4529');
  }
  // a coconut-shell ladle hooked over the rim
  pTaper(g, x+8, gy-27, x+13, gy-16, 2, 1.6, '#8a6f42');
  pEll(g, x+13, gy-14, 3.4, 2.8, '#5d4030');
  pEll(g, x+13, gy-14.6, 2.6, 2, '#7d5a3c');
  // a puddle, some moss, and the lid leaning against the foot
  pEll(g, x, gy+1, 14, 3, 'rgba(40,70,90,0.35)');
  for(let i=0;i<5;i++) pEll(g, x-11+i*5, gy-1, 2.2, 1.2, '#3f5a3c');
  pEll(g, x-14, gy-4, 4.4, 4, '#8a5e3a'); pEll(g, x-14, gy-4, 3.2, 3, '#6b4529');
}

/* the log and the chopping stump */
function drawLog(g){
  const x=LOG_X, gy=groundY(x);
  if(x-GS.camX<-70||x-GS.camX>W+70) return;
  const n = Math.min(4, GS.chops|0);
  baked(g,'log'+n, x, gy, 96, 40, 48, 36, (gg,ax,ay)=>paintLog(gg,ax,ay,n));
}
function paintLog(g,x,gy,n){
  const BARK='#4c3a2c', BARKL='#63503c', BARKD='#33261c';
  const HEART='#b5905e', HEARTL='#d0aa78';
  /* A trunk lying down is a cylinder seen from the side: it wants a lit top,
     a shaded belly and bark running ALONG it. Drawn as vertical bands it read
     as a crate, which is exactly what it looked like. */
  const y0 = gy-15, R0 = 7.5;
  for(let i=0;i<=R0*2;i++){
    const tt = i/(R0*2);
    const c = tt<0.18? BARKL : tt<0.62? BARK : BARKD;
    // the trunk tapers a little towards the root end
    const x0 = x-36 + Math.round(tt*1.5), x1 = x+13;
    pR(g, x0, y0+i, x1-x0, 1, c);
  }
  // bark: long broken grooves down the length of it
  for(let k=0;k<16;k++){
    const bx = x-34 + ((k*17)%44), by = y0+2 + ((k*7)%12);
    pR(g, bx, by, 3+((k*5)%4), 1, k%3? BARKD : BARKL);
  }
  // knots where branches were
  for(const [kx,ky] of [[x-22,y0+5],[x-6,y0+9],[x+4,y0+3]]){
    pEll(g,kx,ky,2.2,1.8,BARKD); pEll(g,kx,ky-0.4,1.4,1.1,'#5f4a37');
  }
  // the sawn end facing you, with rings
  pEll(g, x+13, y0+R0, 3.4, R0, HEART);
  pEll(g, x+13, y0+R0, 2.2, R0*0.66, HEARTL);
  pEll(g, x+13, y0+R0, 1, R0*0.3, '#8a6f42');
  // two stubbed branches, and the root plate at the far end
  pTaper(g, x-24, y0+3, x-31, y0-8, 3, 1.6, BARK);
  pTaper(g, x-31, y0-8, x-35, y0-13, 2, 1, BARKL);
  pTaper(g, x-8, y0+2, x-3, y0-6, 2.4, 1.2, BARKL);
  for(let i=0;i<4;i++) pTaper(g, x-36, y0+3+i*3, x-42-i, y0+1+i*4, 2.4, 1.2, BARKD);
  pEll(g, x-8, gy, 30, 3.4, 'rgba(20,14,10,0.35)');

  /* the chopping stump: a short round block stood on end, which is what you
     actually swing at, with the planks you have split stacked off it */
  pEll(g, x+30, gy, 10, 3.6, 'rgba(20,14,10,0.4)');
  for(let i=0;i<13;i++) pR(g, x+21, gy-13+i, 18, 1, i%4===0? BARKL : BARK);
  pEll(g, x+30, gy-13, 9, 3.8, HEART);
  pEll(g, x+30, gy-14, 7.2, 3, HEARTL);
  pEll(g, x+30, gy-14, 3, 1.4, '#8a6f42');
  for(let k=0;k<5;k++) pR(g, x+24+k*3, gy-15+((k%2)), 2, 1, '#e0c090');   // axe scars
  for(let i=0;i<n;i++){
    pR(g, x+40, gy-4-i*3, 14, 3, i%2? '#c2a172':'#b5905e');
    pR(g, x+40, gy-4-i*3, 14, 1, '#d8bc92');
  }
  // chips in the grass
  for(let i=0;i<8;i++) pR(g, x+14+i*4, gy-1+((i%2)), 2, 1, i%2?'#cfa878':'#b5905e');
}

/* the road east, before the rice is in: a wall of morning mist off the
   paddies with fireflies still in it. Not a fence — you are not being
   punished, there is simply nothing over there for you yet. */
/* Retired. The road east is no longer gated: the first night walks you
   straight down it, and a wall of mist across the one route the story takes
   is a wall across the story. The mist that remains is the MIST array in
   p3, which is weather and nothing else. */


/* ============================================================
   THINGS THAT FLY AT DUSK

   Six of them, and each one moves differently, because that is
   the whole pleasure of it: you learn that a dragonfly hangs
   still and then darts, and a firefly cannot be rushed, and a
   grasshopper only goes when you are close.
   ============================================================ */
const BUG_KINDS = {
  firefly:    { n:'firefly',            c:'#c6ff9a', price:14, at:[[POSOP_X-60,POSOP_X+120],[3080,3760]], night:1, r:9  },
  dragonfly:  { n:'dragonfly',          c:'#7fd8e8', price:18, at:[[PADDY_XS[0]-40,PADDY_XS[1]+60]],      night:0, r:11 },
  cicada:     { n:'cicada',             c:'#a8b48c', price:22, at:[[3040,3780],[4640,5400]],              night:0, r:8  },
  beetle:     { n:'rhinoceros beetle',  c:'#4a3524', price:34, at:[[3060,3800],[4660,5460]],              night:1, r:8  },
  grasshopper:{ n:'grasshopper',        c:'#8fbf4a', price:11, at:[[BARN_X-30,TREE_XS[2]+40]],            night:0, r:7  },
  butterfly:  { n:'butterfly',          c:'#f0a8c0', price:16, at:[[BARN_X-40,PADDY_XS[1]+80],[2960,3800]],night:0,r:10 },
};
const BUG_IDS = Object.keys(BUG_KINDS);
const BUGS = [];
let bugCool = 3;

function bugSpawn(){
  if(BUGS.length >= 5) return;
  const night = 1-GS.dawn;
  // pick a kind that suits the hour and has a patch near enough to matter
  const wants = BUG_IDS.filter(k=>{
    const K2=BUG_KINDS[k];
    if(K2.night && night<0.45) return false;
    if(!K2.night && night>0.9) return false;
    return K2.at.some(([a,b])=> b>P.x-420 && a<P.x+420);
  });
  if(!wants.length) return;
  const k = pick(wants);
  const K2 = BUG_KINDS[k];
  const spans = K2.at.filter(([a,b])=> b>P.x-420 && a<P.x+420);
  const [a,b] = pick(spans);
  const x = rnd(Math.max(a,P.x-400), Math.min(b,P.x+400));
  if(Math.abs(x-P.x) < 70) return;                 // never pop into being in your face
  const gy = groundY(x);
  BUGS.push({ k, x, y: gy - (k==='grasshopper'? 5 : k==='beetle'? 8 : rnd(20,52)),
              t: rnd(9), vx: 0, vy: 0, home: x, gy, hop:0, rest: rnd(1,3), flee:0 });
}
function bugAt(x, r){
  const rr = r||26;
  let best=null, bd=1e9;
  for(const b of BUGS){
    const d=Math.abs(b.x-x);
    if(d < rr && d < bd){ bd=d; best=b; }
  }
  return best;
}
function stepBugs(dt){
  bugCool -= dt;
  if(bugCool<=0){ bugCool = rnd(2.5,6); bugSpawn(); }
  for(let i=BUGS.length-1;i>=0;i--){
    const b=BUGS[i], K2=BUG_KINDS[b.k];
    b.t += dt;
    if(b.flee>0) b.flee -= dt;
    const scared = Math.abs(b.x-P.x)<34 && !has('cool');
    if(scared && b.flee<=0 && Math.random()<dt*1.4) b.flee = rnd(0.8,1.6);
    const away = b.x<P.x? -1 : 1;
    switch(b.k){
      case 'firefly':
        b.x += Math.sin(b.t*0.7)*10*dt + (b.flee>0? away*22*dt : 0);
        b.y += Math.cos(b.t*0.9)*8*dt;
        break;
      case 'dragonfly':
        // hangs perfectly still, then darts
        b.rest -= dt;
        if(b.rest<=0){ b.vx = rnd(-70,70); b.vy = rnd(-26,26); b.rest = rnd(0.7,1.8); }
        b.x += b.vx*dt*(b.flee>0?1.9:1); b.y += b.vy*dt;
        b.vx *= Math.pow(0.02,dt); b.vy *= Math.pow(0.02,dt);
        break;
      case 'butterfly':
        b.x += (Math.sin(b.t*1.7)*22 + Math.sin(b.t*0.4)*14)*dt + (b.flee>0? away*26*dt:0);
        b.y += Math.sin(b.t*3.1)*16*dt;
        break;
      case 'cicada':
        // clings to a trunk and shouts about it
        b.y = b.gy - 40 + Math.sin(b.t*0.3)*3;
        if(b.flee>0){ b.x += away*46*dt; b.y -= 14*dt; }
        if(Math.random()<dt*0.35) AU.tone(rnd(3200,3900),0.09,'sawtooth',0.006);
        break;
      case 'beetle':
        // walks a branch, and does not care about you at all
        b.x += Math.sin(b.t*0.35)*13*dt;
        b.y = b.gy - 9;
        break;
      case 'grasshopper':
        b.hop -= dt;
        if(b.hop<=0 && (b.flee>0 || Math.random()<dt*0.5)){
          b.hop = rnd(0.9,2.2); b.vx = (b.flee>0? away:pick([-1,1]))*rnd(40,90); b.vy = -rnd(60,100);
        }
        b.vy += 260*dt;
        b.x += b.vx*dt; b.y += b.vy*dt;
        if(b.y > b.gy-5){ b.y = b.gy-5; b.vy=0; b.vx=0; }
        break;
    }
    // keep it in its patch, and let it wander off if it gets bored
    const span = K2.at.find(([a,c])=> b.home>=a-10 && b.home<=c+10) || [b.home-90,b.home+90];
    b.x = clamp(b.x, span[0], span[1]);
    b.gy = groundY(b.x);
    if(b.k!=='grasshopper' && b.k!=='beetle') b.y = clamp(b.y, b.gy-64, b.gy-8);
    if(Math.abs(b.x-P.x) > 620) BUGS.splice(i,1);
  }
}
function bugPrompt(b){
  if(!has('net')) return 'you would need a net';
  return 'catch the '+BUG_KINDS[b.k].n;
}
function useBug(b){
  if(!has('net')){
    guideSay('Bare hands? Ascend for a net — TOOLS, in your ledger.',8);
    AU.blip(); return;
  }
  startTask('bug', b.x, b);
}
function bugCaught(b){
  const K2=BUG_KINDS[b.k];
  const i=BUGS.indexOf(b); if(i>=0) BUGS.splice(i,1);
  bagAdd(b.k, 1, true);
  GS.q.bugs = (GS.q.bugs||0)+1;
  GS.seen['bug_'+b.k] = true;
  addMerit(1, true);
  toast('+1 '+L(K2.n), K2.c);
  AU.ranat(880,0,0.05); AU.ranat(1180,0.08,0.04);
  pPop(b.x, b.y, K2.c);
  if(GS.q.bugs===1) vignette('firstBug');
  else if(BUG_IDS.every(k=>GS.seen['bug_'+k]) && !GS.seen.allBugs){
    GS.seen.allBugs=true; addMerit(6);
    toast(L('+6 merit')+' · '+L('every one of them'), PAL.goldL);
    guideSay('All six. You paid attention to something that pays you nothing. Good.',8);
  }
  saveGame();
}
function bugEscaped(b){
  b.flee = 2.4; b.rest = 0;
  b.x += (b.x<P.x?-1:1)*30;
  AU.whiff();
  toast(L('it got away'),'#a8927a');
}

/* ---------- bugs, drawn ---------- */
function drawBugs(g){
  for(const b of BUGS){
    if(b.x-GS.camX<-20 || b.x-GS.camX>W+20) continue;
    drawBug(g, b.k, b.x, b.y, b.t, b);
  }
}
function drawBug(g, kind, x, y, t, b){
  x=R(x); y=R(y);
  switch(kind){
    case 'firefly': {
      const bl = 0.5+0.5*Math.sin(t*2.4);
      if(bl>0.25) drawGlow(g,x,y,8,'#96ff78',0.34*bl);
      pR(g,x,y,1,2,'#3a3a24');
      pR(g,x,y+2,1,1,rgba('#c6ff9a',0.5+0.5*bl));
      pR(g,x-1,y-1,1,1,'#4a4a2c');
      // two dashes of wing, only when it is beating
      if(Math.sin(t*22)>0){ pR(g,x-2,y,1,1,'rgba(230,240,220,0.5)'); pR(g,x+1,y,1,1,'rgba(230,240,220,0.5)'); }
      break; }
    case 'dragonfly': {
      const beat = Math.sin(t*30)>0 ? 1 : -1;
      // four long wings, held out flat
      for(const s of [-1,1]) for(const o of [0,3]){
        pTaper(g, x, y+o*0.4, x+s*8, y+o*0.4 - beat*1.6, 1.6, 0.8, 'rgba(200,235,245,0.55)');
        pR(g, x+s*7, y+o*0.4-beat*1.4, 1,1,'rgba(150,210,230,0.7)');
      }
      pTaper(g, x-1, y, x+9, y+1, 2.2, 1, '#3f8fa8');     // the long body
      for(let i=0;i<4;i++) pR(g, x+2+i*2, y, 1,1, i%2?'#7fd8e8':'#2f6f88');
      pEll(g, x-2, y, 2.2, 2, '#5fb8d0');
      pR(g, x-3, y-1, 1,1,'#1a2a34'); pR(g, x-1, y-1, 1,1,'#1a2a34');
      break; }
    case 'butterfly': {
      const f = Math.sin(t*9);
      const w = 1.4 + Math.abs(f)*3.4;
      for(const s of [-1,1]){
        pEll(g, x+s*w, y-1.4, w*0.9, 3.4, '#f0a8c0');
        pEll(g, x+s*w*0.9, y-1.8, w*0.5, 2, '#fbd8e4');
        pEll(g, x+s*w*1.1, y+1.4, w*0.6, 2.2, '#e08aa8');
        pR(g, x+s*w*1.3, y-2.4, 1,1,'#7a2a3a');
      }
      pR(g, x, y-2, 1, 5, '#4a3524');
      pR(g, x, y-3, 1, 1, '#2c2020');
      break; }
    case 'cicada': {
      // clings head-up, wings folded into a roof over its back
      pEll(g, x, y, 2.4, 4.4, '#6b7458');
      pEll(g, x-1, y-1, 1.4, 3, '#a8b48c');
      pTaper(g, x, y-3, x+1, y+5, 3.4, 1.6, 'rgba(210,215,190,0.62)');
      pTaper(g, x, y-3, x-1, y+5, 3.4, 1.6, 'rgba(226,230,206,0.5)');
      pEll(g, x, y-4.4, 2.6, 2, '#8a9470');
      pR(g, x-2, y-5, 1,1,'#241c14'); pR(g, x+1, y-5, 1,1,'#241c14');
      if(Math.random()<0.25){ // the noise, drawn
        for(let i=0;i<3;i++) pR(g, x+5+i*3, y-6-i, 1, 1, 'rgba(240,236,200,0.35)');
      }
      break; }
    case 'beetle': {
      const f = b && b.x> (b.home||x) ? 1 : -1;
      pEll(g, x, y, 5, 3.4, '#3a2a1a');
      pEll(g, x-1, y-0.8, 3.4, 2, '#5f4630');
      pR(g, x-0.5, y-2.6, 1, 5, '#241a10');               // the seam down the shell
      pEll(g, x+4*f, y-0.6, 2.2, 1.8, '#241a10');
      // the horn, which is the whole point of a rhinoceros beetle
      pTaper(g, x+5*f, y-1.4, x+10*f, y-6, 2, 1, '#1c1409');
      pTaper(g, x+9*f, y-5.4, x+11*f, y-7.6, 1.4, 0.8, '#2c2014');
      pTaper(g, x+5*f, y-1, x+8*f, y-4, 1.4, 0.8, '#2c2014');
      for(let i=0;i<3;i++){ const lx=x-3+i*3;
        pTaper(g, lx, y+2, lx-1.4*f, y+4.4, 1.2, 0.8, '#241a10'); }
      break; }
    case 'grasshopper': {
      const air = b && b.vy!==0;
      const f = b && b.vx<0 ? -1 : 1;
      pEll(g, x, y, 4.4, 2.4, '#7aa83c');
      pEll(g, x-1*f, y-0.8, 2.6, 1.4, '#a8cf5c');
      pTaper(g, x-1*f, y-2, x+5*f, y-1, 3, 1.6, 'rgba(180,215,130,0.7)');
      pEll(g, x+4*f, y-1.4, 2, 1.8, '#8fbf4a');
      pR(g, x+5*f, y-2, 1,1,'#243014');
      // the long back leg, folded when sitting and out straight in the air
      if(air){ pTaper(g, x-1*f, y+0.6, x-7*f, y+3, 1.6, 1, '#6b9430');
               pTaper(g, x-7*f, y+3, x-10*f, y-1, 1.4, 0.8, '#5c8028'); }
      else   { pTaper(g, x-1*f, y+0.6, x-5*f, y-2.4, 1.8, 1, '#6b9430');
               pTaper(g, x-5*f, y-2.4, x-3*f, y+2.4, 1.6, 0.9, '#5c8028'); }
      pTaper(g, x+1*f, y+1.4, x+3*f, y+3, 1.2, 0.8, '#6b9430');
      break; }
  }
}

/* ============================================================
   TWO MORE THINGS TO DO WITH YOUR HANDS

   Both run on the same hand-steering the streetlight and the cat
   use, because that is the verb this game has: you reach out with
   something enormous and try to be delicate with it.
   ============================================================ */
const NET_R = ()=> (has('reach')? 15 : 12) * (has('steady')? 1.25 : 1);

function taskNewSetup(t, x, arg){
  const gy=groundY(x);
  if(t.kind==='bug'){
    t.bug = arg;
    t.tries = 3; t.swing = 0; t.left = 15;
    t.hx = arg.x - 34; t.hy = arg.y + 10;
    P.x = clamp(arg.x - 44, 20, WORLD_W-20); P.y = groundY(P.x);
  }
  if(t.kind==='chop'){
    t.mark = LOG_X + 30;                        // the stump
    t.power = 0; t.wind = 0; t.strike = 0; t.planks = 0; t.left = 26;
    t.hx = t.mark - 6; t.hy = groundY(t.mark) - 40;
    P.x = clamp(LOG_X + 6, 20, WORLD_W-20); P.y = groundY(P.x);
  }
}
function stepTaskNew(t, dt, dx, dy, grip, speed){
  t.left -= dt;
  if(t.left<=0){
    if(t.kind==='bug'){ bugEscaped(t.bug); guideSay('Gone. They come back.'); }
    else if(t.planks>0){ chopDone(t); return; }
    else toast(L('you got nowhere'),'#a8927a');
    GS.state='play'; HT=null; return;
  }
  if(t.kind==='bug'){
    const b=t.bug, K2=BUG_KINDS[b.k];
    // the bug keeps living its own life; the net being close makes it nervous
    const dn = dist(t.hx,t.hy,b.x,b.y);
    if(dn < 44 && speed > 90) b.flee = Math.max(b.flee, 0.7);
    if(t.swing>0){ t.swing -= dt; }
    else if(grip){
      t.swing = 0.42;
      const caught = dn < NET_R() + K2.r*0.4;
      if(caught){ t.hit=0.4; bugCaught(b); GS.state='play'; HT=null; return; }
      t.tries--; t.fail=0.5; AU.whiff();
      b.flee = 1.8; b.rest = 0;
      b.vx = (b.x<t.hx? -1:1)*rnd(70,120); b.vy = -rnd(20,50);
      if(t.tries<=0){ bugEscaped(b); GS.state='play'; HT=null; return; }
    }
    t.prog = 1 - clamp(dn/120,0,1);
  }
  if(t.kind==='chop'){
    const gy = groundY(t.mark);
    // hold to raise the axe. it gets heavy, so the wind-up caps out.
    if(grip){ t.wind = Math.min(1, t.wind + dt*0.9); }
    else if(t.wind > 0.06){
      // let go and it comes down
      const acc = Math.abs(t.hx - t.mark);
      const good = acc < (has('axe')? 15:11) * (has('steady')?1.3:1);
      t.strike = 0.34;
      GS.shake = 2 + t.wind*3;
      if(good && t.wind > 0.4){
        t.planks++;
        AU.hit(true); AU.noise(0.09,0.05,200,2600);
        for(let k=0;k<12;k++) part({k:'pop',x:t.mark+rnd(-8,8),y:gy-14,
          vx:rnd(-50,50),vy:rnd(-70,-16),life:.7,c:k%2?'#cfa878':'#b5905e'});
        toast('+1 '+L('plank'),'#cfa878');
        if(t.planks>=4){ chopDone(t); return; }
      } else {
        AU.noise(0.12,0.04,90,900); t.fail=0.55;
        pDust(t.mark, gy, 8);
      }
      t.wind = 0;
    }
    if(t.strike>0) t.strike -= dt;
    t.hy = Math.min(t.hy, gy - 14);
    t.prog = t.planks/4;
  }
  if(t.fail>0) t.fail -= dt;
  if(t.hit>0) t.hit -= dt;
}
function chopDone(t){
  const n = t.planks + (has('axe')?1:0);
  GS.chops = Math.min(4, (GS.chops|0) + 1);
  bagAdd('wood', n, true);
  GS.q.chopped = (GS.q.chopped||0) + 1;
  addMerit(1, true);
  toast('+'+n+' '+L('planks'), '#cfa878');
  AU.fix();
  GS.state='play'; HT=null;
  if(GS.q.chopped===1) guideSay('Planks. The board at the gate takes those.',8);
  saveGame();
}
/* the net and the axe, drawn in the world, held by the big pale hand */
function drawTaskNew(g,t){
  if(t.kind==='bug'){
    const b=t.bug, r=NET_R();
    const sw = t.swing>0 ? (1 - t.swing/0.42) : 0;
    const rr = r * (1 - sw*0.45);
    // the hoop, and the bag of the net behind it
    for(let i=0;i<26;i++){ const a=i/26*TAU;
      pR(g, t.hx+Math.cos(a)*rr, t.hy+Math.sin(a)*rr*0.9, 1,1, i%2?'#e8e0cc':'#b8ac94'); }
    for(let i=0;i<9;i++){ const a=i/9*TAU;
      pTaper(g, t.hx+Math.cos(a)*rr, t.hy+Math.sin(a)*rr*0.9,
                t.hx+Math.cos(a)*rr*0.3, t.hy+Math.sin(a)*rr*0.3 + rr*0.5+sw*8,
                1, 0.6, 'rgba(238,234,216,0.34)'); }
    pEll(g, t.hx, t.hy+rr*0.45+sw*6, rr*0.7, rr*0.4, 'rgba(238,234,216,0.14)');
    pTaper(g, t.hx-rr*0.9, t.hy+rr*0.6, t.hx-rr*2.2, t.hy+rr*1.7, 2.4, 1.8, '#a08464');
    // a ring on the ground under the bug, so you can read the depth
    pEll(g, b.x, b.gy-1, 7, 2.6, 'rgba(255,232,160,0.25)');
    if(t.hit>0){ for(let i=0;i<10;i++){ const a=i/10*TAU;
      pR(g, t.hx+Math.cos(a)*(rr+ (1-t.hit/0.4)*12), t.hy+Math.sin(a)*(rr*0.9), 1,1,'#fff0b8'); } }
  }
  if(t.kind==='chop'){
    const gy = groundY(t.mark);
    // the wedge you are aiming at
    const on = Math.abs(t.hx-t.mark) < (has('axe')?15:11);
    for(let i=0;i<14;i++) pR(g, t.mark-7+i, gy-15, 1, 2, on? '#ffe89a':'rgba(255,238,196,0.35)');
    pR(g, t.mark, gy-30, 1, 14, on? 'rgba(255,232,160,0.5)':'rgba(255,232,160,0.16)');
    // the axe, hanging from the hand, raised by the wind-up
    const lift = t.wind*26, sk = t.strike>0? (1-t.strike/0.34) : 0;
    const ang = -0.5 - t.wind*1.5 + sk*3.0;
    const hx2 = t.hx, hy2 = t.hy - lift;
    const ex = hx2 + Math.cos(ang)*20, ey = hy2 + Math.sin(ang)*20;
    pTaper(g, hx2, hy2, ex, ey, 3, 2.4, '#7d5a3c');
    pTaper(g, hx2, hy2, ex, ey, 1.4, 1, '#9c7551');
    const px2 = ex + Math.cos(ang)*2, py2 = ey + Math.sin(ang)*2;
    pTri(g, px2, py2-5, px2+8, py2, px2, py2+5, '#8a8f9e');
    pTri(g, px2, py2-4, px2+6, py2, px2, py2+3, '#c8cdd8');
    pR(g, ex-1, ey-3, 3, 6, '#5f6472');
    // the wind-up arc, so you can feel how much you have got
    if(t.wind>0.04) for(let i=0;i<12;i++){
      const a=-2.2+i*0.13;
      if(i/12 > t.wind) break;
      pR(g, hx2+Math.cos(a)*30, hy2+Math.sin(a)*30, 1,1, i>4? '#ffe89a':'#c9992f');
    }
    if(t.strike>0 && sk>0.4) for(let i=0;i<7;i++)
      pR(g, t.mark+rnd(-12,12), gy-16+rnd(-4,4), 1,1,'#fff0b8');
  }
}

/* ============================================================
   HOW FAR EAST YOU MAY GO

   Until the rice is in there is nothing east of the field for
   you, and a new player let loose on five thousand pixels of
   road learns nothing except that they are lost. So the mist off
   the paddies does not lift, and the guide says why.
   ============================================================ */
const eastLimit = ()=> WORLD_W-16;
function mistNudge(){
  if(riceDone()) return;
  if(GS.seen.mistT && GS.t - GS.seen.mistT < 7) return;
  GS.seen.mistT = GS.t;
  guideSay(pick([
    'Mist doesn\'t lift off an empty field.',
    'The village will still be there. Field first.',
    'She\'s watching you think about leaving.']), 7);
}

/* ============================================================
   STEP AND DRAW HOOKS
   ============================================================ */
function stepNew(dt){
  if(!storyBusy()) stepPosop(dt);
  stepBugs(dt);
  if(P.x > eastLimit()){ P.x = eastLimit(); P.vx = 0; navStop(); }
}
/* behind the prete: the buildings and the standing water */
function drawNew(g){
  if(FARM.rented) drawShipBasket(g);
  drawBarn(g);
  drawJar(g);
  drawLog(g);
  if(farmActive() && !storyBusy()) drawPosop(g);
}
/* in front: the things in the air */
function drawNewFore(g){
  drawBugs(g);
}
/* ---------- the prompts ----------
   Split in two on purpose. The barn, the jar, the log and Mae Posop are
   fixed furniture at spots nothing else uses, so they are checked BEFORE
   the beds and paddies — during the rice lesson she has to be reachable
   from either bank, and she stands close enough to the water that the
   paddy would otherwise win the tie. Bugs are checked last, because a
   dragonfly drifting over a ripe bed must never stop you cutting it. */
function checkNewFixed(set, taken){
  /* the three things the day loop runs on come first: somewhere to sleep,
     somewhere to put the crop, and somewhere to get your strength back */
  if(!taken() && !storyBusy() && DAY.min/60>=17 && bedNear()!==null){
    const bx=bedNear();
    set(bx, groundY(bx)-34, 'sleep until morning', ()=>goToBed(false));
  }
  /* a wide trigger on purpose: the prete is a hundred pixels tall and twenty-six
     wide, so a sixteen-pixel one meant standing on top of the basket to use it.
     The barn is sixteen pixels along from it and they overlap on purpose now —
     both get an icon, and you tap the one you meant. */
  if(!taken() && !storyBusy() && FARM.rented && near(SHIP_X,26)){
    set(SHIP_X, groundY(SHIP_X)-38,
        shippable().length? 'tip the basket in ('+shipBagValue()+'฿)' : 'the shipping basket',
        tipTheBasket, 'give');
    // stand nearer the barn than the basket and the barn is what E does
    if(Math.abs(P.x-SHIP_X) > Math.abs(P.x-BARN_X)) spotLast();
  }
  if(!taken() && !storyBusy() && GS.q.metPhra && near(SHRINE_X+18,16))
    set(SHRINE_X+18, groundY(SHRINE_X)-52,

/* Bugs get two bites at the prompt list.

   Once at the top, but only with a net in hand and only within fourteen
   pixels: a dragonfly's whole patch is the two paddies, so ordering bugs
   strictly last made it unreachable — you would stand under it and be
   offered the mud instead, for ever. Fourteen is tight enough that a step
   sideways gives the paddy back, since the paddy answers from thirty.

   And once at the bottom at the full radius, which is where the "you would
   need a net" line comes from and where a bug over open ground is caught. */
function checkNewBugsFirst(set, taken){
  if(taken() || !has('net')) return;
  const b = bugAt(P.x, 14);
  if(b) set(b.x, b.y-16, bugPrompt(b), ()=>useBug(b), 'give');
}
function checkNewBugs(set, taken){
  if(taken()) return;
  const b = bugAt(P.x);
  if(b) set(b.x, b.y-16, bugPrompt(b), ()=>useBug(b), 'give');
}

   Merit is what the ledger counts. Baht is what the landlord
   counts, and they are earned in opposite directions: you get
   merit for giving a thing away and baht for selling it, and you
   cannot do both with the same bowl of food. That is the game.
   ============================================================ */
const PRICE = {
  // what P'Nok will pay you for raw produce
  rice:6, papaya:5, chili:4, lemongrass:4, lime:4, herb:3, coconut:7, banana:4, mango:9,
  galangal:5, basil:4, pandan:3, kaffir:4, morning:3,
  durian:36, mangosteen:17, rambutan:13, longan:12, jackfruit:19,
  egg:6, duckEgg:8, milk:15, manure:3, bran:2,
  flower:4, leaf:3, bamboo:5, clay:4, seed:3, wood:7,

     children in this village spend the whole of dusk in the long grass */
  firefly:14, dragonfly:18, cicada:22, beetle:34, grasshopper:11, butterfly:16,

  padkaphrao:44, greenCurry:54, durianRice:76, sangkhaya:48, ruamMit:56,

const sellPrice = id => PRICE[id] || 2;
const canSell   = id => !!ITEMS[id] && !!PRICE[id];
function earn(n){ GS.baht = clamp((GS.baht|0)+n, 0, 99999); saveGame(); }
function pay(n){
  if((GS.baht|0) < n) return false;
  GS.baht -= n; saveGame(); return true;

function tooPoor(n){

/* ============================================================
   THE COUNTER — one list screen, used by the stall and by the
   landlord's board, because a second layout is a second thing to
   learn and there is nothing here worth learning twice.

let CNT = null;
function openCounter(o){
  CNT = { title:o.title, sub:o.sub||'', rowsFn:o.rows, note:o.note||'', i:0, at:o.at||P.x, flash:0 };
  GS.state='shop'; clearPress(); AU.sel();
}
function cntRows(){ const r = CNT.rowsFn(); CNT.i = clamp(CNT.i, 0, Math.max(0,r.length-1)); return r; }
function stepShop(dt){
  const C=CNT;
  C.flash = Math.max(0, C.flash-dt);
  if(press('back')||press('tree')){ GS.state='play'; CNT=null; clearPress(); return; }
  hitTap();
  if(GS.state!=='shop') return;
  const rows=cntRows();
  if(press('up')||press('left'))   { C.i=(C.i+rows.length-1)%Math.max(1,rows.length); AU.blip(); }
  if(press('down')||press('right')){ C.i=(C.i+1)%Math.max(1,rows.length); AU.blip(); }
  if(press('act')){
    const r=rows[C.i];
    if(r && r.fn && r.ok!==false){ r.fn(); C.flash=0.25; }
    else { AU.blip(); C.flash=0.3; C.bad=1; }
  }
  clearPress();
}
function drawShop(g){
  const C=CNT; if(!C) return;
  hitClear();
  g.fillStyle='rgba(14,11,26,0.82)'; g.fillRect(0,0,W,H);
  cloud(g,10,8,W-20,22,{seed:210});
  pTxt(g,C.title,20,25,'#8f6a1e',12);
  purseTag(g,W-24,24,'right');
  pTxt(g,'back',W-24,H-8,CL.ink3,6,'right');
  if(C.sub) pTxt(g,C.sub,20,40,'#cfc4ae',6);

  const rows=cntRows();
  const lx=12, lw=W-24, ly=46, rh=26, per=Math.floor((H-ly-26)/rh);
  const from=clamp(C.i-Math.floor(per/2), 0, Math.max(0,rows.length-per));
  cloud(g,lx,ly,lw,Math.min(rows.length,per)*rh+8,{seed:211});
  for(let k=0;k<Math.min(rows.length,per);k++){
    const i=from+k, r=rows[i], y=ly+4+k*rh, sel=i===C.i;
    if(sel){ pR(g,lx+3,y,lw-6,rh-2,'#f2e2b4'); pR(g,lx+3,y,lw-6,1,'#fff8e0');
      pR(g,lx+3,y+rh-3,lw-6,1,'#d8c48c'); pR(g,lx+3,y,2,rh-2,CL.gold); }
    else pR(g,lx+8,y+rh-3,lw-16,1,'rgba(120,100,70,0.16)');
    if(r.icon) drawIcon(g,r.icon,lx+20,y+12,0.62);
    else if(r.badge) r.badge(g,lx+20,y+12);
    pTxt(g,r.n,lx+36,y+11, r.ok===false? CL.ink3 : CL.ink, 8);
    if(r.sub) pTxt(g,r.sub,lx+36,y+21, r.ok===false? '#a8927a' : CL.ink2, 6);
    if(r.cost!==undefined){
      const afford=(GS.baht|0)>=r.cost;
      pTxt(g,r.cost+'฿',lx+lw-14,y+15, r.ok===false? '#a8927a' : afford? '#3f6a2c':'#a8392c', 8,'right');
    } else if(r.gain!==undefined){
      pTxt(g,'+'+r.gain+'฿',lx+lw-14,y+15,'#3f6a2c',8,'right');
    } else if(r.mark){
      icoTick(g,lx+lw-18,y+15,1.2,'#4a7a2c');   // drawn, not a font character
    } else if(r.tag){
      pTxt(g,r.tag,lx+lw-14,y+15,CL.ink2,6,'right');
    }
    hitAdd(lx,y,lw,rh,()=>{ const same=C.i===i; C.i=i; if(same) PRESS.act=true; else AU.blip(); });
  }
  if(!rows.length) pTxt(g,L('nothing here just now'),W/2,ly+30,CL.ink3,7,'center');
  if(C.note){ cloud(g,12,H-26,W-24,20,{seed:212});
    g.globalAlpha=C.flash>0&&C.bad?0.5:1;
    pTxt(g,C.note,W/2,H-12,CL.ink2,6,'center'); g.globalAlpha=1; }
  C.bad=0;
}

        icon:BED_CROPS[FARM.beds], cost:BED_COST, ok:true,
        fn(){ if(!pay(BED_COST)) return tooPoor(BED_COST); FARM.beds++; AU.ranat(700,0,0.05);
          toast(L('a new bed, turned over'),PAL.jadeL); saveGame(); } });
      if(FARM.paddies<PADDY_XS.length) out.push({ n:L('open up a rice field'), sub:(FARM.paddies)+'/'+PADDY_XS.length+' '+L('rice fields'),
        icon:'rice', cost:PADDY_COST, ok:true,
        fn(){ if(!pay(PADDY_COST)) return tooPoor(PADDY_COST); FARM.paddies++; AU.ranat(620,0,0.05);
          toast(L('the dike is built'),'#8fc4e8'); saveGame(); } });
      if(FARM.trees<TREE_XS.length) out.push({ n:L('dig an orchard hole'), sub:(FARM.trees)+'/'+TREE_XS.length,
        badge:(g,x,y)=>icoFlower(g,x,y,1,'#6fa85c'), cost:20, ok:true,
        fn(){ if(!pay(20)) return tooPoor(20); FARM.trees++; AU.step();
          toast(L('a hole, waiting for a tree'),'#8a6f52'); saveGame(); } });
      // saplings, for any hole that is still empty
      const hole = TREES.find(t=>treeOpen(t) && !t.crop);
      if(hole) for(const k in SAPLINGS){ const s=SAPLINGS[k];
        out.push({ n:L('plant a')+' '+L(ITEMS[k].n), sub:L('bears for ever, once it is grown'), icon:k, cost:s.cost, ok:true,
          fn(){ if(!pay(s.cost)) return tooPoor(s.cost);
            hole.crop=k; hole.grow=0; hole.fruit=0; hole.pop=1;
            AU.ranat(560,0,0.05); toast(L('planted'),PAL.jadeL);
            if(!GS.seen.sapling){ GS.seen.sapling=true;
              guideSay('Takes a while. A fruit tree\'s a promise, not a crop.',8); }
            saveGame(); } });
      }
      for(const k in STOCK_COST){
        const have=FARM.pen[k], cap = k==='buffalo'? 1 : 3;
        if(have>=cap) continue;
        out.push({ n:L('buy a')+' '+L(k), sub:have+'/'+cap+' '+L('in the pen'),
          badge:(g,x,y)=>penBadge(g,k,x,y), cost:STOCK_COST[k], ok:true,

        out.push({ n:L(s.name), sub:L(JOBS[j].n), badge:(g,x,y)=>jobBadge(g,j,x,y), tag:L('send back'), ok:true,
          fn(){ dismissHand(s); } });
      }
      if(!out.length) out.push({ n:L('the farm wants for nothing'), sub:L('go and work it'), tag:'·', ok:false });
      return out;
    },
  });

/* ============================================================
   ORDERS — the village asks for cooked food by name, and pays.
   Three at a time, no more, so the screen never fills up.
   ============================================================ */
const ORDERS = [];
const ORDER_MAX = 3;
let orderCool = 10;
const DISH_IDS = ()=> Object.keys(RECIPES);      // people order supper, not baskets
function orderOf(id){ return ORDERS.find(o=>o.who===id) || null; }
function reqWho(){ return ORDERS.length? NPCS.find(n=>n.id===ORDERS[0].who) : null; }
function newOrder(){
  if(ORDERS.length >= ORDER_MAX) return;
  const free = NPCS.filter(n=>!orderOf(n.id));
  if(!free.length) return;
  const n = pick(free);
  /* weight it toward what you already know how to cook, so an order is
     usually something you can start on now */
  const all=DISH_IDS(), known=all.filter(d=>GS.learned[d]!==undefined);
  const dish = (known.length && Math.random()<0.65)? pick(known) : pick(all);
  const cnt = 1 + ((Math.random()*2)|0);
  const bk = RECIPES[dish]||CRAFTS[dish];
  ORDERS.push({ who:n.id, dish, n:cnt, got:0,
                pay: Math.round(sellPrice(dish)*cnt*1.45),
                merit: 3*cnt });
  n.mark={k:'star',t:4}; npcReact(n,'wave',1.6);
  if(Math.abs(n.x-P.x)<200) AU.blip();
  vignette('firstOrder');
  saveGame();
}
function stepOrders(dt){
  if(!GS.q.metPhra) return;
  if(ORDERS.length < ORDER_MAX){
    orderCool -= dt;
    if(orderCool<=0){ orderCool = rnd(18,34); newOrder(); }
  }
  for(const o of ORDERS){
    const n=NPCS.find(v=>v.id===o.who);
    if(n && Math.random()<dt*0.4) n.mark={k:'star',t:1.2};
  }
}
/* handing over a dish settles an order before it counts as a plain gift */
function reqGive(target,id){
  const o = ORDERS.find(x=>x.who===target.id && x.dish===id);
  if(!o) return false;
  o.got++;
  if(o.got>=o.n){
    earn(o.pay); addMerit(o.merit);
    toast('+'+o.pay+'฿  +'+o.merit+' '+L('merit'), PAL.goldL);
    for(let i=0;i<8;i++) pOrb(target.x+rnd(-8,8), target.y-30+rnd(-6,6), i*0.12);
    ORDERS.splice(ORDERS.indexOf(o),1);
    GS.q.orders=(GS.q.orders||0)+1;
    if(!vignette('orderDone', target)) npcReact(target,'wai',2.4);
  } else {
    npcReact(target,'clap',1.2);
    toast(o.got+'/'+o.n, PAL.jadeL);
  }
  saveGame();
  return true;
}
/* what an order sounds like out loud, so nobody has to guess */
function reqAsk(v){
  const o = v && orderOf(v.id);
  if(!o) return null;
  const bk = RECIPES[o.dish]||CRAFTS[o.dish];
  const left = o.n - o.got;
  return L('Could you make me')+' '+left+' '+L(bk.n)+'? '+o.pay+L('฿ for it')+'.';
}
function reqLine(){
  if(!ORDERS.length) return null;
  const o=ORDERS[0], n=NPCS.find(v=>v.id===o.who);
  if(!n) return null;
  const bk = RECIPES[o.dish]||CRAFTS[o.dish];
  const tail = o.got? '  ('+o.got+'/'+o.n+')' : '';
  return L(n.name)+' '+L('wants')+' '+o.n+' '+L(bk.n)+' · '+o.pay+'฿'+tail;
}
const stepRequests = stepOrders;

/* the board outside the stall, so you can see all three at once */
function openOrderBoard(){
  openCounter({
    title:'ORDERS',
    sub:'what the village would like cooked',
    note:'cook it, then hand it to them yourself',
    rows(){
      if(!ORDERS.length) return [{ n:L('nobody is hungry yet'), sub:L('give it a little while'), tag:'·', ok:false }];
      return ORDERS.map(o=>{
        const n=NPCS.find(v=>v.id===o.who), bk=RECIPES[o.dish]||CRAFTS[o.dish];
        const know = GS.learned[o.dish]!==undefined;
        const need = Object.keys(bk.need).map(k=>L(ITEMS[k].n)+' x'+bk.need[k]).join(', ');
        return { n:(n?L(n.name):'?')+' — '+o.n+' x '+L(bk.n), sub:need, icon:o.dish,
                 tag:o.pay+'฿ / '+o.merit+' '+L('merit'), ok:true,
                 fn(){ guideSay(know? L('You know that one. Kitchen\'s by the cart.')
                                    : L('Haven\'t cooked that yet. Kitchen lists it anyway.'), 7); } };

/* ============================================================
   THE GHOSTS WHO WORK FOR YOU

   A spirit you have fed is a spirit who will help. Take one on
   and it stops haunting its patch of road and comes to the farm
   instead, and does the one job it is shaped for.
   ============================================================ */
const JOBS = {
  water:  {n:'water the beds',    d:'walks the row with a bucket',        at:()=>BED_XS[2],   every:9 },
  pick:   {n:'pick what is ripe', d:'takes the ripe beds off your hands', at:()=>BED_XS[1],   every:11 },
  paddy:  {n:'keep the water up', d:'minds the dikes and the rice',       at:()=>PADDY_XS[0], every:12 },
  orchard:{n:'mind the orchard',  d:'brings the fruit down',              at:()=>TREE_XS[1],  every:13 },
  feed:   {n:'feed the animals',  d:'keeps bran in the trough',           at:()=>PEN_X+22,    every:14 },
};
const JOB_IDS = Object.keys(JOBS);
function handOf(sid){ return FARM.hands[sid]||null; }
function handCount(){ return Object.keys(FARM.hands).length; }
function jobTaken(j){ for(const k in FARM.hands) if(FARM.hands[k]===j) return k; return null; }
function hireHand(s, job){
  if(!FARM.rented){ guideSay('You have nothing for them to work yet.'); return; }
  const other=jobTaken(job);
  if(other && other!==s.id) delete FARM.hands[other];
  FARM.hands[s.id]=job;
  s.hand={ job, t:rnd(0,4), x:JOBS[job].at()+rnd(-14,14), busy:0 };
  AU.metta(); pSpark(s.x,s.y-30,12,PAL.goldL);
  toast(L(s.name)+' '+L('comes to the farm'), PAL.jadeL);
  if(!GS.seen.hand){ GS.seen.hand=true;
    guideSay('Dead hands are still hands. They\'ll keep at it whether you watch or not.',8); }
  saveGame();
}
function dismissHand(s){
  delete FARM.hands[s.id]; s.hand=null;
  s.x=s.home!==undefined? s.home : s.x;
  toast(L(s.name)+' '+L('goes back to the road'),'#cfc4ae');
  saveGame();
}
function openHands(s){
  openCounter({
    title:'A PAIR OF HANDS',
    sub:L(s.name)+' — '+L('what should they do?'),
    note:'one job each, and they keep at it while you\'re away',
    rows(){
      const out=JOB_IDS.map(j=>{
        const on=handOf(s.id)===j, by=jobTaken(j);
        return { n:L(JOBS[j].n), sub: on? L('doing this now') : by? L('taken by')+' '+L((SPIRIT_BY_ID[by]||{}).name||'') : L(JOBS[j].d),
                 badge:(g,x,y)=>jobBadge(g,j,x,y), mark: on, ok:true,
                 fn(){ if(on) return; hireHand(s,j); GS.state='play'; CNT=null; } };
      });
      if(handOf(s.id)) out.push({ n:L('nothing, thank you'), sub:L('they go back to their patch of road'),
        badge:(g,x,y)=>icoDown(g,x,y,1.2,CL.ink2), ok:true,
        fn(){ dismissHand(s); GS.state='play'; CNT=null; } });
      return out;
    },
  });
}
function jobBadge(g,j,x,y){
  if(j==='water'){ pR(g,x-3,y-2,7,6,'#7a8088'); pR(g,x-3,y-2,7,1,'#a0a8b0');
    for(let i=0;i<3;i++) pR(g,x-2+i*2,y+4,1,2,'#8fc4e8'); }
  else if(j==='pick'){ pEll(g,x,y+1,5,3,'#d3b478'); pEll(g,x,y-1,4,2,'#e0c184'); pR(g,x-1,y-4,2,3,'#6fbf62'); }
  else if(j==='paddy'){ pR(g,x-5,y+1,11,3,PAL.water); pR(g,x-5,y+1,11,1,PAL.waterL);
    for(let i=0;i<4;i++) pTaper(g,x-4+i*3,y+1,x-4+i*3,y-4,1.4,0.8,'#4f9256'); }
  else if(j==='orchard'){ pTaper(g,x,y+4,x,y-2,2.4,1.4,'#5a4436'); pEll(g,x,y-4,5,3.4,'#2e5d3a'); }
  else { pEll(g,x,y+2,5,3,'#c9a86a'); pEll(g,x-2,y-2,2.2,2,'#f2ece0'); pR(g,x-4,y-3,2,1,'#c0392f'); }
}
/* the work itself: it happens whether or not you are on screen */
function stepHands(dt){
  if(!FARM.rented) return;
  for(const s of SPIRITS){
    const job = handOf(s.id);
    if(!job){ if(s.hand) s.hand=null; continue; }
    if(!s.hand) s.hand={ job, t:rnd(0,4), x:JOBS[job].at()+rnd(-14,14), busy:0 };
    const h=s.hand;
    h.job=job;
    // they drift to their station and stay near it
    const want = JOBS[job].at();
    h.x = lerp(h.x, want + Math.sin(GS.t*0.5+s.anim)*16, 1-Math.pow(0.2,dt));
    s.x = h.x; s.y = groundY(s.x);
    if(h.busy>0){ h.busy-=dt; continue; }
    h.t += dt;
    if(h.t < JOBS[job].every) continue;
    h.t = 0;
    if(doJob(job,s)) { h.busy=0.7; }
  }
}
function doJob(job,s){
  const px=s.x, py=groundY(s.x);
  const spark=(c)=>{ for(let k=0;k<6;k++) pSpark(px+rnd(-8,8),py-24,1,c); };
  if(job==='water'){
    const pl = PLOTS.find(p=>bedOpen(p) && p.stage>0 && p.stage<3 && p.wet<=0);
    if(!pl) return false;
    pl.wet=9; pl.pop=0.5;
    for(let k=0;k<8;k++) part({k:'water',x:pl.x+rnd(-6,6),y:groundY(pl.x)-18,vx:rnd(-6,6),vy:rnd(20,44),life:.5});
    return true;
  }
  if(job==='pick'){
    const pl = PLOTS.find(p=>bedOpen(p) && p.stage===3);
    if(!pl) return false;
    bagAdd(pl.crop,2,true); bagAdd('seed',1,true);
    pl.stage=0; pl.t=0; pl.wet=0; pl.pop=1;
    for(let k=0;k<7;k++) part({k:'pop',x:pl.x,y:groundY(pl.x)-16,vx:rnd(-22,22),vy:rnd(-42,-12),life:.6,c:ITEMS[pl.crop].c});
    spark(PAL.jadeL); saveGame(); return true;
  }
  if(job==='paddy'){
    const pd = PADDIES.find(p=>padOpen(p) && p.stage>0 && p.stage<3 && p.flood<=6);
    if(pd){ pd.flood=40; pd.pop=0.5;
      for(let k=0;k<10;k++) part({k:'water',x:pd.x+rnd(-22,22),y:groundY(pd.x)-14,vx:0,vy:rnd(16,36),life:.5});
      return true; }
    const ripe = PADDIES.find(p=>padOpen(p) && p.stage===3);
    if(ripe){ bagAdd('rice',3,true); bagAdd('bran',1,true); bagAdd('seed',1,true);
      ripe.stage=0; ripe.t=0; ripe.flood=0; ripe.pop=1;
      spark('#e8d06a'); saveGame(); return true; }
    return false;
  }
  if(job==='orchard'){
    const tr = TREES.find(t=>treeOpen(t) && t.crop && t.grow>=1 && t.fruit>0);
    if(!tr) return false;
    bagAdd(tr.crop,tr.fruit,true); tr.fruit=0; tr.pop=1;
    spark(ITEMS[tr.crop].c); saveGame(); return true;
  }
  if(job==='feed'){
    if(!penHas()) return false;
    if(FARM.pen.feed>12) return false;
    if(!bagTake('bran',1)) return false;
    FARM.pen.feed=Math.min(60,FARM.pen.feed+30);
    spark('#d3b478'); saveGame(); return true;
  }
  return false;
}
/* a small badge over a working ghost, so you can see the farm running */
function drawHandTag(g,s){
  const job=handOf(s.id); if(!job) return;
  const y = s.y - (s.id==='krasue'? 74 : 58) - 8 + Math.sin(GS.t*2+s.anim)*1.5;
  cloud(g,s.x-11,y-10,22,15,{seed:301,drop:1});
  jobBadge(g,job,s.x,y-2);
}

function vignette(id, who){
  const d = VIGS[id];
  if(!d || VIG || DLG || GS.state!=='play') return false;
  if(d.once && GS.seen['vig_'+id]) return false;
  GS.seen['vig_'+id] = true;
  VIG = { id, d, t:0, line:0, ch:0, who:who||null, x:0, out:0 };
  VIG.x = d.at ? d.at() : P.x;
  navStop(); clearPress(); PROMPT=null;
  if(d.start) d.start(VIG);
  AU.blip();
  saveGame();
  return true;
}

function stepVig(dt){
  if(!VIG) return;
  const d = VIG.d;
  VIG.t += dt;
  if(VIG.out>0){ VIG.out -= dt; if(VIG.out<=0) VIG=null; return; }

  // the camera leans onto the subject and stays there
  const tx = clamp(VIG.x - W/2, 0, WORLD_W-W);
  GS.camX = lerp(GS.camX, tx, 1-Math.pow(0.004,dt));

  const raw = L(String(d.lines[VIG.line]));
  VIG.ch += dt*44;
  const done = VIG.ch >= raw.length;
  const advance = ()=>{
    VIG.line++; VIG.ch=0;
    if(VIG.line >= d.lines.length){ VIG.out=0.4; VIG.line=d.lines.length-1; }
  };
  if(press('act')||press('tap')){
    AU.blip();
    if(!done) VIG.ch = raw.length; else advance();
  }
  else if(done && VIG.ch >= raw.length + (d.hold||0.8)*44) advance();
  if(d.step && VIG) d.step(VIG, dt);
}

function drawVig(g){
  if(!VIG) return;
  const d = VIG.d;
  const inT  = clamp(VIG.t/0.4, 0, 1);
  const outT = VIG.out>0 ? clamp(VIG.out/0.4, 0, 1) : 1;
  const k    = Math.min(inT, outT);
  const bar  = Math.round(24*(k*k*(3-2*k)));          // smoothstep, so it slides
  if(bar<=0) return;

  // a pool of light on whoever this is about, and the rest steps back
  const sx = VIG.x - GS.camX;
  const gr = g.createRadialGradient(sx, H*0.60, 12, sx, H*0.60, 132);
  gr.addColorStop(0,'rgba(255,238,196,0.09)');
  gr.addColorStop(1,'rgba(9,7,17,'+(0.40*k).toFixed(3)+')');
  g.fillStyle=gr; g.fillRect(0,0,W,H);

  pR(g,0,0,W,bar,'#0c0a13');
  pR(g,0,H-bar,W,bar,'#0c0a13');
  pR(g,0,bar-1,W,1,'rgba(255,214,140,0.16)');
  pR(g,0,H-bar,W,1,'rgba(255,214,140,0.16)');

  if(bar < 20) return;
  const full = L(String(d.lines[VIG.line]));
  const shown = full.slice(0, Math.max(0, VIG.ch|0));
  if(shown.length){
    const lines = wrap(g, shown, W-60, 7);
    const y0 = H - bar - 6 - (lines.length-1)*10;
    for(let i=0;i<lines.length;i++)
      pTxt(g, lines[i], W/2, y0+i*10, '#f2e6c8', 7, 'center');
  }
  if(VIG.ch >= full.length && VIG.out<=0){
    g.globalAlpha = 0.45+0.45*Math.sin(GS.t*6);
    icoDown(g, W-22, H-bar-8, 1.2, PAL.gold);
    g.globalAlpha = 1;
  }
}

/* ============================================================
   ACTIVITIES — cooking and crafting. Same engine, different smell.
   ============================================================ */
let ACT = null;
const STEP_KIND = {
  pound:{t:'timing',n:5,v:'pound',h:'pound it'},        fry:{t:'timing',n:3,v:'fry',h:'flip when golden'},
  pin:{t:'timing',n:3,v:'pin',h:'pin the folds'},       split:{t:'timing',n:4,v:'split',h:'split the bamboo'},
  light:{t:'timing',n:2,v:'light',h:'catch the wick'},
  mix:{t:'rhythm',n:6,v:'toss',h:'toss it, left and right'},
  tie:{t:'rhythm',n:5,v:'tie',h:'tie it off'},          weave:{t:'rhythm',n:8,v:'weave',h:'over, under, over, under'},
  steam:{t:'hold',dur:4,v:'steam',h:'hold the steam steady'},
  boil:{t:'hold',dur:4,v:'boil',h:'keep it just below a boil'},
  pour:{t:'hold',dur:3.5,v:'spoon',h:'fill each mould to the line'},
  bless:{t:'hold',dur:3,v:'anoint',h:'hold still and mean it'},
  plate:{t:'place',n:3,v:'plate',h:'plate it nicely'},
  thread:{t:'place',n:4,v:'thread',h:'thread the jasmine'},
  fold:{t:'place',n:3,v:'fold',h:'fold the leaf'},
  frame:{t:'place',n:3,v:'frame',h:'set the frame'},
  build:{t:'place',n:4,v:'assemble',h:'build it square'},
};
function canMake(r){ for(const k in r.need) if(!bagHas(k,r.need[k])) return false; return true; }
function startActivity(mode){
  const book = mode==='cook'? RECIPES : CRAFTS;
  ACT = {mode, phase:'pick', pick:0, ids:Object.keys(book), book, t:0,
         step:0, score:0, hits:0, m:0, dir:1, need:0, held:0, gauge:0.5, band:0.5, bandV:0.4,
         slot:0, placed:0, cursor:0, cdir:1, flash:0, doneT:0, quality:0, out:null};
  GS.state='act'; AU.sel();
}
function actRecipe(){ return ACT.book[ACT.ids[ACT.pick]]; }
function beginSteps(){
  const r=actRecipe();
  for(const k in r.need) bagTake(k, r.need[k]);
  ACT.phase='do'; ACT.step=0; ACT.score=0; ACT.t=0;
  setupStep();
}
function setupStep(){
  const r=actRecipe(), k=STEP_KIND[r.steps[ACT.step]];
  ACT.k=k; ACT.hits=0; ACT.m=0; ACT.dir=1; ACT.held=0; ACT.placed=0; ACT.cursor=0; ACT.cdir=1;
  ACT.gauge=0.5; ACT.band=0.5; ACT.bandV=0.35;
  ACT.stepScore=0; ACT.stepT=0;
  ACT.need = k.n||1;
  AU.blip();
}
function stepAct(dt){
  const A=ACT; A.t+=dt;
  if(A.flash>0) A.flash-=dt;
  if(press('back')){
    if(A.phase==='pick'){ GS.state='play'; ACT=null; clearPress(); return; }
    A.phase='pick'; clearPress(); return;
  }
  if(A.phase==='pick'){
    hitTap();                   // a tap lands on whichever recipe was drawn there
    if(press('left')||press('up')){ A.pick=(A.pick+A.ids.length-1)%A.ids.length; AU.blip(); }
    if(press('right')||press('down')){ A.pick=(A.pick+1)%A.ids.length; AU.blip(); }
    if(press('act')){
      const r=actRecipe();
      if(canMake(r)) beginSteps();
      else { toast('you are missing something','#c8888a'); AU.blip(); A.flash=0.4; }
    }
    clearPress(); return;
  }
  if(A.phase==='done'){
    A.doneT+=dt;
    if(A.doneT>0.8 && (press('act')||press('tap'))) finishActivity();
    clearPress(); return;
  }

  const k=A.k, easy = (A.mode==='cook'? (has('taste')?1.5:1) : (has('weave')?1.5:1));
  A.stepT+=dt;
  if(k.t==='timing'){
    // a marker sweeps; land it in the green
    A.m += A.dir*dt*(1.05 - A.hits*0.03);
    if(A.m>1){ A.m=1; A.dir=-1; } if(A.m<0){ A.m=0; A.dir=1; }
    if(press('act')||press('tap')){
      const zone=0.13*easy, d=Math.abs(A.m-0.5);
      if(d<zone*0.45){ A.hits++; A.stepScore+=1; AU.ranat(760+A.hits*70,0,0.05); pSpark(0,0,0); A.flash=0.25; A.perfect=1; }
      else if(d<zone){ A.hits++; A.stepScore+=0.6; AU.ranat(600,0,0.04); A.flash=0.2; A.perfect=0; }
      else { AU.whiff(); A.flash=0.3; A.perfect=-1; }
      if(A.hits>=A.need) nextStep();
    }
  }
  else if(k.t==='rhythm'){
    // alternate left and right, in time with the beat
    A.m += dt*1.5;
    if(A.m>1){ A.m=0; A.beat=(A.beat||0)+1; AU.drum(0,0.03); }
    const wantLeft = ((A.hits)%2)===0;
    const hitL=press('left'), hitR=press('right');
    if(hitL||hitR){
      const right = wantLeft? hitL : hitR;
      const good = Math.abs(A.m-0.5)<0.42*easy;
      if(right && good){ A.hits++; A.stepScore+= (Math.abs(A.m-0.5)<0.2?1:0.6); AU.ranat(560+A.hits*40,0,0.045); A.flash=0.2; A.perfect=1; }
      else { AU.whiff(); A.flash=0.3; A.perfect=-1; }
      if(A.hits>=A.need) nextStep();
    }
  }
  else if(k.t==='hold'){
    // keep the needle inside the drifting band
    A.band += A.bandV*dt;
    if(A.band>0.8){ A.band=0.8; A.bandV=-Math.abs(A.bandV); }
    if(A.band<0.2){ A.band=0.2; A.bandV=Math.abs(A.bandV); }
    if(Math.random()<dt*0.7) A.bandV = rnd(-0.4,0.4);
    const grip = K.act||K.light;
    A.gauge += (grip? 0.62 : -0.52)*dt;
    A.gauge = clamp(A.gauge,0,1);
    const w=0.13*easy;
    const inside = Math.abs(A.gauge-A.band)<w;
    if(inside){ A.held+=dt; A.stepScore+=dt; if(Math.random()<dt*8) pEmber(0,0); }
    if(A.held>=k.dur) nextStep();
  }
  else if(k.t==='place'){
    // a cursor slides; drop each piece on its mark
    A.cursor += A.cdir*dt*0.85;
    if(A.cursor>1){ A.cursor=1; A.cdir=-1; } if(A.cursor<0){ A.cursor=0; A.cdir=1; }
    const target = (A.placed+0.5)/A.need;
    if(press('act')||press('tap')){
      const d=Math.abs(A.cursor-target);
      if(d<0.10*easy){ A.stepScore+=1; AU.ranat(700+A.placed*90,0,0.05); A.flash=0.22; A.perfect=1; }
      else if(d<0.2*easy){ A.stepScore+=0.55; AU.ranat(560,0,0.04); A.flash=0.2; A.perfect=0; }
      else { AU.whiff(); A.flash=0.3; A.perfect=-1; }
      A.placed++;
      if(A.placed>=A.need) nextStep();
    }
  }
  clearPress();
}
function nextStep(){
  const A=ACT, k=A.k;
  const maxS = k.t==='hold'? k.dur : A.need;
  A.score += clamp(A.stepScore/maxS,0,1);
  A.step++;
  const r=actRecipe();
  if(A.step>=r.steps.length){
    A.quality = clamp(A.score/r.steps.length,0,1);
    A.phase='done'; A.doneT=0;
    const n = has('two')? 2 : 1;
    A.out = r.out;
    bagAdd(r.out, n, true);
    const first = !GS.learned[A.ids[A.pick]];
    GS.learned[A.ids[A.pick]] = Math.max(GS.learned[A.ids[A.pick]]||0, A.quality);
    A.first = first;
    if(first) addMerit(3);
    AU.victory();
    saveGame();
  } else setupStep();
}
function finishActivity(){
  const A=ACT; const r=A.book[A.ids[A.pick]];
  ACT=null; GS.state='play';
  const q=A.quality;
  const word = q>0.85? 'perfect' : q>0.55? 'good' : 'edible';
  toast((A.first?'+3 merit · learned ':'made ')+r.n+' — '+word, q>0.85?PAL.goldL:PAL.gold);
  if(A.first) guideSay('You made something. Somebody will be glad.');
}

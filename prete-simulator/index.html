<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prete Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
  html,body{margin:0;padding:0;height:100%;background:#080a1e;overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080a1e;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;cursor:default;touch-action:none;display:block;}
  #rot{position:fixed;left:0;right:0;bottom:6vh;text-align:center;display:none;pointer-events:none;
    color:#ffd257;font:600 15px/1.5 system-ui,sans-serif;text-shadow:0 2px 4px #000;}
  #rot b{display:block;font-size:30px;font-weight:400;margin-bottom:4px;}
  @media (orientation:portrait) and (max-width:900px){ #rot{display:block} }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen"></canvas></div>
<div id="rot">turn your phone sideways<br><span style="opacity:.6;font-size:12px">the village is a long road</span></div>
<script>
'use strict';
/* ============================================================
   PRETE SIMULATOR · PRETE SIMULATOR
   a side-scrolling Thai hungry-ghost tale

   You took what wasn't yours. You drank what wasn't offered.
   The ledger tipped, and you woke tall as the palms with a
   mouth the size of a needle's eye, wearing a torn sarong.

   Walk the village. Earn merit. Face what the dark keeps.
   ============================================================ */

const W = 480, H = 270;
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const smooth= (a,b,t)=> a+(b-a)*(1-Math.pow(1-clamp(t,0,1),3));
const dist  = (x1,y1,x2,y2)=> Math.hypot(x2-x1,y2-y1);
const rnd   = (a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const pick  = arr => arr[(Math.random()*arr.length)|0];
const sign  = v => v<0?-1:v>0?1:0;
const R = Math.round;
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function mkCv(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1,w|0); c.height=Math.max(1,h|0); return c; }
function G2(c){ const g=c.getContext('2d'); g.imageSmoothingEnabled=false; return g; }

const FT_UI  = "'Silkscreen','Courier New',monospace";
const FT_BODY= "'Courier New','Noto Sans Thai',monospace";

/* ---------- palette: a Thai village at 2am ---------- */
const PAL = {
  night0:'#080a1e', night1:'#0e1330', night2:'#171d47', night3:'#232a5e',
  moon:'#f6f0dc', moonD:'#ddd4b8',
  lamp:'#ffc44d', lampD:'#e08a2e', lampGlow:'rgba(255,180,80,',
  gold:'#f2c14e', goldD:'#c9992f', goldL:'#ffe89a',
  red:'#c0392f', redD:'#7d211a', redL:'#e05a48',
  jade:'#3f8f5f', jadeL:'#6fc38a', jadeD:'#22563a',
  wood:'#7d5a3c', woodD:'#563c27', woodL:'#9c7551',
  bone:'#f2ecd8', boneD:'#cfc4a8',
  skin:'#d8a878', skinD:'#b3855a',
  pale:'#c9c0cf', paleD:'#9a8fa8', paleL:'#e6dff0',
  indigo:'#2c4a7c', indigoD:'#1b3054', indigoL:'#4a72ad',
  violet:'#7a4ad8', violetD:'#4a2a8c',
  ember:'#ff5c3c', emberD:'#c23a20',
  grass:'#2e5c40', grassD:'#1d3d2b', grassL:'#4a8259',
  dirt:'#6b543f', dirtD:'#4e3d2d', dirtL:'#8a6d51',
  water:'#1d3a52', waterL:'#2b5f80',
  ink:'#0a0814',
};

/* ---------- canvas ---------- */
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d', { alpha:false });
let SC = 3, VW = W, VH = H, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const aw = window.innerWidth, ah = window.innerHeight;
  const s = Math.min(aw/W, ah/H);
  SC = Math.max(1, s*DPR);
  cv.width = R(W*SC); cv.height = R(H*SC);
  cv.style.width = R(W*s)+'px'; cv.style.height = R(H*s)+'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,200));
resize();

/* ============================================================
   INPUT — keyboard + canvas-drawn touch controls
   ============================================================ */
const K = {};          // held
let PRESS = {};        // edge this frame
const KEYMAP = {
  arrowleft:'left', a:'left', arrowright:'right', d:'right',
  arrowup:'up', w:'up', arrowdown:'down', s:'down',
  ' ':'jump', z:'light', j:'light', x:'heavy', k:'heavy',
  c:'whistle', l:'whistle', shift:'block',
  e:'act', enter:'act', tab:'tree', t:'tree',
  h:'help', m:'mute', escape:'back', r:'restart', n:'newgame', g:'give', f:'give', q:'map',
};
function keyDown(k){ if(!K[k]) PRESS[k]=true; K[k]=true; }
function keyUp(k){ K[k]=false; }
window.addEventListener('keydown', ev=>{
  const k = KEYMAP[ev.key.toLowerCase()];
  if(!k) return;
  ev.preventDefault(); AU.ensure(); keyDown(k);
});
window.addEventListener('keyup', ev=>{
  const k = KEYMAP[ev.key.toLowerCase()];
  if(k){ ev.preventDefault(); keyUp(k); }
});
function press(k){ if(PRESS[k]){ PRESS[k]=false; return true; } return false; }
function anyPress(){ for(const k in PRESS) if(PRESS[k]) return true; return false; }
function clearPress(){ PRESS = {}; }

/* ============================================================
   TOUCH — tap the ground to walk there. Three buttons, no d-pad.
   ============================================================ */
const TOUCH = { on:false, pts:new Map(), aim:{x:0,y:0,active:false} };
const TAP = { x:0, y:0 };            // where the last tap landed, in screen space
/* a standing walk order: the prete walks to tx and interacts on arrival */
const NAV = { on:false, tx:0, fire:0, t:0 };
function navTo(worldX){ NAV.on=true; NAV.tx=worldX; NAV.t=0; NAV.fire=0; }
function navStop(){ NAV.on=false; NAV.fire=0; }
function navTake(){ if(NAV.fire){ NAV.fire=0; return true; } return false; }

const TPADS = [];  // filled after UI layout
function tLayout(){
  TPADS.length = 0;
  const bs = 34, m = 11;
  TPADS.push({id:'tree',   x:m+bs*0.5,      y:H-m-bs*0.5, r:bs*0.58, key:'tree',   ic:'book'});
  TPADS.push({id:'whistle',x:W-m-bs*1.75,   y:H-m-bs*0.5, r:bs*0.58, key:'whistle',ic:'call'});
  TPADS.push({id:'give',   x:W-m-bs*0.5,    y:H-m-bs*0.5, r:bs*0.62, key:'give',   ic:'heart'});
}
tLayout();
function cvPos(ev){
  const r = cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)/r.width*W, y:(ev.clientY-r.top)/r.height*H };
}
/* in play the world takes taps as walk orders; everywhere else a tap is "go on" */
function tapIsWalk(){
  return typeof GS!=='undefined' && GS.state==='play' && !DLG;
}
/* screens where the two halves of the display mean left and right */
function tapSides(){
  if(typeof GS==='undefined' || DLG) return false;
  switch(GS.state){
    case 'act':    return !!ACT && ACT.phase==='do' && (ACT.k.t==='rhythm' || ACT.k.t==='place');
    case 'give':   return true;
    case 'ascend': return !!ASC && ASC.phase==='climb';
    case 'intro':  return INTRO[introI].id==='scale';
    default:       return false;
  }
}
cv.addEventListener('pointerdown', ev=>{
  ev.preventDefault(); AU.ensure();
  if(ev.pointerType==='touch') TOUCH.on = true;
  const p = cvPos(ev);
  TOUCH.aim.x=p.x; TOUCH.aim.y=p.y; TOUCH.aim.active=true;
  TAP.x=p.x; TAP.y=p.y;
  let hit = null;
  if(TOUCH.on && uiShowsPads()){
    for(const t of TPADS) if(dist(p.x,p.y,t.x,t.y) < t.r+8){ hit=t; break; }
  }
  if(hit){ TOUCH.pts.set(ev.pointerId, hit.key); keyDown(hit.key); }
  else if(tapIsWalk()){
    TOUCH.pts.set(ev.pointerId, '@nav');
    navTo(clamp(p.x + GS.camX, 16, WORLD_W-16));
  }
  else {
    // outside play a tap means "go on"; where a screen needs two sides,
    // the outer thirds stand in for left and right
    let k='act';
    if(tapSides()){ if(p.x < W*0.30) k='left'; else if(p.x > W*0.70) k='right'; }
    TOUCH.pts.set(ev.pointerId, k==='act'? '@tap' : k);
    keyDown(k); if(k==='act') PRESS.tap=true;
  }
  try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
});
cv.addEventListener('pointermove', ev=>{
  const p = cvPos(ev);
  TOUCH.aim.x=p.x; TOUCH.aim.y=p.y;
  const cur = TOUCH.pts.get(ev.pointerId);
  if(cur==='@nav' && tapIsWalk()){ TAP.x=p.x; TAP.y=p.y;   // drag to redirect the walk
    navTo(clamp(p.x + GS.camX, 16, WORLD_W-16)); return; }
  if(!cur || cur==='@tap') return;
  let hit=null;
  for(const t of TPADS) if(dist(p.x,p.y,t.x,t.y) < t.r+8){ hit=t; break; }
  if(hit && hit.key!==cur){ keyUp(cur); TOUCH.pts.set(ev.pointerId, hit.key); keyDown(hit.key); }
});
function endPt(ev){
  const cur = TOUCH.pts.get(ev.pointerId);
  if(cur==='@tap') keyUp('act');          // a held tap must let go of E
  else if(cur && cur!=='@nav') keyUp(cur);
  TOUCH.pts.delete(ev.pointerId);
  if(TOUCH.pts.size===0) TOUCH.aim.active=false;
}
cv.addEventListener('pointerup', e=>{ e.preventDefault(); endPt(e); });
cv.addEventListener('pointercancel', e=>endPt(e));
cv.addEventListener('contextmenu', e=>e.preventDefault());

/* ============================================================
   AUDIO — a whole Thai night, synthesized
   ============================================================ */
const AU = {
  ctx:null, out:null, mus:null, muted:false,
  nextCricket:0, nextPluck:2, nextFrog:5, pads:[],
  ensure(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.out = this.ctx.createGain(); this.out.gain.value = this.muted?0:0.5;
      const cmp = this.ctx.createDynamicsCompressor();
      cmp.threshold.value=-16; cmp.ratio.value=6;
      this.out.connect(cmp); cmp.connect(this.ctx.destination);
      this.mus = this.ctx.createGain(); this.mus.gain.value=0.85; this.mus.connect(this.out);
      this.startPad();
    }catch(e){}
  },
  setMute(m){ this.muted=m; if(this.out) this.out.gain.value=m?0:0.5; },
  toggle(){ this.setMute(!this.muted); saveGame(); },
  startPad(){
    for(const f of [82.4, 123.5]){
      const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type='triangle'; o.frequency.value=f; o.detune.value=rnd(-7,7);
      g.gain.value=0.02;
      const lfo=this.ctx.createOscillator(), lg=this.ctx.createGain();
      lfo.frequency.value=rnd(0.04,0.1); lg.gain.value=0.008;
      lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(this.mus); o.start(); lfo.start();
      this.pads.push({o,g});
    }
  },
  env(g,t0,a,d,pk){ g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(pk,t0+a); g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d); },
  tone(f,dur,type='sine',pk=0.05,slide=null,when=0,dest=null){
    if(!this.ctx||this.muted) return;
    const t0=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(24,slide), t0+dur);
    this.env(g,t0,0.008,dur,pk);
    o.connect(g); g.connect(dest||this.out); o.start(t0); o.stop(t0+dur+0.1);
  },
  noise(dur,pk=0.05,hp=0,lp=9000,when=0){
    if(!this.ctx||this.muted) return;
    const t0=this.ctx.currentTime+when;
    const len=Math.max(1,(dur*this.ctx.sampleRate)|0);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const n=this.ctx.createBufferSource(); n.buffer=buf;
    const f1=this.ctx.createBiquadFilter(); f1.type='lowpass'; f1.frequency.value=lp;
    const f2=this.ctx.createBiquadFilter(); f2.type='highpass'; f2.frequency.value=hp;
    const g=this.ctx.createGain(); this.env(g,t0,0.006,dur,pk);
    n.connect(f1); f1.connect(f2); f2.connect(g); g.connect(this.out); n.start(t0);
  },
  // ranat ek — the Thai xylophone, pentatonic
  ranat(f,when=0,pk=0.05){
    this.tone(f,0.9,'triangle',pk,null,when);
    this.tone(f*2.01,0.4,'sine',pk*0.35,null,when);
    this.tone(f*3.02,0.2,'sine',pk*0.15,null,when);
  },
  gong(f=98,when=0,pk=0.09){
    this.tone(f,3.2,'sine',pk,null,when);
    this.tone(f*1.48,2.6,'sine',pk*0.4,null,when+0.01);
    this.tone(f*2.37,1.8,'sine',pk*0.2,null,when+0.02);
    this.noise(0.14,pk*0.5,300,3000,when);
  },
  drum(when=0,pk=0.1){ this.tone(88,0.28,'sine',pk,44,when); this.noise(0.07,pk*0.5,120,1800,when); },
  tick(dt){
    if(!this.ctx||this.muted) return;
    if((this.nextCricket-=dt)<=0){
      const f=rnd(4000,4800);
      for(let i=0;i<3;i++) this.tone(f,0.05,'triangle',0.008,null,i*0.085);
      this.nextCricket = rnd(0.8,2.4);
    }
    if((this.nextFrog-=dt)<=0){ this.tone(rnd(150,230),0.16,'sawtooth',0.012,null,0); this.nextFrog=rnd(4,11); }
    if((this.nextPluck-=dt)<=0){
      const sc=[220,261.6,293.7,349.2,392,440,523.3];
      this.ranat(pick(sc),0,0.028);
      if(Math.random()<0.3) this.ranat(pick(sc),0.28,0.018);
      this.nextPluck = rnd(4,9);
    }
  },
  blip(){ this.tone(420,0.04,'square',0.018); },
  sel(){ this.tone(620,0.06,'square',0.022); this.tone(930,0.05,'square',0.012,null,0.04); },
  ding(){ this.ranat(880,0,0.05); this.ranat(1320,0.06,0.025); },
  bigDing(){ this.gong(131,0,0.08); [523,659,784,1047].forEach((f,i)=>this.ranat(f,i*0.1,0.05)); },
  orb(){ this.tone(rnd(1100,1500),0.2,'sine',0.026); },
  wail(){ this.tone(1900,0.85,'sine',0.05,880); this.tone(1915,0.85,'sine',0.028,890,0.02); this.noise(0.5,0.012,2000,6000); },
  step(hard){ this.noise(hard?0.06:0.04, hard?0.03:0.016, 90, hard?900:600); },
  land(){ this.noise(0.13,0.05,60,700); this.tone(90,0.13,'sine',0.04,50); },
  jump(){ this.tone(300,0.11,'sine',0.03,520); this.noise(0.05,0.012,200,1400); },
  hit(heavy){ this.noise(heavy?0.16:0.09, heavy?0.11:0.06, heavy?60:200, heavy?2400:4200); this.tone(heavy?70:150,heavy?0.2:0.1,'square',heavy?0.06:0.03,heavy?40:90); },
  block(){ this.noise(0.09,0.05,700,4000); this.tone(320,0.09,'square',0.03,240); },
  whiff(){ this.noise(0.1,0.022,900,5200); },
  spark(){ this.noise(0.07,0.045,1400,8000); },
  fix(){ this.ranat(523,0,0.05); this.ranat(784,0.11,0.05); this.ranat(1047,0.22,0.04); },
  meow(){ this.tone(780,0.15,'sine',0.045,610); this.tone(640,0.2,'sine',0.04,780,0.15); },
  purr(){ this.noise(0.4,0.02,50,280); },
  pour(){ this.noise(1.5,0.02,380,2200); },
  chant(){ this.tone(147,1.8,'sine',0.032,140); this.tone(220,1.8,'sine',0.016,214,0.1); },
  poof(){ this.noise(0.32,0.05,70,900); this.tone(150,0.3,'sine',0.04,55); },
  ghostCry(){ this.tone(rnd(500,700),0.6,'sawtooth',0.035,rnd(180,260)); this.noise(0.4,0.02,300,2200); },
  fightStart(){ this.gong(98,0,0.11); this.drum(0.35,0.09); this.drum(0.55,0.09); this.drum(0.75,0.11); },
  victory(){ [392,523,659,784,1047].forEach((f,i)=>this.ranat(f,i*0.13,0.055)); this.gong(131,0.4,0.07); },
  metta(){ [523,587,659,784,880,1047,1319].forEach((f,i)=>this.ranat(f,i*0.14,0.05)); this.gong(196,0,0.08); },
  unlock(){ this.ranat(659,0,0.05); this.ranat(988,0.09,0.045); this.gong(262,0.05,0.04); },
};

/* ============================================================
   SAVE
   ============================================================ */
const SAVE_KEY = 'prete-sim-v2';
function loadSaveRaw(){
  try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); return (s&&s.v===2)?s:null; }catch(e){ return null; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
/* ============================================================
   PIXEL PRIMITIVES — every shape lands on a whole pixel
   ============================================================ */
function hx(h){ h=h.replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgb(r,g,b){ return '#'+((1<<24)+(R(clamp(r,0,255))<<16)+(R(clamp(g,0,255))<<8)+R(clamp(b,0,255))).toString(16).slice(1); }
const _shadeCache = new Map();
function shade(h,a){
  const k=h+'|'+a.toFixed(3);
  let v=_shadeCache.get(k);
  if(v) return v;
  const c=hx(h);
  v = a>=0 ? rgb(lerp(c[0],255,a),lerp(c[1],255,a),lerp(c[2],255,a))
           : rgb(lerp(c[0],8,-a),lerp(c[1],6,-a),lerp(c[2],20,-a));
  _shadeCache.set(k,v); return v;
}
function mix(h1,h2,t){ const a=hx(h1),b=hx(h2); return rgb(lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)); }
function rgba(h,a){ const c=hx(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

function pR(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(R(x),R(y),Math.max(1,R(w)),Math.max(1,R(h))); }
function pEll(g,cx,cy,rx,ry,c){
  g.fillStyle=c; cx=R(cx); cy=R(cy); rx=Math.max(0.5,rx); ry=Math.max(0.5,ry);
  for(let y=-Math.ceil(ry); y<=Math.ceil(ry); y++){
    const t=1-(y*y)/(ry*ry); if(t<0) continue;
    const w=Math.floor(rx*Math.sqrt(t));
    g.fillRect(cx-w, cy+y, w*2+1, 1);
  }
}
function pCirc(g,cx,cy,r,c){ pEll(g,cx,cy,r,r,c); }
function pLimb(g,x1,y1,x2,y2,w,c){
  g.fillStyle=c;
  const d=Math.hypot(x2-x1,y2-y1), n=Math.max(1,Math.ceil(d/Math.max(0.6,w*0.34)));
  const h=w/2;
  for(let i=0;i<=n;i++){ const t=i/n; g.fillRect(R(lerp(x1,x2,t)-h), R(lerp(y1,y2,t)-h), Math.max(1,R(w)), Math.max(1,R(w))); }
}
function pTaper(g,x1,y1,x2,y2,w1,w2,c){
  g.fillStyle=c;
  const d=Math.hypot(x2-x1,y2-y1), n=Math.max(1,Math.ceil(d/0.6));
  for(let i=0;i<=n;i++){ const t=i/n, w=lerp(w1,w2,t);
    g.fillRect(R(lerp(x1,x2,t)-w/2), R(lerp(y1,y2,t)-w/2), Math.max(1,R(w)), Math.max(1,R(w))); }
}
function pTri(g,ax,ay,bx,by,cx2,cy2,c){
  g.fillStyle=c;
  const miny=Math.floor(Math.min(ay,by,cy2)), maxy=Math.ceil(Math.max(ay,by,cy2));
  const edges=[[ax,ay,bx,by],[bx,by,cx2,cy2],[cx2,cy2,ax,ay]];
  for(let y=miny;y<=maxy;y++){
    let xs=[];
    for(const [x1,y1,x2,y2] of edges){
      if((y1<=y&&y2>y)||(y2<=y&&y1>y)) xs.push(x1+(y-y1)/(y2-y1)*(x2-x1));
    }
    if(xs.length>=2){ xs.sort((p,q)=>p-q); g.fillRect(R(xs[0]), y, Math.max(1,R(xs[xs.length-1]-xs[0])), 1); }
  }
}
/* vertical dithered gradient — the trick that makes skies feel hand-made */
function pVGrad(g,x,y,w,h,c1,c2,steps=10){
  for(let i=0;i<steps;i++){
    const t=i/(steps-1), yy=y+h*i/steps, hh=Math.ceil(h/steps)+1;
    pR(g,x,yy,w,hh, mix(c1,c2,t));
    if(i<steps-1){ // dither band
      g.fillStyle=mix(c1,c2,(i+1)/(steps-1));
      for(let px=0;px<w;px+=2) g.fillRect(R(x+px+(i%2)), R(yy+hh-2), 1, 1);
      for(let px=0;px<w;px+=4) g.fillRect(R(x+px+((i+1)%4)), R(yy+hh-3), 1, 1);
    }
  }
}
function speck(g,x,y,w,h,cols,n,r){
  for(let i=0;i<n;i++){ g.fillStyle=cols[(r()*cols.length)|0]; g.fillRect(R(x+r()*w),R(y+r()*h),r()<0.25?2:1,1); }
}

const CL = {
  top:'#fbf7ec', body:'#efe6d4', mid:'#e0d4bc', under:'#c9bb9e', rim:'#fffdf6',
  edge:'#a89a80', ink:'#3b3128', ink2:'#7a6a55', ink3:'#a2907a',
  gold:'#c9992f', goldL:'#f2c14e',
};
function mixSafe(a,b,t){ try{ return mix(a,b,t); }catch(e){ return a; } }
const _puffCache=new Map();
/* lobes around a flat core — few and chunky, so it reads as cloud not scallop */
function puffs(w,h,seed){
  const key=w+'x'+h+'|'+seed;
  let p=_puffCache.get(key);
  if(p) return p;
  const r=mulberry((seed||1)*7919+w*13+h*7);
  const base=clamp(h*0.62,6,15);
  const step=base*1.75;
  const top=[], bot=[], side=[];
  // rounded ends
  const er=clamp(h*0.52,5,13);
  side.push({y:h*0.5, r:er, dx:er*0.42});
  const n=Math.max(1,Math.round(w/step));
  for(let i=0;i<=n;i++){
    const t=i/n, rr=base*(0.72+r()*0.5);
    top.push({x:t*w, r:rr, dy:-rr*0.42});
  }
  const m=Math.max(1,Math.round(w/(step*1.25)));
  for(let i=0;i<=m;i++){
    const t=i/m, rr=base*(0.5+r()*0.34);
    bot.push({x:(1-t)*w, r:rr, dy:rr*0.34});
  }

function cloudDraw(g,x,y,w,h,o={}){
  const P2=puffs(w,h,o.seed||((w*31+h*17)|0));
  const body=o.body||CL.body, top=o.top||CL.top, under=o.under||CL.under, edge=o.edge||CL.edge;
  const drop=o.drop===undefined?2:o.drop;
  const flat=!!o.flat;
  const lobes=(col,pad)=>{
    if(!flat) for(const q of P2.bot) pEll(g,x+q.x,y+h+q.dy,q.r+pad,q.r*0.82+pad,col);
    if(!flat) for(const q of P2.side){ pEll(g,x-q.dx,y+q.y,q.r+pad,q.r+pad,col); pEll(g,x+w+q.dx,y+q.y,q.r+pad,q.r+pad,col); }
    pR(g,x-1-pad,y-pad,w+2+pad*2,h+pad*2,col);
    for(const q of P2.top) pEll(g,x+q.x,y+q.dy,q.r+pad,q.r+pad,col);
  };
  if(drop){ g.save(); g.globalAlpha=(g.globalAlpha||1)*0.3; g.translate(0,drop+1); lobes('#0a0816',1); g.restore(); }
  lobes(edge,1);
  // fill, light on top and heavier underneath
  if(!flat) for(const q of P2.bot) pEll(g,x+q.x,y+h+q.dy,q.r,q.r*0.82,under);
  if(!flat) for(const q of P2.side){ pEll(g,x-q.dx,y+q.y,q.r,q.r,body); pEll(g,x+w+q.dx,y+q.y,q.r,q.r,body); }
  pR(g,x-1,y,w+2,h,body);
  pR(g,x-1,y+h*0.66,w+2,h*0.34,mixSafe(body,under,0.55));
  for(const q of P2.top) pEll(g,x+q.x,y+q.dy,q.r,q.r,top);
  pR(g,x-1,y,w+2,Math.max(3,h*0.4),top);
  for(const q of P2.top) pEll(g,x+q.x-q.r*0.32,y+q.dy-q.r*0.36,q.r*0.46,q.r*0.3,o.rim||CL.rim);
  if(o.acc) pR(g,x+6,y+h-1,w-12,1,o.acc);
}
/* a free-floating cartoon cloud, for skies */
function puffCloudDraw(g,cx,cy,w,h,seed,o={}){
  const r=mulberry((seed||3)*104729);
  const top=o.top||CL.top, body=o.body||CL.body, under=o.under||CL.under, edge=o.edge||CL.edge;
  const n=4+((r()*3)|0);
  const blobs=[];
  for(let i=0;i<n;i++){
    const t=n===1?0.5:i/(n-1);
    const rr=(h*0.5)*(0.62+Math.sin(t*Math.PI)*0.72);
    blobs.push({x:cx-w/2+t*w, y:cy-rr*0.34+ (r()-0.5)*h*0.22, r:rr});
  }
  const flat={x:cx,y:cy+h*0.16,w:w*0.92,h:h*0.42};
  const pass=(col,pad)=>{
    pR(g,flat.x-flat.w/2-pad,flat.y-flat.h/2-pad,flat.w+pad*2,flat.h+pad*2,col);
    for(const b of blobs) pEll(g,b.x,b.y,b.r+pad,b.r*0.92+pad,col);
  };
  pass(edge,1);
  pass(under,0);
  for(const b of blobs) pEll(g,b.x,b.y-b.r*0.12,b.r*0.92,b.r*0.8,body);
  for(const b of blobs) pEll(g,b.x-b.r*0.16,b.y-b.r*0.34,b.r*0.66,b.r*0.5,top);
  for(const b of blobs) pEll(g,b.x-b.r*0.3,b.y-b.r*0.5,b.r*0.34,b.r*0.22,o.rim||CL.rim);
}
/* clouds are expensive to scanline, so each distinct one is drawn once and reused */
const CPAD=24, _cloudSprite=new Map();
function cloudKey(w,h,o,extra){
  return (w|0)+'|'+(h|0)+'|'+(o.seed||0)+'|'+(o.top||'')+(o.body||'')+(o.under||'')+(o.edge||'')+(o.rim||'')+(o.acc||'')+'|'+(o.drop===undefined?2:o.drop)+'|'+(o.flat?'F':'')+extra;
}
function sprite(key, w, h, paint){
  let c=_cloudSprite.get(key);
  if(!c){
    if(_cloudSprite.size>240) _cloudSprite.clear();
    c=mkCv(w+CPAD*2, h+CPAD*2);
    paint(G2(c));
    _cloudSprite.set(key,c);
  }
  return c;
}
function cloud(g,x,y,w,h,o={}){
  if(w<=0||h<=0) return;
  const c=sprite(cloudKey(w,h,o,'p'), w, h, gg2=>cloudDraw(gg2,CPAD,CPAD,w,h,o));
  g.drawImage(c, R(x)-CPAD, R(y)-CPAD);
}
function puffCloud(g,cx,cy,w,h,seed,o={}){
  if(w<=0||h<=0) return;
  const c=sprite(cloudKey(w,h,Object.assign({seed},o),'f'), w, h,
    gg2=>puffCloudDraw(gg2, CPAD+w/2, CPAD+h/2, w, h, seed, o));
  g.drawImage(c, R(cx-w/2)-CPAD, R(cy-h/2)-CPAD);
}

/* cached radial glows — a gradient per lamp per frame was the whole budget */
const _glowSpr=new Map();
function glowSprite(col,r){
  const key=col+'|'+(r|0);
  let c=_glowSpr.get(key);
  if(!c){
    if(_glowSpr.size>120) _glowSpr.clear();
    const d=Math.max(2,(r|0)*2);
    c=mkCv(d,d);
    const g2=c.getContext('2d');
    const gr=g2.createRadialGradient(r,r,0,r,r,r);
    gr.addColorStop(0,rgba(col,1)); gr.addColorStop(0.45,rgba(col,0.42)); gr.addColorStop(1,rgba(col,0));
    g2.fillStyle=gr; g2.fillRect(0,0,d,d);
    _glowSpr.set(key,c);
  }
  return c;
}
function drawGlow(g,x,y,r,col,alpha){
  if(alpha<=0.003||r<1) return;
  const s=glowSprite(col,r);
  const a=g.globalAlpha;
  g.globalAlpha=a*clamp(alpha,0,1);
  g.drawImage(s, R(x-r), R(y-r));
  g.globalAlpha=a;
}

function cloudTag(g,cx,cy,w,h,o={}){ cloud(g,cx-w/2,cy-h/2,w,h,o); }
/* speech cloud with a tail of little puffs */
function cloudBubble(g,cx,byTop,w,h,tailX,tailY,o={}){
  cloud(g,cx-w/2,byTop,w,h,o);
  const n=3;
  for(let i=0;i<n;i++){
    const t=(i+1)/(n+0.6);
    const px2=lerp(cx,tailX,t), py=lerp(byTop+h,tailY,t), r=3.4-i*0.9;
    pEll(g,px2,py,r+1,r+1,o.edge||CL.edge);

  }
}

        pEll(g,cx2,cy2-S2(2),S2(4),S2(3),'#fff6e0');
        pR(g,cx2-S2(1),cy2-S2(3),S2(2),S2(2),i%2?'#4f9e5c':'#e8a13c'); }
      break;
    default: drawIcon(g,id,x,y,s*2);
  }
  // steam
  for(let i=0;i<3;i++){
    const t2=(GS.t*0.7+i*0.4)%1;
    g.globalAlpha=0.34*(1-t2);
    pEll(g,x-S2(8)+S2(i*8)+Math.sin(GS.t*2+i)*S2(2), y-S2(12)-t2*S2(16), S2(3.4),S2(2.4),'#ffffff');
    g.globalAlpha=1;
  }
}
/* crafts, displayed like they are for sale */

/* ============================================================
   SIGNPOSTS — so a crossroad reads as a crossroad

function artSign(labels){
  const c=mkCv(64,74), g=G2(c);
  pR(g,29,10,6,64,'#7d5a3c'); pR(g,33,10,2,64,'#5f4029');
  pEll(g,32,73,9,3,'#4a3728');
  labels.forEach((L,i)=>{
    const y=12+i*15, dir=L.d, w=40;
    const x0 = dir>0? 30 : 34-w;
    pR(g,x0,y,w,12,'#b8935c'); pR(g,x0,y,w,2,'#d3b478'); pR(g,x0,y+10,w,2,'#8a6a3c');
    pTri(g, dir>0? x0+w+7:x0-7, y+6, dir>0?x0+w:x0, y, dir>0?x0+w:x0, y+12, '#b8935c');
    pR(g,dir>0?x0+w-1:x0,y,1,12,'#8a6a3c');
    for(let k=0;k<4;k++) pR(g,x0+5+k*8, y+4, 5,1,'#5f4a2c');
    pR(g,x0+5,y+7,w-14,1,'#5f4a2c');
  });

}

/* ============================================================
   UI GLYPHS, DRAWN — no font characters standing in for pictures
   ============================================================ */
function icoTick(g,x,y,s,c){
  // short stroke down to the vertex, long stroke up out of it
  for(let i=0;i<3;i++) pR(g,x-4*s+i*s,y-s+i*s,s,s*2,c);
  for(let i=0;i<5;i++) pR(g,x-2*s+i*s,y+s-i*s,s,s*2,c);
}
function icoHeart(g,x,y,s,c){
  pEll(g,x-1.5*s,y-0.7*s,1.7*s,1.6*s,c);
  pEll(g,x+1.5*s,y-0.7*s,1.7*s,1.6*s,c);
  pTri(g,x,y+2.6*s,x-3*s,y-0.1*s,x+3*s,y-0.1*s,c);
}
function icoStar(g,x,y,s,c){
  pR(g,x-0.5*s,y-3*s,s,6*s,c); pR(g,x-3*s,y-0.5*s,6*s,s,c);
  for(let i=1;i<=2;i++){ const d=i*s;
    pR(g,x-d,y-d,s,s,c); pR(g,x+d-s,y-d,s,s,c);
    pR(g,x-d,y+d-s,s,s,c); pR(g,x+d-s,y+d-s,s,s,c); }
}
function icoSun(g,x,y,s,c){
  pCirc(g,x,y,2.2*s,c);
  for(let i=0;i<8;i++){ const a=i/8*TAU;
    pR(g,x+Math.cos(a)*3.6*s-0.5*s,y+Math.sin(a)*3.6*s-0.5*s,s,s,c); }
}
function icoFlower(g,x,y,s,c){
  for(let i=0;i<5;i++){ const a=i/5*TAU-Math.PI/2;
    pEll(g,x+Math.cos(a)*2.5*s,y+Math.sin(a)*2.5*s,1.5*s,1.5*s,c); }
  pCirc(g,x,y,1.3*s,mixSafe(c,'#fffdf6',0.55));
}
function icoRing(g,x,y,s,c){ for(let i=0;i<18;i++){ const a=i/18*TAU;
  pR(g,x+Math.cos(a)*2.2*s,y+Math.sin(a)*2.2*s,s,s,c); } }
function icoBeads(g,x,y,s,c){ for(let i=0;i<7;i++){ const a=i/7*TAU;
  pEll(g,x+Math.cos(a)*2.4*s,y+Math.sin(a)*2.4*s,0.9*s,0.9*s,c); } }
function icoSash(g,x,y,s,c){ pTaper(g,x-2.4*s,y-2.6*s,x+2.4*s,y+2.6*s,1.6*s,1.6*s,c); }
/* a book, for the ledger */
function icoBook(g,x,y,s,c){
  const pg=mixSafe(c,'#fffdf6',0.80);
  pR(g,x-4*s,y-3.2*s,8*s,6.8*s,c);            // the boards
  pR(g,x-3.2*s,y-2.4*s,2.6*s,5.2*s,pg);       // left page
  pR(g,x+0.6*s,y-2.4*s,2.6*s,5.2*s,pg);       // right page
  pR(g,x-0.5*s,y-3.2*s,s,6.8*s,c);            // the spine
  for(let i=0;i<3;i++){ pR(g,x-2.9*s,y-1.4*s+i*1.5*s,2*s,s*0.7,c);
    pR(g,x+0.9*s,y-1.4*s+i*1.5*s,2*s,s*0.7,c); }
}
/* the whistle: a small mouth and the sound leaving it */
function icoCall(g,x,y,s,c){
  pEll(g,x-2.6*s,y,1.2*s,1.4*s,c);
  for(let i=1;i<=3;i++){ const r=i*1.7*s;
    for(let k=-3;k<=3;k++){ const a=k/7*1.5;
      pR(g,x-1.4*s+Math.cos(a)*r,y+Math.sin(a)*r,s,s,c); } }
}
/* a downward chevron, for "press on" */
function icoDown(g,x,y,s,c){
  for(let i=0;i<3;i++){ pR(g,x-2*s+i*s,y-s+i*s,s,s,c); pR(g,x+2*s-i*s,y-s+i*s,s,s,c); }
  pR(g,x-0.5*s+0.5*s,y+2*s-s,s,s,c);
}
function icoArrow(g,x,y,s,c,dir){   // dir -1 left, +1 right
  for(let i=0;i<4;i++) pR(g,x+dir*(2*s-i*s),y-i*s,s,i*2*s+s,c);
}
/* the badge on a cosmetic row, by slot */
function cosBadge(g,slot,x,y,c){
  if(slot==='halo') icoSun(g,x,y,1,c);
  else if(slot==='garland') icoFlower(g,x,y,1,c);
  else if(slot==='beads') icoBeads(g,x,y,1.1,c);
  else if(slot==='sash') icoSash(g,x,y,1.2,c);
  else if(slot==='goldleaf') icoStar(g,x,y,1,c);
  else icoStar(g,x,y,1,c);
}

/* ============================================================
   TAP TARGETS — the draw pass records where things ended up, so a
   menu is tappable without any of the layout maths being repeated.
   ============================================================ */
const HITS=[];
function hitClear(){ HITS.length=0; }
function hitAdd(x,y,w,h,fn){ HITS.push({x,y,w,h,fn}); }
function hitTap(){
  if(!PRESS.tap) return false;
  for(let i=HITS.length-1;i>=0;i--){ const r=HITS[i];
    if(TAP.x>=r.x && TAP.x<=r.x+r.w && TAP.y>=r.y && TAP.y<=r.y+r.h){
      PRESS.tap=false; PRESS.act=false; r.fn(); return true; } }
  PRESS.tap=false; PRESS.act=false;   // a tap on empty page does nothing
  return false;
}
/* ============================================================
   THE WORLD — one long road through a village at 2am
   ============================================================ */
const WORLD_W = 5600;
const GBASE = 216;

const ZONES = [
  {id:'charnel', a:0,    b:760,  name:'the graveyard', s:'graveyard'},
  {id:'paddy',   a:760,  b:1480, name:'the rice fields', s:'paddies'},
  {id:'villageW',a:1480, b:2320, name:'the village road', s:'village'},
  {id:'centre',  a:2320, b:3000, name:'the spirit house', s:'shrine'},
  {id:'grove',   a:3000, b:3800, name:'the banana grove', el:1, s:'grove'},
  {id:'wat',     a:3800, b:4600, name:'the temple', s:'temple'},
  {id:'forest',  a:4600, b:WORLD_W, name:'the old forest', s:'old forest'},
];
function zoneAt(x){ for(const z of ZONES) if(x>=z.a && x<z.b) return z; return ZONES[ZONES.length-1]; }
function band(x,a,b,f){ return clamp((x-a)/f,0,1) * clamp((b-x)/f,0,1); }

function groundY(x){
  let y = GBASE
    + Math.sin(x*0.00152)*8
    + Math.sin(x*0.0038+1.3)*3.4
    + Math.sin(x*0.00071+0.4)*6;
  // the village road is graded flat, as roads are
  const flat = band(x,1400,3060,180);
  y = lerp(y, GBASE+2, flat*0.92);
  // paddies sit low and wet
  const low = band(x,780,1460,150);
  y = lerp(y, GBASE+9, low*0.8);
  // the wat stands on its terrace
  const hi = band(x,3860,4560,170);
  y = lerp(y, GBASE-11, hi*0.9);
  return y;
}
const isRoad = x => x>1380 && x<3120;

/* ---------- interactive anchors ---------- */
const LAMP_XS = [1520,1700,1880,2060,2250,2440,2640,2840,3020];

const apick = (arr,i)=> arr[(i|0)%arr.length];

/* ---------- parallax layers ---------- */
const PX = { far:0.18, mid:0.42, bg:0.72 };
function layerW(p){ return Math.ceil(W + (WORLD_W-W)*p) + 8; }
const farCv = mkCv(layerW(PX.far), H), farG = G2(farCv);
const midCv = mkCv(layerW(PX.mid), H), midG = G2(midCv);
const bgCv  = mkCv(layerW(PX.bg),  H), bgG  = G2(bgCv);
const playCv= mkCv(WORLD_W, H),        playG= G2(playCv);

function paintFar(){
  const g=farG, w=farCv.width, r=mulberry(4242);
  // distant karst ridges — the shape of upcountry Thailand
  for(let L=0;L<3;L++){
    const baseY = 150+L*15, amp=26-L*7, col = mix('#161b40','#2a2f5e', L*0.4);
    g.fillStyle=col;
    for(let x=0;x<w;x++){
      const h2 = baseY - (Math.sin(x*0.0042+L*2.1)*amp + Math.sin(x*0.0111+L)*amp*0.4 + Math.sin(x*0.0009)*13);
      g.fillRect(x, R(h2), 1, H-R(h2));
    }
    // ridge rim lit by the moon
    g.fillStyle = mix(col,'#4a5490',0.5);
    for(let x=0;x<w;x++){
      const h2 = baseY - (Math.sin(x*0.0042+L*2.1)*amp + Math.sin(x*0.0111+L)*amp*0.4 + Math.sin(x*0.0009)*13);
      if((x+L)%3!==0) g.fillRect(x, R(h2), 1, 1);
    }
  }
  // a far treeline blur
  g.fillStyle='#101538';
  for(let x=0;x<w;x+=2){
    const h2 = 178 + Math.sin(x*0.02)*3 + Math.sin(x*0.007)*5;
    pEll(g,x,h2,4+r()*4,4+r()*3,'#101538');
  }
}
function paintMid(){
  const g=midG, w=midCv.width, r=mulberry(9111);
  const sc = midCv.width/WORLD_W;
  // silhouetted rooftops and palms, one layer back from the road
  for(let i=0;i<64;i++){
    const x = r()*w, base = 190 + r()*8;
    if(r()<0.42){
      // roof silhouette
      const rw = 30+r()*44, rh = 15+r()*12;
      pTri(g,x,base-rh, x-rw/2,base, x+rw/2,base, '#151a42');
      pR(g,x-rw/2,base,rw,26,'#12173a');
      pR(g,x-rw/2,base-1,rw,2,'#1d2350');
      if(r()<0.5){ pR(g,x+rw*0.12,base+7,7,6, rgba(PAL.lamp,0.5)); }
    } else {
      // palm silhouette
      const th = 34+r()*30;
      pTaper(g,x,base+18,x+(r()-0.5)*10,base-th,4,2,'#12173a');
      for(let k=0;k<9;k++){ const a=(k/9)*TAU; pTaper(g,x,base-th,x+Math.cos(a)*16,base-th+Math.sin(a)*10+6,3,1,'#151a42'); }
    }
  }
  // the temple spire, unmistakable from anywhere in the village
  const tx = CHEDI_X*sc;
  for(let i=0;i<15;i++){ const rr=lerp(10,1.5,i/14); pR(g,tx-rr,150-i*6,rr*2,5, i%2?'#2a2f5e':'#1d2350'); }
  pEll(g,tx,146,17,7,'#2a2f5e'); pR(g,tx-20,152,40,40,'#1d2350');
  // low mist band
  for(let x=0;x<w;x+=3){ const a=0.05+0.04*Math.sin(x*0.01); g.fillStyle=`rgba(150,170,220,${a})`; g.fillRect(x,196+Math.sin(x*0.02)*3,3,7); }
}
function paintBg(){
  const g=bgG, w=bgCv.width, r=mulberry(777);
  const sc = bgCv.width/WORLD_W;
  const gy = x => groundY(x/sc)-4;
  // treeline behind the play line, zone-appropriate
  for(let i=0;i<96;i++){
    const wx = r()*WORLD_W, x = wx*sc, z=zoneAt(wx);
    const base = gy(x);
    let c2=null, a=0.65, s2=0.75;
    if(z.id==='charnel'){ c2=apick(ART.dead,i); a=0.55; s2=0.8; }
    else if(z.id==='grove'){ c2=apick(ART.banana,i); a=0.7; s2=0.78; }
    else if(z.id==='forest'){ c2 = r()<0.5? apick(ART.bamboo,i) : apick(ART.tam,i); a=0.6; s2=0.7; }
    else if(r()<0.5){ c2=apick(ART.palm,i); a=0.68; s2=0.72; }
    if(c2){ g.globalAlpha=a;
      g.drawImage(c2, R(x-c2.width*s2/2), R(base-c2.height*s2), R(c2.width*s2), R(c2.height*s2));
      g.globalAlpha=1; }
  }
  // a wash of night over everything back here
  g.globalCompositeOperation='source-atop';
  g.fillStyle='rgba(14,18,54,0.5)'; g.fillRect(0,0,w,H);
  g.globalCompositeOperation='source-over';
}

/* ---------- the play layer: ground, road, props ---------- */
const PROPS = [];     // {img,x,y,w,h,depth} drawn from playCv, kept for reference
function stamp(img,x,y,sc2=1){
  playG.drawImage(img, R(x-img.width*sc2/2), R(y-img.height*sc2), R(img.width*sc2), R(img.height*sc2));
}
function paintPlay(){
  const g=playG, r=mulberry(20260830);
  g.clearRect(0,0,WORLD_W,H);
  // ---- earth ----
  for(let x=0;x<WORLD_W;x++){
    const gy = R(groundY(x));
    const z = zoneAt(x);
    let top = PAL.grass, mid2 = PAL.grassD, deep='#132318';
    if(z.id==='charnel'){ top='#4a5148'; mid2='#333a34'; deep='#1e231f'; }
    if(z.id==='paddy'){ top='#2b5140'; mid2='#1d3a2e'; deep='#122019'; }
    if(z.id==='wat'){ top='#4a6a4c'; mid2='#2e4a34'; deep='#16261a'; }
    if(z.id==='forest'){ top='#274a34'; mid2='#182f22'; deep='#0e1a13'; }
    if(isRoad(x)){ top=PAL.dirt; mid2=PAL.dirtD; deep='#2a2118'; }
    g.fillStyle=top;   g.fillRect(x,gy,1,4);
    g.fillStyle=mid2;  g.fillRect(x,gy+4,1,10);
    g.fillStyle=deep;  g.fillRect(x,gy+14,1,H-gy-14);
    // the rim of light along the top edge
    if(x%3!==0){ g.fillStyle=shade(top,0.14); g.fillRect(x,gy,1,1); }
  }
  // ---- road surface: ruts, gravel, a painted centre line long since faded ----
  for(let x=1380;x<3120;x++){
    const gy=R(groundY(x));
    if((x%37)<2) { g.fillStyle=PAL.dirtL; g.fillRect(x,gy+2,1,2); }
    for(let i=0;i<2;i++){ if(r()<0.5){ g.fillStyle = r()<0.5?shade(PAL.dirt,0.12):shade(PAL.dirt,-0.14); g.fillRect(x, gy+1+(r()*11|0), 1,1); } }
  }
  for(let x=1400;x<3100;x+=1){ const gy=R(groundY(x));
    if(Math.sin(x*0.03)>0.2){ g.fillStyle=shade(PAL.dirtD,-0.08); g.fillRect(x,gy+7,1,2); } }
  // ---- water in the paddies ----
  for(let x=790;x<1450;x++){
    const gy=R(groundY(x));
    const inPaddy = Math.sin(x*0.021)>-0.25;
    if(!inPaddy) continue;
    g.fillStyle=PAL.water; g.fillRect(x,gy+1,1,7);
    g.fillStyle=PAL.waterL; g.fillRect(x,gy+1+((x*7)%3),1,1);
    if((x%11)<1){ g.fillStyle='#6f8fb8'; g.fillRect(x,gy+2,1,1); }
  }
  for(let x=790;x<1450;x+=5){
    const gy=R(groundY(x));
    if(Math.sin(x*0.021)<=-0.25) continue;
    for(let i=0;i<3;i++){ const sx=x+r()*5, sy=gy+r()*6;
      g.fillStyle=r()<0.5?'#4c8a5c':'#3a7048'; g.fillRect(R(sx),R(sy)-4,1,5); }
  }
  // the pond by the road
  for(let x=POND_X-70;x<POND_X+70;x++){
    const t=(x-(POND_X-70))/140, d=Math.sin(t*Math.PI);
    const gy=R(groundY(x));
    g.fillStyle='#6f6046'; g.fillRect(x,gy,1,2);
    g.fillStyle=PAL.water; g.fillRect(x,gy+1,1,R(3+d*9));
    g.fillStyle=PAL.waterL; g.fillRect(x,gy+2+((x*5)%4),1,1);
  }
  // ---- grass tufts, stones, litter of a real place ----
  for(let i=0;i<3600;i++){
    const x=r()*WORLD_W, gy=groundY(x), z=zoneAt(x);

/* ============================================================
   RIGS — nobody here is a sprite sheet. Everyone is a puppet,
   posed fresh every frame, so the walk never slides.
   ============================================================ */
function ik2(ax,ay,bx,by,l1,l2,flip){
  const d=clamp(dist(ax,ay,bx,by), 0.01, l1+l2-0.02);
  const a=Math.atan2(by-ay,bx-ax);
  const c=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const ang=a+c*flip;
  return {x:ax+Math.cos(ang)*l1, y:ay+Math.sin(ang)*l1};
}

/* ---------- sarong — a wrapped sarong, simulated ---------- */
function makeCloth(n, len){
  const s={pts:[], n, len};
  for(let i=0;i<n;i++){ s.pts.push([{x:0,y:0,px:0,py:0},{x:0,y:len*0.5,px:0,py:len*0.5},{x:0,y:len,px:0,py:len}]); }
  return s;
}
function stepCloth(cl, hipX, hipY, wide, dt, wind, hipVX){
  for(let i=0;i<cl.n;i++){
    const st = cl.pts[i];
    const ax = hipX + (i/(cl.n-1)-0.5)*wide;
    st[0].x = ax; st[0].y = hipY;
    for(let j=1;j<st.length;j++){
      const p=st[j];
      let vx=(p.x-p.px)*0.80, vy=(p.y-p.py)*0.80;
      p.px=p.x; p.py=p.y;
      p.x += vx + (wind*0.5 + Math.sin((wind*3)+i*0.7)*0.05 - hipVX*0.006)*dt*60*0.5;
      p.y += vy + 1.35*dt*60;
      // hold the segment length
      const q=st[j-1], seg=cl.len/(st.length-1);
      const d=Math.max(0.01,dist(q.x,q.y,p.x,p.y));
      const f=(d-seg)/d;
      p.x -= (p.x-q.x)*f; p.y -= (p.y-q.y)*f;
      // it is a wrapped skirt, not a flag: never let it swing far off the hip
      const off = 0.6 + j*0.9;
      p.x = clamp(p.x, ax-off, ax+off);
      p.y = Math.max(p.y, hipY + (cl.len/(st.length-1))*j*0.55);
    }
  }
}
const SKIRTS = {
  mudmee:{ base:'#2c4a7c', dark:'#1b3054', mark:'#d8c9a4', name:'indigo ikat' },
  plaid:{  base:'#a83f33', dark:'#7d211a', mark:'#e8dfc8', name:'red check' },
  gold:{   base:'#a8842c', dark:'#7a5f18', mark:'#ffe89a', name:'gold silk' },
  jade:{   base:'#2f6a4c', dark:'#1d472f', mark:'#a8dcb8', name:'jade weave' },
  ash:{    base:'#6b5348', dark:'#463430', mark:'#9a7e6c', name:'the rag you woke in' },
};
function drawCloth(g, cl, sk, face, opt){
  const S2 = SKIRTS[sk] || SKIRTS.ash;
  const oc = opt&&opt.oc, flare = (opt&&opt.flare)||0;
  const N = cl.n, SEG = cl.pts[0].length, STEPS = 4;
  // resolve the cloth into a grid of points, flared outward toward the hem
  const grid=[];
  for(let i=0;i<N;i++){
    const st=cl.pts[i], sp=(i/(N-1)-0.5), col=[];
    for(let j=0;j<SEG-1;j++){
      for(let s=0;s<STEPS;s++){
        const u=s/STEPS, t=(j+u)/(SEG-1);
        col.push({x:lerp(st[j].x,st[j+1].x,u)+sp*flare*t, y:lerp(st[j].y,st[j+1].y,u)});
      }
    }
    const last=st[SEG-1];
    col.push({x:last.x+sp*flare, y:last.y});
    grid.push(col);
  }
  const rows=grid[0].length;
  // silhouette first, so the drape has an edge
  if(oc){
    for(let r=0;r<rows;r++){
      const a=grid[0][r], b=grid[N-1][r];
      const x1=Math.min(a.x,b.x)-1, x2=Math.max(a.x,b.x)+1;
      const y=Math.min(a.y,b.y), h2=Math.max(2,Math.abs((grid[0][Math.min(r+1,rows-1)].y)-a.y)+2);
      pR(g,x1,y-1,x2-x1+1,h2,oc);
    }
  }
  for(let i=0;i<N-1;i++){
    for(let r=0;r<rows;r++){
      const a=grid[i][r], b=grid[i+1][r];
      const nx=grid[i][Math.min(r+1,rows-1)];
      const t=r/(rows-1);
      const front=(i>=N-2)===(face>0);
      let col = front? S2.dark : S2.base;
      if(i===Math.floor(N/2)-1) col = shade(col,0.07);           // a fold catching light
      if(t>0.86) col = shade(col,-0.14);                          // the hem falls into shadow
      const x1=Math.min(a.x,b.x), x2=Math.max(a.x,b.x);
      pR(g,x1,a.y,Math.max(1,x2-x1+1),Math.max(1,Math.abs(nx.y-a.y)+1),col);
      if(r%5===2 && i%2===0) pR(g,x1,a.y,Math.max(1,(x2-x1)*0.7),1,S2.mark);   // the weave
    }
  }
  // hem band and waistband
  const hemA=grid[0][rows-1], hemB=grid[N-1][rows-1];
  pR(g,Math.min(hemA.x,hemB.x),hemA.y,Math.abs(hemB.x-hemA.x)+1,1,S2.mark);
  const a0=cl.pts[0][0], b0=cl.pts[N-1][0];
  pR(g,Math.min(a0.x,b0.x)-1,a0.y-2,Math.abs(b0.x-a0.x)+3,4,S2.dark);
  pR(g,Math.min(a0.x,b0.x)-1,a0.y-2,Math.abs(b0.x-a0.x)+3,1,S2.mark);
  pR(g,Math.min(a0.x,b0.x)+2,a0.y-1,3,3,shade(S2.base,0.1));      // the tuck at the waist
}

/* ============================================================
   THE PRETE — tall as the palms, hands like palm leaves
   ============================================================ */
function makePrete(){
  return {
    x:0, y:0, vx:0, vy:0, face:1, onGround:true,
    phase:0, bob:0, squash:0, lean:0, blink:rnd(2,6),
    bellyX:0, bellyY:0, bellyVX:0, bellyVY:0,
    cloth: makeCloth(6, 18),
    state:'idle', anim:0, reachT:null, alpha:1,
  };
}
function stepPrete(p, dt){
  const sp = Math.abs(p.vx);
  p.phase += p.vx * dt * 0.135;                 // phase from distance — no foot slide, ever
  if(sp < 2) p.phase = lerp(p.phase, Math.round(p.phase/Math.PI)*Math.PI, 1-Math.pow(0.001,dt));
  p.lean = lerp(p.lean, clamp(p.vx*0.055,-0.9,0.9), 1-Math.pow(0.0001,dt));
  p.squash = lerp(p.squash, 0, 1-Math.pow(0.00005,dt));
  // the belly, which has opinions of its own
  const tx = -p.vx*0.05, ty = clamp(p.vy*0.035,-1.6,1.6);
  p.bellyVX += (tx - p.bellyX)*34*dt; p.bellyVX *= Math.pow(0.02,dt); p.bellyX += p.bellyVX*dt;
  p.bellyVY += (ty - p.bellyY)*30*dt; p.bellyVY *= Math.pow(0.03,dt); p.bellyY += p.bellyVY*dt;
  p.blink -= dt; if(p.blink < -0.12) p.blink = rnd(2.4,6.5);
  p.anim += dt;
}
/* outlined pixel shapes — a 1px darker rim is what makes small art read */
function oTaper(g,x1,y1,x2,y2,w1,w2,c,oc){ pTaper(g,x1,y1,x2,y2,w1+2,w2+2,oc); pTaper(g,x1,y1,x2,y2,w1,w2,c); }
function oEll(g,cx,cy,rx,ry,c,oc){ pEll(g,cx,cy,rx+1,ry+1,oc); pEll(g,cx,cy,rx,ry,c); }
function oRect(g,x,y,w,h,c,oc){ pR(g,x-1,y-1,w+2,h+2,oc); pR(g,x,y,w,h,c); }

function drawPrete(g, p, o={}){
  const face = p.face, gold = o.gold;
  const cos = o.cos || GS.cos;
  const BODY = gold?'#f0dfae':PAL.pale;
  const SHD  = gold?'#c9a45e':PAL.paleD;
  const HI   = gold?'#fff6dc':PAL.paleL;
  const OC   = gold?'#6e5424':'#463d59';        // the outline that holds him together
  const alpha = o.alpha!==undefined?o.alpha:(p.alpha||1);
  if(alpha<1){ g.save(); g.globalAlpha=alpha; }

  const rise0 = o.rise || p.rise || 0;
  const bx = p.x, by = p.y - rise0;
  const sq = clamp(p.squash,-1,1);
  const sY = 1 - sq*0.15, sX = 1 + sq*0.12;

  /* starved-tall proportions: pole legs, one drum of a belly,
     arms past the knee, and a small head on a long neck */
  const LEG=30, TH=16, SN=16, AU2=15, AL=17;
  const sp = Math.abs(p.vx);
  const stride = clamp(sp*0.19, 0, 13);
  const lift   = clamp(sp*0.10, 0, 7);
  const bobA   = p.onGround ? Math.abs(Math.sin(p.phase*2))*clamp(sp*0.03,0,2) : 0;
  const hipY = by - LEG*sY - bobA;
  const hipX = bx + p.lean*2.5;
  const chestY = hipY - 22*sY;
  const chestX = hipX + p.lean*3;
  const shY = chestY - 2;

  function legPose(i){
    const back = i===0;
    let fx, fy;
    if(!p.onGround){ fx=(back?-5:5)*face; fy = p.vy<0? -3:1; }
    else if(p.state==='block'){ fx=(back?-8:7)*face; fy=0; }
    else { const ph=p.phase+i*Math.PI, c=Math.cos(ph), s=Math.sin(ph);
      // cos falls while the foot is planted (it slides back under you) and
      // rises while it swings through — lift on the rising half, or you moonwalk
      fx=c*stride*face; fy = s<0? -Math.abs(s)*lift : 0; }
    return {back, fx:bx+fx, fy:by+fy};
  }
  function drawLeg(i){
    const L=legPose(i), col=L.back?SHD:BODY;
    const hx0=hipX+(L.back?-3:3)*face;
    const knee=ik2(hx0,hipY,L.fx,L.fy-3,TH*sY,SN*sY,face>0?1:-1);
    oTaper(g,hx0,hipY-2,knee.x,knee.y,5,4,col,OC);
    oTaper(g,knee.x,knee.y,L.fx,L.fy-3,4,3,col,OC);
    pEll(g,knee.x,knee.y,2,2,col);
    // a long narrow foot
    pR(g,L.fx-(face>0?3:5)-1,L.fy-4,10,5,OC);
    pR(g,L.fx-(face>0?3:5),L.fy-3,8,3,col);
    pR(g,L.fx-(face>0?3:5),L.fy-3,8,1,L.back?shade(SHD,0.08):shade(BODY,0.12));
    if(!L.back) pTaper(g,hx0-1,hipY,knee.x-1,knee.y,1.6,1.2,HI);
  }
  function armPose(back){
    let hx2,hy2;
    if(o.armTarget){ hx2=o.armTarget.x-(back?11*face:0); hy2=o.armTarget.y+(back?9:0); }
    else if(p.state==='block'){ hx2=chestX+(back?6:11)*face; hy2=chestY+(back?8:1); }
    else if(p.state==='wail'){ hx2=chestX+(back?-12:14)*face; hy2=chestY-15+(back?8:0); }
    else if(!p.onGround){ hx2=chestX-(back?4:8)*face; hy2=chestY+(p.vy<0?9:22); }
    else { const ph=p.phase+(back?Math.PI:0);
      hx2=chestX+Math.cos(ph)*stride*0.8*face-4.5*face;
      hy2=chestY+28+Math.abs(Math.sin(ph))*2; }
    return {hx2,hy2};
  }
  function drawArm(back){
    const {hx2,hy2}=armPose(back);
    const col=back?SHD:BODY;
    const sx0=chestX+(back?-3.5:3.5)*face;
    const el=ik2(sx0,shY,hx2,hy2,AU2,AL,back?(face>0?-1:1):(face>0?1:-1));
    oTaper(g,sx0,shY,el.x,el.y,4,3.4,col,OC);
    oTaper(g,el.x,el.y,hx2,hy2,3.4,2.8,col,OC);
    pEll(g,el.x,el.y,1.8,1.8,col);
    // hands as big as palm leaves
    const ang=Math.atan2(hy2-el.y,hx2-el.x), cx2=Math.cos(ang), cy2=Math.sin(ang);
    const px2=hx2+cx2*2.4, py2=hy2+cy2*2.4;
    for(let f2=0;f2<4;f2++){ const fa=ang+(f2-1.5)*0.34;
      pTaper(g,px2,py2,px2+Math.cos(fa)*6,py2+Math.sin(fa)*6,2.6,2,OC); }
    oEll(g,px2,py2,2.8,3.3,col,OC);
    for(let f2=0;f2<4;f2++){ const fa=ang+(f2-1.5)*0.34;
      pTaper(g,px2,py2,px2+Math.cos(fa)*5.4,py2+Math.sin(fa)*5.4,1.5,1,col); }
    if(!back) pEll(g,px2-cx2*1.1,py2-cy2*1.1,1.4,1.6,HI);
    return {x:px2,y:py2};
  }

  /* ---- back to front ---- */
  drawLeg(0);
  const handB = drawArm(true);
  drawLeg(1);

  stepCloth(p.cloth, hipX, hipY-4, 11*sX, o.dt||0.016, o.wind||0, p.vx);
  drawCloth(g, p.cloth, cos.skirt||'ash', face, {oc:OC, flare:3});

  // torso — narrow, ribbed, apologetic
  oTaper(g, hipX, hipY-5, chestX, chestY+4, 6.5, 8, BODY, OC);
  oRect(g, chestX-4, chestY-3, 8, 9, BODY, OC);
  pR(g, chestX+(face>0?2:-4), chestY-3, 2, 9, SHD);
  pR(g, chestX-4, chestY-3, 1.6, 9, HI);
  for(let i=0;i<3;i++) pR(g, chestX-3, chestY+0.6+i*2.2, 6, 1, SHD);
  pR(g, chestX-4, chestY-4, 8, 1.6, SHD);                       // collarbone

  // the belly — the whole point of a prete
  const belX = lerp(hipX,chestX,0.28) + p.bellyX;
  const belY = hipY - 10.5*sY + p.bellyY;
  const brx = 8*sX, bry = 7.6*sY;
  pEll(g, belX, belY+1, brx, bry, OC);            // a rim on the underside only
  pEll(g, belX, belY, brx, bry, BODY);
  pEll(g, belX + 3*face, belY+1.4, brx*0.5, bry*0.66, SHD);
  pEll(g, belX - 2.8*face, belY-2.6, brx*0.28, bry*0.26, HI);
  pR(g, belX-0.5*face, belY+3, 1.4, 1.6, SHD);                  // navel
  if(cos.goldleaf) for(let i=0;i<6;i++) pR(g, belX-5+((i*7)%10), belY-4+((i*5)%8), 2,2, PAL.goldL);

  const handF = drawArm(false);
  o.hands=[handB,handF];

  /* ---- neck & head ---- */
  const headY = chestY - 13.5 + Math.sin(p.anim*1.6)*0.4;
  const headX = chestX + p.lean*2 + (o.headX||0);
  oTaper(g, chestX, chestY-4, headX, headY+4.5, 3.4, 3, SHD, OC);
  const HRX=5, HRY=5.8;
  oEll(g, headX, headY, HRX, HRY, BODY, OC);
  pEll(g, headX+2.4*face, headY+0.8, HRX*0.6, HRY*0.72, SHD);   // shaded side
  pEll(g, headX-2*face, headY-3, 2, 1.6, HI);                   // skull highlight
  pEll(g, headX+0.6*face, headY+4, 3, 2.2, BODY);               // jaw
  pR(g, headX-4.8*face, headY+0.5, 1.6, 2.4, SHD);              // ear
  // sunken sockets, then the small lights inside them
  const e1 = headX + 2.1*face, e2 = headX - 2.1*face;
  pEll(g, e1, headY-0.4, 1.9, 2.1, '#2a2138');
  pEll(g, e2, headY-0.4, 1.7, 1.9, '#2a2138');
  const blink = p.blink < 0;
  if(!blink){
    pR(g, e1-(face>0?0.4:1), headY-1.2, 1.2, 1.4, o.angry?PAL.ember:'#fff7ea');
    pR(g, e2-(face>0?0.4:1), headY-1.2, 1.1, 1.3, o.angry?PAL.ember:'#fff7ea');
  } else { pR(g,e1-1.4,headY-0.4,3,1,SHD); pR(g,e2-1.4,headY-0.4,2.8,1,SHD); }
  // brow ridge — sorry, or furious
  pR(g, e1-2, headY-3.4+(o.angry?1.4:0), 3.8, 1.2, SHD);
  pR(g, e2-1.8, headY-3.6+(o.angry?1.4:0), 3.2, 1.2, SHD);
  // a mouth the size of the eye of a needle. it never opens wider.
  const mo=clamp(o.mouth||0,0,1)*0.35;
  pEll(g, headX+0.7*face, headY+4, 0.9+mo*2, 0.9+mo*2, '#b4515e');
  pR(g, headX+0.7*face, headY+4, 1, 1, '#5e1f2a');

  /* ---- what you chose to wear ---- */
  if(cos.garland){
    for(let i=0;i<10;i++){ const a=Math.PI*(i/9);
      pEll(g, chestX+Math.cos(a+Math.PI)*7, chestY-3+Math.sin(a)*6.5, 1.6,1.6, i%3===0?'#ffce54':'#f6f0dc'); }
    pEll(g, chestX, chestY+4.5, 1.6, 2.4, PAL.jadeL);
  }
  if(cos.sash){
    pTaper(g, chestX-5, chestY-4, hipX+6*face, hipY-6, 5, 2.6, '#d8b04a');
    pTaper(g, chestX-5, chestY-4, hipX+6*face, hipY-6, 1.8, 1, '#ffe89a');
  }
  if(cos.beads) for(let i=0;i<8;i++){ const a=Math.PI*(i/7);
    pEll(g, chestX+Math.cos(a+Math.PI)*6, chestY-2+Math.sin(a)*5, 1.3,1.3, i%2?'#6b4a2c':'#8a6440'); }
  if(cos.halo){
    const hr=12+Math.sin(p.anim*2)*0.8;
    for(let i=0;i<26;i++){ const a=i/26*TAU + p.anim*0.3;
      pR(g, headX+Math.cos(a)*hr, headY-1+Math.sin(a)*hr*0.9, 1,1, i%2?PAL.goldL:PAL.gold); }
  }
  if(alpha<1) g.restore();
  return {hipX,hipY,chestX,chestY,headX,headY,hands:o.hands};
}

/* ============================================================
   VILLAGERS — the reason any of this matters
   ============================================================ */
function makeVillager(cfg){
  return Object.assign({ x:0,y:0,vx:0,face:1,phase:0,anim:rnd(9),state:'idle',
    cloth:makeCloth(4,9), bob:0 }, cfg);
}
function drawVillager(g, v, o={}){
  const sk=v.skin||PAL.skin, skD=v.skinD||PAL.skinD;
  const sh=v.shirt||'#4a7a9e', shD=v.shirtD||shade(v.shirt||'#4a7a9e',-0.25);
  const face=v.face, sp=Math.abs(v.vx);
  const LEG=9, TH=5, SN=5;
  const stride=clamp(sp*0.2,0,4.6), lift=clamp(sp*0.1,0,2.4);
  const bob = Math.abs(Math.sin(v.phase*2))*clamp(sp*0.03,0,1);
  const hipY=v.y-LEG-bob, hipX=v.x;
  const wai = v.state==='wai' || o.wai;
  // legs
  for(let i=0;i<2;i++){
    const ph=v.phase+i*Math.PI, c=Math.cos(ph), s=Math.sin(ph);
    // same rule as the prete: the planted foot slides back while cos falls, so
    // the lift belongs on the rising half or the villagers moonwalk too
    const fx=v.x+c*stride*face, fy=v.y+(s<0? -Math.abs(s)*lift : 0);
    const knee=ik2(hipX+(i?1:-1),hipY,fx,fy-1,TH,SN,face>0?1:-1);
    const col=i===0? (v.skirt? shade(v.legs||'#3a3a44',-0.25):shade(v.legs||'#3a3a44',-0.2)) : (v.legs||'#3a3a44');
    if(!v.skirt){ pLimb(g,hipX+(i?1:-1),hipY,knee.x,knee.y,3,col); pLimb(g,knee.x,knee.y,fx,fy-1,2.5,col); }
    pR(g,fx-2,fy-2,4,2,'#3a2c26');
  }
  if(v.skirt){   // sarong on the women, as in any village
    stepCloth(v.cloth,hipX,hipY-1,9,o.dt||0.016,o.wind||0,v.vx);
    drawCloth(g,v.cloth,v.skirtPat||'plaid',face,{flare:4});
  }
  // torso
  const chestY=hipY-8;
  pR(g,hipX-4,chestY,8,9,sh); pR(g,hipX+(face>0?1:-4),chestY,3,9,shD);
  pR(g,hipX-4,chestY,8,1,shade(sh,0.15));
  // arms
  for(let i=0;i<2;i++){
    const back=i===0;
    let hx2,hy2;
    if(wai){ hx2=hipX+1.5*face; hy2=chestY-4; }
    else if(v.carry && !back){ hx2=hipX+5*face; hy2=chestY+3; }
    else { const ph=v.phase+(back?Math.PI:0); hx2=hipX+Math.cos(ph)*stride*0.7*face; hy2=chestY+9; }
    const el=ik2(hipX+(back?-3:3)*face,chestY+1,hx2,hy2,5,5,back?(face>0?-1:1):(face>0?1:-1));
    pLimb(g,hipX+(back?-3:3)*face,chestY+1,el.x,el.y,2.6,back?shD:sh);
    pLimb(g,el.x,el.y,hx2,hy2,2.4,back?skD:sk);
    pEll(g,hx2,hy2,1.6,1.6,back?skD:sk);
  }
  if(wai){ pEll(g,hipX+1.6*face,chestY-5,2.2,3,sk); pR(g,hipX+0.6*face,chestY-7,2,3,skD); }
  // head
  const hy3=chestY-6;
  pEll(g,hipX+0.5*face,hy3,4.2,4.6,sk);
  pEll(g,hipX+2.4*face,hy3+0.4,2.4,3.6,skD);
  pR(g,hipX+2*face,hy3-1,1,1,'#2c2020'); pR(g,hipX-1*face,hy3-1,1,1,'#2c2020');
  // hair
  const hc=v.hairC||'#241c18';
  if(v.hair==='bald'){ pEll(g,hipX+0.5*face,hy3-2,4,2,skD); }
  else if(v.hair==='bun'){ pEll(g,hipX+0.5*face,hy3-2.6,4.3,2.6,hc); pEll(g,hipX-3.4*face,hy3-3.6,2.2,2.2,hc); }
  else if(v.hair==='tails'){ pEll(g,hipX+0.5*face,hy3-2.4,4.3,2.6,hc); pEll(g,hipX-4.6*face,hy3+1,1.6,2.6,hc); pEll(g,hipX+4.6*face,hy3+1,1.6,2.6,hc); }
  else { pEll(g,hipX+0.5*face,hy3-2.4,4.4,2.8,hc); pR(g,hipX-4*face,hy3-2,2,3,hc); }
  if(v.hat){ pEll(g,hipX+0.5*face,hy3-4,7,1.6,v.hat); pEll(g,hipX+0.5*face,hy3-5,3.4,2,v.hat); }
  if(v.monk){  // the robe over one shoulder
    pTaper(g,hipX-4,chestY,hipX+4,chestY+9,3,7,'#e8923f');
    pR(g,hipX-4,chestY+2,9,7,'#e8923f'); pR(g,hipX+2*face,chestY+2,3,7,'#b56a28');
  }
  if(v.carry) pEll(g,hipX+7*face,chestY+2,3.4,2.6,'#f5ead8');
}

/* ============================================================
   GHOSTS — the folklore, drawn as it was told
   ============================================================ */
function drawTani(g,t,o={}){
  const face=t.face||-1, bob=Math.sin(t.anim*1.5)*2;
  const x=t.x, y=t.y-2+bob;
  const HAIR='#151030', SK='#efe2c4', SKD='#d5c4a2', DR='#3f8f5f', DRD='#22563a';
  // she fades out below the knee, the way grove spirits do
  for(let i=0;i<7;i++){ const a=0.5-i*0.07; g.globalAlpha=a;
    pEll(g,x+Math.sin(t.anim*2+i)*1.5, y-2+i*2.5, 5-i*0.5, 2, DRD); }
  g.globalAlpha=1;
  // dress
  pR(g,x-5,y-20,10,14,DR); pR(g,x+(face>0?1:-5),y-20,4,14,DRD);
  for(let i=0;i<4;i++) pR(g,x-5,y-18+i*4,10,1,shade(DR,0.1));
  pTaper(g,x-4,y-8,x-3,y-1,9,6,DR);
  // sabai sash sash
  pTaper(g,x-5,y-21,x+4,y-10,4,2,'#a8dcb8');
  // arms
  const ax = o.wave? x+8*face : x+1;
  const ay = o.wave? y-26 : y-11;
  const el=ik2(x+4*face,y-19,ax,ay,5,5,face>0?1:-1);
  pLimb(g,x+4*face,y-19,el.x,el.y,2.4,SK); pLimb(g,el.x,el.y,ax,ay,2.2,SK); pEll(g,ax,ay,1.6,1.6,SK);
  pLimb(g,x-4*face,y-19,x-3*face,y-12,2.4,SKD);
  // head with the long black curtain of hair
  const hy=y-27;
  pEll(g,x,hy,4.6,5,SK); pEll(g,x+2.2*face,hy+0.4,2.6,3.8,SKD);
  pEll(g,x,hy-2,5.2,3.4,HAIR);
  pR(g,x-6,hy-2,3,15,HAIR); pR(g,x+3,hy-2,3,15,HAIR);
  pR(g,x-6,hy+11,2,4,HAIR); pR(g,x+4,hy+11,2,4,HAIR);
  pR(g,x+1.4*face,hy-1,1,1,'#2a2238'); pR(g,x-1.6*face,hy-1,1,1,'#2a2238');
  pR(g,x,hy+2,2,1,'#c04a55');
  // her green glow
  drawGlow(g,x,y-16,26,'#6ee696',0.16);
}
function drawPhraPhum(g,x,y,anim){
  const bob=Math.sin(anim*1.6)*1.6, yy=y+bob;
  drawGlow(g,x,yy-8,22,'#ffd26e',0.22);
  // a small, regal, deeply patient spirit
  pTaper(g,x,yy-2,x,yy-14,8,7,PAL.gold);
  pR(g,x-4,yy-14,8,3,PAL.goldD);
  pEll(g,x,yy-18,4,4.4,PAL.goldL); pEll(g,x+1.6,yy-17.6,2.4,3.4,PAL.goldD);
  pR(g,x-1.4,yy-19,1,1,'#3a2a10'); pR(g,x+0.8,yy-19,1,1,'#3a2a10');
  // the crown
  pTri(g,x,yy-27,x-4,yy-21,x+4,yy-21,PAL.goldL);
  pR(g,x-4,yy-22,8,2,PAL.goldD); pR(g,x-1,yy-29,2,3,PAL.goldL);
  // sword in the right hand, money bag in the left
  pLimb(g,x+4,yy-13,x+8,yy-16,2,PAL.goldD);
  pTaper(g,x+8,yy-16,x+11,yy-30,3,1,'#e8e2d2'); pR(g,x+7,yy-17,6,2,PAL.goldD);
  pLimb(g,x-4,yy-13,x-8,yy-11,2,PAL.goldD);
  pEll(g,x-9,yy-9,3,3.4,'#c9992f'); pR(g,x-10,yy-12,4,2,'#8a6a1e');
  // he trails off into light, not legs
  for(let i=0;i<5;i++){ g.globalAlpha=0.35-i*0.06; pEll(g,x+Math.sin(anim*3+i)*1.4,yy+1+i*2,4-i*0.6,1.6,PAL.gold); }
  g.globalAlpha=1;
}
/* --- the roster of things that go wrong in the dark --- */
function drawKongKoi(g,e){
  // Kong Koi — one leg, hops, cries "koi… koi…", drinks from your toes
  const x=e.x,y=e.y,f=e.face,t=e.anim;
  const sk='#7e8f6a', skD='#5c6b4c';
  const hop = e.hop||0;
  pEll(g,x,y-1,7,2,'rgba(10,8,20,0.4)');
  // the single long leg
  const footY=y-hop;
  const knee=ik2(x,y-16-hop,x,footY,9,9,f>0?1:-1);
  pLimb(g,x,y-16-hop,knee.x,knee.y,4,skD); pLimb(g,knee.x,knee.y,x,footY,3.4,sk);
  pR(g,x-3,footY-2,8,3,skD);
  // gaunt body
  pEll(g,x,y-21-hop,5.4,6.6,sk); pEll(g,x+2*f,y-20-hop,3,4.4,skD);
  for(let i=0;i<3;i++) pR(g,x-3,y-24-hop+i*2,6,1,skD);
  // long dangling arms
  for(let i=0;i<2;i++){
    const sw=Math.sin(t*3+i*2)*3;
    pLimb(g,x+(i?3:-3),y-26-hop,x+(i?6:-6)+sw,y-14-hop,2.4,i?skD:sk);
    pEll(g,x+(i?6:-6)+sw,y-13-hop,2,2.4,i?skD:sk);
  }
  // head: one big eye and a thirsty tongue
  const hy=y-33-hop;
  pEll(g,x,hy,5,5.4,sk); pEll(g,x+2*f,hy+0.5,2.8,3.8,skD);
  pEll(g,x+1*f,hy-1,2.4,2.6,'#f6f0dc');
  pEll(g,x+1.6*f,hy-1,1.3,1.5, e.friendly?'#2f5a3a':'#c02a2a');
  pR(g,x+1.2*f,hy-1.8,1,1,'#ffffff');
  pR(g,x-3*f,hy-2,3,1,skD);
  if(e.friendly){ pEll(g,x+0.6*f,hy+3,2.4,1.2,'#c05a6a'); pEll(g,x+0.6*f,hy+2.4,2,0.8,'#8f3f4c'); }

function drawCat(g,c){
  const x=c.x,y=c.y,f=c.face||1,t=c.anim;
  const O='#e8984a',OD='#b96f2e',WT='#f5ead8';
  if(c.state==='sit'||c.state==='tree'){
    pEll(g,x,y-1,7,2,'rgba(10,8,20,0.35)');
    pEll(g,x-2*f,y-5,5,5,O); pEll(g,x-3.5*f,y-5,3,4,OD);
    pEll(g,x+3*f,y-8,4,4,O); pEll(g,x+4.4*f,y-8,2,3,OD);
    pTri(g,x+1.4*f,y-13,x+0.6*f,y-9,x+3.4*f,y-9.6,O);
    pTri(g,x+5*f,y-13,x+4*f,y-9.6,x+6.4*f,y-9.4,O);
    pR(g,x+2*f,y-8.6,1,1,'#243'); pR(g,x+4.6*f,y-8.6,1,1,'#243');
    pR(g,x+3.4*f,y-6.6,1.4,1,WT);
    const tw=Math.sin(t*2)*3;
    pTaper(g,x-6*f,y-5,x-9*f,y-9+tw,3,2,OD);
    pR(g,x-1*f,y-1,2,1,WT); pR(g,x+2*f,y-1,2,1,WT);
  } else {
    pEll(g,x,y-1,7,2,'rgba(10,8,20,0.3)');
    const ph=c.phase||0;
    pEll(g,x,y-6,7,3.6,O); pEll(g,x+2*f,y-6,4,3,OD);
    pEll(g,x+7*f,y-8,3.6,3.4,O);
    pTri(g,x+5.6*f,y-12,x+5*f,y-9,x+7.4*f,y-9.4,O);
    pTri(g,x+8.6*f,y-12,x+8*f,y-9.4,x+9.8*f,y-9,O);
    pR(g,x+6.4*f,y-8.6,1,1,'#243'); pR(g,x+8.6*f,y-8.6,1,1,'#243');
    for(let i=0;i<4;i++){ const lx=x+(-3+i*2.6)*f, s2=Math.sin(ph+i*1.6)*1.6;
      pLimb(g,lx,y-4,lx+s2,y-1,1.8, i%2?OD:O); }
    pTaper(g,x-6*f,y-7,x-10*f,y-11+Math.sin(t*3)*2,3,2,OD);
  }
}

function bagAdd(id,n=1,force){
  // anything you made or were given always fits — only foraging is capped
  if(!force){
    const room = bagMax()-bagCount();
    if(room<=0){ toast('your basket is full — cook or give something away','#c8888a'); return 0; }
    n=Math.min(n,room);
  }
  GS.bag[id]=(GS.bag[id]||0)+n; saveGame(); return n;
}
function bagTake(id,n=1){
  if((GS.bag[id]||0)<n) return false;
  GS.bag[id]-=n; if(GS.bag[id]<=0) delete GS.bag[id]; saveGame(); return true;
}

const PT = [];
function part(o){ PT.push(Object.assign({t:0,life:1,vx:0,vy:0},o)); }
function pOrb(x,y,d=0){ part({k:'orb',x,y,t:-d,life:8}); }
function pSpark(x,y,n=6,c=PAL.gold){ for(let i=0;i<n;i++) part({k:'sp',x:x+rnd(-4,4),y:y+rnd(-4,4),vx:rnd(-30,30),vy:rnd(-50,-8),life:rnd(.4,.9),c}); }
function pDust(x,y,n=5){ for(let i=0;i<n;i++) part({k:'dust',x:x+rnd(-5,5),y,vx:rnd(-26,26),vy:rnd(-16,-3),life:rnd(.3,.7)}); }
function pSmoke(x,y,d=0){ part({k:'smoke',x,y,t:-d,life:3,sw:rnd(TAU)}); }
function pHeart(x,y){ part({k:'heart',x,y,vy:-14,life:1.4}); }
function pRing(x,y,c='#fff0c0',r=70){ part({k:'ring',x,y,life:.6,c,r}); }
function pPetal(x,y,c){ part({k:'petal',x:x+rnd(-40,40),y:y-rnd(20,70),vx:rnd(-6,6),vy:rnd(10,20),life:rnd(2,3.6),sw:rnd(TAU),c:c||PAL.goldL}); }
function pSplash(x,y){ for(let i=0;i<8;i++) part({k:'water',x,y,vx:rnd(-40,40),vy:rnd(-60,-15),life:rnd(.3,.7)}); }
function pEmber(x,y){ part({k:'ember',x,y,vx:rnd(-8,8),vy:rnd(-22,-8),life:rnd(.8,1.7)}); }
function pPop(x,y,c){ for(let i=0;i<10;i++) part({k:'pop',x,y,vx:rnd(-40,40),vy:rnd(-60,-10),life:rnd(.4,.8),c}); }
function pMoth(x,y){ part({k:'moth',x,y,life:99,sw:rnd(TAU),hx:x,hy:y}); }
function stepParts(dt){
  for(let i=PT.length-1;i>=0;i--){
    const p=PT[i]; p.t+=dt;
    if(p.t<0) continue;
    switch(p.k){
      case 'orb':{
        const tx=P.x, ty=P.y-34, d=Math.max(1,dist(p.x,p.y,tx,ty));
        const sp2=Math.min(190,40+p.t*120);
        if(d<6){ addMerit(1,true); AU.orb(); pSpark(tx,ty,3); PT.splice(i,1); continue; }
        p.x+=(tx-p.x)/d*sp2*dt+Math.sin(p.t*7)*0.5; p.y+=(ty-p.y)/d*sp2*dt;
        break; }
      case 'smoke': p.y-=dt*11; p.x+=Math.sin(p.t*2+p.sw)*0.3; break;
      case 'sp': case 'dust': case 'pop': case 'water':
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.k==='water'?300:120)*dt;
        if(p.k==='dust') p.vx*=Math.pow(0.1,dt);
        break;
      case 'heart': p.y+=p.vy*dt; break;
      case 'petal': p.y+=p.vy*dt; p.x+=p.vx*dt+Math.sin(p.t*3+p.sw)*0.5; break;
      case 'ember': p.x+=p.vx*dt+Math.sin(p.t*3)*0.3; p.y+=p.vy*dt; break;
      case 'moth': p.x=p.hx+Math.sin(p.t*2.2+p.sw)*13+Math.sin(p.t*0.7)*5;
                   p.y=p.hy+Math.cos(p.t*3.1+p.sw)*7; break;
    }
    if(p.k!=='moth' && p.t>=p.life) PT.splice(i,1);
  }
}
function drawParts(g){
  for(const p of PT){
    if(p.t<0) continue;
    const lt=p.t/p.life, a=1-lt;
    switch(p.k){
      case 'orb':
        pR(g,p.x-1,p.y-1,3,3,PAL.gold); pR(g,p.x,p.y-2,1,5,rgba(PAL.goldL,0.6)); pR(g,p.x-2,p.y,5,1,rgba(PAL.goldL,0.6));
        break;
      case 'smoke': g.globalAlpha=0.3*a; pEll(g,p.x,p.y,2-lt,2-lt,'#c8c0d8'); g.globalAlpha=1; break;
      case 'sp': g.globalAlpha=a; pR(g,p.x,p.y,1,1,p.c); if(lt<0.4){pR(g,p.x-1,p.y,1,1,p.c);pR(g,p.x+1,p.y,1,1,p.c);} g.globalAlpha=1; break;
      case 'dust': g.globalAlpha=a*0.6; pEll(g,p.x,p.y,1+lt*2,1+lt,'#9a8f7a'); g.globalAlpha=1; break;
      case 'pop': g.globalAlpha=a; pEll(g,p.x,p.y,1.6-lt,1.6-lt,p.c); g.globalAlpha=1; break;
      case 'heart': g.globalAlpha=a; pR(g,p.x-1,p.y-1,1,1,'#ff8fae'); pR(g,p.x+1,p.y-1,1,1,'#ff8fae'); pR(g,p.x-1,p.y,3,1,'#ff8fae'); pR(g,p.x,p.y+1,1,1,'#ff8fae'); g.globalAlpha=1; break;
      case 'ring': g.globalAlpha=a*0.7; g.strokeStyle=p.c; g.lineWidth=1; g.beginPath(); g.arc(R(p.x),R(p.y),4+lt*p.r,0,TAU); g.stroke(); g.globalAlpha=1; break;
      case 'petal': g.globalAlpha=a; pR(g,p.x,p.y,2,1,p.c||PAL.goldL); g.globalAlpha=1; break;
      case 'water': g.globalAlpha=a; pR(g,p.x,p.y,1,2,'#8fc4e8'); g.globalAlpha=1; break;
      case 'ember': g.globalAlpha=a*0.9; pR(g,p.x,p.y,1,1,lt<0.5?'#ffd257':PAL.ember); g.globalAlpha=1; break;
      case 'moth': { const f=Math.sin(p.t*22)*2.2;
        pR(g,p.x,p.y,2,1,'#e8dfc8'); pR(g,p.x-1,p.y-f*0.5,1,1,'#f6f0dc'); pR(g,p.x+2,p.y+f*0.5,1,1,'#f6f0dc'); break; }
    }
  }
}

   ============================================================ */
const SPD = ()=> has('stride')? 118 : 88;
function stepPlayer(dt){
  const busy = !!DLG || GS.state!=='play';
  let ax=0, ease=1;
  if(busy) navStop();
  else {
    if(K.left) ax-=1; if(K.right) ax+=1;
    if(ax) navStop();                       // a key press cancels the walk order
    else if(NAV.on){
      NAV.t+=dt;
      const d=NAV.tx-P.x;
      if(Math.abs(d)<7 || NAV.t>14){ NAV.on=false; NAV.fire=1; }
      else { ax = d>0?1:-1; ease = clamp(Math.abs(d)/30,0.34,1); }   // slow into the mark
    }
  }
  const target = ax*SPD()*ease;
  const acc = ax!==0 ? (P.onGround?1000:620) : (P.onGround?1500:420);
  P.vx += clamp(target-P.vx, -acc*dt, acc*dt);
  if(ax!==0) P.face = ax;

  P.coyote = P.onGround ? 0.1 : Math.max(0,P.coyote-dt);
  if(!busy && (press('jump')||press('up'))) P.buf=0.13; else P.buf=Math.max(0,P.buf-dt);
  const maxJumps = has('float')?2:1;
  if(P.buf>0 && (P.coyote>0 || P.jumps<maxJumps)){
    P.vy=-238; P.buf=0; P.coyote=0; P.onGround=false;
    P.jumps = P.coyote>0?1:P.jumps+1;
    P.squash=-0.5; AU.jump(); pDust(P.x,P.y,5);
  }
  if(P.vy<0 && !(K.jump||K.up)) P.vy += 640*dt;
  P.vy += 760*dt; P.vy = Math.min(P.vy, 420);
  P.x = clamp(P.x + P.vx*dt, 16, WORLD_W-16);
  P.y += P.vy*dt;
  const gy = groundY(P.x);
  if(P.y >= gy){
    if(!P.onGround){ const f=clamp(P.vy/380,0,1);
      P.squash=0.35+f*0.5; AU.land(); pDust(P.x,gy,4+f*8);
      if(f>0.5) GS.shake=Math.max(GS.shake,2); }
    P.y=gy; P.vy=0; P.onGround=true; P.jumps=0;
  } else P.onGround=false;

  const nf = Math.floor(P.phase/Math.PI);
  if(P.onGround && nf!==(P._sf||0) && Math.abs(P.vx)>18){ AU.step(Math.abs(P.vx)>100); pDust(P.x,P.y,2); }
  P._sf = nf;

  // the whistle is a greeting now, nothing more
  P.wailCd=Math.max(0,P.wailCd-dt);
  if(!busy && press('whistle') && P.wailCd<=0){
    P.wailCd=1.2; P.wailT=0.5; AU.wail();
    pRing(P.x,P.y-38,'#fff0c0',80);
    let greeted=0;
    for(const n of NPCS) if(Math.abs(n.x-P.x)<110){ n.mark={k:'call',t:1.6}; greeted++; }
    for(const s of SPIRITS) if(Math.abs(s.x-P.x)<130 && s.met){ s.wave=1.4; greeted++; }
    if(Math.abs(CAT.x-P.x)<110 && CAT.state==='wander'){ CAT.tx=P.x; AU.meow(); }
    if(greeted && !GS.seen.greet){ GS.seen.greet=true; khwanSay('They heard that. A prete\'s whistle is just a hello with the volume stuck on.'); }
  }
  if(P.wailT>0){ P.wailT-=dt; P.state='wail'; }
  else if(HT) P.state='reach';
  else if(!P.onGround) P.state='jump';
  else if(Math.abs(P.vx)>10) P.state='walk';
  else P.state='idle';
  stepPrete(P,dt);
}

let prayTimer=14, activePray=null, offering=null, offerTimer=40;
function stepNpcs(dt){
  for(const n of NPCS){
    n.anim+=dt;
    if(n.mark){ n.mark.t-=dt; if(n.mark.t<=0) n.mark=null; }
    if(n.bub){ n.bub.t-=dt; if(n.bub.t<=0) n.bub=null; }
    n.phase += n.vx*dt*0.22;
    if(n.state==='walk'){
      const d=n.tx-n.x;
      if(Math.abs(d)<3){ n.vx=0; n.state=n.then||'idle'; n.then=null; n.t=rnd(3,8); if(n.state==='pray') beginPray(n); }
      else { n.vx=sign(d)*22; n.face=sign(d); n.x+=n.vx*dt; }
    } else {
      n.vx = lerp(n.vx,0,1-Math.pow(0.001,dt));
      if(VILLAGERS.indexOf(n)>=0){
        n.t=(n.t||rnd(2,7))-dt;
        if(n.t<=0 && n.state==='idle'){ n.tx=clamp(n.home+rnd(-90,90),1500,3060); n.state='walk'; }
      }
      if(n.state==='pray'){ n.prayT-=dt; if(n.prayT<=0){ n.state='walk'; n.tx=n.home; n.then='idle'; if(activePray===n) activePray=null; } }
    }
    n.y=groundY(n.x);
  }
  prayTimer-=dt;
  if(prayTimer<=0 && !activePray){
    prayTimer=rnd(15,26);
    const c=VILLAGERS.filter(v=>v.state==='idle'||v.state==='walk');
    if(c.length){ const n=pick(c); n.state='walk'; n.tx=SHRINE_X+rnd(-16,16); n.then='pray'; n.mark={k:'star',t:3}; activePray=n; AU.blip(); }
  }
  offerTimer-=dt;
  if(offerTimer<=0 && !offering && GS.q.metPhra){
    offering={x:CART_X+40, y:groundY(CART_X+40), t:0}; UNCLE.bub={t:3.2,txt:'for the spirits ~'};
    offerTimer=rnd(48,80);
  }
  if(offering){
    offering.t+=dt;
    if(Math.random()<dt*3) pSmoke(offering.x+rnd(-2,2), offering.y-8);
    if(Math.abs(P.x-offering.x)<20 && Math.abs(P.y-offering.y)<40){
      offering=null; GS.q.offerings++; addMerit(3); AU.purr();
      toast('+3 merit · noodles for the unseen (the steam is enough)');
    } else if(offering.t>40) offering=null;
  }
  // spirits drift gently about their business
  for(const s of SPIRITS){
    s.anim+=dt;
    if(s.wave>0) s.wave-=dt;
    s.hop = s.id==='kongkoi'? Math.abs(Math.sin(s.anim*2.6))*5 : 0;
    s.face = P.x<s.x?-1:1;
    if(s.bub){ s.bub.t-=dt; if(s.bub.t<=0) s.bub=null; }
  }
  // the cat
  CAT.anim+=dt;
  if(CAT.state==='wander'){
    CAT.t=(CAT.t||0)-dt;
    if(CAT.t<=0){ CAT.t=rnd(2,6); CAT.tx = Math.abs(CAT.x-P.x)<90&&Math.random()<0.6 ? P.x+rnd(-16,16) : clamp(CAT.x+rnd(-70,70), TAMARIND_X-90, CART_X+60); }
    const d=CAT.tx-CAT.x;
    if(Math.abs(d)>3){ CAT.x+=sign(d)*26*dt; CAT.face=sign(d); CAT.phase+=dt*9; CAT.walking=true; }
    else CAT.walking=false;
    CAT.y=groundY(CAT.x);
  }
  TANI.anim+=dt; if(TANI.waveT>0) TANI.waveT-=dt;
  PHRA.anim+=dt;
  // things regrow
  for(const nd of NODES){ if(!nd.ready){ nd.t-=dt; if(nd.t<=0){ nd.ready=true; } } }
}
function beginPray(n){
  n.prayT=6; n.bub={t:5,txt:'…merit for the wandering souls…'};
  for(let i=0;i<4;i++) pSmoke(SHRINE_X+rnd(-4,4), groundY(SHRINE_X)-62, i*0.3);
  const range = has('magnet')? 400:150;
  if(Math.abs(P.x-SHRINE_X)<range){
    GS.q.prayers++;
    for(let i=0;i<5;i++) pOrb(SHRINE_X+rnd(-8,8), groundY(SHRINE_X)-66+rnd(-4,4), i*0.22);
  }
}

/* ============================================================
   HELPING — the hand tasks
   ============================================================ */
let HT=null;
const HAND_R = ()=> has('reach')? 1.35 : 1;
const EASY   = ()=> has('steady')? 1.4 : 1;
function startTask(kind, x){
  const gy=groundY(x);
  HT={kind, t:0, prog:0, grabbed:false, fail:0, hx:x, hy:gy-40, vx:0, vy:0};
  P.y=gy; P.vx=0; P.vy=0; P.onGround=true;
  if(kind==='lamp'){ HT.a={x:x+9,y:gy-136}; HT.b={x:x+22,y:gy-142}; HT.hx=x-20; HT.hy=gy-90; P.x=x-42; }
  if(kind==='cat'){ HT.cat={x:CAT.x,y:CAT.y,fear:0}; HT.hx=CAT.x-40; HT.hy=CAT.y+30; P.x=CAT.x-52; }
  if(kind==='tree'){ HT.lift=0; HT.bal=0; HT.balV=0; HT.hx=x; HT.hy=gy-40; P.x=x-70; }
  if(kind==='garland'){ HT.hook={x:SHRINE_X-16,y:groundY(SHRINE_X)-86}; HT.hx=SHRINE_X+34; HT.hy=groundY(SHRINE_X)-52; P.x=SHRINE_X+46; }
  GS.state='task'; AU.sel();
}
function stepTask(dt){
  const t=HT; t.t+=dt;
  let dx=0,dy=0;
  if(K.left)dx-=1; if(K.right)dx+=1; if(K.up)dy-=1; if(K.down)dy+=1;
  if(TOUCH.on && TOUCH.aim.active){
    const wx=TOUCH.aim.x+GS.camX, wy=TOUCH.aim.y+GS.camY;
    dx=clamp((wx-t.hx)/26,-1,1); dy=clamp((wy-t.hy)/26,-1,1);
  }
  const acc=420;
  t.vx += dx*acc*dt; t.vy += dy*acc*dt;
  t.vx *= Math.pow(0.0016,dt); t.vy *= Math.pow(0.0016,dt);
  t.hx += t.vx*dt; t.hy += t.vy*dt;
  const speed=Math.hypot(t.vx,t.vy);
  const grip = K.act || K.light;
  t.grip=grip;

  if(t.kind==='lamp'){
    const nearA = dist(t.hx,t.hy,t.a.x,t.a.y) < 20*HAND_R();
    if(!t.grabbed && nearA && grip){ t.grabbed=true; AU.spark(); }
    if(t.grabbed){
      const d=dist(t.hx,t.hy,t.b.x,t.b.y);
      if(d < 13*HAND_R()*EASY() && grip){
        t.prog += dt*0.62*EASY();
        if(Math.random()<dt*22){ pSpark(t.b.x,t.b.y,2,'#fff0b0'); AU.spark(); }
        t.vx += rnd(-160,160)*dt*6/EASY(); t.vy += rnd(-160,160)*dt*6/EASY();
      } else t.prog=Math.max(0,t.prog-dt*0.3);
      if(!grip) t.grabbed=false;
    }
    if(Math.random()<dt*6) pSpark(t.a.x,t.a.y,1,PAL.ember);
    if(t.prog>=1) finishTask();
  }
  else if(t.kind==='cat'){
    const c=t.cat, d=dist(t.hx,t.hy,c.x,c.y);
    const gentle = speed < (has('cool')?70:46);
    if(d<38) c.fear += (gentle? -0.5 : 1.6)*dt; else c.fear -= 0.7*dt;
    c.fear=clamp(c.fear,0,1);
    if(c.fear>=1){ t.fail=1.2; c.fear=0.55; AU.meow(); t.prog=Math.max(0,t.prog-0.4); }
    if(d < 16*HAND_R() && gentle && grip){ t.prog += dt*0.75*EASY();
      if(Math.random()<dt*4) pHeart(c.x+rnd(-4,4), c.y-8); }
    else if(!grip) t.prog=Math.max(0,t.prog-dt*0.15);
    if(t.fail>0) t.fail-=dt;
    if(t.prog>=1) finishTask();
  }
  else if(t.kind==='tree'){
    const near = Math.abs(t.hy-(groundY(t.hx)-14-t.lift*30))<26 && Math.abs(t.hx-FALLEN_TREE_X)<60;
    if(near && grip){
      t.lift=clamp(t.lift+dt*0.42*EASY(),0,1);
      t.balV += (dx*0.9 + Math.sin(t.t*2.3)*0.5 + rnd(-0.5,0.5))*dt*2.4/EASY();
      if(Math.random()<dt*8) pDust(t.hx+rnd(-30,30), groundY(t.hx));
    } else t.lift=Math.max(0,t.lift-dt*0.5);
    t.balV += -t.bal*2.2*dt; t.balV*=Math.pow(0.35,dt);
    t.bal=clamp(t.bal+t.balV*dt,-1.4,1.4);
    if(Math.abs(t.bal)>1){ t.lift=Math.max(0,t.lift-dt*1.4); t.fail=0.6; GS.shake=3; AU.land(); }
    if(t.fail>0) t.fail-=dt;
    t.prog=t.lift;
    if(t.lift>=1) finishTask();
  }
  else if(t.kind==='garland'){
    const d=dist(t.hx,t.hy,t.hook.x,t.hook.y);
    if(d < 11*HAND_R()*EASY() && speed<40*EASY()){ t.prog+=dt*0.9*EASY();
      if(Math.random()<dt*6) pSpark(t.hook.x,t.hook.y,1,'#fff0dc'); }
    else t.prog=Math.max(0,t.prog-dt*0.5);
    if(t.prog>=1) finishTask();
  }
  GS.camX = lerp(GS.camX, clamp(t.hx-W/2,0,WORLD_W-W), 1-Math.pow(0.002,dt));
  GS.camY = lerp(GS.camY, clamp(t.hy-H/2-10,-30,40), 1-Math.pow(0.004,dt));
  if(press('back')){ GS.state='play'; HT=null; }
  clearPress();
}
function finishTask(){
  const k=HT.kind; HT=null; GS.state='play';
  if(k==='lamp'){
    GS.q.lamp=true; LIGHTS.find(l=>l.broken).on=true; AU.fix();
    pSpark(LAMP_XS[BROKEN_LAMP]+16, groundY(LAMP_XS[BROKEN_LAMP])-140, 16);
    say([{w:'',t:'Click. The lamp hums awake and warm light spills down the road. Somewhere behind you, an aunty stops hurrying.'}],
      ()=>{ addMerit(12); toast('+12 merit · the dark stretch glows'); unlockCos('skirt_plaid',true); });
  }
  if(k==='cat'){
    GS.q.cat=true; CAT.state='wander'; CAT.x=P.x+14; CAT.y=groundY(CAT.x); CAT.tx=MALI.x;
    AU.meow(); pHeart(CAT.x,CAT.y-14);
    say([{w:'Mali',t:'WHOA. You are a walking streetlight! Thank you, giant friend!'},
         {w:'Mali',t:'Meow-Meow says thank you too. She promises to only climb SHORT trees from now on.'}],
      ()=>{ addMerit(14); toast('+14 merit · the cat is down'); });
  }
  if(k==='tree'){
    GS.q.tree=true; AU.fix(); GS.shake=4; pDust(FALLEN_TREE_X,groundY(FALLEN_TREE_X),24);
    say([{w:'',t:'You set the trunk down in the ditch like a man putting down a bag of rice. The road is a road again.'}],
      ()=>{ addMerit(12); toast('+12 merit · the road is clear'); });
  }
  if(k==='garland'){
    GS.q.garland=true; AU.ding(); pSpark(SHRINE_X-16,groundY(SHRINE_X)-86,12,'#fff0dc');
    say([{w:'Phra Phum',t:'…Well. Nobody has hung one that straight in years. Thank you, tall one.'}],
      ()=>{ addMerit(8); toast('+8 merit · the garland hangs straight'); unlockCos('garland',true); });
  }
  saveGame();
}
function unlockCos(id, free){
  if(GS.seen['own_'+id]) return;
  GS.seen['cos_'+id]=true;
  if(free){ GS.seen['own_'+id]=true; toast('unlocked: '+COSMETICS[id].n, PAL.jadeL); AU.unlock(); }
  saveGame();
}

  setupStep();
}
function setupStep(){
  const r=actRecipe(), k=STEP_KIND[r.steps[ACT.step]];
  ACT.k=k; ACT.hits=0; ACT.m=0; ACT.dir=1; ACT.held=0; ACT.placed=0; ACT.cursor=0; ACT.cdir=1;
  ACT.gauge=0.5; ACT.band=0.5; ACT.bandV=0.35;
  ACT.stepScore=0; ACT.stepT=0;
  ACT.need = k.n||1;
  AU.blip();
}
function stepAct(dt){
  const A=ACT; A.t+=dt;
  if(A.flash>0) A.flash-=dt;
  if(press('back')){
    if(A.phase==='pick'){ GS.state='play'; ACT=null; clearPress(); return; }
    A.phase='pick'; clearPress(); return;
  }
  if(A.phase==='pick'){
    hitTap();                   // a tap lands on whichever recipe was drawn there
    if(press('left')||press('up')){ A.pick=(A.pick+A.ids.length-1)%A.ids.length; AU.blip(); }
    if(press('right')||press('down')){ A.pick=(A.pick+1)%A.ids.length; AU.blip(); }
    if(press('act')){
      const r=actRecipe();
      if(canMake(r)) beginSteps();
      else { toast('you are missing something','#c8888a'); AU.blip(); A.flash=0.4; }
    }
    clearPress(); return;
  }
  if(A.phase==='done'){
    A.doneT+=dt;
    if(A.doneT>0.8 && (press('act')||press('tap'))) finishActivity();
    clearPress(); return;
  }

  const k=A.k, easy = (A.mode==='cook'? (has('taste')?1.5:1) : (has('weave')?1.5:1));
  A.stepT+=dt;
  if(k.t==='timing'){
    // a marker sweeps; land it in the green
    A.m += A.dir*dt*(1.05 - A.hits*0.03);
    if(A.m>1){ A.m=1; A.dir=-1; } if(A.m<0){ A.m=0; A.dir=1; }
    if(press('act')||press('tap')){
      const zone=0.13*easy, d=Math.abs(A.m-0.5);
      if(d<zone*0.45){ A.hits++; A.stepScore+=1; AU.ranat(760+A.hits*70,0,0.05); pSpark(0,0,0); A.flash=0.25; A.perfect=1; }
      else if(d<zone){ A.hits++; A.stepScore+=0.6; AU.ranat(600,0,0.04); A.flash=0.2; A.perfect=0; }
      else { AU.whiff(); A.flash=0.3; A.perfect=-1; }
      if(A.hits>=A.need) nextStep();
    }
  }
  else if(k.t==='rhythm'){
    // alternate left and right, in time with the beat
    A.m += dt*1.5;
    if(A.m>1){ A.m=0; A.beat=(A.beat||0)+1; AU.drum(0,0.03); }
    const wantLeft = ((A.hits)%2)===0;
    const hitL=press('left'), hitR=press('right');
    if(hitL||hitR){
      const right = wantLeft? hitL : hitR;
      const good = Math.abs(A.m-0.5)<0.42*easy;
      if(right && good){ A.hits++; A.stepScore+= (Math.abs(A.m-0.5)<0.2?1:0.6); AU.ranat(560+A.hits*40,0,0.045); A.flash=0.2; A.perfect=1; }
      else { AU.whiff(); A.flash=0.3; A.perfect=-1; }
      if(A.hits>=A.need) nextStep();
    }
  }
  else if(k.t==='hold'){
    // keep the needle inside the drifting band
    A.band += A.bandV*dt;
    if(A.band>0.8){ A.band=0.8; A.bandV=-Math.abs(A.bandV); }
    if(A.band<0.2){ A.band=0.2; A.bandV=Math.abs(A.bandV); }
    if(Math.random()<dt*0.7) A.bandV = rnd(-0.4,0.4);
    const grip = K.act||K.light;
    A.gauge += (grip? 0.62 : -0.52)*dt;
    A.gauge = clamp(A.gauge,0,1);
    const w=0.13*easy;
    const inside = Math.abs(A.gauge-A.band)<w;
    if(inside){ A.held+=dt; A.stepScore+=dt; if(Math.random()<dt*8) pEmber(0,0); }
    if(A.held>=k.dur) nextStep();
  }
  else if(k.t==='place'){
    // a cursor slides; drop each piece on its mark
    A.cursor += A.cdir*dt*0.85;
    if(A.cursor>1){ A.cursor=1; A.cdir=-1; } if(A.cursor<0){ A.cursor=0; A.cdir=1; }
    const target = (A.placed+0.5)/A.need;
    if(press('act')||press('tap')){
      const d=Math.abs(A.cursor-target);
      if(d<0.10*easy){ A.stepScore+=1; AU.ranat(700+A.placed*90,0,0.05); A.flash=0.22; A.perfect=1; }
      else if(d<0.2*easy){ A.stepScore+=0.55; AU.ranat(560,0,0.04); A.flash=0.2; A.perfect=0; }
      else { AU.whiff(); A.flash=0.3; A.perfect=-1; }
      A.placed++;
      if(A.placed>=A.need) nextStep();
    }
  }
  clearPress();
}
function nextStep(){
  const A=ACT, k=A.k;
  const maxS = k.t==='hold'? k.dur : A.need;
  A.score += clamp(A.stepScore/maxS,0,1);
  A.step++;
  const r=actRecipe();
  if(A.step>=r.steps.length){
    A.quality = clamp(A.score/r.steps.length,0,1);
    A.phase='done'; A.doneT=0;
    const n = has('two')? 2 : 1;
    A.out = r.out;
    bagAdd(r.out, n, true);
    const first = !GS.learned[A.ids[A.pick]];
    GS.learned[A.ids[A.pick]] = Math.max(GS.learned[A.ids[A.pick]]||0, A.quality);
    A.first = first;
    if(first) addMerit(3);
    AU.victory();
    saveGame();
  } else setupStep();
}
function finishActivity(){
  const A=ACT; const r=A.book[A.ids[A.pick]];
  ACT=null; GS.state='play';
  const q=A.quality;
  const word = q>0.85? 'perfect' : q>0.55? 'good' : 'edible';
  toast((A.first?'+3 merit · learned ':'made ')+r.n+' — '+word, q>0.85?PAL.goldL:PAL.gold);
  if(A.first) khwanSay('You made something. Somebody is going to be very glad about that.');
}

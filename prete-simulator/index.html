function drawNode(g,nd){
  const x=nd.x, y=nd.y;
  const sway=Math.sin(GS.t*1.1+x*0.05)*1.5;
  if(!nd.ready){
    for(let i=0;i<3;i++) pTaper(g,x-4+i*4,y,x-4+i*4+sway*0.4,y-6,3,1,'#3d5c44');
    return;
  }
  const c=ITEMS[nd.item].c;
  switch(nd.art){
    case 'paddy': for(let i=0;i<5;i++){ const lx=x-8+i*4;
        pTaper(g,lx,y,lx+sway,y-13,2.4,1,'#5f9a58'); pEll(g,lx+sway,y-14,2,2.6,c); } break;
    case 'clay': pEll(g,x,y-2,10,5,'#7a5238'); pEll(g,x,y-4,8,4,'#9a6b4a'); pEll(g,x-3,y-5,3,2,'#b0805c'); break;
    case 'chili': case 'lemongrass': case 'lime': {
        const img=ART.garden[nd.art]; g.drawImage(img, R(x-img.width/2), R(y-img.height+2)); break; }
    case 'flowers': for(let i=0;i<6;i++){ const lx=x-10+i*4, lh=8+((i*5)%7);
        pTaper(g,lx,y,lx+sway*0.6,y-lh,2,1,'#3f7a52');
        for(let k=0;k<4;k++){ const a=k/4*TAU; pEll(g,lx+sway*0.6+Math.cos(a)*2,y-lh+Math.sin(a)*2,1.6,1.6,c); }
        pEll(g,lx+sway*0.6,y-lh,1.2,1.2,'#ffce54'); } break;
    case 'banana': { const img=ART.banana[0];
        g.drawImage(img, R(x-img.width*0.5), R(y-img.height*0.86), R(img.width*0.86), R(img.height*0.86));
        for(let i=0;i<3;i++) pTaper(g,x+2,y-34-i*4,x+9,y-36-i*4,4,2,c); break; }
    case 'leaf': for(let i=0;i<4;i++){ const lx=x-8+i*5;
        pTaper(g,lx,y,lx,y-14,3,2,'#5f8a4a'); pEll(g,lx+sway*0.5,y-17,6,3.4,c); pR(g,lx-6,y-17,12,1,'#2e6b44'); } break;
    case 'coconut': for(let i=0;i<3;i++) pEll(g,x-5+i*5,y-5+((i%2)*3),4,4,'#7d5a3c'); break;
    default: pEll(g,x,y-7,9,7,'#3f7a52'); pEll(g,x-2,y-9,5,4,'#4f9e5c');
      for(let i=0;i<3;i++) pEll(g,x-5+i*5,y-8-((i%2)*3),3,3,c);
  }
  // a small shine so you can tell it is pickable
  const bl=0.5+0.5*Math.sin(GS.t*2.4+x);
  pR(g,x+9,y-20-bl*2,1,1,rgba(PAL.goldL,0.5+0.5*bl));
  pR(g,x-10,y-16-bl,1,1,rgba(PAL.goldL,0.3+0.3*bl));
}
/* the guide */
function drawKhwan(g){
  const k=KHWAN, x=k.x, y=k.y;

  gl.addColorStop(0,'rgba(150,220,255,0.26)'); gl.addColorStop(1,'rgba(150,220,255,0)');

    pEll(g,x-Math.sin(k.anim*2+i*0.6)*2, y+5+i*2.4, 3.4-i*0.5, 2-i*0.25, '#8fd8f0'); }
  g.globalAlpha=1;
  oEll(g,x,y,6.4,6,'#dff4ff','#5a86a8');
  pEll(g,x-2,y-2,2.6,2,'#ffffff');
  // little topknot — a child spirit
  pTaper(g,x,y-6,x+Math.sin(k.anim*2)*1.5,y-11,3,1.4,'#3a3350');

const TREE={col:0,row:0,tab:0};
function stepTree(dt){
  GS.seen.ledger=true;
  if(press('back')||press('tree')){ GS.state='play'; AU.sel(); clearPress(); return; }
  if(press('heavy')||press('whistle')||press('give')){ TREE.tab=(TREE.tab+1)%3; TREE.row=0; AU.sel(); }
  if(TREE.tab===0){
    const keys=Object.keys(SKILLS);
    if(press('left')){ TREE.col=(TREE.col+2)%3; AU.blip(); }
    if(press('right')){ TREE.col=(TREE.col+1)%3; AU.blip(); }
    const col=keys.filter(k=>SKILLS[k].br===TREE.col);
    if(press('up')) { TREE.row=clamp(TREE.row-1,0,col.length-1); AU.blip(); }
    if(press('down')){ TREE.row=clamp(TREE.row+1,0,col.length-1); AU.blip(); }
    TREE.row=clamp(TREE.row,0,col.length-1);
    if(press('act')){
      const id=col[TREE.row], s=SKILLS[id];
      if(GS.skills[id]) AU.blip();
      else if(s.need && !GS.skills[s.need]){ toast('learn '+SKILLS[s.need].n+' first','#c8888a'); AU.blip(); }
      else if(avail()<s.cost){ toast('you need '+(s.cost-avail())+' more merit','#c8888a'); AU.blip(); }
      else { GS.skills[id]=1; GS.spent+=s.cost; AU.unlock(); toast('learned '+s.n,PAL.jadeL);
        if(id==='metta'){ GS.seen.own_halo=true; toast('Halo unlocked',PAL.goldL); }
        saveGame(); }
    }
  } else if(TREE.tab===1){
    const ids=Object.keys(COSMETICS).filter(c=>!COSMETICS[c].locked || GS.seen['own_'+c]);
    if(press('left')) { TREE.row=(TREE.row+ids.length-1)%ids.length; AU.blip(); }
    if(press('right')){ TREE.row=(TREE.row+1)%ids.length; AU.blip(); }
    if(press('up')||press('down')){ TREE.row=clamp(TREE.row+(K.up?-4:4),0,ids.length-1); AU.blip(); }
    TREE.row=clamp(TREE.row,0,ids.length-1);
    if(press('act')){
      const id=ids[TREE.row], c=COSMETICS[id], owned=GS.seen['own_'+id]||c.cost===0;
      if(owned){ GS.cos[c.slot]= c.slot==='skirt'? c.v : (GS.cos[c.slot]?0:c.v); AU.sel(); saveGame(); }
      else if(avail()>=c.cost){ GS.spent+=c.cost; GS.seen['own_'+id]=true; GS.cos[c.slot]=c.v; AU.unlock(); toast('got '+c.n,PAL.jadeL); saveGame(); }
      else { toast('not enough merit','#c8888a'); AU.blip(); }
    }
  } else {
    const list=GIFTEES();
    if(press('up')||press('left'))  { TREE.row=(TREE.row+list.length-1)%list.length; AU.blip(); }
    if(press('down')||press('right')){ TREE.row=(TREE.row+1)%list.length; AU.blip(); }
  }
  clearPress();
}
function drawLedger(g){
  g.fillStyle='#09071a'; g.fillRect(0,0,W,H);
  for(let i=0;i<3;i++){ const r=54+i*26;
    g.strokeStyle=`rgba(242,193,78,${0.05-i*0.012})`; g.lineWidth=1;
    g.beginPath(); g.arc(W/2,H/2,r,0,TAU); g.stroke(); }
  pTxt(g,'THE LEDGER',14,20,PAL.goldL,14);
  pTxt(g,'THE LEDGER',14,30,'#8a8098',7);
  pTxt(g,avail()+' merit to spend',W-14,20,PAL.gold,10,'right');
  pTxt(g,GS.merit+' earned · '+GS.spent+' spent',W-14,30,'#8a8098',6,'right');
  const tabs=['SKILLS','LOOKS','FRIENDS'];
  tabs.forEach((t,i)=>{
    const x=14+i*112, on=TREE.tab===i;
    pR(g,x,36,106,13,on?'rgba(242,193,78,0.16)':'rgba(255,255,255,0.04)');
    if(on) pR(g,x,36,106,1,PAL.gold);
    pTxt(g,t,x+53,45,on?PAL.goldL:'#7a7488',6,'center');
  });
  pTxt(g,'G — switch tab',W-14,45,'#5a5468',6,'right');

  if(TREE.tab===0){
    const keys=Object.keys(SKILLS);
    let selId=null;
    for(let b=0;b<3;b++){
      const col=keys.filter(k=>SKILLS[k].br===b);
      const cx=64+b*(W-128)/2;
      pTxt(g,BRANCHES[b].n,cx,68,BRANCHES[b].c,12,'center');
      pTxt(g,BRANCHES[b].d,cx,77,'#7a7488',6,'center');
      col.forEach((id,i)=>{
        const s=SKILLS[id], y=94+i*27;
        const owned=!!GS.skills[id], locked=s.need&&!GS.skills[s.need];
        const canBuy=!owned&&!locked&&avail()>=s.cost, sel=TREE.col===b&&TREE.row===i;
        if(sel) selId=id;
        if(i>0) pR(g,cx,y-17,1,13, owned?BRANCHES[b].c:'#2e2a44');
        const r=8;
        if(sel) pCirc(g,cx,y,r+2,rgba(BRANCHES[b].c,0.35));
        pCirc(g,cx,y,r, owned?BRANCHES[b].c: locked?'#221f34': canBuy?'#3a3454':'#2a2640');
        pCirc(g,cx,y,r-3, owned?shade(BRANCHES[b].c,0.3):'#171430');
        if(owned) icoTick(g,cx,y+1,1.1,'#0e0b1c');
        else if(locked) pTxt(g,'·',cx,y+3,'#4a4458',8,'center');
        else pTxt(g,''+s.cost,cx,y+3,canBuy?PAL.gold:'#5a5468',7,'center');
        pTxt(g,s.n,cx,y+17,owned?'#efe6d8':locked?'#4a4458':'#a89ec0',7,'center');
      });
    }
    const s=SKILLS[selId];
    if(s){
      panel(g,14,H-44,W-28,36,BRANCHES[s.br].c);
      pTxt(g,s.n,20,H-31,BRANCHES[s.br].c,9);
      const owned=GS.skills[selId];
      pTxt(g, owned?'learned':(s.need&&!GS.skills[s.need])?('needs '+SKILLS[s.need].n):(s.cost+' merit'),
        W-20,H-31,owned?PAL.jadeL:'#cfc4ae',7,'right');
      let y=H-20;
      for(const l of wrap(g,s.d,W-44,6).slice(0,2)){ pTxt(g,l,20,y,'#a89ec0',6); y+=8; }
    }
  } else if(TREE.tab===1){
    const ids=Object.keys(COSMETICS).filter(c=>!COSMETICS[c].locked||GS.seen['own_'+c]);
    ids.forEach((id,i)=>{
      const c=COSMETICS[id], x=20+(i%4)*112, y=64+Math.floor(i/4)*44;
      const owned=GS.seen['own_'+id]||c.cost===0, worn=GS.cos[c.slot]===c.v, sel=TREE.row===i;
      pR(g,x,y,102,36,sel?'rgba(242,193,78,0.14)':'rgba(255,255,255,0.04)');
      if(sel) pR(g,x,y,102,1,PAL.gold);
      if(worn) pR(g,x,y+35,102,1,PAL.jadeL);
      if(c.slot==='skirt'){ const S2=SKIRTS[c.v];
        pR(g,x+6,y+7,19,21,S2.base); pR(g,x+17,y+7,8,21,S2.dark);
        for(let k=0;k<4;k++) pR(g,x+6,y+10+k*5,19,1,S2.mark);
      } else { pCirc(g,x+16,y+18,10,owned?PAL.gold:'#2a2640'); pCirc(g,x+16,y+18,6,'#171430');
        cosBadge(g,c.slot,x+16,y+19,owned?PAL.goldL:'#4a4458'); }
      pTxt(g,c.n,x+31,y+14,owned?'#efe6d8':'#7a7488',7);
      pTxt(g,owned?(worn?'worn':'wear'):(c.cost+' merit'),x+31,y+32,owned?(worn?PAL.jadeL:'#a89ec0'):PAL.gold,6);
    });
    const c=COSMETICS[ids[TREE.row]];
    if(c){ panel(g,14,H-28,W-28,20,PAL.gold); pTxt(g,c.d,W/2,H-15,'#a89ec0',6,'center'); }
  } else {
    const list=GIFTEES();
    list.forEach((t,i)=>{
      const x=16+(i%3)*152, y=62+Math.floor(i/3)*36;
      const sel=TREE.row===i, made=GS.friends[t.id];
      pR(g,x,y,146,32,sel?'rgba(242,193,78,0.13)':'rgba(255,255,255,0.035)');
      if(sel) pR(g,x,y,146,1,PAL.gold);
      pTxt(g,t.name,x+8,y+13, made?'#efe6d8':'#a89ec0',8);
      const knows = has('eye')||made;
      pTxt(g, made? 'friends' : knows? 'hoping for '+ITEMS[t.wants].n : 'wants something',
        x+8,y+24, made?'#ff8fae':'#7a7488',6);
      if(knows) drawIcon(g,t.wants,x+130,y+16,0.6);
    });
    const t=list[TREE.row];
    if(t){ panel(g,14,H-42,W-28,34,PAL.jadeL);
      const line = t.about || t.line || '';
      let y=H-28;
      for(const l of wrap(g,line,W-44,6).slice(0,2)){ pTxt(g,l,20,y,'#a89ec0',6); y+=8; }
      if(t.wish && !GS.friends[t.id] && has('eye')) pTxt(g,'wish: '+t.wish, 20, H-12, '#a8dcb8',6);
    }
    // recipes learned
    pTxt(g,'recipes known '+Object.keys(GS.learned).length+'/'+(Object.keys(RECIPES).length+Object.keys(CRAFTS).length)+' recipes',W-16,H-48,'#7a7488',6,'right');
  }
  pTxt(g,'tap to choose',W/2,H-3,'#5a5468',6,'center');
}

let PROMPT=null;
function near(x,d=34){ return Math.abs(P.x-x)<d; }
function checkInteract(){
  PROMPT=null;
  if(DLG) return;
  const set=(x,y,txt,fn,sub)=>{ PROMPT={x,y,txt,fn,sub}; };
  /* ---- the farm first: it is fixed furniture, and a ghost drifting across
     a bed must never stop you working it ---- */
  if(!PROMPT && near(FARM_GATE,22))
    set(FARM_GATE, groundY(FARM_GATE)-56, FARM.rented? 'read the farm board' : 'read the notice', openBoard);
  if(!PROMPT && FARM.rented && near(PEN_X,30)){
    const p=FARM.pen;
    if(!penHas()) set(PEN_X, groundY(PEN_X)-38, 'the pen is empty', ()=>khwanSay('The board at the gate sells chickens, ducks, and one very large buffalo.'));
    else if(penFull()) set(PEN_X, groundY(PEN_X)-40, 'take what they left you', penCollect, 'feed');
    else set(PEN_X, groundY(PEN_X)-38, p.feed>0? 'the animals are settled' : 'the animals want feeding', penFeed);
  }
  if(!PROMPT){
    const pl=plotAt(P.x);
    if(pl && near(pl.x,15)){
      const t=plotPrompt(pl);
      if(t==='the bed is empty')
        set(pl.x, groundY(pl.x)-30, t, ()=>khwanSay('Seed is in the crate by the gate, or three for nine baht at the stall.'));
      else set(pl.x, groundY(pl.x)-30, t, ()=>usePlot(pl));
    }
  }
  if(!PROMPT){
    const pd=paddyAt(P.x);
    if(pd) set(pd.x, groundY(pd.x)-28, paddyPrompt(pd), ()=>{
      if(pd.stage===0 && !bagHas('seed')) khwanSay('Rice starts as seed too. The crate is by the gate.');
      else usePaddy(pd);
    });
  }
  if(!PROMPT){
    const tr=treeAt(P.x);
    if(tr) set(tr.x, groundY(tr.x)-72, treePrompt(tr), ()=>useTree(tr));
  }
  // then people
  for(const s of SPIRITS){
    if(near(s.x,40)){
      const y = s.id==='krasue'? s.y-76 : s.y-56;
      if(s.friend && FARM.rented)
        set(s.x,y, handOf(s.id)? L('talk to')+' '+L(s.name) : 'ask them to help', ()=>openHands(s), 'give');
      else
        set(s.x,y, s.met? L('talk to')+' '+L(s.name) : 'say hello', ()=>talkSpirit(s), 'give');
    }
  }
  if(!PROMPT && !GS.q.garland && GS.q.metPhra && near(SHRINE_X-16,30))
    set(SHRINE_X-16, groundY(SHRINE_X)-100,'hang the fallen garland', ()=>startTask('garland',SHRINE_X));
  if(!PROMPT && near(PHRA.x,40) && PHRA.shown) set(PHRA.x,PHRA.y-30,'speak to Phra Phum', talkPhra);
  if(!PROMPT && near(PHRA.x,40) && !PHRA.shown) set(SHRINE_X,groundY(SHRINE_X)-96,'pay respects', talkPhra);
  if(!PROMPT && near(STALL_X+34,20)) set(STALL_X+34, groundY(STALL_X+34)-44,'read the orders', openOrderBoard);
  if(!PROMPT && near(STALL_X-30,22)) set(STALL_X-30, groundY(STALL_X-30)-52,'buy and sell', openStall);
  if(!PROMPT && near(KITCHEN_X,34)) set(KITCHEN_X, groundY(KITCHEN_X)-64,'cook something', ()=>startActivity('cook'));
  if(!PROMPT && near(CRAFT_X,34))   set(CRAFT_X,   groundY(CRAFT_X)-52,'sit and make something', ()=>startActivity('craft'));
  if(!PROMPT && near(TANI.x,36)) set(TANI.x,TANI.y-40,L('talk to')+' '+L('Tani'), talkTani);
  if(!PROMPT && near(MONK.x,30)) set(MONK.x,MONK.y-30,'approach politely', talkMonk, 'give');
  if(!PROMPT && near(UNCLE.x,28)) set(UNCLE.x,UNCLE.y-30,'talk', talkUncle, 'give');
  if(!PROMPT && near(MALI.x,26))  set(MALI.x,MALI.y-26,L('talk to')+' '+L('Mali'), talkMali, 'give');
  for(const v of VILLAGERS) if(!PROMPT && near(v.x,26))
    set(v.x,v.y-28, L('talk to')+' '+L(v.name), ()=>talkVillager(v), 'give');
  if(!PROMPT && !GS.q.cat && GS.q.maliMet && near(TAMARIND_X+16,50))
    set(TAMARIND_X+16,groundY(TAMARIND_X)-118,'reach up for the cat', ()=>startTask('cat',TAMARIND_X));
  if(!PROMPT && GS.q.cat && CAT.state==='wander' && near(CAT.x,20)) set(CAT.x,CAT.y-20,'pet',()=>{
    AU.purr(); pHeart(CAT.x,CAT.y-12);
    if(GS.q.pets<3){ GS.q.pets++; addMerit(1,true); toast('+1 merit · purr'); } else toast('purr','#ff9eb0');
  });
  if(!PROMPT && !GS.q.lamp && near(LAMP_XS[BROKEN_LAMP]+8,40))
    set(LAMP_XS[BROKEN_LAMP]+8, groundY(LAMP_XS[BROKEN_LAMP])-150,'reach the junction box', ()=>{
      if(!GS.seen.lampIntro){ GS.seen.lampIntro=true;
        say([{w:'',t:'The streetlamp dies. This stretch goes pitch dark, and people hurry through it.'},
             {w:'',t:'The junction box hangs just under the lamp. Too high for any ladder. Not too high for you.'}],
          ()=>startTask('lamp',LAMP_XS[BROKEN_LAMP]));
      } else startTask('lamp',LAMP_XS[BROKEN_LAMP]);
    });
  if(!PROMPT && !GS.q.tree && near(FALLEN_TREE_X,54))
    set(FALLEN_TREE_X, groundY(FALLEN_TREE_X)-40,'lift the fallen tree', ()=>startTask('tree',FALLEN_TREE_X));
  if(!PROMPT && near(SALA_X,32)) set(SALA_X, groundY(SALA_X)-108,'ring the bell', ()=>{
    AU.gong(131,0,0.1); pRing(SALA_X,groundY(SALA_X)-70,PAL.goldL,90);
    if(!GS.seen.bell){ GS.seen.bell=true; addMerit(4); toast('+4 merit · the bell carries a long way'); }
    else toast('the bell hums','#cfc4ae');
  });
  // the seed crate and the plants come last, so people always win the prompt
  if(!PROMPT && near(SEED_CRATE_X,16))
    set(SEED_CRATE_X, groundY(SEED_CRATE_X)-24, 'take seed', takeSeed);
  if(!PROMPT) for(const nd of NODES){
    if(nd.ready && near(nd.x,22)){ const it=ITEMS[nd.item];
      set(nd.x, nd.y-30, L('pick')+' '+L(it.n), ()=>gather(nd)); break; }
  }
  // arriving on a tapped spot interacts with whatever is standing there
  if(PROMPT && (press('act') || navTake())){ const f=PROMPT.fn; PROMPT=null; f(); }
  else navTake();
  // G gives to whoever is nearest
  if(press('give')){
    let best=null,bd=44;
    for(const t of GIFTEES()){ const d=Math.abs(t.x-P.x); if(d<bd){ bd=d; best=t; } }
    if(best) openGive(best);
    else khwanSay('Stand next to somebody first. Handing things to nobody is how rumours start.');
  }
}
/* ---------- conversations ---------- */
function talkSpirit(s){
  if(!s.met){
    s.met=true; saveGame();
    const lines=s.hi.map(t=>({w:s.name,t}));
    lines.push({w:'',t:s.about});
    lines.push({w:'Khwan',t:'Nobody here will hurt you. Ask what they need, then give it.'});
    say(lines, ()=>{ addMerit(3); toast('+3 merit · a new neighbour'); });
    return;
  }
  if(s.friend){ say([{w:s.name,t:pick(s.thanks)}]); return; }
  say([{w:s.name,t:s.wish},
       {w:s.name,t: has('eye')? 'You can see it, can\'t you. The thing I want. Everyone can see it if they look for a moment.'
                              : 'I would not ask. But you did ask, so — that.'}]);
}
function talkVillager(v){
  /* Three beats, never more: who they are to you, what they need, and
     one line of village. The middle beat is the only one that is ever
     a job, and it says the job out loud so nothing has to be guessed. */
  const V = VOICE[v.id] || {};
  const warm = (GS.friends[v.id]||0) > 0;
  const lines = [];
  lines.push({w:v.name, t: pick(warm ? (V.warm||[v.line]) : (V.cold||[v.line]))});

  const ask = reqAsk(v);
  if(ask){
    npcReact(v,'wave',1.4);
    lines.push({w:v.name, t: pick(V.ask||['I need something, if you have a moment.'])});
    lines.push({w:v.name, t: ask});
  } else if(!warm){
    lines.push({w:v.name, t:'What I would really like is '+L(ITEMS[v.wants].n)+'. Not that I would ever ask.'});
  } else {
    npcReact(v,'wai',1.6);
    lines.push({w:v.name, t: pick(V.chat||['The rice is doing what rice does.'])});
  }
  say(lines);
}
function talkMali(){
  if(!GS.q.cat){
    say([{w:'Mali',t:'M-Meow-Meow climbed too high… nobody can reach her… even Papa\'s ladder is too short… *sniff*'},
         {w:'You',t:'(You crack your knuckles. It sounds like bamboo in wind.)'},
         {w:'Mali',t:'…could YOU reach it? You are very tall. Careful, giant friend!'}],
      ()=>{ GS.q.maliMet=true; });
  } else talkVillager(MALI);
}
function talkPhra(){
  if(!GS.q.metPhra){
    PHRA.shown=true;
    say([
      {w:'',t:'You bow at the little house on its single pillar — and something inside bows back.'},
      {w:'Phra Phum',t:'Ah. A prete. Tall one, you are standing on my land, on my road, in my village.'},
      {w:'You',t:'(You try to apologise. It comes out as a long thin whistle.)'},
      {w:'Phra Phum',t:'I know. A needle\'s eye for a mouth, and a page you cannot read.'},
      {w:'You',t:'(You ask him what you did. You ask it four different ways.)'},
      {w:'Phra Phum',t:'I have your ledger here, and no, I will not read it out. It is not mine to say.'},
      {w:'Phra Phum',t:'It opens on its own, a line at a time, as you earn the right to it.'},
      {w:'Phra Phum',t:'Earn one hundred and eight merit and you will have all of it. Then the road home.'},
      {w:'Phra Phum',t:'Pick things. Cook them. Give them away. Spent merit still counts as earned.'},
    ], ()=>{ GS.q.metPhra=true; addMerit(3); toast('+3 merit'); saveGame(); });
  } else if(GS.merit>=GOAL && GS.mem.bowl && !GS.ready && !GS.q.done){
    say([{w:'Phra Phum',t:'…One hundred and eight. The ledger is level, tall one. You have read the last page.'},
         {w:'You',t:'(You ask whether she knows. Whether anyone told her you came back.)'},
         {w:'Phra Phum',t:'She sets out the fourth bowl. What do you think she knows?'},
         {w:'Phra Phum',t:'I have sent for the monk. Stand here at the shrine and we will pour the water.'}],
      ()=>{ GS.ready=true; saveGame(); });
  } else if(GS.merit>=GOAL && !GS.q.done){
    say([{w:'Phra Phum',t:'One hundred and eight, and one page still turning. Wait for it. It is nearly here.'}]);
  } else if(GS.q.done){
    say([{w:'Phra Phum',t:'Still here? Good. The morning suits you better than the night did.'}]);
  } else {
    const tips=[];
    if(!GS.q.lamp) tips.push('The lamp on the dark stretch has been out a month. Nobody owns a tall enough ladder.');
    if(!GS.q.tree) tips.push('A tree came down across the west road. The rice cart cannot get past it.');
    if(!GS.q.cat)  tips.push('That child has been crying under the tamarind for an hour. Something about a cat.');
    if(!GS.q.garland) tips.push('My garland fell. I would hang it myself, but I am eight inches tall and made of light.');
    const un=SPIRITS.filter(s=>!s.friend);

    k:'I knew. I could not be the one to tell you.' },

let memI=0, memCh=0, IN=null, MEMFADE=0;
const SHELF_X=252;
function memScene(i){
  const S={ t:0, flash:0, shake:0, done:false, px:[], puffs:[], dust:[] };
  for(let k=0;k<26;k++) S.dust.push({x:rnd(0,W),y:rnd(0,H),sp:rnd(3,11),r:rnd(0.6,1.5),a:rnd(0.08,0.3)});
  const id=MEMS[i].id;
  if(id==='take')  Object.assign(S,{ mx:132, face:1, walk:0, noise:0, stir:0, took:0, reach:false, navx:null });
  if(id==='drink') Object.assign(S,{ sips:0, tilt:0, bottle:1, bell:0, past:0 });
  if(id==='scale') Object.assign(S,{ tug:0, tries:0, last:0, slam:0, soil:0, shut:0 });
  if(id==='bowl')  Object.assign(S,{ reach:0, tries:0, thru:0, fourth:0, cand:0 });
  return S;
}
function memSpark(S,x,y,n,col,sp=1){
  for(let i=0;i<n;i++) S.px.push({x,y,vx:rnd(-40,40)*sp,vy:rnd(-70,-10)*sp,g:150,l:rnd(0.35,1.1),c:col,r:rnd(0.7,1.6)});
}
/* remembering is not something you choose. it just starts. */
function startMem(i){
  if(!MEMS[i]) return;                       // a page that is not there is not a crash
  memI=i; memCh=0; IN=null; MEMFADE=1;
  GS.state='memory'; clearPress(); navStop();
  AU.wail && AU.wail();
}
function memReady(){
  // do not cut Khwan off mid-sentence, but do not wait out the whole line either
  if(GS.state!=='play' || DLG) return -1;
  if(KHWAN.bub && KHWAN.bubT > (KHWAN.bubMax||6)-1.8) return -1;
  for(let i=0;i<MEMS.length;i++){
    if(GS.mem[MEMS[i].id]) continue;
    if(MEMS[i].when && MEMS[i].when()) return i;
  }
  return -1;
}
function finishMem(){
  const m=MEMS[memI];
  GS.mem[m.id]=true; saveGame();
  IN=null; memCh=0; clearPress();
  GS.state='play'; GS.camX=clamp(P.x-W/2,0,WORLD_W-W); GS.camY=0;
  MEMFADE=1;
  GS.seen.newmem=true;
  toast('a page came back — it is in your ledger','#b9a8d8');
  khwanSay(m.k||'', 7);
}
function stepMem(dt){
  if(!IN) IN=memScene(memI);
  const S=IN, sc=MEMS[memI];
  S.t+=dt;
  MEMFADE=Math.max(0,MEMFADE-dt*1.6);
  S.flash=Math.max(0,S.flash-dt*2.6); S.shake=Math.max(0,S.shake-dt*5.5);
  for(let i=S.px.length-1;i>=0;i--){ const q=S.px[i];
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt; q.l-=dt; if(q.l<=0) S.px.splice(i,1); }
  for(let i=S.puffs.length-1;i>=0;i--){ const q=S.puffs[i];
    q.y-=q.sp*dt; q.l-=dt; if(q.l<=0) S.puffs.splice(i,1); }
  for(const d of S.dust){ d.y-=d.sp*dt; d.x+=Math.sin((S.t+d.r)*0.7)*4*dt; if(d.y<-2){ d.y=H+2; d.x=rnd(0,W); } }
  if(press('back')){ AU.sel(); finishMem(); return; }

  if(!S.done){
    if(sc.id==='take'){
      /* creeping: moving makes noise, standing still lets it settle.
         a tap walks you along the room, or takes the coin once you can reach */
      let grab=false;
      if(PRESS.tap){ PRESS.tap=false; PRESS.act=false;
        if(S.reach && Math.abs(TAP.x-SHELF_X)<74) grab=true;
        else S.navx=clamp(TAP.x,58,SHELF_X-19);
      }
      let dir=(K.right?1:0)-(K.left?1:0);
      if(dir) S.navx=null;
      else if(S.navx!=null){ const d=S.navx-S.mx;
        if(Math.abs(d)<3) S.navx=null; else dir=d>0?1:-1; }
      if(dir){ S.mx=clamp(S.mx+dir*74*dt,52,SHELF_X-22); S.face=dir;
        S.walk+=dt*7.0; S.noise=Math.min(1.35,S.noise+dt*0.52);
        if(Math.sin(S.walk*2)>0.94) AU.step();
      } else S.noise=Math.max(0,S.noise-dt*0.4);
      if(S.noise>=1 && S.stir<=0){ S.stir=2.2; S.shake=0.5; AU.tick(); }
      if(S.stir>0) S.stir-=dt;
      S.reach = S.mx>SHELF_X-40;
      if(grab || (S.reach && press('act'))){
        S.took=0.001; S.flash=1; S.shake=1; AU.ding(); AU.spark();
        memSpark(S,SHELF_X,100,22,CL.goldL);
        S.done=true;
      }
    } else if(sc.id==='drink'){
      if(press('act')||press('tap')){
        S.sips++; S.bottle=Math.max(0,1-S.sips/3); S.tilt+=0.038; S.shake=0.35;
        AU.pour(); AU.blip();
        S.puffs.push({x:196+rnd(-14,14),y:120,sp:20,l:1.3,s:['ha','ha ha','heh'][S.sips%3]});
        if(S.sips>=3){ S.done=true; AU.gong(); }
      }
    } else if(sc.id==='scale'){
      /* the scale: alternate the two sides and it lifts a little, then sags right back */
      const l=press('left'), r=press('right');
      if(l||r){ const side=l?-1:1;
        if(side!==S.last){ S.tries++; S.tug=Math.min(1,S.tug+0.24); S.last=side; AU.tick(); }
        else S.tug=Math.min(1,S.tug+0.05);
        S.shake=Math.max(S.shake,0.22);
      }
      S.tug=Math.max(0,S.tug-dt*0.62);   // it always sags back. that is the point.
      if(S.t>1.8 && (S.tries>=8 || S.t>5.5)){
        S.done=true; S.slam=0.001; S.shake=1; AU.gong(); AU.drum();
        memSpark(S,240,150,26,'#8a7a5a',1.5);
      }
    } else {
      /* four bowls: you reach, and your hand goes through, three times */
      S.cand=Math.min(1,S.cand+dt*0.7);
      S.reach=Math.max(0,S.reach-dt*1.5);
      if(press('act')||press('tap')){
        S.tries++; S.reach=1; S.thru=1; AU.poof && AU.poof(); AU.blip();
        memSpark(S,150,150,8,'#cfc4ae',0.5);
        if(S.tries>=3){ S.done=true; AU.metta && AU.metta(); }
      }
      S.thru=Math.max(0,S.thru-dt*1.1);

const PORTRAIT_CACHE = {};
function buildPortrait(key){
  const S2=48, c=mkCv(S2,S2), g=G2(c);
  const half=S2/2;
  // sky behind the face
  pVGrad(g,0,0,S2,S2,'#e6d0a2','#b9945f',5);
  for(let i=0;i<20;i++) pR(g,(i*13)%S2,(i*7)%S2,1,1,'rgba(255,250,232,0.30)');
  g.save();
  const place=(fn,scale,hx,hy)=>{ g.translate(half,half+4); g.scale(scale,scale); g.translate(-hx,-hy); fn(); };
  if(key==='you'||key==='prete'){
    const q=makePrete(); q.x=0; q.y=0; q.face=1; q.blink=3;
    for(let k=0;k<30;k++){ stepPrete(q,1/60); stepCloth(q.cloth,0,-44,12,1/60,0,0); }
    place(()=>drawPrete(g,q,{dt:1/60,cos:GS.cos||{skirt:"ash"}}), 2.0, 0, -84);
  } else if(key==='khwan'){
    place(()=>drawKhwan(g,{x:0,y:0,anim:1.2,blink:3,bub:null}), 3.2, 0, -1);
  } else if(key==='phra'){
    place(()=>drawPhraPhum(g,0,0,1.2), 2.1, 0, -19);
  } else if(key==='tani'){
    place(()=>drawTani(g,{x:0,y:0,face:1,anim:1.1},{}), 2.4, 0, -27);
  } else if(SPIRIT_BY_ID[key]){
    const s=SPIRIT_BY_ID[key];
    const hy = key==='krasue'? 0 : key==='taihong'? -50 : key==='krahang'? -26 : -33;
    place(()=>GHOST_ART[s.art](g,{x:0,y:0,face:1,anim:1.3,hurtT:0,attackT:0,hop:0,h:46,friendly:1}), 2.4, 0, hy);
  } else {
    const n=NPCS.find(v=>v.id===key);
    if(n){ const m=makeVillager(Object.assign({},n,{x:0,y:0,vx:0,phase:0,face:1,cloth:makeCloth(4,9)}));
      for(let k=0;k<16;k++) stepCloth(m.cloth,0,-10,9,1/60,0,0);
      place(()=>drawVillager(g,m,{}), 3.4, 0, -20); }
  }
  g.restore();
  // circular mask + rim
  const g2=G2(mkCv(S2,S2));
  const out=mkCv(S2,S2), og=G2(out);
  og.save(); og.beginPath(); og.arc(half,half,half-2,0,TAU); og.clip(); og.drawImage(c,0,0); og.restore();
  for(let i=0;i<64;i++){ const a=i/64*TAU;
    pR(og,half+Math.cos(a)*(half-2),half+Math.sin(a)*(half-2),2,2,CL.edge);
    pR(og,half+Math.cos(a)*(half-3),half+Math.sin(a)*(half-3),1,1,CL.rim); }
  return out;
}

let ASC=null;

function startAscend(skillId){
  const s=SKILLS[skillId];
  ASC={ id:skillId, s, dev:DEVAS[s.br], phase:'lift', t:0, rise:0, drift:0,
        ch:0, fill:0, flash:0, beam:0, done:false, sparks:[] };

function stepAscend(dt){
  const A=ASC; A.t+=dt;
  const hold = K.act || K.light || (TOUCH.on && TOUCH.pts.size>0);
  if(A.flash>0) A.flash-=dt;
  switch(A.phase){
    case 'lift':
      A.rise += (hold? 1.9 : 1)*dt;
      if(Math.random()<dt*22) A.sparks.push({x:rnd(-30,30),y:rnd(0,40),v:rnd(30,90),t:0});
      if(A.rise>1.7){ A.phase='climb'; A.t=0; AU.ranat(880,0,0.05); }
      break;
    case 'climb':{
      let dx=0; if(K.left)dx-=1; if(K.right)dx+=1;
      if(TOUCH.on&&TOUCH.aim.active) dx=clamp((TOUCH.aim.x-W/2)/60,-1,1);
      A.drift=clamp(A.drift+dx*dt*40,-52,52);
      A.speed = hold? 2.1 : 1.25;
      for(const c of ASC_CLOUDS){ c.y += c.sp*A.speed*dt*0.5; if(c.y>1.2){ c.y=-0.25; c.x=Math.random(); } }
      if(Math.random()<dt*30) A.sparks.push({x:rnd(-70,70),y:rnd(-10,H),v:rnd(60,150),t:0});
      if(A.t>3.4){ A.phase='arrive'; A.t=0; A.flash=0.7; AU.bigDing(); }
      break; }
    case 'arrive':
      if(A.t>1.5){ A.phase='speak'; A.t=0; A.ch=0; AU.ranat(1046,0,0.05); }
      break;
    case 'speak':
      A.ch+=dt*46;
      if((press('act')||press('tap'))){
        if(A.ch < A.dev.line.length) A.ch=A.dev.line.length;
        else { A.phase='bless'; A.t=0; AU.chant(); }
      }
      break;
    case 'bless':
      if(hold){ A.fill+=dt*0.75; A.beam=Math.min(1,A.beam+dt*3);
        if(Math.random()<dt*40) A.sparks.push({x:rnd(-14,14),y:rnd(-40,10),v:-rnd(40,110),t:0}); }
      else { A.fill=Math.max(0,A.fill-dt*0.35); A.beam=Math.max(0,A.beam-dt*2); }
      if(A.fill>=1 && !A.done){
        A.done=true; A.phase='granted'; A.t=0; A.flash=1;
        GS.skills[A.id]=1; GS.spent+=A.s.cost;
        AU.metta(); AU.bigDing();
        toast('learned '+A.s.n, PAL.jadeL);
        if(A.id==='metta'){ GS.seen.own_halo=true; toast('Halo unlocked',PAL.goldL); }
        GS.seen['blessed'+A.s.br]=true;
        saveGame();
      }
      break;
    case 'granted':
      if(A.t>2.2 && (press('act')||press('tap'))){ A.phase='descend'; A.t=0; }
      break;
    case 'descend':
      for(const c of ASC_CLOUDS){ c.y -= 2.4*dt; if(c.y<-0.25) c.y=1.2; }
      if(A.t>1.6){ ASC=null; GS.state='tree'; return; }
      break;
  }
  for(let i=A.sparks.length-1;i>=0;i--){ const s=A.sparks[i]; s.t+=dt; s.y-=s.v*dt;
    if(s.t>2.2||s.y<-40) A.sparks.splice(i,1); }
  clearPress();
}
function drawAscend(g){
  const A=ASC, ph=A.phase;
  const up = ph==='lift'? clamp(A.rise/1.7,0,1) : 1;
  // sky: night at the bottom, heaven at the top
  const t2 = ph==='lift'? up*0.5 : ph==='descend'? 1-clamp(A.t/1.6,0,1) : 1;
  pVGrad(g,0,0,W,H*0.5, mix('#141a3e','#ffeec0',t2), mix('#222a58','#ffd58a',t2), 8);
  pVGrad(g,0,H*0.5,W,H*0.5, mix('#222a58','#ffc978',t2), mix('#33406e','#f2a45c',t2), 7);
  // sun-glow above
  const gr=g.createRadialGradient(W/2,-30,10,W/2,-30,180);
  gr.addColorStop(0,`rgba(255,246,210,${0.5*t2})`); gr.addColorStop(1,'rgba(255,246,210,0)');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  // god-rays
  g.save(); g.globalCompositeOperation='lighter';
  for(let i=0;i<9;i++){
    const a=-Math.PI/2 + (i-4)*0.17 + Math.sin(GS.t*0.3+i)*0.02;
    g.globalAlpha=0.05*t2;
    pTri(g, W/2, -20, W/2+Math.cos(a)*400-26, -20+Math.sin(a)*400, W/2+Math.cos(a)*400+26, -20+Math.sin(a)*400, '#fff2c0');
  }
  g.restore(); g.globalAlpha=1;
  // streaming clouds
  for(const c of ASC_CLOUDS){
    const cx=c.x*W - A.drift*0.5, cy=c.y*H;
    g.globalAlpha=c.o*0.8*t2;
    puffCloud(g,cx,cy,c.w,c.h,(c.w*7+c.h*3)|0,
      {top:'#fffdf4',body:'#f4ecdc',under:'#dccfb6',edge:'#c9bda2'});
    g.globalAlpha=1;
  }
  // the terrace you arrive at
  if(ph!=='lift'){
    const arr = ph==='climb'? 0 : ph==='arrive'? clamp(A.t/1.2,0,1) : ph==='descend'? 1-clamp(A.t/1,0,1) : 1;
    if(arr>0){
      g.globalAlpha=arr;
      // a golden vimana terrace
      const ty=H*0.80;
      // a bank of cloud the terrace rests on
      for(let i=0;i<5;i++) puffCloud(g,W/2-110+i*55,ty+16,86,30,7+i,
        {top:'#fffdf4',body:'#f2e8d2',under:'#d8c9a8',edge:'#bcae90'});
      pR(g,W/2-126,ty,252,7,'#e8d3a0'); pR(g,W/2-126,ty,252,2,'#fff2cc');
      pR(g,W/2-126,ty+6,252,3,'#c2a266');
      // a rail of small gold chedis behind
      for(let i=0;i<7;i++){ const x=W/2-96+i*32;
        pEll(g,x,ty-2,9,4,'#e8d3a0');
        for(let k=0;k<6;k++){ const rr=lerp(6.5,1.6,k/5); pR(g,x-rr,ty-6-k*4,rr*2,4,k%2?'#f2c14e':'#c9992f'); }
        pTaper(g,x,ty-30,x,ty-37,2.4,1,'#ffe89a'); pEll(g,x,ty-31,1.6,2,'#fff2cc'); }
      pR(g,W/2-126,ty-3,252,2,'#c9992f'); pR(g,W/2-126,ty-5,252,1,'#ffe89a');
      g.globalAlpha=1;
    }
  }
  // the god
  if(ph==='arrive'||ph==='speak'||ph==='bless'||ph==='granted'){
    const dy = ph==='arrive'? lerp(-80,0,clamp(A.t/1.2,0,1)) : 0;
    drawDeva(g,A.dev.k, W/2, H*0.43+dy, GS.t);
  }
  // you, rising
  {
    const stand=H*0.80;
    const py = ph==='lift'? lerp(H+50, stand, up)
             : ph==='descend'? lerp(stand, H+60, clamp(A.t/1.6,0,1)) : stand;
    const q=P;
    const sv={x:q.x,y:q.y,vx:q.vx,face:q.face,state:q.state};
    q.x=W/2+A.drift; q.y=py; q.vx=0; q.face=1; q.state='idle';
    stepPrete(q,1/60);
    const glow=g.createRadialGradient(q.x,py-36,4,q.x,py-36,48);
    glow.addColorStop(0,'rgba(255,240,190,0.3)'); glow.addColorStop(1,'rgba(255,240,190,0)');
    g.fillStyle=glow; g.fillRect(q.x-44,py-78,88,88);
    drawPrete(g,q,{dt:1/60,wind:0.1,gold:A.done?1:0,
      armTarget: (ph==='bless'&&A.beam>0.2)? {x:q.x,y:py-88} : null});
    q.x=sv.x; q.y=sv.y; q.vx=sv.vx; q.face=sv.face; q.state=sv.state;
    // the beam of blessing
    if(A.beam>0){
      g.globalCompositeOperation='lighter';
      const bw=6+A.beam*16;
      const bg=g.createLinearGradient(0,H*0.42,0,py-20);
      bg.addColorStop(0,`rgba(255,246,200,${0.55*A.beam})`); bg.addColorStop(1,`rgba(255,220,140,${0.15*A.beam})`);
      g.fillStyle=bg; g.fillRect(W/2+A.drift-bw/2, H*0.42, bw, py-20-H*0.42);
      g.globalCompositeOperation='source-over';
    }
  }
  // rising sparks
  g.globalCompositeOperation='lighter';
  for(const s of A.sparks){
    const a=clamp(1-s.t/2.2,0,1);
    g.fillStyle=`rgba(255,240,190,${a})`;
    g.fillRect(R(W/2+s.x-A.drift*0.3), R(s.y), 1, R(1+s.v*0.02));
  }
  g.globalCompositeOperation='source-over';
  if(A.flash>0){ g.fillStyle=`rgba(255,250,232,${clamp(A.flash,0,1)*0.9})`; g.fillRect(0,0,W,H); }

  /* ---- the words ---- */
  if(ph==='lift'){
    cloudTag(g,W/2,34,190,22,{seed:3});
    pTxt(g,'ASCENDING',W/2,38,CL.ink,10,'center');
    g.globalAlpha=0.55+0.45*Math.sin(GS.t*6);
    pTxt(g,'hold to rise faster',W/2,H-22,'#fff6dc',8,'center'); g.globalAlpha=1;
  }
  if(ph==='climb'){
    g.globalAlpha=0.5+0.5*Math.sin(GS.t*4);
    pTxt(g,'hold to climb',W/2,H-22,'#fff6dc',8,'center'); g.globalAlpha=1;
  }
  if(ph==='arrive'&&A.t>0.7){ devaPlate(g,A.dev); }
  if(ph==='speak'){
    devaPlate(g,A.dev);
    const bw=W-90, bx=45, bh=42, by=H-bh-14;
    cloud(g,bx,by,bw,bh,{seed:23});
    let ty=by+16;
    for(const l of wrap(g,A.dev.line.slice(0,A.ch|0),bw-24,7).slice(0,3)){ pTxt(g,l,bx+12,ty,CL.ink,7); ty+=10; }
    if((A.ch|0)>=A.dev.line.length){ g.globalAlpha=0.5+0.5*Math.sin(GS.t*6);
      icoDown(g,bx+bw-15,by+bh-11,1.3,CL.gold); g.globalAlpha=1; }
  }
  if(ph==='bless'){
    cloudTag(g,W/2,H*0.13,210,26,{seed:31});
    pTxt(g,'RECEIVE THE BLESSING',W/2,H*0.13+3,CL.ink,8,'center');
    const bw=150, bx=W/2-bw/2, by=H-40;
    cloud(g,bx-8,by-10,bw+16,26,{seed:41});
    pR(g,bx,by,bw,7,'#cbbfa6');
    pR(g,bx,by,bw*clamp(A.fill,0,1),7, A.fill>0.85?'#ffe89a':PAL.gold);
    pR(g,bx,by,bw*clamp(A.fill,0,1),1,'#fffdf6');
    g.globalAlpha=0.6+0.4*Math.sin(GS.t*7);
    pTxt(g,'hold',W/2,by+5,CL.ink,7,'center'); g.globalAlpha=1;
    pTxt(g,'wai and hold still',W/2,by+20,CL.ink2,6,'center');
  }
  if(ph==='granted'){
    const w2=250, h2=76, x=W/2-w2/2, y=H*0.56;
    cloud(g,x,y,w2,h2,{seed:53});
    pTxt(g,'BLESSED',W/2,y+18,CL.gold,13,'center');
    pTxt(g,A.dev.bless,W/2,y+31,CL.ink,7,'center');
    pTxt(g,A.s.n,W/2,y+48,CL.ink,9,'center');
    pTxt(g,'+'+A.s.cost+' merit spent — still counted as earned',W/2,y+60,CL.ink3,6,'center');
    if(A.t>2.2){ g.globalAlpha=0.6+0.4*Math.sin(GS.t*5);
      pTxt(g,'go back down',W/2,y+h2+16,'#fff6dc',7,'center'); g.globalAlpha=1; }
  }
}

  pR(g,yx,ry-3,1,10,'#8f2a20');

  let obj = !GS.q.metPhra? 'go east to the spirit house'

    : !GS.q.metPhra? 'go east to the spirit house'

    : GS.merit>=GOAL? 'tell Phra Phum — the ledger is full'
    : SPIRITS.some(s=>!s.friend)? 'somebody out there is still waiting'
    : 'keep making things and giving them away';
  pTxt(g,obj,x0+w-12,y0+h-10,CL.ink2,6,'right');
}

  if(ids.length){
    const SL=22, n=Math.max(4,ids.length), tw=n*SL+6, tx=R(W/2-tw/2), ty=H-SL-8;
    cloud(g,tx,ty,tw,SL+4,{seed:2});
    for(let i=0;i<n;i++){
      const sx=tx+3+i*SL, sy=ty+3;
      pR(g,sx,sy,SL-2,SL-2,'#b89a6e'); pR(g,sx+1,sy+1,SL-4,SL-4,'#e8d3a6');
      pR(g,sx+1,sy+1,SL-4,1,'#f6e7c6'); pR(g,sx+1,sy+SL-4,SL-4,1,'#c9ac80');
      const id=ids[i]; if(!id) continue;
      drawIcon(g,id,sx+(SL-2)/2,sy+9,0.66);
      pTxt(g,''+GS.bag[id],sx+SL-5,sy+SL-5,CL.ink,7,'right');
    }
  }

  const task = reqLine();
  if(task && !DLG){
    const tw=txtW(task,7)+22;
    cloud(g,6,26,tw,16,{seed:3,body:'#f0e2b4'});
    icoStar(g,15,34,0.8,'#c9992f');
    pTxt(g,task,23,37,CL.ink,7);
  }

  const z=zoneAt(P.x);
  if(GS._zone!==z.id){ GS._zone=z.id; GS.zoneName=3.2; GS._zoneZ=z; }
  if(GS.zoneName>0){
    GS.zoneName-=1/60;
    const a=clamp(GS.zoneName,0,1)*clamp((3.2-GS.zoneName)*3,0,1);
    g.globalAlpha=a;
    pTxt(g,GS._zoneZ.name,W-10,19,'#ffe6b0',11,'right');
    g.globalAlpha=1;
  }
  GS.toasts.forEach((t,i)=>{
    t.t+=1/60;
    const a=t.t<0.2?t.t/0.2:t.t>2.2?clamp((2.8-t.t)/0.6,0,1):1;
    g.globalAlpha=a;
    const tw=txtW(t.text,7)+20;
    cloud(g,W/2-tw/2,80+i*17-t.t*3,tw,14,{seed:(i*7+3)});
    pTxt(g,t.text,W/2,90+i*17-t.t*3,CL.ink,7,'center');
    g.globalAlpha=1;
  });
  GS.toasts=GS.toasts.filter(t=>t.t<2.8);
  if(PROMPT){
    const s=PROMPT.txt;
    const w2=txtW(s,7)+22;
    const x=PROMPT.x-GS.camX;
    /* he is a hundred pixels of prete: anything printed at a villager's height
       lands on his chest, so lift the prompt clear of his head when he is under it */
    const px=P.x-GS.camX;
    let y=PROMPT.y-GS.camY;
    if(Math.abs(x-px)<52) y=Math.min(y, P.y-GS.camY-128);
    y=Math.max(y,76);
    cloud(g,x-w2/2,y-13,w2,14,{seed:6});
    pTxt(g,s,x,y-3,CL.ink,7,'center');
    if(PROMPT.sub){
      const w3=txtW(PROMPT.sub,6)+18;
      cloud(g,x-w3/2,y+6,w3,12,{seed:8,top:'#eef7e6',body:'#dcecd0',under:'#c2d6b4',edge:'#96ab88'});
      pTxt(g,PROMPT.sub,x,y+14,'#3a4a30',6,'center'); }
  }
  /* the hint has to clear the toolbar, and it has to stop once you have
     plainly understood it — a permanent instruction is just clutter */
  if(!PROMPT && !DLG && !GS.q.gifts){
    g.globalAlpha=0.8;
    pTxt(g,'tap the ground to walk',W/2,GS._bar? H-36 : H-8,'#e8e0d0',6,'center');
    g.globalAlpha=1;
  }
}

/* ---------------- the ledger ---------------- */
function stepTree(dt){
  GS.seen.ledger=true;
  if(press('back')||press('tree')){ GS.state='play'; AU.sel(); clearPress(); return; }
  hitTap();                     // a tap lands on whatever was drawn there
  if(GS.state!=='tree') return; // ...which may have been the close button
  if(press('heavy')||press('whistle')||press('give')){ TREE.tab=(TREE.tab+1)%5; TREE.row=0; AU.sel(); }
  if(TREE.tab===0){
    const keys=Object.keys(SKILLS);
    if(press('left')){ TREE.col=(TREE.col+2)%3; AU.blip(); }
    if(press('right')){ TREE.col=(TREE.col+1)%3; AU.blip(); }
    const col=keys.filter(k=>SKILLS[k].br===TREE.col);
    if(press('up')) { TREE.row=clamp(TREE.row-1,0,col.length-1); AU.blip(); }
    if(press('down')){ TREE.row=clamp(TREE.row+1,0,col.length-1); AU.blip(); }
    TREE.row=clamp(TREE.row,0,col.length-1);
    if(press('act')){
      const id=col[TREE.row], s=SKILLS[id];
      if(GS.skills[id]) AU.blip();
      else if(s.need && !GS.skills[s.need]){ toast('learn '+SKILLS[s.need].n+' first','#a8392c'); AU.blip(); }
      else if(avail()<s.cost){ toast('you need '+(s.cost-avail())+' more merit','#a8392c'); AU.blip(); }
      else { startAscend(id); clearPress(); return; }   // up you go
    }
  } else if(TREE.tab===1){
    const ids=Object.keys(COSMETICS).filter(c=>!COSMETICS[c].locked || GS.seen['own_'+c]);
    if(press('left')) { TREE.row=(TREE.row+ids.length-1)%ids.length; AU.blip(); }
    if(press('right')){ TREE.row=(TREE.row+1)%ids.length; AU.blip(); }
    if(press('up')||press('down')){ TREE.row=clamp(TREE.row+(K.up?-4:4),0,ids.length-1); AU.blip(); }
    TREE.row=clamp(TREE.row,0,ids.length-1);
    if(press('act')){
      const id=ids[TREE.row], c=COSMETICS[id], owned=GS.seen['own_'+id]||c.cost===0;
      if(owned){ GS.cos[c.slot]= c.slot==='skirt'? c.v : (GS.cos[c.slot]?0:c.v); AU.sel(); saveGame(); }
      else if(avail()>=c.cost){ GS.spent+=c.cost; GS.seen['own_'+id]=true; GS.cos[c.slot]=c.v; AU.unlock(); toast('got '+c.n,PAL.jadeL); saveGame(); }
      else { toast('not enough merit','#a8392c'); AU.blip(); }
    }
  } else if(TREE.tab===2){
    const list=GIFTEES();
    if(press('up')||press('left'))  { TREE.row=(TREE.row+list.length-1)%list.length; AU.blip(); }
    if(press('down')||press('right')){ TREE.row=(TREE.row+1)%list.length; AU.blip(); }
  }
  clearPress();
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  GS.t+=dt;
  AU.tick(dt);
  GS.wind = Math.sin(GS.t*0.31)*0.32 + Math.sin(GS.t*0.113)*0.18;
  GS.shake = Math.max(0, GS.shake - dt*16);
  if(meritFlash>0) meritFlash-=dt*2;
  for(const m of MOTES) m.t+=dt*m.sp;
  for(const f of FIREFLIES){
    f.t+=dt*f.sp;
    f.x=f.hx+Math.sin(f.t*0.85)*16+Math.sin(f.t*0.37)*9;
    f.y=f.hy+Math.cos(f.t*0.7)*10+Math.sin(f.t*0.53)*5;
  }
  if(press('mute')){ AU.toggle(); toast(AU.muted?'sound off':'sound on','#9ecbff'); }
  if(press('lang')){ toggleLang(); toast(LANG==='th'?'ภาษาไทย':'English','#9ecbff'); }

  switch(GS.state){
    case 'title':
      TP.anim+=dt;
      if(press('act')||press('tap')){
        const sv=loadSaveRaw();
        if(sv&&(sv.merit>0||(sv.q&&sv.q.metPhra))) continueGame(sv); else newGame();
        AU.ding();
      }
      if(press('newgame')){ clearSave(); newGame(); AU.ding(); }
      break;
    case 'memory': stepMem(dt); break;
    case 'play':{
      stepVig(dt);
      stepDlg(dt);
      stepPlayer(dt);
      stepNpcs(dt);
      stepFarm(dt);
      stepOrders(dt);
      stepHands(dt);
      stepKhwan(dt);
      /* the past does not wait to be asked */
      { const mi=memReady(); if(mi>=0){ startMem(mi); break; } }
      if(!DLG && !VIG){
        checkInteract();
        if(press('tree')||press('help')){ GS.state='tree'; TREE.tab=GS.seen.newmem?4:0; AU.sel(); }
        if(press('map')){ GS.state='tree'; TREE.tab=3; AU.sel(); }
      }
      if(GS.ready && !GS.q.done && Math.abs(P.x-SHRINE_X)<44 && !DLG){ PROMPT=null; startCeremony(); }
      const gy=groundY(P.x);
      const look=clamp(P.vx*0.42,-46,46);
      if(!VIG) GS.camX = lerp(GS.camX, clamp(P.x+look-W/2, 0, WORLD_W-W), 1-Math.pow(0.0009,dt));
      const ty = clamp((gy-GBASE)*0.9 + (P.y<gy-96? (P.y-(gy-96))*0.45 : 0), -52, 40);
      GS.camY = lerp(GS.camY, ty, 1-Math.pow(0.004,dt));
      break; }
    case 'task':     PROMPT=null; stepTask(dt); break;
    case 'act':      PROMPT=null; stepKhwan(dt); stepAct(dt); break;
    case 'give':     PROMPT=null; stepGive(dt); break;
    case 'shop':     PROMPT=null; stepShop(dt); break;
    case 'tree':     PROMPT=null; stepTree(dt); break;
    case 'ascend':   PROMPT=null; stepAscend(dt); break;
    case 'ceremony': stepCeremony(dt); break;
    case 'end':
      GS.t2=(GS.t2||0)+dt;
      if(GS.t2>1.4){
        if(press('act')||press('tap')){
          GS.state='play';
          for(const n of NPCS){ n.state='idle'; n.t=rnd(1,4); }
          toast('a soft morning. wander as long as you like','#ffd98a');
        }
        if(press('restart')){ clearSave(); location.reload(); }
      }
      break;
  }
  stepParts(dt);
  clearPress();
}

function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v:2, merit:GS.merit, spent:GS.spent, baht:GS.baht|0, mute:AU.muted,
      skills:GS.skills, cos:GS.cos, q:GS.q, seen:GS.seen,
      bag:GS.bag, friends:GS.friends, learned:GS.learned, tut:GS.tut, mem:GS.mem,
      /* the whole farm: what you have rented, what is in the ground, what is in the pen */
      fm:{ r:FARM.rented, h:FARM.house, b:FARM.beds, p:FARM.paddies, tr:FARM.trees,
           pen:FARM.pen, hands:FARM.hands },
      beds:  PLOTS.map(p=>({s:p.stage,t:p.t,w:p.wet,f:p.fert})),
      pads:  PADDIES.map(p=>({s:p.stage,t:p.t,f:p.flood})),
      trees: TREES.map(t=>({c:t.crop,g:t.grow,f:t.fruit,t:t.t})),
      ord:   ORDERS.map(o=>({w:o.who,d:o.dish,n:o.n,g:o.got,p:o.pay,m:o.merit})),
      met: SPIRITS.filter(s=>s.met).map(s=>s.id),
      pals: SPIRITS.filter(s=>s.friend).map(s=>s.id),
      x: (typeof P!=='undefined'&&P)?P.x:300,
    }));
  }catch(e){}
}

function resetWorld(){
  for(const s of SPIRITS){ s.met=false; s.friend=false; s.hand=null; if(s.home!==undefined){ s.x=s.home; s.y=groundY(s.x); } }
  const bl=LIGHTS.find(l=>l.broken); if(bl) bl.on=false;
  CAT.state='tree'; CAT.x=TAMARIND_X+16; CAT.y=groundY(TAMARIND_X)-104;
  PHRA.shown=false; offering=null; DLG=null; ACT=null; GIVE=null; HT=null;
  PT.length=0; GS.toasts.length=0;
  for(const nd of NODES){ nd.ready=true; nd.t=0; }
  for(const l of LIGHTS) if(l.id==='kitchen') l.on=true;
  seedAtmosphere();
}
/* the farm back to the state the landlord leaves it in */
function resetFarm(){
  FARM.rented=false; FARM.house=0; FARM.beds=0; FARM.paddies=0; FARM.trees=0;
  FARM.pen={ chicken:0, duck:0, buffalo:0, feed:0, egg:0, degg:0, milk:0, dung:0, t:0 };
  FARM.hands={};
  for(const pl of PLOTS){ pl.stage=0; pl.t=0; pl.wet=0; pl.fert=0; pl.pop=0; }
  for(const pd of PADDIES){ pd.stage=0; pd.t=0; pd.flood=0; pd.pop=0; }
  for(const tr of TREES){ tr.crop=null; tr.grow=0; tr.fruit=0; tr.t=0; tr.pop=0; }
  for(const s of SPIRITS) s.hand=null;
}
function seedAtmosphere(){
  // moths around the lamps, petals under the blossom trees
  for(const l of LIGHTS){ if(l.c===PAL.lamp && Math.random()<0.6) for(let i=0;i<2;i++) pMoth(l.x+rnd(-8,8), l.y+rnd(-6,6)); }
}
function newGame(){
  GS.merit=0; GS.spent=0; GS.skills={}; GS.cos={skirt:'ash'};
  GS.q={prayers:0,offerings:0,pets:0,gifts:0}; GS.seen={}; GS.bag={}; GS.friends={};
  GS.learned={}; GS.tut=0; GS.dawn=0; GS.ready=false; GS.mem={};
  GS.baht=0;
  resetFarm();
  ORDERS.length=0; orderCool=14;
  P.x=300; P.y=groundY(300); P.vx=0; P.vy=0; P.rise=0; P.act=null; VIG=null;
  KHWAN.x=300; KHWAN.y=groundY(300)-50;
  resetWorld();
  GS.camX=clamp(P.x-W/2,0,WORLD_W-W); GS.camY=0;
  GS.t=0; GS.state='play'; IN=null; MEMFADE=1;
  KHWAN.x=P.x+26; KHWAN.y=P.y-60;
  say(WAKE, ()=>{ khwanSay('East. I will be right behind your shoulder.',6); });
  saveGame();
}
function continueGame(sv){
  GS.merit=sv.merit|0; GS.spent=sv.spent|0;
  GS.skills=sv.skills||{}; GS.cos=Object.assign({skirt:'ash'},sv.cos||{});
  GS.q=Object.assign({prayers:0,offerings:0,pets:0,gifts:0},sv.q||{});
  GS.seen=sv.seen||{}; GS.bag=sv.bag||{}; GS.friends=sv.friends||{};
  GS.learned=sv.learned||{}; GS.tut=sv.tut||0; GS.mem=sv.mem||{};
  GS.baht=sv.baht|0;
  resetFarm();
  if(sv.fm){
    FARM.rented=!!sv.fm.r; FARM.house=+sv.fm.h||0;
    FARM.beds=sv.fm.b|0; FARM.paddies=sv.fm.p|0; FARM.trees=sv.fm.tr|0;
    if(sv.fm.pen) Object.assign(FARM.pen, sv.fm.pen);
    if(sv.fm.hands) for(const k in sv.fm.hands) if(JOBS[sv.fm.hands[k]]) FARM.hands[k]=sv.fm.hands[k];
  }
  const oldBeds = sv.beds||sv.farm;
  if(oldBeds) oldBeds.forEach((f,i)=>{ const pl=PLOTS[i]; if(pl){ pl.stage=f.s|0; pl.t=+f.t||0; pl.wet=+f.w||0; pl.fert=f.f|0; } });
  if(sv.pads)  sv.pads.forEach((f,i)=>{ const pd=PADDIES[i]; if(pd){ pd.stage=f.s|0; pd.t=+f.t||0; pd.flood=+f.f||0; } });
  if(sv.trees) sv.trees.forEach((f,i)=>{ const tr=TREES[i]; if(tr && (!f.c||ITEMS[f.c])){ tr.crop=f.c||null; tr.grow=+f.g||0; tr.fruit=f.f|0; tr.t=+f.t||0; } });
  ORDERS.length=0;
  if(sv.ord) for(const o of sv.ord){
    if(!(RECIPES[o.d]||CRAFTS[o.d])) continue;
    if(!NPCS.some(n=>n.id===o.w)) continue;
    ORDERS.push({who:o.w,dish:o.d,n:o.n|0||1,got:o.g|0,pay:o.p|0,merit:o.m|0});
  }
  resetWorld();
  if(sv.met)  for(const id of sv.met){ const s=SPIRIT_BY_ID[id]; if(s) s.met=true; }
  if(sv.pals) for(const id of sv.pals){ const s=SPIRIT_BY_ID[id]; if(s){ s.friend=true; s.met=true; } }
  if(GS.q.lamp){ const bl=LIGHTS.find(l=>l.broken); if(bl) bl.on=true; }
  if(GS.q.cat){ CAT.state='wander'; CAT.x=TAMARIND_X+40; CAT.y=groundY(CAT.x); }
  if(GS.q.metPhra) PHRA.shown=true;
  if(GS.q.done){ GS.dawn=1; GS.cos.halo=1; }
  if(GS.merit>=GOAL && GS.q.metPhra && GS.mem.bowl && !GS.q.done) GS.ready=true;
  P.x=clamp(sv.x||300,20,WORLD_W-20); P.y=groundY(P.x); P.vx=0; P.vy=0; P.rise=0; P.act=null; VIG=null;
  KHWAN.x=P.x+26; KHWAN.y=P.y-60;
  GS.camX=clamp(P.x-W/2,0,WORLD_W-W); GS.camY=0;
  GS.state='play';
}

  for(let i=0;i<70;i++){ const s=STARS[i];
    ctx.fillStyle=`rgba(255,246,224,${0.5*(0.4+0.6*Math.sin(GS.t*2+s[2]))})`;
    ctx.fillRect(R(s[0]*W),R(s[1]*H),1,1); }
  pTxt(ctx,'prete',W/2,H/2-14,PAL.gold,26,'center');
  const step=BUILD_STEPS[Math.min(BUILD_I,BUILD_STEPS.length-1)];
  pTxt(ctx,step[0]+'…',W/2,H/2+6,'#8a8098',7,'center');
  const w2=120, pr=BUILD_I/BUILD_STEPS.length;
  pR(ctx,W/2-w2/2,H/2+14,w2,3,'#241c3a');
  pR(ctx,W/2-w2/2,H/2+14,w2*pr,3,PAL.gold);
}
function frame(now){
  let dt=(now-_last)/1000; _last=now;
  if(!WORLD_READY){
    GS.t+=Math.min(0.1,dt);
    drawLoading();
    requestAnimationFrame(()=>{ if(buildStep()) seedAtmosphere(); requestAnimationFrame(frame); });
    return;
  }
  dt=Math.min(0.1,dt);
  if(GS.hitstop>0){ GS.hitstop-=dt; dt*=0.05; }
  _acc+=dt;
  let n=0;
  while(_acc>=STEP && n<4){ update(STEP); _acc-=STEP; n++; }
  render();
  requestAnimationFrame(frame);
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prete Simulator</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#080a1e;overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080a1e;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;cursor:default;touch-action:none;display:block;}
  #rot{position:fixed;left:0;right:0;bottom:6vh;text-align:center;display:none;pointer-events:none;
    color:#ffd257;font:600 15px/1.5 system-ui,sans-serif;text-shadow:0 2px 4px #000;}
  #rot b{display:block;font-size:30px;font-weight:400;margin-bottom:4px;}
  @media (orientation:portrait) and (max-width:900px){ #rot{display:block} }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen"></canvas></div>
<div id="rot">turn your phone sideways<br><span style="opacity:.6;font-size:12px">the village is a long road</span></div>
<script>
'use strict';
/* ============================================================
   PRETE SIMULATOR · PRETE SIMULATOR
   a side-scrolling Thai hungry-ghost tale

   You took what wasn't yours. You drank what wasn't offered.
   The ledger tipped, and you woke tall as the palms with a
   mouth the size of a needle's eye, wearing a torn sarong.

   Walk the village. Earn merit. Face what the dark keeps.
   ============================================================ */

const W = 480, H = 270;
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const smooth= (a,b,t)=> a+(b-a)*(1-Math.pow(1-clamp(t,0,1),3));
const dist  = (x1,y1,x2,y2)=> Math.hypot(x2-x1,y2-y1);
const rnd   = (a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const pick  = arr => arr[(Math.random()*arr.length)|0];
const sign  = v => v<0?-1:v>0?1:0;
const R = Math.round;
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function mkCv(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1,w|0); c.height=Math.max(1,h|0); return c; }
function G2(c){ const g=c.getContext('2d'); g.imageSmoothingEnabled=false; return g; }


/* ---------- palette: a Thai village at 2am ---------- */
const PAL = {
  night0:'#080a1e', night1:'#0e1330', night2:'#171d47', night3:'#232a5e',
  moon:'#f6f0dc', moonD:'#ddd4b8',
  lamp:'#ffc44d', lampD:'#e08a2e', lampGlow:'rgba(255,180,80,',
  gold:'#f2c14e', goldD:'#c9992f', goldL:'#ffe89a',
  red:'#c0392f', redD:'#7d211a', redL:'#e05a48',
  jade:'#3f8f5f', jadeL:'#6fc38a', jadeD:'#22563a',
  wood:'#7d5a3c', woodD:'#563c27', woodL:'#9c7551',
  bone:'#f2ecd8', boneD:'#cfc4a8',
  skin:'#d8a878', skinD:'#b3855a',
  pale:'#cdc8bc', paleD:'#9d9789', paleL:'#eae5d8',
  indigo:'#2c4a7c', indigoD:'#1b3054', indigoL:'#4a72ad',
  violet:'#7a4ad8', violetD:'#4a2a8c',
  ember:'#ff5c3c', emberD:'#c23a20',
  grass:'#2e5c40', grassD:'#1d3d2b', grassL:'#4a8259',
  dirt:'#6b543f', dirtD:'#4e3d2d', dirtL:'#8a6d51',
  water:'#1d3a52', waterL:'#2b5f80',
  ink:'#0a0814',
};

/* ---------- canvas ---------- */
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d', { alpha:false });
let SC = 3, VW = W, VH = H, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const aw = window.innerWidth, ah = window.innerHeight;
  const s = Math.min(aw/W, ah/H);
  SC = Math.max(1, s*DPR);
  cv.width = R(W*SC); cv.height = R(H*SC);
  cv.style.width = R(W*s)+'px'; cv.style.height = R(H*s)+'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,200));
resize();

/* ============================================================
   INPUT — keyboard + canvas-drawn touch controls
   ============================================================ */
const K = {};          // held
let PRESS = {};        // edge this frame
const KEYMAP = {
  arrowleft:'left', a:'left', arrowright:'right', d:'right',
  arrowup:'up', w:'up', arrowdown:'down', s:'down',
  ' ':'jump', z:'light', j:'light', x:'heavy', k:'heavy',
  c:'whistle', l:'whistle', shift:'block',
  e:'act', enter:'act', tab:'tree', t:'tree',
  h:'help', m:'mute', escape:'back', r:'restart', n:'newgame', g:'give', f:'give', q:'map', v:'lang',
};
function keyDown(k){ if(!K[k]) PRESS[k]=true; K[k]=true; }
function keyUp(k){ K[k]=false; }
window.addEventListener('keydown', ev=>{
  const k = KEYMAP[ev.key.toLowerCase()];
  if(!k) return;
  ev.preventDefault(); AU.ensure(); keyDown(k);
});
window.addEventListener('keyup', ev=>{
  const k = KEYMAP[ev.key.toLowerCase()];
  if(k){ ev.preventDefault(); keyUp(k); }
});
function press(k){ if(PRESS[k]){ PRESS[k]=false; return true; } return false; }
function anyPress(){ for(const k in PRESS) if(PRESS[k]) return true; return false; }
function clearPress(){ PRESS = {}; }

/* ============================================================
   TOUCH — tap the ground to walk there. Three buttons, no d-pad.
   ============================================================ */
const TOUCH = { on:false, pts:new Map(), aim:{x:0,y:0,active:false} };
const TAP = { x:0, y:0 };            // where the last tap landed, in screen space
/* a standing walk order: the prete walks to tx and interacts on arrival */
const NAV = { on:false, tx:0, fire:0, t:0 };
function navTo(worldX){ NAV.on=true; NAV.tx=worldX; NAV.t=0; NAV.fire=0; }
function navStop(){ NAV.on=false; NAV.fire=0; }
function navTake(){ if(NAV.fire){ NAV.fire=0; return true; } return false; }

const TPADS = [];  // filled after UI layout
function tLayout(){
  TPADS.length = 0;
  const bs = 34, m = 11;
  TPADS.push({id:'tree',   x:m+bs*0.5,      y:H-m-bs*0.5, r:bs*0.58, key:'tree',   ic:'book'});
  TPADS.push({id:'whistle',x:W-m-bs*1.75,   y:H-m-bs*0.5, r:bs*0.58, key:'whistle',ic:'call'});
  TPADS.push({id:'give',   x:W-m-bs*0.5,    y:H-m-bs*0.5, r:bs*0.62, key:'give',   ic:'heart'});
}
tLayout();
function cvPos(ev){
  const r = cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)/r.width*W, y:(ev.clientY-r.top)/r.height*H };
}
/* in play the world takes taps as walk orders; everywhere else a tap is "go on" */
function tapIsWalk(){
  /* While the first beat has hold of you there is nowhere to walk to and the
     tap means "pull" — routing it to a walk order left the opening with no
     working control at all on a touch screen. */
  return typeof GS!=='undefined' && GS.state==='play' && !DLG
      && typeof VIG!=='undefined' && !VIG && !(typeof P!=='undefined' && P && P.act)
      && !CH.lock;
}
/* screens where the two halves of the display mean left and right */
function tapSides(){
  if(typeof GS==='undefined' || DLG) return false;
  switch(GS.state){
    case 'act':    return !!ACT && ACT.phase==='do' && (ACT.k.t==='rhythm' || ACT.k.t==='place');
    case 'give':   return true;
    case 'shop':   return false;
    case 'ascend': return !!ASC && ASC.phase==='climb';
    case 'memory': return MEMS[memI].id==='scale';
    default:       return false;
  }
}
cv.addEventListener('pointerdown', ev=>{
  ev.preventDefault(); AU.ensure();
  if(ev.pointerType==='touch') TOUCH.on = true;
  const p = cvPos(ev);
  TOUCH.aim.x=p.x; TOUCH.aim.y=p.y; TOUCH.aim.active=true;
  TAP.x=p.x; TAP.y=p.y;
  let hit = null;
  if(TOUCH.on && uiShowsPads()){
    for(const t of TPADS) if(dist(p.x,p.y,t.x,t.y) < t.r+8){ hit=t; break; }
  }
  if(hit){ TOUCH.pts.set(ev.pointerId, hit.key); keyDown(hit.key); }
  /* an icon over something in reach beats a walk order: it is the only way to
     pick out the one you meant when three things are standing on the same spot */
  else if(typeof spotHit==='function' && spotHit(p.x,p.y)){ TOUCH.pts.set(ev.pointerId,'@spot'); }
  else if(tapIsWalk()){
    TOUCH.pts.set(ev.pointerId, '@nav');
    navTo(clamp(p.x + GS.camX, 16, WORLD_W-16));
  }
  else {
    // outside play a tap means "go on"; where a screen needs two sides,
    // the outer thirds stand in for left and right
    let k='act';
    if(tapSides()){ if(p.x < W*0.30) k='left'; else if(p.x > W*0.70) k='right'; }
    TOUCH.pts.set(ev.pointerId, k==='act'? '@tap' : k);
    keyDown(k); if(k==='act') PRESS.tap=true;
  }
  try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
});
cv.addEventListener('pointermove', ev=>{
  const p = cvPos(ev);
  TOUCH.aim.x=p.x; TOUCH.aim.y=p.y;
  const cur = TOUCH.pts.get(ev.pointerId);
  if(cur==='@nav' && tapIsWalk()){ TAP.x=p.x; TAP.y=p.y;   // drag to redirect the walk
    navTo(clamp(p.x + GS.camX, 16, WORLD_W-16)); return; }
  if(!cur || cur==='@tap') return;
  let hit=null;
  for(const t of TPADS) if(dist(p.x,p.y,t.x,t.y) < t.r+8){ hit=t; break; }
  if(hit && hit.key!==cur){ keyUp(cur); TOUCH.pts.set(ev.pointerId, hit.key); keyDown(hit.key); }
});
function endPt(ev){
  const cur = TOUCH.pts.get(ev.pointerId);
  if(cur==='@tap') keyUp('act');          // a held tap must let go of E
  else if(cur && cur!=='@nav') keyUp(cur);
  TOUCH.pts.delete(ev.pointerId);
  if(TOUCH.pts.size===0) TOUCH.aim.active=false;
}
cv.addEventListener('pointerup', e=>{ e.preventDefault(); endPt(e); });
cv.addEventListener('pointercancel', e=>endPt(e));
cv.addEventListener('contextmenu', e=>e.preventDefault());

/* ============================================================
   AUDIO — a whole Thai night, synthesized
   ============================================================ */
const AU = {
  ctx:null, out:null, mus:null, muted:false,
  nextCricket:0, nextPluck:2, nextFrog:5, pads:[],
  ensure(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.out = this.ctx.createGain(); this.out.gain.value = this.muted?0:0.5;
      const cmp = this.ctx.createDynamicsCompressor();
      cmp.threshold.value=-16; cmp.ratio.value=6;
      this.out.connect(cmp); cmp.connect(this.ctx.destination);
      this.mus = this.ctx.createGain(); this.mus.gain.value=0.85; this.mus.connect(this.out);
      this.startPad();
    }catch(e){}
  },
  setMute(m){ this.muted=m; if(this.out) this.out.gain.value=m?0:0.5; },
  toggle(){ this.setMute(!this.muted); saveGame(); },
  startPad(){
    for(const f of [82.4, 123.5]){
      const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type='triangle'; o.frequency.value=f; o.detune.value=rnd(-7,7);
      g.gain.value=0.02;
      const lfo=this.ctx.createOscillator(), lg=this.ctx.createGain();
      lfo.frequency.value=rnd(0.04,0.1); lg.gain.value=0.008;
      lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(this.mus); o.start(); lfo.start();
      this.pads.push({o,g});
    }
  },
  env(g,t0,a,d,pk){ g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(pk,t0+a); g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d); },
  tone(f,dur,type='sine',pk=0.05,slide=null,when=0,dest=null){
    if(!this.ctx||this.muted) return;
    const t0=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(24,slide), t0+dur);
    this.env(g,t0,0.008,dur,pk);
    o.connect(g); g.connect(dest||this.out); o.start(t0); o.stop(t0+dur+0.1);
  },
  noise(dur,pk=0.05,hp=0,lp=9000,when=0){
    if(!this.ctx||this.muted) return;
    const t0=this.ctx.currentTime+when;
    const len=Math.max(1,(dur*this.ctx.sampleRate)|0);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const n=this.ctx.createBufferSource(); n.buffer=buf;
    const f1=this.ctx.createBiquadFilter(); f1.type='lowpass'; f1.frequency.value=lp;
    const f2=this.ctx.createBiquadFilter(); f2.type='highpass'; f2.frequency.value=hp;
    const g=this.ctx.createGain(); this.env(g,t0,0.006,dur,pk);
    n.connect(f1); f1.connect(f2); f2.connect(g); g.connect(this.out); n.start(t0);
  },
  // ranat ek — the Thai xylophone, pentatonic
  ranat(f,when=0,pk=0.05){
    this.tone(f,0.9,'triangle',pk,null,when);
    this.tone(f*2.01,0.4,'sine',pk*0.35,null,when);
    this.tone(f*3.02,0.2,'sine',pk*0.15,null,when);
  },
  gong(f=98,when=0,pk=0.09){
    this.tone(f,3.2,'sine',pk,null,when);
    this.tone(f*1.48,2.6,'sine',pk*0.4,null,when+0.01);
    this.tone(f*2.37,1.8,'sine',pk*0.2,null,when+0.02);
    this.noise(0.14,pk*0.5,300,3000,when);
  },
  drum(when=0,pk=0.1){ this.tone(88,0.28,'sine',pk,44,when); this.noise(0.07,pk*0.5,120,1800,when); },
  tick(dt){
    if(!this.ctx||this.muted) return;
    if((this.nextCricket-=dt)<=0){
      const f=rnd(4000,4800);
      for(let i=0;i<3;i++) this.tone(f,0.05,'triangle',0.008,null,i*0.085);
      this.nextCricket = rnd(0.8,2.4);
    }
    if((this.nextFrog-=dt)<=0){ this.tone(rnd(150,230),0.16,'sawtooth',0.012,null,0); this.nextFrog=rnd(4,11); }
    if((this.nextPluck-=dt)<=0){
      const sc=[220,261.6,293.7,349.2,392,440,523.3];
      this.ranat(pick(sc),0,0.028);
      if(Math.random()<0.3) this.ranat(pick(sc),0.28,0.018);
      this.nextPluck = rnd(4,9);
    }
  },
  blip(){ this.tone(420,0.04,'square',0.018); },
  sel(){ this.tone(620,0.06,'square',0.022); this.tone(930,0.05,'square',0.012,null,0.04); },
  ding(){ this.ranat(880,0,0.05); this.ranat(1320,0.06,0.025); },
  bigDing(){ this.gong(131,0,0.08); [523,659,784,1047].forEach((f,i)=>this.ranat(f,i*0.1,0.05)); },
  orb(){ this.tone(rnd(1100,1500),0.2,'sine',0.026); },
  wail(){ this.tone(1900,0.85,'sine',0.05,880); this.tone(1915,0.85,'sine',0.028,890,0.02); this.noise(0.5,0.012,2000,6000); },
  step(hard){ this.noise(hard?0.06:0.04, hard?0.03:0.016, 90, hard?900:600); },
  land(){ this.noise(0.13,0.05,60,700); this.tone(90,0.13,'sine',0.04,50); },
  jump(){ this.tone(300,0.11,'sine',0.03,520); this.noise(0.05,0.012,200,1400); },
  hit(heavy){ this.noise(heavy?0.16:0.09, heavy?0.11:0.06, heavy?60:200, heavy?2400:4200); this.tone(heavy?70:150,heavy?0.2:0.1,'square',heavy?0.06:0.03,heavy?40:90); },
  block(){ this.noise(0.09,0.05,700,4000); this.tone(320,0.09,'square',0.03,240); },
  whiff(){ this.noise(0.1,0.022,900,5200); },
  spark(){ this.noise(0.07,0.045,1400,8000); },
  fix(){ this.ranat(523,0,0.05); this.ranat(784,0.11,0.05); this.ranat(1047,0.22,0.04); },
  meow(){ this.tone(780,0.15,'sine',0.045,610); this.tone(640,0.2,'sine',0.04,780,0.15); },
  purr(){ this.noise(0.4,0.02,50,280); },
  pour(){ this.noise(1.5,0.02,380,2200); },
  chant(){ this.tone(147,1.8,'sine',0.032,140); this.tone(220,1.8,'sine',0.016,214,0.1); },
  poof(){ this.noise(0.32,0.05,70,900); this.tone(150,0.3,'sine',0.04,55); },
  ghostCry(){ this.tone(rnd(500,700),0.6,'sawtooth',0.035,rnd(180,260)); this.noise(0.4,0.02,300,2200); },
  fightStart(){ this.gong(98,0,0.11); this.drum(0.35,0.09); this.drum(0.55,0.09); this.drum(0.75,0.11); },
  victory(){ [392,523,659,784,1047].forEach((f,i)=>this.ranat(f,i*0.13,0.055)); this.gong(131,0.4,0.07); },
  metta(){ [523,587,659,784,880,1047,1319].forEach((f,i)=>this.ranat(f,i*0.14,0.05)); this.gong(196,0,0.08); },
  unlock(){ this.ranat(659,0,0.05); this.ranat(988,0.09,0.045); this.gong(262,0.05,0.04); },
};

/* ============================================================
   SAVE
   ============================================================ */
const SAVE_KEY = 'prete-sim-v2';
function loadSaveRaw(){
  try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); return (s&&s.v===2)?s:null; }catch(e){ return null; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
/* ============================================================
   PIXEL PRIMITIVES — every shape lands on a whole pixel
   ============================================================ */
function hx(h){ h=h.replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgb(r,g,b){ return '#'+((1<<24)+(R(clamp(r,0,255))<<16)+(R(clamp(g,0,255))<<8)+R(clamp(b,0,255))).toString(16).slice(1); }
const _shadeCache = new Map();
function shade(h,a){
  const k=h+'|'+a.toFixed(3);
  let v=_shadeCache.get(k);
  if(v) return v;
  const c=hx(h);
  v = a>=0 ? rgb(lerp(c[0],255,a),lerp(c[1],255,a),lerp(c[2],255,a))
           : rgb(lerp(c[0],8,-a),lerp(c[1],6,-a),lerp(c[2],20,-a));
  _shadeCache.set(k,v); return v;
}
function mix(h1,h2,t){ const a=hx(h1),b=hx(h2); return rgb(lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)); }
function rgba(h,a){ const c=hx(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

function pR(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(R(x),R(y),Math.max(1,R(w)),Math.max(1,R(h))); }
function pEll(g,cx,cy,rx,ry,c){
  g.fillStyle=c; cx=R(cx); cy=R(cy); rx=Math.max(0.5,rx); ry=Math.max(0.5,ry);
  for(let y=-Math.ceil(ry); y<=Math.ceil(ry); y++){
    const t=1-(y*y)/(ry*ry); if(t<0) continue;
    const w=Math.floor(rx*Math.sqrt(t));
    g.fillRect(cx-w, cy+y, w*2+1, 1);
  }
}
function pCirc(g,cx,cy,r,c){ pEll(g,cx,cy,r,r,c); }
function pLimb(g,x1,y1,x2,y2,w,c){
  g.fillStyle=c;
  const d=Math.hypot(x2-x1,y2-y1), n=Math.max(1,Math.ceil(d/Math.max(0.6,w*0.34)));
  const h=w/2;
  for(let i=0;i<=n;i++){ const t=i/n; g.fillRect(R(lerp(x1,x2,t)-h), R(lerp(y1,y2,t)-h), Math.max(1,R(w)), Math.max(1,R(w))); }
}
function pTaper(g,x1,y1,x2,y2,w1,w2,c){
  g.fillStyle=c;
  const d=Math.hypot(x2-x1,y2-y1), n=Math.max(1,Math.ceil(d/0.6));
  for(let i=0;i<=n;i++){ const t=i/n, w=lerp(w1,w2,t);
    g.fillRect(R(lerp(x1,x2,t)-w/2), R(lerp(y1,y2,t)-w/2), Math.max(1,R(w)), Math.max(1,R(w))); }
}
function pTri(g,ax,ay,bx,by,cx2,cy2,c){
  g.fillStyle=c;
  const miny=Math.floor(Math.min(ay,by,cy2)), maxy=Math.ceil(Math.max(ay,by,cy2));
  const edges=[[ax,ay,bx,by],[bx,by,cx2,cy2],[cx2,cy2,ax,ay]];
  for(let y=miny;y<=maxy;y++){
    let xs=[];
    for(const [x1,y1,x2,y2] of edges){
      if((y1<=y&&y2>y)||(y2<=y&&y1>y)) xs.push(x1+(y-y1)/(y2-y1)*(x2-x1));
    }
    if(xs.length>=2){ xs.sort((p,q)=>p-q); g.fillRect(R(xs[0]), y, Math.max(1,R(xs[xs.length-1]-xs[0])), 1); }
  }
}
/* vertical dithered gradient — the trick that makes skies feel hand-made */
function pVGrad(g,x,y,w,h,c1,c2,steps=10){
  for(let i=0;i<steps;i++){
    const t=i/(steps-1), yy=y+h*i/steps, hh=Math.ceil(h/steps)+1;
    pR(g,x,yy,w,hh, mix(c1,c2,t));
    if(i<steps-1){ // dither band
      g.fillStyle=mix(c1,c2,(i+1)/(steps-1));
      for(let px=0;px<w;px+=2) g.fillRect(R(x+px+(i%2)), R(yy+hh-2), 1, 1);
      for(let px=0;px<w;px+=4) g.fillRect(R(x+px+((i+1)%4)), R(yy+hh-3), 1, 1);
    }
  }
}
function speck(g,x,y,w,h,cols,n,r){
  for(let i=0;i<n;i++){ g.fillStyle=cols[(r()*cols.length)|0]; g.fillRect(R(x+r()*w),R(y+r()*h),r()<0.25?2:1,1); }
}

/* pick the font and the whole-number scale for a requested size */
function fontPick(size){
  if(size<=6)  return {f:F3, w:F3W, h:F3H, s:1, gap:1};
  if(size<=12) return {f:F5, w:F5W, h:F5H, s:1, gap:1};
  const s=Math.max(2,Math.round(size/7));
  return {f:F5, w:F5W, h:F5H, s, gap:s};

function glyph(F,ch){
  const gl=F[ch];
  if(gl) return gl;
  if(F===F3){ const u=F3[ch.toUpperCase()]; if(u) return u; }
  return F['?']||F[' '];

/* Split a string into runs of Thai and runs of everything else.

   แผ่นไม้", a price with a number in front of it — and handing the whole
   line to the Thai face drew the DIGITS in the Thai face too, so a number
   in a Thai sentence looked nothing like the same number on the plaque
   beside it. Each run now goes to the face that owns it. */
function txtRuns(s){
  const out=[];
  let cur='', curThai=null;
  for(const ch of s){
    const t = THAI_RE.test(ch);
    if(curThai===null){ curThai=t; cur=ch; }
    else if(t===curThai) cur+=ch;
    else { out.push({th:curThai, s:cur}); curThai=t; cur=ch; }
  }
  if(cur) out.push({th:curThai, s:cur});
  return out;

/* width in pixels of a string at a given size */
function txtW(s,size=7){
  s=String(s);
  if(!s.length) return 0;
  if(!THAI_RE.test(s)) return latinW(s,size);
  const runs=txtRuns(s);
  if(runs.length===1) return thaiMeasure(s,size);
  let w=0;
  for(const r of runs) w += r.th? thaiMeasure(r.s,size) : latinW(r.s,size)+1;

function txtSprite(s,size,col,shadow){

    if(col[0]==='#'){ const c2=hx(col); r=c2[0]; g2=c2[1]; b=c2[2]; }
    else { const m=col.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/); if(m){ r=+m[1]; g2=+m[2]; b=+m[3]; } }
  }catch(e){}
  // only genuinely pale ink gets a shadow. at 128 the mid browns on a parchment
  // panel picked one up too, and it read as a line struck through the text.
  v=(r*0.299+g2*0.587+b*0.114)>175;

}
/* ============================================================
   THAI — the hand-drawn 5x7 face has no Thai in it, and Thai is not a
   font you can fake at that size: it stacks vowels above and below the
   consonant and the marks have to land in the right place. So Thai is
   rasterised once from whatever Thai face the device already has, then
   thresholded to 1-bit and cached, which drops it onto the same pixel
   grid as everything else. No network, no webfont, no combining logic
   of our own to get wrong.
   ============================================================ */
/* The pixel height Thai is drawn at, per requested size. It used to be a
   third taller than this, which is why every Thai label in the ledger ran
   into the column beside it: the layouts are measured for a 5x7 Latin cell
   and Thai has to sit in the same box. */
/* Thai needs more pixels than Latin for the same apparent size. These are
   the numbers a sweep at the real in-game scale picked, and they are also
   the largest the panels can take: a pixel more everywhere reads slightly
   better in isolation and overflows half the UI, which is worse. */
function thaiPx(size){ return size<=6?10 : size<=7?11 : size<=9?13 : size<=13?16 : Math.round(size*1.35); }
/* How far apart to set two wrapped lines. Latin at seven wants ten; Thai at
   seven is eleven pixels tall before the tone marks go on top of it, so ten
   makes the vowels of one line sit inside the consonants of the next. Every
   multi-line block in the game asks this rather than assuming. */
function lineStep(size){ return LANG==='th'? thaiPx(size)+2 : size+3; }

/* Does this device have Thai at all? A machine with no Thai face renders
   every Thai codepoint as the same tofu box, and switching the game into a
   language of identical rectangles is worse than not offering it. So compare
   a real Thai letter against a private-use codepoint nothing maps: if they
   come out pixel-identical, we are looking at tofu. */
let _thaiOK = null;
function thaiOK(){
  if(_thaiOK!==null) return _thaiOK;
  try{
    const ink=(ch)=>{
      const c=mkCv(24,24), g=c.getContext('2d');
      g.font='16px '+_thaiFace; g.textBaseline='alphabetic'; g.fillStyle='#fff';
      g.fillText(ch,2,18);
      const d=g.getImageData(0,0,24,24).data;
      let n=0, sig=0;
      for(let k=3;k<d.length;k+=4) if(d[k]>80){ n++; sig=(sig*31 + (k>>2))|0; }
      return n? n+'|'+sig : '0';
    };
    const thai=ink('ก'), tofu=ink('\uE000'), blank=ink('\u200B');
    _thaiOK = thai!=='0' && thai!==tofu && thai!==blank;
  }catch(e){ _thaiOK=true; }   // if we cannot tell, assume it is there
  return _thaiOK;
}

const _thai=new Map();
let _thMeasure=null;
function thaiMeasure(s,size){
  if(!_thMeasure) _thMeasure=mkCv(8,8).getContext('2d');
  _thMeasure.font=thaiPx(size)+'px '+_thaiFace;
  return Math.ceil(_thMeasure.measureText(s).width);
}
/* ---------- Thai, rasterised to one bit properly ----------
   The old pass drew Thai at the target size and kept any pixel over an
   alpha of 110, which is thresholding an anti-aliased image: thin strokes
   and tone marks came out broken and everything looked soft next to the
   hand-drawn Latin.

   This draws it three times oversized and then asks, for each real pixel,
   how much of it the glyph actually covers — supersampled 1-bit
   downsampling. Same pixel grid as the rest of the type, and the tone marks
   survive.  */
/* Four samples per pixel and a low coverage bar: Thai is full of one-stroke
   detail — the little head-loops, the tone marks — and at a 0.40 bar those
   were the first things to disappear, which is what made it look broken. */
const THAI_SS = 4, THAI_COV = 0.31;
function thaiSprite(s,size,col,shadow){
  const key='T|'+s+'|'+size+'|'+col+'|'+(shadow||'');
  let c=_thai.get(key);
  if(c){ _thai.delete(key); _thai.set(key,c); return c; }
  const px=thaiPx(size), SS=THAI_SS;
  const w=Math.max(1,thaiMeasure(s,size)), h=px+px;
  const bw=(w+2)*SS, bh=h*SS;
  const src=mkCv(bw,bh), sg=src.getContext('2d');
  sg.font=(px*SS)+'px '+_thaiFace; sg.textBaseline='alphabetic'; sg.fillStyle='#fff';
  sg.fillText(s, SS, Math.round(px*1.32)*SS);
  const d=sg.getImageData(0,0,bw,bh).data;
  const need=THAI_COV*SS*SS;
  c=mkCv(w+2+(shadow?1:0), h+(shadow?1:0));
  const g=G2(c);
  /* one pass over the big bitmap into a coverage count per output pixel,
     then two stamps of the same mask for the shadow and the ink */
  const on=new Uint8Array((w+2)*h);
  for(let y=0;y<h;y++) for(let x=0;x<w+2;x++){
    let cov=0;
    for(let sy=0;sy<SS;sy++){
      const row=(y*SS+sy)*bw;
      for(let sx=0;sx<SS;sx++){
        const px2=x*SS+sx;
        if(px2<bw && d[(row+px2)*4+3]>90) cov++;
      }
    }
    if(cov>=need) on[y*(w+2)+x]=1;
  }
  const stamp=(cc,ox,oy)=>{ g.fillStyle=cc;
    for(let y=0;y<h;y++) for(let x=0;x<w+2;x++) if(on[y*(w+2)+x]) g.fillRect(x+ox,y+oy,1,1); };
  if(shadow) stamp(shadow,1,1);
  stamp(col,0,0);
  c._base=Math.round(px*1.32);            // where the baseline sits inside the sprite
  _thai.set(key,c);
  while(_thai.size>320) _thai.delete(_thai.keys().next().value);
  return c;
}
/* x,y is the LEFT BASELINE, as it always was */
function pTxt(g,s,x,y,col,size=7,align='left',bold){
  s=L(String(s));
  if(!s.length) return;
  const w=txtW(s,size);
  let dx = align==='center'? -w/2 : align==='right'? -w : 0;
  const sh = isLight(col)?'rgba(8,6,18,0.8)':null;
  const P=fontPick(size);
  if(!THAI_RE.test(s)){
    // baseline sits one pixel-row above the bottom of the cell
    g.drawImage(txtSprite(s,size,col,sh), R(x+dx), R(y-P.h*P.s));
    return;
  }
  const runs=txtRuns(s);
  if(runs.length===1){
    const c=thaiSprite(s,size,col,sh);
    g.drawImage(c, R(x+dx), R(y-c._base));
    return;
  }
  // mixed: each run to the face that owns it, all on the one baseline
  let cx=x+dx;
  for(const r of runs){
    if(r.th){
      const c=thaiSprite(r.s,size,col,sh);
      g.drawImage(c, R(cx), R(y-c._base));
      cx += thaiMeasure(r.s,size);
    } else {
      g.drawImage(txtSprite(r.s,size,col,sh), R(cx), R(y-P.h*P.s));
      cx += latinW(r.s,size)+1;
    }
  }
}
function wrap(g,s,maxW,size){
  s=L(String(s));
  /* Thai is written without spaces inside a word, so a long Thai run has to
     be broken by character. But the Thai in this game uses spaces between
     PHRASES, and breaking by character regardless split those phrases in
     half — "และคำขอบคุณ ต / ามลำดับนี้". So: break on the spaces first, and
     only chop a chunk by character when that one chunk is itself too wide. */
  if(isThai(s) && txtW(s,size)>maxW){
    const out=[]; let cur='';
    const flush=()=>{ if(cur){ out.push(cur); cur=''; } };
    for(const chunk of s.split(' ')){
      if(!chunk) continue;
      const withChunk = cur? cur+' '+chunk : chunk;
      if(txtW(withChunk,size)<=maxW){ cur=withChunk; continue; }
      flush();
      if(txtW(chunk,size)<=maxW){ cur=chunk; continue; }
      // one phrase wider than the line: now character breaking is the only way
      let part='';
      for(const ch of chunk){
        const t=part+ch;
        if(txtW(t,size)>maxW && part){ out.push(part); part=ch; } else part=t;
      }
      cur=part;
    }
    flush();
    return out;
  }
  const words=s.split(' '), out=[]; let cur='';
  for(const w2 of words){ const t=cur?cur+' '+w2:w2;
    if(txtW(t,size)>maxW && cur){ out.push(cur); cur=w2; } else cur=t; }
  if(cur) out.push(cur);
  return out;
}

function L(s){
  if(LANG!=='th') return s;
  const t=TH[s];
  return t===undefined? s : t;
}
function setLang(l){
  /* A device with no Thai face renders every Thai codepoint as the same
     rectangle, and a language of identical rectangles is worse than no
     translation. So the switch simply refuses on such a device and says why. */
  if(l==='th' && typeof thaiOK==='function' && !thaiOK()){
    if(typeof toast==='function') toast('this device has no Thai font','#c8888a');
    LANG='en';
  } else LANG=l;
  try{ localStorage.setItem('prete-lang',LANG); }catch(e){}
  if(typeof _txt!=='undefined') _txt.clear();
}
function toggleLang(){ setLang(LANG==='en'?'th':'en'); }

  pR(g,6,9,4,52,'#7d5a3c'); pR(g,102,9,4,52,'#7d5a3c');
  // work bench
  pR(g,4,58,104,7,'#8a6142'); pR(g,4,58,104,2,'#a97f56'); pR(g,4,64,104,2,'#5f4029');
  pR(g,10,65,5,18,'#6d4a33'); pR(g,97,65,5,18,'#6d4a33');

  pR(g,18,40,26,19,'#a8633a'); pR(g,18,40,26,2,'#c47c4c'); pR(g,40,40,4,19,'#7d4426');
  pR(g,20,44,22,3,'#5c3220');
  for(let i=0;i<4;i++) pR(g,22+i*5,52,3,7,'#7d4426');
  // wok on top
  pEll(g,31,38,17,6,'#4a4a52'); pEll(g,31,36,15,5,'#6a6a74'); pEll(g,31,35,12,3,'#3a3a42');
  pR(g,46,36,9,2,'#5a5a64');
  // mortar and pestle, for pounding papaya salad
  pR(g,60,46,15,13,'#7a8088'); pR(g,60,46,15,2,'#9aa0aa'); pEll(g,67,46,8,3,'#4a5058');
  pTaper(g,72,44,78,28,4,3,'#8a6f52'); pEll(g,78,27,3,3,'#a3865f');
  // chopping block with greens
  pEll(g,90,52,11,7,'#8a6142'); pEll(g,90,50,10,5,'#a97f56');
  pR(g,85,46,5,3,PAL.jade); pR(g,91,45,4,3,PAL.jadeL); pR(g,95,47,4,3,'#c0392f');
  // hanging pots and a bundle of chillies
  pR(g,52,10,1,9,'#4a4a52'); pEll(g,52,22,6,5,'#6a6a74'); pEll(g,52,20,5,3,'#3a3a42');
  for(let i=0;i<5;i++) pTaper(g,84+i*2,11,82+i*2.4,20+ (i%2)*3,3,1, i%2?'#c0392f':'#d8483a');

  pEll(g,26,74,11,7,'#c9a86a'); pEll(g,26,71,10,4,'#e0c184'); pEll(g,26,70,7,2,'#f2ecd8');

  return c;

/* a night-market stall — colour on the road */
function artStall(seed){
  const r=mulberry(seed), c=mkCv(96,74), g=G2(c);
  const A=[['#c0392f','#e8dfc8'],['#2f6a8f','#f2e6c8'],['#3f8f5f','#f6f0dc']][seed%3];
  pR(g,8,58,80,10,'#8a6142'); pR(g,8,58,80,2,'#a97f56'); pR(g,8,66,80,2,'#5f4029');
  pR(g,12,68,5,6,'#5f4029'); pR(g,79,68,5,6,'#5f4029');
  pR(g,6,20,4,40,'#6d5138'); pR(g,86,20,4,40,'#6d5138');
  for(let i=0;i<8;i++) pR(g,4+i*11,12,11,9, i%2?A[0]:A[1]);
  pR(g,2,10,92,3, shade(A[0],-0.25));
  pR(g,2,21,92,2, shade(A[0],-0.25));
  // scalloped valance
  for(let i=0;i<11;i++) pEll(g,6+i*8,23,4,3, i%2?A[0]:A[1]);
  // goods on the counter
  for(let i=0;i<5;i++){
    const gx=16+i*15, kind=(r()*3)|0;
    if(kind===0){ pEll(g,gx,54,6,4,'#f5ead8'); pEll(g,gx,52,5,3,pick(['#e8b13c','#c0392f','#3f8f5f'])); }
    else if(kind===1){ for(let k=0;k<3;k++) pEll(g,gx-2+k*2,52-k*2,4,3,'#e8c15c'); }
    else { pR(g,gx-4,48,8,10,'#d8b04a'); pR(g,gx-4,48,8,2,'#f0d074'); }
  }
  // a lamp on a wire
  pR(g,48,22,1,8,'#3a3630'); pEll(g,48,33,6,7,'#ffd98a'); pEll(g,48,32,4,5,'#fff3d0');
  return c;
}

/* flowering tree — the colour the village needed */
function artBlossom(seed, col){
  const r=mulberry(seed), w=150,h=150, c=mkCv(w,h), g=G2(c), cx=w/2;
  pTaper(g,cx,h,cx-5,h*0.46,17,9,'#5a4436');
  pTaper(g,cx-2,h,cx-9,h*0.56,7,3,'#6d5442');
  pTaper(g,cx,h-3,cx-20,h-1,9,3,'#5a4436');
  pTaper(g,cx,h-3,cx+19,h-1,9,3,'#4a382c');
  const nodes=[];
  for(const [dx,dy,len] of [[-1,-0.6,38],[1,-0.65,42],[-0.6,-0.95,34],[0.75,-1,32],[0.05,-1.2,28]]){
    const ex=cx-5+dx*len*1.4, ey=h*0.46+dy*len;
    pTaper(g,cx-4,h*0.48,ex,ey,8,3,'#4f3c2e'); nodes.push([ex,ey]);
    pTaper(g,ex,ey,ex+dx*14,ey-13,3,2,'#5a4436'); nodes.push([ex+dx*14,ey-13]);
  }
  // blossom masses
  for(let i=0;i<30;i++){
    const n=nodes[(r()*nodes.length)|0];
    const bx=n[0]+(r()-0.5)*44, by=n[1]+(r()-0.5)*34-8;
    pEll(g,bx,by,11+r()*8,9+r()*6, i%3? shade(col,-0.12):col);
  }
  for(let i=0;i<22;i++){
    const n=nodes[(r()*nodes.length)|0];
    pEll(g,n[0]+(r()-0.5)*38,n[1]-6+(r()-0.5)*28,7+r()*5,5+r()*4, shade(col,0.16));
  }
  // individual petals catching the light
  for(let i=0;i<220;i++){
    const bx=cx+(r()-0.5)*w*0.8, by=h*0.1+r()*h*0.44;
    g.fillStyle = r()<0.4? shade(col,0.32) : shade(col,0.08);
    g.fillRect(R(bx),R(by),1,1);
    if(r()<0.25) g.fillRect(R(bx+1),R(by),1,1);
  }
  for(let i=0;i<40;i++){ const bx=cx+(r()-0.5)*w*0.7, by=h*0.12+r()*h*0.4;
    g.fillStyle='#fff6e0'; g.fillRect(R(bx),R(by),1,1); }
  return c;
}

/* a chilli / herb garden patch you can pick from */
function artGarden(kind){
  const c=mkCv(52,40), g=G2(c);
  pEll(g,26,34,24,7,'#5a4030'); pEll(g,26,32,22,5,'#6b4e39');
  for(let i=0;i<5;i++){
    const x=7+i*9, hh=14+((i*7)%9);
    pTaper(g,x,34,x+((i%3)-1)*2,34-hh,3,2,'#3f7a52');
    for(let k=0;k<3;k++) pEll(g,x+((k%2)?3:-3),34-hh+k*5+3,4,2.6, k%2?PAL.jade:PAL.jadeL);
    if(kind==='chili'){ for(let k=0;k<2;k++) pTaper(g,x,34-hh+7+k*5,x+3,34-hh+12+k*5,3,1, k%2?'#c0392f':'#e0483a'); }
    if(kind==='lemongrass'){ for(let k=0;k<4;k++) pTaper(g,x,34,x-6+k*4,34-hh-5,3,1,'#7fa86a'); }
    if(kind==='lime'){ pEll(g,x+2,34-hh+8,4,4,'#8fbf4a'); pEll(g,x+1,34-hh+7,2,2,'#b3e06a'); }
  }
  return c;
}

/* ============================================================
   CLOUD UI — every panel in this game is a small cloud
   ============================================================ */
/* the whole interface is one wooden box, cut from the same plank */
const CL = {
  top:'#fdf2d8', body:'#f4e3bc', mid:'#e6cf9e', under:'#d8bd88', rim:'#fffaea',
  edge:'#3b2412', wood:'#8a5a2c', woodL:'#c9924e', woodD:'#5c3a1c',
  ink:'#3b2a18', ink2:'#7a5a38', ink3:'#a08054',
  gold:'#c9992f', goldL:'#f2c14e',
};
function mixSafe(a,b,t){ try{ return mix(a,b,t); }catch(e){ return a; } }
const _puffCache=new Map();
/* lobes around a flat core — few and chunky, so it reads as cloud not scallop */
function puffs(w,h,seed){
  const key=w+'x'+h+'|'+seed;
  let p=_puffCache.get(key);
  if(p) return p;
  const r=mulberry((seed||1)*7919+w*13+h*7);
  const base=clamp(h*0.62,6,15);
  const step=base*1.75;
  const top=[], bot=[], side=[];
  // rounded ends
  const er=clamp(h*0.52,5,13);
  side.push({y:h*0.5, r:er, dx:er*0.42});
  const n=Math.max(1,Math.round(w/step));
  for(let i=0;i<=n;i++){
    const t=i/n, rr=base*(0.72+r()*0.5);
    top.push({x:t*w, r:rr, dy:-rr*0.42});
  }
  const m=Math.max(1,Math.round(w/(step*1.25)));
  for(let i=0;i<=m;i++){
    const t=i/m, rr=base*(0.5+r()*0.34);
    bot.push({x:(1-t)*w, r:rr, dy:rr*0.34});
  }
  p={top,bot,side,base}; _puffCache.set(key,p); return p;
}
function cloudDraw(g,x,y,w,h,o={}){
  /* Stardew's box: a dark plank edge, a lit inner bevel, a parchment field.
     It stays exactly inside its rectangle — the old cloud lobes overhung by
     fifteen pixels on every side, which is what buried the game underneath. */
  const BG  = o.body || CL.body;
  const BGD = o.under|| shade(BG,-0.12);
  const F0  = o.edge || CL.edge;
  const F1  = o.wood || CL.woodL;
  const drop= o.drop===undefined?2:o.drop;
  if(w<6||h<6){ pR(g,x,y,w,h,F0); pR(g,x+1,y+1,w-2,h-2,BG); return; }
  if(drop){ g.save(); g.globalAlpha=(g.globalAlpha||1)*0.30;
    pR(g,x+1,y+drop,w-2,h-1,'#0b0814'); g.restore(); }
  // outer plank, corners notched a pixel so it reads as rounded
  pR(g,x,y+1,w,h-2,F0); pR(g,x+1,y,w-2,h,F0);
  // the lit bevel
  pR(g,x+1,y+2,w-2,h-4,F1); pR(g,x+2,y+1,w-4,h-2,F1);
  // the field
  pR(g,x+2,y+3,w-4,h-6,BG); pR(g,x+3,y+2,w-6,h-4,BG);
  pR(g,x+3,y+3,w-6,1,o.rim||shade(BG,0.30));
  pR(g,x+3,y+h-4,w-6,1,BGD);
  pR(g,x+2,y+h-3,w-4,1,CL.woodD);           // the frame's underside, in shadow
  if(o.acc) pR(g,x+3,y+h-5,w-6,1,o.acc);
}
/* a free-floating cartoon cloud, for skies */
function puffCloudDraw(g,cx,cy,w,h,seed,o={}){
  const r=mulberry((seed||3)*104729);
  const top=o.top||CL.top, body=o.body||CL.body, under=o.under||CL.under, edge=o.edge||CL.edge;
  const n=4+((r()*3)|0);
  const blobs=[];
  for(let i=0;i<n;i++){
    const t=n===1?0.5:i/(n-1);
    const rr=(h*0.5)*(0.62+Math.sin(t*Math.PI)*0.72);
    blobs.push({x:cx-w/2+t*w, y:cy-rr*0.34+ (r()-0.5)*h*0.22, r:rr});
  }
  const flat={x:cx,y:cy+h*0.16,w:w*0.92,h:h*0.42};
  const pass=(col,pad)=>{
    pR(g,flat.x-flat.w/2-pad,flat.y-flat.h/2-pad,flat.w+pad*2,flat.h+pad*2,col);
    for(const b of blobs) pEll(g,b.x,b.y,b.r+pad,b.r*0.92+pad,col);
  };
  pass(edge,1);
  pass(under,0);
  for(const b of blobs) pEll(g,b.x,b.y-b.r*0.12,b.r*0.92,b.r*0.8,body);
  for(const b of blobs) pEll(g,b.x-b.r*0.16,b.y-b.r*0.34,b.r*0.66,b.r*0.5,top);
  for(const b of blobs) pEll(g,b.x-b.r*0.3,b.y-b.r*0.5,b.r*0.34,b.r*0.22,o.rim||CL.rim);
}
/* clouds are expensive to scanline, so each distinct one is drawn once and reused */
const CPAD=4, _cloudSprite=new Map();
function cloudKey(w,h,o,extra){
  return (w|0)+'|'+(h|0)+'|'+(o.seed||0)+'|'+(o.top||'')+(o.body||'')+(o.under||'')+(o.edge||'')+(o.rim||'')+(o.acc||'')+'|'+(o.drop===undefined?2:o.drop)+'|'+(o.flat?'F':'')+extra;
}
function sprite(key, w, h, paint){
  let c=_cloudSprite.get(key);
  if(!c){
    if(_cloudSprite.size>240) _cloudSprite.clear();
    c=mkCv(w+CPAD*2, h+CPAD*2);
    paint(G2(c));
    _cloudSprite.set(key,c);
  }
  return c;
}
function cloud(g,x,y,w,h,o={}){
  if(w<=0||h<=0) return;
  const c=sprite(cloudKey(w,h,o,'p'), w, h, gg2=>cloudDraw(gg2,CPAD,CPAD,w,h,o));
  g.drawImage(c, R(x)-CPAD, R(y)-CPAD);
}
function puffCloud(g,cx,cy,w,h,seed,o={}){
  if(w<=0||h<=0) return;
  const c=sprite(cloudKey(w,h,Object.assign({seed},o),'f'), w, h,
    gg2=>puffCloudDraw(gg2, CPAD+w/2, CPAD+h/2, w, h, seed, o));
  g.drawImage(c, R(cx-w/2)-CPAD, R(cy-h/2)-CPAD);
}

/* cached radial glows — a gradient per lamp per frame was the whole budget */
const _glowSpr=new Map();
function glowSprite(col,r){
  const key=col+'|'+(r|0);
  let c=_glowSpr.get(key);
  if(!c){
    if(_glowSpr.size>120) _glowSpr.clear();
    const d=Math.max(2,(r|0)*2);
    c=mkCv(d,d);
    const g2=c.getContext('2d');
    const gr=g2.createRadialGradient(r,r,0,r,r,r);
    gr.addColorStop(0,rgba(col,1)); gr.addColorStop(0.45,rgba(col,0.42)); gr.addColorStop(1,rgba(col,0));
    g2.fillStyle=gr; g2.fillRect(0,0,d,d);
    _glowSpr.set(key,c);
  }
  return c;
}
function drawGlow(g,x,y,r,col,alpha){
  if(alpha<=0.003||r<1) return;
  const s=glowSprite(col,r);
  const a=g.globalAlpha;
  g.globalAlpha=a*clamp(alpha,0,1);
  g.drawImage(s, R(x-r), R(y-r));
  g.globalAlpha=a;
}

/* a small cloud tag for prompts */
function cloudTag(g,cx,cy,w,h,o={}){ cloud(g,cx-w/2,cy-h/2,w,h,o); }
/* speech cloud with a tail of little puffs */
function cloudBubble(g,cx,byTop,w,h,tailX,tailY,o={}){
  /* one wedge pointing at whoever is talking, clipped to a sane length */
  const bx=cx-w/2, by2=byTop+h;
  const tx=clamp(tailX, bx+8, bx+w-8), ty=Math.min(tailY, by2+11);
  const F0=o.edge||CL.edge, BG=o.body||CL.body;
  pTri(g, tx, ty, tx-6, by2-3, tx+6, by2-3, F0);
  pTri(g, tx, ty-2, tx-4, by2-4, tx+4, by2-4, BG);
  cloud(g,bx,byTop,w,h,o);
}

function drawDeva(g,kind,x,y,t,o={}){

  const SKD  = kind==='thorani'? '#d4b87e' : kind==='witsanu'? '#68a67c' : kind==='posop'? '#d6c088' : '#7fb094';
  const CLOTH= kind==='thorani'? '#c85a7a' : kind==='witsanu'? '#3f7ab8' : kind==='posop'? '#3f7a52' : '#c0392f';

    gr.addColorStop(0,`rgba(255,232,160,${0.14-i*0.035})`); gr.addColorStop(1,'rgba(255,232,160,0)');
    g.fillStyle=gr; g.fillRect(x-rr,yy-16-rr,rr*2,rr*2);

    pR(g,x+Math.cos(a)*rr, yy-16+Math.sin(a)*rr*0.92, 1,1, i%2?GOLDL:GOLD);
  }
  // lotus seat
  for(let i=0;i<7;i++){
    const a=Math.PI+ (i/6)*Math.PI;
    pEll(g,x+Math.cos(a)*11, yy+15+Math.sin(a)*3, 4,3, i%2?'#f0a8c0':'#e08aa8');
  }
  pEll(g,x,yy+14,12,4,'#f6c0d4'); pEll(g,x,yy+13,9,3,'#fbd8e4');

  // a wrapped skirt, pleated
  for(let i=0;i<=12;i++){
    const t2=i/12, ww=lerp(9,16,Math.pow(t2,0.8));
    pR(g,x-ww/2,yy+2+i,ww,1, t2>0.82? CLD : CLOTH);
    pR(g,x+ww/2-3,yy+2+i,3,1, CLD);
  }
  pEll(g,x,yy+14,8,2.4,CLD); pEll(g,x,yy+13,7,1.6,CLOTH);
  for(let i=0;i<4;i++){ const ww=lerp(9,16,0.5);
    pR(g,x-ww/2+2+i*3,yy+5,1,8, shade(CLOTH,-0.18)); }
  pR(g,x-5,yy+1,10,3,GOLD); pR(g,x-5,yy+1,10,1,GOLDL);
  pEll(g,x,yy+2,3,1.4,GOLDL);
  // torso
  oEll(g,x,yy-3,7.5,8,SKIN,SKD);
  pEll(g,x+3,yy-2,3.4,5.4,SKD);
  pEll(g,x-2.4,yy-6,2.4,1.6,shade(SKIN,0.2));
  // chest chains
  pTaper(g,x-6,yy-8,x+5,yy+3,3,2,GOLD);
  pTaper(g,x+6,yy-8,x-5,yy+3,3,2,GOLDD);
  pEll(g,x,yy-2,2.4,2.4,GOLDL);
  // shoulder pieces
  pTri(g,x-9,yy-13,x-12,yy-4,x-5,yy-6,GOLD);

  pR(g,x-11,yy-9,5,2,GOLDL); pR(g,x+6,yy-9,5,2,GOLDL);

  // arms + attribute
  if(kind==='thorani'){
    // wringing the long hair — water pours from it

    for(let i=0;i<16;i++){
      const tt=i/15;
      const hx=lerp(x+5,x+16,tt)+Math.sin(t*1.6+tt*4)*1.2;
      const hyy=lerp(yy-21,yy-9,tt);
      pEll(g,hx,hyy,3.2-tt*0.9,2.6-tt*0.7,'#1a1424');
      if(i%3===0) pEll(g,hx-0.8,hyy-0.8,1.2,0.9,'#332a48');

    pTaper(g,x-6,yy-7,x+11,yy-11,3.4,2.6,SKD);    // lower hand, twisting
    pEll(g,x+12,yy-11,2.4,2.2,SKD);
    // and the water comes out of it
    for(let i=0;i<10;i++){
      const tt=((i/10)+ (t*0.5))%1;

    pEll(g,x-12,yy-17,2.4,2.2,SKIN); pEll(g,x+12,yy-17,2.4,2.2,SKD);
    for(let i=0;i<11;i++){
      const a=-Math.PI*0.5 + (i/10-0.5)*1.5;
      const len=15+((i*7)%5);
      const ex=x+Math.cos(a)*len, ey=yy-19+Math.sin(a)*len*0.8;

      pTaper(g,ex,ey,ex+(i<5?-2.4:2.4),ey+3.6,2.6,1.2,'#e8cf62');
      for(let k=0;k<3;k++) pEll(g,ex+(i<5?-1:1)*(0.8+k*0.8),ey+1.4+k*1.3,1.3,1.05,'#f6e79a');
    }
    pR(g,x-3,yy-18,7,2,'#c0392f');
    // and a thread of grains falling out of it, because some always does
    for(let i=0;i<7;i++){
      const tt=((i/7)+(t*0.4))%1;
      pEll(g,x-6+Math.sin(t*3+i)*2, yy-12+tt*24, 1.2, 1, rgba('#f6e79a',0.9-tt*0.7));
    }
  } else {
    // Indra, palms together — a wai returned
    pTaper(g,x-6,yy-7,x-3,yy-14,3.4,2.6,SKIN);

  pEll(g,x,hy,7,7.4,SKIN);                        // face back on top of it

  pEll(g,x,hy-5.2,6,2.2,'#1a1424');               // a thin fringe, well above the eyes

  pEll(g,x-1.6,hy-0.4,1.5,1.7,'#2a2138'); pEll(g,x+2,hy-0.4,1.4,1.6,'#2a2138');
  pR(g,x-2,hy-1.2,1,1,'#fff'); pR(g,x+1.6,hy-1.2,1,1,'#fff');

function artSign(labels){
  const c=mkCv(64,74), g=G2(c);
  pR(g,29,10,6,64,'#7d5a3c'); pR(g,33,10,2,64,'#5f4029');
  pEll(g,32,73,9,3,'#4a3728');
  labels.forEach((L,i)=>{
    const y=12+i*15, dir=L.d, w=40;
    const x0 = dir>0? 30 : 34-w;
    pR(g,x0,y,w,12,'#b8935c'); pR(g,x0,y,w,2,'#d3b478'); pR(g,x0,y+10,w,2,'#8a6a3c');
    pTri(g, dir>0? x0+w+7:x0-7, y+6, dir>0?x0+w:x0, y, dir>0?x0+w:x0, y+12, '#b8935c');
    pR(g,dir>0?x0+w-1:x0,y,1,12,'#8a6a3c');
    for(let k=0;k<4;k++) pR(g,x0+5+k*8, y+4, 5,1,'#5f4a2c');
    pR(g,x0+5,y+7,w-14,1,'#5f4a2c');
  });
  return c;
}

  pEll(g,x-1.5*s,y-0.7*s,1.7*s,1.6*s,c);

  pR(g,x-0.5*s,y-3*s,s,6*s,c); pR(g,x-3*s,y-0.5*s,6*s,s,c);
  for(let i=1;i<=2;i++){ const d=i*s;
    pR(g,x-d,y-d,s,s,c); pR(g,x+d-s,y-d,s,s,c);
    pR(g,x-d,y+d-s,s,s,c); pR(g,x+d-s,y+d-s,s,s,c); }

function icoSun(g,x,y,s,c){

  for(let i=0;i<3;i++){ pR(g,x-2*s+i*s,y-s+i*s,s,s,c); pR(g,x+2*s-i*s,y-s+i*s,s,s,c); }

  for(let i=0;i<4;i++) pR(g,x+dir*(2*s-i*s),y-i*s,s,i*2*s+s,c);

/* the badge on a cosmetic row, by slot */
function cosBadge(g,slot,x,y,c){
  if(slot==='halo') icoSun(g,x,y,1,c);
  else if(slot==='garland') icoFlower(g,x,y,1,c);
  else if(slot==='beads') icoBeads(g,x,y,1.1,c);
  else if(slot==='sash') icoSash(g,x,y,1.2,c);
  else if(slot==='goldleaf') icoStar(g,x,y,1,c);
  else icoStar(g,x,y,1,c);
}

/* ============================================================
   TAP TARGETS — the draw pass records where things ended up, so a
   menu is tappable without any of the layout maths being repeated.
   ============================================================ */
const HITS=[];
function hitClear(){ HITS.length=0; }
function hitAdd(x,y,w,h,fn){ HITS.push({x,y,w,h,fn}); }
function hitTap(){
  if(!PRESS.tap) return false;
  for(let i=HITS.length-1;i>=0;i--){ const r=HITS[i];
    if(TAP.x>=r.x && TAP.x<=r.x+r.w && TAP.y>=r.y && TAP.y<=r.y+r.h){
      PRESS.tap=false; PRESS.act=false; r.fn(); return true; } }
  PRESS.tap=false; PRESS.act=false;   // a tap on empty page does nothing
  return false;
}
/* ============================================================
   THE WORLD — one long road through a village at 2am
   ============================================================ */
/* The map got another sixteen hundred pixels of country on the east end:
   proper forest, a stream with stones across it, and logs to walk along.
   Nothing lives out there but birds and the noise of them. */
const WORLD_W = 7200;
const GBASE = 216;

const ZONES = [
  {id:'charnel', a:0,    b:470,  name:'the graveyard', s:'graveyard'},
  {id:'roadside',a:470,  b:760,  name:'the roadside', s:'the roadside'},
  {id:'paddy',   a:760,  b:1480, name:'the rice fields', s:'the farm'},
  {id:'villageW',a:1480, b:2320, name:'the village road', s:'village'},
  {id:'centre',  a:2320, b:3000, name:'the spirit house', s:'shrine'},
  {id:'grove',   a:3000, b:3800, name:'the banana grove', el:1, s:'grove'},
  {id:'wat',     a:3800, b:4600, name:'the temple', s:'temple'},
  {id:'forest',  a:4600, b:5600, name:'the old forest', s:'old forest'},
  {id:'deep',    a:5600, b:WORLD_W, name:'the deep country', s:'deep forest'},
];
function zoneAt(x){ for(const z of ZONES) if(x>=z.a && x<z.b) return z; return ZONES[ZONES.length-1]; }
function band(x,a,b,f){ return clamp((x-a)/f,0,1) * clamp((b-x)/f,0,1); }

function groundY(x){
  let y = GBASE
    + Math.sin(x*0.00152)*8
    + Math.sin(x*0.0038+1.3)*3.4
    + Math.sin(x*0.00071+0.4)*6;
  // the village road is graded flat, as roads are
  const flat = band(x,1400,3060,180);
  y = lerp(y, GBASE+2, flat*0.92);
  // paddies sit low and wet
  const low = band(x,780,1460,150);
  y = lerp(y, GBASE+9, low*0.8);
  // the wat stands on its terrace
  const hi = band(x,3860,4560,170);
  y = lerp(y, GBASE-11, hi*0.9);
  // out east the country rolls, and dips into the stream bed
  const deep = clamp((x-5600)/260,0,1);
  y = lerp(y, y + Math.sin(x*0.0026)*11 - 6, deep);
  y = lerp(y, GBASE+14, band(x,6250,6410,90)*0.85);
  return y;
}
const isRoad = x => x>1380 && x<3120;

const BROKEN_LAMP = 3;                 // x 2060 — the dark stretch
const SHRINE_X = 2500, CART_X = 2790, TAMARIND_X = 2650;
const TANI_X = 3340, SALA_X = 4080, CHEDI_X = 4330;
const FALLEN_TREE_X = 1990, POND_X = 700;
const HOUSE_XS = [1560,1790,2160,2350,2720,2960];

/* There used to be a signpost at every crossroads: a post with two painted
   boards on it naming the place each way. Six of them, and every one was a
   slab of lettering standing in the middle of a village at two in the
   morning. They are gone. The place name fades in at the top of the screen
   when you walk into it, which is the same information without a board
   nailed across the view. */
const SIGNS = [];
const LIGHTS = [];   // {x,y,r,c,a,flick,on}
function addLight(x,y,r,c,a,o={}){ const l={x,y,r,c,a,on:true,flick:o.flick||0,id:o.id}; LIGHTS.push(l); return l; }

/* ---------- cached art: every tree is drawn once, then reused ---------- */
const ART = {};
function artPool(){
  ART.palm   = [3,17,29,41,53,67].map(artPalm);
  ART.banana = [11,23,37,51,65,79].map(artBanana);
  ART.tam    = [3,19,31,47].map(artTamarind);
  ART.bamboo = [4,13,26,39].map(artBamboo);
  ART.dead   = [5,15,25,35,45].map(artDeadTree);
  ART.house  = [7,38,69,100,131,162].map((s,i)=>artHouse(s, i%3===0));
  ART.jar    = artJar(); ART.fence = artFence(); ART.dog = artDog();
  ART.scare  = artScarecrow(); ART.offer = artOffering();
  ART.shrine = artSpiritHouse(); ART.chedi = artChedi(); ART.sala = artSala();
  ART.cart   = artCart();
  ART.lamp   = artLamp(false); ART.lampBroken = artLamp(true);
  ART.kitchen= artKitchen(); ART.rack = artRack(); ART.roadShrine = artRoadShrine();
  ART.stall  = [0,1,2].map(artStall);
  ART.blossom= [[7,'#e88fb0'],[19,'#f0a860'],[31,'#d8a0e0'],[43,'#f0c0c8']].map(a=>artBlossom(a[0],a[1]));
  ART.garden = {chili:artGarden('chili'), lemongrass:artGarden('lemongrass'), lime:artGarden('lime')};
}
const apick = (arr,i)=> arr[(i|0)%arr.length];

/* ---------- parallax layers ---------- */
const PX = { far:0.18, mid:0.42, bg:0.72 };
function layerW(p){ return Math.ceil(W + (WORLD_W-W)*p) + 8; }
const farCv = mkCv(layerW(PX.far), H), farG = G2(farCv);
const midCv = mkCv(layerW(PX.mid), H), midG = G2(midCv);
const bgCv  = mkCv(layerW(PX.bg),  H), bgG  = G2(bgCv);
const playCv= mkCv(WORLD_W, H),        playG= G2(playCv);

function paintFar(){
  const g=farG, w=farCv.width, r=mulberry(4242);
  // distant karst ridges — the shape of upcountry Thailand
  for(let L=0;L<3;L++){
    const baseY = 150+L*15, amp=26-L*7, col = mix('#4b6b8e','#7793ac', L*0.4);
    g.fillStyle=col;
    for(let x=0;x<w;x++){
      const h2 = baseY - (Math.sin(x*0.0042+L*2.1)*amp + Math.sin(x*0.0111+L)*amp*0.4 + Math.sin(x*0.0009)*13);
      g.fillRect(x, R(h2), 1, H-R(h2));
    }
    // ridge rim lit by the moon
    g.fillStyle = mix(col,'#b9cfdd',0.5);
    for(let x=0;x<w;x++){
      const h2 = baseY - (Math.sin(x*0.0042+L*2.1)*amp + Math.sin(x*0.0111+L)*amp*0.4 + Math.sin(x*0.0009)*13);
      if((x+L)%3!==0) g.fillRect(x, R(h2), 1, 1);
    }
  }
  // a far treeline blur
  g.fillStyle='#547a7e';
  for(let x=0;x<w;x+=2){
    const h2 = 178 + Math.sin(x*0.02)*3 + Math.sin(x*0.007)*5;
    pEll(g,x,h2,4+r()*4,4+r()*3,'#547a7e');
  }
}
function paintMid(){
  const g=midG, w=midCv.width, r=mulberry(9111);
  const sc = midCv.width/WORLD_W;
  // silhouetted rooftops and palms, one layer back from the road
  for(let i=0;i<64;i++){
    const x = r()*w, base = 190 + r()*8;
    if(r()<0.42){
      // roof silhouette
      const rw = 30+r()*44, rh = 15+r()*12;
      pTri(g,x,base-rh, x-rw/2,base, x+rw/2,base, '#7a5a4e');
      pR(g,x-rw/2,base,rw,26,'#6a6152');
      pR(g,x-rw/2,base-1,rw,2,'#8f6b59');
      if(r()<0.5){ pR(g,x+rw*0.12,base+7,7,6, rgba(PAL.lamp,0.5)); }
    } else {
      // palm silhouette
      const th = 34+r()*30;
      pTaper(g,x,base+18,x+(r()-0.5)*10,base-th,4,2,'#5b6b4a');
      for(let k=0;k<9;k++){ const a=(k/9)*TAU; pTaper(g,x,base-th,x+Math.cos(a)*16,base-th+Math.sin(a)*10+6,3,1,'#46704e'); }
    }
  }
  // the temple spire, unmistakable from anywhere in the village
  const tx = CHEDI_X*sc;
  for(let i=0;i<15;i++){ const rr=lerp(10,1.5,i/14); pR(g,tx-rr,150-i*6,rr*2,5, i%2?'#d9b876':'#a8845a'); }
  pEll(g,tx,146,17,7,'#d8b262'); pR(g,tx-20,152,40,40,'#8d7256');
  // low mist band
  for(let x=0;x<w;x+=3){ const a=0.05+0.04*Math.sin(x*0.01); g.fillStyle=`rgba(150,170,220,${a})`; g.fillRect(x,196+Math.sin(x*0.02)*3,3,7); }
}
function paintBg(){
  const g=bgG, w=bgCv.width, r=mulberry(777);
  const sc = bgCv.width/WORLD_W;
  const gy = x => groundY(x/sc)-4;
  // treeline behind the play line, zone-appropriate
  for(let i=0;i<150;i++){
    const wx = r()*WORLD_W, x = wx*sc, z=zoneAt(wx);
    const base = gy(x);
    let c2=null, a=0.65, s2=0.75;
    if(z.id==='charnel'){ c2=apick(ART.dead,i); a=0.55; s2=0.8; }
    else if(z.id==='grove'){ c2=apick(ART.banana,i); a=0.7; s2=0.78; }
    else if(z.id==='forest'||z.id==='deep'){ c2 = r()<0.5? apick(ART.bamboo,i) : apick(ART.tam,i); a=0.6; s2=0.7; }
    else if(z.id==='paddy'){ c2 = r()<0.62? apick(ART.palm,i) : apick(ART.banana,i); a=0.6; s2=0.62; }
    else if(r()<0.5){ c2=apick(ART.palm,i); a=0.68; s2=0.72; }
    if(c2){ g.globalAlpha=a;
      g.drawImage(c2, R(x-c2.width*s2/2), R(base-c2.height*s2), R(c2.width*s2), R(c2.height*s2));
      g.globalAlpha=1; }
  }
  // a wash of night over everything back here
  g.globalCompositeOperation='source-atop';
  g.fillStyle='rgba(126,158,186,0.20)'; g.fillRect(0,0,w,H);
  g.globalCompositeOperation='source-over';
}

/* ---------- the play layer: ground, road, props ---------- */
const PROPS = [];     // {img,x,y,w,h,depth} drawn from playCv, kept for reference
function stamp(img,x,y,sc2=1){
  playG.drawImage(img, R(x-img.width*sc2/2), R(y-img.height*sc2), R(img.width*sc2), R(img.height*sc2));
}
function paintPlay(){
  const g=playG, r=mulberry(20260830);
  g.clearRect(0,0,WORLD_W,H);
  // ---- earth ----
  for(let x=0;x<WORLD_W;x++){
    const gy = R(groundY(x));
    const z = zoneAt(x);
    let top = PAL.grass, mid2 = PAL.grassD, deep='#132318';
    if(z.id==='charnel'){ top='#4a5148'; mid2='#333a34'; deep='#1e231f'; }
    if(z.id==='paddy'){ top='#2b5140'; mid2='#1d3a2e'; deep='#122019'; }
    if(z.id==='wat'){ top='#4a6a4c'; mid2='#2e4a34'; deep='#16261a'; }
    if(z.id==='forest'){ top='#274a34'; mid2='#182f22'; deep='#0e1a13'; }
    if(z.id==='deep'){ top='#2b5238'; mid2='#1a3324'; deep='#0c1710'; }
    if(isRoad(x)){ top=PAL.dirt; mid2=PAL.dirtD; deep='#2a2118'; }
    g.fillStyle=top;   g.fillRect(x,gy,1,4);
    g.fillStyle=mid2;  g.fillRect(x,gy+4,1,10);
    g.fillStyle=deep;  g.fillRect(x,gy+14,1,H-gy-14);
    // the rim of light along the top edge
    if(x%3!==0){ g.fillStyle=shade(top,0.14); g.fillRect(x,gy,1,1); }
    /* Under the turf it used to be one flat colour all the way down, which at
       night reads as shadow and in daylight reads as a painted wall. Three
       bands of subsoil, dithered into each other, and it reads as ground. */
    const subA=shade(deep,0.13), subB=shade(deep,0.06), subC=shade(deep,-0.05);
    const d1=gy+14+4+Math.sin(x*0.031)*2, d2=gy+32+Math.sin(x*0.017+2)*4;
    g.fillStyle=subA; g.fillRect(x,gy+14,1,Math.max(0,d1-(gy+14)));
    g.fillStyle=subB; g.fillRect(x,d1,1,Math.max(0,d2-d1));
    g.fillStyle=subC; g.fillRect(x,d2,1,H-d2);
    if((x+((gy*3)|0))%5===0){ g.fillStyle=shade(deep,0.2); g.fillRect(x,R(d1)-1,1,1); }
    if((x*7)%13===0){ g.fillStyle=shade(deep,-0.14); g.fillRect(x,R(d2)+2+((x%3)|0),1,2); }
  }
  /* stones, roots and old pot-shards in the subsoil */
  for(let i=0;i<900;i++){
    const x=r()*WORLD_W, gy=groundY(x), y=gy+18+r()*(H-gy-24);
    const c = r()<0.62? '#3a3a40' : r()<0.8? '#4a3f32' : '#55483a';
    pEll(g,x,y,1+r()*3,1+r()*2,c);
    if(r()<0.22) pR(g,R(x),R(y)-1,1,1,shade(c,0.22));
  }
  for(let i=0;i<220;i++){
    const x=r()*WORLD_W, gy=groundY(x);
    let px=x, py=gy+13;
    for(let k=0;k<5+((r()*6)|0);k++){
      const nx=px+r()*7-3.5, ny=py+2+r()*4;
      pTaper(g,px,py,nx,ny,1.6-k*0.2,1.2-k*0.18,'#3d3226');
      px=nx; py=ny; if(py>H-2) break;
    }
  }
  // ---- road surface: ruts, gravel, a painted centre line long since faded ----
  for(let x=1380;x<3120;x++){
    const gy=R(groundY(x));
    if((x%37)<2) { g.fillStyle=PAL.dirtL; g.fillRect(x,gy+2,1,2); }
    for(let i=0;i<2;i++){ if(r()<0.5){ g.fillStyle = r()<0.5?shade(PAL.dirt,0.12):shade(PAL.dirt,-0.14); g.fillRect(x, gy+1+(r()*11|0), 1,1); } }
  }
  for(let x=1400;x<3100;x+=1){ const gy=R(groundY(x));
    if(Math.sin(x*0.03)>0.2){ g.fillStyle=shade(PAL.dirtD,-0.08); g.fillRect(x,gy+7,1,2); } }
  // ---- water in the paddies ----
  for(let x=790;x<1450;x++){
    const gy=R(groundY(x));
    const inPaddy = Math.sin(x*0.021)>-0.25;
    if(!inPaddy) continue;
    g.fillStyle=PAL.water; g.fillRect(x,gy+1,1,7);
    g.fillStyle=PAL.waterL; g.fillRect(x,gy+1+((x*7)%3),1,1);
    if((x%11)<1){ g.fillStyle='#6f8fb8'; g.fillRect(x,gy+2,1,1); }
  }
  for(let x=790;x<1450;x+=5){
    const gy=R(groundY(x));
    if(Math.sin(x*0.021)<=-0.25) continue;
    for(let i=0;i<3;i++){ const sx=x+r()*5, sy=gy+r()*6;
      g.fillStyle=r()<0.5?'#4c8a5c':'#3a7048'; g.fillRect(R(sx),R(sy)-4,1,5); }
  }
  // the pond by the road
  for(let x=POND_X-70;x<POND_X+70;x++){
    const t=(x-(POND_X-70))/140, d=Math.sin(t*Math.PI);
    const gy=R(groundY(x));
    g.fillStyle='#6f6046'; g.fillRect(x,gy,1,2);
    g.fillStyle=PAL.water; g.fillRect(x,gy+1,1,R(3+d*9));
    g.fillStyle=PAL.waterL; g.fillRect(x,gy+2+((x*5)%4),1,1);
  }
  // ---- grass tufts, stones, litter of a real place ----
  for(let i=0;i<3600;i++){
    const x=r()*WORLD_W, gy=groundY(x), z=zoneAt(x);
    if(isRoad(x) && r()<0.85) continue;
    const c1 = z.id==='charnel' ? '#5c6358' : (z.id==='forest'||z.id==='deep') ? '#356b46' : PAL.grassL;
    const h2=2+r()*4;
    g.fillStyle=c1; g.fillRect(R(x),R(gy-h2),1,h2+1);
    if(r()<0.4) g.fillRect(R(x+1),R(gy-h2*0.6),1,R(h2*0.6)+1);
    if(r()<0.3){ g.fillStyle=shade(c1,-0.2); g.fillRect(R(x-1),R(gy-h2*0.5),1,R(h2*0.5)+1); }
  }
  for(let i=0;i<420;i++){
    const x=r()*WORLD_W, gy=groundY(x);
    pEll(g,x,gy+1,1+r()*2,1,'#55606a'); g.fillStyle='#6d7a86'; g.fillRect(R(x),R(gy),1,1);
  }
  // wildflowers
  for(let i=0;i<180;i++){
    const x=r()*WORLD_W, gy=groundY(x);
    if(isRoad(x)) continue;
    for(let k=0;k<4;k++){ g.fillStyle=pick(['#ffce54','#ff8c9e','#e8dfc8','#c58aff']);
      g.fillRect(R(x+r()*7-3), R(gy-3-r()*5), 1,1); }
  }

  // ================= PROPS, west to east =================
  // --- charnel ground: dead trees, ruined chedi, bone-white stones ---
  for(let i=0;i<9;i++){
    const x = 40+i*82+r()*30;
    stamp(apick(ART.dead,i),x,groundY(x)+3, 0.7+r()*0.5);
  }
  {   // an old ruined chedi, half-swallowed
    const x=112, ch=ART.chedi;
    playG.save(); playG.globalAlpha=0.85;
    playG.drawImage(ch, R(x-ch.width*0.34), R(groundY(x)-ch.height*0.68), R(ch.width*0.68), R(ch.height*0.68));
    playG.restore();
    pR(g,x-40,groundY(x)-8,80,9,'#3f463c');
    for(let i=0;i<24;i++) pEll(g, x+r()*90-45, groundY(x)-r()*6, 2+r()*3, 1+r()*2, r()<0.5?'#6a7060':'#535a4e');
  }
  /* The markers are packed into the west end now. The road out of the
     graveyard, and the mound you come up out of at 250, both need clear
     ground, and the old spacing put a headstone through the noodle cart. */
  for(let i=0;i<11;i++){    // grave markers, and somebody still lights them
    const x=52+i*34+r()*9, gy=groundY(x);
    if(x>214 && x<296) continue;              // the mound stands here
    pR(g,x,gy-13,4,14,'#8d8f80'); pEll(g,x+2,gy-13,3,3,'#a4a695'); pR(g,x,gy-8,4,1,'#6f7164');
    pR(g,x-1,gy-14,6,1,'#b4b6a5');
    if(i%2===0){
      pR(g,x+7,gy-6,3,7,'#e8dfc8'); pR(g,x+7,gy-7,3,1,'#f6f0dc');
      addLight(x+8, gy-9, 26, PAL.lamp, 0.42, {flick:0.22});
      pEll(g,x+5,gy-1,7,2,'#5a5f52');
    }
    if(i%3===0){ pEll(g,x-6,gy-2,4,3,'#c0392f'); pEll(g,x-6,gy-3,3,2,'#e05a48'); }  // a red drink, left out
  }
  // --- the rice fields: dikes west of the farm, and one scarecrow on it ---
  stamp(ART.scare, 1180, groundY(1180)+2, 1);
  for(let x=770;x<800;x+=64){ const gy=groundY(x); pR(g,x,gy-3,54,4,'#6f6046'); pR(g,x,gy-3,54,1,'#8a7a5c'); }
  // the fallen tree across the road (a task for someone tall)
  {
    const x=FALLEN_TREE_X, gy=groundY(x);
    pTaper(g,x-52,gy-6,x+54,gy-16,15,11,'#4c3a2c');
    pTaper(g,x-52,gy-8,x+54,gy-18,5,4,'#5f4a37');
    for(const [dx,dy] of [[-30,-9],[6,-14],[38,-19]]) pTaper(g,x+dx,gy+dy,x+dx+14,gy+dy-16,4,2,'#413124');
    for(let i=0;i<26;i++) pEll(g,x+r()*90-46, gy-r()*26-4, 5+r()*5,4+r()*3,'#2e5d44');
  }
  // flowering trees first, so they stand behind the houses
  for(const [x,i] of [[1450,0],[2100,1],[2560,2],[3160,3],[3880,0],[4480,2],[5020,1]])
    stamp(ART.blossom[i], x, groundY(x)+4, 0.8+((x%5)/16));
  // --- village: houses, lamps, jars, fences, a sleeping dog ---
  HOUSE_XS.forEach((x,i)=>{
    const img=ART.house[i%ART.house.length];
    stamp(img, x, groundY(x)+4, 1);
    addLight(x+ (i%2?26:-22), groundY(x)-img.height*0.58, 44, PAL.lamp, 0.5);
  });
  LAMP_XS.forEach((x,i)=>{
    const img=i===BROKEN_LAMP? ART.lampBroken : ART.lamp;
    stamp(img, x, groundY(x)+2, 1);
    const l = addLight(x+9, groundY(x)-img.height+29, 62, PAL.lamp, 0.62, {id:'lamp'+i, flick:i===BROKEN_LAMP?1:0.04});
    if(i===BROKEN_LAMP){ l.on=false; l.broken=true; }
  });
  for(const x of [1860,2210,2430,2880,3040]) stamp(ART.jar, x, groundY(x)+2, 1);
  for(const x of [1980,2044,2108,2900,2964]) stamp(ART.fence, x, groundY(x)+2, 1);
  stamp(ART.dog, 2280, groundY(2280)+2, 1);
  stamp(ART.cart, CART_X, groundY(CART_X)+2, 1);
  addLight(CART_X+34, groundY(CART_X)-64, 52, PAL.lamp, 0.7);
  addLight(CART_X-18, groundY(CART_X)-46, 30, PAL.ember, 0.35);
  // the spirit house
  {
    const img=ART.shrine;
    stamp(img, SHRINE_X, groundY(SHRINE_X)+2, 1);
    addLight(SHRINE_X, groundY(SHRINE_X)-72, 52, PAL.gold, 0.62);
  }
  // the big tamarind — a cat lives up there tonight
  stamp(ART.tam[0], TAMARIND_X, groundY(TAMARIND_X)+4, 1);
  // palms along the road
  [1450,1720,2020,2320,2620,2960,3080].forEach((x,i)=> stamp(apick(ART.palm,i), x+40, groundY(x)+3, 0.8+((x%7)/20)));
  // --- banana grove ---
  for(let i=0;i<34;i++){
    const x=3010+r()*780;
    if(Math.abs(x-TANI_X)<44) continue;
    stamp(apick(ART.banana,i), x, groundY(x)+3, 0.85+r()*0.4);
  }
  // --- the wat ---
  {
    const ch=ART.chedi; stamp(ch, CHEDI_X, groundY(CHEDI_X)+2, 1);
    addLight(CHEDI_X, groundY(CHEDI_X)-120, 84, PAL.gold, 0.5);
    const sa=ART.sala; stamp(sa, SALA_X, groundY(SALA_X)+2, 1);
    addLight(SALA_X, groundY(SALA_X)-60, 58, PAL.lamp, 0.6);
    // naga balustrade stairs up to the terrace
    const nx=3900, gy=groundY(nx);
    for(let i=0;i<10;i++) pR(g,nx+i*7, gy-i*1.6, 8, 4+i*1.6, i%2?'#d8cfb4':'#c2b998');
    pTaper(g,nx-4,gy-2,nx+74,gy-20,7,5,'#3f7a5a');
    for(let i=0;i<12;i++) pEll(g,nx+i*6.4, gy-3-i*1.5, 4,3, i%2?'#4f9268':'#2e5d44');
    pEll(g,nx-6,gy-2,7,6,'#4f9268'); pR(g,nx-9,gy-6,4,3,PAL.gold);
    // candle rail
    for(let i=0;i<7;i++){ const cx2=4000+i*40, cy=groundY(cx2);
      pR(g,cx2,cy-14,3,14,'#b8a894'); pR(g,cx2,cy-16,3,3,'#f6e2a0'); }
  }
  /* the farm's own lights. They stay off until somebody rents the place,
     which is most of what makes a derelict farm look derelict. */
  for(const [lx,dy,r,a,id] of [[FARMHOUSE_X+10,-58,46,0.58,'farmHouse'],
                               [PEN_X+24,-30,36,0.46,'farmPen'],
                               [BED_XS[2],-44,62,0.52,'farmBeds'],
                               [PADDY_XS[0]+40,-34,50,0.42,'farmPaddy'],
                               [TREE_XS[1],-56,46,0.40,'farmOrchard']]){
    const l=addLight(lx, groundY(lx)+dy, r, PAL.lamp, a, {id, flick:0.05}); l.on=false;
  }
  // Lung Somchai's outdoor kitchen, beside the cart
  { const k=ART.kitchen; stamp(k, KITCHEN_X, groundY(KITCHEN_X)+2, 1);
    addLight(KITCHEN_X-24, groundY(KITCHEN_X)-26, 46, PAL.ember, 0.55, {id:'kitchen', flick:0.12});
